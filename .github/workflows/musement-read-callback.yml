name: Musement Interaction Callback

on:
  issues:
    types: [opened]

jobs:
  record-interaction:
    if: startsWith(github.event.issue.title, 'Musement Read:') || startsWith(github.event.issue.title, 'Musement Skip:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record Exposure in exposures.json
        id: record
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const title = context.payload.issue.title;
            const match = title.match(/Musement (Read|Skip):\s*([a-zA-Z0-9_-]+)/i);
            if (!match) {
              core.setFailed('Invalid Musement issue title format');
              return;
            }
            const action = match[1].toLowerCase();
            const fingerprint = match[2].trim();
            const now = new Date().toISOString();
            const body = context.payload.issue.body || '';

            let category = undefined;
            if (action === 'skip') {
              const catMatch = body.match(/Category:\s*([a-zA-Z0-9_-]+)/i);
              if (catMatch) {
                category = catMatch[1].trim();
              } else {
                const checkedMatch = body.match(/- \[[xX]\]\s*([a-zA-Z0-9_-]+)/);
                category = checkedMatch ? checkedMatch[1].trim() : 'not_interested_in_topic';
              }
            }

            let reason = undefined;
            const notesMatch = body.match(/(?:### Notes \/ Reason \(Optional\)|### Notes|### Reason|Notes:)\s*\n*([\s\S]*?)(?:\n###|\n---|$)/i);
            if (notesMatch) {
              const cleaned = notesMatch[1].trim();
              if (cleaned && !cleaned.startsWith('<') && !cleaned.includes('optional explanation')) {
                reason = cleaned;
              }
            }

            const dir = path.join(process.env.GITHUB_WORKSPACE, 'musement');
            if (!fs.existsSync(dir)) {
              fs.mkdirSync(dir, { recursive: true });
            }
            const exposuresPath = path.join(dir, 'exposures.json');
            
            let exposures = [];
            if (fs.existsSync(exposuresPath)) {
              try {
                const data = JSON.parse(fs.readFileSync(exposuresPath, 'utf8'));
                if (Array.isArray(data)) exposures = data;
              } catch (e) {
                console.error('Failed to parse existing exposures.json', e);
              }
            }

            const existingIdx = exposures.findIndex(e => e.fingerprint === fingerprint);
            const record = {
              fingerprint,
              action,
              exposed_at: now
            };
            if (category) record.category = category;
            if (reason) record.reason = reason;

            if (existingIdx >= 0) {
              record.exposed_at = exposures[existingIdx].exposed_at || now;
              record.updated_at = now;
              exposures[existingIdx] = record;
            } else {
              exposures.push(record);
            }

            fs.writeFileSync(exposuresPath, JSON.stringify(exposures, null, 2) + '\n', 'utf8');
            core.setOutput('updated', 'true');
            core.setOutput('action', action);
            core.setOutput('category', category || '');
            core.setOutput('fingerprint', fingerprint);

      - name: Commit and Push Exposure
        if: steps.record.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musement/exposures.json
          git commit -m "chore(musement): record ${{ steps.record.outputs.action }} exposure ${{ steps.record.outputs.fingerprint }}"
          git push

      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            const action = '${{ steps.record.outputs.action }}';
            const fingerprint = '${{ steps.record.outputs.fingerprint }}';
            const category = '${{ steps.record.outputs.category }}';
            const commentBody = action === 'skip'
              ? `⏭️ Marked material with fingerprint \`${fingerprint}\` as skipped in Musement (Category: \`${category}\`).`
              : `✅ Marked material with fingerprint \`${fingerprint}\` as read in Musement.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
