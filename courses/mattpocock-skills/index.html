0px) {\n      .trace { grid-template-columns: 1fr 1fr; }\n      .trace-step::after { display: none; }\n      .map-flow-line { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n      .map-flow-line .skill-node::after { display: none; }\n      .map-grid.standalone { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n      .matrix { grid-template-columns: 8rem repeat(3, minmax(11rem, 1fr)); overflow-x: auto; }\n      .matrix-wrap { overflow-x: auto; }\n    }\n\n    @media (max-width: 650px) {\n      main { padding-top: 3rem; }\n      .opening, .choice-grid, .map-intro, .map-lanes { grid-template-columns: 1fr; }\n      .trace { grid-template-columns: 1fr; }\n      .map-route-controls { justify-content: flex-start; }\n      .router-node, .map-flow-line, .map-grid, .map-grid.two, .map-grid.standalone { grid-template-columns: 1fr; }\n      .map-detour { grid-template-columns: 1fr; }\n      .map-detour > span { display: none; }\n      .case-heading { grid-template-columns: 1fr; }\n      .manuscript-layout { grid-template-columns: 1fr; }\n      .margin-rail {\n        display: grid;\n        gap: 0.7rem;\n        padding-left: 0;\n        border-left: 0;\n      }\n      .margin-comment { position: static; }\n      .margin-comment::before { display: none; }\n      .quiz-actions, .ledger-footer { align-items: flex-start; flex-direction: column; }\n      .case-actions { grid-template-columns: 1fr; gap: 0.9rem; min-height: 0; padding: 1.3rem; }\n      .case-actions .case-status, .case-nav-next { justify-self: start; }\n      .ledger-item { grid-template-columns: 1fr; }\n      .ledger-choices { justify-content: flex-start; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Session 3 · Case-study studio\u003c/p>\n      \u003ch1 id=\"session-title\">Watch the design work\u003c/h1>\n      \u003cp class=\"lede\">The first session gave you analytical axes. The second gave you a design loop. Now orient in the full portfolio before three real skills make those ideas visible—or expose where the theory does not quite explain the file.\u003c/p>\n      \u003cp class=\"meta\">65 minutes · one system map · three case files · one transfer lab · progress saved locally\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"carry-forward\">Carry forward\u003c/h2>\n          \u003cp>Do not ask whether a skill “looks good.” Trace what failure it prevents, who invokes it, where its knowledge lives, how it constrains behavior, and what would count as evidence.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"session-artifact\">Your artifact\u003c/h2>\n          \u003cp>You will leave with a working map of all 25 skills, three completed traces, and a revised borrowing ledger grounded in concrete files rather than abstract preference.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–15 minutes\u003c/span>\n      \u003ch2 id=\"reading-protocol\">1. See the system, then trace the cases\u003c/h2>\n      \u003cp>Surface formats mislead. A long file can be a tight discipline; a short file can hide a large dependency graph. Run the same five questions in the same order so the differences become comparable.\u003c/p>\n\n      \u003cdiv class=\"protocol-card\">\n        \u003cspan class=\"label\">The five-part trace\u003c/span>\n        \u003cdiv class=\"trace\">\n          \u003cdiv class=\"trace-step\">\u003cstrong>1 · Failure\u003c/strong>\u003cspan>What recurring mistake gives this skill a reason to exist?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>2 · Interface\u003c/strong>\u003cspan>What shape is it, and who owns invocation?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>3 · Placement\u003c/strong>\u003cspan>What is inline, disclosed, or recovered from the environment?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>4 · Control\u003c/strong>\u003cspan>What gate, loop, or separation changes the model’s default?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>5 · Evidence\u003c/strong>\u003cspan>What observation could show that the control worked?\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">How Sessions 1 and 2 meet\u003c/span>\n        \u003cp>Session 1 explains the \u003cem>interface\u003c/em>: shape, invocation, composition, and evidence labels. Session 2 explains the \u003cem>mechanism\u003c/em>: problem, pointer, information layer, control loop, and test. A case study is the full trace from one to the other.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"system-overview\" id=\"skill-system-overview\">\n        \u003cdiv class=\"map-intro\">\n          \u003cdiv>\n            \u003cspan class=\"label\">Bird’s-eye view · 25 skills\u003c/span>\n            \u003ch3 id=\"skill-system-map\">The portfolio is a flow with support underneath\u003c/h3>\n            \u003cp>\u003ccode>ask-matt\u003c/code> is the human-chosen \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"A router chooses the next workflow or skill; it does not perform the downstream work itself.\">router\u003c/span>. Its most useful claim is structural: one main route carries ideas toward shipped code, several \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"An on-ramp starts from a different situation, then joins an existing workflow at the appropriate step.\">on-ramps\u003c/span> join that route, and vocabulary plus standalone tools support work without becoming extra stages.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"map-route-controls\" role=\"group\" aria-label=\"Highlight a route through the skill system\">\n            \u003cbutton type=\"button\" data-map-route=\"all\" aria-pressed=\"true\">Whole system\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"idea\" aria-pressed=\"false\">I have an idea\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"incoming\" aria-pressed=\"false\">Issues arrived\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"bug\" aria-pressed=\"false\">Something broke\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"fog\" aria-pressed=\"false\">The effort is foggy\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cp class=\"map-route-note\" id=\"map-route-note\" aria-live=\"polite\">The whole portfolio is visible. Each card states the skill’s goal; choose a starting situation to reveal one route through the system.\u003c/p>\n\n        \u003cdiv class=\"skill-system-map\" id=\"skill-system-map-diagram\" aria-label=\"Map of every skill in the Matt Pocock skills repository\">\n          \u003cdiv class=\"skill-node router-node\" data-skill-map-node data-routes=\"idea incoming bug fog\">\n            \u003ccode>/ask-matt\u003c/code>\n            \u003cspan>Orient the human: choose a fitting flow or skill, then hand control away.\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"skill-node map-precondition\" data-skill-map-node data-routes=\"idea incoming bug fog\">\n            \u003cdiv>\n              \u003ccode>/setup-matt-pocock-skills\u003c/code>\n              \u003cspan>Configure the issue tracker, triage labels, and documentation layout the engineering flows assume.\u003c/span>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>Main flow · idea → ship\u003c/h4>\n              \u003cspan>the route most feature work travels\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-flow-line\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/grill-with-docs\u003c/code>\n                \u003cspan>Sharpen an idea by interview while preserving shared terms and decisions in the repo.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea fog\">\n                \u003ccode>/to-spec\u003c/code>\n                \u003cspan>Collapse the conversation or decision map into a buildable specification.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea fog\">\n                \u003ccode>/to-tickets\u003c/code>\n                \u003cspan>Split a plan into tracer-bullet tickets with explicit blocking edges.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"implementation-stack\">\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/implement\u003c/code>\n                  \u003cspan>Build one issue from agreed seams through review and commit.\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/tdd\u003c/code>\n                  \u003cspan>Drive one vertical red–green slice at a time.\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/code-review\u003c/code>\n                  \u003cspan>Judge Standards and Spec independently.\u003c/span>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"map-detour\">\n              \u003cspan>runnable question?\u003c/span>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/handoff\u003c/code>\n                \u003cspan>Carry essential context across a new directory, harness, session, or collaborator.\u003c/span>\n              \u003c/div>\n              \u003cspan>→\u003c/span>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/prototype\u003c/code>\n                \u003cspan>Answer one design question with a small throwaway program, then return the finding.\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>On-ramps\u003c/h4>\n              \u003cspan>different starts, deliberate merge points\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-grid\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"incoming\">\n                \u003ccode>/triage\u003c/code>\n                \u003cspan>Turn raw incoming bugs and requests into agent-ready issues.\u003c/span>\n                \u003csmall class=\"map-destination\">joins at /implement →\u003c/small>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"bug\">\n                \u003ccode>/diagnosing-bugs\u003c/code>\n                \u003cspan>Build a red-capable feedback loop before theorizing, then fix with a regression test.\u003c/span>\n                \u003csmall class=\"map-destination\">fixes, then may feed upkeep →\u003c/small>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"fog\">\n                \u003ccode>/wayfinder\u003c/code>\n                \u003cspan>Resolve decision tickets until a huge, foggy effort has a shared map.\u003c/span>\n                \u003csmall class=\"map-destination\">joins at /to-spec →\u003c/small>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-lanes\">\n            \u003cdiv class=\"map-zone\">\n              \u003cdiv class=\"map-zone-heading\">\n                \u003ch4>Codebase health\u003c/h4>\n                \u003cspan>upkeep generates better ideas\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"bug\">\n                \u003ccode>/improve-codebase-architecture\u003c/code>\n                \u003cspan>Survey for deepening opportunities, then feed a chosen improvement into \u003ccode>/grill-with-docs\u003c/code>.\u003c/span>\n              \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"map-zone\">\n              \u003cdiv class=\"map-zone-heading\">\n                \u003ch4>\u003cspan class=\"term\" tabindex=\"0\" data-tip=\"A vocabulary layer supplies shared concepts to several workflows; it can also be invoked directly when terminology or module shape is the problem.\">Vocabulary underneath\u003c/span>\u003c/h4>\n                \u003cspan>shared words, not extra stages\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"map-grid two\">\n                \u003cdiv class=\"skill-node\" data-skill-map-node>\n                  \u003ccode>/domain-modeling\u003c/code>\n                  \u003cspan>Sharpen domain terms, scenarios, glossaries, and hard-to-reverse decisions.\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node>\n                  \u003ccode>/codebase-design\u003c/code>\n                  \u003cspan>Shape deep modules with small interfaces, clean seams, and local reasoning.\u003c/span>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>Standalone and supporting tools\u003c/h4>\n              \u003cspan>use when the situation—not the pipeline—calls for them\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-grid standalone\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/grill-me\u003c/code>\u003cspan>Run the same relentless interview without saving state to a working directory.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/grilling\u003c/code>\u003cspan>Supply the reusable interview primitive: rounds, frontier, facts, and human decisions.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/resolving-merge-conflicts\u003c/code>\u003cspan>Resolve an active merge or rebase conflict by intent and finish the operation.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/research\u003c/code>\u003cspan>Investigate primary sources in the background and leave a cited Markdown finding.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/to-questionnaire\u003c/code>\u003cspan>Turn a knowledge gap into questions for the person who can answer it.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/wizard\u003c/code>\u003cspan>Guide a human through credentials, dashboards, provisioning, or other human-only steps.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/wait-what\u003c/code>\u003cspan>Re-pitch an explanation that failed to land, using the missing context and shared vocabulary.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/teach\u003c/code>\u003cspan>Teach a concept across multiple stateful sessions in the current directory.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/writing-for-agents\u003c/code>\u003cspan>Guide writing for skills, agent instructions, and documents reached by pointers.\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cp class=\"map-source\">\u003cstrong>One operating rule crosses the map:\u003c/strong> at a phase boundary, choose deliberately among continuing, clearing, handing off, delegating to a subagent, or compacting. Diagram reconstructed from the current \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>ask-matt/SKILL.md\u003c/code>\u003c/a> and the repository’s engineering/productivity indexes, checked August 11, 2026.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">15–45 minutes\u003c/span>\n      \u003ch2 id=\"case-files\">2. Three skills, three control strategies\u003c/h2>\n      \u003cp>Move freely between the cases. Each case links to its original \u003ccode>SKILL.md\u003c/code>; your current case and lens are restored when you return.\u003c/p>\n\n      \u003cdiv class=\"case-workbench\" id=\"case-workbench\">\n        \u003cdiv class=\"case-tabs\" role=\"tablist\" aria-label=\"Case studies\">\n          \u003cbutton class=\"case-tab\" id=\"case-tab-0\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-0\" data-case-index=\"0\">\u003cspan>Case 01 · Router\u003c/span>\u003cstrong>ask-matt\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-1\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-1\" data-case-index=\"1\">\u003cspan>Case 02 · Discipline\u003c/span>\u003cstrong>diagnosing-bugs\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-2\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-2\" data-case-index=\"2\">\u003cspan>Case 03 · Review\u003c/span>\u003cstrong>code-review\u003c/strong>\u003c/button>\n        \u003c/div>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-0\" role=\"tabpanel\" aria-labelledby=\"case-tab-0\" data-case-panel=\"0\">\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">01\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Human-invoked · router · map of flows\u003c/p>\n              \u003ch3 id=\"ask-matt-case\">\u003ccode>ask-matt\u003c/code>: useful because it does not do the work\u003c/h3>\n              \u003cp>Its interface is orientation. It turns “which skill, in what order?” into a named routing decision, then hands control away.\u003c/p>\n              \u003ca class=\"source-link\" href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">Read the original \u003ccode>SKILL.md\u003c/code> ↗\u003c/a>\n\n          \u003cp class=\"source-disclosure\">The left column is the complete, unmodified \u003ccode>SKILL.md\u003c/code>. Read it continuously; the numbered margin comments point to important design decisions without replacing the source.\u003c/p>\n\n          \u003cdiv class=\"manuscript-layout\" aria-label=\"Complete ask-matt source with teacher comments\">\n            \u003cpre class=\"skill-manuscript\" aria-label=\"Complete original ask-matt SKILL.md\">\u003ccode>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-1\" data-line=\"1\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-2\" data-line=\"2\">name: ask-matt\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-3\" data-line=\"3\">description: Ask which skill or flow fits your situation. A router over the skills in this repo.\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-4\" data-line=\"4\">disable-model-invocation: true\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-5\" data-line=\"5\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-6\" data-line=\"6\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-7\" data-line=\"7\"># Ask Matt\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-8\" data-line=\"8\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-9\" data-line=\"9\">You don't remember every skill, so ask.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-10\" data-line=\"10\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-11\" data-line=\"11\">A **flow** is a path through the skills. Most paths run along one **main flow**, and two **on-ramps** merge onto it. Everything else is standalone, or a vocabulary layer that runs underneath.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-12\" data-line=\"12\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-13\" data-line=\"13\">## The main flow: idea → ship\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-14\" data-line=\"14\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-15\" data-line=\"15\">The route most work travels. You have an idea and want it built.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-16\" data-line=\"16\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-17\" data-line=\"17\">1. **`/grill-with-docs`** — sharpen the idea by interview. Start here whenever you are **working in a working directory**: it's stateful, retaining what it learns in `CONTEXT.md` and ADRs. (No working directory? Use `/grill-me` — see Standalone. Both run the same `/grilling` primitive; `grill-with-docs` is the one that leaves a paper trail, which makes it the better of the two whenever a repo is there to leave it in.)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-18\" data-line=\"18\">2. **Branch — can you settle every question in conversation?** If a question needs a runnable answer (state, business logic, a UI you have to see), detour through a prototype, bridged by **`/handoff`** in both directions (a prototype lives in its own directory, which is exactly what `/handoff` is for — see Phase boundaries):\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-19\" data-line=\"19\">   - **`/handoff`** out, then open a fresh session against that file,\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-20\" data-line=\"20\">   - **`/prototype`** to answer the question with throwaway code,\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-21\" data-line=\"21\">   - **`/handoff`** back what you learned, and reference it from the original idea thread.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-22\" data-line=\"22\">3. **Branch — is this a multi-session build?**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-23\" data-line=\"23\">   - **Yes** → **`/to-spec`** (turn the thread into a spec), then **`/to-tickets`** to split it into tracer-bullet tickets, each declaring its **blocking edges**. On a local tracker that's one file per ticket under `.scratch/&lt;feature&gt;/issues/`, worked blockers-first by hand; on a real tracker the edges become native blocking links, so any ticket whose blockers are done can be grabbed — kick off **`/implement`** per ticket, **`/clear`ing context between each one**. Each ticket is self-contained, so the last one's context is disposable.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-24\" data-line=\"24\">   - **No** → **`/implement`** right here, in the same context window.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-25\" data-line=\"25\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-26\" data-line=\"26\">   Either way, **`/implement`** builds each issue by driving **`/tdd`** internally — one red-green slice at a time — then closes out by running **`/code-review`**, a two-axis review (Standards + Spec) of the diff, before committing. Reach for **`/tdd`** on its own when you just want to build a concrete behaviour test-first without a full spec, and **`/code-review`** on its own whenever you want to review a branch or PR against a fixed point.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-27\" data-line=\"27\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-28\" data-line=\"28\">### Context hygiene\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-29\" data-line=\"29\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-30\" data-line=\"30\">Keep steps 1–3 in **one unbroken context window** — don't compact or clear until after `/to-tickets` — so the grilling, spec, and tickets all build on the same thinking. Each `/implement` then starts fresh, working from the ticket.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-31\" data-line=\"31\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-32\" data-line=\"32\">The limit on this is the **[smart zone](https://www.aihero.dev/ai-coding-dictionary/smart-zone)**: the window (~150k tokens on state-of-the-art models) within which the model still reasons sharply. If a session approaches it before `/to-tickets`, don't push on degraded — `/compact` at the nearest phase boundary and carry on (see Phase boundaries).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-33\" data-line=\"33\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-34\" data-line=\"34\">## On-ramps\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-35\" data-line=\"35\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-36\" data-line=\"36\">A starting situation that generates work, then merges onto the main flow.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-37\" data-line=\"37\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-38\" data-line=\"38\">- **Bugs and requests piling up** → **`/triage`**. It moves issues through triage roles and produces agent-ready issues, which **`/implement`** later picks up.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-39\" data-line=\"39\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-40\" data-line=\"40\">  Triage is only for issues **you didn't create** — bug reports, incoming feature requests, anything that arrives raw. Tickets that `/to-tickets` produced are already agent-ready, so **don't triage them**.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-41\" data-line=\"41\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-42\" data-line=\"42\">- **Something's broken** → **`/diagnosing-bugs`**. For the hard ones: the bug that resists a first glance, the intermittent flake, the regression that crept in between two known-good states. It refuses to theorise until it has a **tight feedback loop** — one command that already goes red on *this* bug — then fixes with a regression test. Its post-mortem hands off to **`/improve-codebase-architecture`** when the real finding is that there's no good seam to lock the bug down.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-43\" data-line=\"43\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-44\" data-line=\"44\">- **A huge, foggy effort — a greenfield project or a huge feature build, too big for one session** → **`/wayfinder`**, the most cognitively demanding flow here. When the way from here to the destination isn't visible yet, it charts a **shared map** of **decision tickets** on the issue tracker and resolves them one at a time — producing **decisions, not deliverables** — until the fog is pushed back and the way is clear. Where **`/grill-with-docs`** sharpens an idea you can hold in one session, wayfinder is for the idea you can't — and it's slower and denser, so save it for exactly that, never a well-scoped feature.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-45\" data-line=\"45\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-46\" data-line=\"46\">  When the map clears, **it hands off, it doesn't build**: merge onto the main flow at **`/to-spec`**, which collapses the map's linked decisions into a buildable plan, then `/to-tickets` and `/implement` as usual. Looping the map straight into `/implement` skips that collapse and throws the linked detail away — go straight to `/implement` only when the effort turned out genuinely small.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-47\" data-line=\"47\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-48\" data-line=\"48\">## Codebase health\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-49\" data-line=\"49\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-50\" data-line=\"50\">Not feature work — upkeep.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-51\" data-line=\"51\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-52\" data-line=\"52\">- **`/improve-codebase-architecture`** — run whenever you have a spare moment to keep the codebase good for agents to operate in. It surfaces **deepening opportunities**; picking one _generates an idea_ you can take into the main flow at `/grill-with-docs`. It's the survey that finds the candidates; **`/codebase-design`** (below) is the bench you design the chosen one on.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-53\" data-line=\"53\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-54\" data-line=\"54\">## Vocabulary underneath\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-55\" data-line=\"55\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-56\" data-line=\"56\">Two model-invoked references that run *beneath* the other skills — each the single source of truth for its vocabulary. Reach for them directly when the **words**, not the process, are the problem; or let the skills above pull them in.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-57\" data-line=\"57\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-58\" data-line=\"58\">- **`/domain-modeling`** — sharpen the project's *domain* language: challenge a fuzzy term, resolve an overloaded word (\"account\" doing three jobs), record a hard-to-reverse decision as an ADR. It's the active discipline `/grill-with-docs` drives to keep `CONTEXT.md` a clean glossary.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-59\" data-line=\"59\">- **`/codebase-design`** — the deep-module vocabulary (module, interface, depth, seam, adapter, leverage, locality) for designing a module's *shape*: a lot of behaviour behind a small interface at a clean seam. `/tdd` and `/improve-codebase-architecture` both speak it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-60\" data-line=\"60\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-61\" data-line=\"61\">## Phase boundaries\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-62\" data-line=\"62\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-63\" data-line=\"63\">A **phase** is a chunk of work inside a session — the grilling, the implementation, the QA. At the **boundary** between two of them you have five options, and picking between them is the fuzziest decision in this whole map:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-64\" data-line=\"64\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-65\" data-line=\"65\">- **Continue** — stay put. Costs nothing, loses nothing.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-66\" data-line=\"66\">- **`/clear`** — empty the window, when nothing here matters to what's next.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-67\" data-line=\"67\">- **`/handoff`** — write a portable markdown file. Narrow: only for a **new harness**, a **new directory**, a **colleague**, or forking a side task **mid-phase**. What it buys is portability.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-68\" data-line=\"68\">- **Subagent** — send a tightly-scoped task to its own window and get a report back.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-69\" data-line=\"69\">- **`/compact`** — compress this context and seed a fresh session with it. The **default**, at the bottom of the tree rather than the first reach.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-70\" data-line=\"70\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-71\" data-line=\"71\">Read [PHASE-BOUNDARIES.md](PHASE-BOUNDARIES.md) for the ordered tree — the five questions, the reasoning behind each branch, and why the primary-source cost makes **Continue** the one to rule out first. Make the decision **at** a boundary; mid-phase, continue or split the rest into subagents.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-72\" data-line=\"72\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-73\" data-line=\"73\">## Standalone\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-74\" data-line=\"74\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-75\" data-line=\"75\">Off the main flow entirely.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-76\" data-line=\"76\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-77\" data-line=\"77\">- **`/grill-me`** — the same relentless interview as `/grill-with-docs`, but **stateless**: it saves nothing locally and builds no `CONTEXT.md`. Reach for it when you are **not working in a working directory** — sharpening a plan, a design, a piece of writing, anything with no repo under it. If you are in a working directory, use `/grill-with-docs` instead: it runs the same interview and leaves a paper trail, so it is strictly the better one.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-78\" data-line=\"78\">- **`/grilling`** — the interview primitive itself: rounds, the frontier, facts are the agent's job and decisions are yours. `/grill-me` and `/grill-with-docs` are the two named ways in, and `/triage`, `/wayfinder` and `/improve-codebase-architecture` all run it internally. Reach for it directly only when you want the interview with no wrapper around it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-79\" data-line=\"79\">- **`/resolving-merge-conflicts`** — work an in-progress merge or rebase conflict hunk by hunk, resolving by **intent** traced to each side's primary source rather than by picking lines, then finish the operation. It never runs `--abort`. Standalone and off every flow: reach for it when you are already mid-conflict.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-80\" data-line=\"80\">- **`/prototype`** — a small, throwaway program that answers one design question: does this state model feel right, or what should this UI look like. Throwaway is a constraint on how the code is written, not a promise to destroy it: the answer folds into the real code, and the prototype itself is kept as a **primary source** on a `prototype/&lt;name&gt;` branch out of main, pointed at from the implementation issue. It's the detour in step 2 of the main flow, but reach for it any time a design question is hard to settle on paper.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-81\" data-line=\"81\">- **`/research`** — delegate reading legwork to a **background agent**: it investigates a question against **primary sources**, then leaves a cited Markdown file in the repo. Keep working while it reads. The file it produces is something to take *into* the main flow at `/grill-with-docs` — research feeds the thinking, it doesn't replace it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-82\" data-line=\"82\">- **`/to-questionnaire`** — when the thing blocking you isn't in your head or the codebase but in **someone else's**, this writes them a questionnaire to fill in. It's the inverse of `/grill-me`: instead of interviewing you about the subject, it interviews you about the **send** — who it's going to, what you need back — and aims the questions at the gap. What comes back is material for `/grill-with-docs` or `/to-spec`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-83\" data-line=\"83\">- **`/wizard`** — for the steps only a **human** can take: provisioning infrastructure, setting up credentials or CI secrets, clicking through an unfamiliar third-party dashboard, running a one-off migration or cutover. It generates an interactive bash script that opens each URL, captures each value, and writes it into `.env` and GitHub secrets — so the procedure stops being something you re-explain to an agent every time. Model-invoked, so the agent reaches for it the moment it hits a wall only you can pass. If the agent could just do it itself, it should; this is for where a human is genuinely in the loop.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-84\" data-line=\"84\">- **`/wait-what`** — the corrective for a message that didn't land. Use it mid-conversation, inside any other skill, and the agent re-pitches what it just said with the context you were missing, in plain English, using the `CONTEXT.md` vocabulary. It works after the fact; `/grill-with-docs` is the upfront cure, because a shared language agreed early is what stops the jargon arriving at all.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-85\" data-line=\"85\">- **`/teach`** — learn a concept over multiple sessions, using the current directory as a stateful workspace.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-86\" data-line=\"86\">- **`/writing-for-agents`** — reference for writing documents agents consume: skills, AGENTS.md, pointed-at docs.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-87\" data-line=\"87\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-88\" data-line=\"88\">## Precondition\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-89\" data-line=\"89\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-90\" data-line=\"90\">**`/setup-matt-pocock-skills`** — run before your first engineering flow to configure the issue tracker, triage labels, and doc layout the other skills assume. Custom issue trackers also work.\u003c/span>\n            \u003c/code>\u003c/pre>\n            \u003caside class=\"margin-rail\" aria-label=\"Teacher comments on ask-matt\">\n            \u003cdiv class=\"margin-comment\" style=\"--line: 4\" aria-labelledby=\"ask-matt-source-line-4\">\n              \u003cspan class=\"margin-marker\">01\u003c/span>\u003cstrong>Invocation ownership\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-4\">Line 4\u003c/a> · The metadata makes this a menu you choose yourself. The agent cannot silently route through it.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 13\" aria-labelledby=\"ask-matt-source-line-13\">\n              \u003cspan class=\"margin-marker\">02\u003c/span>\u003cstrong>The main route\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-13\">Line 13\u003c/a> · This heading begins the default path from an idea to implementation. The numbered branches below are the router’s central work.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 28\" aria-labelledby=\"ask-matt-source-line-28\">\n              \u003cspan class=\"margin-marker\">03\u003c/span>\u003cstrong>Protect connected context\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-28\">Line 28\u003c/a> · Interview, spec, and tickets stay together; each implementation ticket starts fresh. Context boundaries are part of the workflow.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 34\" aria-labelledby=\"ask-matt-source-line-34\">\n              \u003cspan class=\"margin-marker\">04\u003c/span>\u003cstrong>Three different entrances\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-34\">Line 34\u003c/a> · Raw incoming work, a stubborn bug, and a huge foggy effort join the main route in different places.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 54\" aria-labelledby=\"ask-matt-source-line-54\">\n              \u003cspan class=\"margin-marker\">05\u003c/span>\u003cstrong>Shared vocabulary\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-54\">Line 54\u003c/a> · These two skills supply common words to other workflows. They are reference layers, not extra ceremonies.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 61\" aria-labelledby=\"ask-matt-source-line-61\">\n              \u003cspan class=\"margin-marker\">06\u003c/span>\u003cstrong>Progressive disclosure\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-61\">Line 61\u003c/a> · The five phase-boundary choices stay visible here; the detailed decision tree lives in a separate referenced file.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 73\" aria-labelledby=\"ask-matt-source-line-73\">\n              \u003cspan class=\"margin-marker\">07\u003c/span>\u003cstrong>Outside the pipeline\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-73\">Line 73\u003c/a> · The standalone list prevents the idea-to-ship path from pretending that every useful skill belongs inside it.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 88\" aria-labelledby=\"ask-matt-source-line-88\">\n              \u003cspan class=\"margin-marker\">08\u003c/span>\u003cstrong>Explicit precondition\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-88\">Line 88\u003c/a> · The other engineering skills assume shared tracker and documentation conventions, so setup is part of the interface.\u003c/p>\n            \u003c/div>\n            \u003c/aside>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-1\" role=\"tabpanel\" aria-labelledby=\"case-tab-1\" data-case-panel=\"1\" hidden>\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">02\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Model-invoked · reusable discipline · gated loop\u003c/p>\n              \u003ch3 id=\"diagnosing-bugs-case\">\u003ccode>diagnosing-bugs\u003c/code>: no theory before a red-capable loop\u003c/h3>\n              \u003cp>The file does not mainly teach debugging facts. It changes the order in which the agent is allowed to form confidence.\u003c/p>\n              \u003ca class=\"source-link\" href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">Read the original \u003ccode>SKILL.md\u003c/code> ↗\u003c/a>\n\n          \u003cp class=\"source-disclosure\">The left column is the complete, unmodified \u003ccode>SKILL.md\u003c/code>. Read it continuously; the numbered margin comments point to important design decisions without replacing the source.\u003c/p>\n\n          \u003cdiv class=\"manuscript-layout\" aria-label=\"Complete diagnosing-bugs source with teacher comments\">\n            \u003cpre class=\"skill-manuscript\" aria-label=\"Complete original diagnosing-bugs SKILL.md\">\u003ccode>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-1\" data-line=\"1\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-2\" data-line=\"2\">name: diagnosing-bugs\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-3\" data-line=\"3\">description: Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-4\" data-line=\"4\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-5\" data-line=\"5\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-6\" data-line=\"6\"># Diagnosing Bugs\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-7\" data-line=\"7\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-8\" data-line=\"8\">A discipline for hard bugs. Skip phases only when explicitly justified.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-9\" data-line=\"9\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-10\" data-line=\"10\">When exploring the codebase, read `CONTEXT.md` (if it exists) to get a clear mental model of the relevant modules, and check ADRs in the area you're touching.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-11\" data-line=\"11\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-12\" data-line=\"12\">## Redact\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-13\" data-line=\"13\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-14\" data-line=\"14\">This skill has you show commands, outputs and captured artifacts. **Redact every secret first** — write `&lt;REDACTED&gt;` in its place. Build loops against env vars, so the credential stays in the environment rather than in what you show. Captured artifacts carry auth headers: quote only the lines that carry the signal.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-15\" data-line=\"15\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-16\" data-line=\"16\">If the redacted output is not enough to diagnose the bug, say so and ask the user.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-17\" data-line=\"17\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-18\" data-line=\"18\">## Phase 1 — Build a feedback loop\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-19\" data-line=\"19\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-20\" data-line=\"20\">**This is the skill.** Everything else is mechanical. If you have a **tight** pass/fail signal for the bug — one that goes red on _this_ bug — you will find the cause; bisection, hypothesis-testing, and instrumentation all just consume it. If you don't have one, no amount of staring at code will save you.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-21\" data-line=\"21\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-22\" data-line=\"22\">Spend disproportionate effort here. **Be aggressive. Be creative. Refuse to give up.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-23\" data-line=\"23\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-24\" data-line=\"24\">### Ways to construct one — try them in roughly this order\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-25\" data-line=\"25\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-26\" data-line=\"26\">1. **Failing test** at whatever seam reaches the bug — unit, integration, e2e.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-27\" data-line=\"27\">2. **Curl / HTTP script** against a running dev server.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-28\" data-line=\"28\">3. **CLI invocation** with a fixture input, diffing stdout against a known-good snapshot.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-29\" data-line=\"29\">4. **Headless browser script** (Playwright / Puppeteer) — drives the UI, asserts on DOM/console/network.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-30\" data-line=\"30\">5. **Replay a captured trace.** Save a real network request / payload / event log to disk; replay it through the code path in isolation.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-31\" data-line=\"31\">6. **Throwaway harness.** Spin up a minimal subset of the system (one service, mocked deps) that exercises the bug code path with a single function call.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-32\" data-line=\"32\">7. **Property / fuzz loop.** If the bug is \"sometimes wrong output\", run 1000 random inputs and look for the failure mode.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-33\" data-line=\"33\">8. **Bisection harness.** If the bug appeared between two known states (commit, dataset, version), automate \"boot at state X, check, repeat\" so you can `git bisect run` it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-34\" data-line=\"34\">9. **Differential loop.** Run the same input through old-version vs new-version (or two configs) and diff outputs.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-35\" data-line=\"35\">10. **HITL bash script.** Last resort. If a human must click, drive _them_ with `scripts/hitl-loop.template.sh` so the loop is still structured. Captured output feeds back to you.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-36\" data-line=\"36\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-37\" data-line=\"37\">Build the right feedback loop, and the bug is 90% fixed.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-38\" data-line=\"38\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-39\" data-line=\"39\">### Tighten the loop\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-40\" data-line=\"40\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-41\" data-line=\"41\">Treat the loop as a product. Once you have _a_ loop, **tighten** it:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-42\" data-line=\"42\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-43\" data-line=\"43\">- Can I make it faster? (Cache setup, skip unrelated init, narrow the test scope.)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-44\" data-line=\"44\">- Can I make the signal sharper? (Assert on the specific symptom, not \"didn't crash\".)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-45\" data-line=\"45\">- Can I make it more deterministic? (Pin time, seed RNG, isolate filesystem, freeze network.)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-46\" data-line=\"46\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-47\" data-line=\"47\">A 30-second flaky loop is barely better than no loop; a 2-second deterministic one is tight — a debugging superpower.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-48\" data-line=\"48\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-49\" data-line=\"49\">### Non-deterministic bugs\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-50\" data-line=\"50\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-51\" data-line=\"51\">The goal is not a clean repro but a **higher reproduction rate**. Loop the trigger 100×, parallelise, add stress, narrow timing windows, inject sleeps. A 50%-flake bug is debuggable; 1% is not — keep raising the rate until it's debuggable.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-52\" data-line=\"52\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-53\" data-line=\"53\">### When you genuinely cannot build a loop\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-54\" data-line=\"54\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-55\" data-line=\"55\">Stop and say so explicitly. List what you tried. Ask the user for: (a) access to whatever environment reproduces it, (b) a redacted captured artifact (HAR file, log dump, core dump, screen recording with timestamps), or (c) permission to add temporary production instrumentation. Do **not** proceed to hypothesise without a loop.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-56\" data-line=\"56\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-57\" data-line=\"57\">### Completion criterion — a tight loop that goes red\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-58\" data-line=\"58\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-59\" data-line=\"59\">Phase 1 is done when the loop is **tight** and **red-capable**: you can name **one command** — a script path, a test invocation, a curl — that you have **already run at least once** (show the invocation and its output, redacted), and that is:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-60\" data-line=\"60\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-61\" data-line=\"61\">- [ ] **Red-capable** — it drives the actual bug code path and asserts the **user's exact symptom**, so it can go red on this bug and green once fixed. Not \"runs without erroring\" — it must be able to _catch this specific bug_.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-62\" data-line=\"62\">- [ ] **Deterministic** — same verdict every run (flaky bugs: a pinned, high reproduction rate, per above).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-63\" data-line=\"63\">- [ ] **Fast** — seconds, not minutes.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-64\" data-line=\"64\">- [ ] **Agent-runnable** — you can run it unattended; a human in the loop only via `scripts/hitl-loop.template.sh`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-65\" data-line=\"65\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-66\" data-line=\"66\">If you catch yourself reading code to build a theory before this command exists, **stop — jumping straight to a hypothesis is the exact failure this skill prevents.** No red-capable command, no Phase 2.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-67\" data-line=\"67\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-68\" data-line=\"68\">## Phase 2 — Reproduce + minimise\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-69\" data-line=\"69\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-70\" data-line=\"70\">Run the loop. Watch it go red — the bug appears.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-71\" data-line=\"71\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-72\" data-line=\"72\">Confirm:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-73\" data-line=\"73\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-74\" data-line=\"74\">- [ ] The loop produces the failure mode the **user** described — not a different failure that happens to be nearby. Wrong bug = wrong fix.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-75\" data-line=\"75\">- [ ] The failure is reproducible across multiple runs (or, for non-deterministic bugs, reproducible at a high enough rate to debug against).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-76\" data-line=\"76\">- [ ] You have captured the exact symptom (error message, wrong output, slow timing) so later phases can verify the fix actually addresses it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-77\" data-line=\"77\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-78\" data-line=\"78\">### Minimise\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-79\" data-line=\"79\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-80\" data-line=\"80\">Once it's red, shrink the repro to the **smallest scenario that still goes red**. Cut inputs, callers, config, data, and steps **one at a time**, re-running the loop after each cut — keep only what's load-bearing for the failure.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-81\" data-line=\"81\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-82\" data-line=\"82\">Why bother: a minimal repro shrinks the hypothesis space in Phase 3 (fewer moving parts left to suspect) and becomes the clean regression test in Phase 5.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-83\" data-line=\"83\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-84\" data-line=\"84\">Done when **every remaining element is load-bearing** — removing any one of them makes the loop go green.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-85\" data-line=\"85\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-86\" data-line=\"86\">Do not proceed until you have reproduced **and** minimised.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-87\" data-line=\"87\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-88\" data-line=\"88\">## Phase 3 — Hypothesise\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-89\" data-line=\"89\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-90\" data-line=\"90\">Generate **3–5 ranked hypotheses** before testing any of them. Single-hypothesis generation anchors on the first plausible idea.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-91\" data-line=\"91\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-92\" data-line=\"92\">Each hypothesis must be **falsifiable**: state the prediction it makes.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-93\" data-line=\"93\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-94\" data-line=\"94\">&gt; Format: \"If &lt;X&gt; is the cause, then &lt;changing Y&gt; will make the bug disappear / &lt;changing Z&gt; will make it worse.\"\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-95\" data-line=\"95\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-96\" data-line=\"96\">If you cannot state the prediction, the hypothesis is a vibe — discard or sharpen it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-97\" data-line=\"97\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-98\" data-line=\"98\">**Show the ranked list to the user before testing.** They often have domain knowledge that re-ranks instantly (\"we just deployed a change to #3\"), or know hypotheses they've already ruled out. Cheap checkpoint, big time saver. Don't block on it — proceed with your ranking if the user is AFK.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-99\" data-line=\"99\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-100\" data-line=\"100\">## Phase 4 — Instrument\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-101\" data-line=\"101\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-102\" data-line=\"102\">Each probe must map to a specific prediction from Phase 3. **Change one variable at a time.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-103\" data-line=\"103\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-104\" data-line=\"104\">Tool preference:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-105\" data-line=\"105\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-106\" data-line=\"106\">1. **Debugger / REPL inspection** if the env supports it. One breakpoint beats ten logs.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-107\" data-line=\"107\">2. **Targeted logs** at the boundaries that distinguish hypotheses.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-108\" data-line=\"108\">3. Never \"log everything and grep\".\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-109\" data-line=\"109\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-110\" data-line=\"110\">**Tag every debug log** with a unique prefix, e.g. `[DEBUG-a4f2]`. Cleanup at the end becomes a single grep. Untagged logs survive; tagged logs die.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-111\" data-line=\"111\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-112\" data-line=\"112\">**Perf branch.** For performance regressions, logs are usually wrong. Instead: establish a baseline measurement (timing harness, `performance.now()`, profiler, query plan), then bisect. Measure first, fix second.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-113\" data-line=\"113\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-114\" data-line=\"114\">## Phase 5 — Fix + regression test\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-115\" data-line=\"115\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-116\" data-line=\"116\">Write the regression test **before the fix** — but only if there is a **correct seam** for it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-117\" data-line=\"117\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-118\" data-line=\"118\">A correct seam is one where the test exercises the **real bug pattern** as it occurs at the call site. If the only available seam is too shallow (single-caller test when the bug needs multiple callers, unit test that can't replicate the chain that triggered the bug), a regression test there gives false confidence.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-119\" data-line=\"119\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-120\" data-line=\"120\">**If no correct seam exists, that itself is the finding.** Note it. The codebase architecture is preventing the bug from being locked down. Flag this for the next phase.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-121\" data-line=\"121\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-122\" data-line=\"122\">If a correct seam exists:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-123\" data-line=\"123\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-124\" data-line=\"124\">1. Turn the minimised repro into a failing test at that seam.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-125\" data-line=\"125\">2. Watch it fail.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-126\" data-line=\"126\">3. Apply the fix.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-127\" data-line=\"127\">4. Watch it pass.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-128\" data-line=\"128\">5. Re-run the Phase 1 feedback loop against the original (un-minimised) scenario.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-129\" data-line=\"129\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-130\" data-line=\"130\">## Phase 6 — Cleanup + post-mortem\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-131\" data-line=\"131\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-132\" data-line=\"132\">Required before declaring done:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-133\" data-line=\"133\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-134\" data-line=\"134\">- [ ] Original repro no longer reproduces (re-run the Phase 1 loop)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-135\" data-line=\"135\">- [ ] Regression test passes (or absence of seam is documented)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-136\" data-line=\"136\">- [ ] All `[DEBUG-...]` instrumentation removed (`grep` the prefix)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-137\" data-line=\"137\">- [ ] Throwaway prototypes deleted (or moved to a clearly-marked debug location)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-138\" data-line=\"138\">- [ ] The hypothesis that turned out correct is stated in the commit / PR message — so the next debugger learns\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-139\" data-line=\"139\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-140\" data-line=\"140\">**Then ask: what would have prevented this bug?** If the answer involves architectural change (no good test seam, tangled callers, hidden coupling) hand off to the `/improve-codebase-architecture` skill with the specifics. Make the recommendation **after** the fix is in, not before — you have more information now than when you started.\u003c/span>\n            \u003c/code>\u003c/pre>\n            \u003caside class=\"margin-rail\" aria-label=\"Teacher comments on diagnosing-bugs\">\n            \u003cdiv class=\"margin-comment\" style=\"--line: 3\" aria-labelledby=\"diagnosing-bugs-source-line-3\">\n              \u003cspan class=\"margin-marker\">01\u003c/span>\u003cstrong>A discoverable discipline\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-3\">Line 3\u003c/a> · The description names both the behavior and concrete trigger words: diagnose, debug, broken, failing, and slow.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 12\" aria-labelledby=\"diagnosing-bugs-source-line-12\">\n              \u003cspan class=\"margin-marker\">02\u003c/span>\u003cstrong>Evidence can leak secrets\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-12\">Line 12\u003c/a> · Redaction appears before diagnosis because every later phase may expose commands, logs, traces, or captured requests.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 18\" aria-labelledby=\"diagnosing-bugs-source-line-18\">\n              \u003cspan class=\"margin-marker\">03\u003c/span>\u003cstrong>The load-bearing phase\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-18\">Line 18\u003c/a> · The skill refuses causal stories until one command can show the exact bug. Everything later consumes this signal.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 39\" aria-labelledby=\"diagnosing-bugs-source-line-39\">\n              \u003cspan class=\"margin-marker\">04\u003c/span>\u003cstrong>Treat the loop as a product\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-39\">Line 39\u003c/a> · A reproduction is not enough: it must become faster, sharper, and more deterministic so repeated experiments stay cheap.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 49\" aria-labelledby=\"diagnosing-bugs-source-line-49\">\n              \u003cspan class=\"margin-marker\">05\u003c/span>\u003cstrong>Flakes need probability, not perfection\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-49\">Line 49\u003c/a> · For nondeterministic bugs, raising the reproduction rate creates a useful signal even when certainty is impossible.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 57\" aria-labelledby=\"diagnosing-bugs-source-line-57\">\n              \u003cspan class=\"margin-marker\">06\u003c/span>\u003cstrong>A real completion gate\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-57\">Line 57\u003c/a> · Four checkable properties must be true before Phase 2. This is stronger than advice to “try reproducing first.”\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 68\" aria-labelledby=\"diagnosing-bugs-source-line-68\">\n              \u003cspan class=\"margin-marker\">07\u003c/span>\u003cstrong>Reproduce, then minimise\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-68\">Line 68\u003c/a> · First prove it is the user’s bug; then remove every element that is not necessary. These are separate jobs.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 88\" aria-labelledby=\"diagnosing-bugs-source-line-88\">\n              \u003cspan class=\"margin-marker\">08\u003c/span>\u003cstrong>Several falsifiable causes\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-88\">Line 88\u003c/a> · Ranking multiple predictions counters attachment to the first plausible explanation and gives instrumentation something to distinguish.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 100\" aria-labelledby=\"diagnosing-bugs-source-line-100\">\n              \u003cspan class=\"margin-marker\">09\u003c/span>\u003cstrong>Instrument predictions\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-100\">Line 100\u003c/a> · Each probe tests one hypothesis. Broad logging creates volume; targeted boundaries create discriminating evidence.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 114\" aria-labelledby=\"diagnosing-bugs-source-line-114\">\n              \u003cspan class=\"margin-marker\">10\u003c/span>\u003cstrong>Test at the real seam\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-114\">Line 114\u003c/a> · A convenient shallow test can pass while the original bug remains possible. No honest seam is itself an architectural finding.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 130\" aria-labelledby=\"diagnosing-bugs-source-line-130\">\n              \u003cspan class=\"margin-marker\">11\u003c/span>\u003cstrong>Close the original loop\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-130\">Line 130\u003c/a> · Completion returns to the unminimised reproduction, removes temporary scaffolding, and preserves the causal lesson.\u003c/p>\n            \u003c/div>\n            \u003c/aside>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-2\" role=\"tabpanel\" aria-labelledby=\"case-tab-2\" data-case-panel=\"2\" hidden>\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">03\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Model-invoked · parallel review · aggregation\u003c/p>\n              \u003ch3 id=\"code-review-case\">\u003ccode>code-review\u003c/code>: protect two questions from each other\u003c/h3>\n              \u003cp>Instead of asking whether a diff is “good,” the skill preserves two independent judgments: standards conformance and specification fidelity.\u003c/p>\n              \u003ca class=\"source-link\" href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">Read the original \u003ccode>SKILL.md\u003c/code> ↗\u003c/a>\n\n          \u003cp class=\"source-disclosure\">The left column is the complete, unmodified \u003ccode>SKILL.md\u003c/code>. Read it continuously; the numbered margin comments point to important design decisions without replacing the source.\u003c/p>\n\n          \u003cdiv class=\"manuscript-layout\" aria-label=\"Complete code-review source with teacher comments\">\n            \u003cpre class=\"skill-manuscript\" aria-label=\"Complete original code-review SKILL.md\">\u003ccode>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-1\" data-line=\"1\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-2\" data-line=\"2\">name: code-review\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-3\" data-line=\"3\">description: Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes — Standards (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating issue/spec asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user wants to review a branch, a PR, work-in-progress changes, or asks to \"review since X\".\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-4\" data-line=\"4\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-5\" data-line=\"5\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-6\" data-line=\"6\">Two-axis review of the diff between `HEAD` and a fixed point the user supplies:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-7\" data-line=\"7\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-8\" data-line=\"8\">- **Standards** — does the code conform to this repo's documented coding standards?\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-9\" data-line=\"9\">- **Spec** — does the code faithfully implement the originating issue / spec?\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-10\" data-line=\"10\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-11\" data-line=\"11\">Both axes run as **parallel sub-agents** so they don't pollute each other's context, then this skill aggregates their findings.\u003c/span>\n
