utton);\n        });\n      }\n\n      function render() {\n        const item = config.items[index];\n        const answer = state.answers[index];\n        selected = answer?.selected ?? null;\n        count.textContent = `${index + 1} / ${config.items.length}`;\n        prompt.textContent = item.prompt;\n        if (question) question.textContent = item.question;\n        if (kicker) kicker.textContent = item.kicker;\n        previous.disabled = index === 0;\n        next.textContent = index === config.items.length - 1 ? \"Finish\" : \"Next →\";\n        check.disabled = selected === null;\n        choices.replaceChildren();\n\n        item.options.forEach((option, optionIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option.label;\n          button.dataset.tip = option.tip;\n          button.setAttribute(\"aria-label\", `${option.label}. ${option.tip}`);\n          button.setAttribute(\"aria-pressed\", String(optionIndex === selected));\n          if (optionIndex === selected) button.classList.add(\"selected\");\n          if (answer?.checked && optionIndex === item.answer) button.classList.add(\"correct-answer\");\n          button.addEventListener(\"click\", () => selectOption(optionIndex));\n          choices.append(button);\n        });\n\n        if (answer?.checked) {\n          feedback.className = `feedback visible ${answer.correct ? \"correct\" : \"retry\"}`;\n          feedback.textContent = answer.correct ? item.correctFeedback : item.retryFeedback;\n        } else {\n          feedback.className = \"feedback\";\n          feedback.textContent = \"\";\n        }\n\n        renderNav();\n      }\n\n      function selectOption(optionIndex) {\n        selected = optionIndex;\n        state.answers[index] = { selected, checked: false, correct: false };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function checkAnswer() {\n        if (selected === null) return;\n        const item = config.items[index];\n        state.answers[index] = {\n          selected,\n          checked: true,\n          correct: selected === item.answer\n        };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function goTo(nextIndex) {\n        index = nextIndex;\n        state.index = index;\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      previous.addEventListener(\"click\", () => {\n        if (index > 0) goTo(index - 1);\n      });\n\n      skip.addEventListener(\"click\", () => goTo((index + 1) % config.items.length));\n      check.addEventListener(\"click\", checkAnswer);\n      next.addEventListener(\"click\", () => {\n        if (index \u003c config.items.length - 1) {\n          goTo(index + 1);\n          return;\n        }\n        const correctCount = config.items.filter((item, itemIndex) => state.answers[itemIndex]?.correct).length;\n        feedback.className = \"feedback visible correct\";\n        feedback.textContent = correctCount === config.items.length\n          ? config.completeFeedback\n          : `You reached the end with ${correctCount} of ${config.items.length} decisions resolved. Use the step pills to revisit any case.`;\n      });\n\n      render();\n    }\n\n    const briefItems = [\n      {\n        shortLabel: \"Failure\",\n        kicker: \"Decision 1 · Observable failure\",\n        prompt: \"Which starting point gives the proposed skill the clearest job?\",\n        question: \"Choose the statement that describes behavior rather than a virtue.\",\n        options: [\n          { label: \"Agents should be more careful with repository changes.\", tip: \"A virtue with no observable boundary; different readers can claim compliance while behaving differently.\" },\n          { label: \"On narrow change requests, agents modify adjacent files and report checks they did not run.\", tip: \"Names two observable behaviors: scope expansion and unsupported verification claims.\" },\n          { label: \"Software engineering requires discipline and good judgment.\", tip: \"True but inert; it does not identify a recurring decision or a post-run signal.\" },\n          { label: \"Create a comprehensive best-practices skill for coding.\", tip: \"Starts from document scope and invites sprawl before a behavioral seam is known.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Exactly. You can now design against two visible failure signals and build adversarial examples for both.\",\n        retryFeedback: \"Look for the option that lets an observer decide whether the failure happened after a run.\"\n      },\n      {\n        shortLabel: \"Owner\",\n        kicker: \"Decision 2 · Invocation ownership\",\n        prompt: \"The discipline should apply whenever ordinary implementation begins. Who should notice it?\",\n        question: \"Choose the invocation design that matches that requirement.\",\n        options: [\n          { label: \"Human-only, because humans should retain all agency.\", tip: \"Human-only preserves deliberate entry, but the discipline can be forgotten during ordinary change work.\" },\n          { label: \"Model-discoverable, with a narrow change-making trigger.\", tip: \"Pays context load so the behavior can activate during build, change, fix, and apply requests.\" },\n          { label: \"Always inline the entire skill into AGENTS.md.\", tip: \"Maximizes context load on every turn, including questions and unrelated tasks.\" },\n          { label: \"Invocation does not matter if the body is well written.\", tip: \"A body that never loads cannot shape behavior; retrieval is part of the architecture.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Yes. Automatic discovery matches the requirement; a precise description keeps the permanent cost bounded.\",\n        retryFeedback: \"Separate human authority over decisions from responsibility for remembering a reusable discipline.\"\n      },\n      {\n        shortLabel: \"Gate\",\n        kicker: \"Decision 3 · Completion criterion\",\n        prompt: \"Which stopping condition best resists premature completion?\",\n        question: \"Prefer a criterion that is both checkable and demanding.\",\n        options: [\n          { label: \"Stop when the implementation seems correct.\", tip: \"The agent can satisfy this through confidence alone; there is no observable bound.\" },\n          { label: \"Stop after running tests.\", tip: \"Checkable but underspecified: which tests, what result, and what happens when a check is unavailable?\" },\n          { label: \"Stop when each requested outcome maps to a change, each relevant check has a recorded result, and uncertainty is explicit.\", tip: \"Exhaustive across outcomes and evidence, while allowing an honest non-passing or unavailable result.\" },\n          { label: \"Stop when all possible verification has passed.\", tip: \"Overbroad and often impossible; it tempts the agent to redefine 'possible' or hide unavailable checks.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Right. The criterion demands an outcome ledger and evidence without pretending every environment permits every check.\",\n        retryFeedback: \"Look for the option that can report failure or unavailability honestly instead of defining done as success.\"\n      },\n      {\n        shortLabel: \"Test\",\n        kicker: \"Decision 4 · Evidence\",\n        prompt: \"How should you test whether the sentence “Preserve unrelated work” earns its load?\",\n        question: \"Choose the design that isolates the sentence’s behavioral effect.\",\n        options: [\n          { label: \"Ask an expert whether the sentence sounds important.\", tip: \"Useful editorial feedback, but it cannot establish a model-relative behavioral effect.\" },\n          { label: \"Count how many words the skill contains before and after adding it.\", tip: \"Measures context cost, not the behavior purchased by that cost.\" },\n          { label: \"Run a narrow task with tempting adjacent cleanup, with and without the sentence, across comparable trials.\", tip: \"A counterfactual test: only the disputed instruction changes while the behavioral signal stays observable.\" },\n          { label: \"Keep the sentence because deleting instructions is risky.\", tip: \"This is how sediment accumulates: safety is assumed without testing whether the line steers anything.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Exactly. The sentence earns its place only if it changes scope behavior relative to the model’s default.\",\n        retryFeedback: \"Choose the comparison that changes only the disputed instruction and observes the target failure.\"\n      }\n    ];\n\n    createStepper({\n      storageKey: \"brief-lab\",\n      items: briefItems,\n      nav: \"#brief-nav\",\n      count: \"#brief-count\",\n      kicker: \"#brief-kicker\",\n      prompt: \"#brief-question\",\n      choices: \"#brief-choices\",\n      feedback: \"#brief-feedback\",\n      previous: \"#brief-prev\",\n      skip: \"#brief-skip\",\n      check: \"#brief-check\",\n      next: \"#brief-next\",\n      completeFeedback: \"Design brief complete: observable failure, automatic discovery, an evidence-bearing completion gate, and a counterfactual test.\"\n    });\n\n    const placementItems = [\n      {\n        shortLabel: \"Universal\",\n        prompt: \"Resolve the user’s request into an explicit target before editing.\",\n        question: \"Where should this instruction live?\",\n        options: [\n          { label: \"In-file step\", tip: \"The behavior applies on every run and establishes the scope boundary for everything that follows.\" },\n          { label: \"Disclosed reference\", tip: \"Best for material needed only on a distinct branch, not a universal first decision.\" },\n          { label: \"Environment\", tip: \"The user’s request is evidence, but the judgment of resolving it into an explicit target is not a cheap file lookup.\" },\n          { label: \"Remove as a no-op\", tip: \"Agents often infer scope, but explicit scope control is the very behavior this skill exists to stabilize.\" }\n        ],\n        answer: 0,\n        correctFeedback: \"Yes. It is universal, sequential behavior and belongs at the top of the hierarchy.\",\n        retryFeedback: \"Ask whether every run needs this judgment before later work can be safe.\"\n      },\n      {\n        shortLabel: \"Branch\",\n        prompt: \"When the change touches production database DDL, follow the rollout and rollback checklist in references/production-ddl.md.\",\n        question: \"Where should the detailed checklist live?\",\n        options: [\n          { label: \"Inline the whole checklist\", tip: \"Would force every code change to carry production-DDL detail, burying the universal path.\" },\n          { label: \"Disclosed reference\", tip: \"The pointer names a distinct branch and its trigger; only DDL work pays the detailed context.\" },\n          { label: \"Environment only\", tip: \"The repository may show migration files, but rollout and rollback policy is often a convention the files cannot fully explain.\" },\n          { label: \"Delete the branch\", tip: \"Rare does not mean irrelevant; the branch has high consequence and a crisp loading condition.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Correct. A high-consequence, branch-specific checklist is exactly what progressive disclosure is for.\",\n        retryFeedback: \"The material matters only when a crisp branch fires; avoid charging every run for it.\"\n      },\n      {\n        shortLabel: \"Lookup\",\n        prompt: \"Run npm test to execute this repository’s test suite.\",\n        question: \"Assume package.json already exposes the current test command. Where should this fact live?\",\n        options: [\n          { label: \"In-file reference\", tip: \"This duplicates a current value already owned elsewhere and will become stale if the script changes.\" },\n          { label: \"Disclosed reference\", tip: \"Moving the duplicate down a layer does not repair its second-source-of-truth problem.\" },\n          { label: \"Environment\", tip: \"The agent can inspect package.json cheaply and get the current command from its authoritative source.\" },\n          { label: \"Repeat it in every step\", tip: \"Duplication inflates prominence, consumes load, and multiplies maintenance points.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Exactly. Let package.json own the command; document only a convention or gotcha that the script cannot reveal.\",\n        retryFeedback: \"Prefer the authoritative, cheap lookup over a cached copy in prose.\"\n      },\n      {\n        shortLabel: \"No-op\",\n        prompt: \"Be professional and write high-quality code.\",\n        question: \"What is the best placement decision?\",\n        options: [\n          { label: \"In-file step\", tip: \"It sounds important but does not define a different process, gate, or observable result.\" },\n          { label: \"Disclosed reference\", tip: \"Hiding vague prose does not make it behaviorally useful.\" },\n          { label: \"Environment\", tip: \"This is not an environmental fact; it is an instruction that fails to specify a control lever.\" },\n          { label: \"Remove as a no-op\", tip: \"Delete the whole sentence unless a counterfactual test shows that it changes the relevant model’s behavior.\" }\n        ],\n        answer: 3,\n        correctFeedback: \"Right. Replace it only with a concrete lever tied to a known failure; otherwise delete it.\",\n        retryFeedback: \"Ask what observable behavior would differ if the sentence vanished.\"\n      }\n    ];\n\n    createStepper({\n      storageKey: \"placement-lab\",\n      items: placementItems,\n      nav: \"#placement-nav\",\n      count: \"#placement-count\",\n      prompt: \"#placement-line\",\n      question: \"#placement-question\",\n      choices: \"#placement-choices\",\n      feedback: \"#placement-feedback\",\n      previous: \"#placement-prev\",\n      skip: \"#placement-skip\",\n      check: \"#placement-check\",\n      next: \"#placement-next\",\n      completeFeedback: \"Placement complete: universal step, disclosed branch, environmental source of truth, and one deleted no-op.\"\n    });\n\n    const draftFields = [\"skill-name\", \"trigger\", \"core-step\", \"done-criterion\"];\n    const savedDraft = loadState(\"draft-builder\", {});\n    const preview = document.querySelector(\"#draft-preview\");\n    const copyButton = document.querySelector(\"#copy-draft\");\n    const copyStatus = document.querySelector(\"#copy-status\");\n\n    draftFields.forEach((fieldId) => {\n      const field = document.querySelector(`#${fieldId}`);\n      if (typeof savedDraft[fieldId] === \"string\") field.value = savedDraft[fieldId];\n      field.addEventListener(\"input\", updateDraft);\n    });\n\n    function safeSkillName(value) {\n      return value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, \"-\").replace(/^-+|-+$/g, \"\") || \"unnamed-skill\";\n    }\n\n    function currentDraft() {\n      const values = Object.fromEntries(draftFields.map((fieldId) => [fieldId, document.querySelector(`#${fieldId}`).value]));\n      const name = safeSkillName(values[\"skill-name\"]);\n      return `---\\nname: ${name}\\ndescription: ${values.trigger.trim()}\\n---\\n\\n# ${name}\\n\\n${values[\"core-step\"].trim()}\\n\\nThe work is complete when ${values[\"done-criterion\"].trim().replace(/^finish when\\s*/i, \"\")}\\n`;\n    }\n\n    function updateDraft() {\n      const values = Object.fromEntries(draftFields.map((fieldId) => [fieldId, document.querySelector(`#${fieldId}`).value]));\n      saveState(\"draft-builder\", values);\n      preview.textContent = currentDraft();\n      copyStatus.textContent = \"\";\n    }\n\n    copyButton.addEventListener(\"click\", async () => {\n      try {\n        await navigator.clipboard.writeText(currentDraft());\n        copyStatus.textContent = \"Draft copied. Your saved course version remains here too.\";\n      } catch (error) {\n        copyStatus.textContent = \"Clipboard access is unavailable. Select the draft above to copy it manually.\";\n      }\n    });\n\n    updateDraft();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session2.zh-CN.html","basePath":"session2.html","lang":"zh-CN","kind":"lesson","title":"设计一项 Skill","translations":{"en":"session2.html","zh-CN":"session2.zh-CN.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"设计一项 Skill\">\n  \u003ctitle>设计真正值得占用上下文的 Skill — MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.82);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 20;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 3px;\n      background: rgba(138, 78, 53, 0.12);\n    }\n\n    .progress-bar {\n      width: 0;\n      height: 100%;\n      background: var(--accent);\n      transition: width 120ms linear;\n    }\n\n    main {\n      width: min(100% - 3rem, 112ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    html[data-studio-width=\"standard\"] main {\n      width: min(100% - 3rem, 88ch);\n    }\n\n    html[data-studio-width=\"wide\"] main {\n      width: min(100% - 3rem, 112ch);\n    }\n\n    html[data-studio-width=\"full\"] main {\n      width: calc(100% - 3rem);\n      max-width: none;\n    }\n\n    header { margin-bottom: 4rem; }\n\n    .eyebrow,\n    .meta,\n    .label,\n    .time,\n    button,\n    code,\n    .path,\n    .step-pill,\n    label,\n    input,\n    textarea,\n    .term {\n      font-family: var(--mono);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.9rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3, h4 { line-height: 1.18; }\n\n    h1 {\n      max-width: 12ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.3rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h2 {\n      margin: 0 0 1.1rem;\n      font-size: clamp(1.85rem, 5vw, 2.35rem);\n      font-weight: 500;\n      letter-spacing: -0.028em;\n    }\n\n    h3 { margin: 2rem 0 0.65rem; font-size: 1.3rem; }\n    h4 { margin: 0 0 0.45rem; font-size: 1.05rem; }\n    p { margin: 0.8rem 0; }\n    section { margin-top: 5rem; scroll-margin-top: 2rem; }\n    ul, ol { padding-left: 1.3rem; }\n    li + li { margin-top: 0.5rem; }\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.84em;\n    }\n\n    .lede {\n      max-width: 55ch;\n      margin: 1.55rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta { color: var(--muted); font-size: 0.82rem; }\n\n    .opening,\n    .callout,\n    .lab,\n    .draft-builder,\n    .comparison-card,\n    .field-note {\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .opening {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.2rem;\n      margin-top: 2rem;\n      padding: 1.35rem;\n    }\n\n    .opening h2 {\n      margin-bottom: 0.65rem;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 800;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .opening p, .opening ul { margin: 0; font-size: 0.94rem; }\n\n    .time {\n      display: inline-block;\n      margin-bottom: 0.65rem;\n      color: var(--accent);\n      font-size: 0.75rem;\n    }\n\n    .label {\n      display: block;\n      margin-bottom: 0.4rem;\n      color: var(--accent);\n      font-size: 0.73rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .callout { margin: 1.5rem 0; padding: 1.25rem 1.35rem; }\n    .callout p:last-child { margin-bottom: 0; }\n    .callout.sage { border-left: 4px solid var(--sage); }\n    .callout.blue { border-left: 4px solid var(--blue); }\n\n    .formula {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: 0.75rem;\n      margin: 1.5rem 0;\n    }\n\n    .formula div {\n      position: relative;\n      padding: 1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: rgba(255, 253, 248, 0.68);\n    }\n\n    .formula div:not(:last-child)::after {\n      position: absolute;\n      top: 50%;\n      right: -0.6rem;\n      z-index: 2;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n      transform: translateY(-50%);\n    }\n\n    .formula strong {\n      display: block;\n      margin-bottom: 0.35rem;\n      font-family: var(--sans);\n      font-size: 0.9rem;\n    }\n\n    .formula span { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      font-size: 0.9em;\n    }\n\n    .term::after,\n    .choice[data-tip]::after {\n      position: absolute;\n      z-index: 30;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(20rem, 80vw);\n      padding: 0.7rem 0.8rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-tip);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .term:hover::after,\n    .term:focus-visible::after,\n    .choice[data-tip]:hover::after,\n    .choice[data-tip]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .lab { margin-top: 2rem; padding: 1.35rem; }\n\n    .lab-header {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1rem;\n    }\n\n    .lab-header h3 { margin: 0; }\n\n    .lab-count {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n      white-space: nowrap;\n    }\n\n    .step-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.1rem;\n      padding-bottom: 0.8rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .step-pill {\n      padding: 0.34rem 0.68rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--muted);\n      background: rgba(255, 253, 248, 0.72);\n      cursor: pointer;\n      font-size: 0.69rem;\n    }\n\n    .step-pill.active {\n      border-color: var(--accent);\n      color: var(--accent-dark);\n      background: var(--accent-soft);\n      font-weight: 700;\n    }\n\n    .step-pill.correct {\n      border-color: var(--sage);\n      color: #384937;\n      background: var(--sage-soft);\n    }\n\n    .step-pill.answered {\n      border-color: var(--blue);\n      color: #334856;\n      background: var(--blue-soft);\n    }\n\n    button {\n      border: 1px solid var(--line);\n      color: var(--ink);\n      background: transparent;\n      cursor: pointer;\n    }\n\n    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }\n\n    .choice-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 0.65rem;\n      margin-top: 1rem;\n    }\n\n    .choice {\n      position: relative;\n      min-height: 4.5rem;\n      padding: 0.8rem;\n      border-radius: 0.48rem;\n      font-size: 0.76rem;\n      line-height: 1.45;\n      text-align: left;\n    }\n\n    .choice.selected {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .choice.correct-answer {\n      border-color: var(--sage);\n      color: #334332;\n      background: var(--sage-soft);\n    }\n\n    .feedback {\n      display: none;\n      margin-top: 1rem;\n      padding: 0.9rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-size: 0.92rem;\n    }\n\n    .feedback.visible { display: block; }\n    .feedback.correct { border-left: 3px solid var(--sage); }\n    .feedback.retry { border-left: 3px solid var(--accent); }\n\n    .quiz-actions {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.6rem;\n      flex-wrap: wrap;\n      margin-top: 1.1rem;\n    }\n\n    .quiz-action-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }\n\n    .quiz-button,\n    .secondary-button,\n    .copy-button {\n      padding: 0.58rem 0.86rem;\n      border-radius: 999px;\n      font-size: 0.73rem;\n    }\n\n    .quiz-button {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .quiz-button:disabled, .secondary-button:disabled { cursor: not-allowed; opacity: 0.42; }\n\n    .comparison-card {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0;\n      overflow: hidden;\n      margin-top: 1.4rem;\n    }\n\n    .comparison-card article { padding: 1.25rem; }\n    .comparison-card article + article { border-left: 1px solid var(--line); }\n    .comparison-card p { font-size: 0.94rem; }\n\n    pre {\n      margin: 1rem 0;\n      padding: 1rem;\n      overflow-x: auto;\n      border-radius: 0.45rem;\n      color: #f8efe3;\n      background: #312c27;\n      font-family: var(--mono);\n      font-size: 0.79rem;\n      line-height: 1.55;\n      white-space: pre-wrap;\n    }\n\n    pre code { padding: 0; color: inherit; background: transparent; font-size: inherit; }\n\n    .ladder {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 0.7rem;\n      margin: 1.4rem 0;\n    }\n\n    .ladder div {\n      padding: 1rem;\n      border-top: 3px solid var(--accent);\n      background: rgba(255, 253, 248, 0.6);\n    }\n\n    .ladder strong { display: block; font-family: var(--sans); font-size: 0.9rem; }\n    .ladder span { color: var(--muted); font-size: 0.83rem; }\n\n    .audit-line {\n      margin: 0.8rem 0;\n      padding: 0.9rem 1rem;\n      border-left: 3px solid var(--accent);\n      background: var(--paper-deep);\n      font-family: var(--mono);\n      font-size: 0.82rem;\n    }\n\n    .draft-builder { margin-top: 1.6rem; overflow: hidden; }\n\n    .builder-grid {\n      display: grid;\n      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);\n    }\n\n    .builder-fields { padding: 1.3rem; border-right: 1px solid var(--line); }\n    .builder-preview { min-width: 0; padding: 1.3rem; background: rgba(238, 229, 214, 0.34); }\n    .builder-preview h3, .builder-fields h3 { margin-top: 0; }\n\n    .field { margin-top: 1rem; }\n\n    label {\n      display: block;\n      margin-bottom: 0.35rem;\n      color: var(--muted);\n      font-size: 0.7rem;\n    }\n\n    input, textarea {\n      width: 100%;\n      padding: 0.7rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 0.42rem;\n      color: var(--ink);\n      background: #fffdf8;\n      font-size: 0.77rem;\n      line-height: 1.45;\n    }\n\n    textarea { min-height: 6.5rem; resize: vertical; }\n    input:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }\n\n    .builder-preview pre { min-height: 23rem; margin-bottom: 0.75rem; }\n\n    .copy-status {\n      min-height: 1.4rem;\n      color: var(--sage);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n    }\n\n    .scorecard {\n      width: 100%;\n      margin: 1.4rem 0;\n      border-collapse: collapse;\n      font-size: 0.93rem;\n    }\n\n    .scorecard th, .scorecard td { padding: 0.8rem; border-bottom: 1px solid var(--line); text-align: left; }\n    .scorecard th { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; }\n\n    .field-note { margin-top: 1.5rem; padding: 1.25rem; }\n    .field-note p:first-child { margin-top: 0; }\n\n    .learner-note {\n      margin-top: 1.5rem;\n      padding: 1.3rem 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: rgba(255, 253, 248, 0.68);\n      box-shadow: var(--shadow);\n    }\n\n    .learner-question {\n      margin: 0 0 1.1rem;\n      padding-left: 1rem;\n      border-left: 3px solid var(--accent);\n      color: #4f4941;\n      font-style: italic;\n    }\n\n    .three-questions {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 0.65rem;\n      margin: 1rem 0;\n    }\n\n    .three-questions div {\n      padding: 0.85rem;\n      border-radius: 0.45rem;\n      background: var(--paper-deep);\n    }\n\n    .three-questions strong {\n      display: block;\n      font-family: var(--sans);\n      font-size: 0.86rem;\n    }\n\n    .three-questions span { color: var(--muted); font-size: 0.82rem; }\n\n    .source-note { color: var(--muted); font-size: 0.88rem; }\n\n    @media (max-width: 760px) {\n      .formula { grid-template-columns: 1fr 1fr; }\n      .formula div:nth-child(2)::after { display: none; }\n      .builder-grid { grid-template-columns: 1fr; }\n      .builder-fields { border-right: 0; border-bottom: 1px solid var(--line); }\n    }\n\n    @media (max-width: 620px) {\n      main { padding-top: 3rem; }\n      .opening, .comparison-card, .ladder, .three-questions { grid-template-columns: 1fr; }\n      .comparison-card article + article { border-top: 1px solid var(--line); border-left: 0; }\n      .choice-grid { grid-template-columns: 1fr; }\n      .formula { grid-template-columns: 1fr; }\n      .formula div::after { display: none; }\n      .lab-header { align-items: flex-start; flex-direction: column; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">第 2 课 · 设计实战工作坊\u003c/p>\n      \u003ch1>设计真正值得占用上下文的 Skill\u003c/h1>\n      \u003cp class=\"lede\">第 1 课让我们看清了 Matt Pocock 的架构体系。现在，我们将运用其核心设计理念亲手构思一个精简的 Skill——并让其中的每一行指令都能够证明自己存在的价值。\u003c/p>\n      \u003cp class=\"meta\">60 分钟 · 进阶 · 产出物驱动 · 进度本地保存\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"carry-forward\">核心认知承接\u003c/h2>\n          \u003cp>Skill 绝不是知识摘要，而是围绕可重复工程判断构建的接口：触发器、权责边界、打破模型默认行为的控制杠杆，以及可检验的终止条件。\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"session-artifact\">本次实战产物\u003c/h2>\n          \u003cp>你将亲手完成一份紧凑的 \u003ccode>SKILL.md\u003c/code> 草案，打造一套以执行与交付为核心的实践规范：圈定工作范围、提供可检验凭证、坚持诚实验证。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–10 分钟\u003c/span>\n      \u003ch2 id=\"start-from-failure\">1. 从具体失效切入，而非套用格式模板\u003c/h2>\n      \u003cp>“写一个让代码更严谨的 Skill”无法给 Agent 提供任何清晰的诊断目标。必须从一次糟糕执行后能够明确辨识的具体问题出发：未经允许修改了无关相邻文件、凭空宣称已通过验证却无凭无据，或是用自信的套话掩盖已知的不确定性。\u003c/p>\n\n      \u003cdiv class=\"formula\" aria-label=\"Skill 设计思考顺序\">\n        \u003cdiv>\u003cstrong>失效场景\u003c/strong>\u003cspan>哪些可观测的缺陷在反复出现？\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>核心职责\u003c/strong>\u003cspan>需要将哪种工程判断沉淀为可复用规范？\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>控制杠杆\u003c/strong>\u003cspan>哪条指令能够切实改变模型的默认行为？\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>验证证据\u003c/strong>\u003cspan>如何客观证明该设计确实生效？\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">设计核心约束\u003c/span>\n        \u003cp>不要在指令中写“请做好”这类的空泛要求，而要精准约束模型容易产生摇摆偏差的关键决策。这正是揪出并剔除 \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"与模型默认行为相比，无法产生任何实质性改变的指令。它空耗了上下文注意力，却没有换来任何行为控制力。\">无效空话 (No-op)\u003c/span> 的实战意义。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"brief-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"design-brief\">编写设计简报\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"brief-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"brief-nav\" role=\"tablist\" aria-label=\"设计简报决策步骤\">\u003c/div>\n        \u003cp class=\"label\" id=\"brief-kicker\">\u003c/p>\n        \u003cp id=\"brief-question\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"brief-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"brief-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"secondary-button\" id=\"brief-prev\" type=\"button\">← 上一步\u003c/button>\n            \u003cbutton class=\"secondary-button\" id=\"brief-skip\" type=\"button\">跳过\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"quiz-button\" id=\"brief-check\" type=\"button\" disabled>检查答案\u003c/button>\n            \u003cbutton class=\"quiz-button\" id=\"brief-next\" type=\"button\">下一步 →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">10–22 分钟\u003c/span>\n      \u003ch2 id=\"choose-invocation\">2. 先写上下文指针，再写正文内容\u003c/h2>\n      \u003cp>对于模型可自动发现的 Skill，其 description 本质上是一个 \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"常驻在上下文中的轻量索引：指明外部文档的核心内容，并明确规定 Agent 应当在何种特定条件下将其动态加载。\">上下文指针 (Context Pointer)\u003c/span>。它必须清晰指明内容主体并列出独立的触发分支，绝不能将整个冗长流程直接塞进 Frontmatter 中。\u003c/p>\n\n      \u003cdiv class=\"comparison-card\">\n        \u003carticle>\n          \u003cspan class=\"label\">模糊弱指针\u003c/span>\n          \u003cpre>\u003ccode>description: Helps agents do coding work carefully and verify results.\u003c/code>\u003c/pre>\n          \u003cp>\u003cstrong>失效原因：\u003c/strong>“coding work”几乎涵盖了一切，“carefully”没有任何可量化的实际意义。这个指针徒增了上下文负担，却没有提供清晰的检索边界。\u003c/p>\n        \u003c/article>\n        \u003carticle>\n          \u003cspan class=\"label\">精准锐利指针\u003c/span>\n          \u003cpre>\u003ccode>description: Keep implementation changes inside an explicit scope and report verification evidence honestly. Use when the user asks to build, change, fix, or apply something in a repository.\u003c/code>\u003c/pre>\n          \u003cp>\u003cstrong>强劲原因：\u003c/strong>开头的核心动词直接指明行为规范；触发词列表精准覆盖所有引发代码变更的分支；纯解释性任务则被自然排除在外。\u003c/p>\n        \u003c/article>\n      \u003c/div>\n\n      \u003cdiv class=\"learner-note\">\n        \u003cspan class=\"label\">学员疑问\u003c/span>\n        \u003cp class=\"learner-question\">“这听起来有点反直觉。我以前总觉得应该先描述 Skill 解决了什么问题，而且这些问题应该彼此独立。但本节课却强调要在 description 中定义‘行为契约’。能用通俗直观的话详细解释一下为什么这样做更好吗？”\u003c/p>\n\n        \u003ch3 id=\"problem-behavior-trigger\">问题、行为契约与触发条件解答的是不同维度的疑问\u003c/h3>\n        \u003cdiv class=\"three-questions\">\n          \u003cdiv>\u003cstrong>问题本身\u003c/strong>\u003cspan>为什么需要这个 Skill？\u003c/span>\u003c/div>\n          \u003cdiv>\u003cstrong>行为契约\u003c/strong>\u003cspan>它会让 Agent 产生哪些不同的行为模式？\u003c/span>\u003c/div>\n          \u003cdiv>\u003cstrong>触发条件\u003c/strong>\u003cspan>Agent 应当在何时加载该 Skill？\u003c/span>\u003c/div>\n        \u003c/div>\n\n        \u003cp>在设计阶段，‘以问题为先’非常有价值：它能帮你理清创建该 Skill 的合逻辑由。但在 Agent 的工具箱中，description 本质上是一个索引标签。如果只打上问题标签（例如‘当实现质量不稳定时使用’），Agent 根本无法预判该 Skill 到底是会增加测试、做代码审查、限制范围还是排查 Bug。\u003c/p>\n\n        \u003cp>行为契约明确了治理手段，触发条件指明了适用场景。两者结合，Agent 才能准确预判加载该 Skill 会带来何种改变，并据此做出精准的检索与调用决策。\u003c/p>\n\n        \u003cdiv class=\"callout sage\">\n          \u003cspan class=\"label\">起草顺序\u003c/span>\n          \u003cp>\u003cstrong>从问题出发\u003c/strong> 探寻 Skill 存在的根本原因。\u003cstrong>定义行为契约\u003c/strong> 明确其承担的治理职责。\u003cstrong>以‘行为 + 触发词’撰写 description\u003c/strong> 确保 Agent 能够精准检索与加载。\u003c/p>\n        \u003c/div>\n\n        \u003cp>职责独立性在划定 Skill 边界时依然重要。如果两种行为在单独使用时均有价值，它们理应拆分为两个独立的 Skill。在本课中，范围控制与诚实验证被合并在一起，是因为它们共同构成了‘代码交付验收’的完整闭环。这种组合属于工程设计判断，而非死板公式。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">调用权决策\u003c/span>\n        \u003cp>如果你希望该规范在日常编码实现中自动生效，请将其设为模型可发现；如果它是一项需要刻意发起的人工审查仪式，请保持仅限人工调用。这是在 \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"为使 Agent 能够自动发现文档而常驻消耗的 Token 与注意力预算。\">常驻上下文负载\u003c/span> 与 \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"人类需主动记住‘在何时调用何种手动 Skill’的认知成本。在此设计哲学中，这也是保留人类主导权的重要手段。\">人类认知负荷\u003c/span> 之间做出的权衡取舍，并不存在优劣之分。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">22–38 分钟\u003c/span>\n      \u003ch2 id=\"place-information\">3. 将每条指令放置在开销最低的真实信息层\u003c/h2>\n      \u003cp>正文内容并不是所有有用信息的默认归宿。应当根据‘何时需要’以及‘权威事实来源在何处’来分层存放材料。\u003c/p>\n\n      \u003cdiv class=\"ladder\" aria-label=\"三个信息放置层级\">\n        \u003cdiv>\u003cstrong>文件内核心层\u003c/strong>\u003cspan>每次运行都必须遵循的通用步骤与核心规则。\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>按需披露的参考层\u003c/strong>\u003cspan>放在精准指针之后的特定分支参考材料。\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>宿主环境层\u003c/strong>\u003cspan>可直接从文件、配置或 help 输出中低成本读取的环境事实。\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"placement-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"placement-game\">信息分层放置实战\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"placement-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"placement-nav\" role=\"tablist\" aria-label=\"信息分层案例\">\u003c/div>\n        \u003cp class=\"audit-line\" id=\"placement-line\">\u003c/p>\n        \u003cp id=\"placement-question\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"placement-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"placement-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"secondary-button\" id=\"placement-prev\" type=\"button\">← 上一步\u003c/button>\n            \u003cbutton class=\"secondary-button\" id=\"placement-skip\" type=\"button\">跳过\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"quiz-button\" id=\"placement-check\" type=\"button\" disabled>检查答案\u003c/button>\n            \u003cbutton class=\"quiz-button\" id=\"placement-next\" type=\"button\">下一步 →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">缓存检验法则 (The Cache Test)\u003c/span>\n        \u003cp>如果 Agent 能够通过一次廉价的查询直接获取某个事实，强行将其复制到 Skill 中只会制造出易过期的陈旧缓存。Skill 只需记录环境无法直接道明的工程约定、设计缘由或潜在陷阱；具体当前数值让环境自身去呈现。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">38–50 分钟\u003c/span>\n      \u003ch2 id=\"draft-the-control-loop\">4. 构建微型控制闭环\u003c/h2>\n      \u003cp>下方构建器经过刻意约束，防止你在接口尚未清晰前就写出冗长的迷你手册。你的输入会自动保存在浏览器中，刷新后仍可继续编辑。\u003c/p>\n\n      \u003cdiv class=\"draft-builder\">\n        \u003cdiv class=\"builder-grid\">\n          \u003cdiv class=\"builder-fields\">\n            \u003ch3 id=\"draft-inputs\">四大核心决策\u003c/h3>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"skill-name\">Skill 命名\u003c/label>\n              \u003cinput id=\"skill-name\" value=\"scope-and-evidence\" autocomplete=\"off\">\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"trigger\">触发指针 —— 核心作用与触发时机\u003c/label>\n              \u003ctextarea id=\"trigger\">将实现改动严格限制在明确的作用域内，并如实汇报验证证据。当用户要求在仓库中构建、修改、修复或应用某些内容时使用。\u003c/textarea>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"core-step\">核心行为 —— 沉淀为可复用规范的工程判断\u003c/label>\n              \u003ctextarea id=\"core-step\">将请求的改动解析为明确的目标范围，保留不相关的其他代码，仅在圈定范围内实施修改，并根据变更风险执行对等的检验。\u003c/textarea>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"done-criterion\">交付完成验收标准 —— 可客观检验且要求严格\u003c/label>\n              \u003ctextarea id=\"done-criterion\">当所有请求的交付目标均已实现、所有相关检查均有记录结果、且遗留的不确定性已明确注明而非假装全部通过时方可终止。\u003c/textarea>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"builder-preview\">\n            \u003ch3 id=\"draft-preview-heading\">实时生成的 \u003ccode>SKILL.md\u003c/code>\u003c/h3>\n            \u003cpre>\u003ccode id=\"draft-preview\">\u003c/code>\u003c/pre>\n            \u003cbutton class=\"copy-button\" id=\"copy-draft\" type=\"button\">复制草稿\u003c/button>\n            \u003cp class=\"copy-status\" id=\"copy-status\" aria-live=\"polite\">\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003cspan class=\"label\">以对抗性视角审读草稿\u003c/span>\n        \u003cp>在哪些地方，Agent 实际上可以表面声称合规，但实际执行却大打折扣？例如‘相关检查’依然将判断权交给了模型。这本身没有问题——但如果你的失效场景恰恰集中在此处，就必须给出关于‘何为相关’的精准定义，或指明代码库专属的检查指南。\u003c/p>\n        \u003cp>草稿是否在无谓重复环境信息？如果 \u003ccode>package.json\u003c/code>、\u003ccode>Makefile\u003c/code> 或 \u003ccode>--help\u003c/code> 已经具备权威的测试命令，就绝不要在 Skill 中逐一罗列。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">50–60 分钟\u003c/span>\n      \u003ch2 id=\"test-the-skill\">5. 测试真实行为，而非语言修辞\u003c/h2>\n      \u003cp>一份词藻华丽的文档并不代表 Skill 能在实战中发挥作用。Skill 的核心价值在于建立行为的可预测性：在相似的运行场景下，Agent 应当遵循稳定一致的处理流程，而具体的输出内容则随具体任务灵活变化。\u003c/p>\n\n      \u003ctable class=\"scorecard\">\n        \u003cthead>\n          \u003ctr>\u003cth>测试类型\u003c/th>\u003cth>对比内容\u003c/th>\u003cth>失效信号\u003c/th>\u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>触发测试\u003c/td>\n            \u003ctd>分别运行一个范围内的代码实现请求与一个纯解释说明请求。\u003c/td>\n            \u003ctd>Skill 遗漏了修改请求，或在纯解释过程中被错误触发。\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>反事实测试\u003c/td>\n            \u003ctd>在包含与去除某句争议指令的前提下，运行完全相同的任务。\u003c/td>\n            \u003ctd>输出行为没有可观察的变化；该句子很可能是无实效的空话 (No-op)。\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>对抗边界测试\u003c/td>\n            \u003ctd>提出一个局部改动请求，故意在旁边留有极具诱惑力的无关清理项。\u003c/td>\n            \u003ctd>Agent 擅自跨出既定边界去“顺手优化”其他代码。\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>证据检验测试\u003c/td>\n            \u003ctd>故意使某项相关检查不可用或处于失败状态。\u003c/td>\n            \u003ctd>最终汇报暗示全部验证通过，或刻意隐瞒了未解决的不确定性。\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">本课核心收获\u003c/span>\n        \u003cp>你现在掌握了一套完整的设计闭环：锁定重复失效、明确调用权归属、选择开销最低的信息层、编写可客观检验的完成标准，并通过反事实测试验证每句指令。这远比盲目照抄任何现有 Skill 的文风模板更有价值。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003ch3 id=\"completion-check\">在宣布草稿就绪前，请逐一核对：\u003c/h3>\n        \u003cul>\n          \u003cli>description 是否列出了明确的触发分支，而非宽泛的同义词堆砌？\u003c/li>\n          \u003cli>文件内的每一条指令是否都能在适用场景中实质性改变模型行为？\u003c/li>\n          \u003cli>特定分支的详细参考是否已放置在指针背后按需披露？\u003c/li>\n          \u003cli>低成本的环境事实是否依然交由环境自身去呈现？\u003c/li>\n          \u003cli>验收完成标准是否既可客观检验又具有严格约束力？\u003c/li>\n          \u003cli>是否至少进行了一次反事实测试，以验证争议指令确实配得上其上下文开销？\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"source-notes\">来源笔记\u003c/h2>\n      \u003cp class=\"source-note\">本次实战内容已于 2026 年 8 月 10 日与公共代码仓库完成核对。当前 \u003ccode>writing-for-agents\u003c/code> 参考定义了上下文指针、两类加载负载、信息层级结构、交付完成标准、引导动词及精简机制；仓库 README 文档记录了当前人工调用与模型自动调用的划分。\u003c/p>\n      \u003cul class=\"source-note\">\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills\">仓库 README 与 Skill 目录\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\">\u003ccode>writing-for-agents/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\">\u003ccode>grilling/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_PREFIX = \"mattpocock-skills:session2:\";\n\n    function loadState(key, fallback) {\n      try {\n        const saved = localStorage.getItem(STORAGE_PREFIX + key);\n        return saved ? JSON.parse(saved) : fallback;\n      } catch (error) {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));\n      } catch (error) {\n        // The lesson remains usable when storage is unavailable.\n      }\n    }\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const percent = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      document.querySelector(\"#progress-bar\").style.width = `${Math.min(100, percent)}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    updateProgress();\n\n    function createStepper(config) {\n      const state = loadState(config.storageKey, { index: 0, answers: {} });\n      let index = Math.min(Math.max(0, Number(state.index) || 0), config.items.length - 1);\n      let selected = null;\n\n      const nav = document.querySelector(config.nav);\n      const count = document.querySelector(config.count);\n      const prompt = document.querySelector(config.prompt);\n      const question = config.question ? document.querySelector(config.question) : null;\n      const kicker = config.kicker ? document.querySelector(config.kicker) : null;\n      const choices = document.querySelector(config.choices);\n      const feedback = document.querySelector(config.feedback);\n      const previous = document.querySelector(config.previous);\n      const skip = document.querySelector(config.skip);\n      const check = document.querySelector(config.check);\n      const next = document.querySelector(config.next);\n\n      function renderNav() {\n        nav.replaceChildren();\n        config.items.forEach((item, itemIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"step-pill\";\n          button.textContent = item.shortLabel || `Step ${itemIndex + 1}`;\n          if (itemIndex === index) button.classList.add(\"active\");\n          const answer = state.answers[itemIndex];\n          if (answer?.correct) button.classList.add(\"correct\");\n          else if (answer?.checked) button.classList.add(\"answered\");\n          button.setAttribute(\"role\", \"tab\");\n          button.setAttribute(\"aria-selected\", String(itemIndex === index));\n          button.addEventListener(\"click\", () => goTo(itemIndex));\n          nav.append(button);\n        });\n      }\n\n      function render() {\n        const item = config.items[index];\n        const answer = state.answers[index];\n        selected = answer?.selected ?? null;\n        count.textContent = `${index + 1} / ${config.items.length}`;\n        prompt.textContent = item.prompt;\n        if (question) question.textContent = item.question;\n        if (kicker) kicker.textContent = item.kicker;\n        previous.disabled = index === 0;\n        next.textContent = index === config.items.length - 1 ? \"完成\" : \"下一步 →\";\n        check.disabled = selected === null;\n        choices.replaceChildren();\n\n        item.options.forEach((option, optionIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option.label;\n          button.dataset.tip = option.tip;\n          button.setAttribute(\"aria-label\", `${option.label}. ${option.tip}`);\n          button.setAttribute(\"aria-pressed\", String(optionIndex === selected));\n          if (optionIndex === selected) button.classList.add(\"selected\");\n          if (answer?.checked && optionIndex === item.answer) button.classList.add(\"correct-answer\");\n          button.addEventListener(\"click\", () => selectOption(optionIndex));\n          choices.append(button);\n        });\n\n        if (answer?.checked) {\n          feedback.className = `feedback visible ${answer.correct ? \"correct\" : \"retry\"}`;\n          feedback.textContent = answer.correct ? item.correctFeedback : item.retryFeedback;\n        } else {\n          feedback.className = \"feedback\";\n          feedback.textContent = \"\";\n        }\n\n        renderNav();\n      }\n\n      function selectOption(optionIndex) {\n        selected = optionIndex;\n        state.answers[index] = { selected, checked: false, correct: false };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function checkAnswer() {\n        if (selected === null) return;\n        const item = config.items[index];\n        state.answers[index] = {\n          selected,\n          checked: true,\n          correct: selected === item.answer\n        };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function goTo(nextIndex) {\n        index = nextIndex;\n        state.index = index;\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      previous.addEventListener(\"click\", () => {\n        if (index > 0) goTo(index - 1);\n      });\n\n      skip.addEventListener(\"click\", () => goTo((index + 1) % config.items.length));\n      check.addEventListener(\"click\", checkAnswer);\n      next.addEventListener(\"click\", () => {\n        if (index \u003c config.items.length - 1) {\n          goTo(index + 1);\n          return;\n        }\n        const correctCount = config.items.filter((item, itemIndex) => state.answers[itemIndex]?.correct).length;\n        feedback.className = \"feedback visible correct\";\n        feedback.textContent = correctCount === config.items.length\n          ? config.completeFeedback\n          : `你已到达末尾，完成了 ${config.items.length} 个决策中的 ${correctCount} 个。可使用步骤标签返回任一题目复查。`;\n      });\n\n      render();\n    }\n\n    const briefItems = [\n      {\n        shortLabel: \"失效\",\n        kicker: \"决策 1 · 可观察的失效场景\",\n        prompt: \"哪个切入点能为所提议的 Skill 提供最清晰的职责界定？\",\n        question: \"请选择精准描述具体行为、而非空泛美德的表述：\",\n        options: [\n          { label: \"Agent 在修改代码库时应当更加细心。\", tip: \"泛泛而谈的美德要求，缺乏可观察的验收边界；不同的人有不同的理解，无法形成一致约束。\" },\n          { label: \"在狭窄的局部修改任务中，Agent 擅自改动相邻文件，并汇报未经实际执行的验证结果。\", tip: \"明确指出了两种可观测的具体行为失效：超出范围的越界修改，以及缺乏凭证的虚假验证报告。\" },\n          { label: \"软件工程需要严谨的纪律与良好的技术判断。\", tip: \"道理完全正确但毫无实效；无法作为 Agent 运行后的量化判定信号。\" },\n          { label: \"编写一个大而全的编码最佳实践 Skill。\", tip: \"一开始就追求面面俱到，在核心行为解耦点尚未厘清前便引入过度设计。\" }\n        ],\n        answer: 1,\n        correctFeedback: \"完全正确！锁定这两个清晰可测的失效信号后，你便能针对性设计控制杠杆，并构造对抗性测试案例。\",\n        retryFeedback: \"寻找能够让观察者在 Agent 运行后立即客观判定‘是否发生’的选项。\"\n      },\n      {\n        shortLabel: \"调用权\",\n        kicker: \"决策 2 · 触发权归属\",\n        prompt: \"该实践规范应当在常规代码修改开始时自动生效。谁应该负责触发它？\",\n        question: \"选择契合这一诉求的调用设计：\",\n        options: [\n          { label: \"仅限人工手动调用，因为人类应当保留全部主导权。\", tip: \"仅限人工调用适合高权重的刻意审查仪式，但在日常繁杂的编码修改中极易被遗忘。\" },\n          { label: \"模型可自动发现，并配置精准的修改类触发词。\", tip: \"消耗少量常驻上下文，以便在构建、修改、修复或应用代码时精准自动激活。\" },\n          { label: \"直接将完整 Skill 内容全量写入 AGENTS.md。\", tip: \"会让所有对话轮次（包括问答与不相关任务）始终承受最大上下文负担。\" },\n          { label: \"只要正文写得好，怎么调用无关紧要。\", tip: \"无法被加载的 Skill 等于不存在；检索机制本身就是架构设计的核心一环。\" }\n        ],\n        answer: 1,\n        correctFeedback: \"回答正确。模型自动发现契合日常自动生效的诉求；而精准的描述则将常驻上下文开销严格限制在可控范围内。\",\n        retryFeedback: \"注意区分：人类对决策结果的最终把控权，与记住日常调用具体规范的记忆负担。\"\n      },\n      {\n        shortLabel: \"门禁\",\n        kicker: \"决策 3 · 交付完成验收标准 (Done Criteria)\",\n        prompt: \"哪种终止条件最能有效防止 Agent 提前草率收工？\",\n        question: \"优先选择兼具‘可客观检查’与‘标准严格’的验收项：\",\n        options: [\n          { label: \"当代码实现看起来正确无误时终止。\", tip: \"Agent 仅凭自信语气就能交差，缺乏任何客观可检验的边界。\" },\n          { label: \"当测试套件执行完毕后终止。\", tip: \"虽然可检查但严重欠缺细节：跑了哪些测试？结果如何？若环境缺少测试工具怎么办？\" },\n          { label: \"当所有需求点均有对应代码改动、所有相关检查均有记录结果、且遗留的不确定性已明确说明而非伪造通过时终止。\", tip: \"在交付成果与验证证据上穷尽无遗漏，同时允许如实报告失败或受限情况，不强制掩盖。\" },\n          { label: \"当所有可能的验证手段均全部通过时终止。\", tip: \"过于宽泛且往往不切实际，极易诱使 Agent 随意缩小‘可能’的定义或隐瞒未跑的检查。\" }\n        ],\n        answer: 2,\n        correctFeedback: \"完全正确。该标准要求提供明确的结果清单与证据记录，而不是假定每个环境都能完美跑通所有测试。\",\n        retryFeedback: \"寻找能够促使 Agent 如实报告失败或受限情况、而非将完成简单等同于‘全部绿灯’的选项。\"\n      },\n      {\n        shortLabel: \"验证\",\n        kicker: \"决策 4 · 行为证据与反事实测试\",\n        prompt: \"如何验证‘克制改动，不碰无关代码’这句指令是否真正产生了实效？\",\n        question: \"选择能够单独隔离并衡量该句子行为效果的测试方案：\",\n        options: [\n          { label: \"请资深工程师评估这句话听起来是否足够专业重要。\", tip: \"这是主观的文案评审反馈，无法衡量它对特定模型的实际行为约束力。\" },\n          { label: \"统计添加 Skill 前后包含的单词总数变化。\", tip: \"这仅测量了 Token 开销，没有测量这笔开销究竟换来了多少行为控制力。\" },\n          { label: \"在严格可比的测试中，分别在‘包含’与‘去除’该句子的前提下，运行同一个带有‘极具诱惑力但无关清理项’的狭窄任务。\", tip: \"标准的反事实测试：仅改变存在争议的这句指令，观察目标行为偏差是否发生显著改变。\" },\n          { label: \"直接保留这句话，因为随意删减指令可能存在隐患。\", tip: \"Prompt 冗余沉积正是这样产生的：在没有验证管道是否真正生效前就默认它安全。\" }\n        ],\n        answer: 2,\n        correctFeedback: \"没错！只有当某句话相对于模型的默认基线行为产生了实质性的行为约束时，它才值得占用上下文。\",\n        retryFeedback: \"选择能够单独隔离争议指令、并能精准观察目标失效行为的对比实验。\"\n      }\n    ];\n\n    createStepper({\n      storageKey: \"brief-lab\",\n      items: briefItems,\n      nav: \"#brief-nav\",\n      count: \"#brief-count\",\n      kicker: \"#brief-kicker\",\n      prompt: \"#brief-question\",\n      choices: \"#brief-choices\",\n      feedback: \"#brief-feedback\",\n      previous: \"#brief-prev\",\n      skip: \"#brief-skip\",\n      check: \"#brief-check\",\n      next: \"#brief-next\",\n      completeFeedback: \"设计简报构建完毕：明确的失效场景、自动发现机制、证据充分的交付门禁与反事实测试计划已全部就绪！\"\n    });\n\n    const placementItems = [\n      {\n        shortLabel: \"通用\",\n        prompt: \"在修改代码前，将用户需求精准拆解为明确的目标范围。\",\n        question: \"这条指令应该放置在哪个信息层？\",\n        options: [\n          { label: \"文件内核心步骤\", tip: \"该行为贯穿每次任务执行，并为后续所有动作确立明确的范围边界。\" },\n          { label: \"按需披露的参考文档\", tip: \"最适合仅在特定分支下才需要的材料，而不是通用的首要准则。\" },\n          { label: \"宿主环境自身\", tip: \"用户需求是输入，但将其解析为清晰目标的思维判断无法通过简单查文件获得。\" },\n          { label: \"作为无效指令删除\", tip: \"虽然 Agent 会尝试推断范围，但明确的范围约束正是本 Skill 存在的根本目的——用于稳定该行为。\" }\n        ],\n        answer: 0,\n        correctFeedback: \"回答正确。这是普遍适用、按顺序执行的核心行为，应当放在信息层级的最顶层（文件内）。\",\n        retryFeedback: \"思考：在后续工作安全展开之前，是否每一次执行都需要这个判断步骤？\"\n      },\n      {\n        shortLabel: \"分支\",\n        prompt: \"当改动涉及生产数据库 DDL 时，必须严格遵循 references/production-ddl.md 中的部署与回滚检查清单。\",\n        question: \"详细的检查清单应当放置在哪里？\",\n        options: [\n          { label: \"全量内联在当前文件\", tip: \"这会迫使所有代码修改任务都背负生产 DDL 细节，淹没通用的主干路径。\" },\n          { label: \"按需披露的参考文档\", tip: \"主文件只保留指针与触发条件；仅在真正遇到 DDL 操作时才加载详细上下文。\" },\n          { label: \"仅依赖宿主环境\", tip: \"代码库中虽然可能有 migration 文件，但部署与回滚策略通常属于工程规范约定，无法单从文件推导。\" },\n          { label: \"直接删除该分支\", tip: \"低频发生并不代表不重要；该分支影响重大且加载边界非常清晰。\" }\n        ],\n        answer: 1,\n        correctFeedback: \"正确！对于高风险、特定分支专用的详细清单，正是‘渐进式披露 (Progressive Disclosure)’的最佳应用场景。\",\n        retryFeedback: \"只有在特定分支被触发时材料才有价值，切忌让常规任务分摊这份上下文开销。\"\n      },\n      {\n        shortLabel: \"查环境\",\n        prompt: \"运行 npm test 来执行本仓库的测试套件。\",\n        question: \"假设 package.json 中已经明确定义了当前的 test 命令，这个事实应当放置在哪里？\",\n        options: [\n          { label: \"文件内写死命令\", tip: \"这会重复外部已有且可能变动的信息，一旦 scripts 修改就会沦为过期缓存。\" },\n          { label: \"写入按需披露的参考文档\", tip: \"把重复副本挪到下一层并没有解决‘第二事实来源’带来的维护问题。\" },\n          { label: \"交由宿主环境呈现\", tip: \"Agent 可以极其廉价地检查 package.json，直接从权威来源获取最新的测试命令。\" },\n          { label: \"在每个步骤中反复强调\", tip: \"重复只会浪费上下文预算，并增加维护点。\" }\n        ],\n        answer: 2,\n        correctFeedback: \"完全正确！让 package.json 作为命令的权威来源；Skill 只需记录环境无法直接自述的工程约定或暗坑。\",\n        retryFeedback: \"优先依赖权威且低成本的环境查询，而不是在 Prompt 中缓存副本。\"\n      },\n      {\n        shortLabel: \"无实效\",\n        prompt: \"请保持专业素养，编写高质量、优雅的代码。\",\n        question: \"针对这类表述的最佳处置方式是什么？\",\n        options: [\n          { label: \"作为文件内核心步骤\", tip: \"听起来冠冕堂皇，但既没有定义具体的执行流程，也没有给出客观的验收卡点。\" },\n          { label: \"隐藏到参考文档中\", tip: \"把模糊空洞的文字藏到别处并不会增加其实际的行为约束力。\" },\n          { label: \"交由环境处理\", tip: \"这并非环境事实，而是一条缺乏具体控制杠杆的无效指令。\" },\n          { label: \"作为无效空话 (No-op) 果断删除\", tip: \"直接剔除整句话，除非反事实测试能证实它确实改变了目标模型的行为。\" }\n        ],\n        answer: 3,\n        correctFeedback: \"没错！除非能将其替换为与具体失效模式直接挂钩的明确控制杠杆，否则果断删除。\",\n        retryFeedback: \"思考：如果将这句话彻底删除，Agent 的实际输出行为会有任何可观察的劣变吗？\"\n      }\n    ];\n\n    createStepper({\n      storageKey: \"placement-lab\",\n      items: placementItems,\n      nav: \"#placement-nav\",\n      count: \"#placement-count\",\n      prompt: \"#placement-line\",\n      question: \"#placement-question\",\n      choices: \"#placement-choices\",\n      feedback: \"#placement-feedback\",\n      previous: \"#placement-prev\",\n      skip: \"#placement-skip\",\n      check: \"#placement-check\",\n      next: \"#placement-next\",\n      completeFeedback: \"信息分层完成：通用主干步骤、分支按需披露、环境作为权威事实来源，无效空话已成功剔除！\"\n    });\n\n    const draftFields = [\"skill-name\", \"trigger\", \"core-step\", \"done-criterion\"];\n    const savedDraft = loadState(\"draft-builder\", {});\n    const preview = document.querySelector(\"#draft-preview\");\n    const copyButton = document.querySelector(\"#copy-draft\");\n    const copyStatus = document.querySelector(\"#copy-status\");\n\n    draftFields.forEach((fieldId) => {\n      const field = document.querySelector(`#${fieldId}`);\n      if (typeof savedDraft[fieldId] === \"string\") field.value = savedDraft[fieldId];\n      field.addEventListener(\"input\", updateDraft);\n    });\n\n    function safeSkillName(value) {\n      return value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, \"-\").replace(/^-+|-+$/g, \"\") || \"unnamed-skill\";\n    }\n\n    function currentDraft() {\n      const values = Object.fromEntries(draftFields.map((fieldId) => [fieldId, document.querySelector(`#${fieldId}`).value]));\n      const name = safeSkillName(values[\"skill-name\"]);\n      return `---\\nname: ${name}\\ndescription: ${values.trigger.trim()}\\n---\\n\\n# ${name}\\n\\n${values[\"core-step\"].trim()}\\n\\nThe work is complete when ${values[\"done-criterion\"].trim().replace(/^finish when\\s*/i, \"\")}\\n`;\n    }\n\n    function updateDraft() {\n      const values = Object.fromEntries(draftFields.map((fieldId) => [fieldId, document.querySelector(`#${fieldId}`).value]));\n      saveState(\"draft-builder\", values);\n      preview.textContent = currentDraft();\n      copyStatus.textContent = \"\";\n    }\n\n    copyButton.addEventListener(\"click\", async () => {\n      try {\n        await navigator.clipboard.writeText(currentDraft());\n        copyStatus.textContent = \"草稿已复制到剪贴板。保存的版本仍然保留在当前页面中。\";\n      } catch (error) {\n        copyStatus.textContent = \"剪贴板权限受限，请直接在上方的预览框中手动复制。\";\n      }\n    });\n\n    updateDraft();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session3.html","basePath":"session3.html","lang":"en","kind":"lesson","title":"Skill Case Studies","translations":{"en":"session3.html","zh-CN":"session3.zh-CN.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Skill Case Studies\">\n  \u003ctitle>Skill Case Studies — MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --gold: #9a762f;\n      --gold-soft: #eee3c3;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.82);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 20;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 3px;\n      background: rgba(138, 78, 53, 0.12);\n    }\n\n    .progress-bar {\n      width: 0;\n      height: 100%;\n      background: var(--accent);\n      transition: width 120ms linear;\n    }\n\n    main {\n      width: min(100% - 3rem, 112ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    html[data-studio-width=\"standard\"] main {\n      width: min(100% - 3rem, 88ch);\n    }\n\n    html[data-studio-width=\"wide\"] main {\n      width: min(100% - 3rem, 112ch);\n    }\n\n    html[data-studio-width=\"full\"] main {\n      width: calc(100% - 3rem);\n      max-width: none;\n    }\n\n    header { margin-bottom: 4rem; }\n    section { margin-top: 5rem; scroll-margin-top: 2rem; }\n\n    .eyebrow,\n    .meta,\n    .label,\n    .time,\n    button,\n    code,\n    pre,\n    .case-index,\n    .case-type,\n    .step-pill,\n    .term {\n      font-family: var(--mono);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.9rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3, h4 { line-height: 1.18; }\n\n    h1 {\n      max-width: 12ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.3rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h2 {\n      margin: 0 0 1.1rem;\n      font-size: clamp(1.85rem, 5vw, 2.35rem);\n      font-weight: 500;\n      letter-spacing: -0.028em;\n    }\n\n    h3 { margin: 1.8rem 0 0.65rem; font-size: 1.3rem; }\n    h4 2, 232, 0.52);\n    }\n\n    .map-zone-heading {\n      display: flex;\n      gap: 0.7rem;\n      align-items: baseline;\n      justify-content: space-between;\n      margin-bottom: 0.7rem;\n    }\n\n    .map-zone-heading h4 {\n      margin: 0;\n      font-family: var(--sans);\n      font-size: 0.86rem;\n    }\n\n    .map-zone-heading span:not(.term) {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.65rem;\n    }\n\n    .skill-node {\n      min-width: 0;\n      padding: 0.72rem 0.76rem;\n      border: 1px solid var(--line);\n      border-radius: 0.48rem;\n      background: #fffdf9;\n      transition: border-color 150ms ease, box-shadow 150ms ease, opacity 150ms ease, transform 150ms ease;\n    }\n\n    .skill-node code {\n      display: block;\n      width: fit-content;\n      margin-bottom: 0.28rem;\n      color: var(--accent-dark);\n      font-size: 0.71rem;\n      font-weight: 700;\n    }\n\n    .skill-node span {\n      display: block;\n      color: #514a42;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      line-height: 1.38;\n    }\n\n    .skill-node.is-active {\n      border-color: var(--accent);\n      box-shadow: 0 0 0 2px rgba(138, 78, 53, 0.12);\n      transform: translateY(-1px);\n    }\n\n    .skill-node.is-muted { opacity: 0.3; }\n\n    .router-node {\n      display: grid;\n      grid-template-columns: minmax(8rem, 0.35fr) minmax(0, 1fr);\n      gap: 0.75rem;\n      align-items: center;\n      border-color: var(--accent);\n      background: var(--accent-soft);\n    }\n\n    .router-node code { margin: 0; font-size: 0.78rem; }\n\n    .map-flow-line {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n      gap: 0.55rem;\n      align-items: stretch;\n    }\n\n    .map-flow-line .skill-node { position: relative; }\n\n    .map-flow-line .skill-node:not(:last-child)::after {\n      position: absolute;\n      z-index: 2;\n      top: 50%;\n      right: -0.47rem;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n      transform: translateY(-50%);\n    }\n\n    .implementation-stack {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.4rem;\n      grid-column: span 1;\n    }\n\n    .implementation-stack .skill-node:first-child { grid-column: 1 / -1; }\n    .implementation-stack .skill-node::after { display: none; }\n\n    .map-detour {\n      display: grid;\n      grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr);\n      gap: 0.5rem;\n      align-items: center;\n      margin-top: 0.65rem;\n      padding-top: 0.65rem;\n      border-top: 1px dashed var(--line);\n    }\n\n    .map-detour > span {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.67rem;\n    }\n\n    .map-lanes {\n      display: grid;\n      grid-template-columns: 1.15fr 0.85fr;\n      gap: 0.8rem;\n    }\n\n    .map-grid {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 0.55rem;\n    }\n\n    .map-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n    .map-grid.standalone { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n\n    .map-destination {\n      display: block;\n      margin-top: 0.35rem;\n      color: var(--accent);\n      font-family: var(--mono);\n      font-size: 0.63rem;\n    }\n\n    .map-precondition {\n      display: grid;\n      grid-template-columns: auto minmax(0, 1fr);\n      gap: 0.7rem;\n      align-items: center;\n      border-style: dashed;\n      background: var(--gold-soft);\n    }\n\n    .map-precondition::before {\n      color: var(--gold);\n      content: \"START\";\n      font-family: var(--mono);\n      font-size: 0.62rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n    }\n\n    .map-source {\n      margin: 0.85rem 0 0;\n      color: var(--muted);\n      font-size: 0.78rem;\n    }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      font-size: 0.9em;\n    }\n\n    .term::after,\n    .choice[data-tip]::after {\n      position: absolute;\n      z-index: 30;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(21rem, 80vw);\n      padding: 0.7rem 0.8rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-tip);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .term:hover::after,\n    .term:focus-visible::after,\n    .choice[data-tip]:hover::after,\n    .choice[data-tip]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .case-workbench {\n      width: min(calc(100vw - 3rem), 116ch);\n      margin-left: 50%;\n      overflow: hidden;\n      transform: translateX(-50%);\n    }\n\n    .case-tabs {\n      display: flex;\n      gap: 0.5rem;\n      overflow-x: auto;\n      padding: 1rem 1.1rem;\n      border-bottom: 1px solid var(--line);\n      background: rgba(238, 229, 214, 0.55);\n    }\n\n    button {\n      padding: 0.56rem 0.78rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--ink);\n      background: rgba(255, 253, 248, 0.76);\n      cursor: pointer;\n      font-size: 0.75rem;\n    }\n\n    button:hover,\n    button:focus-visible {\n      border-color: var(--accent);\n      outline: none;\n    }\n\n    button[aria-selected=\"true\"],\n    button[aria-pressed=\"true\"],\n    .primary-button {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    button:disabled { cursor: not-allowed; opacity: 0.45; }\n\n    .case-tab {\n      flex: 0 0 auto;\n      border-radius: 0.45rem;\n      text-align: left;\n    }\n\n    .case-tab span { display: block; color: inherit; font-size: 0.64rem; opacity: 0.75; }\n    .case-tab strong { display: block; margin-top: 0.12rem; font-size: 0.78rem; }\n\n    .case-panel { padding: 1.5rem; }\n    .case-panel[hidden] { display: none; }\n\n    .case-heading {\n      display: grid;\n      grid-template-columns: auto 1fr;\n      gap: 1rem;\n      align-items: start;\n      margin-bottom: 1.3rem;\n    }\n\n    .case-index {\n      display: grid;\n      width: 3.2rem;\n      height: 3.2rem;\n      border-radius: 50%;\n      place-items: center;\n      color: #fffaf1;\n      background: var(--accent);\n      font-size: 0.76rem;\n    }\n\n    .case-type { margin: 0 0 0.2rem; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; }\n    .case-heading h3 { margin: 0; font-size: 1.65rem; }\n    .case-heading p:not(.case-type) { margin: 0.35rem 0 0; color: var(--muted); }\n\n    .source-link {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.35rem;\n      margin-top: 0.65rem;\n      font-family: var(--mono);\n      font-size: 0.72rem;\n      font-weight: 700;\n      text-decoration-thickness: 1px;\n    }\n\n    .manuscript-layout {\n      --source-line-height: 0.78rem;\n      display: grid;\n      grid-template-columns: minmax(0, 2.15fr) minmax(16rem, 0.75fr);\n      gap: 1rem;\n      align-items: stretch;\n      margin-top: 1rem;\n    }\n\n    .skill-manuscript {\n      overflow-x: hidden;\n      margin: 0;\n      padding: 1.2rem 0;\n      border: 1px solid var(--line);\n      border-radius: 0.55rem;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 18px 42px rgba(76, 58, 40, 0.08);\n      font-size: 0.75rem;\n      line-height: var(--source-line-height);\n    }\n\n    .skill-manuscript code {\n      display: block;\n      width: 100%;\n      min-width: 0;\n      padding: 0;\n      color: inherit;\n      background: transparent;\n      font-size: 0;\n    }\n\n    .source-line {\n      position: relative;\n      display: block;\n      min-height: var(--source-line-height);\n      padding: 0 1.1rem 0 4.2rem;\n      font-size: 0.75rem;\n      overflow-wrap: anywhere;\n      white-space: pre-wrap;\n      word-break: break-word;\n    }\n\n    .source-line::before {\n      position: absolute;\n      left: 1.05rem;\n      width: 2.2rem;\n      color: #9e9589;\n      content: attr(data-line);\n      text-align: right;\n    }\n\n    .source-line.annotated {\n      border-left: 3px solid var(--gold);\n      background: var(--gold-soft);\n    }\n\n    .source-line:empty {\n      display: none;\n    }\n\n    .margin-rail {\n      position: relative;\n      min-width: 0;\n      border-left: 1px solid var(--line);\n    }\n\n    .margin-comment {\n      position: absolute;\n      top: var(--note-top, calc(1.2rem + (var(--line) - 1) * var(--source-line-height)));\n      right: 0;\n      left: 1rem;\n      padding: 0.8rem 0.85rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: #fffdf9;\n      box-shadow: var(--shadow);\n    }\n\n    .margin-comment::before {\n      position: absolute;\n      top: 0.95rem;\n      right: 100%;\n      width: 1rem;\n      border-top: 1px solid var(--gold);\n      content: \"\";\n    }\n\n    .margin-marker {\n      display: inline-grid;\n      width: 1.55rem;\n      height: 1.55rem;\n      margin-right: 0.35rem;\n      border-radius: 50%;\n      place-items: center;\n      color: #fffaf1;\n      background: var(--accent);\n      font-family: var(--mono);\n      font-size: 0.62rem;\n      font-weight: 700;\n      vertical-align: middle;\n    }\n\n    .margin-comment strong {\n      font-family: var(--sans);\n      font-size: 0.84rem;\n      vertical-align: middle;\n    }\n\n    .margin-comment p {\n      margin: 0.5rem 0 0;\n      color: #514a42;\n      font-size: 0.82rem;\n      line-height: 1.5;\n    }\n\n    .source-disclosure {\n      margin: 1rem 0 0;\n      padding: 0.8rem 0.9rem;\n      border-radius: 0.45rem;\n      color: var(--muted);\n      background: var(--paper-deep);\n      font-size: 0.84rem;\n    }\n\n    .license-note {\n      margin-top: 1rem;\n      padding: 0.85rem 1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      color: var(--muted);\n      background: rgba(255, 253, 248, 0.65);\n      font-size: 0.82rem;\n    }\n\n    .license-note summary { cursor: pointer; font-family: var(--mono); font-weight: 700; }\n\n    .license-note pre {\n      margin-top: 0.8rem;\n      max-height: 18rem;\n      font-size: 0.7rem;\n      white-space: pre-wrap;\n    }\n\n    .quiz-actions,\n    .ledger-footer {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.8rem;\n      margin-top: 1.3rem;\n      padding-top: 1rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .case-actions {\n      display: grid;\n      grid-template-columns: minmax(12rem, 1fr) auto minmax(12rem, 1fr);\n      gap: 1.5rem;\n      align-items: center;\n      min-height: 6.5rem;\n      margin-top: 2rem;\n      padding: 1.35rem 1.5rem 1.5rem;\n      border-top: 1px solid var(--line);\n      background: rgba(238, 229, 214, 0.5);\n    }\n\n    .case-actions .quiz-action-group { gap: 0.75rem; }\n    .case-actions .case-status { justify-self: center; text-align: center; }\n    .case-nav-next { justify-self: end; }\n\n    .case-status, .lab-count, .ledger-summary {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n    }\n\n    .callout, .field-note { margin: 1.5rem 0; padding: 1.25rem 1.35rem; }\n    .callout.sage { border-left: 4px solid var(--sage); }\n    .callout.blue { border-left: 4px solid var(--blue); }\n    .callout.gold { border-left: 4px solid var(--gold); }\n    .callout p:last-child, .field-note p:last-child { margin-bottom: 0; }\n\n    .matrix {\n      display: grid;\n      grid-template-columns: 1.05fr repeat(3, 1fr);\n      margin-top: 1.5rem;\n      border-top: 1px solid var(--line);\n      border-left: 1px solid var(--line);\n      font-size: 0.84rem;\n    }\n\n    .matrix > div {\n      min-height: 4.7rem;\n      padding: 0.75rem;\n      border-right: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.58);\n    }\n\n    .matrix .matrix-head {\n      min-height: auto;\n      color: #fffaf1;\n      background: var(--accent);\n      font-family: var(--sans);\n      font-weight: 700;\n    }\n\n    .matrix .matrix-head code {\n      color: inherit;\n      background: transparent;\n    }\n\n    .matrix .row-head {\n      color: var(--muted);\n      background: var(--paper-deep);\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 700;\n      text-transform: uppercase;\n    }\n\n    .lab { padding: 1.35rem; }\n\n    .lab-header {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1rem;\n    }\n\n    .lab-header h3 { margin: 0; }\n\n    .step-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.1rem;\n      padding-bottom: 0.8rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .step-pill { padding: 0.35rem 0.68rem; color: var(--muted); font-size: 0.69rem; }\n    .step-pill.active { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); font-weight: 700; }\n    .step-pill.correct { border-color: var(--sage); color: #384937; background: var(--sage-soft); }\n    .step-pill.answered { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n\n    .quiz-kicker { margin: 0; color: var(--accent); font-family: var(--mono); font-size: 0.76rem; }\n    .quiz-prompt { margin: 0.55rem 0 0; font-size: 1.12rem; }\n\n    .choice-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.65rem;\n      margin-top: 1rem;\n    }\n\n    .choice {\n      position: relative;\n      min-height: 4.2rem;\n      border-radius: 0.5rem;\n      font-family: var(--sans);\n      font-size: 0.88rem;\n      line-height: 1.4;\n      text-align: left;\n    }\n\n    .choice.selected { border-color: var(--blue); background: var(--blue-soft); }\n    .choice.correct-answer { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n\n    .feedback {\n      display: none;\n      margin-top: 1rem;\n      padding: 0.9rem 1rem;\n      border-radius: 0.45rem;\n      font-size: 0.9rem;\n    }\n\n    .feedback.visible { display: block; }\n    .feedback.correct { color: #30452f; background: var(--sage-soft); }\n    .feedback.retry { color: #67451a; background: var(--gold-soft); }\n    .quiz-action-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }\n\n    .ledger { overflow: hidden; }\n\n    .ledger-item {\n      display: grid;\n      grid-template-columns: 1.3fr 1fr;\n      gap: 1rem;\n      align-items: center;\n      padding: 1.15rem 1.3rem;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .ledger-item h3 { margin: 0 0 0.3rem; font-size: 1.08rem; }\n    .ledger-item p { margin: 0; color: var(--muted); font-size: 0.88rem; }\n    .ledger-choices { display: flex; justify-content: flex-end; gap: 0.4rem; }\n    .ledger-choice[data-decision=\"adopt\"][aria-pressed=\"true\"] { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n    .ledger-choice[data-decision=\"adapt\"][aria-pressed=\"true\"] { border-color: var(--gold); color: #67451a; background: var(--gold-soft); }\n    .ledger-choice[data-decision=\"reject\"][aria-pressed=\"true\"] { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n    .ledger-footer { margin: 0; padding: 1rem 1.3rem; border-top: 0; }\n\n    .source-note { color: var(--muted); font-size: 0.88rem; }\n\n    @media (max-width: 82
