<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="date" content="2026-08-12">

  <title>MattPocock Skills</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&display=swap");

:root {
  color-scheme: light;
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", Georgia, serif;
  --font-heading-weight: 400;
  --font-body: "Figtree", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --space-1: 4.4px;
  --space-2: 8.8px;
  --space-3: 13.2px;
  --space-4: 17.6px;
  --space-6: 26.4px;
  --space-8: 35.2px;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, var(--color-text) 8%, transparent);
  --shadow-md: 0 4px 12px color-mix(in srgb, var(--color-text) 8%, transparent), 0 1px 2px color-mix(in srgb, var(--color-text) 5%, transparent);
  --shadow-lg: 0 16px 36px color-mix(in srgb, var(--color-text) 12%, transparent), 0 2px 6px color-mix(in srgb, var(--color-text) 6%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  font-weight: 400;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.cs-export-shell {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
}
.cs-export-container {
  max-width: 1700px;
  margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 56px);
}

/* Header */
.cs-export-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 40px;
  padding: clamp(36px, 5vw, 64px) 0 clamp(28px, 3vw, 40px);
  border-bottom: 1px solid var(--color-divider);
}
.cs-export-header-text { min-width: 0; }
.cs-export-title {
  max-width: 20ch;
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: clamp(38px, 6vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}
.cs-export-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
}
.cs-companion-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--color-accent-300);
  background: var(--color-accent-100);
  color: var(--color-accent-800);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
}
.cs-companion-toggle:hover {
  background: var(--color-accent-200);
  border-color: var(--color-accent-400);
}
.cs-companion-toggle.active {
  background: var(--color-accent);
  color: #fff;
  border-color: var(--color-accent);
}
.cs-companion-toggle-icon { font-size: 15px; }

/* Main layout */
.cs-export-layout {
  display: grid;
  gap: clamp(20px, 2.4vw, 40px);
  align-items: start;
  justify-content: start;
  padding: clamp(24px, 3.4vw, 40px) 0 80px;
}

/* Nav */
.cs-export-nav {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
  padding: 22px 18px;
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  max-height: calc(100vh - 48px);
  overflow-y: auto;
}
.cs-export-nav.is-rail {
  padding: 18px 12px;
}
.cs-export-nav.is-rail .cs-export-nav-heading,
.cs-export-nav.is-rail .cs-nav-label {
  display: none;
}
.cs-export-nav-heading {
  padding: 0 10px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}
.cs-page-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cs-nav-item {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--color-neutral-800);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  text-align: left;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.cs-export-nav.is-rail .cs-nav-item {
  grid-template-columns: 28px;
  padding: 8px;
  justify-content: center;
}
.cs-nav-item:hover {
  background: var(--color-accent-200);
}
.cs-nav-item.active {
  background: var(--color-accent-100);
  color: var(--color-accent-800);
  font-weight: 700;
}
.cs-nav-num {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-700);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: background .15s ease, color .15s ease;
}
.cs-nav-item.active .cs-nav-num {
  background: var(--color-accent);
  color: #fff;
}
.cs-nav-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Reader */
.cs-export-reader {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.cs-frame-card {
  border-radius: var(--radius-lg);
  background: #fff;
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid var(--color-divider);
}
.cs-frame-card iframe {
  display: block;
  width: 100%;
  min-height: 560px;
  border: 0;
  background: #fff;
}
.cs-export-pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 6px 0;
}
.cs-btn-prev, .cs-btn-next {
  font-family: var(--font-body);
  font-size: 14.5px;
  font-weight: 700;
  line-height: 1;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s ease;
}
.cs-btn-prev {
  padding: 13px 24px;
  border: 1px solid var(--color-neutral-300);
  background: transparent;
  color: var(--color-text);
}
.cs-btn-prev:hover:not(:disabled) {
  background: var(--color-accent-100);
}
.cs-btn-next {
  padding: 13px 26px;
  border: 1px solid var(--color-accent);
  background: var(--color-accent);
  color: #fff;
}
.cs-btn-next:hover:not(:disabled) {
  background: var(--color-accent-600);
  border-color: var(--color-accent-600);
}
.cs-btn-prev:disabled, .cs-btn-next:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Companion Drawer / Aside */
.cs-companion-drawer {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  max-height: calc(100vh - 48px);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  animation: cs-fade-in .18s ease-out;
}
.cs-companion-drawer[hidden] {
  display: none !important;
}
.cs-companion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--color-divider);
}
.cs-companion-header strong {
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 17px;
  line-height: 1.2;
}
.cs-companion-close {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  border: 0;
  border-radius: 999px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-800);
  font-size: 14px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.cs-companion-close:hover {
  background: var(--color-accent-200);
  color: var(--color-accent-900);
}
.cs-companion-content {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.cs-companion-empty {
  margin: 40px 0 0;
  text-align: center;
  color: var(--color-neutral-700);
  font-size: 14px;
}
.cs-companion-session {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cs-companion-session-title {
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--color-neutral-300);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}
.cs-companion-turn {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 8px;
}
.cs-turn-block {
  padding: 13px 15px;
  border-radius: var(--radius-md);
  font-size: 14px;
  line-height: 1.6;
}
.cs-turn-user {
  background: var(--color-accent-2-100);
  border: 1px solid var(--color-accent-2-300);
  color: var(--color-text);
}
.cs-turn-agent {
  background: #fffdf8;
  border: 1px solid var(--color-divider);
  color: var(--color-text);
}
.cs-turn-author {
  display: block;
  margin-bottom: 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.cs-turn-user .cs-turn-author {
  color: var(--color-accent-2-800);
}
.cs-turn-agent .cs-turn-author {
  color: var(--color-accent-700);
}
.cs-turn-text {
  white-space: pre-wrap;
  word-break: break-word;
}
.cs-turn-reasoning {
  border: 1px solid var(--color-accent-200);
  border-radius: var(--radius-md);
  background: var(--color-accent-100);
  padding: 8px 12px;
  font-size: 12.5px;
  color: var(--color-neutral-800);
}
.cs-turn-reasoning summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--color-accent-800);
  list-style: none;
}
.cs-turn-reasoning summary::-webkit-details-marker {
  display: none;
}
.cs-turn-reasoning ul {
  margin: 8px 0 4px;
  padding-left: 18px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cs-companion-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(46, 43, 37, 0.4);
  z-index: 800;
  backdrop-filter: blur(2px);
}
.cs-companion-backdrop[hidden] {
  display: none !important;
}

@keyframes cs-fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1024px) {
  .cs-export-header {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .cs-export-actions {
    margin-top: 8px;
  }
  .cs-export-layout {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .cs-export-nav {
    position: static;
    max-height: none;
    overflow-y: visible;
  }
  .cs-export-nav .cs-page-list {
    flex-direction: row;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .cs-export-nav .cs-nav-item {
    min-width: 180px;
  }
  .cs-companion-drawer {
    position: fixed;
    top: 20px;
    right: 20px;
    bottom: 20px;
    width: min(440px, calc(100vw - 40px));
    max-height: none;
    z-index: 900;
    box-shadow: var(--shadow-lg);
  }
}

@media print {
  .cs-export-nav, .cs-export-pager, .cs-companion-toggle, .cs-companion-drawer, .cs-companion-backdrop {
    display: none !important;
  }
  .cs-export-layout {
    display: block;
  }
  .cs-frame-card {
    border: 0;
    box-shadow: none;
  }
}
</style>
</head>

  const data = {"pages":[{"path":"syllabus.html","title":"Syllabus","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"syllabus\">\n  \u003ctitle>MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-soft: #ead8ca;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.72);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 32rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      line-height: 1.67;\n    }\n\n    main {\n      width: min(100% - 3rem, 88ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    header { margin-bottom: 3.5rem; }\n\n    .eyebrow,\n    .meta,\n    .duration,\n    button,\n    code {\n      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    .eyebrow {\n      margin: 0 0 0.8rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3 { line-height: 1.18; }\n\n    h1 {\n      max-width: 11ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.4rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    .lede {\n      max-width: 54ch;\n      margin: 1.6rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta {\n      color: var(--muted);\n      font-size: 0.82rem;\n    }\n\n    section { margin-top: 3.75rem; }\n\n    h2 {\n      margin: 0 0 1rem;\n      font-size: 1.75rem;\n      font-weight: 500;\n      letter-spacing: -0.02em;\n    }\n\n    h3 {\n      margin: 0 0 0.45rem;\n      font-size: 1.14rem;\n    }\n\n    p { margin: 0.75rem 0; }\n\n    ul { padding-left: 1.25rem; }\n\n    li + li { margin-top: 0.45rem; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.85em;\n    }\n\n    .promise {\n      padding: 1.35rem 1.5rem;\n      border-left: 3px solid var(--accent);\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .course-path {\n      margin-top: 1.5rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .session-heading {\n      padding: 1.35rem 0 0.45rem;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .session-heading .duration {\n      display: block;\n      margin-bottom: 0.35rem;\n    }\n\n    .session-heading h3 { margin-bottom: 0.35rem; }\n\n    .session-heading p {\n      margin: 0;\n      color: var(--muted);\n      font-size: 0.94rem;\n    }\n\n    .module {\n      display: grid;\n      grid-template-columns: 5.5rem 1fr;\n      gap: 1.2rem;\n      padding: 1.55rem 0;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .duration {\n      padding-top: 0.15rem;\n      color: var(--accent);\n      font-size: 0.76rem;\n    }\n\n    .module p { margin: 0; color: #595249; }\n\n    .examples {\n      display: grid;\n      gap: 0.75rem;\n      margin-top: 1.2rem;\n    }\n\n    .example {\n      padding: 1rem 1.1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      background: var(--card);\n    }\n\n    .example strong { display: block; margin-bottom: 0.25rem; }\n\n    .example p { margin: 0; color: var(--muted); font-size: 0.94rem; }\n\n    .lens {\n      padding: 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: 0.55rem;\n      background: rgba(255, 253, 248, 0.55);\n    }\n\n    .lens-controls {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.55rem;\n      margin: 1rem 0;\n    }\n\n    button {\n      padding: 0.55rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--ink);\n      background: transparent;\n      cursor: pointer;\n      font-size: 0.76rem;\n    }\n\n    button:hover,\n    button:focus-visible,\n    button[aria-pressed=\"true\"] {\n      border-color: var(--accent);\n      outline: none;\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    #lens-note {\n      min-height: 4.9rem;\n      margin: 0;\n      color: #514a42;\n    }\n\n    .principle {\n      color: var(--accent);\n      font-style: italic;\n    }\n\n    .source-note {\n      margin-top: 1.4rem;\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    @media (max-width: 560px) {\n      main { padding-top: 3rem; }\n      .module { grid-template-columns: 1fr; gap: 0.3rem; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Advanced critique and design workshop\u003c/p>\n      \u003ch1 id=\"course-title\">MattPocock Skills\u003c/h1>\n      \u003cp class=\"lede\">A close reading of how Matt Pocock turns software-engineering judgment into small, composable instructions for coding agents—followed by a practical workshop for designing and testing one of your own.\u003c/p>\n      \u003cp class=\"meta\">About 3 hours 20 minutes · three focused sessions · concrete repository examples\u003c/p>\n    \u003c/header>\n\n    \u003csection>\n      \u003ch2 id=\"course-thesis\">Course thesis\u003c/h2>\n      \u003cdiv class=\"promise\">\n        \u003cp>This is not an exhaustive close reading of every skill. We will first map the whole portfolio, then reconstruct the system behind selected files: how a skill is invoked, how responsibilities are divided, how instructions try to control agent variance, and how several skills compose into a workflow.\u003c/p>\n        \u003cp>Then we will critique the system on its own terms and put its strongest ideas to work. Which design choices are robust? Which are personal conventions presented as general principles? What happens when we use them to draft and test a small skill?\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"outcomes\">By the end\u003c/h2>\n      \u003cul>\n        \u003cli>Explain the portfolio as a main idea-to-ship flow with on-ramps, upkeep, vocabulary layers, standalone support, and one-time setup—then distinguish its domain and invocation axes.\u003c/li>\n        \u003cli>Recognize four skill shapes: router, orchestrator, reusable discipline, and reference.\u003c/li>\n        \u003cli>Annotate a \u003ccode>SKILL.md\u003c/code> in terms of triggers, steps, completion criteria, disclosed context, and sources of truth.\u003c/li>\n        \u003cli>Distinguish Matt’s explicit claims from patterns visible in the repository and from our own inference.\u003c/li>\n        \u003cli>Apply a compact scorecard to decide what is worth borrowing, adapting, or rejecting.\u003c/li>\n        \u003cli>Draft a skill from an observable failure, with deliberate invocation ownership and information placement.\u003c/li>\n        \u003cli>Test whether its trigger, scope controls, and completion criteria change agent behavior.\u003c/li>\n        \u003cli>Trace those ideas through contrasting real skills, then analyze an unfamiliar skill without relying on its surface format.\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"course-path\">The three-session path\u003c/h2>\n      \u003cdiv class=\"course-path\">\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">Session 1 · 75 min\u003c/span>\n          \u003ch3 id=\"session-one\">Read the system behind the files\u003c/h3>\n          \u003cp>Reconstruct the architecture, compare skill shapes, and pressure-test the design philosophy before borrowing from it.\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–12 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-map\">1. Map the system before reading prose\u003c/h3>\n            \u003cp>Reconstruct the repository as an architecture: \u003ccode>engineering\u003c/code> versus \u003ccode>productivity\u003c/code>, user-invoked versus model-invoked skills, setup and distribution layers, and the rule that orchestrators call reusable disciplines rather than other orchestrators.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">12–32 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-shapes\">2. Compare four radically different skill shapes\u003c/h3>\n            \u003cp>Read a six-line composition beside a process loop and a dense reference. The question is not “Which format is correct?” but “What responsibility justifies each shape?”\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">32–52 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-drafting\">3. Reverse-engineer the drafting method\u003c/h3>\n            \u003cp>Study trigger descriptions as context pointers; progressive disclosure as an information hierarchy; explicit completion criteria as variance control; leading words as compressed behavior; and pruning as protection against prompt sediment.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">52–68 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-critique\">4. Pressure-test the philosophy\u003c/h3>\n            \u003cp>Examine the tension between composability and hidden coupling, human agency and ritualized process, memorable vocabulary and house jargon, model-agnostic claims and model-relative behavior, confidence and empirical evidence.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">68–75 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-ledger\">5. Produce a borrowing ledger\u003c/h3>\n            \u003cp>Sort the design ideas into \u003cem>adopt\u003c/em>, \u003cem>adapt\u003c/em>, and \u003cem>reject for now\u003c/em>, each with a reason and a test. This becomes the bridge to designing your own high-quality skills later.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">Session 2 · 60 min\u003c/span>\n          \u003ch3 id=\"session-two\">Design a skill that earns its context\u003c/h3>\n          \u003cp>Turn the first session’s critique into an artifact: a compact skill draft and a behavioral test plan.\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–10 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-failure\">1. Start from failure, not format\u003c/h3>\n            \u003cp>Name an observable recurring failure, locate the reusable judgment behind it, and distinguish a behavioral control from a well-intentioned no-op.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">10–22 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-pointer\">2. Write the pointer before the body\u003c/h3>\n            \u003cp>Choose invocation ownership, then write a trigger description that identifies the material and the distinct branches that should load it.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">22–38 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-placement\">3. Place information deliberately\u003c/h3>\n            \u003cp>Sort universal steps, branch-specific reference, environmental sources of truth, and removable no-ops onto the cheapest truthful layer.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">38–50 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-draft\">4. Draft a small control loop\u003c/h3>\n            \u003cp>Build a live \u003ccode>SKILL.md\u003c/code> from four decisions: name, trigger pointer, core behavior, and a checkable, demanding completion criterion.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">50–60 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-test\">5. Test behavior, not eloquence\u003c/h3>\n            \u003cp>Design trigger, counterfactual, adversarial-scope, and evidence tests so every disputed line must earn its context load.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">Session 3 · 65 min\u003c/span>\n          \u003ch3 id=\"session-three\">Case studies: watch the design work\u003c/h3>\n          \u003cp>Orient with the full \u003ccode>ask-matt\u003c/code> system map, read three sharply different skills through the same lenses, then transfer the method to a fresh file.\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–15 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-protocol\">1. See the system, then build a reading protocol\u003c/h3>\n            \u003cp>Carry forward a five-part trace, then use an interactive map reconstructed from \u003ccode>ask-matt\u003c/code> to see all 25 skills as a main flow, on-ramps, upkeep, vocabulary, and standalone support.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">15–45 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-cases\">2. Read three contrasting case files\u003c/h3>\n            \u003cp>Compare \u003ccode>ask-matt\u003c/code> as a human-invoked router, \u003ccode>diagnosing-bugs\u003c/code> as a gated diagnostic discipline, and \u003ccode>code-review\u003c/code> as a parallel two-axis review.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">45–50 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-compare\">3. Compare mechanisms across the cases\u003c/h3>\n            \u003cp>Put the cases into one matrix to separate route selection, premature causal confidence, and competing review criteria.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">50–59 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-transfer\">4. Analyze \u003ccode>tdd\u003c/code> without a walkthrough\u003c/h3>\n            \u003cp>Use question-by-question navigation to classify its shape, inspect its trigger, place its information, and propose a behavior test.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">59–65 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-ledger\">5. Revise the borrowing ledger\u003c/h3>\n            \u003cp>Decide what to adopt, adapt, or reject from each case now that the earlier theory has been made concrete.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"case-files\">Concrete case files\u003c/h2>\n      \u003cp>We will work from a deliberately small sample whose contrasts reveal the design better than an exhaustive catalog.\u003c/p>\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/ask-matt/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>Session 3’s router case: a deliberately human-invoked map that orients and hands off without performing downstream work.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/diagnosing-bugs/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>Session 3’s gated-discipline case: no causal theory before a tight, red-capable feedback loop exists.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/code-review/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>Session 3’s parallel-review case: standards and specification fidelity remain independent so one success cannot mask the other’s failure.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/grill-with-docs/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>A tiny user-invoked composition: metadata plus one instruction to combine \u003ccode>grilling\u003c/code> with \u003ccode>domain-modeling\u003c/code>. Useful for studying orchestration and dependency visibility.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/productivity/grilling/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>A reusable interaction primitive built around a decision tree, a changing “frontier,” explicit rounds, and a stopping condition.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/tdd/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>A discipline expressed as reference plus hard gates: agree testing seams, then run vertical red → green slices while excluding several attractive failure modes.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/productivity/writing-for-agents/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>The repository’s own theory of instruction design: context pointers, two kinds of load, information hierarchy, leading words, completion criteria, and pruning.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"critique-compass\">Your critique compass\u003c/h2>\n      \u003cp>Change lenses while reading. The same design can look elegant under one lens and fragile under another.\u003c/p>\n      \u003cdiv class=\"lens\">\n        \u003cdiv class=\"lens-controls\" role=\"group\" aria-label=\"Choose a critique lens\">\n          \u003cbutton type=\"button\" data-lens=\"architecture\" aria-pressed=\"true\">Architecture\u003c/button>\n          \u003cbutton type=\"button\" data-lens=\"instruction\">Instruction design\u003c/button>\n          \u003cbutton type=\"button\" data-lens=\"evidence\">Evidence\u003c/button>\n        \u003c/div>\n        \u003cp id=\"lens-note\" aria-live=\"polite\">Ask where the seam lies. Does each skill hide substantial behavior behind a small interface, or merely move complexity into implicit dependencies?\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"method\">How we will reason\u003c/h2>\n      \u003cp>Each claim will carry one of three labels:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cstrong>Author claim\u003c/strong> — stated in the repository.\u003c/li>\n        \u003cli>\u003cstrong>Repository observation\u003c/strong> — visible in actual files and relationships.\u003c/li>\n        \u003cli>\u003cstrong>Our inference\u003c/strong> — an interpretation that must survive counterexamples.\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"principle\">The aim is neither admiration nor dismissal. It is to make the design legible enough that disagreement becomes precise.\u003c/p>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"scope\">Scope and assumptions\u003c/h2>\n      \u003cul>\n        \u003cli>You already know the mechanics of \u003ccode>SKILL.md\u003c/code>, \u003ccode>AGENTS.md\u003c/code>, and \u003ccode>CLAUDE.md\u003c/code>; we will not spend time on introductory syntax.\u003c/li>\n        \u003cli>We will use the local clone at \u003ccode>/Users/zhenghe/Workspace/github.com/mattpocock/skills\u003c/code> as the working corpus when the lesson is generated.\u003c/li>\n        \u003cli>We will map every current skill at a glance, but we will not attempt to close-read every file, installation path, or tool integration.\u003c/li>\n        \u003cli>Session 2 produces a compact skill draft and test plan; Session 3 pressure-tests that method against real case files. Installing or maintaining a full skill library remains outside this course.\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"source-note\">Primary reference: \u003ca href=\"https://github.com/mattpocock/skills\">mattpocock/skills\u003c/a>. The sessions favor checked-in source over summaries and note when the local clone differs from the public main branch.\u003c/p>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const lensNotes = {\n      architecture: \"Ask where the seam lies. Does each skill hide substantial behavior behind a small interface, or merely move complexity into implicit dependencies?\",\n      instruction: \"Ask what wording changes behavior. Which triggers, leading words, gates, and completion criteria reduce variance—and which sentences might be no-ops?\",\n      evidence: \"Ask how we know. Is a principle supported by repository structure, repeated outcomes, or only a persuasive explanation? What experiment could falsify it?\"\n    };\n\n    const lensButtons = document.querySelectorAll(\"[data-lens]\");\n    const lensNote = document.querySelector(\"#lens-note\");\n\n    function selectLens(selectedButton) {\n      lensButtons.forEach((button) => {\n        button.setAttribute(\"aria-pressed\", String(button === selectedButton));\n      });\n      lensNote.textContent = lensNotes[selectedButton.dataset.lens];\n    }\n\n    lensButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => selectLens(button));\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session1.html","title":"Reading a Skill System","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Reading a Skill System\">\n  \u003ctitle>Reading a Skill System — MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.8);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% ackground: var(--sage-soft);\n      color: #384937;\n    }\n\n    .quiz-nav-step.answered {\n      border-color: var(--blue);\n      background: var(--blue-soft);\n      color: #334856;\n    }\n\n    .quiz-actions {\n      display: flex;\n      align-items: center;\n      justify-content: flex-end;\n      gap: 0.6rem;\n      flex-wrap: wrap;\n      margin-top: 1.1rem;\n    }\n\n    .quiz-action-group {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.5rem;\n    }\n\n    .next-button,\n    .check-button,\n    .reset-button {\n      padding: 0.55rem 0.85rem;\n      border-radius: 999px;\n      font-family: var(--mono);\n      font-size: 0.74rem;\n      cursor: pointer;\n      transition: all 120ms ease;\n    }\n\n    .next-button,\n    .check-button {\n      border: 1px solid var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .next-button:disabled,\n    .check-button:disabled {\n      cursor: not-allowed;\n      opacity: 0.45;\n    }\n\n    .choice {\n      position: relative;\n    }\n\n    .choice[data-help]::after {\n      position: absolute;\n      z-index: 20;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(19rem, 80vw);\n      padding: 0.65rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-help);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .choice[data-help]:hover::after,\n    .choice[data-help]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .tabs {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.5rem;\n      margin: 1rem 0;\n    }\n\n    .tab { text-align: center; }\n\n    .case-reader { overflow: hidden; }\n\n    .case-content { padding: 1.35rem; }\n\n    .case-content h3 { margin-top: 0; }\n\n    .path {\n      color: var(--muted);\n      font-size: 0.73rem;\n      overflow-wrap: anywhere;\n    }\n\n    pre {\n      margin: 1.15rem 0;\n      padding: 1rem;\n      overflow-x: auto;\n      border-radius: 0.45rem;\n      color: #f8efe3;\n      background: #312c27;\n      font-family: var(--mono);\n      font-size: 0.8rem;\n      line-height: 1.55;\n      white-space: pre-wrap;\n    }\n\n    pre code { padding: 0; color: inherit; background: transparent; font-size: inherit; }\n\n    .case-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1rem;\n    }\n\n    .case-grid div {\n      padding: 0.9rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n    }\n\n    .case-grid p { margin: 0; font-size: 0.92rem; }\n\n    .annotation-layout {\n      display: grid;\n      grid-template-columns: minmax(0, 1.35fr) minmax(12rem, 0.65fr);\n      gap: 1rem;\n      margin-top: 1rem;\n    }\n\n    .skill-sheet {\n      padding: 1rem;\n      border-radius: 0.45rem;\n      color: #f8efe3;\n      background: #312c27;\n      font-family: var(--mono);\n      font-size: 0.76rem;\n      line-height: 1.58;\n    }\n\n    .skill-line {\n      display: block;\n      margin: 0 -0.4rem;\n      padding: 0.08rem 0.4rem;\n      border-left: 3px solid transparent;\n    }\n\n    .skill-line.highlight {\n      border-left-color: #d69a78;\n      background: rgba(214, 154, 120, 0.14);\n    }\n\n    .annotation-controls { display: grid; gap: 0.5rem; align-content: start; }\n    .annotation-button { text-align: left; }\n\n    .annotation-note {\n      min-height: 8rem;\n      margin-top: 0.7rem;\n      padding: 0.85rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-size: 0.88rem;\n    }\n\n    .steps {\n      margin: 1.4rem 0;\n      counter-reset: drafting;\n      list-style: none;\n      padding: 0;\n    }\n\n    .steps li {\n      position: relative;\n      padding: 0 0 1.3rem 3rem;\n      counter-increment: drafting;\n    }\n\n    .steps li::before {\n      position: absolute;\n      top: 0;\n      left: 0;\n      display: grid;\n      width: 2rem;\n      height: 2rem;\n      place-items: center;\n      border: 1px solid var(--accent);\n      border-radius: 50%;\n      color: var(--accent);\n      content: counter(drafting);\n      font-family: var(--mono);\n      font-size: 0.76rem;\n    }\n\n    .steps strong { display: block; }\n\n    .decision-panel { margin-top: 1.8rem; padding: 1.35rem; }\n\n    .invocation-toggle {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.6rem;\n      margin: 1rem 0;\n    }\n\n    .invocation-toggle button {\n      padding: 0.75rem;\n      border-radius: 0.45rem;\n      font-family: var(--mono);\n      font-size: 0.77rem;\n    }\n\n    .load-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1rem;\n      margin-top: 1rem;\n    }\n\n    .meter-label {\n      display: flex;\n      justify-content: space-between;\n      color: var(--muted);\n      font-size: 0.72rem;\n    }\n\n    .meter {\n      height: 0.55rem;\n      margin-top: 0.4rem;\n      overflow: hidden;\n      border-radius: 999px;\n      background: var(--paper-deep);\n    }\n\n    .meter-fill {\n      width: 50%;\n      height: 100%;\n      border-radius: inherit;\n      background: var(--accent);\n      transition: width 220ms ease;\n    }\n\n    .decision-copy {\n      min-height: 4.5rem;\n      margin-bottom: 0;\n      color: #514a42;\n    }\n\n    .comparison {\n      width: 100%;\n      margin: 1.5rem 0;\n      border-collapse: collapse;\n      font-size: 0.93rem;\n    }\n\n    .comparison th,\n    .comparison td {\n      padding: 0.85rem 0.7rem;\n      border-bottom: 1px solid var(--line);\n      text-align: left;\n      vertical-align: top;\n    }\n\n    .comparison th {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n      letter-spacing: 0.04em;\n      text-transform: uppercase;\n    }\n\n    .tag {\n      display: inline-block;\n      padding: 0.15rem 0.42rem;\n      border-radius: 999px;\n      font-size: 0.68rem;\n    }\n\n    .tag.claim { color: var(--accent-dark); background: var(--accent-soft); }\n    .tag.observation { color: #3e553d; background: var(--sage-soft); }\n    .tag.inference { color: #395667; background: var(--blue-soft); }\n\n    .ledger { margin-top: 1.5rem; padding: 1.35rem; }\n\n    .ledger-item {\n      display: grid;\n      grid-template-columns: 1fr auto;\n      gap: 1rem;\n      padding: 1rem 0;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .ledger-item:last-of-type { border-bottom: 0; }\n    .ledger-item p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }\n\n    .ledger-controls {\n      display: flex;\n      gap: 0.35rem;\n      align-items: start;\n    }\n\n    .ledger-choice {\n      padding: 0.42rem 0.55rem;\n      font-size: 0.68rem;\n      text-align: center;\n    }\n\n    .ledger-choice[data-value=\"adopt\"][aria-pressed=\"true\"] { border-color: var(--sage); background: var(--sage); }\n    .ledger-choice[data-value=\"adapt\"][aria-pressed=\"true\"] { border-color: var(--blue); background: var(--blue); }\n    .ledger-choice[data-value=\"reject\"][aria-pressed=\"true\"] { border-color: var(--accent); background: var(--accent); }\n\n    .ledger-summary {\n      margin-top: 1rem;\n      padding: 0.85rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-family: var(--mono);\n      font-size: 0.78rem;\n    }\n\n    .takeaway {\n      margin-top: 2rem;\n      padding: 1.5rem;\n      border-top: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n      color: #4e473f;\n      font-size: 1.14rem;\n      font-style: italic;\n      text-align: center;\n    }\n\n    .sources {\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    @media (max-width: 700px) {\n      main { padding-top: 3.5rem; }\n      .opening,\n      .case-grid,\n      .annotation-layout,\n      .load-grid { grid-template-columns: 1fr; }\n      .invocation-chain { grid-template-columns: 1fr; }\n      .invocation-arrow { transform: rotate(90deg); text-align: center; }\n      .axis-labels,\n      .quadrants { grid-template-columns: 5.5rem 1fr 1fr; }\n      .ledger-item { grid-template-columns: 1fr; }\n    }\n\n    @media (max-width: 480px) {\n      .choice-grid,\n      .invocation-toggle { grid-template-columns: 1fr; }\n      .system-map { overflow-x: auto; }\n      .axis-labels,\n      .quadrants { min-width: 31rem; }\n      .ledger-controls { flex-wrap: wrap; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Session 1 · Close reading\u003c/p>\n      \u003ch1>Read the system behind the files\u003c/h1>\n      \u003cp class=\"lede\">Matt Pocock’s repository is most interesting not as a bag of prompts, but as a proposed architecture for distributing judgment between a human, an agent, and a set of small documents.\u003c/p>\n      \u003cp class=\"meta\">75 minutes · advanced · source-first · interactive\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"reading-rule\">The reading rule\u003c/h2>\n          \u003cp>For every conclusion, ask whether it is an \u003cstrong>author claim\u003c/strong>, a \u003cstrong>repository observation\u003c/strong>, or \u003cstrong>our inference\u003c/strong>.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"working-corpus\">Working corpus\u003c/h2>\n          \u003cp>\u003ccode>README.md\u003c/code> plus five contrasting \u003ccode>SKILL.md\u003c/code> files: \u003ccode>ask-matt\u003c/code>, \u003ccode>grill-with-docs\u003c/code>, \u003ccode>grilling\u003c/code>, \u003ccode>tdd\u003c/code>, and the meta-reference \u003ccode>writing-for-agents\u003c/code>.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–12 minutes\u003c/span>\n      \u003ch2 id=\"map-the-system\">1. Map the system before reading prose\u003c/h2>\n      \u003cp>The repository’s README makes three ambitious claims: the skills are small, adaptable, and composable; they preserve developer control; and they work across models. Treat these as the author’s design intent, not yet as demonstrated results.\u003c/p>\n\n      \u003cdiv class=\"claim-strip\">\n        \u003cspan class=\"label\">Author claim\u003c/span>\n        \u003cp>The collection condenses software-engineering fundamentals into repeatable agent practices without letting a framework own the whole process.\u003c/p>\n      \u003c/div>\n\n      \u003ch3 id=\"two-organizing-axes\">Two organizing axes\u003c/h3>\n      \u003cp>The directory tree supplies a navigation axis: \u003cstrong>engineering\u003c/strong> versus \u003cstrong>productivity\u003c/strong>. Invocation supplies the more consequential architectural axis: who is responsible for noticing that a skill should run?\u003c/p>\n\n      \u003cdiv class=\"system-map\" aria-label=\"Map of representative skills by domain and invocation\">\n        \u003cdiv class=\"axis-labels\">\n          \u003cspan>\u003c/span>\n          \u003cspan>Human must notice\u003c/span>\n          \u003cspan>Model may notice; human can too\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"quadrants\">\n          \u003cdiv class=\"row-label\">Engineering\u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Human-only entry points\u003c/strong>\n            \u003cspan>ask-matt\u003c/span>\n            \u003cspan>grill-with-docs\u003c/span>\n            \u003cspan>implement\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Model-discoverable skills\u003c/strong>\n            \u003cspan>tdd\u003c/span>\n            \u003cspan>diagnosing-bugs\u003c/span>\n            \u003cspan>codebase-design\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"row-label\">Productivity\u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Human-only entry points\u003c/strong>\n            \u003cspan>grill-me\u003c/span>\n            \u003cspan>handoff\u003c/span>\n            \u003cspan>teach\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Model-discoverable skills\u003c/strong>\n            \u003cspan>grilling\u003c/span>\n            \u003cspan>writing-for-agents\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">Important asymmetry\u003c/span>\n        \u003cp>\u003cstrong>Model-invoked does not mean model-only.\u003c/strong> A human can still invoke those skills directly. The description merely adds model discovery. User-invoked skills are the exclusive case: without model-visible descriptions, only a human can start them.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">Repository observation\u003c/span>\n        \u003cp>User-invoked skills carry \u003ccode>disable-model-invocation: true\u003c/code>. Their descriptions serve the human. Model-invoked descriptions stay discoverable to the agent and therefore spend context on every turn. This also lets manual entry points compose model-invoked disciplines.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"invocation-chain\" aria-label=\"Human intent flows through an entry point into model-discoverable supporting skills\">\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>Human intent\u003c/strong>\n          \u003cspan>“Sharpen this design and preserve what we learn.”\u003c/span>\n        \u003c/div>\n        \u003cspan class=\"invocation-arrow\" aria-hidden=\"true\">→\u003c/span>\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>Manual entry point\u003c/strong>\n          \u003cspan>grill-with-docs\u003c/span>\n        \u003c/div>\n        \u003cspan class=\"invocation-arrow\" aria-hidden=\"true\">→\u003c/span>\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>Supporting skills\u003c/strong>\n          \u003cspan>grilling + domain-modeling\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"invocation-is-architecture\">Invocation is architecture\u003c/h3>\n      \u003cp>This is not merely a metadata switch. In the repository’s own theory, it allocates two scarce resources:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cstrong>Context load:\u003c/strong> attention spent by always-visible skill descriptions.\u003c/li>\n        \u003cli>\u003cstrong>Cognitive load:\u003c/strong> attention spent by a human remembering which manual entry point to use.\u003c/li>\n      \u003c/ul>\n      \u003cp>A model-invoked skill buys discoverability with context. A user-invoked skill buys zero automatic context load by making the human its index. A router such as \u003ccode>ask-matt\u003c/code> exists when the manual catalog becomes hard to remember.\u003c/p>\n\n      \u003ch3 id=\"folders-are-navigation\">The folders are navigation, not ontology\u003c/h3>\n      \u003cp>Your everyday meaning of \u003cem>productivity\u003c/em> includes engineering. The repository uses the word more narrowly: \u003cstrong>general workflow that is not inherently about code\u003c/strong>. Under that reading, the two folder names translate more cleanly like this:\u003c/p>\n\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"general-workflow-layer\">Productivity → general workflow\u003c/h4>\n          \u003cp>Cross-domain interaction and context practices: \u003ccode>grilling\u003c/code>, \u003ccode>handoff\u003c/code>, \u003ccode>teach\u003c/code>, and \u003ccode>writing-for-agents\u003c/code>.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"engineering-specialization-layer\">Engineering → software specialization\u003c/h4>\n          \u003cp>Practices whose meaning assumes code, tests, repositories, architecture, or issue trackers: \u003ccode>tdd\u003c/code>, \u003ccode>code-review\u003c/code>, and \u003ccode>implement\u003c/code>.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp>The boundary is deliberately permeable. \u003ccode>grill-with-docs\u003c/code> lives under engineering because it leaves repository artifacts, yet it reuses the general \u003ccode>grilling\u003c/code> primitive. A useful mental model is therefore \u003cstrong>general base layer → engineering application layer\u003c/strong>, not “productive work versus engineering work.”\u003c/p>\n\n      \u003ch3 id=\"independent-skill-axes\">Three independent axes, not one role taxonomy\u003c/h3>\n      \u003cp>A skill should not be forced into one mutually exclusive role. The repository documents invocation and content form; compositional responsibility is an additional course lens. Ask all three questions separately:\u003c/p>\n\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>Axis\u003c/th>\n            \u003cth>Question\u003c/th>\n            \u003cth>Possible profiles\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>Invocation\u003c/td>\n            \u003ctd>Who can discover it?\u003c/td>\n            \u003ctd>Human only · model-discoverable\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Content form\u003c/td>\n            \u003ctd>What does the file mainly contain?\u003c/td>\n            \u003ctd>Steps · reference · a mixture\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Composition\u003c/td>\n            \u003ctd>What job does it perform in the system?\u003c/td>\n            \u003ctd>Router · wrapper · primitive · supporting guide\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">The writing-for-agents correction\u003c/span>\n        \u003cp>\u003ccode>writing-for-agents\u003c/code> is \u003cstrong>reference-led, not passive\u003c/strong>. You invoke it while creating or editing an agent-facing document, and its rules actively shape that work. The caller supplies the writing task; the skill supplies concepts, constraints, and quality criteria. “Reference” describes its content form—not an absence of action.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"classification-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"classify-the-role\">Build the skill profile\u003c/h3>\n          \u003cdiv class=\"lab-header-controls\" aria-label=\"Case navigation\">\n            \u003cbutton class=\"card-arrow\" id=\"role-prev\" type=\"button\" aria-label=\"Previous case\" title=\"Previous case\">←\u003c/button>\n            \u003cspan class=\"lab-count\" id=\"role-count\">1 / 4\u003c/span>\n            \u003cbutton class=\"card-arrow\" id=\"role-skip\" type=\"button\" aria-label=\"Skip to next case\" title=\"Skip to next case\">→\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"quiz-nav\" id=\"role-nav\" role=\"tablist\" aria-label=\"Question cases\">\u003c/div>\n        \u003cp class=\"question-path\" id=\"role-path\">\u003c/p>\n        \u003cbutton class=\"skill-preview-toggle\" id=\"role-source-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"role-source-preview\">Expand skill contents\u003c/button>\n        \u003cdiv class=\"skill-preview\" id=\"role-source-preview\" hidden>\n          \u003cdiv class=\"skill-preview-header\">\n            \u003cstrong>Inside this skill\u003c/strong>\n            \u003ca class=\"skill-preview-link\" id=\"role-source-link\" href=\"#\" target=\"_blank\" rel=\"noreferrer\">Open source file ↗\u003c/a>\n          \u003c/div>\n          \u003cpre>\u003ccode id=\"role-source-excerpt\">\u003c/code>\u003c/pre>\n          \u003cp class=\"preview-caption\">Short source excerpt, followed by a structural outline of the complete file:\u003c/p>\n          \u003cul class=\"preview-outline\" id=\"role-source-outline\">\u003c/ul>\n        \u003c/div>\n        \u003cp class=\"question-text\" id=\"role-question\">\u003c/p>\n        \u003cp class=\"profile-hint\">Hover or focus any option to inspect its definition and role in the system.\u003c/p>\n        \u003cdiv class=\"profile-axes\" id=\"role-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"role-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"check-button\" id=\"role-check\" type=\"button\" disabled>Check profile\u003c/button>\n            \u003cbutton class=\"next-button\" id=\"role-next\" type=\"button\">Next case →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">Our inference\u003c/span>\n        \u003cp>The repository is organized less like a command library and more like a shallow dependency graph: human-visible entry points at the top, reusable behavior and guidance below, and shared vocabulary running through both. These responsibilities can overlap inside one skill.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">12–32 minutes\u003c/span>\n      \u003ch2 id=\"four-skill-shapes\">2. Four skill shapes, one system\u003c/h2>\n      \u003cp>Skill length varies dramatically because these files do different jobs. Select each case and ask: what is its interface, where is its behavior, and what stops it?\u003c/p>\n\n      \u003cdiv class=\"tabs\" role=\"tablist\" aria-label=\"Choose a skill case\">\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"wrapper\" aria-selected=\"true\" aria-pressed=\"true\">Thin wrapper\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"primitive\" aria-selected=\"false\">Primitive\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"discipline\" aria-selected=\"false\">Discipline\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"reference\" aria-selected=\"false\">Reference-led guide\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"case-reader\" aria-live=\"polite\">\n        \u003cdiv class=\"case-content\" id=\"case-content\">\u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"anatomy-bench\">Anatomy bench: how \u003ccode>grilling\u003c/code> controls behavior\u003c/h3>\n      \u003cp>This condensed representation preserves the skill’s control structure. Click an annotation to see what each region contributes.\u003c/p>\n\n      \u003cdiv class=\"annotation-layout\">\n        \u003cdiv class=\"skill-sheet\" aria-label=\"Condensed structure of the grilling skill\">\n          \u003cspan class=\"skill-line\" data-region=\"pointer\">description: Grill relentlessly when stress-testing an idea\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"primitive\">model: decisions form a design tree\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"primitive\">unit: ask the currently unblocked frontier\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"sequence\">loop: ask a round → wait → recompute\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"ownership\">ownership: agent finds facts; human makes decisions\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"completion\">done: frontier empty + user confirms alignment\u003c/span>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"annotation-controls\">\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"pointer\">Trigger pointer\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"primitive\">Leading concepts\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"sequence\">Execution loop\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"ownership\">Agency boundary\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"completion\">Completion criterion\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"annotation-note\" id=\"annotation-note\" aria-live=\"polite\">Choose a layer. The lesson is not that every skill needs all five; it is that each needed layer should have a visible job.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout\">\n        \u003cspan class=\"label\">Close-reading result\u003c/span>\n        \u003cp>\u003ccode>grilling\u003c/code> is small in line count but not vague. It defines a state model (\u003cem>design tree\u003c/em>), a scheduling rule (\u003cem>frontier\u003c/em>), a loop (\u003cem>rounds\u003c/em>), an authority split, and an exhaustive stopping condition. Those named concepts do most of the compression.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">32–52 minutes\u003c/span>\n      \u003ch2 id=\"reverse-engineer-drafting\">3. Reverse-engineer the drafting method\u003c/h2>\n      \u003cp>The repository’s \u003ccode>writing-for-agents\u003c/code> skill is unusually valuable because it exposes a theory of authorship. The following method is a reconstruction from that theory and the case files—not a documented seven-step recipe.\u003c/p>\n\n      \u003col class=\"steps\">\n        \u003cli>\n          \u003cstrong>Start from a recurring failure mode.\u003c/strong>\n          “TDD” is a topic. “Agents write implementation-coupled tests and skip the red state” is a behavioral problem with observable failures.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Choose who must notice.\u003c/strong>\n          If the agent must reach the behavior autonomously—or another skill needs it—pay context load for model invocation. Otherwise, keep it manual.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Choose the skill shape.\u003c/strong>\n          Is this a human entry point, a reusable process, shared reference, or a router over too many manual choices?\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Name the smallest useful mental model.\u003c/strong>\n          Terms such as \u003cem>frontier\u003c/em>, \u003cem>seam\u003c/em>, \u003cem>red\u003c/em>, and \u003cem>tracer bullet\u003c/em> recruit existing concepts and compress repeated instructions.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Make gates and completion criteria observable.\u003c/strong>\n          Prefer “every branch visited” over “understanding reached,” or “one command reproduces the bug” over “investigate thoroughly.”\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Disclose branch-specific reference.\u003c/strong>\n          Keep universal steps in the main file; move examples, mocking guidance, or rare branches behind precise pointers.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Prune against defaults and the environment.\u003c/strong>\n          Remove instructions that do not change model behavior. Do not cache facts the agent can cheaply recover from files or \u003ccode>--help\u003c/code>.\n        \u003c/li>\n      \u003c/ol>\n\n      \u003ch3 id=\"pointer-writing\">The description is executable architecture\u003c/h3>\n      \u003cp>For model-invoked skills, the description has two jobs: name the material and encode distinct trigger branches. A beautiful body behind a weak description may never be loaded. For manual skills, the description becomes a short human-facing summary because the human already supplied the trigger by invoking it.\u003c/p>\n\n      \u003cdiv class=\"decision-panel\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"invocation-tradeoff\">Invocation tradeoff\u003c/h3>\n          \u003cspan class=\"lab-count\">not a quality ranking\u003c/span>\n        \u003c/div>\n        \u003cp>Imagine a new skill that reviews database migrations. Who should be responsible for noticing it?\u003c/p>\n        \u003cdiv class=\"invocation-toggle\" role=\"group\" aria-label=\"Choose invocation ownership\">\n          \u003cbutton type=\"button\" data-invocation=\"user\" aria-pressed=\"true\">Human-invoked\u003c/button>\n          \u003cbutton type=\"button\" data-invocation=\"model\">Model-invoked\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"load-grid\">\n          \u003cdiv>\n            \u003cdiv class=\"meter-label\">\u003cspan>Context load\u003c/span>\u003cspan id=\"context-value\">low\u003c/span>\u003c/div>\n            \u003cdiv class=\"meter\">\u003cdiv class=\"meter-fill\" id=\"context-meter\" style=\"width: 14%\">\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"meter-label\">\u003cspan>Human cognitive load\u003c/span>\u003cspan id=\"cognitive-value\">high\u003c/span>\u003c/div>\n            \u003cdiv class=\"meter\">\u003cdiv class=\"meter-fill\" id=\"cognitive-meter\" style=\"width: 82%\">\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"decision-copy\" id=\"invocation-copy\">Use this when migration review is a deliberate checkpoint the human already remembers. The description can stay human-facing, but no other skill can rely on discovering it automatically.\u003c/p>\n      \u003c/div>\n\n      \u003ch3 id=\"drafting-critique\">Where the drafting theory is strongest—and weakest\u003c/h3>\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"strong-control-levers\">Strong: control levers\u003c/h4>\n          \u003cp>Triggers, gates, completion criteria, sources of truth, and branch-specific disclosure can all be inspected and tested. They turn “write a better prompt” into design decisions.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"weak-causal-claims\">Weak: causal claims\u003c/h4>\n          \u003cp>Claims about negation, leading words, or future-step visibility are plausible, but the repository does not itself provide controlled comparisons across models and tasks.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">52–68 minutes\u003c/span>\n      \u003ch2 id=\"pressure-test\">4. Pressure-test the philosophy\u003c/h2>\n      \u003cp>A serious critique should not reward confidence as evidence. Use the labels below to keep three different moves separate.\u003c/p>\n\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>Move\u003c/th>\n            \u003cth>Example\u003c/th>\n            \u003cth>Question to ask\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag claim\">Author claim\u003c/span>\u003c/td>\n            \u003ctd>The skills work with any model.\u003c/td>\n            \u003ctd>What cross-model evidence would support the scope of “any”?\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag observation\">Observation\u003c/span>\u003c/td>\n            \u003ctd>\u003ccode>grill-with-docs\u003c/code> delegates its behavior to two reusable skills.\u003c/td>\n            \u003ctd>Does the dependency remain easy to discover and change?\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag inference\">Inference\u003c/span>\u003c/td>\n            \u003ctd>Thin wrappers probably reduce duplication but increase hidden coupling.\u003c/td>\n            \u003ctd>What comparison or maintenance history would test that tradeoff?\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003ch3 id=\"balanced-critique\">A balanced critique\u003c/h3>\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"worth-borrowing\">Worth borrowing\u003c/h4>\n          \u003cul>\n            \u003cli>Invocation is treated as a deliberate interface decision.\u003c/li>\n            \u003cli>Thin entry points reuse deeper disciplines.\u003c/li>\n            \u003cli>Completion is often defined exhaustively, not impressionistically.\u003c/li>\n            \u003cli>The environment remains a source of truth instead of being copied into prompts.\u003c/li>\n            \u003cli>Shared vocabulary connects conversation, code, and agent behavior.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"worth-challenging\">Worth challenging\u003c/h4>\n          \u003cul>\n            \u003cli>“Works with any model” is broader than the evidence visible here.\u003c/li>\n            \u003cli>House vocabulary can compress for insiders while taxing newcomers.\u003c/li>\n            \u003cli>Composition moves complexity into dependency discovery and version compatibility.\u003c/li>\n            \u003cli>Hard workflow boundaries may encode one engineer’s preferences as universal rules.\u003c/li>\n            \u003cli>The “no-op” test is explicitly model-relative, so pruning needs repeated evaluation.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"evidence-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"classify-evidence\">Classify the evidence\u003c/h3>\n          \u003cdiv class=\"lab-header-controls\" aria-label=\"Statement navigation\">\n            \u003cbutton class=\"card-arrow\" id=\"evidence-prev\" type=\"button\" aria-label=\"Previous statement\" title=\"Previous statement\">←\u003c/button>\n            \u003cspan class=\"lab-count\" id=\"evidence-count\">1 / 3\u003c/span>\n            \u003cbutton class=\"card-arrow\" id=\"evidence-skip\" type=\"button\" aria-label=\"Skip to next statement\" title=\"Skip to next statement\">→\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"quiz-nav\" id=\"evidence-nav\" role=\"tablist\" aria-label=\"Statement cases\">\u003c/div>\n        \u003cp class=\"question-text\" id=\"evidence-question\">\u003c/p>\n        \u003cp class=\"profile-hint\">Hover or focus any option to inspect how to distinguish claims, observations, and inferences.\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"evidence-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"evidence-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"next-button\" id=\"evidence-next\" type=\"button\">Next statement →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"experiments\">Experiments that would improve the critique\u003c/h3>\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>Question\u003c/th>\n            \u003cth>Smallest useful test\u003c/th>\n            \u003cth>Observable\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>Does a description trigger reliably?\u003c/td>\n            \u003ctd>Run a fixed prompt set with and without one trigger branch.\u003c/td>\n            \u003ctd>Correct invocation rate and false positives.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Do leading words change behavior?\u003c/td>\n            \u003ctd>A/B the named concept against a literal expanded instruction.\u003c/td>\n            \u003ctd>Completion, variance, and token cost.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Does the skill transfer across models?\u003c/td>\n            \u003ctd>Run the same task corpus on several model families.\u003c/td>\n            \u003ctd>Rule adherence and task success, not prose similarity.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Does composition improve maintenance?\u003c/td>\n            \u003ctd>Change one shared behavior in composed and duplicated variants.\u003c/td>\n            \u003ctd>Files touched, regressions, and discoverability failures.\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">68–75 minutes\u003c/span>\n      \u003ch2 id=\"borrowing-ledger\">5. Build your borrowing ledger\u003c/h2>\n      \u003cp>Do not finish with a verdict on the whole repository. Decide principle by principle. \u003cstrong>Adopt\u003c/strong> means the idea transfers as-is; \u003cstrong>adapt\u003c/strong> means it needs a constraint or local translation; \u003cstrong>reject\u003c/strong> means the current evidence does not justify its cost.\u003c/p>\n\n      \u003cdiv class=\"ledger\" id=\"ledger\">\n        \u003cdiv class=\"ledger-item\" data-principle=\"invocation\">\n          \u003cdiv>\n            \u003cstrong>Choose invocation ownership explicitly\u003c/strong>\n            \u003cp>Trade permanent context load against human cognitive load.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for invocation ownership\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"composition\">\n          \u003cdiv>\n            \u003cstrong>Keep entry points thin and compose disciplines\u003c/strong>\n            \u003cp>Reuse behavior through small wrappers such as \u003ccode>grill-with-docs\u003c/code>.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for thin composition\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"completion\">\n          \u003cdiv>\n            \u003cstrong>Write checkable, exhaustive completion criteria\u003c/strong>\n            \u003cp>Define done in terms the agent can verify, not a feeling of completion.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for completion criteria\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"vocabulary\">\n          \u003cdiv>\n            \u003cstrong>Compress behavior into leading words\u003c/strong>\n            \u003cp>Use pretrained concepts such as \u003cem>frontier\u003c/em>, \u003cem>seam\u003c/em>, or \u003cem>tracer bullet\u003c/em>.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for leading words\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"environment\">\n          \u003cdiv>\n            \u003cstrong>Treat the environment as source of truth\u003c/strong>\n            \u003cp>Document the reason or gotcha; let files and tools reveal cheap facts.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for environment as source of truth\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"model-agnostic\">\n          \u003cdiv>\n            \u003cstrong>Assume model-agnostic transfer\u003c/strong>\n            \u003cp>Expect the same skill text to work across model families without adaptation.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for model-agnostic transfer\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-summary\" id=\"ledger-summary\">0 decided · 6 still open\u003c/div>\n        \u003cbutton class=\"reset-button\" id=\"ledger-reset\" type=\"button\">Reset ledger\u003c/button>\n      \u003c/div>\n\n      \u003cp class=\"takeaway\">The durable idea is not “copy these prompts.” It is “treat agent instructions as a designed system of interfaces, dependencies, attention budgets, and observable stopping conditions.”\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"sources\">\n      \u003ch2 id=\"source-notes\">Source notes\u003c/h2>\n      \u003cp>This lesson was checked against the public repository on August 10, 2026. Use your local clone as the primary working copy and compare it with \u003ca href=\"https://github.com/mattpocock/skills\">mattpocock/skills\u003c/a> when exact wording differs.\u003c/p>\n      \u003cul>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/README.md\">Repository README and skill reference\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\">\u003ccode>writing-for-agents/SKILL.md\u003c/code>\u003c/a> and its \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL-MECHANICS.md\">skill mechanics reference\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\"
