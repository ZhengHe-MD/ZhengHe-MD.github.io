高度依赖可精准溯源的一手 Spec 与上下文\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout gold\">\n        \u003cspan class=\"label\">核心综合洞察\u003c/span>\n        \u003cp>“Skill 即行为契约”在此刻具象化为三种不同策略：\u003ccode>ask-matt\u003c/code> 约束的是\u003cstrong>交接边界 (Handoff)\u003c/strong>，\u003ccode>diagnosing-bugs\u003c/code> 约束的是\u003cstrong>形成信任的先后顺序 (Order of belief)\u003c/strong>，而 \u003ccode>code-review\u003c/code> 约束的则是\u003cstrong>独立判断的物理隔离 (Separation of judgment)\u003c/strong>。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">50–59 分钟\u003c/span>\n      \u003ch2 id=\"transfer-lab\">4. 迁移实战：逆向重构 \u003ccode>tdd\u003c/code>\u003c/h2>\n      \u003cp>不再提供现成剖析。以 \u003ccode>tdd\u003c/code> 为例：它是一份面向模型的 Red → Green 循环纪律规范，要求开发前必须敲定测试接缝，按需披露示例与 Mock 指南，并严格禁止横向切片。请运用“五步追踪法”独立推导其设计。\u003c/p>\n\n      \u003cdiv class=\"lab\" id=\"tdd-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"tdd-reconstruction\">构建完整设计追踪\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"tdd-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"tdd-nav\" role=\"tablist\" aria-label=\"TDD 设计追踪考题\">\u003c/div>\n        \u003cp class=\"quiz-kicker\" id=\"tdd-kicker\">\u003c/p>\n        \u003cp class=\"quiz-prompt\" id=\"tdd-prompt\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"tdd-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"tdd-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton id=\"tdd-prev\" type=\"button\">← 上一题\u003c/button>\n            \u003cbutton id=\"tdd-skip\" type=\"button\">跳过\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"primary-button\" id=\"tdd-check\" type=\"button\" disabled>检查答案\u003c/button>\n            \u003cbutton class=\"primary-button\" id=\"tdd-next\" type=\"button\">下一题 →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">59–65 分钟\u003c/span>\n      \u003ch2 id=\"borrowing-ledger\">5. 更新你的取舍决策账本\u003c/h2>\n      \u003cp>请针对各项机制做出取舍，而非全盘肯定或否定整个文件。所有决策将自动在本地保存。\u003c/p>\n\n      \u003cdiv class=\"ledger\" id=\"ledger\">\n        \u003cdiv class=\"ledger-item\" data-principle=\"router\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-router\">不执行下游具体工作的路由器 (Router)\u003c/h3>\n            \u003cp>在面对庞大 Skill 库时极具导航价值；但若全景图与具体实现脱节，容易产生两份事实源。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"对路由器机制的决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"gate\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-gate\">在昂贵推理推演前设立硬性门禁 (Hard Gate)\u003c/h3>\n            \u003cp>有效防止 Agent 凭空臆断；但必须具备清晰精确的放行/求助兜底条件，避免陷入死锁。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"对硬性门禁机制的决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"isolation\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-isolation\">为正交独立判断分配独立上下文 (Context Isolation)\u003c/h3>\n            \u003cp>有效防止某一维度的良好表现掩盖另一维度的缺漏；但会增加并发 Token 消耗与子 Agent 编排复杂度。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"对上下文隔离机制的决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-footer\">\n          \u003cspan class=\"ledger-summary\" id=\"ledger-summary\">0 项已决策 · 3 项待评估\u003c/span>\n          \u003cbutton id=\"ledger-reset\" type=\"button\">重置决策\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003cspan class=\"label\">课程结语\u003c/span>\n        \u003cp>现在你已经掌握了双向推演能力：既能从一份现成 Skill 文件逆向剖析其深层设计取舍，也能从现实中的反复失效出发，正向设计出交互接口、信息分层、门禁闭环与行为测试都严密自洽的优秀 Skill。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"source-notes\">来源说明\u003c/h2>\n      \u003cp class=\"source-note\">本课程内容于 2026 年 8 月 11 日校对自公开仓库。第 2 节中完整收录了各 Skill 的原始源码，未作任何篡改；旁注解析为本课程原创。\u003c/p>\n      \u003cul class=\"source-note\">\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\">\u003ccode>ask-matt/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\">\u003ccode>diagnosing-bugs/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\">\u003ccode>code-review/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\">\u003ccode>tdd/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_PREFIX = \"mattpocock-skills:session3:\";\n\n    function loadState(key, fallback) {\n      try {\n        const saved = localStorage.getItem(STORAGE_PREFIX + key);\n        return saved ? JSON.parse(saved) : fallback;\n      } catch (error) {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));\n      } catch (error) {\n        // 本地存储不可用时不影响阅读与交互\n      }\n    }\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const percent = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      document.querySelector(\"#progress-bar\").style.width = `${Math.min(100, percent)}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    window.addEventListener(\"resize\", updateProgress);\n    updateProgress();\n\n    const mapRouteNotes = {\n      all: \"当前展示全部 Skill。每张卡片概括了 Skill 的核心目标；点击上方场景可高亮对应的执行路径。\",\n      idea: \"新想法路径：先深度质询打磨想法，仅在需要可运行验证时借由交接文档进入原型探索，随后编写规格、拆分工单、测试先行实现并完成评审。\",\n      incoming: \"外部 Issue 路径：仅对非本人创建的原始 Issue 进行分诊，将符合规范的工单交给后续实现、TDD 与双轴评审。\",\n      bug: \"故障排查路径：基于能够稳定复现 (Red) 的反馈闭环排查根因，编写回归测试锁定修复，并在必要时触发架构重构建议。\",\n      fog: \"迷茫任务路径：使用 wayfinder 逐步决策工单化解不确定性，将最终共识收敛为技术规格，随后正常拆解工单并实现。\"\n    };\n    const mapRouteState = loadState(\"skill-system-map\", { route: \"all\" });\n    const mapRouteButtons = Array.from(document.querySelectorAll(\"[data-map-route]\"));\n    const mapSkillNodes = Array.from(document.querySelectorAll(\"[data-skill-map-node]\"));\n    const mapRouteNote = document.querySelector(\"#map-route-note\");\n\n    function showMapRoute(route) {\n      const nextRoute = mapRouteNotes[route] ? route : \"all\";\n      mapRouteState.route = nextRoute;\n      saveState(\"skill-system-map\", mapRouteState);\n\n      mapRouteButtons.forEach((button) => {\n        button.setAttribute(\"aria-pressed\", String(button.dataset.mapRoute === nextRoute));\n      });\n\n      mapSkillNodes.forEach((node) => {\n        const routes = (node.dataset.routes || \"\").split(\" \").filter(Boolean);\n        const active = nextRoute !== \"all\" && routes.includes(nextRoute);\n        node.classList.toggle(\"is-active\", active);\n        node.classList.toggle(\"is-muted\", nextRoute !== \"all\" && !active);\n      });\n\n      mapRouteNote.textContent = mapRouteNotes[nextRoute];\n    }\n\n    mapRouteButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => showMapRoute(button.dataset.mapRoute));\n    });\n\n    showMapRoute(mapRouteState.route);\n\n    const caseState = loadState(\"case-workbench\", { index: 0, skipped: {} });\n    const caseTabs = Array.from(document.querySelectorAll(\"[data-case-index]\"));\n    const casePanels = Array.from(document.querySelectorAll(\"[data-case-panel]\"));\n    const caseStatus = document.querySelector(\"#case-status\");\n    const casePrevious = document.querySelector(\"#case-prev\");\n    const caseSkip = document.querySelector(\"#case-skip\");\n    const caseNext = document.querySelector(\"#case-next\");\n    let caseIndex = Math.min(Math.max(0, Number(caseState.index) || 0), casePanels.length - 1);\n\n    function positionMarginComments() {\n      const compactLayout = window.matchMedia(\"(max-width: 650px)\").matches;\n      const activePanel = casePanels[caseIndex];\n      const layout = activePanel.querySelector(\".manuscript-layout\");\n      const rail = layout.querySelector(\".margin-rail\");\n      const comments = Array.from(rail.querySelectorAll(\".margin-comment\"));\n\n      rail.style.minHeight = \"\";\n      comments.forEach((comment) => comment.style.removeProperty(\"--note-top\"));\n      if (compactLayout) return;\n\n      const layoutTop = layout.getBoundingClientRect().top;\n      let nextAvailableTop = 0;\n      comments.forEach((comment) => {\n        const target = document.querySelector(`#${comment.getAttribute(\"aria-labelledby\")}`);\n        const targetTop = target.getBoundingClientRect().top - layoutTop;\n        const noteTop = Math.max(targetTop, nextAvailableTop);\n        comment.style.setProperty(\"--note-top\", `${noteTop}px`);\n        nextAvailableTop = noteTop + comment.offsetHeight + 12;\n      });\n\n      const manuscriptHeight = layout.querySelector(\".skill-manuscript\").offsetHeight;\n      if (nextAvailableTop > manuscriptHeight) rail.style.minHeight = `${nextAvailableTop}px`;\n    }\n\n    function showCase(nextIndex) {\n      caseIndex = Math.min(Math.max(0, nextIndex), casePanels.length - 1);\n      caseState.index = caseIndex;\n      saveState(\"case-workbench\", caseState);\n\n      caseTabs.forEach((tab, index) => {\n        const active = index === caseIndex;\n        tab.setAttribute(\"aria-selected\", String(active));\n        tab.tabIndex = active ? 0 : -1;\n      });\n\n      casePanels.forEach((panel, index) => {\n        panel.hidden = index !== caseIndex;\n      });\n\n      casePrevious.disabled = caseIndex === 0;\n      caseNext.textContent = caseIndex === casePanels.length - 1 ? \"返回第一个案例 ↺\" : \"下一个案例 →\";\n      const skipped = caseState.skipped[caseIndex] ? \" · 已标记跳过\" : \"\";\n      caseStatus.textContent = `案例 ${caseIndex + 1} / ${casePanels.length}${skipped}`;\n      requestAnimationFrame(positionMarginComments);\n    }\n\n    caseTabs.forEach((tab) => {\n      tab.addEventListener(\"click\", () => showCase(Number(tab.dataset.caseIndex)));\n    });\n\n    casePrevious.addEventListener(\"click\", () => showCase(caseIndex - 1));\n    caseSkip.addEventListener(\"click\", () => {\n      caseState.skipped[caseIndex] = true;\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n    caseNext.addEventListener(\"click\", () => {\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n\n    window.addEventListener(\"resize\", () => requestAnimationFrame(positionMarginComments));\n    if (document.fonts?.ready) document.fonts.ready.then(positionMarginComments);\n\n    showCase(caseIndex);\n\n    const tddItems = [\n      {\n        shortLabel: \"形态\",\n        kicker: \"追踪 1 · 交互接口\",\n        prompt: \"该文件为下游调用它的 Skill 提供了规则、反模式和专业词汇。以下哪种画像最贴切？\",\n        options: [\n          { label: \"人工显式触发的路由器\", tip: \"路由器负责在子 Skill 间导流并交接控制权；而 tdd 则是定义了一套可复用的工程实践纪律。\" },\n          { label: \"模型自主发现的参考规范 + 工程纪律\", tip: \"它的触发词易于被模型主动发现，且其内容指导每一个 Red → Green 循环，而非一次性流程仪式。\" },\n          { label: \"仅由环境动态提供的来源\", tip: \"仓库环境只提供具体测试运行命令，而核心行为准则与反模式无法作为动态事实从环境中自动读取。\" },\n          { label: \"用户显式调用的编排器\", tip: \"该文件没有声明禁止模型调用的元数据，且其主要职责并非编排跨会话的人工交互链路。\" }\n        ],\n        answer: 1,\n        correctFeedback: \"回答正确！调用方式与内容形态是两个正交轴：可被模型主动发现，兼具参考手册与严格工程纪律双重属性。\",\n        retryFeedback: \"提示：请将'谁有权检索调用该 Skill'与'正文内容是分步流程、参考规范还是流程编排'区分开来。\"\n      },\n      {\n        shortLabel: \"指针\",\n        kicker: \"追踪 2 · 触发指针\",\n        prompt: \"以下哪个用户请求最能稳定且无歧义地触发 tdd 技能？\",\n        options: [\n          { label: \"解释为什么我的测试偶尔会挂 (Flaky)。\", tip: \"解释类请求通常需要排查诊断，并不等同于要求测试先行地编写新功能。\" },\n          { label: \"请测试先行 (Test-first) 实现结算功能，一次推进一个红绿切片。\", tip: \"同时命中了功能实现意图与描述字段中'test-first'、'red-green'等显式触发关键词。\" },\n          { label: \"帮我拿这个分支跟 main 分支做一下评审。\", tip: \"这直接对应了 code-review 的固定基准比较场景。\" },\n          { label: \"我该使用哪种工程工作流？\", tip: \"这是 ask-matt 路由器的职责范畴。\" }\n        ],\n        answer: 1,\n        correctFeedback: \"回答正确！该提问不仅明确了构建目标，还精确命中了触发词分支，排除了检索歧义。\",\n        retryFeedback: \"提示：寻找既明确了具体开发任务、又包含了该 Skill 专属触发关键词的请求。\"\n      },\n      {\n        shortLabel: \"分层\",\n        kicker: \"追踪 3 · 信息分层\",\n        prompt: \"项目的具体测试命令从 npm test 变更为 make verify。当前生效的命令应该存放在哪一层？\",\n        options: [\n          { label: \"内嵌在 tdd/SKILL.md 正文中\", tip: \"这会把一套通用的工程纪律退化为特定仓库环境的陈旧缓存。\" },\n          { label: \"写在附带的 tests.md 概念示例中\", tip: \"将易变的项目事实放入展开的参考文档中，依然会制造第二份事实源。\" },\n          { label: \"由项目本地环境动态持有\", tip: \"package.json、Makefile、仓库指南或 CLI --help 才是当前真实命令的权威宿主。\" },\n          { label: \"在循环规则中每一条都重复写一遍\", tip: \"重复强化虽然提高了显眼度，但极大地增加了维护成本与上下文浪费。\" }\n        ],\n        answer: 2,\n        correctFeedback: \"完全正确！通用且不变的流程规范存放在 Skill 中，而易变的项目具体命令则从其真实环境所有者处动态获取（缓存测试通过）。\",\n        retryFeedback: \"运用第 2 课的缓存测试法则：Agent 是否能够低成本直接从权威宿主中读取到最新值？\"\n      },\n      {\n        shortLabel: \"测试\",\n        kicker: \"追踪 4 · 验证证据\",\n        prompt: \"你将如何验证‘严禁横向切片（禁止一口气写完全部测试再去写实现）’这条规则是否对模型真正生效？\",\n        options: [\n          { label: \"询问这句话读起来是否有说服力。\", tip: \"文本编辑上的主观感受无法证明对模型行为产生了实际约束效果。\" },\n          { label: \"用同一项多行为开发任务做有/无该规则的对照实验，统计单循环是否始终保持为‘一个失败测试 → 极简实现’。\", tip: \"严格控制仅变更有争议的一行规则，并对整个执行过程的行为轨迹进行客观量化观察。\" },\n          { label: \"统计最终产出的测试用例总数。\", tip: \"横向批量编写与纵向切片迭代最终可能产生相同数量的测试用例，无法反映执行过程的差异。\" },\n          { label: \"检查所有测试最终是否全部通过 (Green)。\", tip: \"全绿的结果无法反映测试与业务代码是在什么先后时序下被编写出来的。\" }\n        ],\n        answer: 1,\n        correctFeedback: \"回答正确！通过反事实对照实验观察执行过程的时序与粒度，正是验证该规则是否具备真实约束力的唯一硬核证据。\",\n        retryFeedback: \"提示：选择一个能够精准隔离单个句子、且能客观量化测量该句子所宣称约束之行为的对照实验。\"\n      }\n    ];\n\n    function createStepper(config) {\n      const state = loadState(config.storageKey, { index: 0, answers: {} });\n      let index = Math.min(Math.max(0, Number(state.index) || 0), config.items.length - 1);\n      let selected = null;\n\n      const nav = document.querySelector(config.nav);\n      const count = document.querySelector(config.count);\n      const kicker = document.querySelector(config.kicker);\n      const prompt = document.querySelector(config.prompt);\n      const choices = document.querySelector(config.choices);\n      const feedback = document.querySelector(config.feedback);\n      const previous = document.querySelector(config.previous);\n      const skip = document.querySelector(config.skip);\n      const check = document.querySelector(config.check);\n      const next = document.querySelector(config.next);\n\n      function renderNav() {\n        nav.replaceChildren();\n        config.items.forEach((item, itemIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"step-pill\";\n          button.textContent = item.shortLabel;\n          if (itemIndex === index) button.classList.add(\"active\");\n          const answer = state.answers[itemIndex];\n          if (answer?.correct) button.classList.add(\"correct\");\n          else if (answer?.checked) button.classList.add(\"answered\");\n          button.setAttribute(\"role\", \"tab\");\n          button.setAttribute(\"aria-selected\", String(itemIndex === index));\n          button.addEventListener(\"click\", () => goTo(itemIndex));\n          nav.append(button);\n        });\n      }\n\n      function render() {\n        const item = config.items[index];\n        const answer = state.answers[index];\n        selected = answer?.selected ?? null;\n        count.textContent = `${index + 1} / ${config.items.length}`;\n        kicker.textContent = item.kicker;\n        prompt.textContent = item.prompt;\n        previous.disabled = index === 0;\n        next.textContent = index === config.items.length - 1 ? \"完成\" : \"下一题 →\";\n        check.disabled = selected === null;\n        choices.replaceChildren();\n\n        item.options.forEach((option, optionIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option.label;\n          button.dataset.tip = option.tip;\n          button.setAttribute(\"aria-label\", `${option.label}。${option.tip}`);\n          button.setAttribute(\"aria-pressed\", String(optionIndex === selected));\n          if (optionIndex === selected) button.classList.add(\"selected\");\n          if (answer?.checked && optionIndex === item.answer) button.classList.add(\"correct-answer\");\n          button.addEventListener(\"click\", () => selectOption(optionIndex));\n          choices.append(button);\n        });\n\n        if (answer?.checked) {\n          feedback.className = `feedback visible ${answer.correct ? \"correct\" : \"retry\"}`;\n          feedback.textContent = answer.correct ? item.correctFeedback : item.retryFeedback;\n        } else {\n          feedback.className = \"feedback\";\n          feedback.textContent = \"\";\n        }\n        renderNav();\n      }\n\n      function selectOption(optionIndex) {\n        selected = optionIndex;\n        state.answers[index] = { selected, checked: false, correct: false };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function checkAnswer() {\n        if (selected === null) return;\n        const item = config.items[index];\n        state.answers[index] = { selected, checked: true, correct: selected === item.answer };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function goTo(nextIndex) {\n        index = nextIndex;\n        state.index = index;\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      previous.addEventListener(\"click\", () => {\n        if (index > 0) goTo(index - 1);\n      });\n      skip.addEventListener(\"click\", () => goTo((index + 1) % config.items.length));\n      check.addEventListener(\"click\", checkAnswer);\n      next.addEventListener(\"click\", () => {\n        if (index \u003c config.items.length - 1) {\n          goTo(index + 1);\n          return;\n        }\n        const correctCount = config.items.filter((item, itemIndex) => state.answers[itemIndex]?.correct).length;\n        feedback.className = \"feedback visible correct\";\n        feedback.textContent = correctCount === config.items.length\n          ? \"设计追踪全部完成：形态定位、触发指针、信息分层与行为测试均已在新案例中成功推导！\"\n          : `你已完成全部题目，共答对 ${correctCount} / ${config.items.length} 项。可点击上方步骤标签回顾任意题目。`;\n      });\n\n      render();\n    }\n\n    createStepper({\n      storageKey: \"tdd-transfer\",\n      items: tddItems,\n      nav: \"#tdd-nav\",\n      count: \"#tdd-count\",\n      kicker: \"#tdd-kicker\",\n      prompt: \"#tdd-prompt\",\n      choices: \"#tdd-choices\",\n      feedback: \"#tdd-feedback\",\n      previous: \"#tdd-prev\",\n      skip: \"#tdd-skip\",\n      check: \"#tdd-check\",\n      next: \"#tdd-next\"\n    });\n\n    const ledgerItems = Array.from(document.querySelectorAll(\".ledger-item\"));\n    const ledgerState = loadState(\"borrowing-ledger\", {});\n    const ledgerSummary = document.querySelector(\"#ledger-summary\");\n\n    function renderLedger() {\n      ledgerItems.forEach((item) => {\n        const decision = ledgerState[item.dataset.principle];\n        item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n          button.setAttribute(\"aria-pressed\", String(button.dataset.decision === decision));\n        });\n      });\n      const decisions = Object.values(ledgerState);\n      const counts = { adopt: 0, adapt: 0, reject: 0 };\n      decisions.forEach((decision) => {\n        if (counts[decision] !== undefined) counts[decision] += 1;\n      });\n      const open = ledgerItems.length - decisions.length;\n      ledgerSummary.textContent = `${decisions.length} 项已决策 · ${open} 项待评估 · 吸收 ${counts.adopt} · 改造 ${counts.adapt} · 暂不采纳 ${counts.reject}`;\n    }\n\n    ledgerItems.forEach((item) => {\n      item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n        button.addEventListener(\"click\", () => {\n          ledgerState[item.dataset.principle] = button.dataset.decision;\n          saveState(\"borrowing-ledger\", ledgerState);\n          renderLedger();\n        });\n      });\n    });\n\n    document.querySelector(\"#ledger-reset\").addEventListener(\"click\", () => {\n      Object.keys(ledgerState).forEach((key) => delete ledgerState[key]);\n      saveState(\"borrowing-ledger\", ledgerState);\n      renderLedger();\n    });\n\n    renderLedger();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"}],"conversations":[{"id":"01a02c69-4920-7a13-9925-3f06ffc6295e","title":"增加这个课程的中文版，覆盖所有内容，从 syllabus 到所有 sessions","createdAt":"2026-08-23T02:18:12.000Z","updatedAt":"2026-08-23T02:18:12.000Z","turns":[{"id":"01a02c69-afda-77f3-87be-b451686b7b91","prompt":"增加这个课程的中文版，覆盖所有内容，从 syllabus 到所有 sessions","response":"已新增完整中文版，英文原页保持不变：\n\n- `syllabus.zh-CN.html`\n- `session1.zh-CN.html`\n- `session2.zh-CN.html`\n- `session3.zh-CN.html`\n\n所有页面均设置为 `lang=\"zh-CN\"`，并翻译了正文、测验、提示词、按钮和动态反馈。代码、命令、技能名称、引用源码、DOM 属性、JavaScript 逻辑及 `localStorage` 键均已保留。\n\n已通过脚本语法、结构一致性及浏览器交互测试；4 个页面均可正常加载，无控制台错误。","reasoning":[],"createdAt":"2026-08-23T02:18:12.000Z"},{"id":"01a02c8a-1dee-7a50-9b78-f831e47fd262","prompt":"课程结构貌似不太对，中英文应该都都可以切换的。我更新了 interactive-course 项目本身，你看看是不是哪里结构或者格式不对？@/Users/zhenghe/Workspace/github.com/ZhengHe-MD/interactive-course","response":"是，问题主要不在课程文件命名，而是当前运行的 Course Studio 没有加载新版逻辑。\n\n- 课程结构正确：8 个文件能被新版代码识别为 4 个逻辑页面，每组都有 `en` 和 `zh-CN` 版本。\n- 新版已经实现按 `basePath` 合并页面、显示 `EN / 中文` 切换，并在切换后跳转到对应语言文件：[CourseManager.ts](/Users/zhenghe/Workspace/github.com/ZhengHe-MD/interactive-course/server/course/CourseManager.ts:111)、[CourseNav.tsx](/Users/zhenghe/Workspace/github.com/ZhengHe-MD/interactive-course/src/components/CourseNav.tsx:56)、[App.tsx](/Users/zhenghe/Workspace/github.com/ZhengHe-MD/interactive-course/src/App.tsx:327)。\n- 相关测试全部通过：4 个测试文件、30 项测试通过。\n- 但 `localhost:4310` 的实际页面仍显示 8 个独立条目，也没有课程语言切换按钮。端口进程确实来自更新后的 `interactive-course` 目录，因此很可能是更新前启动的旧进程或浏览器仍在使用旧模块。重启开发服务器并硬刷新页面应是第一步。\n\n此外还有两个课程侧的小缺口：\n\n1. [syllabus.zh-CN.html](/Us xt lines now sit close to single-line font height.\n- Empty Markdown source lines are visually collapsed completely.\n- Source content, wrapping, and comment alignment are unchanged.","reasoning":[],"createdAt":"2026-08-10T10:51:05.000Z"},{"id":"019fef93-87bf-7742-a89f-6ef8860ea9f6","prompt":"this should point at line 3, right?","response":"Yes. That comment explains the `description:` field on line 3, not the `name:` field on line 2. The pointer is off by one line. I haven’t edited it yet.","reasoning":[],"createdAt":"2026-08-10T10:51:05.000Z"},{"id":"019fef94-0ca1-7383-bd0c-bb6908eea488","prompt":"update them","response":"Updated all three first comments:\n\n- Case 01 now points to line 4: `disable-model-invocation: true`.\n- Case 02 now points to line 3: its `description`.\n- Case 03 now points to line 3: its `description`.\n\nThe highlights, margin positions, accessibility references, and clickable line links were updated together. I also verified all 28 annotations now consistently target their highlighted lines.","reasoning":[],"createdAt":"2026-08-10T10:51:05.000Z"}]},{"id":"019feab9-9779-7d91-a213-45f70fb4cd2e","title":"I have finished session one. Let's head on to session t…","createdAt":"2026-08-10T08:10:59.000Z","updatedAt":"2026-08-10T10:48:44.000Z","turns":[{"id":"019feab9-cb27-7e90-8ccc-e33083090442","prompt":"I have finished session one. Let's head on to session two.","response":"Session two is ready in [session2.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session2.html).\n\nIt includes navigable exercises, concept tooltips, locally saved progress, and a live `SKILL.md` draft builder. Content reflects the current [repository architecture](https://github.com/mattpocock/skills) and [`writing-for-agents` guidance](https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md).","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019fead2-4bc7-7a71-9c96-8584b8f7ad0b","prompt":"Just out of curiosity, I just revisited the syllabus, and I didn't see the content planned for session two. I accidentally asked you to create the content of session two. So is it breaking our plans, or should we update the syllabus now?","response":"It doesn’t break the learning sequence, but it does expand the original plan.\n\nThe syllabus planned one 75-minute session, and `session1.html` covers all five planned stages. It also explicitly described designing your own skill as a possible follow-on course. `session2.html` naturally became that follow-on: applying the critique by drafting and testing a skill.\n\nSo the cleanest choice is to update the syllabus to reflect a two-session course—without changing either lesson. I haven’t edited it yet because your message asks for a judgment rather than explicitly requesting the change. If you’d like, I can apply that syllabus update.","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019fead4-29c7-7901-9a1a-b479dfcf0bb7","prompt":"yes, apply this syllabus update","response":"Updated [syllabus.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/syllabus.html) into a two-session plan.\n\nIt now includes session two’s five-part workshop, revised outcomes and duration, and clarified scope. Session one’s original plan remains intact.","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019feb38-5a12-7cc1-a48f-961b14d26cba","prompt":"I know the meaning of the sentence, but I don't know how to understand “hunting a no-op” literally.","response":"Literally, it combines two ideas:\n\n- **Hunting** means actively searching for something hidden or hard to notice.\n- A **no-op** (“no operation”) is something that produces no meaningful change.\n\nSo “hunting a no-op” means inspecting the instructions—often sentence by sentence—to find one that sounds useful but does not actually change the agent’s behavior.\n\nFor example:\n\n> Write high-quality code.\n\nIf the agent already tries to do that by default, the sentence may change nothing. You have “caught” a no-op.\n\nA natural mental image is searching through a document for instructions that are merely pretending to work. “Hunting **for** no-ops” would also be slightly more conversational English.","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019feb3b-f513-7fe1-aa80-69b17ab637f3","prompt":"is the leading verb here \"Keep\"?","response":"Yes. **“Keep”** is the first leading verb, and **“report”** is the second:\n\n- **Keep** implementation changes inside scope.\n- **Report** verification evidence honestly.\n\nThen **“Use”** introduces the trigger conditions—it tells the agent *when* to load the skill rather than what behavior to perform.\n\nHere, “leading verbs” is ordinary grammatical language: action verbs placed early to make the required behavior immediately clear.","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019feb3c-f930-7810-9c20-e844887095d3","prompt":"It seems that the Sharper Pointer is to describe the procedure in simple words and then the triggers, instead of describing what a problem it is solving. Is that right?","response":"Mostly right—with one important distinction: the first part describes the skill’s **behavioral contract**, not its procedure.\n\n> Keep changes inside scope and report evidence honestly.\n\nThis says what behavior the skill enforces. It does not explain the steps used to achieve it.\n\nThen:\n\n> Use when the user asks to build, change, fix, or apply…\n\ndescribes when the skill should load.\n\nSo the pattern is:\n\n> **What behavior this skill provides.**  \n> **When the agent should use it.**\n\nThe underlying problem—agents expanding scope or overstating verification—motivates the skill’s design, but usually does not need to occupy the pointer. Put it there only if naming the problem helps the agent recognize an additional trigger, such as:\n\n> Use when changes have repeatedly drifted beyond the requested scope.\n\nDetailed diagnosis, rationale, and procedure belong in the skill body.","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019feb3f-4960-77d1-ba52-2915bd7e8926","prompt":"That is a little bit counterintuitive. I used to think that you have to describe the problems that those skills are solving, and the problems should be independent of each other. But what you said in this session is that we actually need to define the behavioral contract in the description of the skills. Can you elaborate more on that? Why is it better? in simple words intuitively","response":"Your earlier model is useful—it just answers a different question.\n\nThere are three separate things:\n\n1. **Problem:** Why does this skill need to exist?\n2. **Behavioral contract:** What will the skill make the agent do differently?\n3. **Trigger:** When should the agent load it?\n\nThe description mainly needs the last two because its immediate job is helping the agent choose and load the right skill.\n\nA simple analogy is a toolbox label.\n\nA problem-focused label might say:\n\n> For situations where furniture is unstable.\n\nThat explains the problem, but it does not tell you whether the box contains a screwdriver, wood glue, or replacement feet.\n\nA behavioral label is clearer:\n\n> Tightens loose screws. Use when furniture moves because its fasteners are loose.\n\nNow you know both what the tool does and when it applies.\n\nThe same difference appears with skills:\n\n> **Problem only:** Use when implementation quality is unreliable.\n\nThis leaves many questions unanswered. Does the skill add tests, review code, restrict scope, investigate bugs, or improve architecture?\n\n> **Behavior + trigger:** Keep changes inside explicit scope and report verification evidence honestly. Use when making repository changes.\n\nNow the agent knows what behavior it will receive and when that behavior is relevant.\n\nWhy this is usually better:\n\n- One problem can have several possible remedies.\n- Two skills may address the same problem through different behaviors.\n- The behavioral contract lets the agent predict what loading the skill will actually change.\n- The trigger still captures the situations or problems that should activate it.\n\nYour idea about independent problems still matters when deciding skill boundaries. If two behaviors are useful separately, they may deserve separate skills. In our example, scope control and honest verification are grouped because they form one cohesive **implementation completion contract**. But that grouping is a design judgment, not a universal rule.\n\nA useful drafting sequence is therefore:\n\n> **Start from the problem** to discover why the skill should exist.  \n> **Define the behavior** to decide what responsibility the skill owns.  \n> **Write the description as behavior + triggers** so the agent can retrieve it correctly.\n\nThe problem is the reason for building the tool; the behavioral contract is the label on the tool.","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019feb41-bd98-70a2-8372-f73616dfd193","prompt":"write down my question and your explanation to section 2. that's very interesting","response":"Added your question and the explanation to section 2 of [session2.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session2.html).\n\nIt now distinguishes problem, behavioral contract, and trigger, while preserving the nuance about independent skill boundaries.","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019feb44-6673-7243-ab69-7b1556961972","prompt":"does that mean my answers are all wrong?","response":"No. “0 of 4 decisions resolved” means **none were confirmed as correct**, not necessarily that every answer was wrong.\n\nIn this exercise:\n\n- Selecting an answer only records your choice.\n- Pressing **Check** evaluates it.\n- Only a checked, correct answer counts as “resolved.”\n- Skipped or unchecked answers also count as unresolved.\n\nSo if you selected answers and moved forward without pressing **Check**, the result would still say `0 of 4`.\n\nThe wording is admittedly ambiguous. A clearer message would distinguish “correct,” “incorrect,” and “not checked.”","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"},{"id":"019feb49-dcb0-7051-9bfe-08d386253c22","prompt":"I need an example of counterfactual test","response":"Suppose you are testing this sentence in a skill:\n\n> Preserve unrelated work.\n\nCreate a task with a tempting distraction:\n\n> Change the “Submit” button label to “Send.” The same file also contains inconsistent spacing and an unused helper function.\n\nThen perform two fresh runs from the same repository state:\n\n- **Run A:** The skill includes “Preserve unrelated work.”\n- **Run B:** The skill is identical, except that sentence is removed.\n\nObserve the edits:\n\n| Run | Result |\n|---|---|\n| A | Changes only the button label |\n| B | Changes the label, reformats the file, and removes the helper |\n\nThat difference is evidence that the sentence controls scope.\n\nIf both runs change only the label—or both perform extra cleanup—the sentence may be a no-op. Because model behavior varies, repeat the comparison several times before drawing a strong conclusion.\n\nIt is called **counterfactual** because you are asking:\n\n> What would the agent have done if this one instruction had not existed?","reasoning":[],"createdAt":"2026-08-10T08:10:59.000Z"}]},{"id":"019feab3-b5a2-7062-aea5-3d5f629d6dd9","title":"haha","createdAt":"2026-08-10T08:04:33.000Z","updatedAt":"2026-08-10T08:10:36.000Z","turns":[{"id":"019feab3-d2f8-77f1-af6a-72da16a95cab","prompt":"haha","response":"😄 Steering test passed.","reasoning":[],"createdAt":"2026-08-10T08:04:33.000Z"},{"id":"019feab9-15cb-7c22-b5c8-f673aa4545e5","prompt":"hi","response":"Hi again! 👋 What would you like to explore?","reasoning":[],"createdAt":"2026-08-10T08:04:33.000Z"},{"id":"019feab9-343d-7790-a686-c49262907e29","prompt":"trying to steer","response":"Steering works—I received this while you’re in section 3. No files changed.","reasoning":[],"createdAt":"2026-08-10T08:04:33.000Z"}]},{"id":"019fdb29-c964-7cc3-9518-86e26224b8c6","title":"I want to learn something about the Mattpocock's skills…","createdAt":"2026-08-07T07:39:36.000Z","updatedAt":"2026-08-10T07:35:24.000Z","turns":[{"id":"019fdb29-ceab-7351-be71-1447f0702a24","prompt":"I want to learn something about the Mattpocock's skills: /Users/zhenghe/Workspace/github.com/mattpocock/skills (local clone)\nhttps://github.com/mattpocock/skills (remote). I want to learn the design ideas underlying that. how he organize the skills. how he draft each skill, and so on. with concrete examples","response":"Great topic. I can ground the course in the local clone and use real skills as worked examples. Before creating the syllabus, I need four quick choices:\n\n1. **Goal:** Do you mainly want to:\n   - design your own high-quality skills,\n   - maintain a team skill library, or\n   - understand and critique Matt Pocock’s approach?\n\n2. **Depth:** Should we focus on:\n   - practical patterns and reusable techniques, or\n   - a deeper analysis of structure, instruction design, context management, and tradeoffs?\n\n3. **Background:** Have you already written `SKILL.md` files or other agent instructions such as `AGENTS.md`/`CLAUDE.md`?\n\n4. **Time budget:** Would you prefer roughly:\n   - 60–90 minutes,\n   - 3–4 hours, or\n   - a multi-session course with exercises?\n\nShort answers are fine, for example: “Build my own skills; deep analysis; written two skills; 3–4 hours.”","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fdb2b-7033-7b20-8e32-b199af1c6b39","prompt":"1. Understand and critique Mattpocock's approach, and maybe later I will design my own high-quality skills. \n2. a deeper analysis of ...\n3. yes, I knew them well\n4. 60-90 minutes. \n\nbtw, help me update the title of this course to MattPocock Skills","response":"Created [syllabus.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/syllabus.html) and set the course title to **MattPocock Skills**.\n\nThe 75-minute advanced syllabus covers repository architecture, contrasting skill shapes, drafting mechanics, and a critical evaluation framework grounded in [Matt Pocock’s repository](https://github.com/mattpocock/skills). It includes an interactive critique compass. No session lesson was created yet.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe930-e0a2-7502-b9f3-7b9f1989047d","prompt":"I approve this syllabus. Preserve it and create Session 1 as session1.html.","response":"Created [session1.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session1.html), grounded in the current [Matt Pocock skills repository](https://github.com/mattpocock/skills).\n\nIt includes interactive classification, skill annotation, invocation tradeoff, evidence critique, and a borrowing ledger. The approved [syllabus.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/syllabus.html) is unchanged except for its phase marker advancing to `learning`. Metadata, heading IDs, selectors, and JavaScript syntax were verified.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe958-446a-72c3-b531-f2b473b96f05","prompt":"Why does MattPocock intentionally make some of the skills only noticeable by the model and some of them only noticeable by humans? How did he divide the skills between engineering and productivity, since engineering is also a part of productivity, especially for software engineers?","response":"There are two separate classification systems in that diagram, and both need a little qualification.\n\n### 1. “Human notices” versus “model may notice”\n\nThe split is asymmetric:\n\n- A **user-invoked** skill is reachable only when a human explicitly names it.\n- A **model-invoked** skill can be reached automatically by the model, invoked by another skill, **or explicitly invoked by a human**.\n\nSo “model-invoked” does not mean “model-only.” That is why the diagram says **Model may notice**. Matt states this explicitly in [`SKILL-MECHANICS.md`](https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL-MECHANICS.md).\n\nThe reason is an attention-budget tradeoff:\n\n| Invocation | Benefit | Cost |\n|---|---|---|\n| User-invoked | Nothing needs to remain visible to the model | The human must remember when to use it |\n| Model-invoked | The model and other skills can discover it | Its description permanently consumes context and attention |\n\nMatt calls these **cognitive load** and **context load**.\n\nHe generally assigns them different responsibilities:\n\n- **User-invoked skills are deliberate entry points.** They represent the workflow the human intends to begin: `/grill-with-docs`, `/implement`, `/to-spec`, or `/wayfinder`.\n- **Model-invoked skills are reusable disciplines or references.** They express behavior that an entry point—or the model itself—may need: `grilling`, `tdd`, `codebase-design`, or `writing-for-agents`.\n\nFor example:\n\n```text\nhuman chooses /grill-with-docs\n             ↓\nwrapper invokes grilling\n             +\nwrapper invokes domain-modeling\n```\n\nThe human chooses the larger activity. The model-invoked skills supply reusable behavior inside it.\n\nThis also prevents surprising orchestration. You probably do not want the model autonomously deciding to begin a large `wayfinder` or `implement` workflow merely because your message vaguely resembles its trigger. But you may want it to notice that a bug requires `diagnosing-bugs`, or that a test-first request requires `tdd`.\n\nA router such as `ask-matt` compensates for the downside: once humans have too many manual entry points to remember, one manual skill acts as an index.\n\nMy critique is that this design is elegant but depends heavily on descriptions being reliable interfaces. A missing or weak model-facing description can silently break composition; an overly broad one can trigger unwanted behavior.\n\n### 2. “Engineering” versus “Productivity”\n\nYou are right that engineering is productive work. Matt is using **productivity in a narrower, informal sense**: general-purpose work and interaction patterns that are not intrinsically about source code.\n\nThe README describes the distinction as:\n\n- **Engineering:** skills used for code work.\n- **Productivity:** general workflow tools, not code-specific.\n\nThat wording appears in the repository’s [skill reference](https://github.com/mattpocock/skills/blob/main/README.md).\n\nSo the real distinction is closer to:\n\n```text\nGeneral, cross-domain workflow\n├── grilling\n├── handoff\n├── teach\n└── writing-for-agents\n\nSoftware-engineering specialization\n├── tdd\n├── diagnosing-bugs\n├── code-review\n├── implement\n└── codebase-design\n```\n\nA good test is: **Does the skill’s meaning require a software repository?**\n\n- `grilling` can interrogate a business plan, article, product idea, or architecture decision. Therefore it is “productivity.”\n- `tdd` assumes tests, public interfaces, implementation, and code seams. Therefore it is “engineering.”\n- `grill-with-docs` is placed under engineering because it combines the general `grilling` primitive with repository-specific domain documentation and ADRs.\n- `writing-for-agents` is technical, but applies beyond application code—to skills, `AGENTS.md`, `CLAUDE.md`, and pointed-at documents—so Matt treats it as general.\n\nThis means the folders are **navigation categories, not a rigorous ontology**. They describe the skill’s immediate application domain, while invocation describes its architectural role.\n\nI would mentally rename them:\n\n- `productivity` → **general workflow**\n- `engineering` → **software-engineering workflow**\n\nThat removes the misleading implication that engineering is somehow outside productivity. The cross-folder dependencies reinforce this reading: general primitives such as `grilling` sit underneath several engineering workflows. No course files were changed.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe95d-35bd-7592-9baa-dc98fdbfc074","prompt":"Cool, I think you should share some of the ideas you just described in the section one course content.","response":"Updated Section 1 in [session1.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session1.html):\n\n- Clarified the asymmetric invocation model.\n- Added the human entry point → reusable disciplines flow.\n- Reframed `productivity` as “general workflow” and `engineering` as “software specialization.”\n- Explained the folders as navigation layers rather than a strict ontology.\n\nExisting interactions remain intact, and the page structure and JavaScript were verified.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe960-282b-7d30-9001-fc2d535c0148","prompt":"In this Q&A part, I think it will be better to allow the user to expand the contents of the skill.","response":"Updated the classification Q&A in [session1.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session1.html).\n\nEach case now has an **Expand skill contents** control showing:\n\n- A short source excerpt\n- A structural outline of the complete skill\n- A link to the exact repository file\n\nThe panel resets automatically when moving to the next question. JavaScript and selector validation passed.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe964-7668-7210-97dd-0292120587fd","prompt":"What's the difference between a reusable discipline and a shared reference?","response":"The difference is mainly **behavior versus knowledge**:\n\n| | Reusable discipline | Shared reference |\n|---|---|---|\n| Primary job | Makes the agent perform a recurring process | Supplies vocabulary, rules, or evaluation criteria |\n| Owns progress? | Usually yes | Usually no—the calling activity owns progress |\n| Typical structure | Steps, loop, state transitions, gates, stopping condition | Definitions, principles, examples, constraints |\n| Main question | “What should the agent do next?” | “What should the agent know or check?” |\n\nFor example:\n\n- **`grilling` is a reusable discipline.** It runs an interaction: construct a decision tree, identify the frontier, ask one round, wait, recompute, and stop when the frontier is empty.\n- **`writing-for-agents` is a shared reference.** It explains concepts such as context load, pointers, completion criteria, leading words, and pruning. Another activity consults those rules while doing the actual work.\n\nA useful test is:\n\n> If I invoke this by itself, does it create and advance a piece of work?\n\n- If yes, it is probably a **discipline**.\n- If it mostly improves decisions made inside some other process, it is probably a **reference**.\n\nThe boundary is not strict. `tdd`, for example, is a hybrid: it defines a red → green process, but much of its content is reference material about seams, good tests, and anti-patterns. We call it a reusable discipline because the process is its dominant responsibility.\n\nLikewise, both can be model-invoked because other skills may need them:\n\n```text\norchestrator\n    ├── runs a reusable discipline\n    └── consults shared reference\n```\n\nSo these are analytical roles, not official mutually exclusive file types. No course files were changed.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe997-9a22-7981-ae11-b0df2f95df75","prompt":"Is there any document in MattPocock's skills report that explicitly states the taxonomy for the roles of skills?","response":"No—the exact four-way taxonomy in the exercise is **not an official taxonomy explicitly defined by Matt**. It is a course-created analytical lens assembled from several concepts he does document.\n\nWhat Matt explicitly defines:\n\n- **Invocation taxonomy:** `user-invoked` versus `model-invoked`.\n- **User-invoked skills orchestrate; model-invoked skills hold reusable discipline.**\n- **Router skills:** manual indexes that help humans find other manual skills.\n- **Content forms:** steps, reference, or a mixture of both.\n- **Shared reference:** all-reference model-invoked skills can provide one reusable source for multiple callers.\n\nThese ideas appear in the repository [README](https://github.com/mattpocock/skills/blob/main/README.md), [`SKILL-MECHANICS.md`](https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL-MECHANICS.md), and [`writing-for-agents/SKILL.md`](https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md).\n\nThe provenance of our four labels is therefore:\n\n| Course label | Status in Matt’s documentation |\n|---|---|\n| Router | Explicitly defined |\n| Orchestrator | Explicitly described as the job of user-invoked skills, but not formalized as a distinct skill type |\n| Reusable discipline | Explicit phrase for what model-invoked skills tend to hold |\n| Shared reference | Explicit storage/use pattern, but not presented as a mutually exclusive role |\n\nMatt does **not** provide something like:\n\n```text\nEvery skill must be exactly one of:\nrouter | orchestrator | reusable-discipline | shared-reference\n```\n\nNor does he publish a table assigning every skill one of those roles. Some skills would resist such a classification—`tdd`, for example, combines a behavioral loop with substantial reference material.\n\nSo the exercise currently risks sounding more official than it is. A more accurate description would be:\n\n> “Classify the skill by its dominant responsibility using four analytical roles derived from Matt’s documented design concepts.”\n\nThat distinguishes Matt’s explicit invocation taxonomy from our inferred responsibility taxonomy. No course files were changed.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe99c-a55d-7a30-9593-35087c13b998","prompt":"Yes. and especially you said that \"writing-for-agents\" is a shared reference, but actually, when you invoke writing-for-agents, you usually want the agent to write something. It's not only a reference. It's an action guide. So I was confused that this taxonomy kinda has conflicts internally.","response":"You were right—the old taxonomy mixed incompatible dimensions.\n\nI updated Section 1 in [session1.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session1.html) to:\n\n- Replace the forced single-role quiz with three independent axes: invocation, content form, and composition.\n- Classify `writing-for-agents` as a **model-discoverable, reference-led supporting guide**.\n- Explain that reference-led content can actively guide writing.\n- Remove role claims from the system map.\n- Reframe the later case as a “reference-led action guide.”\n\nThe revised interaction and JavaScript validation pass.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe9a5-f3bd-7cf1-ab3f-d2784e3802a2","prompt":"should provide information on those options. what do step-led, reference-led, supporting-guide mean. hover to show","response":"Updated the profile exercise in [session1.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session1.html).\n\nEvery option now explains itself on hover or keyboard focus, including `Step-led`, `Reference-led`, `Mixed`, `Router`, `Wrapper`, `Primitive`, and `Supporting guide`. Definitions are also included in accessible button labels. JavaScript and structural validation pass.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fe9b0-ddc2-7d22-af78-3e6678c1a37b","prompt":"replace Previous and Skip with left and right arrows and put on the upper right corner (next to the card page)","response":"Updated both quiz cards in [session1.html](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session1.html):\n\n- Replaced `Previous` and `Skip` with circular `←` and `→` controls.\n- Positioned them around the page counter in the upper-right corner.\n- Preserved accessible labels and existing navigation behavior.\n- Kept answer/check actions at the bottom.\n\nStructural and JavaScript validation pass.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fea86-9a21-7c51-b2e6-95445557d9b0","prompt":"By the way, what is the drafting method?","response":"Here, **drafting method** means the process used to turn an observed agent failure into a well-structured `SKILL.md`.\n\nIt is not a formally named Matt Pocock methodology. The course reconstructs it from `writing-for-agents`, `SKILL-MECHANICS.md`, and patterns across his skills:\n\n```text\nfailure mode\n    ↓\ninvocation choice\n    ↓\ncontent and composition shape\n    ↓\nleading concepts\n    ↓\ngates and completion criteria\n    ↓\nprogressive disclosure\n    ↓\npruning and testing\n```\n\nConcretely:\n\n1. **Start with a recurring failure**\n\n   Don’t begin with a broad topic such as “database migrations.” Begin with behavior you want to change:\n\n   > Agents approve irreversible schema changes without checking compatibility.\n\n2. **Decide who should notice**\n\n   Should a human deliberately invoke the skill, or should the model discover it whenever schema changes appear?\n\n3. **Choose its shape on separate axes**\n\n   For example:\n\n   - Model-discoverable\n   - Reference-led or mixed\n   - Supporting guide\n\n4. **Introduce useful leading concepts**\n\n   Terms such as `expand-contract`, `backward-compatible`, or `rollback path` compress repeated instructions into memorable concepts.\n\n5. **Add observable gates**\n\n   Instead of “review the migration carefully,” require:\n\n   - Identify every affected reader and writer.\n   - Check compatibility during mixed-version deployment.\n   - Demonstrate a rollback or forward-recovery path.\n\n6. **Disclose conditional material**\n\n   Keep universal migration rules in `SKILL.md`; move PostgreSQL-specific locking guidance or examples into referenced files loaded only when relevant.\n\n7. **Prune and evaluate**\n\n   Remove facts recoverable from repository configuration, duplicated instructions, and sentences that do not change model behavior. Then test whether the trigger and guidance improve real runs.\n\nSo “drafting” is broader than writing prose. It includes designing the skill’s invocation interface, information hierarchy, behavioral controls, dependencies, and evaluation criteria.\n\nImportantly, the seven-step order is **our reconstruction**, while concepts such as invocation ownership, context pointers, completion criteria, leading words, progressive disclosure, and pruning come from Matt’s documents. No course files were changed.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fea8f-48f5-74a0-a2b1-08eef4d7dfdb","prompt":"Does MattPocock introduce any process for pressure testing the skills he maintains? Or based on the evidence, MattPocock doesn't test on those skills?","response":"The evidence supports a middle position:\n\n> Matt appears to test skills through dogfooding, manual scenarios, beta feedback, and iteration—but the public repository does not show a standardized behavioral evaluation suite.\n\n### Evidence that testing happens\n\n- Skills can begin in an `in-progress` bucket where users are explicitly asked to try them and report breakage. This suggests a beta → feedback → promotion loop, although graduation criteria are not formalized. [`skills/in-progress/README.md`](https://github.com/mattpocock/skills/blob/main/skills/in-progress/README.md)\n- Human-facing documentation should include **“It’s working if”** signals that users can observe without inspecting the skill. These are operational success criteria, though not automated tests. [`.agents/writing-docs.md`](https://github.com/mattpocock/skills/blob/main/.agents/writing-docs.md)\n- `writing-for-agents` says disagreements about whether an instruction changes behavior should be settled by running the document. That is an empirical testing principle. [`writing-for-agents/SKILL.md`](https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md)\n- Some repository issues document explicit end-to-end scenario testing. For example, [issue #88](https://github.com/mattpocock/skills/issues/88) says traditional unit tests do not fit the Markdown change and proposes exercising the skill across several repository configurations.\n- Real-world failures are reported and fed back into skill changes. [Issue #614](https://github.com/mattpocock/skills/issues/614), for example, describes repeated `ask-matt` failures observed during a multi-session feature.\n\n### What is not publicly visible\n\nThe repository’s [`package.json`](https://github.com/mattpocock/skills/blob/main/package.json) contains release and version scripts, but no skill-evaluation command. Its only visible GitHub workflow is for releases, not behavioral testing.\n\nI found no public evidence of:\n\n- A fixed prompt or task corpus\n- Expected behavioral traces or golden outputs\n- Before-versus-after or skill-versus-no-skill comparisons\n- Automated trigger-reliability tests\n- Cross-model evaluation\n- Quantitative scoring and regression thresholds\n- CI that blocks a change when skill behavior degrades\n\nThere is some mechanical validation—such as strict plugin-manifest validation—but that establishes packaging correctness, not skill effectiveness.\n\nSo the strongest conclusion is:\n\n| Claim | Evidence |\n|---|---|\n| “Matt doesn’t test his skills” | Not supported |\n| “Matt tests them through use and feedback” | Supported |\n| “Matt has a documented, repeatable evaluation process for every skill” | Not supported publicly |\n| “The skills’ cross-model effectiveness is demonstrated” | Not supported publicly |\n\nThe public maintenance model looks more like **field testing and editorial iteration** than harness-based evaluation. Private tests may exist, but the repository cannot establish that. No course files were changed.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fea93-2ca5-7c92-9062-a779ae66f764","prompt":"Fair enough.","response":"Exactly—the evidence supports careful confidence, not either extreme. No course files were changed.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fea94-60b8-7bc1-b53e-ba8d997643e3","prompt":"what does this line mean? Translate that into Chinese.","response":"A natural Chinese translation is:\n\n> 最后不要简单地给整个仓库下一个总评。\n\nIt means: don’t conclude that the entire repository is simply “good” or “bad.” Evaluate each design principle separately—some ideas may be worth adopting, others adapting or rejecting.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"},{"id":"019fea98-ced9-7da0-a13b-716bd3155ea3","prompt":"I have made my choices on the ledger card, but I don't quite understand what's the feedback on my choices.","response":"The ledger is **not a graded quiz**. There are no correct answers. Its current “feedback” only counts your decisions:\n\n- `6 decided`: you evaluated every principle.\n- `adopt 4`: carry four principles forward as defaults.\n- `adapt 1`: retain one idea with modifications.\n- `reject 1`: do not adopt one claim without better evidence.\n\nYour choices express a coherent position:\n\n- **Adopt invocation ownership:** deliberately decide whether the human or model should notice each skill.\n- **Adapt thin composition:** reuse skills, but probably add safeguards such as explicit dependencies, discoverable relationships, and compatibility checks.\n- **Adopt completion criteria:** require observable definitions of done.\n- **Adopt leading words:** use compact concepts such as `frontier` and `seam`.\n- **Adopt environment as source of truth:** avoid copying easily discoverable repository facts into instructions.\n- **Reject model-agnostic transfer:** do not assume one skill behaves identically across models and harnesses; test it in each relevant environment.\n\nIn short, you accept Matt’s **inspectable design mechanisms**, but reject the unsupported generalization that they transfer unchanged across models. You also see composition as valuable but requiring stronger dependency management.\n\nThe card currently doesn’t explain this interpretation—it only reports totals. I can add personalized, choice-sensitive feedback beneath the summary if you want.","reasoning":[],"createdAt":"2026-08-07T07:39:36.000Z"}]}],"labels":{"eyebrow":"一门在学习过程中共同设计的课程","contents":"课程内容","previous":"上一页","next":"下一页","standalone":"独立课程导出","companionTitle":"共同设计对话与问答","companionToggle":"共同设计对话","companionClose":"关闭","companionEmpty":"此课程暂无共同设计对话记录。","reasoningTitle":"设计思路与考量","learnerPrompt":"学习者","agentResponse":"AI 导师","sessionFallback":"会话","courseEdition":"课程版本"},"allLabels":{"en":{"eyebrow":"A course co-designed through learning","contents":"Course contents","previous":"Previous","next":"Next","standalone":"Standalone course export","companionTitle":"Co-Design Notes & Q&A","companionToggle":"Co-Design Notes","companionClose":"Close","companionEmpty":"No co-design conversations recorded for this course.","reasoningTitle":"Design Rationale","learnerPrompt":"Learner","agentResponse":"AI Mentor","sessionFallback":"Session","courseEdition":"Course edition"},"zh-CN":{"eyebrow":"一门在学习过程中共同设计的课程","contents":"课程内容","previous":"上一页","next":"下一页","standalone":"独立课程导出","companionTitle":"共同设计对话与问答","companionToggle":"共同设计对话","companionClose":"关闭","companionEmpty":"此课程暂无共同设计对话记录。","reasoningTitle":"设计思路与考量","learnerPrompt":"学习者","agentResponse":"AI 导师","sessionFallback":"会话","courseEdition":"课程版本"}},"availableLanguages":["en","zh-CN"],"initialLanguage":"zh-CN"};
  const layout = document.getElementById("cs-export-layout");
  const nav = document.getElementById("cs-export-nav");
  const frame = document.getElementById("cs-course-frame");
  const pageList = document.getElementById("cs-page-list");
  const previous = document.getElementById("cs-previous");
  const next = document.getElementById("cs-next");
  const companionToggle = document.getElementById("cs-companion-toggle");
  const companionDrawer = document.getElementById("cs-companion-drawer");
  const companionClose = document.getElementById("cs-companion-close");
  const companionBackdrop = document.getElementById("cs-companion-backdrop");
  const companionContent = document.getElementById("cs-companion-content");

  let drawerOpen = false;
  let observer;

  function getSlots(lang) {
    const slotMap = new Map();
    data.pages.forEach((p) => {
      const base = p.basePath || p.path.replace(/.[a-zA-Z]{2}(?:-[a-zA-Z]{2,4})?.html$/i, ".html");
      if (!slotMap.has(base)) slotMap.set(base, []);
      slotMap.get(base).push(p);
    });

    const slots = [];
    for (const [basePath, variants] of slotMap.entries()) {
      const matchLang = variants.find((v) => v.lang === lang || (lang === "zh-CN" ? v.path.includes(".zh-CN.") : !v.path.includes(".zh-CN.")));
      const activeVariant = matchLang || variants[0];
      const kind = activeVariant.kind || (basePath === "syllabus.html" || basePath === "index.html" ? "syllabus" : "lesson");
      slots.push({
        basePath,
        kind,
        activeVariant,
        hasMatch: Boolean(matchLang),
        variants,
      });
    }

    return slots.sort((left, right) => {
      const leftSyllabus = left.kind === "syllabus" || left.basePath === "syllabus.html" || left.basePath === "index.html";
      const rightSyllabus = right.kind === "syllabus" || right.basePath === "syllabus.html" || right.basePath === "index.html";
      if (leftSyllabus && !rightSyllabus) return -1;
      if (!leftSyllabus && rightSyllabus) return 1;
      return left.basePath.localeCompare(right.basePath, undefined, { numeric: true });
    });
  }

  function findSlotPosition(slots, path) {
    if (!path) return -1;
    return slots.findIndex((slot) => slot.variants.some((v) => v.path === path));
  }

  function parseInitialState() {
    const params = new URLSearchParams(window.location.search);
    const queryLang = params.get("lang");
    const rawHash = decodeURIComponent(location.hash.slice(1));
    const hashPath = rawHash.split("#")[0];
    const hashSection = rawHash.includes("#") ? rawHash.slice(rawHash.indexOf("#") + 1) : undefined;

    let initialLang = queryLang === "zh-CN" || queryLang === "en" ? queryLang : undefined;
    let matchIndex = hashPath ? data.pages.findIndex((p) => p.path === hashPath) : -1;

    if (matchIndex >= 0) {
      const matchedPage = data.pages[matchIndex];
      if (!initialLang) {
        initialLang = matchedPage.lang || (matchedPage.path.includes(".zh-CN.") ? "zh-CN" : "en");
      }
    } else {
      if (!initialLang) initialLang = data.initialLanguage || "en";
      const defaultSlot = getSlots(initialLang)[0];
      if (defaultSlot) {
        matchIndex = data.pages.findIndex((p) => p.path === defaultSlot.activeVariant.path);
      }
      if (matchIndex < 0) matchIndex = 0;
    }

    return {
      index: matchIndex >= 0 ? matchIndex : 0,
      lang: initialLang || "en",
      section: hashSection,
    };
  }

  const initial = parseInitialState();
  let activeIndex = initial.index;
  let currentLang = initial.lang;

  function updateLayout() {
    const w = window.innerWidth;
    const pad = 2 * Math.min(56, Math.max(20, w * 0.04));
    const gap = Math.min(40, Math.max(20, w * 0.024));
    const avail = Math.min(1700, w) - pad;
    const R = 880, NAV = 272, RAIL = 60;
    const panel = Math.max(280, Math.min(400, Math.round(avail * 0.26)));
    const FLOOR = 460;

    let navMode = "full"; // 'full' | 'rail' | 'none'
    if (avail < 520 + 280 + gap) {
      navMode = "full";
    } else {
      if (avail - NAV - panel - 2 * gap < FLOOR) navMode = "rail";
      if (avail - RAIL - panel - 2 * gap < FLOOR) navMode = "none";
    }

    if (nav) {
      if (navMode === "none") {
        nav.style.display = "none";
      } else if (navMode === "rail") {
        nav.style.display = "flex";
        nav.classList.add("is-rail");
      } else {
        nav.style.display = "flex";
        nav.classList.remove("is-rail");
      }
    }

    if (layout) {
      if (w <= 1024) {
        layout.style.gridTemplateColumns = "";
      } else {
        const navWidth = navMode === "full" ? NAV : (navMode === "rail" ? RAIL : 0);
        const chrome = navWidth ? navWidth + 2 * gap : gap;
        const readerWidth = Math.max(460, Math.min(R, Math.round(avail - chrome - panel)));
        const navCol = navWidth ? (navWidth + "px ") : "";
        layout.style.gridTemplateColumns = drawerOpen
          ? (navCol + "minmax(0, " + readerWidth + "px) " + panel + "px")
          : (navCol + "minmax(0, " + readerWidth + "px)");
      }
    }
  }

  function updateChromeLabels(lang) {
    const labels = data.allLabels?.[lang] || data.labels;
    document.documentElement.lang = lang;
    if (previous) previous.textContent = "← " + labels.previous;
    if (next) next.textContent = labels.next + " →";
    const toggleLabel = document.getElementById("cs-companion-toggle-label");
    if (toggleLabel) toggleLabel.textContent = labels.companionToggle;
    const drawerHeading = companionDrawer?.querySelector(".cs-companion-header strong");
    if (drawerHeading) drawerHeading.textContent = labels.companionTitle;
    const navHeading = nav?.querySelector(".cs-export-nav-heading");
    if (navHeading) navHeading.textContent = labels.contents;

    document.querySelectorAll(".cs-lang-pill").forEach((pill) => {
      pill.classList.toggle("active", pill.getAttribute("data-lang") === lang);
    });
  }

  function renderNavigation() {
    const slots = getSlots(currentLang);
    let lessonCount = 0;
    pageList.replaceChildren(...slots.map((slot) => {
      const page = slot.activeVariant;
      const pageIndex = data.pages.findIndex((p) => p.path === page.path);
      const isSyllabus = slot.kind === "syllabus";
      if (!isSyllabus) lessonCount += 1;
      const numLabel = isSyllabus ? "—" : String(lessonCount).padStart(2, "0");
      const isSelected = slot.variants.some((v) => v.path === data.pages[activeIndex]?.path);

      const button = document.createElement("button");
      button.type = "button";
      button.className = "cs-nav-item" + (isSelected ? " active" : "");
      button.title = page.title;

      const numBadge = document.createElement("span");
      numBadge.className = "cs-nav-num";
      numBadge.textContent = numLabel;

      const labelSpan = document.createElement("span");
      labelSpan.className = "cs-nav-label";
      labelSpan.textContent = page.title;

      button.appendChild(numBadge);
      button.appendChild(labelSpan);

      if (!slot.hasMatch && data.availableLanguages && data.availableLanguages.length > 1) {
        const badge = document.createElement("span");
        badge.className = "cs-nav-badge";
        badge.textContent = page.lang === "zh-CN" || page.path.includes(".zh-CN.") ? "中文" : "EN";
        button.appendChild(badge);
      }

      button.addEventListener("click", () => showPage(pageIndex >= 0 ? pageIndex : 0));
      return button;
    }));
  }

  function switchLanguage(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    const currentPath = data.pages[activeIndex]?.path;
    const currentBase = data.pages[activeIndex]?.basePath || currentPath?.replace(/.[a-zA-Z]{2}(?:-[a-zA-Z]{2,4})?.html$/i, ".html");

    const targetPage = data.pages.find((p) => (p.basePath === currentBase || p.path === currentBase) && (p.lang === lang || (lang === "zh-CN" ? p.path.includes(".zh-CN.") : !p.path.includes(".zh-CN."))));
    if (targetPage) {
      const targetIndex = data.pages.findIndex((p) => p.path === targetPage.path);
      if (targetIndex >= 0) activeIndex = targetIndex;
    }

    updateChromeLabels(lang);
    renderNavigation();
    showPage(activeIndex);
  }

  document.querySelectorAll(".cs-lang-pill").forEach((pill) => {
    pill.addEventListener("click", () => {
      const lang = pill.getAttribute("data-lang");
      if (lang) switchLanguage(lang);
    });
  });

  function renderCompanion() {
    if (!data.conversations || !data.conversations.length) {
      companionContent.innerHTML = '<p class="cs-companion-empty">' + escapeHtml(data.labels.companionEmpty) + '</p>';
      return;
    }
    companionContent.innerHTML = "";
    data.conversations.forEach((conv) => {
      const sessionDiv = document.createElement("div");
      sessionDiv.className = "cs-companion-session";
      const title = document.createElement("h3");
      title.className = "cs-companion-session-title";
      title.textContent = conv.title || data.labels.sessionFallback;
      sessionDiv.appendChild(title);

      (conv.turns || []).forEach((turn) => {
        const turnDiv = document.createElement("div");
        turnDiv.className = "cs-companion-turn";

        if (turn.prompt) {
          const userBlock = document.createElement("div");
          userBlock.className = "cs-turn-block cs-turn-user";
          userBlock.innerHTML = '<span class="cs-turn-author">' + escapeHtml(data.labels.learnerPrompt) + '</span><div class="cs-turn-text">' + escapeHtml(turn.prompt) + '</div>';
          turnDiv.appendChild(userBlock);
        }

        if (turn.reasoning && turn.reasoning.length) {
          const details = document.createElement("details");
          details.className = "cs-turn-reasoning";
          const summary = document.createElement("summary");
          summary.textContent = "💡 " + data.labels.reasoningTitle + " (" + turn.reasoning.length + ")";
          details.appendChild(summary);
          const list = document.createElement("ul");
          turn.reasoning.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
          });
          details.appendChild(list);
          turnDiv.appendChild(details);
        }

        if (turn.response) {
          const agentBlock = document.createElement("div");
          agentBlock.className = "cs-turn-block cs-turn-agent";
          agentBlock.innerHTML = '<span class="cs-turn-author">' + escapeHtml(data.labels.agentResponse) + '</span><div class="cs-turn-text">' + escapeHtml(turn.response) + '</div>';
          turnDiv.appendChild(agentBlock);
        }

        sessionDiv.appendChild(turnDiv);
      });
      companionContent.appendChild(sessionDiv);
    });
  }

  function setCompanionOpen(open) {
    drawerOpen = open;
    if (open) {
      companionDrawer.removeAttribute("hidden");
      companionToggle.classList.add("active");
      companionToggle.setAttribute("aria-expanded", "true");
      if (window.innerWidth <= 1024) {
        companionBackdrop.removeAttribute("hidden");
      }
    } else {
      companionDrawer.setAttribute("hidden", "");
      companionToggle.classList.remove("active");
      companionToggle.setAttribute("aria-expanded", "false");
      companionBackdrop.setAttribute("hidden", "");
    }
    updateLayout();
  }

  companionToggle?.addEventListener("click", () => {
    setCompanionOpen(!drawerOpen);
  });
  companionClose?.addEventListener("click", () => setCompanionOpen(false));
  companionBackdrop?.addEventListener("click", () => setCompanionOpen(false));

  function wireCourseLinks(doc) {
    doc.addEventListener("click", (event) => {
      const link = event.target.closest?.("a[href]");
      if (!link) return;
      const raw = link.getAttribute("href") || "";
      if (raw.startsWith("#")) {
        const target = doc.getElementById(raw.slice(1));
        if (target) {
          event.preventDefault();
          target.scrollIntoView({ behavior: "smooth" });
        }
        return;
      }
      const path = raw.split("#")[0].replace(/^\.\//, "");
      const index = data.pages.findIndex((page) => page.path === path);
      if (index < 0) return;
      event.preventDefault();
      showPage(index, raw.includes("#") ? raw.slice(raw.indexOf("#") + 1) : undefined);
    });
  }

  function resizeFrame() {
    const doc = frame.contentDocument;
    if (!doc) return;
    try {
      const h = Math.max(560, doc.documentElement.scrollHeight, doc.body?.scrollHeight || 0);
      if (String(h) + "px" !== frame.style.height) {
        requestAnimationFrame(() => { frame.style.height = h + "px"; });
      }
    } catch (err) {
      console.warn("frame resize error:", err);
    }
  }

  function showPage(index, sectionId) {
    activeIndex = Math.max(0, Math.min(data.pages.length - 1, index));
    const page = data.pages[activeIndex];
    if (!page) return;

    const pageLang = page.lang || (page.path.includes(".zh-CN.") ? "zh-CN" : "en");
    if (pageLang !== currentLang && data.availableLanguages?.includes(pageLang)) {
      currentLang = pageLang;
      updateChromeLabels(currentLang);
    }

    const navSlots = getSlots(currentLang);
    const navPos = findSlotPosition(navSlots, page.path);
    previous.disabled = navPos <= 0;
    next.disabled = navPos < 0 || navPos === navSlots.length - 1;
    const targetHash = encodeURIComponent(page.path) + (sectionId ? "#" + sectionId : "");
    if (decodeURIComponent(location.hash.slice(1)) !== decodeURIComponent(targetHash)) {
      location.hash = targetHash;
    }
    renderNavigation();

    observer?.disconnect();
    frame.onload = () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      wireCourseLinks(doc);
      if (sectionId) {
        const target = doc.getElementById(sectionId);
        if (target) {
          window.scrollTo({
            top: frame.getBoundingClientRect().top + window.scrollY + target.offsetTop,
            behavior: "instant"
          });
        }
      }
      observer = new ResizeObserver(resizeFrame);
      observer.observe(doc.documentElement);
      resizeFrame();
    };
    frame.srcdoc = page.html;
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function escapeHtml(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  window.addEventListener("resize", updateLayout);
  renderCompanion();
  function goRelative(delta) {
    const slots = getSlots(currentLang);
    const currentPath = data.pages[activeIndex]?.path;
    const slotPos = findSlotPosition(slots, currentPath);
    if (slotPos < 0) {
      showPage(activeIndex + delta);
      return;
    }
    const targetSlot = slots[slotPos + delta];
    if (!targetSlot) return;
    const targetIndex = data.pages.findIndex((p) => p.path === targetSlot.activeVariant.path);
    if (targetIndex >= 0) showPage(targetIndex);
  }

  previous.addEventListener("click", () => goRelative(-1));
  next.addEventListener("click", () => goRelative(1));
  window.addEventListener("hashchange", () => {
    const rawHash = decodeURIComponent(location.hash.slice(1));
    const pagePath = rawHash.split("#")[0];
    const index = data.pages.findIndex((page) => page.path === pagePath);
    if (index >= 0 && index !== activeIndex) {
      const section = rawHash.includes("#") ? rawHash.slice(rawHash.indexOf("#") + 1) : undefined;
      showPage(index, section);
    }
  });

  updateChromeLabels(currentLang);
  updateLayout();
  showPage(activeIndex, initial.section);
})();
</script>
</body>
