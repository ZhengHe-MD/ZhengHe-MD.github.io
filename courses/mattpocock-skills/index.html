      \u003cspan class=\"source-line\" id=\"code-review-source-line-12\" data-line=\"12\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-13\" data-line=\"13\">The issue tracker should have been provided to you — run `/setup-matt-pocock-skills` if `docs/agents/issue-tracker.md` is missing.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-14\" data-line=\"14\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-15\" data-line=\"15\">## Process\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-16\" data-line=\"16\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-17\" data-line=\"17\">### 1. Pin the fixed point\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-18\" data-line=\"18\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-19\" data-line=\"19\">Whatever the user said is the fixed point — a commit SHA, branch name, tag, `main`, `HEAD~5`, etc. If they didn't specify one, ask for it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-20\" data-line=\"20\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-21\" data-line=\"21\">Capture the diff command once: `git diff &lt;fixed-point&gt;...HEAD` (three-dot, so the comparison is against the merge-base). Also note the list of commits via `git log &lt;fixed-point&gt;..HEAD --oneline`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-22\" data-line=\"22\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-23\" data-line=\"23\">Before going further, confirm the fixed point resolves (`git rev-parse &lt;fixed-point&gt;`) and the diff is non-empty. A bad ref or empty diff should fail here — not inside two parallel sub-agents.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-24\" data-line=\"24\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-25\" data-line=\"25\">### 2. Identify the spec source\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-26\" data-line=\"26\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-27\" data-line=\"27\">Look for the originating spec, in this order:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-28\" data-line=\"28\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-29\" data-line=\"29\">1. Issue references in the commit messages (`#123`, `Closes #45`, GitLab `!67`, etc.) — fetch via the workflow in `docs/agents/issue-tracker.md`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-30\" data-line=\"30\">2. A path the user passed as an argument.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-31\" data-line=\"31\">3. A spec file under `docs/`, `specs/`, or `.scratch/` matching the branch name or feature.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-32\" data-line=\"32\">4. If nothing is found, ask the user where the spec is. If they say there isn't one, the **Spec** sub-agent will skip and report \"no spec available\".\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-33\" data-line=\"33\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-34\" data-line=\"34\">### 3. Identify the standards sources\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-35\" data-line=\"35\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-36\" data-line=\"36\">Anything in the repo that documents how code should be written, such as `CODING_STANDARDS.md` or `CONTRIBUTING.md`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-37\" data-line=\"37\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-38\" data-line=\"38\">On top of whatever the repo documents, the Standards axis always carries the **smell baseline** below — a fixed set of Fowler code smells (_Refactoring_, ch.3) that applies even when a repo documents nothing. Two rules bind it:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-39\" data-line=\"39\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-40\" data-line=\"40\">- **The repo overrides.** A documented repo standard always wins; where it endorses something the baseline would flag, suppress the smell.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-41\" data-line=\"41\">- **Always a judgement call.** Each smell is a labelled heuristic (\"possible Feature Envy\"), never a hard violation — and, like any standard here, skip anything tooling already enforces.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-42\" data-line=\"42\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-43\" data-line=\"43\">Each smell reads *what it is* → *how to fix*; match it against the diff:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-44\" data-line=\"44\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-45\" data-line=\"45\">- **Mysterious Name** — a function, variable, or type whose name doesn't reveal what it does or holds. → rename it; if no honest name comes, the design's murky.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-46\" data-line=\"46\">- **Duplicated Code** — the same logic shape appears in more than one hunk or file in the change. → extract the shared shape, call it from both.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-47\" data-line=\"47\">- **Feature Envy** — a method that reaches into another object's data more than its own. → move the method onto the data it envies.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-48\" data-line=\"48\">- **Data Clumps** — the same few fields or params keep travelling together (a type wanting to be born). → bundle them into one type, pass that.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-49\" data-line=\"49\">- **Primitive Obsession** — a primitive or string standing in for a domain concept that deserves its own type. → give the concept its own small type.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-50\" data-line=\"50\">- **Repeated Switches** — the same `switch`/`if`-cascade on the same type recurs across the change. → replace with polymorphism, or one map both sites share.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-51\" data-line=\"51\">- **Shotgun Surgery** — one logical change forces scattered edits across many files in the diff. → gather what changes together into one module.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-52\" data-line=\"52\">- **Divergent Change** — one file or module is edited for several unrelated reasons. → split so each module changes for one reason.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-53\" data-line=\"53\">- **Speculative Generality** — abstraction, parameters, or hooks added for needs the spec doesn't have. → delete it; inline back until a real need shows.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-54\" data-line=\"54\">- **Message Chains** — long `a.b().c().d()` navigation the caller shouldn't depend on. → hide the walk behind one method on the first object.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-55\" data-line=\"55\">- **Middle Man** — a class or function that mostly just delegates onward. → cut it, call the real target direct.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-56\" data-line=\"56\">- **Refused Bequest** — a subclass or implementer that ignores or overrides most of what it inherits. → drop the inheritance, use composition.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-57\" data-line=\"57\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-58\" data-line=\"58\">### 4. Spawn both sub-agents in parallel\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-59\" data-line=\"59\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-60\" data-line=\"60\">**Standards sub-agent prompt** — include:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-61\" data-line=\"61\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-62\" data-line=\"62\">- The full diff command and commit list.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-63\" data-line=\"63\">- The list of standards-source files you found in step 3, **plus the smell baseline from step 3** pasted in full — the sub-agent has no other access to it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-64\" data-line=\"64\">- The brief: \"Report — per file/hunk where relevant — (a) every place the diff violates a documented standard: cite the standard (file + the rule); and (b) any baseline smell you spot: name it and quote the hunk. Distinguish hard violations from judgement calls — documented-standard breaches can be hard, but baseline smells are always judgement calls, and a documented repo standard overrides the baseline. Skip anything tooling enforces. Under 400 words.\"\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-65\" data-line=\"65\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-66\" data-line=\"66\">**Spec sub-agent prompt** — include:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-67\" data-line=\"67\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-68\" data-line=\"68\">- The diff command and commit list.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-69\" data-line=\"69\">- The path or fetched contents of the spec.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-70\" data-line=\"70\">- The brief: \"Report: (a) requirements the spec asked for that are missing or partial; (b) behaviour in the diff that wasn't asked for (scope creep); (c) requirements that look implemented but where the implementation looks wrong. Quote the spec line for each finding. Under 400 words.\"\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-71\" data-line=\"71\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-72\" data-line=\"72\">If the spec is missing, skip the Spec sub-agent and note this in the final report.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-73\" data-line=\"73\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-74\" data-line=\"74\">### 5. Aggregate\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-75\" data-line=\"75\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-76\" data-line=\"76\">Present the two reports under `## Standards` and `## Spec` headings, verbatim or lightly cleaned. Do **not** merge or rerank findings — the two axes are deliberately separate (see _Why two axes_).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-77\" data-line=\"77\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-78\" data-line=\"78\">End with a one-line summary: total findings per axis, and the worst issue _within each axis_ (if any). Don't pick a single winner across axes — that's the reranking the separation exists to prevent.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-79\" data-line=\"79\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-80\" data-line=\"80\">## Why two axes\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-81\" data-line=\"81\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-82\" data-line=\"82\">A change can pass one axis and fail the other:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-83\" data-line=\"83\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-84\" data-line=\"84\">- Code that follows every standard but implements the wrong thing → **Standards pass, Spec fail.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-85\" data-line=\"85\">- Code that does exactly what the issue asked but breaks the project's conventions → **Spec pass, Standards fail.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-86\" data-line=\"86\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-87\" data-line=\"87\">Reporting them separately stops one axis from masking the other.\u003c/span>\n            \u003c/code>\u003c/pre>\n            \u003caside class=\"margin-rail\" aria-label=\"Teacher comments on code-review\">\n            \u003cdiv class=\"margin-comment\" style=\"--line: 3\" aria-labelledby=\"code-review-source-line-3\">\n              \u003cspan class=\"margin-marker\">01\u003c/span>\u003cstrong>The description is unusually complete\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-3\">Line 3\u003c/a> · It names the artifact, both questions, the parallel mechanism, and the requests that should trigger the skill.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 6\" aria-labelledby=\"code-review-source-line-6\">\n              \u003cspan class=\"margin-marker\">02\u003c/span>\u003cstrong>Two independent questions\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-6\">Line 6\u003c/a> · Engineering quality and specification fidelity can disagree. The rest of the file protects that disagreement.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 17\" aria-labelledby=\"code-review-source-line-17\">\n              \u003cspan class=\"margin-marker\">03\u003c/span>\u003cstrong>Freeze the review target\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-17\">Line 17\u003c/a> · Both reviewers must examine the same merge-base diff. Invalid or empty input fails before parallel work begins.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 25\" aria-labelledby=\"code-review-source-line-25\">\n              \u003cspan class=\"margin-marker\">04\u003c/span>\u003cstrong>Recover requested intent\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-25\">Line 25\u003c/a> · The spec search has an explicit order and an honest fallback: skip that axis only after confirming no spec exists.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 34\" aria-labelledby=\"code-review-source-line-34\">\n              \u003cspan class=\"margin-marker\">05\u003c/span>\u003cstrong>Local standards come first\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-34\">Line 34\u003c/a> · Repository rules override the built-in smell list; smells remain judgment calls and tooling-owned checks are omitted.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 43\" aria-labelledby=\"code-review-source-line-43\">\n              \u003cspan class=\"margin-marker\">06\u003c/span>\u003cstrong>Reference embedded in the skill\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-43\">Line 43\u003c/a> · The smell catalog is shared review vocabulary. It gives the standards reviewer a baseline when local documentation is thin.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 58\" aria-labelledby=\"code-review-source-line-58\">\n              \u003cspan class=\"margin-marker\">07\u003c/span>\u003cstrong>Context isolation is the mechanism\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-58\">Line 58\u003c/a> · Each sub-agent receives one evidence bundle and one question, so success on one axis cannot bias the other.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 74\" aria-labelledby=\"code-review-source-line-74\">\n              \u003cspan class=\"margin-marker\">08\u003c/span>\u003cstrong>Do not blend at the end\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-74\">Line 74\u003c/a> · The aggregator preserves separate reports and summaries. A single overall ranking would undo the entire design.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 80\" aria-labelledby=\"code-review-source-line-80\">\n              \u003cspan class=\"margin-marker\">09\u003c/span>\u003cstrong>The crossed cases explain why\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-80\">Line 80\u003c/a> · Standards can pass while Spec fails, or the reverse. These examples are also the clearest behavior test for the skill.\u003c/p>\n            \u003c/div>\n            \u003c/aside>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"case-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton id=\"case-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton id=\"case-skip\" type=\"button\">Skip case\u003c/button>\n          \u003c/div>\n          \u003cspan class=\"case-status\" id=\"case-status\" aria-live=\"polite\">Case 1 of 3\u003c/span>\n          \u003cdiv class=\"case-nav-next\">\n            \u003cbutton class=\"primary-button\" id=\"case-next\" type=\"button\">Next case →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdetails class=\"license-note\">\n        \u003csummary>License for the reproduced skill files\u003c/summary>\n        \u003cpre>MIT License\n\nCopyright (c) 2026 Matt Pocock\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\u003c/pre>\n      \u003c/details>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">45–50 minutes\u003c/span>\n      \u003ch2 id=\"cross-case-patterns\">3. Compare the mechanisms, not the prose\u003c/h2>\n      \u003cp>The cases look different because each one controls a different source of variance. The shared architecture becomes clearest in a matrix.\u003c/p>\n\n      \u003cdiv class=\"matrix-wrap\">\n        \u003cdiv class=\"matrix\" role=\"table\" aria-label=\"Cross-case comparison\">\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">Lens\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>ask-matt\u003c/code>\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>diagnosing-bugs\u003c/code>\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>code-review\u003c/code>\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Variance controlled\u003c/div>\n          \u003cdiv role=\"cell\">Route selection\u003c/div>\n          \u003cdiv role=\"cell\">Premature causal confidence\u003c/div>\n          \u003cdiv role=\"cell\">One criterion masking another\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Primary mechanism\u003c/div>\n          \u003cdiv role=\"cell\">Explicit handoff map\u003c/div>\n          \u003cdiv role=\"cell\">Ordered gates around a feedback loop\u003c/div>\n          \u003cdiv role=\"cell\">Independent contexts, then aggregation\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Invocation cost\u003c/div>\n          \u003cdiv role=\"cell\">Human must remember to ask\u003c/div>\n          \u003cdiv role=\"cell\">Model carries a trigger pointer\u003c/div>\n          \u003cdiv role=\"cell\">Model carries a detailed review pointer\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Fragile edge\u003c/div>\n          \u003cdiv role=\"cell\">Map can drift from child files\u003c/div>\n          \u003cdiv role=\"cell\">Heavy process can become ritual\u003c/div>\n          \u003cdiv role=\"cell\">Depends on recoverable source documents\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout gold\">\n        \u003cspan class=\"label\">The synthesis\u003c/span>\n        \u003cp>“A skill is a behavioral contract” now has three concrete meanings: \u003ccode>ask-matt\u003c/code> constrains the \u003cem>handoff\u003c/em>, \u003ccode>diagnosing-bugs\u003c/code> constrains the \u003cem>order of belief\u003c/em>, and \u003ccode>code-review\u003c/code> constrains the \u003cem>separation of judgment\u003c/em>.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">50–59 minutes\u003c/span>\n      \u003ch2 id=\"transfer-lab\">4. Fresh file: reconstruct \u003ccode>tdd\u003c/code>\u003c/h2>\n      \u003cp>No walkthrough this time. The current file describes a model-discoverable reference for a red → green loop, asks the learner to agree testing seams first, discloses examples and mocking guidance, and forbids horizontal slicing. Use the trace yourself.\u003c/p>\n\n      \u003cdiv class=\"lab\" id=\"tdd-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"tdd-reconstruction\">Build the trace\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"tdd-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"tdd-nav\" role=\"tablist\" aria-label=\"TDD case questions\">\u003c/div>\n        \u003cp class=\"quiz-kicker\" id=\"tdd-kicker\">\u003c/p>\n        \u003cp class=\"quiz-prompt\" id=\"tdd-prompt\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"tdd-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"tdd-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton id=\"tdd-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton id=\"tdd-skip\" type=\"button\">Skip\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"primary-button\" id=\"tdd-check\" type=\"button\" disabled>Check\u003c/button>\n            \u003cbutton class=\"primary-button\" id=\"tdd-next\" type=\"button\">Next →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">59–65 minutes\u003c/span>\n      \u003ch2 id=\"borrowing-ledger\">5. Revise the borrowing ledger\u003c/h2>\n      \u003cp>You are deciding about mechanisms, not endorsing whole files. Your choices persist locally.\u003c/p>\n\n      \u003cdiv class=\"ledger\" id=\"ledger\">\n        \u003cdiv class=\"ledger-item\" data-principle=\"router\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-router\">A router that performs no downstream work\u003c/h3>\n            \u003cp>Useful when humans face a dense library; fragile when its map becomes a second source of truth.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for router mechanism\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"gate\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-gate\">A hard gate before expensive reasoning\u003c/h3>\n            \u003cp>Prevents premature confidence; needs an escape clause precise enough not to swallow the rule.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for completion gate\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"isolation\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-isolation\">Separate contexts for independent judgments\u003c/h3>\n            \u003cp>Protects evidence boundaries when one attractive result could bias the other.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for context isolation\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-footer\">\n          \u003cspan class=\"ledger-summary\" id=\"ledger-summary\">0 of 3 decided\u003c/span>\n          \u003cbutton id=\"ledger-reset\" type=\"button\">Reset choices\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003cspan class=\"label\">Course result\u003c/span>\n        \u003cp>You can now move in both directions: from a file back to its hidden design decisions, and from a recurring failure forward to a skill whose interface, information, gates, and tests are deliberate.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"source-notes\">Source notes\u003c/h2>\n      \u003cp class=\"source-note\">This session was checked against the public repository on August 11, 2026. Section 2 reproduces each case file in full and without rewriting; the accompanying margin comments are ours.\u003c/p>\n      \u003cul class=\"source-note\">\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\">\u003ccode>ask-matt/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\">\u003ccode>diagnosing-bugs/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\">\u003ccode>code-review/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\">\u003ccode>tdd/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_PREFIX = \"mattpocock-skills:session3:\";\n\n    function loadState(key, fallback) {\n      try {\n        const saved = localStorage.getItem(STORAGE_PREFIX + key);\n        return saved ? JSON.parse(saved) : fallback;\n      } catch (error) {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));\n      } catch (error) {\n        // The lesson remains usable when storage is unavailable.\n      }\n    }\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const percent = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      document.querySelector(\"#progress-bar\").style.width = `${Math.min(100, percent)}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    window.addEventListener(\"resize\", updateProgress);\n    updateProgress();\n\n    const mapRouteNotes = {\n      all: \"The whole portfolio is visible. Each card states the skill’s goal; choose a starting situation to reveal one route through the system.\",\n      idea: \"Idea route: sharpen the idea, detour through a handoff and prototype only when a runnable answer is needed, then specify, ticket, implement test-first, and review.\",\n      incoming: \"Incoming-work route: triage only raw issues you did not create, then hand an agent-ready issue to implementation, TDD, and two-axis review.\",\n      bug: \"Bug route: diagnose from a red-capable feedback loop, fix with a regression test, then inspect architecture only if the bug exposed a weak seam.\",\n      fog: \"Foggy-effort route: use wayfinder to resolve decision tickets, collapse the resulting map into a spec, then ticket and implement normally.\"\n    };\n    const mapRouteState = loadState(\"skill-system-map\", { route: \"all\" });\n    const mapRouteButtons = Array.from(document.querySelectorAll(\"[data-map-route]\"));\n    const mapSkillNodes = Array.from(document.querySelectorAll(\"[data-skill-map-node]\"));\n    const mapRouteNote = document.querySelector(\"#map-route-note\");\n\n    function showMapRoute(route) {\n      const nextRoute = mapRouteNotes[route] ? route : \"all\";\n      mapRouteState.route = nextRoute;\n      saveState(\"skill-system-map\", mapRouteState);\n\n      mapRouteButtons.forEach((button) => {\n        button.setAttribute(\"aria-pressed\", String(button.dataset.mapRoute === nextRoute));\n      });\n\n      mapSkillNodes.forEach((node) => {\n        const routes = (node.dataset.routes || \"\").split(\" \").filter(Boolean);\n        const active = nextRoute !== \"all\" && routes.includes(nextRoute);\n        node.classList.toggle(\"is-active\", active);\n        node.classList.toggle(\"is-muted\", nextRoute !== \"all\" && !active);\n      });\n\n      mapRouteNote.textContent = mapRouteNotes[nextRoute];\n    }\n\n    mapRouteButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => showMapRoute(button.dataset.mapRoute));\n    });\n\n    showMapRoute(mapRouteState.route);\n\n    const caseState = loadState(\"case-workbench\", { index: 0, skipped: {} });\n    const caseTabs = Array.from(document.querySelectorAll(\"[data-case-index]\"));\n    const casePanels = Array.from(document.querySelectorAll(\"[data-case-panel]\"));\n    const caseStatus = document.querySelector(\"#case-status\");\n    const casePrevious = document.querySelector(\"#case-prev\");\n    const caseSkip = document.querySelector(\"#case-skip\");\n    const caseNext = document.querySelector(\"#case-next\");\n    let caseIndex = Math.min(Math.max(0, Number(caseState.index) || 0), casePanels.length - 1);\n\n    function positionMarginComments() {\n      const compactLayout = window.matchMedia(\"(max-width: 650px)\").matches;\n      const activePanel = casePanels[caseIndex];\n      const layout = activePanel.querySelector(\".manuscript-layout\");\n      const rail = layout.querySelector(\".margin-rail\");\n      const comments = Array.from(rail.querySelectorAll(\".margin-comment\"));\n\n      rail.style.minHeight = \"\";\n      comments.forEach((comment) => comment.style.removeProperty(\"--note-top\"));\n      if (compactLayout) return;\n\n      const layoutTop = layout.getBoundingClientRect().top;\n      let nextAvailableTop = 0;\n      comments.forEach((comment) => {\n        const target = document.querySelector(`#${comment.getAttribute(\"aria-labelledby\")}`);\n        const targetTop = target.getBoundingClientRect().top - layoutTop;\n        const noteTop = Math.max(targetTop, nextAvailableTop);\n        comment.style.setProperty(\"--note-top\", `${noteTop}px`);\n        nextAvailableTop = noteTop + comment.offsetHeight + 12;\n      });\n\n      const manuscriptHeight = layout.querySelector(\".skill-manuscript\").offsetHeight;\n      if (nextAvailableTop > manuscriptHeight) rail.style.minHeight = `${nextAvailableTop}px`;\n    }\n\n    function showCase(nextIndex) {\n      caseIndex = Math.min(Math.max(0, nextIndex), casePanels.length - 1);\n      caseState.index = caseIndex;\n      saveState(\"case-workbench\", caseState);\n\n      caseTabs.forEach((tab, index) => {\n        const active = index === caseIndex;\n        tab.setAttribute(\"aria-selected\", String(active));\n        tab.tabIndex = active ? 0 : -1;\n      });\n\n      casePanels.forEach((panel, index) => {\n        panel.hidden = index !== caseIndex;\n      });\n\n      casePrevious.disabled = caseIndex === 0;\n      caseNext.textContent = caseIndex === casePanels.length - 1 ? \"Return to first case ↺\" : \"Next case →\";\n      const skipped = caseState.skipped[caseIndex] ? \" · marked skipped\" : \"\";\n      caseStatus.textContent = `Case ${caseIndex + 1} of ${casePanels.length}${skipped}`;\n      requestAnimationFrame(positionMarginComments);\n    }\n\n    caseTabs.forEach((tab) => {\n      tab.addEventListener(\"click\", () => showCase(Number(tab.dataset.caseIndex)));\n    });\n\n    casePrevious.addEventListener(\"click\", () => showCase(caseIndex - 1));\n    caseSkip.addEventListener(\"click\", () => {\n      caseState.skipped[caseIndex] = true;\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n    caseNext.addEventListener(\"click\", () => {\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n\n    window.addEventListener(\"resize\", () => requestAnimationFrame(positionMarginComments));\n    if (document.fonts?.ready) document.fonts.ready.then(positionMarginComments);\n\n    showCase(caseIndex);\n\n    const tddItems = [\n      {\n        shortLabel: \"Shape\",\n        kicker: \"Trace 1 · Interface\",\n        prompt: \"The file supplies rules, anti-patterns, and vocabulary for a loop that another skill can drive. Which profile best explains it?\",\n        options: [\n          { label: \"Human-invoked router\", tip: \"A router chooses among child skills and hands off; tdd instead defines one reusable engineering discipline.\" },\n          { label: \"Model-invoked reference + discipline\", tip: \"Its trigger is discoverable, and its contents guide every red-green cycle without being a one-off ceremony.\" },\n          { label: \"Environment-only source\", tip: \"The repository supplies test commands, but the behavioral rules and anti-patterns are not cheaply recoverable facts.\" },\n          { label: \"User-invoked orchestrator\", tip: \"The file has no human-only invocation marker and does not mainly coordinate a chain of user-selected sessions.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Yes. Invocation and content shape are independent axes: model-discoverable, with both reference and repeatable discipline.\",\n        retryFeedback: \"Separate who can retrieve the skill from whether its body is steps, reference, or orchestration.\"\n      },\n      {\n        shortLabel: \"Pointer\",\n        kicker: \"Trace 2 · Trigger\",\n        prompt: \"Which request should most reliably retrieve the current tdd skill?\",\n        options: [\n          { label: \"Explain why my test is flaky.\", tip: \"An explanation request may need diagnosis, but it does not necessarily ask to build or fix test-first.\" },\n          { label: \"Add checkout support test-first, one red-green slice at a time.\", tip: \"Combines a build request with explicit test-first and red-green language from the trigger.\" },\n          { label: \"Review this branch against main.\", tip: \"That maps directly to code-review and a fixed-point comparison.\" },\n          { label: \"Which engineering workflow should I use?\", tip: \"That is the human-invoked router's job.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Correct. The request hits both the material and a distinct trigger branch, leaving little retrieval ambiguity.\",\n        retryFeedback: \"Look for a request that names building behavior and the loop this skill exists to constrain.\"\n      },\n      {\n        shortLabel: \"Layer\",\n        kicker: \"Trace 3 · Placement\",\n        prompt: \"The project’s exact test command changes from npm test to make verify. Where should the current command live?\",\n        options: [\n          { label: \"Inline in tdd/SKILL.md\", tip: \"That would turn a reusable discipline into a stale cache of one repository's configuration.\" },\n          { label: \"In tests.md beside conceptual examples\", tip: \"Moving a volatile project fact into disclosed reference still creates a second source of truth.\" },\n          { label: \"In the project environment\", tip: \"package.json, Makefile, repository instructions, or help output can own the current command.\" },\n          { label: \"Repeat it in every loop rule\", tip: \"Repetition raises prominence but multiplies maintenance and context cost.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Exactly. Keep the invariant process in the skill and recover the volatile command from its authoritative project source.\",\n        retryFeedback: \"Apply the cache test from Session 2: can the agent cheaply recover the current value from its real owner?\"\n      },\n      {\n        shortLabel: \"Test\",\n        kicker: \"Trace 4 · Evidence\",\n        prompt: \"How would you test whether the ban on horizontal slicing changes behavior?\",\n        options: [\n          { label: \"Ask whether the rule sounds persuasive.\", tip: \"Editorial confidence does not show a behavioral effect.\" },\n          { label: \"Compare the same multi-behavior task with and without that rule; count whether cycles stay one test → minimal implementation.\", tip: \"Only the disputed line changes, and the target behavior is observable across the run.\" },\n          { label: \"Count the number of tests at the end.\", tip: \"Both horizontal and vertical approaches can produce the same test count while behaving differently.\" },\n          { label: \"Check whether all tests pass once.\", tip: \"A green suite does not reveal the order in which tests and behavior were developed.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Right. This counterfactual observes process order, the behavior the sentence claims to control.\",\n        retryFeedback: \"Choose a comparison that isolates one sentence and measures the behavior named by that sentence.\"\n      }\n    ];\n\n    function createStepper(config) {\n      const state = loadState(config.storageKey, { index: 0, answers: {} });\n      let index = Math.min(Math.max(0, Number(state.index) || 0), config.items.length - 1);\n      let selected = null;\n\n      const nav = document.querySelector(config.nav);\n      const count = document.querySelector(config.count);\n      const kicker = document.querySelector(config.kicker);\n      const prompt = document.querySelector(config.prompt);\n      const choices = document.querySelector(config.choices);\n      const feedback = document.querySelector(config.feedback);\n      const previous = document.querySelector(config.previous);\n      const skip = document.querySelector(config.skip);\n      const check = document.querySelector(config.check);\n      const next = document.querySelector(config.next);\n\n      function renderNav() {\n        nav.replaceChildren();\n        config.items.forEach((item, itemIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"step-pill\";\n          button.textContent = item.shortLabel;\n          if (itemIndex === index) button.classList.add(\"active\");\n          const answer = state.answers[itemIndex];\n          if (answer?.correct) button.classList.add(\"correct\");\n          else if (answer?.checked) button.classList.add(\"answered\");\n          button.setAttribute(\"role\", \"tab\");\n          button.setAttribute(\"aria-selected\", String(itemIndex === index));\n          button.addEventListener(\"click\", () => goTo(itemIndex));\n          nav.append(button);\n        });\n      }\n\n      function render() {\n        const item = config.items[index];\n        const answer = state.answers[index];\n        selected = answer?.selected ?? null;\n        count.textContent = `${index + 1} / ${config.items.length}`;\n        kicker.textContent = item.kicker;\n        prompt.textContent = item.prompt;\n        previous.disabled = index === 0;\n        next.textContent = index === config.items.length - 1 ? \"Finish\" : \"Next →\";\n        check.disabled = selected === null;\n        choices.replaceChildren();\n\n        item.options.forEach((option, optionIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option.label;\n          button.dataset.tip = option.tip;\n          button.setAttribute(\"aria-label\", `${option.label}. ${option.tip}`);\n          button.setAttribute(\"aria-pressed\", String(optionIndex === selected));\n          if (optionIndex === selected) button.classList.add(\"selected\");\n          if (answer?.checked && optionIndex === item.answer) button.classList.add(\"correct-answer\");\n          button.addEventListener(\"click\", () => selectOption(optionIndex));\n          choices.append(button);\n        });\n\n        if (answer?.checked) {\n          feedback.className = `feedback visible ${answer.correct ? \"correct\" : \"retry\"}`;\n          feedback.textContent = answer.correct ? item.correctFeedback : item.retryFeedback;\n        } else {\n          feedback.className = \"feedback\";\n          feedback.textContent = \"\";\n        }\n        renderNav();\n      }\n\n      function selectOption(optionIndex) {\n        selected = optionIndex;\n        state.answers[index] = { selected, checked: false, correct: false };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function checkAnswer() {\n        if (selected === null) return;\n        const item = config.items[index];\n        state.answers[index] = { selected, checked: true, correct: selected === item.answer };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function goTo(nextIndex) {\n        index = nextIndex;\n        state.index = index;\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      previous.addEventListener(\"click\", () => {\n        if (index > 0) goTo(index - 1);\n      });\n      skip.addEventListener(\"click\", () => goTo((index + 1) % config.items.length));\n      check.addEventListener(\"click\", checkAnswer);\n      next.addEventListener(\"click\", () => {\n        if (index \u003c config.items.length - 1) {\n          goTo(index + 1);\n          return;\n        }\n        const correctCount = config.items.filter((item, itemIndex) => state.answers[itemIndex]?.correct).length;\n        feedback.className = \"feedback visible correct\";\n        feedback.textContent = correctCount === config.items.length\n          ? \"Trace complete: shape, pointer, placement, and behavior test all reconstructed from a fresh file.\"\n          : `You reached the end with ${correctCount} of ${config.items.length} decisions resolved. Use the step pills to revisit any case.`;\n      });\n\n      render();\n    }\n\n    createStepper({\n      storageKey: \"tdd-transfer\",\n      items: tddItems,\n      nav: \"#tdd-nav\",\n      count: \"#tdd-count\",\n      kicker: \"#tdd-kicker\",\n      prompt: \"#tdd-prompt\",\n      choices: \"#tdd-choices\",\n      feedback: \"#tdd-feedback\",\n      previous: \"#tdd-prev\",\n      skip: \"#tdd-skip\",\n      check: \"#tdd-check\",\n      next: \"#tdd-next\"\n    });\n\n    const ledgerItems = Array.from(document.querySelectorAll(\".ledger-item\"));\n    const ledgerState = loadState(\"borrowing-ledger\", {});\n    const ledgerSummary = document.querySelector(\"#ledger-summary\");\n\n    function renderLedger() {\n      ledgerItems.forEach((item) => {\n        const decision = ledgerState[item.dataset.principle];\n        item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n          button.setAttribute(\"aria-pressed\", String(button.dataset.decision === decision));\n        });\n      });\n      const decisions = Object.values(ledgerState);\n      const counts = { adopt: 0, adapt: 0, reject: 0 };\n      decisions.forEach((decision) => {\n        if (counts[decision] !== undefined) counts[decision] += 1;\n      });\n      ledgerSummary.textContent = `${decisions.length} of ${ledgerItems.length} decided · ${counts.adopt} adopt · ${counts.adapt} adapt · ${counts.reject} reject`;\n    }\n\n    ledgerItems.forEach((item) => {\n      item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n        button.addEventListener(\"click\", () => {\n          ledgerState[item.dataset.principle] = button.dataset.decision;\n          saveState(\"borrowing-ledger\", ledgerState);\n          renderLedger();\n        });\n      });\n    });\n\n    document.querySelector(\"#ledger-reset\").addEventListener(\"click\", () => {\n      Object.keys(ledgerState).forEach((key) => delete ledgerState[key]);\n      saveState(\"borrowing-ledger\", ledgerState);\n      renderLedger();\n    });\n\n    renderLedger();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session3.zh-CN.html","basePath":"session3.html","lang":"zh-CN","kind":"lesson","title":"技能案例研究","translations":{"en":"session3.html","zh-CN":"session3.zh-CN.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"技能案例研究\">\n  \u003ctitle>技能案例研究 — MattPocock 技能\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --gold: #9a762f;\n      --gold-soft: #eee3c3;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.82);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 20;\n      top: 0;\n      left: 0;\n m;\n    }\n\n    .skill-node {\n      min-width: 0;\n      padding: 0.72rem 0.76rem;\n      border: 1px solid var(--line);\n      border-radius: 0.48rem;\n      background: #fffdf9;\n      transition: border-color 150ms ease, box-shadow 150ms ease, opacity 150ms ease, transform 150ms ease;\n    }\n\n    .skill-node code {\n      display: block;\n      width: fit-content;\n      margin-bottom: 0.28rem;\n      color: var(--accent-dark);\n      font-size: 0.71rem;\n      font-weight: 700;\n    }\n\n    .skill-node span {\n      display: block;\n      color: #514a42;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      line-height: 1.38;\n    }\n\n    .skill-node.is-active {\n      border-color: var(--accent);\n      box-shadow: 0 0 0 2px rgba(138, 78, 53, 0.12);\n      transform: translateY(-1px);\n    }\n\n    .skill-node.is-muted { opacity: 0.3; }\n\n    .router-node {\n      display: grid;\n      grid-template-columns: minmax(8rem, 0.35fr) minmax(0, 1fr);\n      gap: 0.75rem;\n      align-items: center;\n      border-color: var(--accent);\n      background: var(--accent-soft);\n    }\n\n    .router-node code { margin: 0; font-size: 0.78rem; }\n\n    .map-flow-line {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n      gap: 0.55rem;\n      align-items: stretch;\n    }\n\n    .map-flow-line .skill-node { position: relative; }\n\n    .map-flow-line .skill-node:not(:last-child)::after {\n      position: absolute;\n      z-index: 2;\n      top: 50%;\n      right: -0.47rem;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n      transform: translateY(-50%);\n    }\n\n    .implementation-stack {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.4rem;\n      grid-column: span 1;\n    }\n\n    .implementation-stack .skill-node:first-child { grid-column: 1 / -1; }\n    .implementation-stack .skill-node::after { display: none; }\n\n    .map-detour {\n      display: grid; \n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-tip);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .term:hover::after,\n    .term:focus-visible::after,\n    .choice[data-tip]:hover::after,\n    .choice[data-tip]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .case-workbench {\n      width: min(calc(100vw - 3rem), 116ch);\n      margin-left: 50%;\n      overflow: hidden;\n      transform: translateX(-50%);\n    }\n\n    .case-tabs {\n      display: flex;\n      gap: 0.5rem;\n      overflow-x: auto;\n      padding: 1rem 1.1rem;\n      border-bottom: 1px solid var(--line);\n      background: rgba(238, 229, 214, 0.55);\n    }\n\n    button {\n      padding: 0.56rem 0.78rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--ink);\n      background: rgba(255, 253, 248, 0.76);\n      cursor: pointer;\n      font-size: 0.75rem;\n    }\n\n    button:hover,\n    button:focus-visible {\n      border-color: var(--accent);\n      outline: none;\n    }\n\n    button[aria-selected=\"true\"],\n    button[aria-pressed=\"true\"],\n    .primary-button {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    button:disabled { cursor: not-allowed; opacity: 0.45; }\n\n    .case-tab {\n      flex: 0 0 auto;\n      border-radius: 0.45rem;\n      text-align: left;\n    }\n\n    .case-tab span { display: block; color: inherit; font-size: 0.64rem; opacity: 0.75; }\n    .case-tab strong { display: block; margin-top: 0.12rem; font-size: 0.78rem; }\n\n    .case-panel { padding: 1.5rem; }\n    .case-panel[hidden] { display: none; }\n\n    .case-heading {\n      display: grid;\n      grid-template-columns: auto 1fr;\n      gap: 1rem;\n      align-items: start;\n      margin-bottom: 1.3rem;\n    }\n\n    .case-index {\n      display: grid;\n      width: 3.2rem;\n      height: 3.2rem;\n      border-radius: 50%;\n      place-items: center;\n      color: #fffaf1;\n      background: var(--accent);\n      font-size: 0.76rem;\n    }\n\n    .case-type { margin: 0 0 0.2rem; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; }\n    .case-heading h3 { margin: 0; font-size: 1.65rem; }\n    .case-heading p:not(.case-type) { margin: 0.35rem 0 0; color: var(--muted); }\n\n    .source-link {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.35rem;\n      margin-top: 0.65rem;\n      font-family: var(--mono);\n      font-size: 0.72rem;\n      font-weight: 700;\n      text-decoration-thickness: 1px;\n    }\n\n    .manuscript-layout {\n      --source-line-height: 0.78rem;\n      display: grid;\n      grid-template-columns: minmax(0, 2.15fr) minmax(16rem, 0.75fr);\n      gap: 1rem;\n      align-items: stretch;\n      margin-top: 1rem;\n    }\n\n    .skill-manuscript {\n      overflow-x: hidden;\n      margin: 0;\n      padding: 1.2rem 0;\n      border: 1px solid var(--line);\n      border-radius: 0.55rem;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 18px 42px rgba(76, 58, 40, 0.08);\n      font-size: 0.75rem;\n      line-height: var(--source-line-height);\n    }\n\n    .skill-manuscript code {\n      display: block;\n      width: 100%;\n      min-width: 0;\n      padding: 0;\n      color: inherit;\n      background: transparent;\n      font-size: 0;\n    }\n\n    .source-line {\n      position: relative;\n      display: block;\n      min-height: var(--source-line-height);\n      padding: 0 1.1rem 0 4.2rem;\n      font-size: 0.75rem;\n      overflow-wrap: anywhere;\n      white-space: pre-wrap;\n      word-break: break-word;\n    }\n\n    .source-line::before {\n      position: absolute;\n      left: 1.05rem;\n      width: 2.2rem;\n      color: #9e9589;\n      content: attr(data-line);\n      text-align: right;\n    }\n\n    .source-line.annotated {\n      border-left: 3px solid var(--gold);\n      background: var(--gold-soft);\n    }\n\n    .source-line:empty {\n      display: none;\n    }\n\n    .margin-rail {\n      position: relative;\n      min-width: 0;\n      border-left: 1px solid var(--line);\n    }\n\n    .margin-comment {\n      position: absolute;\n      top: var(--note-top, calc(1.2rem + (var(--line) - 1) * var(--source-line-height)));\n      right: 0;\n      left: 1rem;\n      padding: 0.8rem 0.85rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: #fffdf9;\n      box-shadow: var(--shadow);\n    }\n\n    .margin-comment::before {\n      position: absolute;\n      top: 0.95rem;\n      right: 100%;\n      width: 1rem;\n      border-top: 1px solid var(--gold);\n      content: \"\";\n    }\n\n    .margin-marker {\n      display: inline-grid;\n      width: 1.55rem;\n      height: 1.55rem;\n      margin-right: 0.35rem;\n      border-radius: 50%;\n      place-items: center;\n      color: #fffaf1;\n      background: var(--accent);\n      font-family: var(--mono);\n      font-size: 0.62rem;\n      font-weight: 700;\n      vertical-align: middle;\n    }\n\n    .margin-comment strong {\n      font-family: var(--sans);\n      font-size: 0.84rem;\n      vertical-align: middle;\n    }\n\n    .margin-comment p {\n      margin: 0.5rem 0 0;\n      color: #514a42;\n      font-size: 0.82rem;\n      line-height: 1.5;\n    }\n\n    .source-disclosure {\n      margin: 1rem 0 0;\n      padding: 0.8rem 0.9rem;\n      border-radius: 0.45rem;\n      color: var(--muted);\n      background: var(--paper-deep);\n      font-size: 0.84rem;\n    }\n\n    .license-note {\n      margin-top: 1rem;\n      padding: 0.85rem 1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      color: var(--muted);\n      background: rgba(255, 253, 248, 0.65);\n      font-size: 0.82rem;\n    }\n\n    .license-note summary { cursor: pointer; font-family: var(--mono); font-weight: 700; }\n\n    .license-note pre {\n      margin-top: 0.8rem;\n      max-height: 18rem;\n      font-size: 0.7rem;\n      white-space: pre-wrap;\n    }\n\n    .quiz-actions,\n    .ledger-footer {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.8rem;\n      margin-top: 1.3rem;\n      padding-top: 1rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .case-actions {\n      display: grid;\n      grid-template-columns: minmax(12rem, 1fr) auto minmax(12rem, 1fr);\n      gap: 1.5rem;\n      align-items: center;\n      min-height: 6.5rem;\n      margin-top: 2rem;\n      padding: 1.35rem 1.5rem 1.5rem;\n      border-top: 1px solid var(--line);\n      background: rgba(238, 229, 214, 0.5);\n    }\n\n    .case-actions .quiz-action-group { gap: 0.75rem; }\n    .case-actions .case-status { justify-self: center; text-align: center; }\n    .case-nav-next { justify-self: end; }\n\n    .case-status, .lab-count, .ledger-summary {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n    }\n\n    .callout, .field-note { margin: 1.5rem 0; padding: 1.25rem 1.35rem; }\n    .callout.sage { border-left: 4px solid var(--sage); }\n    .callout.blue { border-left: 4px solid var(--blue); }\n    .callout.gold { border-left: 4px solid var(--gold); }\n    .callout p:last-child, .field-note p:last-child { margin-bottom: 0; }\n\n    .matrix {\n      display: grid;\n      grid-template-columns: 1.05fr repeat(3, 1fr);\n      margin-top: 1.5rem;\n      border-top: 1px solid var(--line);\n      border-left: 1px solid var(--line);\n      font-size: 0.84rem;\n    }\n\n    .matrix > div {\n      min-height: 4.7rem;\n      padding: 0.75rem;\n      border-right: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.58);\n    }\n\n    .matrix .matrix-head {\n      min-height: auto;\n      color: #fffaf1;\n      background: var(--accent);\n      font-family: var(--sans);\n      font-weight: 700;\n    }\n\n    .matrix .matrix-head code {\n      color: inherit;\n      background: transparent;\n    }\n\n    .matrix .row-head {\n      color: var(--muted);\n      background: var(--paper-deep);\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 700;\n      text-transform: uppercase;\n    }\n\n    .lab { padding: 1.35rem; }\n\n    .lab-header {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1rem;\n    }\n\n    .lab-header h3 { margin: 0; }\n\n    .step-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.1rem;\n      padding-bottom: 0.8rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .step-pill { padding: 0.35rem 0.68rem; color: var(--muted); font-size: 0.69rem; }\n    .step-pill.active { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); font-weight: 700; }\n    .step-pill.correct { border-color: var(--sage); color: #384937; background: var(--sage-soft); }\n    .step-pill.answered { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n\n    .quiz-kicker { margin: 0; color: var(--accent); font-family: var(--mono); font-size: 0.76rem; }\n    .quiz-prompt { margin: 0.55rem 0 0; font-size: 1.12rem; }\n\n    .choice-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.65rem;\n      margin-top: 1rem;\n    }\n\n    .choice {\n      position: relative;\n      min-height: 4.2rem;\n      border-radius: 0.5rem;\n      font-family: var(--sans);\n      font-size: 0.88rem;\n      line-height: 1.4;\n      text-align: left;\n    }\n\n    .choice.selected { border-color: var(--blue); background: var(--blue-soft); }\n    .choice.correct-answer { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n\n    .feedback {\n      display: none;\n      margin-top: 1rem;\n      padding: 0.9rem 1rem;\n      border-radius: 0.45rem;\n      font-size: 0.9rem;\n    }\n\n    .feedback.visible { display: block; }\n    .feedback.correct { color: #30452f; background: var(--sage-soft); }\n    .feedback.retry { color: #67451a; background: var(--gold-soft); }\n    .quiz-action-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }\n\n    .ledger { overflow: hidden; }\n\n    .ledger-item {\n      display: grid;\n      grid-template-columns: 1.3fr 1fr;\n      gap: 1rem;\n      align-items: center;\n      padding: 1.15rem 1.3rem;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .ledger-item h3 { margin: 0 0 0.3rem; font-size: 1.08rem; }\n    .ledger-item p { margin: 0; color: var(--muted); font-size: 0.88rem; }\n    .ledger-choices { display: flex; justify-content: flex-end; gap: 0.4rem; }\n    .ledger-choice[data-decision=\"adopt\"][aria-pressed=\"true\"] { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n    .ledger-choice[data-decision=\"adapt\"][aria-pressed=\"true\"] { border-color: var(--gold); color: #67451a; background: var(--gold-soft); }\n    .ledger-choice[data-decision=\"reject\"][aria-pressed=\"true\"] { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n    .ledger-footer { margin: 0; padding: 1rem 1.3rem; border-top: 0; }\n\n    .source-note { color: var(--muted); font-size: 0.88rem; }\n\n    @media (max-width: 820px) {\n      .trace { grid-template-columns: 1fr 1fr; }\n      .trace-step::after { display: none; }\n      .map-flow-line { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n      .map-flow-line .skill-node::after { display: none; }\n      .map-grid.standalone { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n      .matrix { grid-template-columns: 8rem repeat(3, minmax(11rem, 1fr)); overflow-x: auto; }\n      .matrix-wrap { overflow-x: auto; }\n    }\n\n    @media (max-width: 650px) {\n      main { padding-top: 3rem; }\n      .opening, .choice-grid, .map-intro, .map-lanes { grid-template-columns: 1fr; }\n      .trace { grid-template-columns: 1fr; }\n      .map-route-controls { justify-content: flex-start; }\n      .router-node, .map-flow-line, .map-grid, .map-grid.two, .map-grid.standalone { grid-template-columns: 1fr; }\n      .map-detour { grid-template-columns: 1fr; }\n      .map-detour > span { display: none; }\n      .case-heading { grid-template-columns: 1fr; }\n      .manuscript-layout { grid-template-columns: 1fr; }\n      .margin-rail {\n        display: grid;\n        gap: 0.7rem;\n        padding-left: 0;\n        border-left: 0;\n      }\n      .margin-comment { position: static; }\n      .margin-comment::before { display: none; }\n      .quiz-actions, .ledger-footer { align-items: flex-start; flex-direction: column; }\n      .case-actions { grid-template-columns: 1fr; gap: 0.9rem; min-height: 0; padding: 1.3rem; }\n      .case-actions .case-status, .case-nav-next { justify-self: start; }\n      .ledger-item { grid-template-columns: 1fr; }\n      .ledger-choices { justify-content: flex-start; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">第 3 课 · 案例精析与实战工坊\u003c/p>\n      \u003ch1 id=\"session-title\">观察设计如何落地生效\u003c/h1>\n      \u003cp class=\"lede\">第 1 课建立了分析坐标轴，第 2 课梳理了设计闭环。现在，请先俯瞰由 25 个 Skill 构成的完整体系，随后我们将通过 3 个真实案例剖析这些设计是如何落地的——并直面理论与真实代码之间的偏差与权衡。\u003c/p>\n      \u003cp class=\"meta\">65 分钟 · 1 张系统全景图 · 3 个真实案例 · 1 个迁移实战 · 进度本地保存\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"carry-forward\">核心心智\u003c/h2>\n          \u003cp>评估 Skill 时，不要只看它“写得漂不漂亮”。请逐一追踪：它能拦截什么失效？由谁触发？知识存放在哪一层？它如何约束模型行为？以及什么才算有效的验证证据？\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"session-artifact\">学习产出\u003c/h2>\n          \u003cp>你将带走一张涵盖全部 25 个 Skill 的可交互全景图、3 份完整的案例追踪记录，以及一份基于真实代码而非抽象偏好的取舍决策账本。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–15 分钟\u003c/span>\n      \u003ch2 id=\"reading-protocol\">1. 纵观全貌，再逐一追踪案例\u003c/h2>\n      \u003cp>表面格式极具欺骗性：篇幅很长的文件可能只是一套严密的纪律规范，而篇幅短小的文件背后却可能隐藏着庞大的依赖图谱。我们用固定的 5 个问题按顺序审视每个 Skill，让不同设计之间的差异一目了然。\u003c/p>\n\n      \u003cdiv class=\"protocol-card\">\n        \u003cspan class=\"label\">五步追踪法 (Five-part trace)\u003c/span>\n        \u003cdiv class=\"trace\">\n          \u003cdiv class=\"trace-step\">\u003cstrong>1 · 失效场景 (Failure)\u003c/strong>\u003cspan>什么反复出现的错误赋予了该 Skill 存在的意义？\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>2 · 交互接口 (Interface)\u003c/strong>\u003cspan>它是何种形态？调用权归谁所有？\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>3 · 信息分层 (Placement)\u003c/strong>\u003cspan>哪些信息内嵌在正文、按需披露，还是直接从环境中动态读取？\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>4 · 控制机制 (Control)\u003c/strong>\u003cspan>通过何种门禁、闭环或上下文隔离来矫正模型的默认行为？\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>5 · 验证证据 (Evidence)\u003c/strong>\u003cspan>哪种具体的观察结果能够证明控制确实生效？\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">第 1 课与第 2 课的知识交汇\u003c/span>\n        \u003cp>第 1 课剖析了\u003cstrong>外在接口\u003c/strong>（形态、触发方式、组合模式与证据标签）；第 2 课解构了\u003cstrong>内在机制\u003c/strong>（失效场景、上下文指针、信息分层、控制闭环与行为测试）。案例精析正是连接这两者的完整追踪过程。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"system-overview\" id=\"skill-system-overview\">\n        \u003cdiv class=\"map-intro\">\n          \u003cdiv>\n            \u003cspan class=\"label\">全局俯瞰 · 25 个 Skill\u003c/span>\n            \u003ch3 id=\"skill-system-map\">Skill 体系：以主干交付流为核心、底层能力为支撑\u003c/h3>\n            \u003cp>\u003ccode>ask-matt\u003c/code> 是由人工主动调用的\u003cspan class=\"term\" tabindex=\"0\" data-tip=\"路由器负责选择下游工作流或 Skill，其自身不执行具体的构建工作。\">路由器 (Router)\u003c/span>。它的核心价值在于架构梳理：一条主交付流将想法推进为上线代码，若干条\u003cspan class=\"term\" tabindex=\"0\" data-tip=\"入口从特定场景切入，在合适的节点汇入主工作流。\">分支入口 (On-ramp)\u003c/span>适时汇入主线，而底层统一词汇与独立工具则提供支撑，无需增加繁琐的流程阶段。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"map-route-controls\" role=\"group\" aria-label=\"高亮查看 Skill 系统的特定路径\">\n            \u003cbutton type=\"button\" data-map-route=\"all\" aria-pressed=\"true\">全部系统\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"idea\" aria-pressed=\"false\">我有新想法\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"incoming\" aria-pressed=\"false\">收到外部 Issue\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"bug\" aria-pressed=\"false\">系统出现故障\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"fog\" aria-pressed=\"false\">目标模糊不清\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cp class=\"map-route-note\" id=\"map-route-note\" aria-live=\"polite\">当前展示全部 Skill。每张卡片概括了 Skill 的核心目标；点击上方场景可高亮对应的执行路径。\u003c/p>\n\n        \u003cdiv class=\"skill-system-map\" id=\"skill-system-map-diagram\" aria-label=\"Matt Pocock 技能库完整架构图谱\">\n          \u003cdiv class=\"skill-node router-node\" data-skill-map-node data-routes=\"idea incoming bug fog\">\n            \u003ccode>/ask-matt\u003c/code>\n            \u003cspan>面向人类的导航：根据当前处境选择适配的工作流或 Skill，随后交出控制权。\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"skill-node map-precondition\" data-skill-map-node data-routes=\"idea incoming bug fog\">\n            \u003cdiv>\n              \u003ccode>/setup-matt-pocock-skills\u003c/code>\n              \u003cspan>初始化工程规范：配置 Issue 跟踪器、分诊标签及文档结构。\u003c/span>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>主交付流 · 想法 → 上线 (idea → ship)\u003c/h4>\n              \u003cspan>绝大多数功能特性的开发路径\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-flow-line\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/grill-with-docs\u003c/code>\n                \u003cspan>通过深度质询磨砺想法，将共识术语和关键决策沉淀在仓库中。\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea fog\">\n                \u003ccode>/to-spec\u003c/code>\n                \u003cspan>将对话与决策脉络收敛为可执行的技术规格 (Spec)。\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea fog\">\n                \u003ccode>/to-tickets\u003c/code>\n                \u003cspan>将规格拆分为示踪任务 (Tracer-bullet) 工单，显式声明阻塞依赖关系。\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"implementation-stack\">\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/implement\u003c/code>\n                  \u003cspan>依据已敲定的测试切入点 (Seam) 实现单个 Issue，完成评审并提交。\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/tdd\u003c/code>\n                  \u003cspan>以垂直切片方式，一次推进一个 Red → Green 循环。\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/code-review\u003c/code>\n                  \u003cspan>双轴并行独立评审 (Standards 代码规范 + Spec 需求规格)。\u003c/span>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"map-detour\">\n              \u003cspan>需要可运行的验证？\u003c/span>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/handoff\u003c/code>\n                \u003cspan>在跨目录、测试靶场、新会话或协作者之间传递核心上下文。\u003c/span>\n              \u003c/div>\n              \u003cspan>→\u003c/span>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/prototype\u003c/code>\n                \u003cspan>通过极简的抛弃型代码验证具体设计疑问，随后带回结论。\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>分支入口 (On-ramps)\u003c/h4>\n              \u003cspan>不同起点，精准汇入主线\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-grid\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"incoming\">\n                \u003ccode>/triage\u003c/code>\n                \u003cspan>将原始 Bug 反馈和零散需求转化为 Agent 就绪的标准 Issue。\u003c/span>\n                \u003csmall class=\"map-destination\">在 /implement 汇入 →\u003c/small>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"bug\">\n                \u003ccode>/diagnosing-bugs\u003c/code>\n                \u003cspan>在推演假设前先建立稳定复现 (Red) 的反馈闭环，随后用回归测试锁定修复。\u003c/span>\n                \u003csmall class=\"map-destination\">修复后可触发架构重构建议 →\u003c/small>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"fog\">\n                \u003ccode>/wayfinder\u003c/code>\n                \u003cspan>逐步决策工单，消除庞大迷茫项目中的不确定性，建立共享认知地图。\u003c/span>\n                \u003csmall class=\"map-destination\">在 /to-spec 汇入 →\u003c/small>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-lanes\">\n            \u003cdiv class=\"map-zone\">\n              \u003cdiv class=\"map-zone-heading\">\n                \u003ch4>代码库健康度\u003c/h4>\n                \u003cspan>日常维护孵化出更优质的技术演进想法\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"bug\">\n                \u003ccode>/improve-codebase-architecture\u003c/code>\n                \u003cspan>勘测代码库中的模块深化机会，将选定的改进项输入 \u003ccode>/grill-with-docs\u003c/code>。\u003c/span>\n              \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"map-zone\">\n              \u003cdiv class=\"map-zone-heading\">\n                \u003ch4>\u003cspan class=\"term\" tabindex=\"0\" data-tip=\"统一词汇层为多个工作流提供共享概念基石；当术语产生歧义或模块形态不佳时，也可直接调用。\">底层统一词汇\u003c/span>\u003c/h4>\n                \u003cspan>共享概念基石，不增加额外流程阶段\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"map-grid two\">\n                \u003cdiv class=\"skill-node\" data-skill-map-node>\n                  \u003ccode>/domain-modeling\u003c/code>\n                  \u003cspan>锤炼业务领域语言：辨析模糊概念、拆解多义词（如身兼数职的 account）、将重大决策记录为 ADR。\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node>\n                  \u003ccode>/codebase-design\u003c/code>\n                  \u003cspan>深模块设计词汇（模块、接口、深度、接缝、适配器、杠杆率、局部推理）：以精简接口隐藏复杂实现。\u003c/span>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>独立与辅助工具\u003c/h4>\n              \u003cspan>视具体情境触发，而非流水线硬性步骤\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-grid standalone\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/grill-me\u003c/code>\u003cspan>无状态的极限质询：运行同等深度的结构化面试，不产生本地持久化文件。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/grilling\u003c/code>\u003cspan>可复用的质询原语：轮次推进、决策前沿、Agent 梳理事实验证、人类敲定决策。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/resolving-merge-conflicts\u003c/code>\u003cspan>逐块处理合并或变基冲突，基于双方原始意图而非机械挑行解决冲突，完成操作。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/research\u003c/code>\u003cspan>在后台委派 Agent 调研一手资料，并在仓库中沉淀带引文的 Markdown 结论。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/to-questionnaire\u003c/code>\u003cspan>将知识盲区转化为结构化问卷，定向呈给能给出权威答案的业务方。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/wizard\u003c/code>\u003cspan>引导人类完成专属操作：云资源开通、凭据与 CI 密钥配置、第三方控制台操作、单次迁移执行。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/wait-what\u003c/code>\u003cspan>对晦涩表达的即时纠偏：在对话中补充缺失上下文，用简单直白的业务词汇重新表述。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/teach\u003c/code>\u003cspan>在当前目录的有状态工作区中，跨多个会话分步讲解复杂概念。\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/writing-for-agents\u003c/code>\u003cspan>面向 Agent 的写作规范：指导 Skill、AGENTS.md 以及指针关联文档的编写。\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cp class=\"map-source\">\u003cstrong>一条贯穿全局的操作法则：\u003c/strong>在阶段交接边界 (Phase boundary) 处，有意识地从“继续当前会话、清理上下文 (/clear)、写入交接文档 (/handoff)、委派子 Agent、上下文压缩 (/compact)”中作出权衡选择。本图谱基于 2026 年 8 月 11 日的最新代码库结构与公开文档重构。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">15–45 分钟\u003c/span>\n      \u003ch2 id=\"case-files\">2. 三大代表性 Skill，三种控制策略\u003c/h2>\n      \u003cp>你可以自由切换并研读以下案例。每个案例均提供了完整的 \u003ccode>SKILL.md\u003c/code> 源码与逐行旁注；切换与阅读状态会自动保存。\u003c/p>\n\n      \u003cdiv class=\"case-workbench\" id=\"case-workbench\">\n        \u003cdiv class=\"case-tabs\" role=\"tablist\" aria-label=\"案例研究\">\n          \u003cbutton class=\"case-tab\" id=\"case-tab-0\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-0\" data-case-index=\"0\">\u003cspan>案例 01 · 路由器\u003c/span>\u003cstrong>ask-matt\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-1\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-1\" data-case-index=\"1\">\u003cspan>案例 02 · 纪律规范\u003c/span>\u003cstrong>diagnosing-bugs\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-2\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-2\" data-case-index=\"2\">\u003cspan>案例 03 · 双轴评审\u003c/span>\u003cstrong>code-review\u003c/strong>\u003c/button>\n        \u003c/div>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-0\" role=\"tabpanel\" aria-labelledby=\"case-tab-0\" data-case-panel=\"0\">\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">01\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">人工显式触发 · 路由器 · 工作流全景图\u003c/p>\n              \u003ch3 id=\"ask-matt-case\">\u003ccode>ask-matt\u003c/code>：不越俎代庖，只专注导流\u003c/h3>\n              \u003cp>它的核心接口是方向引导：将“在何种情境下、按何种顺序使用哪个 Skill”明确为一个命名路由决策，随后即刻让渡控制权。\u003c/p>\n              \u003ca class=\"source-link\" href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">阅读 \u003ccode>SKILL.md\u003c/code> 原文 ↗\u003c/a>\n\n          \u003cp class=\"source-disclosure\">左侧为完整、未经修改的 \u003ccode>SKILL.md\u003c/code> 原文。右侧编号边注逐一解析其关键设计意图。\u003c/p>\n\n          \u003cdiv class=\"manuscript-layout\" aria-label=\"完整的 ask-matt 源码及逐行旁注\">\n            \u003cpre class=\"skill-manuscript\" aria-label=\"Complete original ask-matt SKILL.md\">\u003ccode>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-1\" data-line=\"1\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-2\" data-line=\"2\">name: ask-matt\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-l
