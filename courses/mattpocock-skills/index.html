});\n\n    const placementItems = [\n      {\n        shortLabel: \"Universal\",\n        prompt: \"Resolve the user’s request into an explicit target before editing.\",\n        question: \"Where should this instruction live?\",\n        options: [\n          { label: \"In-file step\", tip: \"The behavior applies on every run and establishes the scope boundary for everything that follows.\" },\n          { label: \"Disclosed reference\", tip: \"Best for material needed only on a distinct branch, not a universal first decision.\" },\n          { label: \"Environment\", tip: \"The user’s request is evidence, but the judgment of resolving it into an explicit target is not a cheap file lookup.\" },\n          { label: \"Remove as a no-op\", tip: \"Agents often infer scope, but explicit scope control is the very behavior this skill exists to stabilize.\" }\n        ],\n        answer: 0,\n        correctFeedback: \"Yes. It is universal, sequential behavior and belongs at the top of the hierarchy.\",\n        retryFeedback: \"Ask whether every run needs this judgment before later work can be safe.\"\n      },\n      {\n        shortLabel: \"Branch\",\n        prompt: \"When the change touches production database DDL, follow the rollout and rollback checklist in references/production-ddl.md.\",\n        question: \"Where should the detailed checklist live?\",\n        options: [\n          { label: \"Inline the whole checklist\", tip: \"Would force every code change to carry production-DDL detail, burying the universal path.\" },\n          { label: \"Disclosed reference\", tip: \"The pointer names a distinct branch and its trigger; only DDL work pays the detailed context.\" },\n          { label: \"Environment only\", tip: \"The repository may show migration files, but rollout and rollback policy is often a convention the files cannot fully explain.\" },\n          { label: \"Delete the branch\", tip: \"Rare does not mean irrelevant; the branch has high consequence and a crisp loading condition.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Correct. A high-consequence, branch-specific checklist is exactly what progressive disclosure is for.\",\n        retryFeedback: \"The material matters only when a crisp branch fires; avoid charging every run for it.\"\n      },\n      {\n        shortLabel: \"Lookup\",\n        prompt: \"Run npm test to execute this repository’s test suite.\",\n        question: \"Assume package.json already exposes the current test command. Where should this fact live?\",\n        options: [\n          { label: \"In-file reference\", tip: \"This duplicates a current value already owned elsewhere and will become stale if the script changes.\" },\n          { label: \"Disclosed reference\", tip: \"Moving the duplicate down a layer does not repair its second-source-of-truth problem.\" },\n          { label: \"Environment\", tip: \"The agent can inspect package.json cheaply and get the current command from its authoritative source.\" },\n          { label: \"Repeat it in every step\", tip: \"Duplication inflates prominence, consumes load, and multiplies maintenance points.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Exactly. Let package.json own the command; document only a convention or gotcha that the script cannot reveal.\",\n        retryFeedback: \"Prefer the authoritative, cheap lookup over a cached copy in prose.\"\n      },\n      {\n        shortLabel: \"No-op\",\n        prompt: \"Be professional and write high-quality code.\",\n        question: \"What is the best placement decision?\",\n        options: [\n          { label: \"In-file step\", tip: \"It sounds important but does not define a different process, gate, or observable result.\" },\n          { label: \"Disclosed reference\", tip: \"Hiding vague prose does not make it behaviorally useful.\" },\n          { label: \"Environment\", tip: \"This is not an environmental fact; it is an instruction that fails to specify a control lever.\" },\n          { label: \"Remove as a no-op\", tip: \"Delete the whole sentence unless a counterfactual test shows that it changes the relevant model’s behavior.\" }\n        ],\n        answer: 3,\n        correctFeedback: \"Right. Replace it only with a concrete lever tied to a known failure; otherwise delete it.\",\n        retryFeedback: \"Ask what observable behavior would differ if the sentence vanished.\"\n      }\n    ];\n\n    createStepper({\n      storageKey: \"placement-lab\",\n      items: placementItems,\n      nav: \"#placement-nav\",\n      count: \"#placement-count\",\n      prompt: \"#placement-line\",\n      question: \"#placement-question\",\n      choices: \"#placement-choices\",\n      feedback: \"#placement-feedback\",\n      previous: \"#placement-prev\",\n      skip: \"#placement-skip\",\n      check: \"#placement-check\",\n      next: \"#placement-next\",\n      completeFeedback: \"Placement complete: universal step, disclosed branch, environmental source of truth, and one deleted no-op.\"\n    });\n\n    const draftFields = [\"skill-name\", \"trigger\", \"core-step\", \"done-criterion\"];\n    const savedDraft = loadState(\"draft-builder\", {});\n    const preview = document.querySelector(\"#draft-preview\");\n    const copyButton = document.querySelector(\"#copy-draft\");\n    const copyStatus = document.querySelector(\"#copy-status\");\n\n    draftFields.forEach((fieldId) => {\n      const field = document.querySelector(`#${fieldId}`);\n      if (typeof savedDraft[fieldId] === \"string\") field.value = savedDraft[fieldId];\n      field.addEventListener(\"input\", updateDraft);\n    });\n\n    function safeSkillName(value) {\n      return value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, \"-\").replace(/^-+|-+$/g, \"\") || \"unnamed-skill\";\n    }\n\n    function currentDraft() {\n      const values = Object.fromEntries(draftFields.map((fieldId) => [fieldId, document.querySelector(`#${fieldId}`).value]));\n      const name = safeSkillName(values[\"skill-name\"]);\n      return `---\\nname: ${name}\\ndescription: ${values.trigger.trim()}\\n---\\n\\n# ${name}\\n\\n${values[\"core-step\"].trim()}\\n\\nThe work is complete when ${values[\"done-criterion\"].trim().replace(/^finish when\\s*/i, \"\")}\\n`;\n    }\n\n    function updateDraft() {\n      const values = Object.fromEntries(draftFields.map((fieldId) => [fieldId, document.querySelector(`#${fieldId}`).value]));\n      saveState(\"draft-builder\", values);\n      preview.textContent = currentDraft();\n      copyStatus.textContent = \"\";\n    }\n\n    copyButton.addEventListener(\"click\", async () => {\n      try {\n        await navigator.clipboard.writeText(currentDraft());\n        copyStatus.textContent = \"Draft copied. Your saved course version remains here too.\";\n      } catch (error) {\n        copyStatus.textContent = \"Clipboard access is unavailable. Select the draft above to copy it manually.\";\n      }\n    });\n\n    updateDraft();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session3.html","title":"Skill Case Studies","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Skill Case Studies\">\n  \u003ctitle>Skill Case Studies — MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --gold: #9a762f;\n      --gold-soft: #eee3c3;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.82);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 20;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 3px;\n      background: rgba(138, 78, 53, 0.12);\n    }\n\n    .progress-bar {\n      width: 0;\n      height: 100%;\n      background: var(--accent);\n      transition: width 120ms linear;\n    }\n\n    main {\n      width: min(100% - 3rem, 88ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    header { margin-bottom: 4rem; }\n    section { margin-top: 5rem; scroll-margin-top: 2rem; }\n\n    .eyebrow,\n    .meta,\n    .label,\n    .time,\n    button,\n    code,\n    pre,\n    .case-index,\n    .case-type,\n    .step-pill,\n    .term {\n      font-family: var(--mono);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.9rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3, h4 { line-height: 1.18; }\n\n    h1 {\n      max-width: 12ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.3rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h2 {\n      margin: 0 0 1.1rem;\n      font-size: clamp(1.85rem, 5vw, 2.35rem);\n      font-weight: 500;\n      letter-spacing: -0.028em;\n    }\n\n    h3 { margin: 1.8rem 0 0.65rem; font-size: 1.3rem; }\n    h4 { margin: 0 0 0.45rem; font-size: 1.02rem; }\n    p { margin: 0.8rem 0; }\n    ul, ol { padding-left: 1.3rem; }\n    li + li { margin-top: 0.48rem; }\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.84em;\n    }\n\n    pre {\n      overflow-x: auto;\n      margin: 0;\n      padding: 1rem;\n      border-radius: 0.48rem;\n      color: #f9f2e7;\n      background: #302b25;\n      font-size: 0.78rem;\n      line-height: 1.55;\n      white-space: pre-wrap;\n    }\n\n    pre code { padding: 0; color: inherit; background: transparent; }\n\n    .lede {\n      max-width: 55ch;\n      margin: 1.55rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta { color: var(--muted); font-size: 0.82rem; }\n    .time { display: inline-block; margin-bottom: 0.65rem; color: var(--accent); font-size: 0.75rem; }\n\n    .label {\n      display: block;\n      margin-bottom: 0.4rem;\n      color: var(--accent);\n      font-size: 0.73rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .opening,\n    .protocol-card,\n    .case-workbench,\n    .callout,\n    .lab,\n    .ledger,\n    .field-note {\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .opening {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.2rem;\n      margin-top: 2rem;\n      padding: 1.35rem;\n    }\n\n    .opening h2 {\n      margin-bottom: 0.65rem;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 800;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .opening p { margin: 0; font-size: 0.94rem; }\n\n    .protocol-card { padding: 1.35rem; }\n\n    .trace {\n      display: grid;\n      grid-template-columns: repeat(5, 1fr);\n      gap: 0.6rem;\n      margin-top: 1.2rem;\n    }\n\n    .trace-step {\n      position: relative;\n      min-height: 8.2rem;\n      padding: 0.9rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: rgba(255, 253, 248, 0.66);\n    }\n\n    .trace-step:not(:last-child)::after {\n      position: absolute;\n      z-index: 2;\n      top: 1.1rem;\n      right: -0.53rem;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n    }\n\n    .trace-step strong {\n      display: block;\n      font-family: var(--sans);\n      font-size: 0.86rem;\n    }\n\n    .trace-step span { display: block; margin-top: 0.35rem; color: var(--muted); font-size: 0.8rem; line-height: 1.45; }\n\n    .system-overview {\n      margin-top: 2rem;\n      padding: 1.35rem;\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: rgba(255, 253, 248, 0.72);\n      box-shadow: var(--shadow);\n    }\n\n    .map-intro {\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(14rem, 0.65fr);\n      gap: 1.2rem;\n      align-items: end;\n    }\n\n    .map-intro h3 { margin: 0; font-size: 1.45rem; }\n    .map-intro p { margin-bottom: 0; color: var(--muted); font-size: 0.9rem; }\n\n    .map-route-controls {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      justify-content: flex-end;\n    }\n\n    .map-route-controls button { padding: 0.42rem 0.66rem; }\n\n    .map-route-note {\n      min-height: 2.9rem;\n      margin: 0.9rem 0 0;\n      padding: 0.75rem 0.85rem;\n      border-left: 3px solid var(--blue);\n      color: #405663;\n      background: var(--blue-soft);\n      font-family: var(--sans);\n      font-size: 0.84rem;\n    }\n\n    .skill-system-map {\n      display: grid;\n      gap: 0.8rem;\n      margin-top: 1rem;\n    }\n\n    .map-zone {\n      padding: 0.95rem;\n      border: 1px solid var(--line);\n      border-radius: 0.55rem;\n      background: rgba(247, 242, 232, 0.52);\n    }\n\n    .map-zone-heading {\n      display: flex;\n      gap: 0.7rem;\n      align-items: baseline;\n      justify-content: space-between;\n      margin-bottom: 0.7rem;\n    }\n\n    .map-zone-heading h4 {\n      margin: 0;\n      font-family: var(--sans);\n      font-size: 0.86rem;\n    }\n\n    .map-zone-heading span:not(.term) {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.65rem;\n    }\n\n    .skill-node {\n      min-width: 0;\n      padding: 0.72rem 0.76rem;\n      border: 1px solid var(--line);\n      border-radius: 0.48rem;\n      background: #fffdf9;\n      transition: border-color 150ms ease, box-shadow 150ms ease, opacity 150ms ease, transform 150ms ease;\n    }\n\n    .skill-node code {\n      display: block;\n      width: fit-content;\n      margin-bottom: 0.28rem;\n      color: var(--accent-dark);\n      font-size: 0.71rem;\n      font-weight: 700;\n    }\n\n    .skill-node span {\n      display: block;\n      color: #514a42;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      line-height: 1.38;\n    }\n\n    .skill-node.is-active {\n      border-color: var(--accent);\n      box-shadow: 0 0 0 2px rgba(138, 78, 53, 0.12);\n      transform: translateY(-1px);\n    }\n\n    .skill-node.is-muted { opacity: 0.3; }\n\n    .router-node {\n      display: grid;\n      grid-template-columns: minmax(8rem, 0.35fr) minmax(0, 1fr);\n      gap: 0.75rem;\n      align-items: center;\n      border-color: var(--accent);\n      background: var(--accent-soft);\n    }\n\n    .router-node code { margin: 0; font-size: 0.78rem; }\n\n    .map-flow-line {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n      gap: 0.55rem;\n      align-items: stretch;\n    }\n\n    .map-flow-line .skill-node { position: relative; }\n\n    .map-flow-line .skill-node:not(:last-child)::after {\n      position: absolute;\n      z-index: 2;\n      top: 50%;\n      right: -0.47rem;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n      transform: translateY(-50%);\n    }\n\n    .implementation-stack {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.4rem;\n      grid-column: span 1;\n    }\n\n    .implementation-stack .skill-node:first-child { grid-column: 1 / -1; }\n    .implementation-stack .skill-node::after { display: none; }\n\n    .map-detour {\n      display: grid;\n      grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr);\n      gap: 0.5rem;\n      align-items: center;\n      margin-top: 0.65rem;\n      padding-top: 0.65rem;\n      border-top: 1px dashed var(--line);\n    }\n\n    .map-detour > span {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.67rem;\n    }\n\n    .map-lanes {\n      display: grid;\n      grid-template-columns: 1.15fr 0.85fr;\n      gap: 0.8rem;\n    }\n\n    .map-grid {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 0.55rem;\n    }\n\n    .map-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n    .map-grid.standalone { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n\n    .map-destination {\n      display: block;\n      margin-top: 0.35rem;\n      color: var(--accent);\n      font-family: var(--mono);\n      font-size: 0.63rem;\n    }\n\n    .map-precondition {\n      display: grid;\n      grid-template-columns: auto minmax(0, 1fr);\n      gap: 0.7rem;\n      align-items: center;\n      border-style: dashed;\n      background: var(--gold-soft);\n    }\n\n    .map-precondition::before {\n      color: var(--gold);\n      content: \"START\";\n      font-family: var(--mono);\n      font-size: 0.62rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n    }\n\n    .map-source {\n      margin: 0.85rem 0 0;\n      color: var(--muted);\n      font-size: 0.78rem;\n    }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      font-size: 0.9em;\n    }\n\n    .term::after,\n    .choice[data-tip]::after {\n      position: absolute;\n      z-index: 30;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(21rem, 80vw);\n      padding: 0.7rem 0.8rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-tip);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .term:hover::after,\n    .term:focus-visible::after,\n    .choice[data-tip]:hover::after,\n    .choice[data-tip]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .case-workbench {\n      width: min(calc(100vw - 3rem), 116ch);\n      margin-left: 50%;\n      overflow: hidden;\n      transform: translateX(-50%);\n    }\n\n    .case-tabs {\n      display: flex;\n      gap: 0.5rem;\n      overflow-x: auto;\n      padding: 1rem 1.1rem;\n      border-bottom: 1px solid var(--line);\n      background: rgba(238, 229, 214, 0.55);\n    }\n\n    button {\n      padding: 0.56rem 0.78rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--ink);\n      background: rgba(255, 253, 248, 0.76);\n      cursor: pointer;\n      font-size: 0.75rem;\n    }\n\n    button:hover,\n    button:focus-visible {\n      border-color: var(--accent);\n      outline: none;\n    }\n\n    button[aria-selected=\"true\"],\n    button[aria-pressed=\"true\"],\n    .primary-button {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    button:disabled { cursor: not-allowed; opacity: 0.45; }\n\n    .case-tab {\n      flex: 0 0 auto;\n      border-radius: 0.45rem;   .source-line {\n      position: relative;\n      display: block;\n      min-height: var(--source-line-height);\n      padding: 0 1.1rem 0 4.2rem;\n      font-size: 0.75rem;\n      overflow-wrap: anywhere;\n      white-space: pre-wrap;\n      word-break: break-word;\n    }\n\n    .source-line::before {\n      position: absolute;\n      left: 1.05rem;\n      width: 2.2rem;\n      color: #9e9589;\n      content: attr(data-line);\n      text-align: right;\n    }\n\n    .source-line.annotated {\n      border-left: 3px solid var(--gold);\n      background: var(--gold-soft);\n    }\n\n    .source-line:empty {\n      display: none;\n    }\n\n    .margin-rail {\n      position: relative;\n      min-width: 0;\n      border-left: 1px solid var(--line);\n    }\n\n    .margin-comment {\n      position: absolute;\n      top: var(--note-top, calc(1.2rem + (var(--line) - 1) * var(--source-line-height)));\n      right: 0;\n      left: 1rem;\n      padding: 0.8rem 0.85rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: #fffdf9;\n      box-shadow: var(--shadow);\n    }\n\n    .margin-comment::before {\n      position: absolute;\n      top: 0.95rem;\n      right: 100%;\n      width: 1rem;\n      border-top: 1px solid var(--gold);\n      content: \"\";\n    }\n\n    .margin-marker {\n      display: inline-grid;\n      width: 1.55rem;\n      height: 1.55rem;\n      margin-right: 0.35rem;\n      border-radius: 50%;\n      place-items: center;\n      color: #fffaf1;\n      background: var(--accent);\n      font-family: var(--mono);\n      font-size: 0.62rem;\n      font-weight: 700;\n      vertical-align: middle;\n    }\n\n    .margin-comment strong {\n      font-family: var(--sans);\n      font-size: 0.84rem;\n      vertical-align: middle;\n    }\n\n    .margin-comment p {\n      margin: 0.5rem 0 0;\n      color: #514a42;\n      font-size: 0.82rem;\n      line-height: 1.5;\n    }\n\n    .source-disclosure {\n      margin: 1rem 0 0;\n      padding: rgin-top: 1.5rem;\n      border-top: 1px solid var(--line);\n      border-left: 1px solid var(--line);\n      font-size: 0.84rem;\n    }\n\n    .matrix > div {\n      min-height: 4.7rem;\n      padding: 0.75rem;\n      border-right: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.58);\n    }\n\n    .matrix .matrix-head {\n      min-height: auto;\n      color: #fffaf1;\n      background: var(--accent);\n      font-family: var(--sans);\n      font-weight: 700;\n    }\n\n    .matrix .matrix-head code {\n      color: inherit;\n      background: transparent;\n    }\n\n    .matrix .row-head {\n      color: var(--muted);\n      background: var(--paper-deep);\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 700;\n      text-transform: uppercase;\n    }\n\n    .lab { padding: 1.35rem; }\n\n    .lab-header {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1rem;\n    }\n\n    .lab-header h3 { margin: 0; }\n\n    .step-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.1rem;\n      padding-bottom: 0.8rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .step-pill { padding: 0.35rem 0.68rem; color: var(--muted); font-size: 0.69rem; }\n    .step-pill.active { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); font-weight: 700; }\n    .step-pill.correct { border-color: var(--sage); color: #384937; background: var(--sage-soft); }\n    .step-pill.answered { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n\n    .quiz-kicker { margin: 0; color: var(--accent); font-family: var(--mono); font-size: 0.76rem; }\n    .quiz-prompt { margin: 0.55rem 0 0; font-size: 1.12rem; }\n\n    .choice-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.65rem;\n      margin-top: 1rem;\n    }\n\n    .choice {\n      position: relative;\n      min-height: 4.2rem;\n      border-radius: 0.5rem;\n      font-family: var(--sans);\n      font-size: 0.88rem;\n      line-height: 1.4;\n      text-align: left;\n    }\n\n    .choice.selected { border-color: var(--blue); background: var(--blue-soft); }\n    .choice.correct-answer { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n\n    .feedback {\n      display: none;\n      margin-top: 1rem;\n      padding: 0.9rem 1rem;\n      border-radius: 0.45rem;\n      font-size: 0.9rem;\n    }\n\n    .feedback.visible { display: block; }\n    .feedback.correct { color: #30452f; background: var(--sage-soft); }\n    .feedback.retry { color: #67451a; background: var(--gold-soft); }\n    .quiz-action-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }\n\n    .ledger { overflow: hidden; }\n\n    .ledger-item {\n      display: grid;\n      grid-template-columns: 1.3fr 1fr;\n      gap: 1rem;\n      align-items: center;\n      padding: 1.15rem 1.3rem;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .ledger-item h3 { margin: 0 0 0.3rem; font-size: 1.08rem; }\n    .ledger-item p { margin: 0; color: var(--muted); font-size: 0.88rem; }\n    .ledger-choices { display: flex; justify-content: flex-end; gap: 0.4rem; }\n    .ledger-choice[data-decision=\"adopt\"][aria-pressed=\"true\"] { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n    .ledger-choice[data-decision=\"adapt\"][aria-pressed=\"true\"] { border-color: var(--gold); color: #67451a; background: var(--gold-soft); }\n    .ledger-choice[data-decision=\"reject\"][aria-pressed=\"true\"] { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n    .ledger-footer { margin: 0; padding: 1rem 1.3rem; border-top: 0; }\n\n    .source-note { color: var(--muted); font-size: 0.88rem; }\n\n    @media (max-width: 820px) {\n      .trace { grid-template-columns: 1fr 1fr; }\n      .trace-step::after { display: none; }\n      .map-flow-line { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n      .map-flow-line .skill-node::after { display: none; }\n      .map-grid.standalone { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n      .matrix { grid-template-columns: 8rem repeat(3, minmax(11rem, 1fr)); overflow-x: auto; }\n      .matrix-wrap { overflow-x: auto; }\n    }\n\n    @media (max-width: 650px) {\n      main { padding-top: 3rem; }\n      .opening, .choice-grid, .map-intro, .map-lanes { grid-template-columns: 1fr; }\n      .trace { grid-template-columns: 1fr; }\n      .map-route-controls { justify-content: flex-start; }\n      .router-node, .map-flow-line, .map-grid, .map-grid.two, .map-grid.standalone { grid-template-columns: 1fr; }\n      .map-detour { grid-template-columns: 1fr; }\n      .map-detour > span { display: none; }\n      .case-heading { grid-template-columns: 1fr; }\n      .manuscript-layout { grid-template-columns: 1fr; }\n      .margin-rail {\n        display: grid;\n        gap: 0.7rem;\n        padding-left: 0;\n        border-left: 0;\n      }\n      .margin-comment { position: static; }\n      .margin-comment::before { display: none; }\n      .quiz-actions, .ledger-footer { align-items: flex-start; flex-direction: column; }\n      .case-actions { grid-template-columns: 1fr; gap: 0.9rem; min-height: 0; padding: 1.3rem; }\n      .case-actions .case-status, .case-nav-next { justify-self: start; }\n      .ledger-item { grid-template-columns: 1fr; }\n      .ledger-choices { justify-content: flex-start; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Session 3 · Case-study studio\u003c/p>\n      \u003ch1 id=\"session-title\">Watch the design work\u003c/h1>\n      \u003cp class=\"lede\">The first session gave you analytical axes. The second gave you a design loop. Now orient in the full portfolio before three real skills make those ideas visible—or expose where the theory does not quite explain the file.\u003c/p>\n      \u003cp class=\"meta\">65 minutes · one system map · three case files · one transfer lab · progress saved locally\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"carry-forward\">Carry forward\u003c/h2>\n          \u003cp>Do not ask whether a skill “looks good.” Trace what failure it prevents, who invokes it, where its knowledge lives, how it constrains behavior, and what would count as evidence.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"session-artifact\">Your artifact\u003c/h2>\n          \u003cp>You will leave with a working map of all 25 skills, three completed traces, and a revised borrowing ledger grounded in concrete files rather than abstract preference.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–15 minutes\u003c/span>\n      \u003ch2 id=\"reading-protocol\">1. See the system, then trace the cases\u003c/h2>\n      \u003cp>Surface formats mislead. A long file can be a tight discipline; a short file can hide a large dependency graph. Run the same five questions in the same order so the differences become comparable.\u003c/p>\n\n      \u003cdiv class=\"protocol-card\">\n        \u003cspan class=\"label\">The five-part trace\u003c/span>\n        \u003cdiv class=\"trace\">\n          \u003cdiv class=\"trace-step\">\u003cstrong>1 · Failure\u003c/strong>\u003cspan>What recurring mistake gives this skill a reason to exist?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>2 · Interface\u003c/strong>\u003cspan>What shape is it, and who owns invocation?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>3 · Placement\u003c/strong>\u003cspan>What is inline, disclosed, or recovered from the environment?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>4 · Control\u003c/strong>\u003cspan>What gate, loop, or separation changes the model’s default?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>5 · Evidence\u003c/strong>\u003cspan>What observation could show that the control worked?\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">How Sessions 1 and 2 meet\u003c/span>\n        \u003cp>Session 1 explains the \u003cem>interface\u003c/em>: shape, invocation, composition, and evidence labels. Session 2 explains the \u003cem>mechanism\u003c/em>: problem, pointer, information layer, control loop, and test. A case study is the full trace from one to the other.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"system-overview\" id=\"skill-system-overview\">\n        \u003cdiv class=\"map-intro\">\n          \u003cdiv>\n            \u003cspan class=\"label\">Bird’s-eye view · 25 skills\u003c/span>\n            \u003ch3 id=\"skill-system-map\">The portfolio is a flow with support underneath\u003c/h3>\n            \u003cp>\u003ccode>ask-matt\u003c/code> is the human-chosen \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"A router chooses the next workflow or skill; it does not perform the downstream work itself.\">router\u003c/span>. Its most useful claim is structural: one main route carries ideas toward shipped code, several \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"An on-ramp starts from a different situation, then joins an existing workflow at the appropriate step.\">on-ramps\u003c/span> join that route, and vocabulary plus standalone tools support work without becoming extra stages.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"map-route-controls\" role=\"group\" aria-label=\"Highlight a route through the skill system\">\n            \u003cbutton type=\"button\" data-map-route=\"all\" aria-pressed=\"true\">Whole system\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"idea\" aria-pressed=\"false\">I have an idea\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"incoming\" aria-pressed=\"false\">Issues arrived\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"bug\" aria-pressed=\"false\">Something broke\u003c/button>\n            \u003cbutton type=\"button\" data-map-route=\"fog\" aria-pressed=\"false\">The effort is foggy\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cp class=\"map-route-note\" id=\"map-route-note\" aria-live=\"polite\">The whole portfolio is visible. Each card states the skill’s goal; choose a starting situation to reveal one route through the system.\u003c/p>\n\n        \u003cdiv class=\"skill-system-map\" id=\"skill-system-map-diagram\" aria-label=\"Map of every skill in the Matt Pocock skills repository\">\n          \u003cdiv class=\"skill-node router-node\" data-skill-map-node data-routes=\"idea incoming bug fog\">\n            \u003ccode>/ask-matt\u003c/code>\n            \u003cspan>Orient the human: choose a fitting flow or skill, then hand control away.\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"skill-node map-precondition\" data-skill-map-node data-routes=\"idea incoming bug fog\">\n            \u003cdiv>\n              \u003ccode>/setup-matt-pocock-skills\u003c/code>\n              \u003cspan>Configure the issue tracker, triage labels, and documentation layout the engineering flows assume.\u003c/span>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>Main flow · idea → ship\u003c/h4>\n              \u003cspan>the route most feature work travels\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-flow-line\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/grill-with-docs\u003c/code>\n                \u003cspan>Sharpen an idea by interview while preserving shared terms and decisions in the repo.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea fog\">\n                \u003ccode>/to-spec\u003c/code>\n                \u003cspan>Collapse the conversation or decision map into a buildable specification.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea fog\">\n                \u003ccode>/to-tickets\u003c/code>\n                \u003cspan>Split a plan into tracer-bullet tickets with explicit blocking edges.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"implementation-stack\">\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/implement\u003c/code>\n                  \u003cspan>Build one issue from agreed seams through review and commit.\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/tdd\u003c/code>\n                  \u003cspan>Drive one vertical red–green slice at a time.\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea incoming fog\">\n                  \u003ccode>/code-review\u003c/code>\n                  \u003cspan>Judge Standards and Spec independently.\u003c/span>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"map-detour\">\n              \u003cspan>runnable question?\u003c/span>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/handoff\u003c/code>\n                \u003cspan>Carry essential context across a new directory, harness, session, or collaborator.\u003c/span>\n              \u003c/div>\n              \u003cspan>→\u003c/span>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"idea\">\n                \u003ccode>/prototype\u003c/code>\n                \u003cspan>Answer one design question with a small throwaway program, then return the finding.\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>On-ramps\u003c/h4>\n              \u003cspan>different starts, deliberate merge points\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-grid\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"incoming\">\n                \u003ccode>/triage\u003c/code>\n                \u003cspan>Turn raw incoming bugs and requests into agent-ready issues.\u003c/span>\n                \u003csmall class=\"map-destination\">joins at /implement →\u003c/small>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"bug\">\n                \u003ccode>/diagnosing-bugs\u003c/code>\n                \u003cspan>Build a red-capable feedback loop before theorizing, then fix with a regression test.\u003c/span>\n                \u003csmall class=\"map-destination\">fixes, then may feed upkeep →\u003c/small>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"fog\">\n                \u003ccode>/wayfinder\u003c/code>\n                \u003cspan>Resolve decision tickets until a huge, foggy effort has a shared map.\u003c/span>\n                \u003csmall class=\"map-destination\">joins at /to-spec →\u003c/small>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-lanes\">\n            \u003cdiv class=\"map-zone\">\n              \u003cdiv class=\"map-zone-heading\">\n                \u003ch4>Codebase health\u003c/h4>\n                \u003cspan>upkeep generates better ideas\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node data-routes=\"bug\">\n                \u003ccode>/improve-codebase-architecture\u003c/code>\n                \u003cspan>Survey for deepening opportunities, then feed a chosen improvement into \u003ccode>/grill-with-docs\u003c/code>.\u003c/span>\n              \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"map-zone\">\n              \u003cdiv class=\"map-zone-heading\">\n                \u003ch4>\u003cspan class=\"term\" tabindex=\"0\" data-tip=\"A vocabulary layer supplies shared concepts to several workflows; it can also be invoked directly when terminology or module shape is the problem.\">Vocabulary underneath\u003c/span>\u003c/h4>\n                \u003cspan>shared words, not extra stages\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"map-grid two\">\n                \u003cdiv class=\"skill-node\" data-skill-map-node>\n                  \u003ccode>/domain-modeling\u003c/code>\n                  \u003cspan>Sharpen domain terms, scenarios, glossaries, and hard-to-reverse decisions.\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"skill-node\" data-skill-map-node>\n                  \u003ccode>/codebase-design\u003c/code>\n                  \u003cspan>Shape deep modules with small interfaces, clean seams, and local reasoning.\u003c/span>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"map-zone\">\n            \u003cdiv class=\"map-zone-heading\">\n              \u003ch4>Standalone and supporting tools\u003c/h4>\n              \u003cspan>use when the situation—not the pipeline—calls for them\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"map-grid standalone\">\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/grill-me\u003c/code>\u003cspan>Run the same relentless interview without saving state to a working directory.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/grilling\u003c/code>\u003cspan>Supply the reusable interview primitive: rounds, frontier, facts, and human decisions.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/resolving-merge-conflicts\u003c/code>\u003cspan>Resolve an active merge or rebase conflict by intent and finish the operation.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/research\u003c/code>\u003cspan>Investigate primary sources in the background and leave a cited Markdown finding.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/to-questionnaire\u003c/code>\u003cspan>Turn a knowledge gap into questions for the person who can answer it.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/wizard\u003c/code>\u003cspan>Guide a human through credentials, dashboards, provisioning, or other human-only steps.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/wait-what\u003c/code>\u003cspan>Re-pitch an explanation that failed to land, using the missing context and shared vocabulary.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/teach\u003c/code>\u003cspan>Teach a concept across multiple stateful sessions in the current directory.\u003c/span>\u003c/div>\n              \u003cdiv class=\"skill-node\" data-skill-map-node>\u003ccode>/writing-for-agents\u003c/code>\u003cspan>Guide writing for skills, agent instructions, and documents reached by pointers.\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cp class=\"map-source\">\u003cstrong>One operating rule crosses the map:\u003c/strong> at a phase boundary, choose deliberately among continuing, clearing, handing off, delegating to a subagent, or compacting. Diagram reconstructed from the current \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>ask-matt/SKILL.md\u003c/code>\u003c/a> and the repository’s engineering/productivity indexes, checked August 11, 2026.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">15–45 minutes\u003c/span>\n      \u003ch2 id=\"case-files\">2. Three skills, three control strategies\u003c/h2>\n      \u003cp>Move freely between the cases. Each case links to its original \u003ccode>SKILL.md\u003c/code>; your current case and lens are restored when you return.\u003c/p>\n\n      \u003cdiv class=\"case-workbench\" id=\"case-workbench\">\n        \u003cdiv class=\"case-tabs\" role=\"tablist\" aria-label=\"Case studies\">\n          \u003cbutton class=\"case-tab\" id=\"case-tab-0\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-0\" data-case-index=\"0\">\u003cspan>Case 01 · Router\u003c/span>\u003cstrong>ask-matt\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-1\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-1\" data-case-index=\"1\">\u003cspan>Case 02 · Discipline\u003c/span>\u003cstrong>diagnosing-bugs\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-2\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-2\" data-case-index=\"2\">\u003cspan>Case 03 · Review\u003c/span>\u003cstrong>code-review\u003c/strong>\u003c/button>\n        \u003c/div>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-0\" role=\"tabpanel\" aria-labelledby=\"case-tab-0\" data-case-panel=\"0\">\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">01\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Human-invoked · router · map of flows\u003c/p>\n              \u003ch3 id=\"ask-matt-case\">\u003ccode>ask-matt\u003c/code>: useful because it does not do the work\u003c/h3>\n              \u003cp>Its interface is orientation. It turns “which skill, in what order?” into a named routing decision, then hands control away.\u003c/p>\n              \u003ca class=\"source-link\" href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">Read the original \u003ccode>SKILL.md\u003c/code> ↗\u003c/a>\n\n          \u003cp class=\"source-disclosure\">The left column is the complete, unmodified \u003ccode>SKILL.md\u003c/code>. Read it continuously; the numbered margin comments point to important design decisions without replacing the source.\u003c/p>\n\n          \u003cdiv class=\"manuscript-layout\" aria-label=\"Complete ask-matt source with teacher comments\">\n            \u003cpre class=\"skill-manuscript\" aria-label=\"Complete original ask-matt SKILL.md\">\u003ccode>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-1\" data-line=\"1\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-2\" data-line=\"2\">name: ask-matt\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-3\" data-line=\"3\">description: Ask which skill or flow fits your situation. A router over the skills in this repo.\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-4\" data-line=\"4\">disable-model-invocation: true\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-5\" data-line=\"5\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-6\" data-line=\"6\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-7\" data-line=\"7\"># Ask Matt\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-8\" data-line=\"8\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-9\" data-line=\"9\">You don't remember every skill, so ask.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-10\" data-line=\"10\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-11\" data-line=\"11\">A **flow** is a path through the skills. Most paths run along one **main flow**, and two **on-ramps** merge onto it. Everything else is standalone, or a vocabulary layer that runs underneath.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-12\" data-line=\"12\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-13\" data-line=\"13\">## The main flow: idea → ship\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-14\" data-line=\"14\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-15\" data-line=\"15\">The route most work travels. You have an idea and want it built.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-16\" data-line=\"16\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-17\" data-line=\"17\">1. **`/grill-with-docs`** — sharpen the idea by interview. Start here whenever you are **working in a working directory**: it's stateful, retaining what it learns in `CONTEXT.md` and ADRs. (No working directory? Use `/grill-me` — see Standalone. Both run the same `/grilling` primitive; `grill-with-docs` is the one that leaves a paper trail, which makes it the better of the two whenever a repo is there to leave it in.)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-18\" data-line=\"18\">2. **Branch — can you settle every question in conversation?** If a question needs a runnable answer (state, business logic, a UI you have to see), detour through a prototype, bridged by **`/handoff`** in both directions (a prototype lives in its own directory, which is exactly what `/handoff` is for — see Phase boundaries):\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-19\" data-line=\"19\">   - **`/handoff`** out, then open a fresh session against that file,\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-20\" data-line=\"20\">   - **`/prototype`** to answer the question with throwaway code,\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-21\" data-line=\"21\">   - **`/handoff`** back what you learned, and reference it from the original idea thread.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-22\" data-line=\"22\">3. **Branch — is this a multi-session build?**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-23\" data-line=\"23\">   - **Yes** → **`/to-spec`** (turn the thread into a spec), then **`/to-tickets`** to split it into tracer-bullet tickets, each declaring its **blocking edges**. On a local tracker that's one file per ticket under `.scratch/&lt;feature&gt;/issues/`, worked blockers-first by hand; on a real tracker the edges become native blocking links, so any ticket whose blockers are done can be grabbed — kick off **`/implement`** per ticket, **`/clear`ing context between each one**. Each ticket is self-contained, so the last one's context is disposable.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-24\" data-line=\"24\">   - **No** → **`/implement`** right here, in the same context window.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-25\" data-line=\"25\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-26\" data-line=\"26\">   Either way, **`/implement`** builds each issue by driving **`/tdd`** internally — one red-green slice at a time — then closes out by running **`/code-review`**, a two-axis review (Standards + Spec) of the diff, before committing. Reach for **`/tdd`** on its own when you just want to build a concrete behaviour test-first without a full spec, and **`/code-review`** on its own whenever you want to review a branch or PR against a fixed point.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-27\" data-line=\"27\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-28\" data-line=\"28\">### Context hygiene\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-29\" data-line=\"29\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-30\" data-line=\"30\">Keep steps 1–3 in **one unbroken context window** — don't compact or clear until after `/to-tickets` — so the grilling, spec, and tickets all build on the same thinking. Each `/implement` then starts fresh, working from the ticket.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-31\" data-line=\"31\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-32\" data-line=\"32\">The limit on this is the **[smart zone](https://www.aihero.dev/ai-coding-dictionary/smart-zone)**: the window (~150k tokens on state-of-the-art models) within which the model still reasons sharply. If a session approaches it before `/to-tickets`, don't push on degraded — `/compact` at the nearest phase boundary and carry on (see Phase boundaries).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-33\" data-line=\"33\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-34\" data-line=\"34\">## On-ramps\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-35\" data-line=\"35\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-36\" data-line=\"36\">A starting situation that generates work, then merges onto the main flow.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-37\" data-line=\"37\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-38\" data-line=\"38\">- **Bugs and requests piling up** → **`/triage`**. It moves issues through triage roles and produces agent-ready issues, which **`/implement`** later picks up.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-39\" data-line=\"39\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-40\" data-line=\"40\">  Triage is only for issues **you didn't create** — bug reports, incoming feature requests, anything that arrives raw. Tickets that `/to-tickets` produced are already agent-ready, so **don't triage them**.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-41\" data-line=\"41\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-42\" data-line=\"42\">- **Something's broken** → **`/diagnosing-bugs`**. For the hard ones: the bug that resists a first glance, the intermittent flake, the regression that crept in between two known-good states. It refuses to theorise until it has a **tight feedback loop** — one command that already goes red on *this* bug — then fixes with a regression test. Its post-mortem hands off to **`/improve-codebase-architecture`** when the real finding is that there's no good seam to lock the bug down.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-43\" data-line=\"43\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-44\" data-line=\"44\">- **A huge, foggy effort — a greenfield project or a huge feature build, too big for one session** → **`/wayfinder`**, the most cognitively demanding flow here. When the way from here to the destination isn't visible yet, it charts a **shared map** of **decision tickets** on the issue tracker and resolves them one at a time — producing **decisions, not deliverables** — until the fog is pushed back and the way is clear. Where **`/grill-with-docs`** sharpens an idea you can hold in one session, wayfinder is for the idea you can't — and it's slower and denser, so save it for exactly that, never a well-scoped feature.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-45\" data-line=\"45\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-46\" data-line=\"46\">  When the map clears, **it hands off, it doesn't build**: merge onto the main flow at **`/to-spec`**, which collapses the map's linked decisions into a buildable plan, then `/to-tickets` and `/implement` as usual. Looping the map straight into `/implement` skips that collapse and throws the linked detail away — go straight to `/implement` only when the effort turned out genuinely small.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-47\" data-line=\"47\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-48\" data-line=\"48\">## Codebase health\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-49\" data-line=\"49\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-50\" data-line=\"50\">Not feature work — upkeep.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-51\" data-line=\"51\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-52\" data-line=\"52\">- **`/improve-codebase-architecture`** — run whenever you have a spare moment to keep the codebase good for agents to operate in. It surfaces **deepening opportunities**; picking one _generates an idea_ you can take into the main flow at `/grill-with-docs`. It's the survey that finds the candidates; **`/codebase-design`** (below) is the bench you design the chosen one on.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-53\" data-line=\"53\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-54\" data-line=\"54\">## Vocabulary underneath\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-55\" data-line=\"55\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-56\" data-line=\"56\">Two model-invoked references that run *beneath* the other skills — each the single source of truth for its vocabulary. Reach for them directly when the **words**, not the process, are the problem; or let the skills above pull them in.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-57\" data-line=\"57\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-58\" data-line=\"58\">- **`/domain-modeling`** — sharpen the project's *domain* language: challenge a fuzzy term, resolve an overloaded word (\"account\" doing three jobs), record a hard-to-reverse decision as an ADR. It's the active discipline `/grill-with-docs` drives to keep `CONTEXT.md` a clean glossary.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-59\" data-line=\"59\">- **`/codebase-design`** — the deep-module vocabulary (module, interface, depth, seam, adapter, leverage, locality) for designing a module's *shape*: a lot of behaviour behind a small interface at a clean seam. `/tdd` and `/improve-codebase-architecture` both speak it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-60\" data-line=\"60\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-61\" data-line=\"61\">## Phase boundaries\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-62\" data-line=\"62\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-63\" data-line=\"63\">A **phase** is a chunk of work inside a session — the grilling, the implementation, the QA. At the **boundary** between two of them you have five options, and picking between them is the fuzziest decision in this whole map:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-64\" data-line=\"64\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-65\" data-line=\"65\">- **Continue** — stay put. Costs nothing, loses nothing.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-66\" data-line=\"66\">- **`/clear`** — empty the window, when nothing here matters to what's next.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-67\" data-line=\"67\">- **`/handoff`** — write a portable markdown file. Narrow: only for a **new harness**, a **new directory**, a **colleague**, or forking a side task **mid-phase**. What it buys is portability.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-68\" data-line=\"68\">- **Subagent** — send a tightly-scoped task to its own window and get a report back.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-69\" data-line=\"69\">- **`/compact`** — compress this context and seed a fresh session with it. The **default**, at the bottom of the tree rather than the first reach.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-70\" data-line=\"70\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-71\" data-line=\"71\">Read [PHASE-BOUNDARIES.md](PHASE-BOUNDARIES.md) for the ordered tree — the five questions, the reasoning behind each branch, and why the primary-source cost makes **Continue** the one to rule out first. Make the decision **at** a boundary; mid-phase, continue or split the rest into subagents.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-72\" data-line=\"72\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-73\" data-line=\"73\">## Standalone\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-74\" data-line=\"74\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-75\" data-line=\"75\">Off the main flow entirely.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-76\" data-line=\"76\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-77\" data-line=\"77\">- **`/grill-me`** — the same relentless interview as `/grill-with-docs`, but **stateless**: it saves nothing locally and builds no `CONTEXT.md`. Reach for it when you are **not working in a working directory** — sharpening a plan, a design, a piece of writing, anything with no repo under it. If you are in a working directory, use `/grill-with-docs` instead: it runs the same interview and leaves a paper trail, so it is strictly the better one.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-78\" data-line=\"78\">- **`/grilling`** — the interview primitive itself: rounds, the frontier, facts are the agent's job and decisions are yours. `/grill-me` and `/grill-with-docs` are the two named ways in, and `/triage`, `/wayfinder` and `/improve-codebase-architecture` all run it internally. Reach for it directly only when you want the interview with no wrapper around it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-79\" data-line=\"79\">- **`/resolving-merge-conflicts`** — work an in-progress merge or rebase conflict hunk by hunk, resolving by **intent** traced to each side's primary source rather than by picking lines, then finish the operation. It never runs `--abort`. Standalone and off every flow: reach for it when you are already mid-conflict.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-80\" data-line=\"80\">- **`/prototype`** — a small, throwaway program that answers one design question: does this state model feel right, or what should this UI look like. Throwaway is a constraint on how the code is written, not a promise to destroy it: the answer folds into the real code, and the prototype itself is kept as a **primary source** on a `prototype/&lt;name&gt;` branch out of main, pointed at from the implementation issue. It's the detour in step 2 of the main flow, but reach for it any time a design question is hard to settle on paper.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-81\" data-line=\"81\">- **`/research`** — delegate reading legwork to a **background agent**: it investigates a question against **primary sources**, then leaves a cited Markdown file in the repo. Keep working while it reads. The file it produces is something to take *into* the main flow at `/grill-with-docs` — research feeds the thinking, it doesn't replace it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-82\" data-line=\"82\">- **`/to-questionnaire`** — when the thing blocking you isn't in your head or the codebase but in **someone else's**, this writes them a questionnaire to fill in. It's the inverse of `/grill-me`: instead of interviewing you about the subject, it interviews you about the **send** — who it's going to, what you need back — and aims the questions at the gap. What comes back is material for `/grill-with-docs` or `/to-spec`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-83\" data-line=\"83\">- **`/wizard`** — for the steps only a **human** can take: provisioning infrastructure, setting up credentials or CI secrets, clicking through an unfamiliar third-party dashboard, running a one-off migration or cutover. It generates an interactive bash script that opens each URL, captures each value, and writes it into `.env` and GitHub secrets — so the procedure stops being something you re-explain to an agent every time. Model-invoked, so the agent reaches for it the moment it hits a wall only you can pass. If the agent could just do it itself, it should; this is for where a human is genuinely in the loop.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-84\" data-line=\"84\">- **`/wait-what`** — the corrective for a message that didn't land. Use it mid-conversation, inside any other skill, and the agent re-pitches what it just said with the context you were missing, in plain English, using the `CONTEXT.md` vocabulary. It works after the fact; `/grill-with-docs` is the upfront cure, because a shared language agreed early is what stops the jargon arriving at all.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-85\" data-line=\"85\">- **`/teach`** — learn a concept over multiple sessions, using the current directory as a stateful workspace.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-86\" data-line=\"86\">- **`/writing-for-agents`** — reference for writing documents agents consume: skills, AGENTS.md, pointed-at docs.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-87\" data-line=\"87\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"ask-matt-source-line-88\" data-line=\"88\">## Precondition\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-89\" data-line=\"89\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"ask-matt-source-line-90\" data-line=\"90\">**`/setup-matt-pocock-skills`** — run before your first engineering flow to configure the issue tracker, triage labels, and doc layout the other skills assume. Custom issue trackers also work.\u003c/span>\n            \u003c/code>\u003c/pre>\n            \u003caside class=\"margin-rail\" aria-label=\"Teacher comments on ask-matt\">\n            \u003cdiv class=\"margin-comment\" style=\"--line: 4\" aria-labelledby=\"ask-matt-source-line-4\">\n              \u003cspan class=\"margin-marker\">01\u003c/span>\u003cstrong>Invocation ownership\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-4\">Line 4\u003c/a> · The metadata makes this a menu you choose yourself. The agent cannot silently route through it.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 13\" aria-labelledby=\"ask-matt-source-line-13\">\n              \u003cspan class=\"margin-marker\">02\u003c/span>\u003cstrong>The main route\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-13\">Line 13\u003c/a> · This heading begins the default path from an idea to implementation. The numbered branches below are the router’s central work.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 28\" aria-labelledby=\"ask-matt-source-line-28\">\n              \u003cspan class=\"margin-marker\">03\u003c/span>\u003cstrong>Protect connected context\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-28\">Line 28\u003c/a> · Interview, spec, and tickets stay together; each implementation ticket starts fresh. Context boundaries are part of the workflow.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 34\" aria-labelledby=\"ask-matt-source-line-34\">\n              \u003cspan class=\"margin-marker\">04\u003c/span>\u003cstrong>Three different entrances\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-34\">Line 34\u003c/a> · Raw incoming work, a stubborn bug, and a huge foggy effort join the main route in different places.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 54\" aria-labelledby=\"ask-matt-source-line-54\">\n              \u003cspan class=\"margin-marker\">05\u003c/span>\u003cstrong>Shared vocabulary\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-54\">Line 54\u003c/a> · These two skills supply common words to other workflows. They are reference layers, not extra ceremonies.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 61\" aria-labelledby=\"ask-matt-source-line-61\">\n              \u003cspan class=\"margin-marker\">06\u003c/span>\u003cstrong>Progressive disclosure\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-61\">Line 61\u003c/a> · The five phase-boundary choices stay visible here; the detailed decision tree lives in a separate referenced file.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 73\" aria-labelledby=\"ask-matt-source-line-73\">\n              \u003cspan class=\"margin-marker\">07\u003c/span>\u003cstrong>Outside the pipeline\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-73\">Line 73\u003c/a> · The standalone list prevents the idea-to-ship path from pretending that every useful skill belongs inside it.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 88\" aria-labelledby=\"ask-matt-source-line-88\">\n              \u003cspan class=\"margin-marker\">08\u003c/span>\u003cstrong>Explicit precondition\u003c/strong>\n              \u003cp>\u003ca href=\"#ask-matt-source-line-88\">Line 88\u003c/a> · The other engineering skills assume shared tracker and documentation conventions, so setup is part of the interface.\u003c/p>\n            \u003c/div>\n            \u003c/aside>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-1\" role=\"tabpanel\" aria-labelledby=\"case-tab-1\" data-case-panel=\"1\" hidden>\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">02\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Model-invoked · reusable discipline · gated loop\u003c/p>\n              \u003ch3 id=\"diagnosing-bugs-case\">\u003ccode>diagnosing-bugs\u003c/code>: no theory before a red-capable loop\u003c/h3>\n              \u003cp>The file does not mainly teach debugging facts. It changes the order in which the agent is allowed to form confidence.\u003c/p>\n              \u003ca class=\"source-link\" href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">Read the original \u003ccode>SKILL.md\u003c/code> ↗\u003c/a>\n\n          \u003cp class=\"source-disclosure\">The left column is the complete, unmodified \u003ccode>SKILL.md\u003c/code>. Read it continuously; the numbered margin comments point to important design decisions without replacing the source.\u003c/p>\n\n          \u003cdiv class=\"manuscript-layout\" aria-label=\"Complete diagnosing-bugs source with teacher comments\">\n            \u003cpre class=\"skill-manuscript\" aria-label=\"Complete original diagnosing-bugs SKILL.md\">\u003ccode>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-1\" data-line=\"1\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-2\" data-line=\"2\">name: diagnosing-bugs\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-3\" data-line=\"3\">description: Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-4\" data-line=\"4\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-5\" data-line=\"5\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-6\" data-line=\"6\"># Diagnosing Bugs\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-7\" data-line=\"7\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-8\" data-line=\"8\">A discipline for hard bugs. Skip phases only when explicitly justified.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-9\" data-line=\"9\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-10\" data-line=\"10\">When exploring the codebase, read `CONTEXT.md` (if it exists) to get a clear mental model of the relevant modules, and check ADRs in the area you're touching.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-11\" data-line=\"11\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-12\" data-line=\"12\">## Redact\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-13\" data-line=\"13\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-14\" data-line=\"14\">This skill has you show commands, outputs and captured artifacts. **Redact every secret first** — write `&lt;REDACTED&gt;` in its place. Build loops against env vars, so the credential stays in the environment rather than in what you show. Captured artifacts carry auth headers: quote only the lines that carry the signal.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-15\" data-line=\"15\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-16\" data-line=\"16\">If the redacted output is not enough to diagnose the bug, say so and ask the user.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-17\" data-line=\"17\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-18\" data-line=\"18\">## Phase 1 — Build a feedback loop\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-19\" data-line=\"19\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-20\" data-line=\"20\">**This is the skill.** Everything else is mechanical. If you have a **tight** pass/fail signal for the bug — one that goes red on _this_ bug — you will find the cause; bisection, hypothesis-testing, and instrumentation all just consume it. If you don't have one, no amount of staring at code will save you.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-21\" data-line=\"21\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-22\" data-line=\"22\">Spend disproportionate effort here. **Be aggressive. Be creative. Refuse to give up.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-23\" data-line=\"23\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-24\" data-line=\"24\">### Ways to construct one — try them in roughly this order\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-25\" data-line=\"25\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-26\" data-line=\"26\">1. **Failing test** at whatever seam reaches the bug — unit, integration, e2e.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-27\" data-line=\"27\">2. **Curl / HTTP script** against a running dev server.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-28\" data-line=\"28\">3. **CLI invocation** with a fixture input, diffing stdout against a known-good snapshot.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-29\" data-line=\"29\">4. **Headless browser script** (Playwright / Puppeteer) — drives the UI, asserts on DOM/console/network.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-30\" data-line=\"30\">5. **Replay a captured trace.** Save a real network request / payload / event log to disk; replay it through the code path in isolation.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-31\" data-line=\"31\">6. **Throwaway harness.** Spin up a minimal subset of the system (one service, mocked deps) that exercises the bug code path with a single function call.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-32\" data-line=\"32\">7. **Property / fuzz loop.** If the bug is \"sometimes wrong output\", run 1000 random inputs and look for the failure mode.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-33\" data-line=\"33\">8. **Bisection harness.** If the bug appeared between two known states (commit, dataset, version), automate \"boot at state X, check, repeat\" so you can `git bisect run` it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-34\" data-line=\"34\">9. **Differential loop.** Run the same input through old-version vs new-version (or two configs) and diff outputs.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-35\" data-line=\"35\">10. **HITL bash script.** Last resort. If a human must click, drive _them_ with `scripts/hitl-loop.template.sh` so the loop is still structured. Captured output feeds back to you.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-36\" data-line=\"36\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-37\" data-line=\"37\">Build the right feedback loop, and the bug is 90% fixed.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-38\" data-line=\"38\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-39\" data-line=\"39\">### Tighten the loop\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-40\" data-line=\"40\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-41\" data-line=\"41\">Treat the loop as a product. Once you have _a_ loop, **tighten** it:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-42\" data-line=\"42\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-43\" data-line=\"43\">- Can I make it faster? (Cache setup, skip unrelated init, narrow the test scope.)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-44\" data-line=\"44\">- Can I make the signal sharper? (Assert on the specific symptom, not \"didn't crash\".)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-45\" data-line=\"45\">- Can I make it more deterministic? (Pin time, seed RNG, isolate filesystem, freeze network.)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line
