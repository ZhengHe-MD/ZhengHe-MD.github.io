n          \u003cstrong>选择最契合的 Skill 形态。\u003c/strong>\n          这是一个人工入口、可复用的执行流程、共享的参考规范，还是用于在上百个选项中导航的路由器？\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>提炼最小有效心智模型。\u003c/strong>\n          引入诸如 \u003cem>决策前沿 (frontier)\u003c/em>、\u003cem>解耦接缝 (seam)\u003c/em>、\u003cem>红灯阶段 (red)\u003c/em> 和 \u003cem>贯通原型 (tracer bullet)\u003c/em> 等预训练先验概念，能够以极小篇幅深度约束复杂行为。\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>使门禁卡点与完成标准具备客观可检验性。\u003c/strong>\n          优先使用“覆盖所有分支”而非“达成深入理解”，使用“通过一条确定命令稳定复现 Bug”而非“进行彻底排查”。\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>对特定分支参考资料实行渐进式披露。\u003c/strong>\n          主文件只保留通用的主干步骤；将复杂示例、Mock 指南或罕见分支放入精准指针背后的独立参考文档中。\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>针对模型默认行为与宿主环境进行精简。\u003c/strong>\n          果断剔除无法实质性改变模型默认行为的冗余空话。凡是 Agent 能通过读取文件或 \u003ccode>--help\u003c/code> 低成本获知的事实，切忌在 Prompt 中重复缓存。\n        \u003c/li>\n      \u003c/ol>\n\n      \u003ch3 id=\"pointer-writing\">description 是可执行的架构接口\u003c/h3>\n      \u003cp>对于模型可调用的 Skill，description 承担着两大职责：指明内容主体并列出独立的触发分支。即使正文写得再完美，如果 description 模糊不清，它也可能永远不会被触发加载。而对于人工调用的 Skill，description 则是写给人类看的高亮摘要，因为触发时机已由人类在显式调用时决定。\u003c/p>\n\n      \u003cdiv class=\"decision-panel\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"invocation-tradeoff\">调用权衡取舍\u003c/h3>\n          \u003cspan class=\"lab-count\">无优劣之分，仅是设计取舍\u003c/span>\n        \u003c/div>\n        \u003cp>设想一个用于审查数据库 Migration 的全新 Skill。应该由谁来负责识别并触发它？\u003c/p>\n        \u003cdiv class=\"invocation-toggle\" role=\"group\" aria-label=\"选择调用所有权\">\n          \u003cbutton type=\"button\" data-invocation=\"user\" aria-pressed=\"true\">人工调用 (Human-invoked)\u003c/button>\n          \u003cbutton type=\"button\" data-invocation=\"model\">模型调用 (Model-invoked)\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"load-grid\">\n          \u003cdiv>\n            \u003cdiv class=\"meter-label\">\u003cspan>常驻上下文负载\u003c/span>\u003cspan id=\"context-value\">低\u003c/span>\u003c/div>\n            \u003cdiv class=\"meter\">\u003cdiv class=\"meter-fill\" id=\"context-meter\" style=\"width: 14%\">\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"meter-label\">\u003cspan>人类认知负荷\u003c/span>\u003cspan id=\"cognitive-value\">高\u003c/span>\u003c/div>\n            \u003cdiv class=\"meter\">\u003cdiv class=\"meter-fill\" id=\"cognitive-meter\" style=\"width: 82%\">\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"decision-copy\" id=\"invocation-copy\">当数据库变更审查是一项人类能够主动记住的刻意质量门禁时使用。description 仅面向人类展示，但其他 Skill 无法依赖自动发现来加载它。\u003c/p>\n      \u003c/div>\n\n      \u003ch3 id=\"drafting-critique\">起草理论的优势与局限\u003c/h3>\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"strong-control-levers\">强项：清晰的控制杠杆\u003c/h4>\n          \u003cp>触发器、门禁卡点、完成标准、权威事实来源以及特定分支的分层披露均可被清晰审视与测试，将“写出更好的 Prompt”转化为具体的工程设计决策。\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"weak-causal-claims\">弱项：未经严格验证的因果断言\u003c/h4>\n          \u003cp>关于否定句弊端、引导词权重或未来步骤可见性的论述看似合理，但仓库本身并未提供跨不同模型与任务的严谨对照实验数据。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">52–68 分钟\u003c/span>\n      \u003ch2 id=\"pressure-test\">4. 极限质询：对该设计哲学进行压力测试\u003c/h2>\n      \u003cp>严谨的技术审视绝不能把作者的自信表达直接当成确凿证据。请通过下方三类标签，将不同的论断清晰剥离开来。\u003c/p>\n\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>论断类型\u003c/th>\n            \u003cth>典型示例\u003c/th>\n            \u003cth>必须追问的核心问题\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag claim\">作者主张\u003c/span>\u003c/td>\n            \u003ctd>这些 Skill 能在任何模型上通用生效。\u003c/td>\n            \u003ctd>是否有跨模型评测数据能支撑“任何模型”这一范围？\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag observation\">代码事实观察\u003c/span>\u003c/td>\n            \u003ctd>\u003ccode>grill-with-docs\u003c/code> 将实际行为委托给两个可复用 Skill。\u003c/td>\n            \u003ctd>这种依赖链条是否易于维护、排查与修改？\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag inference\">逻辑推论\u003c/span>\u003c/td>\n            \u003ctd>薄封装能减少指令重复，但可能增加隐式耦合。\u003c/td>\n            \u003ctd>需要怎样的对比实验或版本演进记录来检验这种权衡？\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003ch3 id=\"balanced-critique\">客观全面的技术权衡\u003c/h3>\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"worth-borrowing\">值得吸收借鉴\u003c/h4>\n          \u003cul>\n            \u003cli>将调用机制视为深思熟虑的接口契约。\u003c/li>\n            \u003cli>采用精简的入口包装底层更深厚的实践规范。\u003c/li>\n            \u003cli>以详尽客观的标准定义交付完成，拒绝模糊的印象流交差。\u003c/li>\n            \u003cli>让宿主环境成为第一权威事实来源，避免在 Prompt 中缓存陈旧副本。\u003c/li>\n            \u003cli>用统一的专业词汇打通对话、代码实现与 Agent 行为。\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"worth-challenging\">值得审慎质疑\u003c/h4>\n          \u003cul>\n            \u003cli>“跨任何模型通用”的论断超出了现有证据的支撑范围。\u003c/li>\n            \u003cli>团队专属词汇虽然能为熟手压缩上下文，但会显著增加新人的理解门槛。\u003c/li>\n            \u003cli>组合化设计将系统的复杂性转移到了依赖发现与版本兼容性上。\u003c/li>\n            \u003cli>过于刚性的工作流约束可能只是将某一位工程师的个人习惯硬编码为了通用规则。\u003c/li>\n            \u003cli>“无效空话 (No-op)”检验极度依赖特定模型的默认基线，因此精简优化需要随模型迭代反复评估。\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"evidence-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"classify-evidence\">对论据进行准确分类\u003c/h3>\n          \u003cdiv class=\"lab-header-controls\" aria-label=\"语句导航\">\n            \u003cbutton class=\"card-arrow\" id=\"evidence-prev\" type=\"button\" aria-label=\"上一条声明\" title=\"上一条声明\">←\u003c/button>\n            \u003cspan class=\"lab-count\" id=\"evidence-count\">1 / 3\u003c/span>\n            \u003cbutton class=\"card-arrow\" id=\"evidence-skip\" type=\"button\" aria-label=\"跳到下一条声明\" title=\"跳到下一条声明\">→\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"quiz-nav\" id=\"evidence-nav\" role=\"tablist\" aria-label=\"声明案例\">\u003c/div>\n        \u003cp class=\"question-text\" id=\"evidence-question\">\u003c/p>\n        \u003cp class=\"profile-hint\">悬停或聚焦任意选项可查看如何区分作者主张、代码事实与逻辑推论。\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"evidence-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"evidence-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"next-button\" id=\"evidence-next\" type=\"button\">下一条声明 →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"experiments\">深化技术批判的对比实验\u003c/h3>\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>核心疑问\u003c/th>\n            \u003cth>最小有效实验方案\u003c/th>\n            \u003cth>可观测的判定信号\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>description 触发是否稳定可靠？\u003c/td>\n            \u003ctd>准备一套固定的 Prompt 测试集，在保留与去除某个触发分支的前提下对比运行。\u003c/td>\n            \u003ctd>正确调用率与误报率。\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>引导词是否能实质改变行为？\u003c/td>\n            \u003ctd>对比 A/B 测试：使用特定专业词汇 vs 展开成冗长的字面详细解释。\u003c/td>\n            \u003ctd>任务完成率、行为波动方差与 Token 消耗。\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Skill 能否无缝跨模型迁移？\u003c/td>\n            \u003ctd>将相同的任务语料库在多个不同的主力模型系列上分别运行。\u003c/td>\n            \u003ctd>规则遵守度与任务最终成功率，而非文字表达相似度。\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>组合化是否真正降低了维护成本？\u003c/td>\n            \u003ctd>分别在“组合依赖”与“直接内联重复”的两个版本中修改某项共享行为。\u003c/td>\n            \u003ctd>涉及修改的文件数、回归缺陷率以及检索失效情况。\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">68–75 分钟\u003c/span>\n      \u003ch2 id=\"borrowing-ledger\">5. 构建你的取舍决策账本\u003c/h2>\n      \u003cp>不要对整个代码库全盘肯定或否定，而要逐条原则做出工程判断。\u003cstrong>直接吸收 (Adopt)\u003c/strong> 意味着该理念可原样套用；\u003cstrong>改造借鉴 (Adapt)\u003c/strong> 意味着需结合自身团队约束进行本土化适配；\u003cstrong>暂不采纳 (Reject)\u003c/strong> 则意味着现有收益无法证明其开销是合理的。\u003c/p>\n\n      \u003cdiv class=\"ledger\" id=\"ledger\">\n        \u003cdiv class=\"ledger-item\" data-principle=\"invocation\">\n          \u003cdiv>\n            \u003cstrong>明确选择调用权归属\u003c/strong>\n            \u003cp>在常驻上下文负载与人类记忆负担之间做出清晰权衡。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"调用权归属决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"composition\">\n          \u003cdiv>\n            \u003cstrong>保持入口精简并灵活组合规范\u003c/strong>\n            \u003cp>通过像 \u003ccode>grill-with-docs\u003c/code> 这样的小型包装器复用底层行为。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"精简组合决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"completion\">\n          \u003cdiv>\n            \u003cstrong>编写可客观检查的穷尽式完成标准\u003c/strong>\n            \u003cp>用 Agent 可独立验证的明确标准定义交付完成，拒绝靠感觉草率收工。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"完成标准决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"vocabulary\">\n          \u003cdiv>\n            \u003cstrong>将核心行为高度压缩为专业引导词\u003c/strong>\n            \u003cp>借力模型已具备的先验概念（如 \u003cem>前沿\u003c/em>、\u003cem>接缝\u003c/em> 或 \u003cem>贯通原型\u003c/em>）。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"专业引导词决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"environment\">\n          \u003cdiv>\n            \u003cstrong>始终将宿主环境视为第一权威事实来源\u003c/strong>\n            \u003cp>Prompt 只需记录约定缘由与暗坑；具体状态交由文件与命令行工具动态呈现。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"环境真实来源决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"model-agnostic\">\n          \u003cdiv>\n            \u003cstrong>假设 Skill 具备跨模型通用迁移能力\u003c/strong>\n            \u003cp>期望同一份 Skill 文本无需任何针对性调优即可在不同模型上完美运行。\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"跨模型通用性决策\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">直接吸收\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">改造借鉴\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">暂不采纳\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-summary\" id=\"ledger-summary\">0 项已决策 · 6 项待评估\u003c/div>\n        \u003cbutton class=\"reset-button\" id=\"ledger-reset\" type=\"button\">重置账本\u003c/button>\n      \u003c/div>\n\n      \u003cp class=\"takeaway\">最持久的收获绝非“照抄这些 Prompt”，而是“将 Agent 指令视为一套由接口、依赖关系、注意力预算与可客观观测的终止条件构成的严谨工程系统”。\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"sources\">\n      \u003ch2 id=\"source-notes\">来源笔记\u003c/h2>\n      \u003cp>本课程已于 2026 年 8 月 10 日与公共仓库进行核对。请使用本地克隆作为主要工作副本，并在确切措辞不同的情况下与 \u003ca href=\"https://github.com/mattpocock/skills\">mattpocock/skills\u003c/a> 进行比较。\u003c/p>\n      \u003cul>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/README.md\">仓库 README 与 Skill 目录参考\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\">\u003ccode>writing-for-agents/SKILL.md\u003c/code>\u003c/a> 及其 \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL-MECHANICS.md\">Skill 运行机制参考\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\">\u003ccode>grilling/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/grill-with-docs/SKILL.md\">\u003ccode>grill-with-docs/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\">\u003ccode>tdd/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_KEY_ROLE = \"course-studio:quiz:session1:profile\";\n    const STORAGE_KEY_EVIDENCE = \"course-studio:quiz:session1:evidence\";\n    const STORAGE_KEY_LEDGER = \"course-studio:quiz:session1:ledger\";\n    const STORAGE_KEY_CASE_TAB = \"course-studio:quiz:session1:case-tab\";\n    const STORAGE_KEY_INVOCATION = \"course-studio:quiz:session1:invocation\";\n    const STORAGE_KEY_ANNOTATION = \"course-studio:quiz:session1:annotation\";\n\n    function loadSaved(key, fallback) {\n      try {\n        const raw = localStorage.getItem(key);\n        return raw ? JSON.parse(raw) : fallback;\n      } catch {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(key, JSON.stringify(value));\n      } catch {}\n    }\n\n    const roleCases = [\n      {\n        path: \"skills/engineering/grill-with-docs/SKILL.md\",\n        question: \"请为这个仅有 7 行的 Skill 建立架构档案，分别判断其调用机制、内容形态与组合职责：\",\n        profile: {\n          invocation: \"仅限人工\",\n          content: \"步骤流主导\",\n          composition: \"包装器\"\n        },\n        feedback: \"这是一个仅包含单条祈使指令的人工入口，其系统职责在于包装并串联两个模型可发现的底层依赖 Skill。\",\n        excerpt: \"name: grill-with-docs\\ndisable-model-invocation: true\\n\\nRun a /grilling session, using the /domain-modeling skill.\",\n        outline: [\n          \"Frontmatter 声明了它是一个仅限人工调用的显式入口点。\",\n          \"其 description 承诺发起质询并沉淀持久的设计领域文档。\",\n          \"正文直接将质询流程与领域建模委托给底层 Skill，不重复任何已有逻辑。\"\n        ]\n      },\n      {\n        path: \"skills/productivity/grilling/SKILL.md\",\n        question: \"请为定义了设计树、决策前沿、质询轮次、事实查明权与终止条件的 Skill 建立架构档案：\",\n        profile: {\n          invocation: \"模型可自动发现\",\n          content: \"步骤流主导\",\n          composition: \"核心原语\"\n        },\n        feedback: \"它对模型可自动发现，内建执行循环，并为多个高阶工作流提供了可复用的深度质询原语。\",\n        excerpt: \"name: grilling\\n\\nInterview the user relentlessly until you reach a shared understanding. Map this as a design tree.\",\n        outline: [\n          \"面向模型的 description 列出了压力测试与方案质询等明确的触发分支。\",\n          \"通过设计树 (Design Tree) 表达依赖决策；其决策前沿 (Frontier) 仅包含先决条件已敲定的未决问题。\",\n          \"交互以质询轮次 (Rounds) 推进，每轮提出结构化问题并等待用户反馈。\",\n          \"Agent 负责查明可检索的客观事实，人类拥有最终决策拍板权。\",\n          \"终止条件要求决策前沿彻底清空且用户明确确认方案对齐。\"\n        ]\n      },\n      {\n        path: \"skills/productivity/writing-for-agents/SKILL.md\",\n        question: \"请为编写或修改 Agent 文档时调用的指南 Skill 建立档案（注意：参考规范主导并不等于被动无为）：\",\n        profile: {\n          invocation: \"模型可自动发现\",\n          content: \"参考规范主导\",\n          composition: \"支撑指南\"\n        },\n        feedback: \"它对模型可自动发现并主动约束写作过程，但其正文主体是概念定义、规则约束与质量标准，而非线性的执行序列。\",\n        excerpt: \"name: writing-for-agents\\n\\nEvery document and pointer you add spends one of two budgets: context load and cognitive load.\",\n        outline: [\n          \"上下文指针需同时编码文档所包含的材料以及应当加载该文档的触发分支。\",\n          \"信息层级结构清晰划分了文件内核心步骤、文件内参考规范以及按需披露的参考文档。\",\n          \"对交付完成标准的可检验性与严格度进行质量评估。\",\n          \"专业引导词通过借力模型已有的知识先验实现高效的语义压缩。\",\n          \"精简原则强调剔除重复内容、陈旧缓存、无关材料以及无法实质改变模型行为的无效指令。\",\n          \"Skill 专属的调用底层机制被分流披露在同级独立的参考文档中。\"\n        ]\n      },\n      {\n        path: \"skills/engineering/ask-matt/SKILL.md\",\n        question: \"请为梳理主干流程、接入路径、词汇层、阶段边界与独立 Skill 的总控文件建立档案：\",\n        profile: {\n          invocation: \"仅限人工\",\n          content: \"两者混合\",\n          composition: \"流程路由\"\n        },\n        feedback: \"这是一个仅限人工调用的流程路由器。其文件将过程性导航与参考目录融为一体，这也正是为何单一内容标签无法完整概括其系统角色的原因。\",\n        excerpt: \"name: ask-matt\\ndisable-model-invocation: true\\n\\nYou don't remember every skill, so ask.\",\n        outline: [\n          \"主干流程将一个想法依次路由至需求澄清、可选原型、规格设计、拆分子任务、代码实现与评审验收。\",\n          \"接入路径专门处理外部传入 Issue、棘手 Bug 以及单次对话无法容纳的大型任务。\",\n          \"独立小节分别对代码库健康治理、共享词汇库与阶段边界决策进行针对性路由。\",\n          \"对不属于主干交付流的独立专项 Skill 进行分类编目。\",\n          \"路由器负责指引人类使用正确的手动 Skill，但无法代为自动触发它们。\"\n        ]\n      }\n    ];\n\n    const profileAxes = [\n      {\n        key: \"invocation\",\n        label: \"1. 调用机制 —— 谁能发现并触发它？\",\n        options: [\"仅限人工\", \"模型可自动发现\"],\n        definitions: {\n          \"仅限人工\": \"仅限人工：只有在人类显式调用时才会启动 (disable-model-invocation: true)。其 description 不会暴露给模型的自动检索列表。\",\n          \"模型可自动发现\": \"模型可自动发现：模型可通过 description 自动识别并加载，其他 Skill 亦可调用，人类同样可以直接手动触发。\"\n        }\n      },\n      {\n        key: \"content\",\n        label: \"2. 内容形态 —— 文件的主要构成是什么？\",\n        options: [\"步骤流主导\", \"参考规范主导\", \"两者混合\"],\n        definitions: {\n          \"步骤流主导\": \"步骤流主导：有序动作、循环、门禁卡点或终止条件占据主导地位，该 Skill 主动驱动任务的执行序列。\",\n          \"参考规范主导\": \"参考规范主导：定义、约束规则、术语词汇或质量评估标准占据主导，用于指导在其他地方推进的工作。\",\n          \"两者混合\": \"两者混合：同时包含实质性的过程流与大量的参考规范，两者均非次要的附属部分。\"\n        }\n      },\n      {\n        key: \"composition\",\n        label: \"3. 组合职责 —— 它在系统中扮演什么角色？\",\n        options: [\"流程路由\", \"包装器\", \"核心原语\", \"支撑指南\"],\n        definitions: {\n          \"流程路由\": \"流程路由 (Router)：梳理整体流程与切入路径，辅助人类选择正确的 Skill，但无法代人类自动触发手动 Skill。\",\n          \"包装器\": \"包装器 (Wrapper)：轻量入口点，主要通过组合与委托其他底层 Skill 来完成工作，避免重复书写指令。\",\n          \"核心原语\": \"核心原语 (Primitive)：核心可复用的行为/状态机（如 grilling 质询机制），可被多个高阶工作流共同调用。\",\n          \"支撑指南\": \"支撑指南 (Supporting guide)：通过提供方法论与验收标准来约束其他任务的执行质量，但不接管整个任务生命周期。\"\n        }\n      }\n    ];\n\n    const roleState = loadSaved(STORAGE_KEY_ROLE, { answers: {}, currentIndex: 0 });\n    let roleIndex = Math.min(Math.max(0, Number(roleState.currentIndex) || 0), roleCases.length - 1);\n    let profileSelections = roleState.answers[roleIndex]?.selections || {};\n\n    const roleNav = document.querySelector(\"#role-nav\");\n    const rolePath = document.querySelector(\"#role-path\");\n    const roleQuestion = document.querySelector(\"#role-question\");\n    const roleChoices = document.querySelector(\"#role-choices\");\n    const roleCheck = document.querySelector(\"#role-check\");\n    const roleFeedback = document.querySelector(\"#role-feedback\");\n    const rolePrev = document.querySelector(\"#role-prev\");\n    const roleSkip = document.querySelector(\"#role-skip\");\n    const roleNext = document.querySelector(\"#role-next\");\n    const roleCount = document.querySelector(\"#role-count\");\n    const roleSourceToggle = document.querySelector(\"#role-source-toggle\");\n    const roleSourcePreview = document.querySelector(\"#role-source-preview\");\n    const roleSourceLink = document.querySelector(\"#role-source-link\");\n    const roleSourceExcerpt = document.querySelector(\"#role-source-excerpt\");\n    const roleSourceOutline = document.querySelector(\"#role-source-outline\");\n\n    function renderRoleNav() {\n      roleNav.replaceChildren();\n      roleCases.forEach((_, idx) => {\n        const btn = document.createElement(\"button\");\n        btn.type = \"button\";\n        btn.className = \"quiz-nav-step\";\n        if (idx === roleIndex) btn.classList.add(\"active\");\n        const ans = roleState.answers[idx];\n        if (ans) {\n          if (ans.isCorrect) btn.classList.add(\"correct\");\n          else if (ans.checked) btn.classList.add(\"answered\");\n        }\n        btn.textContent = `案例 ${idx + 1}`;\n        btn.setAttribute(\"aria-label\", `跳转到案例 ${idx + 1}`);\n        btn.addEventListener(\"click\", () => {\n          roleIndex = idx;\n          roleState.currentIndex = idx;\n          saveState(STORAGE_KEY_ROLE, roleState);\n          renderRoleCase();\n        });\n        roleNav.append(btn);\n      });\n    }\n\n    function renderRoleSource(currentCase) {\n      roleSourceToggle.setAttribute(\"aria-expanded\", \"false\");\n      roleSourceToggle.textContent = \"展开技能内容\";\n      roleSourcePreview.hidden = true;\n      roleSourceLink.href = `https://github.com/mattpocock/skills/blob/main/${currentCase.path}`;\n      roleSourceExcerpt.textContent = currentCase.excerpt;\n      roleSourceOutline.replaceChildren();\n\n      currentCase.outline.forEach((summary) => {\n        const item = document.createElement(\"li\");\n        item.textContent = summary;\n        roleSourceOutline.append(item);\n      });\n    }\n\n    function renderRoleCase() {\n      renderRoleNav();\n      const currentCase = roleCases[roleIndex];\n      const savedAnswer = roleState.answers[roleIndex];\n      profileSelections = savedAnswer ? { ...savedAnswer.selections } : {};\n\n      rolePath.textContent = currentCase.path;\n      roleQuestion.textContent = currentCase.question;\n      roleCount.textContent = `${roleIndex + 1} / ${roleCases.length}`;\n\n      rolePrev.disabled = roleIndex === 0;\n      roleNext.textContent = roleIndex === roleCases.length - 1 ? \"完成\" : \"下一个案例 →\";\n\n      if (savedAnswer && savedAnswer.checked) {\n        roleFeedback.className = `feedback visible ${savedAnswer.isCorrect ? \"correct\" : \"retry\"}`;\n        roleFeedback.textContent = savedAnswer.feedback;\n      } else {\n        roleFeedback.className = \"feedback\";\n        roleFeedback.textContent = \"\";\n      }\n\n      roleCheck.disabled = profileAxes.some((axis) => !profileSelections[axis.key]);\n      roleChoices.replaceChildren();\n      renderRoleSource(currentCase);\n\n      profileAxes.forEach((axis) => {\n        const fieldset = document.createElement(\"fieldset\");\n        fieldset.className = \"profile-axis\";\n\n        const legend = document.createElement(\"legend\");\n        legend.textContent = axis.label;\n        fieldset.append(legend);\n\n        const options = document.createElement(\"div\");\n        options.className = \"profile-options\";\n        options.dataset.axis = axis.key;\n\n        axis.options.forEach((option) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option;\n          button.dataset.help = axis.definitions[option];\n          button.setAttribute(\"aria-label\", `${option}: ${axis.definitions[option]}`);\n          const isSelected = profileSelections[axis.key] === option;\n          button.setAttribute(\"aria-pressed\", String(isSelected));\n          if (isSelected) button.classList.add(\"selected\");\n          button.addEventListener(\"click\", () => selectProfileOption(axis.key, option, button, options));\n          options.append(button);\n        });\n\n        fieldset.append(options);\n        roleChoices.append(fieldset);\n      });\n    }\n\n    function selectProfileOption(axisKey, option, button, optionsContainer) {\n      profileSelections[axisKey] = option;\n      optionsContainer.querySelectorAll(\"button\").forEach((choice) => {\n        choice.classList.toggle(\"selected\", choice === button);\n        choice.setAttribute(\"aria-pressed\", String(choice === button));\n      });\n      roleCheck.disabled = profileAxes.some((axis) => !profileSelections[axis.key]);\n      roleState.answers[roleIndex] = {\n        selections: profileSelections,\n        checked: false,\n        isCorrect: false,\n        feedback: \"\"\n      };\n      saveState(STORAGE_KEY_ROLE, roleState);\n      renderRoleNav();\n    }\n\n    roleSourceToggle.addEventListener(\"click\", () => {\n      const isExpanded = roleSourceToggle.getAttribute(\"aria-expanded\") === \"true\";\n      roleSourceToggle.setAttribute(\"aria-expanded\", String(!isExpanded));\n      roleSourceToggle.textContent = isExpanded ? \"展开技能内容\" : \"折叠技能内容\";\n      roleSourcePreview.hidden = isExpanded;\n    });\n\n    function checkRoleProfile() {\n      const currentCase = roleCases[roleIndex];\n      const mismatches = profileAxes.filter((axis) => profileSelections[axis.key] !== currentCase.profile[axis.key]);\n      const isCorrect = mismatches.length === 0;\n      const feedbackText = isCorrect\n        ? `回答正确！${currentCase.feedback}`\n        : `请重新审视 ${mismatches.map((axis) => axis.label.split(\" —— \")[0].replace(/^\\d+\\. /, \"\")).join(\" 与 \")} 维度。这三个维度描述的是不同的系统特征，彼此不可互相替代。`;\n\n      roleFeedback.className = `feedback visible ${isCorrect ? \"correct\" : \"retry\"}`;\n      roleFeedback.textContent = feedbackText;\n\n      roleState.answers[roleIndex] = {\n        selections: { ...profileSelections },\n        checked: true,\n        isCorrect,\n        feedback: feedbackText\n      };\n      saveState(STORAGE_KEY_ROLE, roleState);\n      renderRoleNav();\n    }\n\n    roleCheck.addEventListener(\"click\", checkRoleProfile);\n\n    rolePrev.addEventListener(\"click\", () => {\n      if (roleIndex > 0) {\n        roleIndex -= 1;\n        roleState.currentIndex = roleIndex;\n        saveState(STORAGE_KEY_ROLE, roleState);\n        renderRoleCase();\n      }\n    });\n\n    roleSkip.addEventListener(\"click\", () => {\n      roleIndex = (roleIndex + 1) % roleCases.length;\n      roleState.currentIndex = roleIndex;\n      saveState(STORAGE_KEY_ROLE, roleState);\n      renderRoleCase();\n    });\n\n    roleNext.addEventListener(\"click\", () => {\n      if (roleIndex \u003c roleCases.length - 1) {\n        roleIndex += 1;\n        roleState.currentIndex = roleIndex;\n        saveState(STORAGE_KEY_ROLE, roleState);\n        renderRoleCase();\n      } else {\n        const allCorrect = roleCases.every((_, idx) => roleState.answers[idx]?.isCorrect);\n        roleFeedback.className = `feedback visible ${allCorrect ? \"correct\" : \"\"}`;\n        roleFeedback.textContent = allCorrect\n          ? \"恭喜！全部案例均已完美掌握！调用机制、内容形态与组合职责是三条完全独立的架构维度。\"\n          : \"你已浏览完所有案例。点击上方的案例标签可返回任一题目复查或更新答案。\";\n      }\n    });\n\n    const caseStudies = {\n      wrapper: {\n        title: \"轻量包装器：grill-with-docs\",\n        path: \"skills/engineering/grill-with-docs/SKILL.md\",\n        code: \"disable-model-invocation: true\\n\\nRun a /grilling session, using /domain-modeling.\",\n        interface: \"一个易于人类记忆的显式手动入口，用于启动带文档沉淀的规划质询。\",\n        behavior: \"完全委托。质询算法与领域文档更新逻辑均存放在底层依赖的 Skill 中。\",\n        tension: \"单一事实来源与复用性极高；但若依赖项难以被发现或存在版本兼容问题，则容易失效。\"\n      },\n      primitive: {\n        title: \"可复用核心原语：grilling\",\n        path: \"skills/productivity/grilling/SKILL.md\",\n        code: \"design tree → frontier → round → recompute\\n\\ndone when: frontier empty + user confirms\",\n        interface: \"一个模型可自动调用的质询行为，可供多个上层工作流随时接入。\",\n        behavior: \"用自然语言实现的状态机，具备清晰的调度规则与主导权分工。\",\n        tension: \"详尽无遗的穷尽检查能杜绝隐性假设；但若不加约束，“遍历所有分支”可能导致质询无休止发散。\"\n      },\n      discipline: {\n        title: \"规范性工程纪律：tdd\",\n        path: \"skills/engineering/tdd/SKILL.md\",\n        code: \"gate: agree the seams\\nloop: red → minimal green, one vertical slice\\nreference: tests.md + mocking.md\",\n        interface: \"一个模型可调用的测试驱动开发行为准则库。\",\n        behavior: \"将门禁卡点、领域词汇、反模式清单、微型闭环与按需披露的示例融为一体。\",\n        tension: \"强约束能带来极高的一致性；但也硬编码了具争议性的个人偏好（例如将重构移到了循环之外）。\"\n      },\n      reference: {\n        title: \"参考规范导向指南：writing-for-agents\",\n        path: \"skills/productivity/writing-for-agents/SKILL.md\",\n        code: \"pointer → information hierarchy → completion criteria\\nleading words → pruning\\n\\nskill-only mechanics disclosed separately\",\n        interface: \"在编写或修改面向 Agent 的文档时调用的指导规范。\",\n        behavior: \"具体的写作任务来自调用方；这份以参考规范为主体的文档提供方法、硬性约束与质量评估标准。\",\n        tension: \"让指令工程设计变得有章可循；但部分因果假设在得到严格实验验证前仍属经验假说。\"\n      }\n    };\n\n    const caseTabs = document.querySelectorAll(\"[data-case]\");\n    const caseContent = document.querySelector(\"#case-content\");\n    const savedCaseTab = loadSaved(STORAGE_KEY_CASE_TAB, \"wrapper\");\n\n    function renderCase(caseName) {\n      const item = caseStudies[caseName];\n      if (!item) return;\n      caseContent.innerHTML = `\n        \u003ch3>${item.title}\u003c/h3>\n        \u003cp class=\"path\">${item.path}\u003c/p>\n        \u003cpre>\u003ccode>${item.code}\u003c/code>\u003c/pre>\n        \u003cdiv class=\"case-grid\">\n          \u003cdiv>\u003ch4>对外接口定义\u003c/h4>\u003cp>${item.interface}\u003c/p>\u003c/div>\n          \u003cdiv>\u003ch4>实际行为逻辑归属\u003c/h4>\u003cp>${item.behavior}\u003c/p>\u003c/div>\n        \u003c/div>\n        \u003cp>\u003cstrong>架构权衡张力：\u003c/strong> ${item.tension}\u003c/p>\n      `;\n    }\n\n    caseTabs.forEach((tab) => {\n      tab.addEventListener(\"click\", () => {\n        caseTabs.forEach((otherTab) => {\n          otherTab.setAttribute(\"aria-selected\", \"false\");\n          otherTab.setAttribute(\"aria-pressed\", \"false\");\n        });\n        tab.setAttribute(\"aria-selected\", \"true\");\n        tab.setAttribute(\"aria-pressed\", \"true\");\n        saveState(STORAGE_KEY_CASE_TAB, tab.dataset.case);\n        renderCase(tab.dataset.case);\n      });\n    });\n\n    const annotationNotes = {\n      pointer: \"description 命名了行为契约并规定了 Agent 应当加载它的时机。系统的可靠性早在正文加载前就已确定。\",\n      primitive: \"‘设计树 (Design tree)’与‘决策前沿 (frontier)’是引导概念：用高度凝练的心智模型统领下游的多条具体指令。\",\n      sequence: \"质询轮次 (Rounds) 将交互转化为显式的闭环。等待每轮回答能有效防止后续问题在前提未定时草率推进。\",\n      ownership: \"这是人类主导权的防御边界：Agent 负责查明客观事实，学员负责拍板决策。既避免了低级提问，又不剥夺人类判断权。\",\n      completion: \"完成标准要求严格且可客观检验：前沿彻底清空、所有分支已遍历且用户明确确认对齐。其潜在风险是质询范围失控发散。\"\n    };\n\n    const annotationButtons = document.querySelectorAll(\"[data-annotation]\");\n    const skillLines = document.querySelectorAll(\"[data-region]\");\n    const annotationNote = document.querySelector(\"#annotation-note\");\n    const savedAnnotation = loadSaved(STORAGE_KEY_ANNOTATION, \"pointer\");\n\n    function showAnnotation(region, activeButton) {\n      annotationButtons.forEach((button) => button.setAttribute(\"aria-pressed\", String(button === activeButton)));\n      skillLines.forEach((line) => line.classList.toggle(\"highlight\", line.dataset.region === region));\n      annotationNote.textContent = annotationNotes[region] || \"\";\n      saveState(STORAGE_KEY_ANNOTATION, region);\n    }\n\n    annotationButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => showAnnotation(button.dataset.annotation, button));\n    });\n\n    const invocationButtons = document.querySelectorAll(\"[data-invocation]\");\n    const contextMeter = document.querySelector(\"#context-meter\");\n    const cognitiveMeter = document.querySelector(\"#cognitive-meter\");\n    const contextValue = document.querySelector(\"#context-value\");\n    const cognitiveValue = document.querySelector(\"#cognitive-value\");\n    const invocationCopy = document.querySelector(\"#invocation-copy\");\n\n    const invocationStates = {\n      user: {\n        contextWidth: \"14%\",\n        cognitiveWidth: \"82%\",\n        contextLabel: \"low\",\n        cognitiveLabel: \"high\",\n        copy: \"当迁移审查是人类已经记住的一个刻意检查点时使用。描述可以保持面向人类，但其他技能不能依赖于自动发现它。\"\n      },\n      model: {\n        contextWidth: \"78%\",\n        cognitiveWidth: \"24%\",\n        contextLabel: \"higher\",\n        cognitiveLabel: \"lower\",\n        copy: \"当代理在更广泛的工作中必须注意迁移风险，或另一项技能必须触发审查时使用此项。触发器描述现在保持在上下文中，并且必须获得永久关注。\"\n      }\n    };\n\n    function selectInvocation(mode, activeButton) {\n      const state = invocationStates[mode] || invocationStates.user;\n      invocationButtons.forEach((button) => button.setAttribute(\"aria-pressed\", String(button === activeButton)));\n      contextMeter.style.width = state.contextWidth;\n      cognitiveMeter.style.width = state.cognitiveWidth;\n      contextValue.textContent = state.contextLabel;\n      cognitiveValue.textContent = state.cognitiveLabel;\n      invocationCopy.textContent = state.copy;\n      saveState(STORAGE_KEY_INVOCATION, mode);\n    }\n\n    invocationButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => selectInvocation(button.dataset.invocation, button));\n    });\n\n    const evidenceCases = [\n      {\n        statement: \"“这些技能适用于任何模型。”\",\n        answer: \"作者主张\",\n        feedback: \"README 中说明了这一点。仅凭仓库本身无法确定跨模型的性能。\"\n      },\n      {\n        statement: \"七行带文档的烤架技能委托给烤制和领域建模。\",\n        answer: \"仓库观察\",\n        feedback: \"这一点可以直接在文件中检查；不需要因果解释。\"\n      },\n      {\n        statement: \"与其在内联中重复依赖项的指令，维护包装器会更便宜。\",\n        answer: \"我们的推断\",\n        feedback: \"似乎合理，但维护历史和依赖故障可能会加强或推翻它。\"\n      }\n    ];\n\n    const evidenceTooltips = {\n      \"作者主张\": \"作者声明：作者在文档中的明确主张，未得到仓库中跨模型或基准数据的支持。\",\n      \"仓库观察\": \"仓库观察：关于仓库中代码结构、配置或文件存在的直接可观察事实。\",\n      \"我们的推断\": \"我们的推论：从解读证据中得出的有理推断、设计假设或权衡分析。\"\n    };\n\n    const evidenceOptions = [\"作者主张\", \"仓库观察\", \"我们的推断\"];\n    const evidenceState = loadSaved(STORAGE_KEY_EVIDENCE, { answers: {}, currentIndex: 0 });\n    let evidenceIndex = Math.min(Math.max(0, Number(evidenceState.currentIndex) || 0), evidenceCases.length - 1);\n\n    const evidenceNav = document.querySelector(\"#evidence-nav\");\n    const evidenceQuestion = document.querySelector(\"#evidence-question\");\n    const evidenceChoices = document.querySelector(\"#evidence-choices\");\n    const evidenceFeedback = document.querySelector(\"#evidence-feedback\");\n    const evidencePrev = document.querySelector(\"#evidence-prev\");\n    const evidenceSkip = document.querySelector(\"#evidence-skip\");\n    const evidenceNext = document.querySelector(\"#evidence-next\");\n    const evidenceCount = document.querySelector(\"#evidence-count\");\n\n    function renderEvidenceNav() {\n      evidenceNav.replaceChildren();\n      evidenceCases.forEach((_, idx) => {\n        const btn = document.createElement(\"button\");\n        btn.type = \"button\";\n        btn.className = \"quiz-nav-step\";\n        if (idx === evidenceIndex) btn.classList.add(\"active\");\n        const ans = evidenceState.answers[idx];\n        if (ans) {\n          if (ans.isCorrect) btn.classList.add(\"correct\");\n          else if (ans.selected) btn.classList.add(\"answered\");\n        }\n        btn.textContent = `陈述 ${idx + 1}`;\n        btn.setAttribute(\"aria-label\", `跳转到陈述 ${idx + 1}`);\n        btn.addEventListener(\"click\", () => {\n          evidenceIndex = idx;\n          evidenceState.currentIndex = idx;\n          saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n          renderEvidenceCase();\n        });\n        evidenceNav.append(btn);\n      });\n    }\n\n    function renderEvidenceCase() {\n      renderEvidenceNav();\n      const currentCase = evidenceCases[evidenceIndex];\n      const saved = evidenceState.answers[evidenceIndex];\n\n      evidenceQuestion.textContent = currentCase.statement;\n      evidenceCount.textContent = `${evidenceIndex + 1} / ${evidenceCases.length}`;\n      evidencePrev.disabled = evidenceIndex === 0;\n      evidenceNext.textContent = evidenceIndex === evidenceCases.length - 1 ? \"完成\" : \"下一条声明 →\";\n\n      if (saved && saved.feedback) {\n        evidenceFeedback.className = `feedback visible ${saved.isCorrect ? \"correct\" : \"retry\"}`;\n        evidenceFeedback.textContent = saved.feedback;\n      } else {\n        evidenceFeedback.className = \"feedback\";\n        evidenceFeedback.textContent = \"\";\n      }\n\n      evidenceChoices.replaceChildren();\n      evidenceOptions.forEach((option) => {\n        const button = document.createElement(\"button\");\n        button.type = \"button\";\n        button.className = \"choice\";\n        button.textContent = option;\n        button.dataset.help = evidenceTooltips[option];\n        button.setAttribute(\"aria-label\", `${option}: ${evidenceTooltips[option]}`);\n        if (saved && saved.selected === option) button.classList.add(\"selected\");\n        button.addEventListener(\"click\", () => checkEvidenceAnswer(button, option));\n        evidenceChoices.append(button);\n      });\n    }\n\n    function checkEvidenceAnswer(button, option) {\n      const currentCase = evidenceCases[evidenceIndex];\n      evidenceChoices.querySelectorAll(\"button\").forEach((choice) => choice.classList.remove(\"selected\"));\n      button.classList.add(\"selected\");\n      const isCorrect = option === currentCase.answer;\n      const feedbackText = isCorrect\n        ? `正确。${currentCase.feedback}`\n        : `最恰当的标签是“${currentCase.answer}”。${currentCase.feedback}`;\n\n      evidenceFeedback.className = `feedback visible ${isCorrect ? \"correct\" : \"retry\"}`;\n      evidenceFeedback.textContent = feedbackText;\n\n      evidenceState.answers[evidenceIndex] = {\n        selected: option,\n        isCorrect,\n        feedback: feedbackText\n      };\n      saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n      renderEvidenceNav();\n    }\n\n    evidencePrev.addEventListener(\"click\", () => {\n      if (evidenceIndex > 0) {\n        evidenceIndex -= 1;\n        evidenceState.currentIndex = evidenceIndex;\n        saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n        renderEvidenceCase();\n      }\n    });\n\n    evidenceSkip.addEventListener(\"click\", () => {\n      evidenceIndex = (evidenceIndex + 1) % evidenceCases.length;\n      evidenceState.currentIndex = evidenceIndex;\n      saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n      renderEvidenceCase();\n    });\n\n    evidenceNext.addEventListener(\"click\", () => {\n      if (evidenceIndex \u003c evidenceCases.length - 1) {\n        evidenceIndex += 1;\n        evidenceState.currentIndex = evidenceIndex;\n        saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n        renderEvidenceCase();\n      } else {\n        const allCorrect = evidenceCases.every((_, idx) => evidenceState.answers[idx]?.isCorrect);\n        evidenceFeedback.className = `feedback visible ${allCorrect ? \"correct\" : \"\"}`;\n        evidenceFeedback.textContent = allCorrect\n          ? \"所有陈述分类正确！将作者的主张、经验观察和推论分开，有助于使批评保持客观。\"\n          : \"你已到达陈述的末尾。点击上方的任何陈述标签以查看或更新你的答案。\";\n      }\n    });\n\n    const ledgerItems = document.querySelectorAll(\".ledger-item\");\n    const ledgerSummary = document.querySelector(\"#ledger-summary\");\n    const ledgerReset = document.querySelector(\"#ledger-reset\");\n    const ledgerDecisions = loadSaved(STORAGE_KEY_LEDGER, {});\n\n    function updateLedgerSummary() {\n      const decisions = Object.values(ledgerDecisions);\n      const counts = { adopt: 0, adapt: 0, reject: 0 };\n      decisions.forEach((decision) => { counts[decision] = (counts[decision] || 0) + 1; });\n      const open = ledgerItems.length - decisions.length;\n      ledgerSummary.textContent = `${decisions.length} 项已决策 · ${open} 项待评估 · 吸收 ${counts.adopt} · 改造 ${counts.adapt} · 暂不采纳 ${counts.reject}`;\n    }\n\n    ledgerItems.forEach((item) => {\n      const principle = item.dataset.principle;\n      const buttons = item.querySelectorAll(\".ledger-choice\");\n      if (ledgerDecisions[principle]) {\n        buttons.forEach((button) => {\n          if (button.dataset.value === ledgerDecisions[principle]) {\n            button.setAttribute(\"aria-pressed\", \"true\");\n          }\n        });\n      }\n      buttons.forEach((button) => {\n        button.addEventListener(\"click\", () => {\n          ledgerDecisions[principle] = button.dataset.value;\n          saveState(STORAGE_KEY_LEDGER, ledgerDecisions);\n          buttons.forEach((otherButton) => otherButton.setAttribute(\"aria-pressed\", String(otherButton === button)));\n          updateLedgerSummary();\n        });\n      });\n    });\n\n    ledgerReset.addEventListener(\"click\", () => {\n      Object.keys(ledgerDecisions).forEach((key) => delete ledgerDecisions[key]);\n      saveState(STORAGE_KEY_LEDGER, ledgerDecisions);\n      document.querySelectorAll(\".ledger-choice\").forEach((button) => button.setAttribute(\"aria-pressed\", \"false\"));\n      updateLedgerSummary();\n    });\n\n    const progressBar = document.querySelector(\"#progress-bar\");\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const progress = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      progressBar.style.width = `${Math.min(100, Math.max(0, progress))}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    window.addEventListener(\"resize\", updateProgress);\n\n    renderRoleCase();\n    const activeCaseBtn = document.querySelector(`[data-case=\"${savedCaseTab}\"]`);\n    if (activeCaseBtn) activeCaseBtn.click();\n    else renderCase(\"wrapper\");\n\n    const activeAnnotationBtn = document.querySelector(`[data-annotation=\"${savedAnnotation}\"]`);\n    if (activeAnnotationBtn) activeAnnotationBtn.click();\n    else showAnnotation(\"pointer\", document.querySelector('[data-annotation=\"pointer\"]'));\n\n    const savedInvocation = loadSaved(STORAGE_KEY_INVOCATION, \"user\");\n    const activeInvocationBtn = document.querySelector(`[data-invocation=\"${savedInvocation}\"]`);\n    if (activeInvocationBtn) selectInvocation(savedInvocation, activeInvocationBtn);\n\n    renderEvidenceCase();\n    updateLedgerSummary();\n    updateProgress();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session2.html","basePath":"session2.html","lang":"en","kind":"lesson","title":"Designing a Skill","translations":{"en":"session2.html","zh-CN":"session2.zh-CN.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Designing a Skill\">\n  \u003ctitle>Designing a Skill — MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.82);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 20;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 3px;\n      background: rgba(138, 78, 53, 0.12);\n    }\n\n    .progress-bar {\n      width: 0;\n      height: 100%;\n      background: var(--accent);\n      transition: width 120ms linear;\n    }\n\n    main {\n      width: min(100% - 3rem, 112ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    html[data-studio-width=\"standard\"] main {\n      width: min(100% - 3rem, 88ch);\n    }\n\n    html[data-studio-width=\"wide\"] main {\n      width: min(100% - 3rem, 112ch);\n    }\n\n    html[data-studio-width=\"full\"] main {\n      width: calc(100% - 3rem);\n      max-width: none;\n    }\n\n    header { margin-bottom: 4rem; }\n\n    .eyebrow,\n    .meta,\n    .label,\n    .time,\n    button,\n    code,\n    .path,\n    .step-pill,\n    label,\n    input,\n    textarea,\n    .term {\n      font-family: var(--mono);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.9rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3, h4 { line-height: 1.18; }\n\n    h1 {\n      max-width: 12ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.3rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h2 {\n      margin: 0 0 1.1rem;\n      font-size: clamp(1.85rem, 5vw, 2.35rem);\n      font-weight: 500;\n      letter-spacing: -0.028em;\n    }\n\n    h3 { margin: 2rem 0 0.65rem; font-size: 1.3rem; }\n    h4 { margin: 0 0 0.45rem; font-size: 1.05rem; }\n    p { margin: 0.8rem 0; }\n    section { margin-top: 5rem; scroll-margin-top: 2rem; }\n    ul, ol { padding-left: 1.3rem; }\n    li + li { margin-top: 0.5rem; }\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.84em;\n    }\n\n    .lede {\n      max-width: 55ch;\n      margin: 1.55rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta { color: var(--muted); font-size: 0.82rem; }\n\n    .opening,\n    .callout,\n    .lab,\n    .draft-builder,\n    .comparison-card,\n    .field-note {\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .opening {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.2rem;\n      margin-top: 2rem;\n      padding: 1.35rem;\n    }\n\n    .opening h2 {\n      margin-bottom: 0.65rem;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 800;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .opening p, .opening ul { margin: 0; font-size: 0.94rem; }\n\n    .time {\n      display: inline-block;\n      margin-bottom: 0.65rem;\n      color: var(--accent);\n      font-size: 0.75rem;\n    }\n\n    .label {\n      display: block;\n      margin-bottom: 0.4rem;\n      color: var(--accent);\n      font-size: 0.73rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .callout { margin: 1.5rem 0; padding: 1.25rem 1.35rem; }\n    .callout p:last-child { margin-bottom: 0; }\n    .callout.sage { border-left: 4px solid var(--sage); }\n    .callout.blue { border-left: 4px solid var(--blue); }\n\n    .formula {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: 0.75rem;\n      margin: 1.5rem 0;\n    }\n\n    .formula div {\n      position: relative;\n      padding: 1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: rgba(255, 253, 248, 0.68);\n    }\n\n    .formula div:not(:last-child)::after {\n      position: absolute;\n      top: 50%;\n      right: -0.6rem;\n      z-index: 2;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n      transform: translateY(-50%);\n    }\n\n    .formula strong {\n      display: block;\n      margin-bottom: 0.35rem;\n      font-family: var(--sans);\n      font-size: 0.9rem;\n    }\n\n    .formula span { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      font-size: 0.9em;\n    }\n\n    .term::after,\n    .choice[data-tip]::after {\n      position: absolute;\n      z-index: 30;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(20rem, 80vw);\n      padding: 0.7rem 0.8rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-tip);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .term:hover::after,\n    .term:focus-visible::after,\n    .choice[data-tip]:hover::after,\n    .choice[data-tip]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .lab { margin-top: 2rem; padding: 1.35rem; }\n\n    .lab-header {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1rem;\n    }\n\n    .lab-header h3 { margin: 0; }\n\n    .lab-count {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n      white-space: nowrap;\n    }\n\n    .step-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.1rem;\n      padding-bottom: 0.8rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .step-pill {\n      padding: 0.34rem 0.68rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--muted);\n      background: rgba(255, 253, 248, 0.72);\n      cursor: pointer;\n      font-size: 0.69rem;\n    }\n\n    .step-pill.active {\n      border-color: var(--accent);\n      color: var(--accent-dark);\n      background: var(--accent-soft);\n      font-weight: 700;\n    }\n\n    .step-pill.correct {\n      border-color: var(--sage);\n      color: #384937;\n      background: var(--sage-soft);\n    }\n\n    .step-pill.answered {\n      border-color: var(--blue);\n      color: #334856;\n      background: var(--blue-soft);\n    }\n\n    button {\n      border: 1px solid var(--line);\n      color: var(--ink);\n      background: transparent;\n      cursor: pointer;\n    }\n\n    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }\n\n    .choice-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 0.65rem;\n      margin-top: 1rem;\n    }\n\n    .choice {\n      position: relative;\n      min-height: 4.5rem;\n      padding: 0.8rem;\n      border-radius: 0.48rem;\n      font-size: 0.76rem;\n      line-height: 1.45;\n      text-align: left;\n    }\n\n    .choice.selected {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .choice.correct-answer {\n      border-color: var(--sage);\n      color: #334332;\n      background: var(--sage-soft);\n    }\n\n    .feedback {\n      display: none;\n      margin-top: 1rem;\n      padding: 0.9rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-size: 0.92rem;\n    }\n\n    .feedback.visible { display: block; }\n    .feedback.correct { border-left: 3px solid var(--sage); }\n    .feedback.retry { border-left: 3px solid var(--accent); }\n\n    .quiz-actions {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.6rem;\n      flex-wrap: wrap;\n      margin-top: 1.1rem;\n    }\n\n    .quiz-action-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }\n\n    .quiz-button,\n    .secondary-button,\n    .copy-button {\n      padding: 0.58rem 0.86rem;\n      border-radius: 999px;\n      font-size: 0.73rem;\n    }\n\n    .quiz-button {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .quiz-button:disabled, .secondary-button:disabled { cursor: not-allowed; opacity: 0.42; }\n\n    .comparison-card {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0;\n      overflow: hidden;\n      margin-top: 1.4rem;\n    }\n\n    .comparison-card article { padding: 1.25rem; }\n    .comparison-card article + article { border-left: 1px solid var(--line); }\n    .comparison-card p { font-size: 0.94rem; }\n\n    pre {\n      margin: 1rem 0;\n      padding: 1rem;\n      overflow-x: auto;\n      border-radius: 0.45rem;\n      color: #f8efe3;\n      background: #312c27;\n      font-family: var(--mono);\n      font-size: 0.79rem;\n      line-height: 1.55;\n      white-space: pre-wrap;\n    }\n\n    pre code { padding: 0; color: inherit; background: transparent; font-size: inherit; }\n\n    .ladder {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 0.7rem;\n      margin: 1.4rem 0;\n    }\n\n    .ladder div {\n      padding: 1rem;\n      border-top: 3px solid var(--accent);\n      background: rgba(255, 253, 248, 0.6);\n    }\n\n    .ladder strong { display: block; font-family: var(--sans); font-size: 0.9rem; }\n    .ladder span { color: var(--muted); font-size: 0.83rem; }\n\n    .audit-line {\n      margin: 0.8rem 0;\n      padding: 0.9rem 1rem;\n      border-left: 3px solid var(--accent);\n      background: var(--paper-deep);\n      font-family: var(--mono);\n      font-size: 0.82rem;\n    }\n\n    .draft-builder { margin-top: 1.6rem; overflow: hidden; }\n\n    .builder-grid {\n      display: grid;\n      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);\n    }\n\n    .builder-fields { padding: 1.3rem; border-right: 1px solid var(--line); }\n    .builder-preview { min-width: 0; padding: 1.3rem; background: rgba(238, 229, 214, 0.34); }\n    .builder-preview h3, .builder-fields h3 { margin-top: 0; }\n\n    .field { margin-top: 1rem; }\n\n    label {\n      display: block;\n      margin-bottom: 0.35rem;\n      color: var(--muted);\n      font-size: 0.7rem;\n    }\n\n    input, textarea {\n      width: 100%;\n      padding: 0.7rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 0.42rem;\n      color: var(--ink);\n      background: #fffdf8;\n      font-size: 0.77rem;\n      line-height: 1.45;\n    }\n\n    textarea { min-height: 6.5rem; resize: vertical; }\n    input:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }\n\n    .builder-preview pre { min-height: 23rem; margin-bottom: 0.75rem; }\n\n    .copy-status {\n      min-height: 1.4rem;\n      color: var(--sage);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n    }\n\n    .scorecard {\n      width: 100%;\n      margin: 1.4rem 0;\n      border-collapse: collapse;\n      font-size: 0.93rem;\n    }\n\n    .scorecard th, .scorecard td { padding: 0.8rem; border-bottom: 1px solid var(--line); text-align: left; }\n    .scorecard th { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; }\n\n    .field-note { margin-top: 1.5rem; padding: 1.25rem; }\n    .field-note p:first-child { margin-top: 0; }\n\n    .learner-note {\n      margin-top: 1.5rem;\n      padding: 1.3rem 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: rgba(255, 253, 248, 0.68);\n      box-shadow: var(--shadow);\n    }\n\n    .learner-question {\n      margin: 0 0 1.1rem;\n      padding-left: 1rem;\n      border-left: 3px solid var(--accent);\n      color: #4f4941;\n      font-style: italic;\n    }\n\n    .three-questions {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 0.65rem;\n      margin: 1rem 0;\n    }\n\n    .three-questions div {\n      padding: 0.85rem;\n      border-radius: 0.45rem;\n      background: var(--paper-deep);\n    }\n\n    .three-questions strong {\n      display: block;\n      font-family: var(--sans);\n      font-size: 0.86rem;\n    }\n\n    .three-questions span { color: var(--muted); font-size: 0.82rem; }\n\n    .source-note { color: var(--muted); font-size: 0.88rem; }\n\n    @media (max-width: 760px) {\n      .formula { grid-template-columns: 1fr 1fr; }\n      .formula div:nth-child(2)::after { display: none; }\n      .builder-grid { grid-template-columns: 1fr; }\n      .builder-fields { border-right: 0; border-bottom: 1px solid var(--line); }\n    }\n\n    @media (max-width: 620px) {\n      main { padding-top: 3rem; }\n      .opening, .comparison-card, .ladder, .three-questions { grid-template-columns: 1fr; }\n      .comparison-card article + article { border-top: 1px solid var(--line); border-left: 0; }\n      .choice-grid { grid-template-columns: 1fr; }\n      .formula { grid-template-columns: 1fr; }\n      .formula div::after { display: none; }\n      .lab-header { align-items: flex-start; flex-direction: column; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Session 2 · Design workshop\u003c/p>\n      \u003ch1>Design a skill that earns its context\u003c/h1>\n      \u003cp class=\"lede\">Session one made Matt Pocock’s system legible. Now you will use its strongest ideas to draft a small skill—and make every line defend its place.\u003c/p>\n      \u003cp class=\"meta\">60 minutes · advanced · artifact-driven · progress saved locally\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"carry-forward\">Carry forward\u003c/h2>\n          \u003cp>A skill is not a topic summary. It is an interface around repeatable judgment: a trigger, an ownership boundary, behavior that changes the default, and a stopping condition.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"session-artifact\">Your artifact\u003c/h2>\n          \u003cp>You will leave with a compact \u003ccode>SKILL.md\u003c/code> draft for an execution-first delivery discipline: scoped work, inspectable evidence, and honest verification.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–10 minutes\u003c/span>\n      \u003ch2 id=\"start-from-failure\">1. Start from failure, not format\u003c/h2>\n      \u003cp>“A skill for careful coding” gives the agent no diagnostic target. Start from a behavior you can recognize after a bad run: adjacent files changed without permission, verification asserted without evidence, or known uncertainty hidden behind confident prose.\u003c/p>\n\n      \u003cdiv class=\"formula\" aria-label=\"Skill design sequence\">\n        \u003cdiv>\u003cstrong>Failure\u003c/strong>\u003cspan>What observable behavior repeats?\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Responsibility\u003c/strong>\u003cspan>What judgment should become reusable?\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Control\u003c/strong>\u003cspan>Which lever changes the default?\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Evidence\u003c/strong>\u003cspan>How will you know it worked?\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">Design constraint\u003c/span>\n        \u003cp>Do not encode “be good.” Encode a decision the model otherwise makes inconsistently. This is the practical meaning of hunting a \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"An instruction that does not materially change the model’s behavior compared with its default. It spends attention without buying control.\">no-op\u003c/span>.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"brief-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"design-brief\">Build the design brief\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"brief-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"brief-nav\" role=\"tablist\" aria-label=\"Design brief questions\">\u003c/div>\n        \u003cp class=\"label\" id=\"brief-kicker\">\u003c/p>\n        \u003cp id=\"brief-question\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"brief-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"brief-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"secondary-button\" id=\"brief-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton class=\"secondary-button\" id=\"brief-skip\" type=\"button\">Skip\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"quiz-button\" id=\"brief-check\" type=\"button\" disabled>Check\u003c/button>\n            \u003cbutton class=\"quiz-button\" id=\"brief-next\" type=\"button\">Next →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">10–22 minutes\u003c/span>\n      \u003ch2 id=\"choose-invocation\">2. Write the pointer before the body\u003c/h2>\n      \u003cp>For a model-discoverable skill, the description is a \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"An always-visible reference that names out-of-context material and states the distinct conditions under which the agent should load it.\">context pointer\u003c/span>. It must identify the material and enumerate distinct trigger branches. It should not smuggle the whole procedure into frontmatter.\u003c/p>\n\n      \u003cdiv class=\"comparison-card\">\n        \u003carticle>\n          \u003cspan class=\"label\">Weak pointer\u003c/span>\n          \u003cpre>\u003ccode>description: Helps agents do coding work carefully and verify results.\u003c/code>\u003c/pre>\n          \u003cp>\u003cstrong>Why it fails:\u003c/strong> “coding work” matches almost everything. “Carefully” has no observable meaning. The pointer adds context load without a crisp retrieval boundary.\u003c/p>\n        \u003c/article>\n        \u003carticle>\n          \u003cspan class=\"label\">Sharper pointer\u003c/span>\n          \u003cpre>\u003ccode>description: Keep implementation changes inside an explicit scope and report verification evidence honestly. Use when the user asks to build, change, fix, or apply something in a repository.\u003c/code>\u003c/pre>\n          \u003cp>\u003cstrong>Why it is stronger:\u003c/strong> the leading verbs name the behavior; the trigger list identifies change-making branches; explanation-only work stays outside.\u003c/p>\n        \u003c/article>\n      \u003c/div>\n\n      \u003cdiv class=\"learner-note\">\n        \u003cspan class=\"label\">Learner question\u003c/span>\n        \u003cp class=\"learner-question\">“That is a little bit counterintuitive. I used to think that you have to describe the problems that those skills are solving, and the problems should be independent of each other. But what you said in this session is that we actually need to define the behavioral contract in the description of the skills. Can you elaborate more on that? Why is it better? In simple words, intuitively.”\u003c/p>\n\n        \u003ch3 id=\"problem-behavior-trigger\">Problem, behavior, and trigger answer different questions\u003c/h3>\n        \u003cdiv class=\"three-questions\">\n          \u003cdiv>\u003cstrong>Problem\u003c/strong>\u003cspan>Why does this skill need to exist?\u003c/span>\u003c/div>\n          \u003cdiv>\u003cstrong>Behavioral contract\u003c/strong>\u003cspan>What will it make the agent do differently?\u003c/span>\u003c/div>\n          \u003cdiv>\u003cstrong>Trigger\u003c/strong>\u003cspan>When should the agent load it?\u003c/span>\u003c/div>\n        \u003c/div>\n\n        \u003cp>Your problem-first model is useful during design: it helps you discover a coherent reason for creating the skill. But a description is also a label in the agent’s toolbox. A problem-only label such as “use when implementation quality is unreliable” does not reveal whether the skill adds tests, reviews code, restricts scope, or investigates bugs.\u003c/p>\n\n        \u003cp>The behavioral contract names the remedy. The trigger names the situations in which that remedy applies. Together, they let the agent predict what loading the skill will change and decide when to retrieve it.\u003c/p>\n\n        \u003cdiv class=\"callout sage\">\n          \u003cspan class=\"label\">Drafting sequence\u003c/span>\n          \u003cp>\u003cstrong>Start from the problem\u003c/strong> to discover why the skill should exist. \u003cstrong>Define the behavior\u003c/strong> to decide what responsibility it owns. \u003cstrong>Write the description as behavior + triggers\u003c/strong> so the agent can retrieve it correctly.\u003c/p>\n        \u003c/div>\n\n        \u003cp>The independence question still matters at the skill boundary. If two behaviors are useful separately, they may deserve separate skills. In this lesson, scope control and honest verification are grouped because they form one implementation-completion contract. That grouping is a design judgment, not a universal rule.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">Invocation decision\u003c/span>\n        \u003cp>Make this discipline model-discoverable if you want it to activate during ordinary implementation. Keep it human-only if it is a deliberate audit ceremony. That is a trade between \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"Always-loaded tokens and attention spent so the agent can discover a document automatically.\">context load\u003c/span> and \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"The human effort of remembering which manual skill to invoke and when. In this design philosophy, it is also a way to preserve human agency.\">cognitive load\u003c/span>, not a hierarchy of quality.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">22–38 minutes\u003c/span>\n      \u003ch2 id=\"place-information\">3. Put each instruction at the cheapest truthful layer\u003c/h2>\n      \u003cp>The body is not the default home for every useful fact. Place material according to when it is needed and where its source of truth lives.\u003c/p>\n\n      \u003cdiv class=\"ladder\" aria-label=\"Three information placement layers\">\n        \u003cdiv>\u003cstrong>In-file\u003c/strong>\u003cspan>Universal steps and rules needed on every run.\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Disclosed reference\u003c/strong>\u003cspan>Branch-specific material behind a precise pointer.\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Environment\u003c/strong>\u003cspan>Facts cheaply discoverable from files, config, or help output.\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"placement-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"placement-game\">Place the instruction\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"placement-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"placement-nav\" role=\"tablist\" aria-label=\"Information placement cases\">\u003c/div>\n        \u003cp class=\"audit-line\" id=\"placement-line\">\u003c/p>\n        \u003cp id=\"placement-question\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"placement-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"placement-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"secondary-button\" id=\"placement-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton class=\"secondary-button\" id=\"placement-skip\" type=\"button\">Skip\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"quiz-button\" id=\"placement-check\" type=\"button\" disabled>Check\u003c/button>\n            \u003cbutton class=\"quiz-button\" id=\"placement-next\" type=\"button\">Next →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">The cache test\u003c/span>\n        \u003cp>If the agent can recover a fact with one cheap lookup, copying it into the skill creates a stale cache. Document the convention, reason, or gotcha the environment cannot confess; let the environment own its own current values.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">38–50 minutes\u003c/span>\n      \u003ch2 id=\"draft-the-control-loop\">4. Draft a small control loop\u003c/h2>\n      \u003cp>The following builder is deliberately constrained. It prevents you from writing a miniature handbook before the interface is clear. Your entries are saved in this browser and restored when you return.\u003c/p>\n\n      \u003cdiv class=\"draft-builder\">\n        \u003cdiv class=\"builder-grid\">\n          \u003cdiv class=\"builder-fields\">\n            \u003ch3 id=\"draft-inputs\">Four decisions\u003c/h3>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"skill-name\">Skill name\u003c/label>\n              \u003cinput id=\"skill-name\" value=\"scope-and-evidence\" autocomplete=\"off\">\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"trigger\">Trigger pointer — what it is + when it loads\u003c/label>\n              \u003ctextarea id=\"trigger\">Keep implementation changes inside explicit scope and report verification evidence honestly. Use when the user asks to build, change, fix, or apply something in a repository.\u003c/textarea>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"core-step\">Core behavior — the judgment being made reusable\u003c/label>\n              \u003ctextarea id=\"core-step\">Resolve the requested change into an explicit target, preserve unrelated work, implement only that scope, and run checks proportional to the risk.\u003c/textarea>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"done-criterion\">Completion criterion — checkable and demanding\u003c/label>\n              \u003ctextarea id=\"done-criterion\">Finish when every requested outcome is implemented, every relevant check has a recorded result, and remaining uncertainty is named without implying it passed.\u003c/textarea>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"builder-preview\">\n            \u003ch3 id=\"draft-preview-heading\">Live \u003ccode>SKILL.md\u003c/code>\u003c/h3>\n            \u003cpre>\u003ccode id=\"draft-preview\">\u003c/code>\u003c/pre>\n            \u003cbutton class=\"copy-button\" id=\"copy-draft\" type=\"button\">Copy draft\u003c/button>\n            \u003cp class=\"copy-status\" id=\"copy-status\" aria-live=\"polite\">\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003cspan class=\"label\">Read the draft adversarially\u003c/span>\n        \u003cp>Where could an agent truthfully claim compliance while doing less than you intended? “Relevant checks” still delegates a judgment. That may be correct—but if your failures cluster there, define relevance or point to repository-specific instructions.\u003c/p>\n        \u003cp>Where does the draft repeat the environment? It should not list the project’s test commands if \u003ccode>package.json\u003c/code>, \u003ccode>Makefile\u003c/code>, or \u003ccode>--help\u003c/code> already owns them.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">50–60 minutes\u003c/span>\n      \u003ch2 id=\"test-the-skill\">5. Test behavior, not eloquence\u003c/h2>\n      \u003cp>A polished document is not evidence that the skill works. A skill claims predictability: the agent should take the same process across comparable runs, while the outputs still vary with the task.\u003c/p>\n\n      \u003ctable class=\"scorecard\">\n        \u003cthead>\n          \u003ctr>\u003cth>Test\u003c/th>\u003cth>What to compare\u003c/th>\u003cth>Failure signal\u003c/th>\u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>Trigger test\u003c/td>\n            \u003ctd>Run one in-scope implementation request and one explanation-only request.\u003c/td>\n            \u003ctd>The skill misses the change request or loads during explanation.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Counterfactual test\u003c/td>\n            \u003ctd>Run the same task with and without one disputed sentence.\u003c/td>\n            \u003ctd>No observable behavior changes; the sentence may be a no-op.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Adversarial scope test\u003c/td>\n            \u003ctd>Give a narrow request beside tempting adjacent cleanup.\u003c/td>\n            \u003ctd>The agent “improves” material outside the named boundary.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Evidence test\u003c/td>\n            \u003ctd>Make one relevant check unavailable or failing.\u003c/td>\n            \u003ctd>The final report implies full verification or buries uncertainty.\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">Session result\u003c/span>\n        \u003cp>You now have a design loop: name a recurring failure, allocate invocation ownership, choose the cheapest truthful information layer, write checkable completion criteria, and test sentences counterfactually. This is more valuable than copying the surface style of any existing skill.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003ch3 id=\"completion-check\">Before you call the draft ready\u003c/h3>\n        \u003cul>\n          \u003cli>The description names distinct trigger branches rather than broad synonyms.\u003c/li>\n          \u003cli>Every in-file instruction changes behavior on the runs where it applies.\u003c/li>\n          \u003cli>Branch-specific reference is disclosed behind a pointer.\u003c/li>\n          \u003cli>Cheap environmental facts remain in the environment.\u003c/li>\n          \u003cli>Completion is both checkable and demanding.\u003c/li>\n          \u003cli>At least one counterfactual run tests whether a disputed line earns its load.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"source-notes\">Source notes\u003c/h2>\n      \u003cp class=\"source-note\">This session was checked against the public repository on August 10, 2026. The current \u003ccode>writing-for-agents\u003c/code> reference defines context pointers, the two loads, information hierarchy, completion criteria, leading words, and pruning; the repository README documents the current user-invoked/model-invoked split.\u003c/p>\n      \u003cul class=\"source-note\">\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills\">Repository README and skill catalog\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\">\u003ccode>writing-for-agents/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\">\u003ccode>grilling/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_PREFIX = \"mattpocock-skills:session2:\";\n\n    function loadState(key, fallback) {\n      try {\n        const saved = localStorage.getItem(STORAGE_PREFIX + key);\n        return saved ? JSON.parse(saved) : fallback;\n      } catch (error) {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));\n      } catch (error) {\n        // The lesson remains usable when storage is unavailable.\n      }\n    }\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const percent = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      document.querySelector(\"#progress-bar\").style.width = `${Math.min(100, percent)}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    updateProgress();\n\n    function createStepper(config) {\n      const state = loadState(config.storageKey, { index: 0, answers: {} });\n      let index = Math.min(Math.max(0, Number(state.index) || 0), config.items.length - 1);\n      let selected = null;\n\n      const nav = document.querySelector(config.nav);\n      const count = document.querySelector(config.count);\n      const prompt = document.querySelector(config.prompt);\n      const question = config.question ? document.querySelector(config.question) : null;\n      const kicker = config.kicker ? document.querySelector(config.kicker) : null;\n      const choices = document.querySelector(config.choices);\n      const feedback = document.querySelector(config.feedback);\n      const previous = document.querySelector(config.previous);\n      const skip = document.querySelector(config.skip);\n      const check = document.querySelector(config.check);\n      const next = document.querySelector(config.next);\n\n      function renderNav() {\n        nav.replaceChildren();\n        config.items.forEach((item, itemIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"step-pill\";\n          button.textContent = item.shortLabel || `Step ${itemIndex + 1}`;\n          if (itemIndex === index) button.classList.add(\"active\");\n          const answer = state.answers[itemIndex];\n          if (answer?.correct) button.classList.add(\"correct\");\n          else if (answer?.checked) button.classList.add(\"answered\");\n          button.setAttribute(\"role\", \"tab\");\n          button.setAttribute(\"aria-selected\", String(itemIndex === index));\n          button.addEventListener(\"click\", () => goTo(itemIndex));\n          nav.append(b
