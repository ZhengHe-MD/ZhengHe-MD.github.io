<!doctype html>
<html lang="zh-CN">

  <style>
@import url("https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&display=swap");

:root {
  color-scheme: light dark;
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", Georgia, serif;
  --font-heading-weight: 400;
  --font-body: "Figtree", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --space-1: 4.4px;
  --space-2: 8.8px;
  --space-3: 13.2px;
  --space-4: 17.6px;
  --space-6: 26.4px;
  --space-8: 35.2px;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, var(--color-text) 8%, transparent);
  --shadow-md: 0 4px 12px color-mix(in srgb, var(--color-text) 8%, transparent), 0 1px 2px color-mix(in srgb, var(--color-text) 5%, transparent);
  --shadow-lg: 0 16px 36px color-mix(in srgb, var(--color-text) 12%, transparent), 0 2px 6px color-mix(in srgb, var(--color-text) 6%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  font-weight: 400;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.cs-export-shell {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
}
.cs-export-container {
  max-width: 1700px;
  margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 56px);
}

/* Header */
.cs-export-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 40px;
  padding: clamp(36px, 5vw, 64px) 0 clamp(28px, 3vw, 40px);
  border-bottom: 1px solid var(--color-divider);
}
.cs-export-header-text { min-width: 0; }
.cs-export-title {
  max-width: 20ch;
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: clamp(38px, 6vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}
.cs-export-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
}
.cs-lang-switcher {
  display: inline-flex;
  align-items: center;
  background: var(--color-surface);
  border: 1px solid var(--color-accent-300);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.cs-lang-pill {
  border: 0;
  background: transparent;
  color: var(--color-neutral-700);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s ease;
  line-height: 1.2;
}
.cs-lang-pill:hover {
  color: var(--color-text);
}
.cs-lang-pill.active {
  background: var(--color-accent);
  color: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}
.cs-nav-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-600);
  margin-left: auto;
  flex: none;
}
.cs-companion-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--color-accent-300);
  background: var(--color-accent-100);
  color: var(--color-accent-800);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
}
.cs-companion-toggle:hover {
  background: var(--color-accent-200);
  border-color: var(--color-accent-400);
}
.cs-companion-toggle.active {
  background: var(--color-accent);
  color: #fff;
  border-color: var(--color-accent);
}
.cs-companion-toggle-icon { font-size: 15px; }

/* Main layout */
.cs-export-layout {
  display: grid;
  gap: clamp(20px, 2.4vw, 40px);
  align-items: start;
  justify-content: start;
  padding: clamp(24px, 3.4vw, 40px) 0 80px;
}

/* Nav */
.cs-export-nav {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
  padding: 22px 18px;
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  max-height: calc(100vh - 48px);
  overflow-y: auto;
}
.cs-export-nav.is-rail {
  padding: 18px 12px;
}
.cs-export-nav.is-rail .cs-export-nav-heading,
.cs-export-nav.is-rail .cs-nav-label {
  display: none;
}
.cs-export-nav-heading {
  padding: 0 10px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}
.cs-page-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cs-nav-item {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--color-neutral-800);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  text-align: left;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.cs-export-nav.is-rail .cs-nav-item {
  grid-template-columns: 28px;
  padding: 8px;
  justify-content: center;
}
.cs-nav-item:hover {
  background: var(--color-accent-200);
}
.cs-nav-item.active {
  background: var(--color-accent-100);
  color: var(--color-accent-800);
  font-weight: 700;
}
.cs-nav-num {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-700);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: background .15s ease, color .15s ease;
}
.cs-nav-item.active .cs-nav-num {
  background: var(--color-accent);
  color: #fff;
}
.cs-nav-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Reader */
.cs-export-reader {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.cs-frame-card {
  border-radius: var(--radius-lg);
  background: #fff;
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid var(--color-divider);
}
.cs-frame-card iframe {
  display: block;
  width: 100%;
  min-height: 560px;
  border: 0;
  background: #fff;
}
.cs-export-pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 6px 0;
}
.cs-btn-prev, .cs-btn-next {
  font-family: var(--font-body);
  font-size: 14.5px;
  font-weight: 700;
  line-height: 1;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s ease;
}
.cs-btn-prev {
  padding: 13px 24px;
  border: 1px solid var(--color-neutral-300);
  background: transparent;
  color: var(--color-text);
}
.cs-btn-prev:hover:not(:disabled) {
  background: var(--color-accent-100);
}
.cs-btn-next {
  padding: 13px 26px;
  border: 1px solid var(--color-accent);
  background: var(--color-accent);
  color: #fff;
}
.cs-btn-next:hover:not(:disabled) {
  background: var(--color-accent-600);
  border-color: var(--color-accent-600);
}
.cs-btn-prev:disabled, .cs-btn-next:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Companion Drawer / Aside */
.cs-companion-drawer {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  max-height: calc(100vh - 48px);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  animation: cs-fade-in .18s ease-out;
}
.cs-companion-drawer[hidden] {
  display: none !important;
}
.cs-companion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--color-divider);
}
.cs-companion-header strong {
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 17px;
  line-height: 1.2;
}
.cs-companion-close {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  border: 0;
  border-radius: 999px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-800);
  font-size: 14px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.cs-companion-close:hover {
  background: var(--color-accent-200);
  color: var(--color-accent-900);
}
.cs-companion-content {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.cs-companion-empty {
  margin: 40px 0 0;
  text-align: center;
  color: var(--color-neutral-700);
  font-size: 14px;
}
.cs-companion-session {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cs-companion-session-title {
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--color-neutral-300);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}
.cs-companion-turn {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 8px;
}
.cs-turn-block {
  padding: 13px 15px;
  border-radius: var(--radius-md);
  font-size: 14px;
  line-height: 1.6;
}
.cs-turn-user {
  background: var(--color-accent-2-100);
  border: 1px solid var(--color-accent-2-300);
  color: var(--color-text);
}
.cs-turn-agent {
  background: #fffdf8;
  border: 1px solid var(--color-divider);
  color: var(--color-text);
}
.cs-turn-author {
  display: block;
  margin-bottom: 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.cs-turn-user .cs-turn-author {
  color: var(--color-accent-2-800);
}
.cs-turn-agent .cs-turn-author {
  color: var(--color-accent-700);
}
.cs-turn-text {
  white-space: pre-wrap;
  word-break: break-word;
}
.cs-turn-reasoning {
  border: 1px solid var(--color-accent-200);
  border-radius: var(--radius-md);
  background: var(--color-accent-100);
  padding: 8px 12px;
  font-size: 12.5px;
  color: var(--color-neutral-800);
}
.cs-turn-reasoning summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--color-accent-800);
  list-style: none;
}
.cs-turn-reasoning summary::-webkit-details-marker {
  display: none;
}
.cs-turn-reasoning ul {
  margin: 8px 0 4px;
  padding-left: 18px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cs-companion-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(46, 43, 37, 0.4);
  z-index: 800;
  backdrop-filter: blur(2px);
}
.cs-companion-backdrop[hidden] {
  display: none !important;
}

@keyframes cs-fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1024px) {
  .cs-export-header {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .cs-export-actions {
    margin-top: 8px;
  }
  .cs-export-layout {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .cs-export-nav {
    position: static;
    max-height: none;
    overflow-y: visible;
  }
  .cs-export-nav .cs-page-list {
    flex-direction: row;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .cs-export-nav .cs-nav-item {
    min-width: 180px;
  }
  .cs-companion-drawer {
    position: fixed;
    top: 20px;
    right: 20px;
    bottom: 20px;
    width: min(440px, calc(100vw - 40px));
    max-height: none;
    z-index: 900;
    box-shadow: var(--shadow-lg);
  }
}

@media print {
  .cs-export-nav, .cs-export-pager, .cs-companion-toggle, .cs-companion-drawer, .cs-companion-backdrop {
    display: none !important;
  }
  .cs-export-layout {
    display: block;
  }
  .cs-frame-card {
    border: 0;
    box-shadow: none;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1c1815;
    --color-surface: #262019;
    --color-text: #f2ece2;
    --color-accent: #e2874a;
    --color-accent-2: #9cb07c;
    --color-divider: color-mix(in srgb, #f2ece2 14%, transparent);

    --color-neutral-100: #2e2b25;
    --color-neutral-200: #474238;
    --color-neutral-300: #645c50;
    --color-neutral-400: #82796a;
    --color-neutral-500: #a19786;
    --color-neutral-600: #c0b6a5;
    --color-neutral-700: #dcd3c4;
    --color-neutral-800: #eee7db;
    --color-neutral-900: #f9f4ed;

    --color-accent-100: #402310;
    --color-accent-200: #643312;
    --color-accent-300: #8c491a;
    --color-accent-400: #b2622d;
    --color-accent-500: #d67f48;
    --color-accent-600: #f6a06b;
    --color-accent-700: #ffc6a5;
    --color-accent-800: #ffe1d0;
    --color-accent-900: #fff2eb;

    --color-accent-2-100: #272e1b;
    --color-accent-2-200: #3d472b;
    --color-accent-2-300: #56633f;
    --color-accent-2-400: #728157;
    --color-accent-2-500: #8fa073;
    --color-accent-2-600: #aebf92;
    --color-accent-2-700: #ccdbb2;
    --color-accent-2-800: #e1eecc;
    --color-accent-2-900: #f0fae1;
  }
  .cs-frame-card,
  .cs-frame-card iframe {
    background: var(--color-surface);
  }
  .cs-turn-agent {
    background: var(--color-surface);
  }
}
</style>
</head>

<div class="cs-export-shell">
  <div class="cs-export-container">
    <header class="cs-export-header">
      <div class="cs-export-header-text">
        <h1 class="cs-export-title">MattPocock Skills</h1>
      </div>
      <div class="cs-export-actions">
        
        <div class="cs-lang-switcher" id="cs-lang-switcher" role="group" aria-label="课程版本">
          <button type="button" class="cs-lang-pill " data-lang="en">EN</button>
          <button type="button" class="cs-lang-pill active" data-lang="zh-CN">中文</button>
        </div>
        <button id="cs-companion-toggle" class="cs-companion-toggle" type="button" aria-expanded="false" aria-controls="cs-companion-drawer">
          <span class="cs-companion-toggle-icon">💬</span>
          <span id="cs-companion-toggle-label">共同设计对话</span>
        </button>
      </div>
    </header>

    <div class="cs-export-layout" id="cs-export-layout">
      <nav class="cs-export-nav" id="cs-export-nav" aria-label="课程内容">
        <strong class="cs-export-nav-heading">课程内容</strong>
        <div id="cs-page-list" class="cs-page-list"></div>
      </nav>

      <main class="cs-export-reader" id="cs-export-reader">
        <div class="cs-frame-card">
          <iframe id="cs-course-frame" data-frame="course" title="MattPocock Skills"></iframe>
        </div>
        <div class="cs-export-pager">
          <button id="cs-previous" class="cs-btn-prev" type="button">← 上一页</button>
          <button id="cs-next" class="cs-btn-next" type="button">下一页 →</button>
        </div>
      </main>

      <aside id="cs-companion-drawer" class="cs-companion-drawer" aria-label="共同设计对话与问答" hidden>
        <div class="cs-companion-header">
          <strong>共同设计对话与问答</strong>
          <button id="cs-companion-close" class="cs-companion-close" type="button" aria-label="关闭">✕</button>
        </div>
        <div id="cs-companion-content" class="cs-companion-content"></div>
      </aside>
    </div>
  </div>
</div>
<div id="cs-companion-backdrop" class="cs-companion-backdrop" hidden></div>

h2, h3 { line-height: 1.18; }\n\n    h1 {\n      max-width: 11ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.4rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    .lede {\n      max-width: 54ch;\n      margin: 1.6rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta {\n      color: var(--muted);\n      font-size: 0.82rem;\n    }\n\n    section { margin-top: 3.75rem; }\n\n    h2 {\n      margin: 0 0 1rem;\n      font-size: 1.75rem;\n      font-weight: 500;\n      letter-spacing: -0.02em;\n    }\n\n    h3 {\n      margin: 0 0 0.45rem;\n      font-size: 1.14rem;\n    }\n\n    p { margin: 0.75rem 0; }\n\n    ul { padding-left: 1.25rem; }\n\n    li + li { margin-top: 0.45rem; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.85em;\n    }\n\n    .promise {\n      padding: 1.35rem 1.5rem;\n      border-left: 3px solid var(--accent);\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .course-path {\n      margin-top: 1.5rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .session-heading {\n      padding: 1.35rem 0 0.45rem;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .session-heading .duration {\n      display: block;\n      margin-bottom: 0.35rem;\n    }\n\n    .session-heading h3 { margin-bottom: 0.35rem; }\n\n    .session-heading p {\n      margin: 0;\n      color: var(--muted);\n      font-size: 0.94rem;\n    }\n\n    .module {\n      display: grid;\n      grid-template-columns: 5.5rem 1fr;\n      gap: 1.2rem;\n      padding: 1.55rem 0;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .duration {\n      padding-top: 0.15rem;\n      color: var(--accent);\n      font-size: 0.76rem;\n    }\n\n    .module p { margin: 0; color: #595249; }\n\n    .examples {\n      display: grid;\n      gap: 0.75rem;\n      margin-top: 1.2rem;\n    }\n\n    .example {\n      padding: 1rem 1.1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      background: var(--card);\n    }\n\n    .example strong { display: block; margin-bottom: 0.25rem; }\n\n    .example p { margin: 0; color: var(--muted); font-size: 0.94rem; }\n\n    .lens {\n      padding: 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: 0.55rem;\n      background: rgba(255, 253, 248, 0.55);\n    }\n\n    .lens-controls {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.55rem;\n      margin: 1rem 0;\n    }\n\n    button {\n      padding: 0.55rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--ink);\n      background: transparent;\n      cursor: pointer;\n      font-size: 0.76rem;\n    }\n\n    button:hover,\n    button:focus-visible,\n    button[aria-pressed=\"true\"] {\n      border-color: var(--accent);\n      outline: none;\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    #lens-note {\n      min-height: 4.9rem;\n      margin: 0;\n      color: #514a42;\n    }\n\n    .principle {\n      color: var(--accent);\n      font-style: italic;\n    }\n\n    .source-note {\n      margin-top: 1.4rem;\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    @media (max-width: 560px) {\n      main { padding-top: 3rem; }\n      .module { grid-template-columns: 1fr; gap: 0.3rem; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Advanced critique and design workshop\u003c/p>\n      \u003ch1 id=\"course-title\">MattPocock Skills\u003c/h1>\n      \u003cp class=\"lede\">A close reading of how Matt Pocock turns software-engineering judgment into small, composable instructions for coding agents—followed by a practical workshop for designing and testing one of your own.\u003c/p>\n      \u003cp class=\"meta\">About 3 hours 20 minutes · three focused sessions · concrete repository examples\u003c/p>\n    \u003c/header>\n\n    \u003csection>\n      \u003ch2 id=\"course-thesis\">Course thesis\u003c/h2>\n      \u003cdiv class=\"promise\">\n        \u003cp>This is not an exhaustive close reading of every skill. We will first map the whole portfolio, then reconstruct the system behind selected files: how a skill is invoked, how responsibilities are divided, how instructions try to control agent variance, and how several skills compose into a workflow.\u003c/p>\n        \u003cp>Then we will critique the system on its own terms and put its strongest ideas to work. Which design choices are robust? Which are personal conventions presented as general principles? What happens when we use them to draft and test a small skill?\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"outcomes\">By the end\u003c/h2>\n      \u003cul>\n        \u003cli>Explain the portfolio as a main idea-to-ship flow with on-ramps, upkeep, vocabulary layers, standalone support, and one-time setup—then distinguish its domain and invocation axes.\u003c/li>\n        \u003cli>Recognize four skill shapes: router, orchestrator, reusable discipline, and reference.\u003c/li>\n        \u003cli>Annotate a \u003ccode>SKILL.md\u003c/code> in terms of triggers, steps, completion criteria, disclosed context, and sources of truth.\u003c/li>\n        \u003cli>Distinguish Matt’s explicit claims from patterns visible in the repository and from our own inference.\u003c/li>\n        \u003cli>Apply a compact scorecard to decide what is worth borrowing, adapting, or rejecting.\u003c/li>\n        \u003cli>Draft a skill from an observable failure, with deliberate invocation ownership and information placement.\u003c/li>\n        \u003cli>Test whether its trigger, scope controls, and completion criteria change agent behavior.\u003c/li>\n        \u003cli>Trace those ideas through contrasting real skills, then analyze an unfamiliar skill without relying on its surface format.\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"course-path\">The three-session path\u003c/h2>\n      \u003cdiv class=\"course-path\">\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">Session 1 · 75 min\u003c/span>\n          \u003ch3 id=\"session-one\">Read the system behind the files\u003c/h3>\n          \u003cp>Reconstruct the architecture, compare skill shapes, and pressure-test the design philosophy before borrowing from it.\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–12 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-map\">1. Map the system before reading prose\u003c/h3>\n            \u003cp>Reconstruct the repository as an architecture: \u003ccode>engineering\u003c/code> versus \u003ccode>productivity\u003c/code>, user-invoked versus model-invoked skills, setup and distribution layers, and the rule that orchestrators call reusable disciplines rather than other orchestrators.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">12–32 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-shapes\">2. Compare four radically different skill shapes\u003c/h3>\n            \u003cp>Read a six-line composition beside a process loop and a dense reference. The question is not “Which format is correct?” but “What responsibility justifies each shape?”\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">32–52 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-drafting\">3. Reverse-engineer the drafting method\u003c/h3>\n            \u003cp>Study trigger descriptions as context pointers; progressive disclosure as an information hierarchy; explicit completion criteria as variance control; leading words as compressed behavior; and pruning as protection against prompt sediment.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">52–68 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-critique\">4. Pressure-test the philosophy\u003c/h3>\n            \u003cp>Examine the tension between composability and hidden coupling, human agency and ritualized process, memorable vocabulary and house jargon, model-agnostic claims and model-relative behavior, confidence and empirical evidence.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">68–75 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-ledger\">5. Produce a borrowing ledger\u003c/h3>\n            \u003cp>Sort the design ideas into \u003cem>adopt\u003c/em>, \u003cem>adapt\u003c/em>, and \u003cem>reject for now\u003c/em>, each with a reason and a test. This becomes the bridge to designing your own high-quality skills later.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">Session 2 · 60 min\u003c/span>\n          \u003ch3 id=\"session-two\">Design a skill that earns its context\u003c/h3>\n          \u003cp>Turn the first session’s critique into an artifact: a compact skill draft and a behavioral test plan.\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–10 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-failure\">1. Start from failure, not format\u003c/h3>\n            \u003cp>Name an observable recurring failure, locate the reusable judgment behind it, and distinguish a behavioral control from a well-intentioned no-op.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">10–22 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-pointer\">2. Write the pointer before the body\u003c/h3>\n            \u003cp>Choose invocation ownership, then write a trigger description that identifies the material and the distinct branches that should load it.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">22–38 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-placement\">3. Place information deliberately\u003c/h3>\n            \u003cp>Sort universal steps, branch-specific reference, environmental sources of truth, and removable no-ops onto the cheapest truthful layer.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">38–50 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-draft\">4. Draft a small control loop\u003c/h3>\n            \u003cp>Build a live \u003ccode>SKILL.md\u003c/code> from four decisions: name, trigger pointer, core behavior, and a checkable, demanding completion criterion.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">50–60 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-test\">5. Test behavior, not eloquence\u003c/h3>\n            \u003cp>Design trigger, counterfactual, adversarial-scope, and evidence tests so every disputed line must earn its context load.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">Session 3 · 65 min\u003c/span>\n          \u003ch3 id=\"session-three\">Case studies: watch the design work\u003c/h3>\n          \u003cp>Orient with the full \u003ccode>ask-matt\u003c/code> system map, read three sharply different skills through the same lenses, then transfer the method to a fresh file.\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–15 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-protocol\">1. See the system, then build a reading protocol\u003c/h3>\n            \u003cp>Carry forward a five-part trace, then use an interactive map reconstructed from \u003ccode>ask-matt\u003c/code> to see all 25 skills as a main flow, on-ramps, upkeep, vocabulary, and standalone support.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">15–45 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-cases\">2. Read three contrasting case files\u003c/h3>\n            \u003cp>Compare \u003ccode>ask-matt\u003c/code> as a human-invoked router, \u003ccode>diagnosing-bugs\u003c/code> as a gated diagnostic discipline, and \u003ccode>code-review\u003c/code> as a parallel two-axis review.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">45–50 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-compare\">3. Compare mechanisms across the cases\u003c/h3>\n            \u003cp>Put the cases into one matrix to separate route selection, premature causal confidence, and competing review criteria.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">50–59 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-transfer\">4. Analyze \u003ccode>tdd\u003c/code> without a walkthrough\u003c/h3>\n            \u003cp>Use question-by-question navigation to classify its shape, inspect its trigger, place its information, and propose a behavior test.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">59–65 min\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-ledger\">5. Revise the borrowing ledger\u003c/h3>\n            \u003cp>Decide what to adopt, adapt, or reject from each case now that the earlier theory has been made concrete.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"case-files\">Concrete case files\u003c/h2>\n      \u003cp>We will work from a deliberately small sample whose contrasts reveal the design better than an exhaustive catalog.\u003c/p>\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/ask-matt/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>Session 3’s router case: a deliberately human-invoked map that orients and hands off without performing downstream work.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/diagnosing-bugs/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>Session 3’s gated-discipline case: no causal theory before a tight, red-capable feedback loop exists.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/code-review/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>Session 3’s parallel-review case: standards and specification fidelity remain independent so one success cannot mask the other’s failure.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/grill-with-docs/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>A tiny user-invoked composition: metadata plus one instruction to combine \u003ccode>grilling\u003c/code> with \u003ccode>domain-modeling\u003c/code>. Useful for studying orchestration and dependency visibility.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/productivity/grilling/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>A reusable interaction primitive built around a decision tree, a changing “frontier,” explicit rounds, and a stopping condition.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/tdd/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>A discipline expressed as reference plus hard gates: agree testing seams, then run vertical red → green slices while excluding several attractive failure modes.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/productivity/writing-for-agents/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>The repository’s own theory of instruction design: context pointers, two kinds of load, information hierarchy, leading words, completion criteria, and pruning.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"critique-compass\">Your critique compass\u003c/h2>\n      \u003cp>Change lenses while reading. The same design can look elegant under one lens and fragile under another.\u003c/p>\n      \u003cdiv class=\"lens\">\n        \u003cdiv class=\"lens-controls\" role=\"group\" aria-label=\"Choose a critique lens\">\n          \u003cbutton type=\"button\" data-lens=\"architecture\" aria-pressed=\"true\">Architecture\u003c/button>\n          \u003cbutton type=\"button\" data-lens=\"instruction\">Instruction design\u003c/button>\n          \u003cbutton type=\"button\" data-lens=\"evidence\">Evidence\u003c/button>\n        \u003c/div>\n        \u003cp id=\"lens-note\" aria-live=\"polite\">Ask where the seam lies. Does each skill hide substantial behavior behind a small interface, or merely move complexity into implicit dependencies?\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"method\">How we will reason\u003c/h2>\n      \u003cp>Each claim will carry one of three labels:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cstrong>Author claim\u003c/strong> — stated in the repository.\u003c/li>\n        \u003cli>\u003cstrong>Repository observation\u003c/strong> — visible in actual files and relationships.\u003c/li>\n        \u003cli>\u003cstrong>Our inference\u003c/strong> — an interpretation that must survive counterexamples.\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"principle\">The aim is neither admiration nor dismissal. It is to make the design legible enough that disagreement becomes precise.\u003c/p>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"scope\">Scope and assumptions\u003c/h2>\n      \u003cul>\n        \u003cli>You already know the mechanics of \u003ccode>SKILL.md\u003c/code>, \u003ccode>AGENTS.md\u003c/code>, and \u003ccode>CLAUDE.md\u003c/code>; we will not spend time on introductory syntax.\u003c/li>\n        \u003cli>We will use the local clone at \u003ccode>/Users/zhenghe/Workspace/github.com/mattpocock/skills\u003c/code> as the working corpus when the lesson is generated.\u003c/li>\n        \u003cli>We will map every current skill at a glance, but we will not attempt to close-read every file, installation path, or tool integration.\u003c/li>\n        \u003cli>Session 2 produces a compact skill draft and test plan; Session 3 pressure-tests that method against real case files. Installing or maintaining a full skill library remains outside this course.\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"source-note\">Primary reference: \u003ca href=\"https://github.com/mattpocock/skills\">mattpocock/skills\u003c/a>. The sessions favor checked-in source over summaries and note when the local clone differs from the public main branch.\u003c/p>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const lensNotes = {\n      architecture: \"Ask where the seam lies. Does each skill hide substantial behavior behind a small interface, or merely move complexity into implicit dependencies?\",\n      instruction: \"Ask what wording changes behavior. Which triggers, leading words, gates, and completion criteria reduce variance—and which sentences might be no-ops?\",\n      evidence: \"Ask how we know. Is a principle supported by repository structure, repeated outcomes, or only a persuasive explanation? What experiment could falsify it?\"\n    };\n\n    const lensButtons = document.querySelectorAll(\"[data-lens]\");\n    const lensNote = document.querySelector(\"#lens-note\");\n\n    function selectLens(selectedButton) {\n      lensButtons.forEach((button) => {\n        button.setAttribute(\"aria-pressed\", String(button === selectedButton));\n      });\n      lensNote.textContent = lensNotes[selectedButton.dataset.lens];\n    }\n\n    lensButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => selectLens(button));\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"syllabus.zh-CN.html","basePath":"syllabus.html","lang":"zh-CN","kind":"syllabus","title":"课程大纲","translations":{"en":"syllabus.html","zh-CN":"syllabus.zh-CN.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"syllabus\">\n  \u003cmeta name=\"course-page-title\" content=\"课程大纲\">\n  \u003ctitle>MattPocock Skills 课程大纲\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-soft: #ead8ca;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.72);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 32rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      line-height: 1.67;\n    }\n\n    main {\n      width: min(100% - 3rem, 112ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    html[data-studio-width=\"standard\"] main {\n      width: min(100% - 3rem, 88ch);\n    }\n\n    html[data-studio-width=\"wide\"] main {\n      width: min(100% - 3rem, 112ch);\n    }\n\n    html[data-studio-width=\"full\"] main {\n      width: calc(100% - 3rem);\n      max-width: none;\n    }\n\n    header { margin-bottom: 3.5rem; }\n\n    .eyebrow,\n    .meta,\n    .duration,\n    button,\n    code {\n      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    .eyebrow {\n      margin: 0 0 0.8rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3 { line-height: 1.18; }\n\n    h1 {\n      max-width: 11ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.4rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    .lede {\n      max-width: 54ch;\n      margin: 1.6rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta {\n      color: var(--muted);\n      font-size: 0.82rem;\n    }\n\n    section { margin-top: 3.75rem; }\n\n    h2 {\n      margin: 0 0 1rem;\n      font-size: 1.75rem;\n      font-weight: 500;\n      letter-spacing: -0.02em;\n    }\n\n    h3 {\n      margin: 0 0 0.45rem;\n      font-size: 1.14rem;\n    }\n\n    p { margin: 0.75rem 0; }\n\n    ul { padding-left: 1.25rem; }\n\n    li + li { margin-top: 0.45rem; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.85em;\n    }\n\n    .promise {\n      padding: 1.35rem 1.5rem;\n      border-left: 3px solid var(--accent);\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .course-path {\n      margin-top: 1.5rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .session-heading {\n      padding: 1.35rem 0 0.45rem;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .session-heading .duration {\n      display: block;\n      margin-bottom: 0.35rem;\n    }\n\n    .session-heading h3 { margin-bottom: 0.35rem; }\n\n    .session-heading p {\n      margin: 0;\n      color: var(--muted);\n      font-size: 0.94rem;\n    }\n\n    .module {\n      display: grid;\n      grid-template-columns: 5.5rem 1fr;\n      gap: 1.2rem;\n      padding: 1.55rem 0;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .duration {\n      padding-top: 0.15rem;\n      color: var(--accent);\n      font-size: 0.76rem;\n    }\n\n    .module p { margin: 0; color: #595249; }\n\n    .examples {\n      display: grid;\n      gap: 0.75rem;\n      margin-top: 1.2rem;\n    }\n\n    .example {\n      padding: 1rem 1.1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      background: var(--card);\n    }\n\n    .example strong { display: block; margin-bottom: 0.25rem; }\n\n    .example p { margin: 0; color: var(--muted); font-size: 0.94rem; }\n\n    .lens {\n      padding: 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: 0.55rem;\n      background: rgba(255, 253, 248, 0.55);\n    }\n\n    .lens-controls {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.55rem;\n      margin: 1rem 0;\n    }\n\n    button {\n      padding: 0.55rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--ink);\n      background: transparent;\n      cursor: pointer;\n      font-size: 0.76rem;\n    }\n\n    button:hover,\n    button:focus-visible,\n    button[aria-pressed=\"true\"] {\n      border-color: var(--accent);\n      outline: none;\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    #lens-note {\n      min-height: 4.9rem;\n      margin: 0;\n      color: #514a42;\n    }\n\n    .principle {\n      color: var(--accent);\n      font-style: italic;\n    }\n\n    .source-note {\n      margin-top: 1.4rem;\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    @media (max-width: 560px) {\n      main { padding-top: 3rem; }\n      .module { grid-template-columns: 1fr; gap: 0.3rem; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">架构批判与设计实战工作坊\u003c/p>\n      \u003ch1 id=\"course-title\">MattPocock Skills\u003c/h1>\n      \u003cp class=\"lede\">深入剖析 Matt Pocock 如何将软件工程经验转化为面向 Coding Agent 的小巧、可组合指令，并通过动手实战设计并测试你的专属 Skill。\u003c/p>\n      \u003cp class=\"meta\">约 3 小时 20 分钟 · 3 节核心课程 · 真实代码库案例驱动\u003c/p>\n    \u003c/header>\n\n    \u003csection>\n      \u003ch2 id=\"course-thesis\">课程主旨\u003c/h2>\n      \u003cdiv class=\"promise\">\n        \u003cp>本课程不做无意义的逐文件罗列。我们首先宏观梳理全部 Skill 的全景图，再从精选案例中逆向重构其背后的系统：Skill 如何被触发、职责如何切分、指令如何约束 Agent 的行为发散，以及多个 Skill 如何组合成完整工作流。\u003c/p>\n        \u003cp>随后，我们将立足其设计理念进行批判性审视，并将核心精华付诸实践：哪些设计真正稳健？哪些只是被包装成通用原则的个人习惯？用这套方法设计和测试一个 Skill 时会发生什么？\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"outcomes\">完成课程后你将能够\u003c/h2>\n      \u003cul>\n        \u003cli>将整个 Skill 库梳理为“从构思到交付”的主工作流，清晰拆解接入路径、日常维护、底层词汇、独立支持与初始化配置，并按业务领域与触发方式进行二维归类。\u003c/li>\n        \u003cli>熟练辨识四种 Skill 形态：路由型（Router）、编排型（Orchestrator）、实践规范型（Discipline）与参考指南型（Reference）。\u003c/li>\n        \u003cli>能从触发条件、执行步骤、验收完成标准（Done Criteria）、渐进式上下文及事实来源等维度，深度解析一份 \u003ccode>SKILL.md\u003c/code>。\u003c/li>\n        \u003cli>清晰区分作者显式主张、代码库客观模式与合理逻辑推断三者的界限。\u003c/li>\n        \u003cli>运用极简决策看板，理性判断哪些设计值得直接吸收、改良复用或果断舍弃。\u003c/li>\n        \u003cli>从真实、可复现的 Agent 失效场景出发设计 Skill，精准把控调用权归属与信息分层。\u003c/li>\n        \u003cli>通过触发测试、反事实测试与对抗边界测试，验证指令是否切实改变了 Agent 的行为模式。\u003c/li>\n        \u003cli>摆脱对模板套路的依赖，具备独立剖析任意未知 Skill 架构设计的能力。\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"course-path\">三课学习路径\u003c/h2>\n      \u003cdiv class=\"course-path\">\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">第 1 课 · 75 分钟\u003c/span>\n          \u003ch3 id=\"session-one\">看透文件背后的架构设计\u003c/h3>\n          \u003cp>逆向重构系统架构，对比不同 Skill 形态，并在借鉴前对设计哲学进行压力测试。\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–12 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-map\">1. 读代码前先画系统全景图\u003c/h3>\n            \u003cp>剖析代码库的架构分层：\u003ccode>engineering\u003c/code> 与 \u003ccode>productivity\u003c/code> 划分、用户手动触发与模型自动触发的边界、初始化与分发层，以及“编排器只调用规范、编排器不嵌套编排器”的设计准则。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">12–32 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-shapes\">2. 对比四种截然不同的 Skill 形态\u003c/h3>\n            \u003cp>并排研读 6 行微型组合、闭环执行流程与高密度参考手册。核心不在于“哪种格式正确”，而是“什么样的职责决定了什么样的形态”。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">32–52 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-drafting\">3. 逆向拆解编写方法论\u003c/h3>\n            \u003cp>探究作为上下文指针的触发描述、作为信息层级的渐进式披露 (Progressive Disclosure)、控制行为发散的完成标准、压缩复杂意图的引导动词，以及防止 Prompt 冗余沉积的精简机制。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">52–68 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-critique\">4. 对设计理念进行压力测试\u003c/h3>\n            \u003cp>审视可组合性与隐式耦合、人类把控与流程仪式化、核心词汇与内部黑话、模型通用声明与特定模型表现、理论自信与实证证据之间的博弈。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">68–75 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-one-ledger\">5. 沉淀取舍决策账本\u003c/h3>\n            \u003cp>将设计模式归类为\u003cem>直接吸收\u003c/em>、\u003cem>改造借鉴\u003c/em>与\u003cem>暂不采纳\u003c/em>，逐项注明理由与验证方法，为后续设计高质量 Skill 奠定基础。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">第 2 课 · 60 分钟\u003c/span>\n          \u003ch3 id=\"session-two\">设计真正值得占用上下文的 Skill\u003c/h3>\n          \u003cp>将第 1 课的批判思考落地为实战产物：一份精练的 Skill 草案与行为验证计划。\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–10 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-failure\">1. 从真实失效切入，而非套用模板\u003c/h3>\n            \u003cp>锁定一个可观察的重复失败场景，提取背后通用的工程判断，区分能切实约束行为的指令与善意但无效的空话 (No-op)。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">10–22 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-pointer\">2. 先写上下文指针，再写正文内容\u003c/h3>\n            \u003cp>明确调用权归属，编写精准的触发描述，清晰界定触发条件与需要加载的具体分支。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">22–38 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-placement\">3. 克制且精准地放置信息\u003c/h3>\n            \u003cp>将通用步骤、分支专用参考、环境事实来源与冗余套话各归其位，放在开销最低、最贴近事实的信息层。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">38–50 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-draft\">4. 构建微型闭环控制流\u003c/h3>\n            \u003cp>围绕四大核心决策现场编写 \u003ccode>SKILL.md\u003c/code>：命名、触发指针、核心行为逻辑与可量化、高标准的完成验收标准。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">50–60 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-two-test\">5. 测试真实行为，而非语言修辞\u003c/h3>\n            \u003cp>设计触发测试、反事实测试、对抗边界测试与证据检验，确保每一行指令都真正配得上它所消耗的上下文窗口。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"session-heading\">\n          \u003cspan class=\"duration\">第 3 课 · 65 分钟\u003c/span>\n          \u003ch3 id=\"session-three\">实战案例研究：看设计如何在实战中运转\u003c/h3>\n          \u003cp>以 \u003ccode>ask-matt\u003c/code> 全局图谱定位认知，用统一视角横向对比三份风格各异的 Skill，最后将方法论独立迁移到全新文件。\u003c/p>\n        \u003c/div>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">0–15 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-protocol\">1. 纵览全局架构，建立阅读范式\u003c/h3>\n            \u003cp>依托五步分析法，通过基于 \u003ccode>ask-matt\u003c/code> 还原的交互地图，全景俯瞰全部 25 个 Skill（涵盖主流程、接入、维护、词汇及独立支持）。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">15–45 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-cases\">2. 深入研读三个差异化典型案例\u003c/h3>\n            \u003cp>横向对比人工触发路由型的 \u003ccode>ask-matt\u003c/code>、严格门禁式诊断规范的 \u003ccode>diagnosing-bugs\u003c/code>，以及双轴并行评审的 \u003ccode>code-review\u003c/code>。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">45–50 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-compare\">3. 横向对比各案例背后的运行机制\u003c/h3>\n            \u003cp>构建对比矩阵，清晰厘清路由决策、过早因果假设与互斥评审标准之间的机制差异。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">50–59 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-transfer\">4. 脱离指导，独立逆向分析 \u003ccode>tdd\u003c/code>\u003c/h3>\n            \u003cp>采用结构化问答逐步拆解，完成对其形态归类、触发词审查、信息分层及行为测试设计。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"module\">\n          \u003cdiv class=\"duration\">59–65 分钟\u003c/div>\n          \u003cdiv>\n            \u003ch3 id=\"session-three-ledger\">5. 完善取舍决策账本\u003c/h3>\n            \u003cp>结合实际案例印证前期理论，最终确定在实际工程中吸收、改良或舍弃哪些具体做法。\u003c/p>\n          \u003c/div>\n        \u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"case-files\">具体案例文件\u003c/h2>\n      \u003cp>我们将从精心挑选的精简样本出发，这些对比强烈的案例能比泛泛浏览整个目录更清晰地呈现设计本质。\u003c/p>\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/ask-matt/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>第 3 课路由型案例：刻意设计为人工触发的导航地图，专职负责引导分流与任务交接，不直接执行具体下游工作。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/diagnosing-bugs/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>第 3 课门禁规范型案例：在构建出紧凑、可稳定复现失败（Red）的反馈闭环之前，严禁擅自建立因果推断。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/code-review/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>第 3 课并行评审型案例：代码规范与需求规格两套标准独立审查，避免单维度的达标掩盖另一维度的缺陷。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/grill-with-docs/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>微型人工触发编排案例：元数据加上一行组合指令，联动 \u003ccode>grilling\u003c/code> 与 \u003ccode>domain-modeling\u003c/code>，是研究多 Skill 编排与依赖透明度的极佳样本。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/productivity/grilling/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>可复用的交互原语：基于决策树、动态决策前沿（Frontier）、严谨对话轮次与明确终止条件构建的极限质询机制。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/engineering/tdd/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>规则与硬门禁并存的规范：先对齐测试切入点（Seam），再执行纵向红→绿切片迭代，同时严格杜绝常见的伪 TDD 陷阱。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"example\">\n          \u003cstrong>\u003ccode>skills/productivity/writing-for-agents/SKILL.md\u003c/code>\u003c/strong>\n          \u003cp>该代码库自身的指令设计方法论：上下文指针、两类加载模式、信息分层、引导动词、完成标准与冗余修剪。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"critique-compass\">批判分析指南\u003c/h2>\n      \u003cp>阅读代码时请主动切换视角：同一种设计在某一视角下可能显得极为精妙，换一个视角则可能暴露出脆弱性。\u003c/p>\n      \u003cdiv class=\"lens\">\n        \u003cdiv class=\"lens-controls\" role=\"group\" aria-label=\"选择一种批评视角\">\n          \u003cbutton type=\"button\" data-lens=\"architecture\" aria-pressed=\"true\">架构视角\u003c/button>\n          \u003cbutton type=\"button\" data-lens=\"instruction\">指令设计视角\u003c/button>\n          \u003cbutton type=\"button\" data-lens=\"evidence\">证据与验证视角\u003c/button>\n        \u003c/div>\n        \u003cp id=\"lens-note\" aria-live=\"polite\">重点审视解耦点（Seam）位于何处。每个 Skill 是在简洁接口后封装了大量确定性行为，还是仅仅将复杂度转移到了隐式依赖中？\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"method\">我们的分析准则\u003c/h2>\n      \u003cp>课程中的每一个观点都会打上以下三种标签之一：\u003c/p>\n      \u003cul>\n        \u003cli>\u003cstrong>作者主张\u003c/strong> — 在代码库文档中明确表述的观点。\u003c/li>\n        \u003cli>\u003cstrong>客观观察\u003c/strong> — 在实际文件结构与关联中清晰可见的事实。\u003c/li>\n        \u003cli>\u003cstrong>我们的推断\u003c/strong> — 经过严密逻辑推导、需经受反例检验的解释。\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"principle\">目的既非盲目赞同，也非全盘否定，而是将设计机理剖析得足够透彻，让分歧与权衡有据可依。\u003c/p>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"scope\">前提与范围\u003c/h2>\n      \u003cul>\n        \u003cli>假定你已熟悉 \u003ccode>SKILL.md\u003c/code>、\u003ccode>AGENTS.md\u003c/code> 与 \u003ccode>CLAUDE.md\u003c/code> 的基本机制；课程不会在入门语法上浪费时间。\u003c/li>\n        \u003cli>在课程中，我们将以本地克隆的 \u003ccode>/Users/zhenghe/Workspace/github.com/mattpocock/skills\u003c/code> 代码库作为工作素材。\u003c/li>\n        \u003cli>我们将对当前所有 Skill 进行全局鸟瞰，但不会对每个文件、安装路径或工具集成做逐字通读。\u003c/li>\n        \u003cli>第 2 课产出精练的 Skill 草案与测试方案；第 3 课在真实案例中验证该方法。完整 Skill 库的部署与日常维护不属于本课程范畴。\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"source-note\">主要参考：\u003ca href=\"https://github.com/mattpocock/skills\">mattpocock/skills\u003c/a>。课程更偏向于直接阅读已入库的源代码而非二手摘要，并会标明本地克隆与主分支的差异。\u003c/p>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const lensNotes = {\n      architecture: \"重点审视解耦点（Seam）位于何处。每个 Skill 是在简洁接口后封装了大量确定性行为，还是仅仅将复杂度转移到了隐式依赖中？\",\n      instruction: \"关注哪些措辞能实质性改变 Agent 行为。哪些触发词、引导动词、门禁条件和验收标准能有效降低输出发散度——哪些句子只是无效空话？\",\n      evidence: \"追问结论从何而来。某项原则是来自代码库架构、可复现的运行结果，还是仅仅是一套看似合理的理论说辞？可以用什么实验来证伪它？\"\n    };\n\n    const lensButtons = document.querySelectorAll(\"[data-lens]\");\n    const lensNote = document.querySelector(\"#lens-note\");\n\n    function selectLens(selectedButton) {\n      lensButtons.forEach((button) => {\n        button.setAttribute(\"aria-pressed\", String(button === selectedButton));\n      });\n      lensNote.textContent = lensNotes[selectedButton.dataset.lens];\n    }\n\n    lensButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => selectLens(button));\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session1.html","basePath":"session1.html","lang":"en","kind":"lesson","title":"Reading a Skill System","translations":{"en":"session1.html","zh-CN":"session1.zh-CN.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Reading a Skill System\">\n  \u003ctitle>Reading a Skill System — MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.8);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 10;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 3px;\n      background: rgba(138, 78, 53, 0.12);\n    }\n\n    .progress-bar {\n      width: 0;\n      height: 100%;\n      background: var(--accent);\n      transition: width 120ms linear;\n    }\n\n    main {\n      width: min(100% - 3rem, 112ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    html[data-studio-width=\"standard\"] main {\n      width: min(100% - 3rem, 88ch);\n    }\n\n    html[data-studio-width=\"wide\"] main {\n      width: min(100% - 3rem, 112ch);\n    }\n\n    html[data-studio-width=\"full\"] main {\n      width: calc(100% - 3rem);\n      max-width: none;\n    }\n\n    header { margin-bottom: 4rem; }\n\n    .eyebrow,\n    .meta,\n    .label,\n    .time,\n    button,\n    code,\n    .path,\n    .tag,\n    .meter-label {\n      font-family: var(--mono);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.9rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3, h4 { line-height: 1.18; }\n\n    h1 {\n      max-width: 12ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.3rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h2 {\n      margin: 0 0 1.1rem;\n      font-size: clamp(1.85rem, 5vw, 2.35rem);\n      font-weight: 500;\n      letter-spacing: -0.028em;\n    }\n\n    h3 {\n      margin: 2rem 0 0.65rem;\n      font-size: 1.3rem;\n    }\n\n    h4 {\n      margin: 0 0 0.45rem;\n      font-size: 1.05rem;\n    }\n\n    p { margin: 0.8rem 0; }\n\n    .lede {\n      max-width: 55ch;\n      margin: 1.55rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta { color: var(--muted); font-size: 0.82rem; }\n\n    section { margin-top: 5rem; scroll-margin-top: 2rem; }\n\n    ul, ol { padding-left: 1.3rem; }\n    li + li { margin-top: 0.5rem; }\n\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.84em;\n    }\n\n    .opening,\n    .callout,\n    .lab,\n    .case-reader,\n    .decision-panel,\n    .ledger {\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .opening {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.2rem;\n      margin-top: 2rem;\n      padding: 1.35rem;\n    }\n\n    .opening h2 {\n      margin-bottom: 0.65rem;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 800;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .opening p,\n    .opening ul { margin: 0; font-size: 0.94rem; }\n\n    .time {\n      display: inline-block;\n      margin-bottom: 0.65rem;\n      color: var(--accent);\n      font-size: 0.75rem;\n    }\n\n    .claim-strip {\n      margin: 1.5rem 0;\n      padding: 1.2rem 1.35rem;\n      border-left: 3px solid var(--accent);\n      background: rgba(255, 253, 248, 0.68);\n    }\n\n    .label {\n      display: block;\n      margin-bottom: 0.4rem;\n      color: var(--accent);\n      font-size: 0.73rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .claim-strip p { margin: 0; }\n\n    .system-map {\n      margin: 2rem 0;\n      padding: 1.25rem;\n      border: 1px solid var(--line);\n      border-radius: 0.6rem;\n      background: rgba(255, 253, 248, 0.52);\n    }\n\n    .axis-labels,\n    .quadrants {\n      display: grid;\n      grid-template-columns: 8rem 1fr 1fr;\n      gap: 0.7rem;\n    }\n\n    .axis-labels { margin-bottom: 0.7rem; }\n\n    .axis-labels span,\n    .row-label {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n    }\n\n    .axis-labels span { text-align: center; }\n\n    .quadrants { align-items: stretch; }\n\n    .row-label {\n      display: flex;\n      align-items: center;\n      justify-content: flex-end;\n      padding-right: 0.35rem;\n      text-align: right;\n    }\n\n    .quadrant {\n      min-height: 7rem;\n      padding: 0.85rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      background: #fbf8f1;\n    }\n\n    .quadrant strong {\n      display: block;\n      margin-bottom: 0.35rem;\n      font-family: var(--sans);\n      font-size: 0.83rem;\n    }\n\n    .quadrant span {\n      display: block;\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.69rem;\n      line-height: 1.5;\n    }\n\n    .invocation-chain {\n      display: grid;\n      grid-template-columns: 1fr auto 1fr auto 1fr;\n      gap: 0.55rem;\n      align-items: center;\n      margin: 1.4rem 0;\n    }\n\n    .invocation-node {\n      min-height: 5.3r
