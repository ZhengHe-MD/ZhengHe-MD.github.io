a(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 20;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 3px;\n      background: rgba(138, 78, 53, 0.12);\n    }\n\n    .progress-bar {\n      width: 0;\n      height: 100%;\n      background: var(--accent);\n      transition: width 120ms linear;\n    }\n\n    main {\n      width: min(100% - 3rem, 88ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    header { margin-bottom: 4rem; }\n    section { margin-top: 5rem; scroll-margin-top: 2rem; }\n\n    .eyebrow,\n    .meta,\n    .label,\n    .time,\n    button,\n    code,\n    pre,\n    .case-index,\n    .case-type,\n    .step-pill,\n    .term {\n      font-family: var(--mono);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.9rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3, h4 { line-height: 1.18; }\n\n    h1 {\n      max-width: 12ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.3rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h2 {\n      margin: 0 0 1.1rem;\n      font-size: clamp(1.85rem, 5vw, 2.35rem);\n      font-weight: 500;\n      letter-spacing: -0.028em;\n    }\n\n    h3 { margin: 1.8rem 0 0.65rem; font-size: 1.3rem; }\n    h4 { margin: 0 0 0.45rem; font-size: 1.02rem; }\n    p { margin: 0.8rem 0; }\n    ul, ol { padding-left: 1.3rem; }\n    li + li { margin-top: 0.48rem; }\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.84em;\n    }\n\n    pre {\n      overflow-x: auto;\n      margin: 0;\n      padding: 1rem;\n      border-radius: 0.48rem;\n      color: #f9f2e7;\n      background: #302b25;\n      font-size: 0.78rem;\n      line-height: 1.55;\n      white-space: pre-wrap;\n    }\n\n    pre code { padding: 0; color: inherit; background: transparent; }\n\n    .lede {\n      max-width: 55ch;\n      margin: 1.55rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta { color: var(--muted); font-size: 0.82rem; }\n    .time { display: inline-block; margin-bottom: 0.65rem; color: var(--accent); font-size: 0.75rem; }\n\n    .label {\n      display: block;\n      margin-bottom: 0.4rem;\n      color: var(--accent);\n      font-size: 0.73rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .opening,\n    .protocol-card,\n    .case-workbench,\n    .callout,\n    .lab,\n    .ledger,\n    .field-note {\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .opening {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.2rem;\n      margin-top: 2rem;\n      padding: 1.35rem;\n    }\n\n    .opening h2 {\n      margin-bottom: 0.65rem;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 800;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .opening p { margin: 0; font-size: 0.94rem; }\n\n    .protocol-card { padding: 1.35rem; }\n\n    .trace {\n      display: grid;\n      grid-template-columns: repeat(5, 1fr);\n      gap: 0.6rem;\n      margin-top: 1.2rem;\n    }\n\n    .trace-step {\n      position: relative;\n      min-height: 8.2rem;\n      padding: 0.9rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: rgba(255, 253, 248, 0.66);\n    }\n\n    .trace-step:not(:last-child)::after {\n      position: absolute;\n      z-index: 2;\n      top: 1.1rem;\n      right: -0.53rem;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n    }\n\n    .trace-step strong {\n      display: block;\n      font-family: var(--sans);\n      font-size: 0.86rem;\n    }\n\n    .trace-step span { display: block; margin-top: 0.35rem; color: var(--muted); font-size: 0.8rem; line-height: 1.45; }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      font-size: 0.9em;\n    }\n\n    .term::after,\n    .choice[data-tip]::after {\n      position: absolute;\n      z-index: 30;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(21rem, 80vw);\n      padding: 0.7rem 0.8rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-tip);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .term:hover::after,\n    .term:focus-visible::after,\n    .choice[data-tip]:hover::after,\n    .choice[data-tip]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .case-workbench { overflow: hidden; }\n\n    .case-tabs {\n      display: flex;\n      gap: 0.5rem;\n      overflow-x: auto;\n      padding: 1rem 1.1rem;\n      border-bottom: 1px solid var(--line);\n      background: rgba(238, 229, 214, 0.55);\n    }\n\n    button {\n      padding: 0.56rem 0.78rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--ink);\n      background: rgba(255, 253, 248, 0.76);\n      cursor: pointer;\n      font-size: 0.75rem;\n    }\n\n    button:hover,\n    button:focus-visible {\n      border-color: var(--accent);\n      outline: none;\n    }\n\n    button[aria-selected=\"true\"],\n    button[aria-pressed=\"true\"],\n    .primary-button {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    button:disabled { cursor: not-allowed; opacity: 0.45; }\n\n    .case-tab {\n      flex: 0 0 auto;\n      border-radius: 0.45rem;\n      text-align: left;\n    }\n\n    .case-tab span { display: block; color: inherit; font-size: 0.64rem; opacity: 0.75; }\n    .case-tab strong { display: block; margin-top: 0.12rem; font-size: 0.78rem; }\n\n    .case-panel { padding: 1.5rem; }\n    .case-panel[hidden] { display: none; }\n\n    .case-heading {\n      display: grid;\n      grid-template-columns: auto 1fr;\n      gap: 1rem;\n      align-items: start;\n      margin-bottom: 1.3rem;\n    }\n\n    .case-index {\n      display: grid;\n      width: 3.2rem;\n      height: 3.2rem;\n      border-radius: 50%;\n      place-items: center;\n      color: #fffaf1;\n      background: var(--accent);\n      font-size: 0.76rem;\n    }\n\n    .case-type { margin: 0 0 0.2rem; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; }\n    .case-heading h3 { margin: 0; font-size: 1.65rem; }\n    .case-heading p:last-child { margin: 0.35rem 0 0; color: var(--muted); }\n\n    .causal-strip {\n      display: grid;\n      grid-template-columns: 1fr auto 1fr auto 1fr;\n      align-items: stretch;\n      gap: 0.55rem;\n      margin: 1.3rem 0;\n    }\n\n    .causal-box {\n      padding: 0.9rem;\n      border: 1px solid var(--line);\n      border-radius: 0.48rem;\n      background: rgba(255, 253, 248, 0.7);\n    }\n\n    .causal-box strong { display: block; font-family: var(--sans); font-size: 0.84rem; }\n    .causal-box span { display: block; margin-top: 0.3rem; color: var(--muted); font-size: 0.8rem; line-height: 1.45; }\n    .causal-arrow { align-self: center; color: var(--accent); font-family: var(--mono); }\n\n    .case-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1rem;\n      margin: 1.3rem 0;\n    }\n\n    .case-note {\n      padding: 1rem;\n      border-radius: 0.5rem;\n      background: var(--paper-deep);\n    }\n\n    .case-note h4 { font-family: var(--sans); }\n    .case-note p, .case-note ul { margin-bottom: 0; font-size: 0.9rem; }\n\n    .profile-table {\n      width: 100%;\n      margin: 1.2rem 0;\n      border-collapse: collapse;\n      font-size: 0.9rem;\n    }\n\n    .profile-table th,\n    .profile-table td {\n      padding: 0.7rem 0.75rem;\n      border-bottom: 1px solid var(--line);\n      text-align: left;\n      vertical-align: top;\n    }\n\n    .profile-table th {\n      width: 9.5rem;\n      color: var(--muted);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      letter-spacing: 0.04em;\n      text-transform: uppercase;\n    }\n\n    .lens-box {\n      margin-top: 1.3rem;\n      padding: 1rem;\n      border: 1px dashed var(--line);\n      border-radius: 0.55rem;\n      background: rgba(255, 253, 248, 0.58);\n    }\n\n    .lens-controls { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.7rem 0; }\n    .lens-output { min-height: 5.4rem; margin: 0; color: #514a42; }\n\n    .case-actions,\n    .quiz-actions,\n    .ledger-footer {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.8rem;\n      margin-top: 1.3rem;\n      padding-top: 1rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .case-status, .lab-count, .ledger-summary {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n    }\n\n    .callout, .field-note { margin: 1.5rem 0; padding: 1.25rem 1.35rem; }\n    .callout.sage { border-left: 4px solid var(--sage); }\n    .callout.blue { border-left: 4px solid var(--blue); }\n    .callout.gold { border-left: 4px solid var(--gold); }\n    .callout p:last-child, .field-note p:last-child { margin-bottom: 0; }\n\n    .matrix {\n      display: grid;\n      grid-template-columns: 1.05fr repeat(3, 1fr);\n      margin-top: 1.5rem;\n      border-top: 1px solid var(--line);\n      border-left: 1px solid var(--line);\n      font-size: 0.84rem;\n    }\n\n    .matrix > div {\n      min-height: 4.7rem;\n      padding: 0.75rem;\n      border-right: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.58);\n    }\n\n    .matrix .matrix-head {\n      min-height: auto;\n      color: #fffaf1;\n      background: var(--accent);\n      font-family: var(--sans);\n      font-weight: 700;\n    }\n\n    .matrix .row-head {\n      color: var(--muted);\n      background: var(--paper-deep);\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 700;\n      text-transform: uppercase;\n    }\n\n    .lab { padding: 1.35rem; }\n\n    .lab-header {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1rem;\n    }\n\n    .lab-header h3 { margin: 0; }\n\n    .step-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.1rem;\n      padding-bottom: 0.8rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .step-pill { padding: 0.35rem 0.68rem; color: var(--muted); font-size: 0.69rem; }\n    .step-pill.active { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); font-weight: 700; }\n    .step-pill.correct { border-color: var(--sage); color: #384937; background: var(--sage-soft); }\n    .step-pill.answered { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n\n    .quiz-kicker { margin: 0; color: var(--accent); font-family: var(--mono); font-size: 0.76rem; }\n    .quiz-prompt { margin: 0.55rem 0 0; font-size: 1.12rem; }\n\n    .choice-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.65rem;\n      margin-top: 1rem;\n    }\n\n    .choice {\n      position: relative;\n      min-height: 4.2rem;\n      border-radius: 0.5rem;\n      font-family: var(--sans);\n      font-size: 0.88rem;\n      line-height: 1.4;\n      text-align: left;\n    }\n\n    .choice.selected { border-color: var(--blue); background: var(--blue-soft); }\n    .choice.correct-answer { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n\n    .feedback {\n      display: none;\n      margin-top: 1rem;\n      padding: 0.9rem 1rem;\n      border-radius: 0.45rem;\n      font-size: 0.9rem;\n    }\n\n    .feedback.visible { display: block; }\n    .feedback.correct { color: #30452f; background: var(--sage-soft); }\n    .feedback.retry { color: #67451a; background: var(--gold-soft); }\n    .quiz-action-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }\n\n    .ledger { overflow: hidden; }\n\n    .ledger-item {\n      display: grid;\n      grid-template-columns: 1.3fr 1fr;\n      gap: 1rem;\n      align-items: center;\n      padding: 1.15rem 1.3rem;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .ledger-item h3 { margin: 0 0 0.3rem; font-size: 1.08rem; }\n    .ledger-item p { margin: 0; color: var(--muted); font-size: 0.88rem; }\n    .ledger-choices { display: flex; justify-content: flex-end; gap: 0.4rem; }\n    .ledger-choice[data-decision=\"adopt\"][aria-pressed=\"true\"] { border-color: var(--sage); color: #30452f; background: var(--sage-soft); }\n    .ledger-choice[data-decision=\"adapt\"][aria-pressed=\"true\"] { border-color: var(--gold); color: #67451a; background: var(--gold-soft); }\n    .ledger-choice[data-decision=\"reject\"][aria-pressed=\"true\"] { border-color: var(--blue); color: #334856; background: var(--blue-soft); }\n    .ledger-footer { margin: 0; padding: 1rem 1.3rem; border-top: 0; }\n\n    .source-note { color: var(--muted); font-size: 0.88rem; }\n\n    @media (max-width: 820px) {\n      .trace { grid-template-columns: 1fr 1fr; }\n      .trace-step::after { display: none; }\n      .matrix { grid-template-columns: 8rem repeat(3, minmax(11rem, 1fr)); overflow-x: auto; }\n      .matrix-wrap { overflow-x: auto; }\n    }\n\n    @media (max-width: 650px) {\n      main { padding-top: 3rem; }\n      .opening, .case-grid, .choice-grid { grid-template-columns: 1fr; }\n      .trace { grid-template-columns: 1fr; }\n      .causal-strip { grid-template-columns: 1fr; }\n      .causal-arrow { justify-self: center; transform: rotate(90deg); }\n      .case-heading { grid-template-columns: 1fr; }\n      .case-actions, .quiz-actions, .ledger-footer { align-items: flex-start; flex-direction: column; }\n      .ledger-item { grid-template-columns: 1fr; }\n      .ledger-choices { justify-content: flex-start; }\n      .profile-table th { width: 7.5rem; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Session 3 · Case-study studio\u003c/p>\n      \u003ch1 id=\"session-title\">Watch the design work\u003c/h1>\n      \u003cp class=\"lede\">The first session gave you a map. The second gave you a design loop. Now three real skills must make those ideas visible—or expose where the theory does not quite explain the file.\u003c/p>\n      \u003cp class=\"meta\">55 minutes · three case files · one transfer lab · progress saved locally\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"carry-forward\">Carry forward\u003c/h2>\n          \u003cp>Do not ask whether a skill “looks good.” Trace what failure it prevents, who invokes it, where its knowledge lives, how it constrains behavior, and what would count as evidence.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"session-artifact\">Your artifact\u003c/h2>\n          \u003cp>You will leave with three completed traces and a revised borrowing ledger grounded in concrete files rather than abstract preference.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–7 minutes\u003c/span>\n      \u003ch2 id=\"reading-protocol\">1. Use one trace across every case\u003c/h2>\n      \u003cp>Surface formats mislead. A long file can be a tight discipline; a short file can hide a large dependency graph. Run the same five questions in the same order so the differences become comparable.\u003c/p>\n\n      \u003cdiv class=\"protocol-card\">\n        \u003cspan class=\"label\">The five-part trace\u003c/span>\n        \u003cdiv class=\"trace\">\n          \u003cdiv class=\"trace-step\">\u003cstrong>1 · Failure\u003c/strong>\u003cspan>What recurring mistake gives this skill a reason to exist?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>2 · Interface\u003c/strong>\u003cspan>What shape is it, and who owns invocation?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>3 · Placement\u003c/strong>\u003cspan>What is inline, disclosed, or recovered from the environment?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>4 · Control\u003c/strong>\u003cspan>What gate, loop, or separation changes the model’s default?\u003c/span>\u003c/div>\n          \u003cdiv class=\"trace-step\">\u003cstrong>5 · Evidence\u003c/strong>\u003cspan>What observation could show that the control worked?\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">How Sessions 1 and 2 meet\u003c/span>\n        \u003cp>Session 1 explains the \u003cem>interface\u003c/em>: shape, invocation, composition, and evidence labels. Session 2 explains the \u003cem>mechanism\u003c/em>: problem, pointer, information layer, control loop, and test. A case study is the full trace from one to the other.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">7–37 minutes\u003c/span>\n      \u003ch2 id=\"case-files\">2. Three skills, three control strategies\u003c/h2>\n      \u003cp>Move freely between the cases. Your current case and lens are restored when you return.\u003c/p>\n\n      \u003cdiv class=\"case-workbench\" id=\"case-workbench\">\n        \u003cdiv class=\"case-tabs\" role=\"tablist\" aria-label=\"Case studies\">\n          \u003cbutton class=\"case-tab\" id=\"case-tab-0\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-0\" data-case-index=\"0\">\u003cspan>Case 01 · Router\u003c/span>\u003cstrong>ask-matt\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-1\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-1\" data-case-index=\"1\">\u003cspan>Case 02 · Discipline\u003c/span>\u003cstrong>diagnosing-bugs\u003c/strong>\u003c/button>\n          \u003cbutton class=\"case-tab\" id=\"case-tab-2\" type=\"button\" role=\"tab\" aria-controls=\"case-panel-2\" data-case-index=\"2\">\u003cspan>Case 03 · Review\u003c/span>\u003cstrong>code-review\u003c/strong>\u003c/button>\n        \u003c/div>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-0\" role=\"tabpanel\" aria-labelledby=\"case-tab-0\" data-case-panel=\"0\">\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">01\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Human-invoked · router · map of flows\u003c/p>\n              \u003ch3 id=\"ask-matt-case\">\u003ccode>ask-matt\u003c/code>: useful because it does not do the work\u003c/h3>\n              \u003cp>Its interface is orientation. It turns “which skill, in what order?” into a named routing decision, then hands control away.\u003c/p>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"causal-strip\" aria-label=\"ask-matt causal trace\">\n            \u003cdiv class=\"causal-box\">\u003cstrong>Failure before\u003c/strong>\u003cspan>The human must remember every skill and choose a path from a growing catalog.\u003c/span>\u003c/div>\n            \u003cdiv class=\"causal-arrow\" aria-hidden=\"true\">→\u003c/div>\n            \u003cdiv class=\"causal-box\">\u003cstrong>Control lever\u003c/strong>\u003cspan>A user-invoked map separates main flow, on-ramps, vocabulary, and standalone tools.\u003c/span>\u003c/div>\n            \u003cdiv class=\"causal-arrow\" aria-hidden=\"true\">→\u003c/div>\n            \u003cdiv class=\"causal-box\">\u003cstrong>Observable after\u003c/strong>\u003cspan>The answer names one route and hands off; it does not quietly perform the downstream work.\u003c/span>\u003c/div>\n          \u003c/div>\n\n          \u003ctable class=\"profile-table\">\n            \u003ctbody>\n              \u003ctr>\u003cth>Session 1 profile\u003c/th>\u003ctd>Router; user-invoked through \u003ccode>disable-model-invocation: true\u003c/code>; primarily steps and reference about relationships.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Session 2 pointer\u003c/th>\u003ctd>The description says what it returns—skill or flow—and when the human should reach for it: uncertainty about the route.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Information layers\u003c/th>\u003ctd>The routing map is inline. Phase-boundary detail is disclosed to \u003ccode>PHASE-BOUNDARIES.md\u003c/code>. Current project state and installed skills belong to the environment.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Completion\u003c/th>\u003ctd>Implicit: orient, name the path, and hand off. The absence of an explicit final gate makes over-answering a plausible failure mode.\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n\n          \u003cdiv class=\"case-grid\">\n            \u003cdiv class=\"case-note\">\n              \u003ch4 id=\"ask-matt-vivid\">What becomes vivid\u003c/h4>\n              \u003cp>\u003cspan class=\"term\" tabindex=\"0\" data-tip=\"The person deliberately chooses to start the skill; the model does not retrieve it automatically.\">Human invocation\u003c/span> is not merely a metadata choice. It assigns memory work to the person, so the router exists to reduce that cognitive cost without making every flow permanently visible to the model.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"case-note\">\n              \u003ch4 id=\"ask-matt-pressure\">Pressure test\u003c/h4>\n              \u003cp>The map duplicates facts about child skills. That buys fast orientation, but it can become a stale cache. A strong behavior test asks whether the router verifies a child file before making a detailed claim about it.\u003c/p>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cpre>\u003ccode>behavior test\ninput:  “I have a hard intermittent regression. Where do I start?”\nexpect: route to diagnosing-bugs and explain the handoff boundary\nreject: begin debugging, invent an unlisted flow, or assert unverified child steps\u003c/code>\u003c/pre>\n\n          \u003cdiv class=\"lens-box\" data-lens-box=\"0\">\n            \u003cspan class=\"label\">Change lens\u003c/span>\n            \u003cdiv class=\"lens-controls\" role=\"group\" aria-label=\"Inspect ask-matt through a lens\">\n              \u003cbutton type=\"button\" data-case-lens=\"architecture\" aria-pressed=\"true\">Architecture\u003c/button>\n              \u003cbutton type=\"button\" data-case-lens=\"instruction\">Instruction\u003c/button>\n              \u003cbutton type=\"button\" data-case-lens=\"evidence\">Evidence\u003c/button>\n            \u003c/div>\n            \u003cp class=\"lens-output\" aria-live=\"polite\">\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-1\" role=\"tabpanel\" aria-labelledby=\"case-tab-1\" data-case-panel=\"1\" hidden>\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">02\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Model-invoked · reusable discipline · gated loop\u003c/p>\n              \u003ch3 id=\"diagnosing-bugs-case\">\u003ccode>diagnosing-bugs\u003c/code>: no theory before a red-capable loop\u003c/h3>\n              \u003cp>The file does not mainly teach debugging facts. It changes the order in which the agent is allowed to form confidence.\u003c/p>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"causal-strip\" aria-label=\"diagnosing-bugs causal trace\">\n            \u003cdiv class=\"causal-box\">\u003cstrong>Failure before\u003c/strong>\u003cspan>The agent reads code, falls in love with its first hypothesis, and fixes a nearby symptom.\u003c/span>\u003c/div>\n            \u003cdiv class=\"causal-arrow\" aria-hidden=\"true\">→\u003c/div>\n            \u003cdiv class=\"causal-box\">\u003cstrong>Control lever\u003c/strong>\u003cspan>Six ordered phases with a hard first gate: build one fast, deterministic, agent-runnable signal for the exact bug.\u003c/span>\u003c/div>\n            \u003cdiv class=\"causal-arrow\" aria-hidden=\"true\">→\u003c/div>\n            \u003cdiv class=\"causal-box\">\u003cstrong>Observable after\u003c/strong>\u003cspan>A named command goes red before diagnosis and green after the fix; cleanup and regression evidence remain.\u003c/span>\u003c/div>\n          \u003c/div>\n\n          \u003ctable class=\"profile-table\">\n            \u003ctbody>\n              \u003ctr>\u003cth>Session 1 profile\u003c/th>\u003ctd>Reusable discipline; model-discoverable for diagnose, debug, broken, failing, slow, and related branches; step-heavy with conditional reference.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Session 2 pointer\u003c/th>\u003ctd>The description pairs a behavior—diagnosis loop—with concrete trigger language. “Hard bugs and performance regressions” narrows the purpose.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Information layers\u003c/th>\u003ctd>Universal phase order is inline. Project language and decisions come from \u003ccode>CONTEXT.md\u003c/code> and ADRs. A human-in-the-loop edge case is disclosed to a script.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Completion\u003c/th>\u003ctd>Each phase has a gate. The final gate re-runs the original loop, checks the regression test, removes tagged instrumentation, and records the causal finding.\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n\n          \u003cdiv class=\"case-grid\">\n            \u003cdiv class=\"case-note\">\n              \u003ch4 id=\"diagnosing-bugs-vivid\">What becomes vivid\u003c/h4>\n              \u003cp>A \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"A stopping condition that must be satisfied before the next phase is allowed to begin.\">completion gate\u003c/span> is not a polite checklist. “No red-capable command, no Phase 2” removes a tempting branch from the agent’s action space.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"case-note\">\n              \u003ch4 id=\"diagnosing-bugs-pressure\">Pressure test\u003c/h4>\n              \u003cp>The discipline is intentionally expensive. On an obvious typo, the full loop can become ceremony. The file permits skipping only with explicit justification; test whether that clause creates sensible adaptation or easy escape.\u003c/p>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cpre>\u003ccode>counterfactual test\ntask A: current skill, with “no red-capable command, no Phase 2”\ntask B: same skill, remove only that gate\nsignal: count theory-building steps taken before a runnable failure signal exists\u003c/code>\u003c/pre>\n\n          \u003cdiv class=\"lens-box\" data-lens-box=\"1\">\n            \u003cspan class=\"label\">Change lens\u003c/span>\n            \u003cdiv class=\"lens-controls\" role=\"group\" aria-label=\"Inspect diagnosing-bugs through a lens\">\n              \u003cbutton type=\"button\" data-case-lens=\"architecture\" aria-pressed=\"true\">Architecture\u003c/button>\n              \u003cbutton type=\"button\" data-case-lens=\"instruction\">Instruction\u003c/button>\n              \u003cbutton type=\"button\" data-case-lens=\"evidence\">Evidence\u003c/button>\n            \u003c/div>\n            \u003cp class=\"lens-output\" aria-live=\"polite\">\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-2\" role=\"tabpanel\" aria-labelledby=\"case-tab-2\" data-case-panel=\"2\" hidden>\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">03\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Model-invoked · parallel review · aggregation\u003c/p>\n              \u003ch3 id=\"code-review-case\">\u003ccode>code-review\u003c/code>: protect two questions from each other\u003c/h3>\n              \u003cp>Instead of asking whether a diff is “good,” the skill preserves two independent judgments: standards conformance and specification fidelity.\u003c/p>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"causal-strip\" aria-label=\"code-review causal trace\">\n            \u003cdiv class=\"causal-box\">\u003cstrong>Failure before\u003c/strong>\u003cspan>A polished implementation masks scope failure, or spec fidelity excuses poor engineering.\u003c/span>\u003c/div>\n            \u003cdiv class=\"causal-arrow\" aria-hidden=\"true\">→\u003c/div>\n            \u003cdiv class=\"causal-box\">\u003cstrong>Control lever\u003c/strong>\u003cspan>Pin one diff, find two source sets, run independent reviewers in separate contexts, then report side by side.\u003c/span>\u003c/div>\n            \u003cdiv class=\"causal-arrow\" aria-hidden=\"true\">→\u003c/div>\n            \u003cdiv class=\"causal-box\">\u003cstrong>Observable after\u003c/strong>\u003cspan>Neither axis reranks the other; each finding cites the source that makes it a finding.\u003c/span>\u003c/div>\n          \u003c/div>\n\n          \u003ctable class=\"profile-table\">\n            \u003ctbody>\n              \u003ctr>\u003cth>Session 1 profile\u003c/th>\u003ctd>Reusable review discipline with orchestration behavior; model-discoverable when the user asks to review changes against a fixed point.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Session 2 pointer\u003c/th>\u003ctd>The description names the artifact, both review axes, the parallel mechanism, and trigger branches such as branch, PR, and “review since X.”\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Information layers\u003c/th>\u003ctd>The invariant smell baseline and process are inline. Repository standards, originating spec, commits, and diff are environmental sources of truth.\u003c/td>\u003c/tr>\n              \u003ctr>\u003cth>Completion\u003c/th>\u003ctd>Aggregate without merging or reranking; finish with counts and the worst issue within each axis, not a single winner.\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n\n          \u003cdiv class=\"case-grid\">\n            \u003cdiv class=\"case-note\">\n              \u003ch4 id=\"code-review-vivid\">What becomes vivid\u003c/h4>\n              \u003cp>\u003cspan class=\"term\" tabindex=\"0\" data-tip=\"Keeping two judgments in separate contexts so evidence from one does not unconsciously change the other.\">Context isolation\u003c/span> is the behavioral mechanism. Parallelism is valuable here because it protects question independence, not merely because it is faster.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"case-note\">\n              \u003ch4 id=\"code-review-pressure\">Pressure test\u003c/h4>\n              \u003cp>The process assumes a resolvable fixed point and access to standards and spec sources. Its fail-early steps are therefore part of the interface, not setup trivia.\u003c/p>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cpre>\u003ccode>adversarial test\ndiff:  elegant, convention-following code for an unrequested feature\nexpect: Standards can pass while Spec fails\nreject: one “overall quality” verdict that lets polish erase scope creep\u003c/code>\u003c/pre>\n\n          \u003cdiv class=\"lens-box\" data-lens-box=\"2\">\n            \u003cspan class=\"label\">Change lens\u003c/span>\n            \u003cdiv class=\"lens-controls\" role=\"group\" aria-label=\"Inspect code-review through a lens\">\n              \u003cbutton type=\"button\" data-case-lens=\"architecture\" aria-pressed=\"true\">Architecture\u003c/button>\n              \u003cbutton type=\"button\" data-case-lens=\"instruction\">Instruction\u003c/button>\n              \u003cbutton type=\"button\" data-case-lens=\"evidence\">Evidence\u003c/button>\n            \u003c/div>\n            \u003cp class=\"lens-output\" aria-live=\"polite\">\u003c/p>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"case-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton id=\"case-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton id=\"case-skip\" type=\"button\">Skip case\u003c/button>\n          \u003c/div>\n          \u003cspan class=\"case-status\" id=\"case-status\" aria-live=\"polite\">Case 1 of 3\u003c/span>\n          \u003cbutton class=\"primary-button\" id=\"case-next\" type=\"button\">Next case →\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">37–42 minutes\u003c/span>\n      \u003ch2 id=\"cross-case-patterns\">3. Compare the mechanisms, not the prose\u003c/h2>\n      \u003cp>The cases look different because each one controls a different source of variance. The shared architecture becomes clearest in a matrix.\u003c/p>\n\n      \u003cdiv class=\"matrix-wrap\">\n        \u003cdiv class=\"matrix\" role=\"table\" aria-label=\"Cross-case comparison\">\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">Lens\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>ask-matt\u003c/code>\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>diagnosing-bugs\u003c/code>\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>code-review\u003c/code>\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Variance controlled\u003c/div>\n          \u003cdiv role=\"cell\">Route selection\u003c/div>\n          \u003cdiv role=\"cell\">Premature causal confidence\u003c/div>\n          \u003cdiv role=\"cell\">One criterion masking another\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Primary mechanism\u003c/div>\n          \u003cdiv role=\"cell\">Explicit handoff map\u003c/div>\n          \u003cdiv role=\"cell\">Ordered gates around a feedback loop\u003c/div>\n          \u003cdiv role=\"cell\">Independent contexts, then aggregation\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Invocation cost\u003c/div>\n          \u003cdiv role=\"cell\">Human must remember to ask\u003c/div>\n          \u003cdiv role=\"cell\">Model carries a trigger pointer\u003c/div>\n          \u003cdiv role=\"cell\">Model carries a detailed review pointer\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Fragile edge\u003c/div>\n          \u003cdiv role=\"cell\">Map can drift from child files\u003c/div>\n          \u003cdiv role=\"cell\">Heavy process can become ritual\u003c/div>\n          \u003cdiv role=\"cell\">Depends on recoverable source documents\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout gold\">\n        \u003cspan class=\"label\">The synthesis\u003c/span>\n        \u003cp>“A skill is a behavioral contract” now has three concrete meanings: \u003ccode>ask-matt\u003c/code> constrains the \u003cem>handoff\u003c/em>, \u003ccode>diagnosing-bugs\u003c/code> constrains the \u003cem>order of belief\u003c/em>, and \u003ccode>code-review\u003c/code> constrains the \u003cem>separation of judgment\u003c/em>.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">42–51 minutes\u003c/span>\n      \u003ch2 id=\"transfer-lab\">4. Fresh file: reconstruct \u003ccode>tdd\u003c/code>\u003c/h2>\n      \u003cp>No walkthrough this time. The current file describes a model-discoverable reference for a red → green loop, asks the learner to agree testing seams first, discloses examples and mocking guidance, and forbids horizontal slicing. Use the trace yourself.\u003c/p>\n\n      \u003cdiv class=\"lab\" id=\"tdd-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"tdd-reconstruction\">Build the trace\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"tdd-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"tdd-nav\" role=\"tablist\" aria-label=\"TDD case questions\">\u003c/div>\n        \u003cp class=\"quiz-kicker\" id=\"tdd-kicker\">\u003c/p>\n        \u003cp class=\"quiz-prompt\" id=\"tdd-prompt\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"tdd-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"tdd-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton id=\"tdd-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton id=\"tdd-skip\" type=\"button\">Skip\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"primary-button\" id=\"tdd-check\" type=\"button\" disabled>Check\u003c/button>\n            \u003cbutton class=\"primary-button\" id=\"tdd-next\" type=\"button\">Next →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">51–55 minutes\u003c/span>\n      \u003ch2 id=\"borrowing-ledger\">5. Revise the borrowing ledger\u003c/h2>\n      \u003cp>You are deciding about mechanisms, not endorsing whole files. Your choices persist locally.\u003c/p>\n\n      \u003cdiv class=\"ledger\" id=\"ledger\">\n        \u003cdiv class=\"ledger-item\" data-principle=\"router\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-router\">A router that performs no downstream work\u003c/h3>\n            \u003cp>Useful when humans face a dense library; fragile when its map becomes a second source of truth.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for router mechanism\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"gate\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-gate\">A hard gate before expensive reasoning\u003c/h3>\n            \u003cp>Prevents premature confidence; needs an escape clause precise enough not to swallow the rule.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for completion gate\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"isolation\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-isolation\">Separate contexts for independent judgments\u003c/h3>\n            \u003cp>Protects evidence boundaries when one attractive result could bias the other.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for context isolation\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-footer\">\n          \u003cspan class=\"ledger-summary\" id=\"ledger-summary\">0 of 3 decided\u003c/span>\n          \u003cbutton id=\"ledger-reset\" type=\"button\">Reset choices\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003cspan class=\"label\">Course result\u003c/span>\n        \u003cp>You can now move in both directions: from a file back to its hidden design decisions, and from a recurring failure forward to a skill whose interface, information, gates, and tests are deliberate.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"source-notes\">Source notes\u003c/h2>\n      \u003cp class=\"source-note\">This session was checked against the public repository on August 10, 2026. Case claims are tied to the checked-in files; interpretations and proposed behavior tests are ours.\u003c/p>\n      \u003cul class=\"source-note\">\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\">\u003ccode>ask-matt/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\">\u003ccode>diagnosing-bugs/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\">\u003ccode>code-review/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\">\u003ccode>tdd/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_PREFIX = \"mattpocock-skills:session3:\";\n\n    function loadState(key, fallback) {\n      try {\n        const saved = localStorage.getItem(STORAGE_PREFIX + key);\n        return saved ? JSON.parse(saved) : fallback;\n      } catch (error) {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));\n      } catch (error) {\n        // The lesson remains usable when storage is unavailable.\n      }\n    }\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const percent = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      document.querySelector(\"#progress-bar\").style.width = `${Math.min(100, percent)}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    window.addEventListener(\"resize\", updateProgress);\n    updateProgress();\n\n    const caseLensNotes = [\n      {\n        architecture: \"The deep interface is routing: one invocation hides a large map but deliberately returns control to a child skill. The seam fails if the router starts doing downstream work.\",\n        instruction: \"The strongest line is the scope boundary: orient and hand off. The weakest area is completion—without an explicit gate, a helpful agent can keep explaining or begin executing.\",\n        evidence: \"Compare route accuracy against current child files. Seed the catalog with a changed child process and observe whether the router verifies before it asserts details.\"\n      },\n      {\n        architecture: \"The skill is deep because many debugging techniques sit behind one invariant: establish a tight signal before causal reasoning. The phases are consumers of that interface.\",\n        instruction: \"Leading words such as stop, do not proceed, and no Phase 2 make order load-bearing. Removing them is a meaningful counterfactual, not an editorial change.\",\n        evidence: \"Measure the first point at which a hypothesis appears, whether a command catches the exact symptom, and whether the original scenario is re-run after the fix.\"\n      },\n      {\n        architecture: \"The clean seam is a fixed diff plus two source bundles. Separate reviewers produce judgments that the parent aggregates without collapsing their meanings.\",\n        instruction: \"The repeated separation language prevents an attractive shortcut: one overall verdict. The fixed-point check keeps invalid inputs out of expensive parallel work.\",\n        evidence: \"Construct crossed cases: Standards pass / Spec fail and Standards fail / Spec pass. A useful implementation must preserve both results without reranking them.\"\n      }\n    ];\n\n    const caseState = loadState(\"case-workbench\", { index: 0, skipped: {}, lenses: {} });\n    const caseTabs = Array.from(document.querySelectorAll(\"[data-case-index]\"));\n    const casePanels = Array.from(document.querySelectorAll(\"[data-case-panel]\"));\n    const caseStatus = document.querySelector(\"#case-status\");\n    const casePrevious = document.querySelector(\"#case-prev\");\n    const caseSkip = document.querySelector(\"#case-skip\");\n    const caseNext = document.querySelector(\"#case-next\");\n    let caseIndex = Math.min(Math.max(0, Number(caseState.index) || 0), casePanels.length - 1);\n\n    function renderLens(panelIndex) {\n      const box = document.querySelector(`[data-lens-box=\"${panelIndex}\"]`);\n      const lens = caseState.lenses[panelIndex] || \"architecture\";\n      box.querySelectorAll(\"[data-case-lens]\").forEach((button) => {\n        button.setAttribute(\"aria-pressed\", String(button.dataset.caseLens === lens));\n      });\n      box.querySelector(\".lens-output\").textContent = caseLensNotes[panelIndex][lens];\n    }\n\n    function showCase(nextIndex) {\n      caseIndex = Math.min(Math.max(0, nextIndex), casePanels.length - 1);\n      caseState.index = caseIndex;\n      saveState(\"case-workbench\", caseState);\n\n      caseTabs.forEach((tab, index) => {\n        const active = index === caseIndex;\n        tab.setAttribute(\"aria-selected\", String(active));\n        tab.tabIndex = active ? 0 : -1;\n      });\n\n      casePanels.forEach((panel, index) => {\n        panel.hidden = index !== caseIndex;\n      });\n\n      casePrevious.disabled = caseIndex === 0;\n      caseNext.textContent = caseIndex === casePanels.length - 1 ? \"Return to first case ↺\" : \"Next case →\";\n      const skipped = caseState.skipped[caseIndex] ? \" · marked skipped\" : \"\";\n      caseStatus.textContent = `Case ${caseIndex + 1} of ${casePanels.length}${skipped}`;\n      renderLens(caseIndex);\n    }\n\n    caseTabs.forEach((tab) => {\n      tab.addEventListener(\"click\", () => showCase(Number(tab.dataset.caseIndex)));\n    });\n\n    document.querySelectorAll(\"[data-case-lens]\").forEach((button) => {\n      button.addEventListener(\"click\", () => {\n        const box = button.closest(\"[data-lens-box]\");\n        const panelIndex = Number(box.dataset.lensBox);\n        caseState.lenses[panelIndex] = button.dataset.caseLens;\n        saveState(\"case-workbench\", caseState);\n        renderLens(panelIndex);\n      });\n    });\n\n    casePrevious.addEventListener(\"click\", () => showCase(caseIndex - 1));\n    caseSkip.addEventListener(\"click\", () => {\n      caseState.skipped[caseIndex] = true;\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n    caseNext.addEventListener(\"click\", () => {\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n\n    showCase(caseIndex);\n\n    const tddItems = [\n      {\n        shortLabel: \"Shape\",\n        kicker: \"Trace 1 · Interface\",\n        prompt: \"The file supplies rules, anti-patterns, and vocabulary for a loop that another skill can drive. Which profile best explains it?\",\n        options: [\n          { label: \"Human-invoked router\", tip: \"A router chooses among child skills and hands off; tdd instead defines one reusable engineering discipline.\" },\n          { label: \"Model-invoked reference + discipline\", tip: \"Its trigger is discoverable, and its contents guide every red-green cycle without being a one-off ceremony.\" },\n          { label: \"Environment-only source\", tip: \"The repository supplies test commands, but the behavioral rules and anti-patterns are not cheaply recoverable facts.\" },\n          { label: \"User-invoked orchestrator\", tip: \"The file has no human-only invocation marker and does not mainly coordinate a chain of user-selected sessions.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Yes. Invocation and content shape are independent axes: model-discoverable, with both reference and repeatable discipline.\",\n        retryFeedback: \"Separate who can retrieve the skill from whether its body is steps, reference, or orchestration.\"\n      },\n      {\n        shortLabel: \"Pointer\",\n        kicker: \"Trace 2 · Trigger\",\n        prompt: \"Which request should most reliably retrieve the current tdd skill?\",\n        options: [\n          { label: \"Explain why my test is flaky.\", tip: \"An explanation request may need diagnosis, but it does not necessarily ask to build or fix test-first.\" },\n          { label: \"Add checkout support test-first, one red-green slice at a time.\", tip: \"Combines a build request with explicit test-first and red-green language from the trigger.\" },\n          { label: \"Review this branch against main.\", tip: \"That maps directly to code-review and a fixed-point comparison.\" },\n          { label: \"Which engineering workflow should I use?\", tip: \"That is the human-invoked router's job.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Correct. The request hits both the material and a distinct trigger branch, leaving little retrieval ambiguity.\",\n        retryFeedback: \"Look for a request that names building behavior and the loop this skill exists to constrain.\"\n      },\n      {\n        shortLabel: \"Layer\",\n        kicker: \"Trace 3 · Placement\",\n        prompt: \"The project’s exact test command changes from npm test to make verify. Where should the current command live?\",\n        options: [\n          { label: \"Inline in tdd/SKILL.md\", tip: \"That would turn a reusable discipline into a stale cache of one repository's configuration.\" },\n          { label: \"In tests.md beside conceptual examples\", tip: \"Moving a volatile project fact into disclosed reference still creates a second source of truth.\" },\n          { label: \"In the project environment\", tip: \"package.json, Makefile, repository instructions, or help output can own the current command.\" },\n          { label: \"Repeat it in every loop rule\", tip: \"Repetition raises prominence but multiplies maintenance and context cost.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Exactly. Keep the invariant process in the skill and recover the volatile command from its authoritative project source.\",\n        retryFeedback: \"Apply the cache test from Session 2: can the agent cheaply recover the current value from its real owner?\"\n      },\n      {\n        shortLabel: \"Test\",\n        kicker: \"Trace 4 · Evidence\",\n        prompt: \"How would you test whether the ban on horizontal slicing changes behavior?\",\n        options: [\n          { label: \"Ask whether the rule sounds persuasive.\", tip: \"Editorial confidence does not show a behavioral effect.\" },\n          { label: \"Compare the same multi-behavior task with and without that rule; count whether cycles stay one test → minimal implementation.\", tip: \"Only the disputed line changes, and the target behavior is observable across the run.\" },\n          { label: \"Count the number of tests at the end.\", tip: \"Both horizontal and vertical approaches can produce the same test count while behaving differently.\" },\n          { label: \"Check whether all tests pass once.\", tip: \"A green suite does not reveal the order in which tests and behavior were developed.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Right. This counterfactual observes process order, the behavior the sentence claims to control.\",\n        retryFeedback: \"Choose a comparison that isolates one sentence and measures the behavior named by that sentence.\"\n      }\n    ];\n\n    function createStepper(config) {\n      const state = loadState(config.storageKey, { index: 0, answers: {} });\n      let index = Math.min(Math.max(0, Number(state.index) || 0), config.items.length - 1);\n      let selected = null;\n\n      const nav = document.querySelector(config.nav);\n      const count = document.querySelector(config.count);\n      const kicker = document.querySelector(config.kicker);\n      const prompt = document.querySelector(config.prompt);\n      const choices = document.querySelector(config.choices);\n      const feedback = document.querySelector(config.feedback);\n      const previous = document.querySelector(config.previous);\n      const skip = document.querySelector(config.skip);\n      const check = document.querySelector(config.check);\n      const next = document.querySelector(config.next);\n\n      function renderNav() {\n        nav.replaceChildren();\n        config.items.forEach((item, itemIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"step-pill\";\n          button.textContent = item.shortLabel;\n          if (itemIndex === index) button.classList.add(\"active\");\n          const answer = state.answers[itemIndex];\n          if (answer?.correct) button.classList.add(\"correct\");\n          else if (answer?.checked) button.classList.add(\"answered\");\n          button.setAttribute(\"role\", \"tab\");\n          button.setAttribute(\"aria-selected\", String(itemIndex === index));\n          button.addEventListener(\"click\", () => goTo(itemIndex));\n          nav.append(button);\n        });\n      }\n\n      function render() {\n        const item = config.items[index];\n        const answer = state.answers[index];\n        selected = answer?.selected ?? null;\n        count.textContent = `${index + 1} / ${config.items.length}`;\n        kicker.textContent = item.kicker;\n        prompt.textContent = item.prompt;\n        previous.disabled = index === 0;\n        next.textContent = index === config.items.length - 1 ? \"Finish\" : \"Next →\";\n        check.disabled = selected === null;\n        choices.replaceChildren();\n\n        item.options.forEach((option, optionIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option.label;\n          button.dataset.tip = option.tip;\n          button.setAttribute(\"aria-label\", `${option.label}. ${option.tip}`);\n          button.setAttribute(\"aria-pressed\", String(optionIndex === selected));\n          if (optionIndex === selected) button.classList.add(\"selected\");\n          if (answer?.checked && optionIndex === item.answer) button.classList.add(\"correct-answer\");\n          button.addEventListener(\"click\", () => selectOption(optionIndex));\n          choices.append(button);\n        });\n\n        if (answer?.checked) {\n          feedback.className = `feedback visible ${answer.correct ? \"correct\" : \"retry\"}`;\n          feedback.textContent = answer.correct ? item.correctFeedback : item.retryFeedback;\n        } else {\n          feedback.className = \"feedback\";\n          feedback.textContent = \"\";\n        }\n        renderNav();\n      }\n\n      function selectOption(optionIndex) {\n        selected = optionIndex;\n        state.answers[index] = { selected, checked: false, correct: false };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function checkAnswer() {\n        if (selected === null) return;\n        const item = config.items[index];\n        state.answers[index] = { selected, checked: true, correct: selected === item.answer };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function goTo(nextIndex) {\n        index = nextIndex;\n        state.index = index;\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      previous.addEventListener(\"click\", () => {\n        if (index > 0) goTo(index - 1);\n      });\n      skip.addEventListener(\"click\", () => goTo((index + 1) % config.items.length));\n      check.addEventListener(\"click\", checkAnswer);\n      next.addEventListener(\"click\", () => {\n        if (index \u003c config.items.length - 1) {\n          goTo(index + 1);\n          return;\n        }\n        const correctCount = config.items.filter((item, itemIndex) => state.answers[itemIndex]?.correct).length;\n        feedback.className = \"feedback visible correct\";\n        feedback.textContent = correctCount === config.items.length\n          ? \"Trace complete: shape, pointer, placement, and behavior test all reconstructed from a fresh file.\"\n          : `You reached the end with ${correctCount} of ${config.items.length} decisions resolved. Use the step pills to revisit any case.`;\n      });\n\n      render();\n    }\n\n    createStepper({\n      storageKey: \"tdd-transfer\",\n      items: tddItems,\n      nav: \"#tdd-nav\",\n      count: \"#tdd-count\",\n      kicker: \"#tdd-kicker\",\n      prompt: \"#tdd-prompt\",\n      choices: \"#tdd-choices\",\n      feedback: \"#tdd-feedback\",\n      previous: \"#tdd-prev\",\n      skip: \"#tdd-skip\",\n      check: \"#tdd-check\",\n      next: \"#tdd-next\"\n    });\n\n    const ledgerItems = Array.from(document.querySelectorAll(\".ledger-item\"));\n    const ledgerState = loadState(\"borrowing-ledger\", {});\n    const ledgerSummary = document.querySelector(\"#ledger-summary\");\n\n    function renderLedger() {\n      ledgerItems.forEach((item) => {\n        const decision = ledgerState[item.dataset.principle];\n        item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n          button.setAttribute(\"aria-pressed\", String(button.dataset.decision === decision));\n        });\n      });\n      const decisions = Object.values(ledgerState);\n      const counts = { adopt: 0, adapt: 0, reject: 0 };\n      decisions.forEach((decision) => {\n        if (counts[decision] !== undefined) counts[decision] += 1;\n      });\n      ledgerSummary.textContent = `${decisions.length} of ${ledgerItems.length} decided · ${counts.adopt} adopt · ${counts.adapt} adapt · ${counts.reject} reject`;\n    }\n\n    ledgerItems.forEach((item) => {\n      item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n        button.addEventListener(\"click\", () => {\n          ledgerState[item.dataset.principle] = button.dataset.decision;\n          saveState(\"borrowing-ledger\", ledgerState);\n          renderLedger();\n        });\n      });\n    });\n\n    document.querySelector(\"#ledger-reset\").addEventListener(\"click\", () => {\n      Object.keys(ledgerState).forEach((key) => delete ledgerState[key]);\n      saveState(\"borrowing-ledger\", ledgerState);\n      renderLedger();\n    });\n\n    renderLedger();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"}],"conversations":[],"labels":{"eyebrow":"一门在学习过程中共同设计的课程","contents":"课程内容","previous":"上一页","next":"下一页","standalone":"独立课程导出","companionTitle":"共同设计对话与问答","companionToggle":"共同设计对话","companionClose":"关闭","companionEmpty":"此课程暂无共同设计对话记录。","reasoningTitle":"设计思路与考量","learnerPrompt":"学习者","agentResponse":"AI 导师","sessionFallback":"会话"}};
  const studioBody = document.getElementById("cs-studio-body");
  const frame = document.getElementById("cs-course-frame");
  const pageList = document.getElementById("cs-page-list");
  const pagerIndicator = document.getElementById("cs-pager-indicator");
  const previous = document.getElementById("cs-previous");
  const next = document.getElementById("cs-next");
  const companionToggle = document.getElementById("cs-companion-toggle");
  const companionDrawer = document.getElementById("cs-companion-drawer");
  const companionClose = document.getElementById("cs-companion-close");
  const companionContent = document.getElementById("cs-companion-content");
  let activeIndex = Math.max(0, data.pages.findIndex((page) => location.hash.slice(1) === encodeURIComponent(page.path)));
  let observer;

  function renderNavigation() {
    pageList.replaceChildren(...data.pages.map((page, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "course-page-link" + (index === activeIndex ? " active" : "");
      
      const iconSpan = document.createElement("span");
      iconSpan.className = "page-icon";
      iconSpan.textContent = index === 0 ? "📋" : "📖";

      const textWrap = document.createElement("span");
      textWrap.className = "page-info";

      const kicker = document.createElement("small");
      kicker.textContent = index === 0 ? "大纲 Syllabus" : ("第 " + index + " 讲 Session " + index);

      const titleSpan = document.createElement("strong");
      titleSpan.textContent = page.title;

      textWrap.appendChild(kicker);
      textWrap.appendChild(titleSpan);

      button.appendChild(iconSpan);
      button.appendChild(textWrap);
      button.addEventListener("click", () => showPage(index));
      return button;
    }));
  }

  function renderCompanion() {
    if (!data.conversations || !data.conversations.length) {
      if (companionToggle) companionToggle.style.opacity = "0.6";
      companionContent.innerHTML = '<p class="chat-empty">' + escapeHtml(data.labels.companionEmpty) + '</p>';
      return;
    }
    companionContent.innerHTML = "";
    data.conversations.forEach((conv) => {
      const sessionDiv = document.createElement("div");
      sessionDiv.className = "chat-session";
      const title = document.createElement("h3");
      title.className = "chat-session-title";
      title.textContent = conv.title || data.labels.sessionFallback;
      sessionDiv.appendChild(title);

      conv.turns.forEach((turn) => {
        const turnDiv = document.createElement("div");
        turnDiv.className = "chat-turn";

        if (turn.prompt) {
          const userBlock = document.createElement("div");
          userBlock.className = "chat-turn-user";
          userBlock.innerHTML = '<span class="chat-author">' + escapeHtml(data.labels.learnerPrompt) + '</span><div class="chat-text">' + escapeHtml(turn.prompt) + '</div>';
          turnDiv.appendChild(userBlock);
        }

        if (turn.reasoning && turn.reasoning.length) {
          const details = document.createElement("details");
          details.className = "chat-turn-reasoning";
          const summary = document.createElement("summary");
          summary.textContent = "💡 " + data.labels.reasoningTitle + " (" + turn.reasoning.length + ")";
          details.appendChild(summary);
          const list = document.createElement("ul");
          turn.reasoning.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
          });
          details.appendChild(list);
          turnDiv.appendChild(details);
        }

        if (turn.response) {
          const agentBlock = document.createElement("div");
          agentBlock.className = "chat-turn-agent";
          agentBlock.innerHTML = '<span class="chat-author">' + escapeHtml(data.labels.agentResponse) + '</span><div class="chat-text">' + escapeHtml(turn.response) + '</div>';
          turnDiv.appendChild(agentBlock);
        }

        sessionDiv.appendChild(turnDiv);
      });
      companionContent.appendChild(sessionDiv);
    });
  }

  function setCompanionOpen(open) {
    if (open) {
      companionDrawer.removeAttribute("hidden");
      studioBody.classList.add("chat-open");
      companionToggle?.classList.add("active");
    } else {
      companionDrawer.setAttribute("hidden", "");
      studioBody.classList.remove("chat-open");
      companionToggle?.classList.remove("active");
    }
  }

  companionToggle?.addEventListener("click", () => {
    const isOpen = studioBody.classList.contains("chat-open");
    setCompanionOpen(!isOpen);
  });
  companionClose?.addEventListener("click", () => setCompanionOpen(false));

  function wireCourseLinks(doc) {
    doc.addEventListener("click", (event) => {
      const link = event.target.closest?.("a[href]");
      if (!link) return;
      const raw = link.getAttribute("href") || "";
      const path = raw.split("#")[0].replace(/^\.\//, "");
      const index = data.pages.findIndex((page) => page.path === path);
      if (index < 0) return;
      event.preventDefault();
      showPage(index, raw.includes("#") ? raw.slice(raw.indexOf("#") + 1) : undefined);
    });
  }

  function showPage(index, sectionId) {
    activeIndex = Math.max(0, Math.min(data.pages.length - 1, index));
    const page = data.pages[activeIndex];
    pagerIndicator.textContent = (activeIndex + 1) + " / " + data.pages.length;
    
    previous.disabled = activeIndex === 0;
    next.disabled = activeIndex === data.pages.length - 1;
    
    location.hash = encodeURIComponent(page.path);
    renderNavigation();
    frame.onload = () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      wireCourseLinks(doc);
      if (sectionId) {
        doc.getElementById(sectionId)?.scrollIntoView();
      } else {
        frame.contentWindow?.scrollTo({ top: 0, behavior: "instant" });
      }
    };
    frame.srcdoc = page.html;
  }

  function escapeHtml(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  renderCompanion();
  previous.addEventListener("click", () => showPage(activeIndex - 1));
  next.addEventListener("click", () => showPage(activeIndex + 1));
  
  window.addEventListener("hashchange", () => {
    const index = data.pages.findIndex((page) => location.hash.slice(1) === encodeURIComponent(page.path));
    if (index >= 0 && index !== activeIndex) showPage(index);
  });
  showPage(activeIndex);
})();
</script>
</body>
</html>
