-46\" data-line=\"46\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-47\" data-line=\"47\">A 30-second flaky loop is barely better than no loop; a 2-second deterministic one is tight — a debugging superpower.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-48\" data-line=\"48\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-49\" data-line=\"49\">### Non-deterministic bugs\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-50\" data-line=\"50\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-51\" data-line=\"51\">The goal is not a clean repro but a **higher reproduction rate**. Loop the trigger 100×, parallelise, add stress, narrow timing windows, inject sleeps. A 50%-flake bug is debuggable; 1% is not — keep raising the rate until it's debuggable.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-52\" data-line=\"52\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-53\" data-line=\"53\">### When you genuinely cannot build a loop\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-54\" data-line=\"54\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-55\" data-line=\"55\">Stop and say so explicitly. List what you tried. Ask the user for: (a) access to whatever environment reproduces it, (b) a redacted captured artifact (HAR file, log dump, core dump, screen recording with timestamps), or (c) permission to add temporary production instrumentation. Do **not** proceed to hypothesise without a loop.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-56\" data-line=\"56\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-57\" data-line=\"57\">### Completion criterion — a tight loop that goes red\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-58\" data-line=\"58\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-59\" data-line=\"59\">Phase 1 is done when the loop is **tight** and **red-capable**: you can name **one command** — a script path, a test invocation, a curl — that you have **already run at least once** (show the invocation and its output, redacted), and that is:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-60\" data-line=\"60\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-61\" data-line=\"61\">- [ ] **Red-capable** — it drives the actual bug code path and asserts the **user's exact symptom**, so it can go red on this bug and green once fixed. Not \"runs without erroring\" — it must be able to _catch this specific bug_.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-62\" data-line=\"62\">- [ ] **Deterministic** — same verdict every run (flaky bugs: a pinned, high reproduction rate, per above).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-63\" data-line=\"63\">- [ ] **Fast** — seconds, not minutes.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-64\" data-line=\"64\">- [ ] **Agent-runnable** — you can run it unattended; a human in the loop only via `scripts/hitl-loop.template.sh`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-65\" data-line=\"65\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-66\" data-line=\"66\">If you catch yourself reading code to build a theory before this command exists, **stop — jumping straight to a hypothesis is the exact failure this skill prevents.** No red-capable command, no Phase 2.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-67\" data-line=\"67\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-68\" data-line=\"68\">## Phase 2 — Reproduce + minimise\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-69\" data-line=\"69\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-70\" data-line=\"70\">Run the loop. Watch it go red — the bug appears.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-71\" data-line=\"71\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-72\" data-line=\"72\">Confirm:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-73\" data-line=\"73\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-74\" data-line=\"74\">- [ ] The loop produces the failure mode the **user** described — not a different failure that happens to be nearby. Wrong bug = wrong fix.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-75\" data-line=\"75\">- [ ] The failure is reproducible across multiple runs (or, for non-deterministic bugs, reproducible at a high enough rate to debug against).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-76\" data-line=\"76\">- [ ] You have captured the exact symptom (error message, wrong output, slow timing) so later phases can verify the fix actually addresses it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-77\" data-line=\"77\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-78\" data-line=\"78\">### Minimise\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-79\" data-line=\"79\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-80\" data-line=\"80\">Once it's red, shrink the repro to the **smallest scenario that still goes red**. Cut inputs, callers, config, data, and steps **one at a time**, re-running the loop after each cut — keep only what's load-bearing for the failure.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-81\" data-line=\"81\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-82\" data-line=\"82\">Why bother: a minimal repro shrinks the hypothesis space in Phase 3 (fewer moving parts left to suspect) and becomes the clean regression test in Phase 5.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-83\" data-line=\"83\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-84\" data-line=\"84\">Done when **every remaining element is load-bearing** — removing any one of them makes the loop go green.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-85\" data-line=\"85\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-86\" data-line=\"86\">Do not proceed until you have reproduced **and** minimised.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-87\" data-line=\"87\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-88\" data-line=\"88\">## Phase 3 — Hypothesise\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-89\" data-line=\"89\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-90\" data-line=\"90\">Generate **3–5 ranked hypotheses** before testing any of them. Single-hypothesis generation anchors on the first plausible idea.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-91\" data-line=\"91\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-92\" data-line=\"92\">Each hypothesis must be **falsifiable**: state the prediction it makes.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-93\" data-line=\"93\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-94\" data-line=\"94\">&gt; Format: \"If &lt;X&gt; is the cause, then &lt;changing Y&gt; will make the bug disappear / &lt;changing Z&gt; will make it worse.\"\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-95\" data-line=\"95\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-96\" data-line=\"96\">If you cannot state the prediction, the hypothesis is a vibe — discard or sharpen it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-97\" data-line=\"97\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-98\" data-line=\"98\">**Show the ranked list to the user before testing.** They often have domain knowledge that re-ranks instantly (\"we just deployed a change to #3\"), or know hypotheses they've already ruled out. Cheap checkpoint, big time saver. Don't block on it — proceed with your ranking if the user is AFK.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-99\" data-line=\"99\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-100\" data-line=\"100\">## Phase 4 — Instrument\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-101\" data-line=\"101\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-102\" data-line=\"102\">Each probe must map to a specific prediction from Phase 3. **Change one variable at a time.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-103\" data-line=\"103\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-104\" data-line=\"104\">Tool preference:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-105\" data-line=\"105\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-106\" data-line=\"106\">1. **Debugger / REPL inspection** if the env supports it. One breakpoint beats ten logs.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-107\" data-line=\"107\">2. **Targeted logs** at the boundaries that distinguish hypotheses.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-108\" data-line=\"108\">3. Never \"log everything and grep\".\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-109\" data-line=\"109\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-110\" data-line=\"110\">**Tag every debug log** with a unique prefix, e.g. `[DEBUG-a4f2]`. Cleanup at the end becomes a single grep. Untagged logs survive; tagged logs die.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-111\" data-line=\"111\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-112\" data-line=\"112\">**Perf branch.** For performance regressions, logs are usually wrong. Instead: establish a baseline measurement (timing harness, `performance.now()`, profiler, query plan), then bisect. Measure first, fix second.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-113\" data-line=\"113\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-114\" data-line=\"114\">## Phase 5 — Fix + regression test\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-115\" data-line=\"115\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-116\" data-line=\"116\">Write the regression test **before the fix** — but only if there is a **correct seam** for it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-117\" data-line=\"117\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-118\" data-line=\"118\">A correct seam is one where the test exercises the **real bug pattern** as it occurs at the call site. If the only available seam is too shallow (single-caller test when the bug needs multiple callers, unit test that can't replicate the chain that triggered the bug), a regression test there gives false confidence.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-119\" data-line=\"119\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-120\" data-line=\"120\">**If no correct seam exists, that itself is the finding.** Note it. The codebase architecture is preventing the bug from being locked down. Flag this for the next phase.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-121\" data-line=\"121\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-122\" data-line=\"122\">If a correct seam exists:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-123\" data-line=\"123\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-124\" data-line=\"124\">1. Turn the minimised repro into a failing test at that seam.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-125\" data-line=\"125\">2. Watch it fail.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-126\" data-line=\"126\">3. Apply the fix.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-127\" data-line=\"127\">4. Watch it pass.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-128\" data-line=\"128\">5. Re-run the Phase 1 feedback loop against the original (un-minimised) scenario.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-129\" data-line=\"129\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"diagnosing-bugs-source-line-130\" data-line=\"130\">## Phase 6 — Cleanup + post-mortem\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-131\" data-line=\"131\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-132\" data-line=\"132\">Required before declaring done:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-133\" data-line=\"133\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-134\" data-line=\"134\">- [ ] Original repro no longer reproduces (re-run the Phase 1 loop)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-135\" data-line=\"135\">- [ ] Regression test passes (or absence of seam is documented)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-136\" data-line=\"136\">- [ ] All `[DEBUG-...]` instrumentation removed (`grep` the prefix)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-137\" data-line=\"137\">- [ ] Throwaway prototypes deleted (or moved to a clearly-marked debug location)\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-138\" data-line=\"138\">- [ ] The hypothesis that turned out correct is stated in the commit / PR message — so the next debugger learns\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-139\" data-line=\"139\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"diagnosing-bugs-source-line-140\" data-line=\"140\">**Then ask: what would have prevented this bug?** If the answer involves architectural change (no good test seam, tangled callers, hidden coupling) hand off to the `/improve-codebase-architecture` skill with the specifics. Make the recommendation **after** the fix is in, not before — you have more information now than when you started.\u003c/span>\n            \u003c/code>\u003c/pre>\n            \u003caside class=\"margin-rail\" aria-label=\"Teacher comments on diagnosing-bugs\">\n            \u003cdiv class=\"margin-comment\" style=\"--line: 3\" aria-labelledby=\"diagnosing-bugs-source-line-3\">\n              \u003cspan class=\"margin-marker\">01\u003c/span>\u003cstrong>A discoverable discipline\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-3\">Line 3\u003c/a> · The description names both the behavior and concrete trigger words: diagnose, debug, broken, failing, and slow.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 12\" aria-labelledby=\"diagnosing-bugs-source-line-12\">\n              \u003cspan class=\"margin-marker\">02\u003c/span>\u003cstrong>Evidence can leak secrets\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-12\">Line 12\u003c/a> · Redaction appears before diagnosis because every later phase may expose commands, logs, traces, or captured requests.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 18\" aria-labelledby=\"diagnosing-bugs-source-line-18\">\n              \u003cspan class=\"margin-marker\">03\u003c/span>\u003cstrong>The load-bearing phase\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-18\">Line 18\u003c/a> · The skill refuses causal stories until one command can show the exact bug. Everything later consumes this signal.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 39\" aria-labelledby=\"diagnosing-bugs-source-line-39\">\n              \u003cspan class=\"margin-marker\">04\u003c/span>\u003cstrong>Treat the loop as a product\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-39\">Line 39\u003c/a> · A reproduction is not enough: it must become faster, sharper, and more deterministic so repeated experiments stay cheap.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 49\" aria-labelledby=\"diagnosing-bugs-source-line-49\">\n              \u003cspan class=\"margin-marker\">05\u003c/span>\u003cstrong>Flakes need probability, not perfection\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-49\">Line 49\u003c/a> · For nondeterministic bugs, raising the reproduction rate creates a useful signal even when certainty is impossible.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 57\" aria-labelledby=\"diagnosing-bugs-source-line-57\">\n              \u003cspan class=\"margin-marker\">06\u003c/span>\u003cstrong>A real completion gate\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-57\">Line 57\u003c/a> · Four checkable properties must be true before Phase 2. This is stronger than advice to “try reproducing first.”\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 68\" aria-labelledby=\"diagnosing-bugs-source-line-68\">\n              \u003cspan class=\"margin-marker\">07\u003c/span>\u003cstrong>Reproduce, then minimise\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-68\">Line 68\u003c/a> · First prove it is the user’s bug; then remove every element that is not necessary. These are separate jobs.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 88\" aria-labelledby=\"diagnosing-bugs-source-line-88\">\n              \u003cspan class=\"margin-marker\">08\u003c/span>\u003cstrong>Several falsifiable causes\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-88\">Line 88\u003c/a> · Ranking multiple predictions counters attachment to the first plausible explanation and gives instrumentation something to distinguish.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 100\" aria-labelledby=\"diagnosing-bugs-source-line-100\">\n              \u003cspan class=\"margin-marker\">09\u003c/span>\u003cstrong>Instrument predictions\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-100\">Line 100\u003c/a> · Each probe tests one hypothesis. Broad logging creates volume; targeted boundaries create discriminating evidence.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 114\" aria-labelledby=\"diagnosing-bugs-source-line-114\">\n              \u003cspan class=\"margin-marker\">10\u003c/span>\u003cstrong>Test at the real seam\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-114\">Line 114\u003c/a> · A convenient shallow test can pass while the original bug remains possible. No honest seam is itself an architectural finding.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 130\" aria-labelledby=\"diagnosing-bugs-source-line-130\">\n              \u003cspan class=\"margin-marker\">11\u003c/span>\u003cstrong>Close the original loop\u003c/strong>\n              \u003cp>\u003ca href=\"#diagnosing-bugs-source-line-130\">Line 130\u003c/a> · Completion returns to the unminimised reproduction, removes temporary scaffolding, and preserves the causal lesson.\u003c/p>\n            \u003c/div>\n            \u003c/aside>\n          \u003c/div>\n        \u003c/article>\n\n        \u003carticle class=\"case-panel\" id=\"case-panel-2\" role=\"tabpanel\" aria-labelledby=\"case-tab-2\" data-case-panel=\"2\" hidden>\n          \u003cdiv class=\"case-heading\">\n            \u003cdiv class=\"case-index\">03\u003c/div>\n            \u003cdiv>\n              \u003cp class=\"case-type\">Model-invoked · parallel review · aggregation\u003c/p>\n              \u003ch3 id=\"code-review-case\">\u003ccode>code-review\u003c/code>: protect two questions from each other\u003c/h3>\n              \u003cp>Instead of asking whether a diff is “good,” the skill preserves two independent judgments: standards conformance and specification fidelity.\u003c/p>\n              \u003ca class=\"source-link\" href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\" target=\"_blank\" rel=\"noreferrer\">Read the original \u003ccode>SKILL.md\u003c/code> ↗\u003c/a>\n\n          \u003cp class=\"source-disclosure\">The left column is the complete, unmodified \u003ccode>SKILL.md\u003c/code>. Read it continuously; the numbered margin comments point to important design decisions without replacing the source.\u003c/p>\n\n          \u003cdiv class=\"manuscript-layout\" aria-label=\"Complete code-review source with teacher comments\">\n            \u003cpre class=\"skill-manuscript\" aria-label=\"Complete original code-review SKILL.md\">\u003ccode>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-1\" data-line=\"1\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-2\" data-line=\"2\">name: code-review\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-3\" data-line=\"3\">description: Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes — Standards (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating issue/spec asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user wants to review a branch, a PR, work-in-progress changes, or asks to \"review since X\".\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-4\" data-line=\"4\">---\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-5\" data-line=\"5\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-6\" data-line=\"6\">Two-axis review of the diff between `HEAD` and a fixed point the user supplies:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-7\" data-line=\"7\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-8\" data-line=\"8\">- **Standards** — does the code conform to this repo's documented coding standards?\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-9\" data-line=\"9\">- **Spec** — does the code faithfully implement the originating issue / spec?\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-10\" data-line=\"10\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-11\" data-line=\"11\">Both axes run as **parallel sub-agents** so they don't pollute each other's context, then this skill aggregates their findings.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-12\" data-line=\"12\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-13\" data-line=\"13\">The issue tracker should have been provided to you — run `/setup-matt-pocock-skills` if `docs/agents/issue-tracker.md` is missing.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-14\" data-line=\"14\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-15\" data-line=\"15\">## Process\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-16\" data-line=\"16\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-17\" data-line=\"17\">### 1. Pin the fixed point\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-18\" data-line=\"18\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-19\" data-line=\"19\">Whatever the user said is the fixed point — a commit SHA, branch name, tag, `main`, `HEAD~5`, etc. If they didn't specify one, ask for it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-20\" data-line=\"20\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-21\" data-line=\"21\">Capture the diff command once: `git diff &lt;fixed-point&gt;...HEAD` (three-dot, so the comparison is against the merge-base). Also note the list of commits via `git log &lt;fixed-point&gt;..HEAD --oneline`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-22\" data-line=\"22\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-23\" data-line=\"23\">Before going further, confirm the fixed point resolves (`git rev-parse &lt;fixed-point&gt;`) and the diff is non-empty. A bad ref or empty diff should fail here — not inside two parallel sub-agents.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-24\" data-line=\"24\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-25\" data-line=\"25\">### 2. Identify the spec source\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-26\" data-line=\"26\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-27\" data-line=\"27\">Look for the originating spec, in this order:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-28\" data-line=\"28\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-29\" data-line=\"29\">1. Issue references in the commit messages (`#123`, `Closes #45`, GitLab `!67`, etc.) — fetch via the workflow in `docs/agents/issue-tracker.md`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-30\" data-line=\"30\">2. A path the user passed as an argument.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-31\" data-line=\"31\">3. A spec file under `docs/`, `specs/`, or `.scratch/` matching the branch name or feature.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-32\" data-line=\"32\">4. If nothing is found, ask the user where the spec is. If they say there isn't one, the **Spec** sub-agent will skip and report \"no spec available\".\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-33\" data-line=\"33\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-34\" data-line=\"34\">### 3. Identify the standards sources\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-35\" data-line=\"35\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-36\" data-line=\"36\">Anything in the repo that documents how code should be written, such as `CODING_STANDARDS.md` or `CONTRIBUTING.md`.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-37\" data-line=\"37\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-38\" data-line=\"38\">On top of whatever the repo documents, the Standards axis always carries the **smell baseline** below — a fixed set of Fowler code smells (_Refactoring_, ch.3) that applies even when a repo documents nothing. Two rules bind it:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-39\" data-line=\"39\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-40\" data-line=\"40\">- **The repo overrides.** A documented repo standard always wins; where it endorses something the baseline would flag, suppress the smell.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-41\" data-line=\"41\">- **Always a judgement call.** Each smell is a labelled heuristic (\"possible Feature Envy\"), never a hard violation — and, like any standard here, skip anything tooling already enforces.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-42\" data-line=\"42\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-43\" data-line=\"43\">Each smell reads *what it is* → *how to fix*; match it against the diff:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-44\" data-line=\"44\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-45\" data-line=\"45\">- **Mysterious Name** — a function, variable, or type whose name doesn't reveal what it does or holds. → rename it; if no honest name comes, the design's murky.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-46\" data-line=\"46\">- **Duplicated Code** — the same logic shape appears in more than one hunk or file in the change. → extract the shared shape, call it from both.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-47\" data-line=\"47\">- **Feature Envy** — a method that reaches into another object's data more than its own. → move the method onto the data it envies.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-48\" data-line=\"48\">- **Data Clumps** — the same few fields or params keep travelling together (a type wanting to be born). → bundle them into one type, pass that.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-49\" data-line=\"49\">- **Primitive Obsession** — a primitive or string standing in for a domain concept that deserves its own type. → give the concept its own small type.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-50\" data-line=\"50\">- **Repeated Switches** — the same `switch`/`if`-cascade on the same type recurs across the change. → replace with polymorphism, or one map both sites share.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-51\" data-line=\"51\">- **Shotgun Surgery** — one logical change forces scattered edits across many files in the diff. → gather what changes together into one module.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-52\" data-line=\"52\">- **Divergent Change** — one file or module is edited for several unrelated reasons. → split so each module changes for one reason.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-53\" data-line=\"53\">- **Speculative Generality** — abstraction, parameters, or hooks added for needs the spec doesn't have. → delete it; inline back until a real need shows.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-54\" data-line=\"54\">- **Message Chains** — long `a.b().c().d()` navigation the caller shouldn't depend on. → hide the walk behind one method on the first object.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-55\" data-line=\"55\">- **Middle Man** — a class or function that mostly just delegates onward. → cut it, call the real target direct.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-56\" data-line=\"56\">- **Refused Bequest** — a subclass or implementer that ignores or overrides most of what it inherits. → drop the inheritance, use composition.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-57\" data-line=\"57\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-58\" data-line=\"58\">### 4. Spawn both sub-agents in parallel\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-59\" data-line=\"59\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-60\" data-line=\"60\">**Standards sub-agent prompt** — include:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-61\" data-line=\"61\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-62\" data-line=\"62\">- The full diff command and commit list.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-63\" data-line=\"63\">- The list of standards-source files you found in step 3, **plus the smell baseline from step 3** pasted in full — the sub-agent has no other access to it.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-64\" data-line=\"64\">- The brief: \"Report — per file/hunk where relevant — (a) every place the diff violates a documented standard: cite the standard (file + the rule); and (b) any baseline smell you spot: name it and quote the hunk. Distinguish hard violations from judgement calls — documented-standard breaches can be hard, but baseline smells are always judgement calls, and a documented repo standard overrides the baseline. Skip anything tooling enforces. Under 400 words.\"\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-65\" data-line=\"65\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-66\" data-line=\"66\">**Spec sub-agent prompt** — include:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-67\" data-line=\"67\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-68\" data-line=\"68\">- The diff command and commit list.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-69\" data-line=\"69\">- The path or fetched contents of the spec.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-70\" data-line=\"70\">- The brief: \"Report: (a) requirements the spec asked for that are missing or partial; (b) behaviour in the diff that wasn't asked for (scope creep); (c) requirements that look implemented but where the implementation looks wrong. Quote the spec line for each finding. Under 400 words.\"\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-71\" data-line=\"71\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-72\" data-line=\"72\">If the spec is missing, skip the Spec sub-agent and note this in the final report.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-73\" data-line=\"73\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-74\" data-line=\"74\">### 5. Aggregate\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-75\" data-line=\"75\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-76\" data-line=\"76\">Present the two reports under `## Standards` and `## Spec` headings, verbatim or lightly cleaned. Do **not** merge or rerank findings — the two axes are deliberately separate (see _Why two axes_).\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-77\" data-line=\"77\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-78\" data-line=\"78\">End with a one-line summary: total findings per axis, and the worst issue _within each axis_ (if any). Don't pick a single winner across axes — that's the reranking the separation exists to prevent.\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-79\" data-line=\"79\">\u003c/span>\n              \u003cspan class=\"source-line annotated\" id=\"code-review-source-line-80\" data-line=\"80\">## Why two axes\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-81\" data-line=\"81\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-82\" data-line=\"82\">A change can pass one axis and fail the other:\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-83\" data-line=\"83\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-84\" data-line=\"84\">- Code that follows every standard but implements the wrong thing → **Standards pass, Spec fail.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-85\" data-line=\"85\">- Code that does exactly what the issue asked but breaks the project's conventions → **Spec pass, Standards fail.**\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-86\" data-line=\"86\">\u003c/span>\n              \u003cspan class=\"source-line\" id=\"code-review-source-line-87\" data-line=\"87\">Reporting them separately stops one axis from masking the other.\u003c/span>\n            \u003c/code>\u003c/pre>\n            \u003caside class=\"margin-rail\" aria-label=\"Teacher comments on code-review\">\n            \u003cdiv class=\"margin-comment\" style=\"--line: 3\" aria-labelledby=\"code-review-source-line-3\">\n              \u003cspan class=\"margin-marker\">01\u003c/span>\u003cstrong>The description is unusually complete\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-3\">Line 3\u003c/a> · It names the artifact, both questions, the parallel mechanism, and the requests that should trigger the skill.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 6\" aria-labelledby=\"code-review-source-line-6\">\n              \u003cspan class=\"margin-marker\">02\u003c/span>\u003cstrong>Two independent questions\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-6\">Line 6\u003c/a> · Engineering quality and specification fidelity can disagree. The rest of the file protects that disagreement.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 17\" aria-labelledby=\"code-review-source-line-17\">\n              \u003cspan class=\"margin-marker\">03\u003c/span>\u003cstrong>Freeze the review target\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-17\">Line 17\u003c/a> · Both reviewers must examine the same merge-base diff. Invalid or empty input fails before parallel work begins.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 25\" aria-labelledby=\"code-review-source-line-25\">\n              \u003cspan class=\"margin-marker\">04\u003c/span>\u003cstrong>Recover requested intent\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-25\">Line 25\u003c/a> · The spec search has an explicit order and an honest fallback: skip that axis only after confirming no spec exists.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 34\" aria-labelledby=\"code-review-source-line-34\">\n              \u003cspan class=\"margin-marker\">05\u003c/span>\u003cstrong>Local standards come first\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-34\">Line 34\u003c/a> · Repository rules override the built-in smell list; smells remain judgment calls and tooling-owned checks are omitted.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 43\" aria-labelledby=\"code-review-source-line-43\">\n              \u003cspan class=\"margin-marker\">06\u003c/span>\u003cstrong>Reference embedded in the skill\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-43\">Line 43\u003c/a> · The smell catalog is shared review vocabulary. It gives the standards reviewer a baseline when local documentation is thin.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 58\" aria-labelledby=\"code-review-source-line-58\">\n              \u003cspan class=\"margin-marker\">07\u003c/span>\u003cstrong>Context isolation is the mechanism\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-58\">Line 58\u003c/a> · Each sub-agent receives one evidence bundle and one question, so success on one axis cannot bias the other.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 74\" aria-labelledby=\"code-review-source-line-74\">\n              \u003cspan class=\"margin-marker\">08\u003c/span>\u003cstrong>Do not blend at the end\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-74\">Line 74\u003c/a> · The aggregator preserves separate reports and summaries. A single overall ranking would undo the entire design.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"margin-comment\" style=\"--line: 80\" aria-labelledby=\"code-review-source-line-80\">\n              \u003cspan class=\"margin-marker\">09\u003c/span>\u003cstrong>The crossed cases explain why\u003c/strong>\n              \u003cp>\u003ca href=\"#code-review-source-line-80\">Line 80\u003c/a> · Standards can pass while Spec fails, or the reverse. These examples are also the clearest behavior test for the skill.\u003c/p>\n            \u003c/div>\n            \u003c/aside>\n          \u003c/div>\n        \u003c/article>\n\n        \u003cdiv class=\"case-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton id=\"case-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton id=\"case-skip\" type=\"button\">Skip case\u003c/button>\n          \u003c/div>\n          \u003cspan class=\"case-status\" id=\"case-status\" aria-live=\"polite\">Case 1 of 3\u003c/span>\n          \u003cdiv class=\"case-nav-next\">\n            \u003cbutton class=\"primary-button\" id=\"case-next\" type=\"button\">Next case →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdetails class=\"license-note\">\n        \u003csummary>License for the reproduced skill files\u003c/summary>\n        \u003cpre>MIT License\n\nCopyright (c) 2026 Matt Pocock\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\u003c/pre>\n      \u003c/details>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">45–50 minutes\u003c/span>\n      \u003ch2 id=\"cross-case-patterns\">3. Compare the mechanisms, not the prose\u003c/h2>\n      \u003cp>The cases look different because each one controls a different source of variance. The shared architecture becomes clearest in a matrix.\u003c/p>\n\n      \u003cdiv class=\"matrix-wrap\">\n        \u003cdiv class=\"matrix\" role=\"table\" aria-label=\"Cross-case comparison\">\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">Lens\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>ask-matt\u003c/code>\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>diagnosing-bugs\u003c/code>\u003c/div>\n          \u003cdiv class=\"matrix-head\" role=\"columnheader\">\u003ccode>code-review\u003c/code>\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Variance controlled\u003c/div>\n          \u003cdiv role=\"cell\">Route selection\u003c/div>\n          \u003cdiv role=\"cell\">Premature causal confidence\u003c/div>\n          \u003cdiv role=\"cell\">One criterion masking another\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Primary mechanism\u003c/div>\n          \u003cdiv role=\"cell\">Explicit handoff map\u003c/div>\n          \u003cdiv role=\"cell\">Ordered gates around a feedback loop\u003c/div>\n          \u003cdiv role=\"cell\">Independent contexts, then aggregation\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Invocation cost\u003c/div>\n          \u003cdiv role=\"cell\">Human must remember to ask\u003c/div>\n          \u003cdiv role=\"cell\">Model carries a trigger pointer\u003c/div>\n          \u003cdiv role=\"cell\">Model carries a detailed review pointer\u003c/div>\n\n          \u003cdiv class=\"row-head\" role=\"rowheader\">Fragile edge\u003c/div>\n          \u003cdiv role=\"cell\">Map can drift from child files\u003c/div>\n          \u003cdiv role=\"cell\">Heavy process can become ritual\u003c/div>\n          \u003cdiv role=\"cell\">Depends on recoverable source documents\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout gold\">\n        \u003cspan class=\"label\">The synthesis\u003c/span>\n        \u003cp>“A skill is a behavioral contract” now has three concrete meanings: \u003ccode>ask-matt\u003c/code> constrains the \u003cem>handoff\u003c/em>, \u003ccode>diagnosing-bugs\u003c/code> constrains the \u003cem>order of belief\u003c/em>, and \u003ccode>code-review\u003c/code> constrains the \u003cem>separation of judgment\u003c/em>.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">50–59 minutes\u003c/span>\n      \u003ch2 id=\"transfer-lab\">4. Fresh file: reconstruct \u003ccode>tdd\u003c/code>\u003c/h2>\n      \u003cp>No walkthrough this time. The current file describes a model-discoverable reference for a red → green loop, asks the learner to agree testing seams first, discloses examples and mocking guidance, and forbids horizontal slicing. Use the trace yourself.\u003c/p>\n\n      \u003cdiv class=\"lab\" id=\"tdd-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"tdd-reconstruction\">Build the trace\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"tdd-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"tdd-nav\" role=\"tablist\" aria-label=\"TDD case questions\">\u003c/div>\n        \u003cp class=\"quiz-kicker\" id=\"tdd-kicker\">\u003c/p>\n        \u003cp class=\"quiz-prompt\" id=\"tdd-prompt\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"tdd-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"tdd-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton id=\"tdd-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton id=\"tdd-skip\" type=\"button\">Skip\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"primary-button\" id=\"tdd-check\" type=\"button\" disabled>Check\u003c/button>\n            \u003cbutton class=\"primary-button\" id=\"tdd-next\" type=\"button\">Next →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">59–65 minutes\u003c/span>\n      \u003ch2 id=\"borrowing-ledger\">5. Revise the borrowing ledger\u003c/h2>\n      \u003cp>You are deciding about mechanisms, not endorsing whole files. Your choices persist locally.\u003c/p>\n\n      \u003cdiv class=\"ledger\" id=\"ledger\">\n        \u003cdiv class=\"ledger-item\" data-principle=\"router\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-router\">A router that performs no downstream work\u003c/h3>\n            \u003cp>Useful when humans face a dense library; fragile when its map becomes a second source of truth.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for router mechanism\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"gate\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-gate\">A hard gate before expensive reasoning\u003c/h3>\n            \u003cp>Prevents premature confidence; needs an escape clause precise enough not to swallow the rule.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for completion gate\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"isolation\">\n          \u003cdiv>\n            \u003ch3 id=\"ledger-isolation\">Separate contexts for independent judgments\u003c/h3>\n            \u003cp>Protects evidence boundaries when one attractive result could bias the other.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-choices\" role=\"group\" aria-label=\"Decision for context isolation\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adopt\" aria-pressed=\"false\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"adapt\" aria-pressed=\"false\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-decision=\"reject\" aria-pressed=\"false\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-footer\">\n          \u003cspan class=\"ledger-summary\" id=\"ledger-summary\">0 of 3 decided\u003c/span>\n          \u003cbutton id=\"ledger-reset\" type=\"button\">Reset choices\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003cspan class=\"label\">Course result\u003c/span>\n        \u003cp>You can now move in both directions: from a file back to its hidden design decisions, and from a recurring failure forward to a skill whose interface, information, gates, and tests are deliberate.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"source-notes\">Source notes\u003c/h2>\n      \u003cp class=\"source-note\">This session was checked against the public repository on August 11, 2026. Section 2 reproduces each case file in full and without rewriting; the accompanying margin comments are ours.\u003c/p>\n      \u003cul class=\"source-note\">\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\">\u003ccode>ask-matt/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\">\u003ccode>diagnosing-bugs/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\">\u003ccode>code-review/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\">\u003ccode>tdd/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_PREFIX = \"mattpocock-skills:session3:\";\n\n    function loadState(key, fallback) {\n      try {\n        const saved = localStorage.getItem(STORAGE_PREFIX + key);\n        return saved ? JSON.parse(saved) : fallback;\n      } catch (error) {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));\n      } catch (error) {\n        // The lesson remains usable when storage is unavailable.\n      }\n    }\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const percent = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      document.querySelector(\"#progress-bar\").style.width = `${Math.min(100, percent)}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    window.addEventListener(\"resize\", updateProgress);\n    updateProgress();\n\n    const mapRouteNotes = {\n      all: \"The whole portfolio is visible. Each card states the skill’s goal; choose a starting situation to reveal one route through the system.\",\n      idea: \"Idea route: sharpen the idea, detour through a handoff and prototype only when a runnable answer is needed, then specify, ticket, implement test-first, and review.\",\n      incoming: \"Incoming-work route: triage only raw issues you did not create, then hand an agent-ready issue to implementation, TDD, and two-axis review.\",\n      bug: \"Bug route: diagnose from a red-capable feedback loop, fix with a regression test, then inspect architecture only if the bug exposed a weak seam.\",\n      fog: \"Foggy-effort route: use wayfinder to resolve decision tickets, collapse the resulting map into a spec, then ticket and implement normally.\"\n    };\n    const mapRouteState = loadState(\"skill-system-map\", { route: \"all\" });\n    const mapRouteButtons = Array.from(document.querySelectorAll(\"[data-map-route]\"));\n    const mapSkillNodes = Array.from(document.querySelectorAll(\"[data-skill-map-node]\"));\n    const mapRouteNote = document.querySelector(\"#map-route-note\");\n\n    function showMapRoute(route) {\n      const nextRoute = mapRouteNotes[route] ? route : \"all\";\n      mapRouteState.route = nextRoute;\n      saveState(\"skill-system-map\", mapRouteState);\n\n      mapRouteButtons.forEach((button) => {\n        button.setAttribute(\"aria-pressed\", String(button.dataset.mapRoute === nextRoute));\n      });\n\n      mapSkillNodes.forEach((node) => {\n        const routes = (node.dataset.routes || \"\").split(\" \").filter(Boolean);\n        const active = nextRoute !== \"all\" && routes.includes(nextRoute);\n        node.classList.toggle(\"is-active\", active);\n        node.classList.toggle(\"is-muted\", nextRoute !== \"all\" && !active);\n      });\n\n      mapRouteNote.textContent = mapRouteNotes[nextRoute];\n    }\n\n    mapRouteButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => showMapRoute(button.dataset.mapRoute));\n    });\n\n    showMapRoute(mapRouteState.route);\n\n    const caseState = loadState(\"case-workbench\", { index: 0, skipped: {} });\n    const caseTabs = Array.from(document.querySelectorAll(\"[data-case-index]\"));\n    const casePanels = Array.from(document.querySelectorAll(\"[data-case-panel]\"));\n    const caseStatus = document.querySelector(\"#case-status\");\n    const casePrevious = document.querySelector(\"#case-prev\");\n    const caseSkip = document.querySelector(\"#case-skip\");\n    const caseNext = document.querySelector(\"#case-next\");\n    let caseIndex = Math.min(Math.max(0, Number(caseState.index) || 0), casePanels.length - 1);\n\n    function positionMarginComments() {\n      const compactLayout = window.matchMedia(\"(max-width: 650px)\").matches;\n      const activePanel = casePanels[caseIndex];\n      const layout = activePanel.querySelector(\".manuscript-layout\");\n      const rail = layout.querySelector(\".margin-rail\");\n      const comments = Array.from(rail.querySelectorAll(\".margin-comment\"));\n\n      rail.style.minHeight = \"\";\n      comments.forEach((comment) => comment.style.removeProperty(\"--note-top\"));\n      if (compactLayout) return;\n\n      const layoutTop = layout.getBoundingClientRect().top;\n      let nextAvailableTop = 0;\n      comments.forEach((comment) => {\n        const target = document.querySelector(`#${comment.getAttribute(\"aria-labelledby\")}`);\n        const targetTop = target.getBoundingClientRect().top - layoutTop;\n        const noteTop = Math.max(targetTop, nextAvailableTop);\n        comment.style.setProperty(\"--note-top\", `${noteTop}px`);\n        nextAvailableTop = noteTop + comment.offsetHeight + 12;\n      });\n\n      const manuscriptHeight = layout.querySelector(\".skill-manuscript\").offsetHeight;\n      if (nextAvailableTop > manuscriptHeight) rail.style.minHeight = `${nextAvailableTop}px`;\n    }\n\n    function showCase(nextIndex) {\n      caseIndex = Math.min(Math.max(0, nextIndex), casePanels.length - 1);\n      caseState.index = caseIndex;\n      saveState(\"case-workbench\", caseState);\n\n      caseTabs.forEach((tab, index) => {\n        const active = index === caseIndex;\n        tab.setAttribute(\"aria-selected\", String(active));\n        tab.tabIndex = active ? 0 : -1;\n      });\n\n      casePanels.forEach((panel, index) => {\n        panel.hidden = index !== caseIndex;\n      });\n\n      casePrevious.disabled = caseIndex === 0;\n      caseNext.textContent = caseIndex === casePanels.length - 1 ? \"Return to first case ↺\" : \"Next case →\";\n      const skipped = caseState.skipped[caseIndex] ? \" · marked skipped\" : \"\";\n      caseStatus.textContent = `Case ${caseIndex + 1} of ${casePanels.length}${skipped}`;\n      requestAnimationFrame(positionMarginComments);\n    }\n\n    caseTabs.forEach((tab) => {\n      tab.addEventListener(\"click\", () => showCase(Number(tab.dataset.caseIndex)));\n    });\n\n    casePrevious.addEventListener(\"click\", () => showCase(caseIndex - 1));\n    caseSkip.addEventListener(\"click\", () => {\n      caseState.skipped[caseIndex] = true;\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n    caseNext.addEventListener(\"click\", () => {\n      const nextIndex = caseIndex === casePanels.length - 1 ? 0 : caseIndex + 1;\n      showCase(nextIndex);\n    });\n\n    window.addEventListener(\"resize\", () => requestAnimationFrame(positionMarginComments));\n    if (document.fonts?.ready) document.fonts.ready.then(positionMarginComments);\n\n    showCase(caseIndex);\n\n    const tddItems = [\n      {\n        shortLabel: \"Shape\",\n        kicker: \"Trace 1 · Interface\",\n        prompt: \"The file supplies rules, anti-patterns, and vocabulary for a loop that another skill can drive. Which profile best explains it?\",\n        options: [\n          { label: \"Human-invoked router\", tip: \"A router chooses among child skills and hands off; tdd instead defines one reusable engineering discipline.\" },\n          { label: \"Model-invoked reference + discipline\", tip: \"Its trigger is discoverable, and its contents guide every red-green cycle without being a one-off ceremony.\" },\n          { label: \"Environment-only source\", tip: \"The repository supplies test commands, but the behavioral rules and anti-patterns are not cheaply recoverable facts.\" },\n          { label: \"User-invoked orchestrator\", tip: \"The file has no human-only invocation marker and does not mainly coordinate a chain of user-selected sessions.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Yes. Invocation and content shape are independent axes: model-discoverable, with both reference and repeatable discipline.\",\n        retryFeedback: \"Separate who can retrieve the skill from whether its body is steps, reference, or orchestration.\"\n      },\n      {\n        shortLabel: \"Pointer\",\n        kicker: \"Trace 2 · Trigger\",\n        prompt: \"Which request should most reliably retrieve the current tdd skill?\",\n        options: [\n          { label: \"Explain why my test is flaky.\", tip: \"An explanation request may need diagnosis, but it does not necessarily ask to build or fix test-first.\" },\n          { label: \"Add checkout support test-first, one red-green slice at a time.\", tip: \"Combines a build request with explicit test-first and red-green language from the trigger.\" },\n          { label: \"Review this branch against main.\", tip: \"That maps directly to code-review and a fixed-point comparison.\" },\n          { label: \"Which engineering workflow should I use?\", tip: \"That is the human-invoked router's job.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Correct. The request hits both the material and a distinct trigger branch, leaving little retrieval ambiguity.\",\n        retryFeedback: \"Look for a request that names building behavior and the loop this skill exists to constrain.\"\n      },\n      {\n        shortLabel: \"Layer\",\n        kicker: \"Trace 3 · Placement\",\n        prompt: \"The project’s exact test command changes from npm test to make verify. Where should the current command live?\",\n        options: [\n          { label: \"Inline in tdd/SKILL.md\", tip: \"That would turn a reusable discipline into a stale cache of one repository's configuration.\" },\n          { label: \"In tests.md beside conceptual examples\", tip: \"Moving a volatile project fact into disclosed reference still creates a second source of truth.\" },\n          { label: \"In the project environment\", tip: \"package.json, Makefile, repository instructions, or help output can own the current command.\" },\n          { label: \"Repeat it in every loop rule\", tip: \"Repetition raises prominence but multiplies maintenance and context cost.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Exactly. Keep the invariant process in the skill and recover the volatile command from its authoritative project source.\",\n        retryFeedback: \"Apply the cache test from Session 2: can the agent cheaply recover the current value from its real owner?\"\n      },\n      {\n        shortLabel: \"Test\",\n        kicker: \"Trace 4 · Evidence\",\n        prompt: \"How would you test whether the ban on horizontal slicing changes behavior?\",\n        options: [\n          { label: \"Ask whether the rule sounds persuasive.\", tip: \"Editorial confidence does not show a behavioral effect.\" },\n          { label: \"Compare the same multi-behavior task with and without that rule; count whether cycles stay one test → minimal implementation.\", tip: \"Only the disputed line changes, and the target behavior is observable across the run.\" },\n          { label: \"Count the number of tests at the end.\", tip: \"Both horizontal and vertical approaches can produce the same test count while behaving differently.\" },\n          { label: \"Check whether all tests pass once.\", tip: \"A green suite does not reveal the order in which tests and behavior were developed.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Right. This counterfactual observes process order, the behavior the sentence claims to control.\",\n        retryFeedback: \"Choose a comparison that isolates one sentence and measures the behavior named by that sentence.\"\n      }\n    ];\n\n    function createStepper(config) {\n      const state = loadState(config.storageKey, { index: 0, answers: {} });\n      let index = Math.min(Math.max(0, Number(state.index) || 0), config.items.length - 1);\n      let selected = null;\n\n      const nav = document.querySelector(config.nav);\n      const count = document.querySelector(config.count);\n      const kicker = document.querySelector(config.kicker);\n      const prompt = document.querySelector(config.prompt);\n      const choices = document.querySelector(config.choices);\n      const feedback = document.querySelector(config.feedback);\n      const previous = document.querySelector(config.previous);\n      const skip = document.querySelector(config.skip);\n      const check = document.querySelector(config.check);\n      const next = document.querySelector(config.next);\n\n      function renderNav() {\n        nav.replaceChildren();\n        config.items.forEach((item, itemIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"step-pill\";\n          button.textContent = item.shortLabel;\n          if (itemIndex === index) button.classList.add(\"active\");\n          const answer = state.answers[itemIndex];\n          if (answer?.correct) button.classList.add(\"correct\");\n          else if (answer?.checked) button.classList.add(\"answered\");\n          button.setAttribute(\"role\", \"tab\");\n          button.setAttribute(\"aria-selected\", String(itemIndex === index));\n          button.addEventListener(\"click\", () => goTo(itemIndex));\n          nav.append(button);\n        });\n      }\n\n      function render() {\n        const item = config.items[index];\n        const answer = state.answers[index];\n        selected = answer?.selected ?? null;\n        count.textContent = `${index + 1} / ${config.items.length}`;\n        kicker.textContent = item.kicker;\n        prompt.textContent = item.prompt;\n        previous.disabled = index === 0;\n        next.textContent = index === config.items.length - 1 ? \"Finish\" : \"Next →\";\n        check.disabled = selected === null;\n        choices.replaceChildren();\n\n        item.options.forEach((option, optionIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option.label;\n          button.dataset.tip = option.tip;\n          button.setAttribute(\"aria-label\", `${option.label}. ${option.tip}`);\n          button.setAttribute(\"aria-pressed\", String(optionIndex === selected));\n          if (optionIndex === selected) button.classList.add(\"selected\");\n          if (answer?.checked && optionIndex === item.answer) button.classList.add(\"correct-answer\");\n          button.addEventListener(\"click\", () => selectOption(optionIndex));\n          choices.append(button);\n        });\n\n        if (answer?.checked) {\n          feedback.className = `feedback visible ${answer.correct ? \"correct\" : \"retry\"}`;\n          feedback.textContent = answer.correct ? item.correctFeedback : item.retryFeedback;\n        } else {\n          feedback.className = \"feedback\";\n          feedback.textContent = \"\";\n        }\n        renderNav();\n      }\n\n      function selectOption(optionIndex) {\n        selected = optionIndex;\n        state.answers[index] = { selected, checked: false, correct: false };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function checkAnswer() {\n        if (selected === null) return;\n        const item = config.items[index];\n        state.answers[index] = { selected, checked: true, correct: selected === item.answer };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function goTo(nextIndex) {\n        index = nextIndex;\n        state.index = index;\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      previous.addEventListener(\"click\", () => {\n        if (index > 0) goTo(index - 1);\n      });\n      skip.addEventListener(\"click\", () => goTo((index + 1) % config.items.length));\n      check.addEventListener(\"click\", checkAnswer);\n      next.addEventListener(\"click\", () => {\n        if (index \u003c config.items.length - 1) {\n          goTo(index + 1);\n          return;\n        }\n        const correctCount = config.items.filter((item, itemIndex) => state.answers[itemIndex]?.correct).length;\n        feedback.className = \"feedback visible correct\";\n        feedback.textContent = correctCount === config.items.length\n          ? \"Trace complete: shape, pointer, placement, and behavior test all reconstructed from a fresh file.\"\n          : `You reached the end with ${correctCount} of ${config.items.length} decisions resolved. Use the step pills to revisit any case.`;\n      });\n\n      render();\n    }\n\n    createStepper({\n      storageKey: \"tdd-transfer\",\n      items: tddItems,\n      nav: \"#tdd-nav\",\n      count: \"#tdd-count\",\n      kicker: \"#tdd-kicker\",\n      prompt: \"#tdd-prompt\",\n      choices: \"#tdd-choices\",\n      feedback: \"#tdd-feedback\",\n      previous: \"#tdd-prev\",\n      skip: \"#tdd-skip\",\n      check: \"#tdd-check\",\n      next: \"#tdd-next\"\n    });\n\n    const ledgerItems = Array.from(document.querySelectorAll(\".ledger-item\"));\n    const ledgerState = loadState(\"borrowing-ledger\", {});\n    const ledgerSummary = document.querySelector(\"#ledger-summary\");\n\n    function renderLedger() {\n      ledgerItems.forEach((item) => {\n        const decision = ledgerState[item.dataset.principle];\n        item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n          button.setAttribute(\"aria-pressed\", String(button.dataset.decision === decision));\n        });\n      });\n      const decisions = Object.values(ledgerState);\n      const counts = { adopt: 0, adapt: 0, reject: 0 };\n      decisions.forEach((decision) => {\n        if (counts[decision] !== undefined) counts[decision] += 1;\n      });\n      ledgerSummary.textContent = `${decisions.length} of ${ledgerItems.length} decided · ${counts.adopt} adopt · ${counts.adapt} adapt · ${counts.reject} reject`;\n    }\n\n    ledgerItems.forEach((item) => {\n      item.querySelectorAll(\".ledger-choice\").forEach((button) => {\n        button.addEventListener(\"click\", () => {\n          ledgerState[item.dataset.principle] = button.dataset.decision;\n          saveState(\"borrowing-ledger\", ledgerState);\n          renderLedger();\n        });\n      });\n    });\n\n    document.querySelector(\"#ledger-reset\").addEventListener(\"click\", () => {\n      Object.keys(ledgerState).forEach((key) => delete ledgerState[key]);\n      saveState(\"borrowing-ledger\", ledgerState);\n      renderLedger();\n    });\n\n    renderLedger();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"}],"conversations":[{"id":"019feb4c-29a4-7b30-8978-031c7097e12f","title":"I think a good idea to extend this course is to add ano…","createdAt":"2026-08-11T01:34:27.376Z","updatedAt":"2026-08-11T06:48:49.719Z","turns":[{"id":"019fee72-dce3-74d1-baa9-ce83239d0fe2","prompt":"You should generally provide the links to the original text of those skills in section 2. And also, you need to leave spaces for the navigation buttons in section two, like previous, skip, and next case.","response":"我会只调整 Session 3 的第 2 节：在每个案例标题旁加入对应 `SKILL.md` 原文链接，并把 Previous / Skip / Next 做成有足够上下留白的独立导航区。这里会沿用现有网页的设计规范，不改课程语言或其他章节。\n\n已更新 [session3.html 第 2 节](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session3.html#case-files)：\n\n- 三个案例标题下都加入了原始 `SKILL.md` 链接。\n- Previous、Skip case、Next case 现在位于独立导航区域，拥有固定列位和更充足的上下留白。\n- 移动端会自动改为纵向排列。\n- 已验证链接、控件及原有交互脚本正常。","reasoning":[],"createdAt":"2026-08-11T01:34:27.376Z"},{"id":"019fef64-0ed7-78c0-8838-587ce3e36c44","prompt":"I just don't know what those sections are talking about. Could you use simpler words that read naturally?","response":"I’ll rewrite only the four selected rows in the `ask-matt` case. I’ll replace the abstract labels and jargon with four plain questions: what it is, when to use it, where its details come from, and when it is finished.\n\nRewrote the selected `ask-matt` table in [Session 3](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session3.html#ask-matt-case).\n\nThe four rows now answer naturally:\n\n- What is it?\n- When do I use it?\n- Where are the details?\n- When is it finished?\n\nThe surrounding cases and interactions remain unchanged.","reasoning":[],"createdAt":"2026-08-11T05:56:24.500Z"},{"id":"019fef65-04c9-7cb1-9ebb-0b7f49f7d5e5","prompt":"that's not a good way to learn","response":"You’re right—the current layout asks you to trust my abstraction before you have seen the thing being analyzed. I’ll invert it: source first, annotation second. Each card will follow the complete skill in its original order, keep every substantive part visible, and place plain-language notes directly beside the passage they explain.\n\nThe new structure is now source-led rather than interpretation-led. I’m preserving each file’s full sequence—including branches, gates, prerequisites, and handoffs—while placing explanations beside the relevant part instead of before it.\n\nReworked [Session 3, Section 2](/Users/zhenghe/.courses/i-want-to-learn-something-about-the-mattpocock-s-skill/session3.html#case-files) into source-first annotated readers.\n\nEach card now:\n\n- Follows the complete skill from top to bottom.\n- Places plain-language notes beside the exact part being discussed.\n- Preserves branches, prerequisites, gates, and handoffs.\n- Keeps the official source immediately accessible: [`ask-matt`](https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md), [`diagnosing-bugs`](https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md), and [`code-review`](https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md).\n- Retains the spacious Previous / Skip / Next navigation area.\n\nThe earlier summary tables, causal strips, and lens toggles were removed. Longer source passages are closely restated; important lines are quoted directly.","reasoning":[],"createdAt":"2026-08-11T06:02:12.079Z"},{"id":"019fef6c-a92a-7321-97a0-3cde7c766ce8","prompt":"Is it possible to just show the whole original skill text directly and with your comments besides that? The current display method still hides the structure of the skill. Just like what you have when a teacher is commenting on the student's prose","response":"I’ll check the repository’s license before answering, because the exact “full original text plus margin comments” design depends on whether the skill files can be republished inside the course. I’ll leave the course unchanged for this question.\n\nYes. The current version still replaces Matt’s structure with my structure, which is exactly the problem you’re noticing.\n\nA better design would show:\n\n- The complete, unmodified `SKILL.md` in one continuous left column—from frontmatter to the final line.\n- Its original headings, paragraphs, lists, code, and ordering.\n- Numbered teacher-style comments in the right margin, aligned with the exact passages they explain.\n- No rewritten headings, summaries, collapsed sections, or introductory interpretation.\n- On narrow screens, each margin comment would appear immediately below its referenced passage.\n- Previous / Skip / Next would remain in the reserved footer.\n\nThe repository uses the MIT License, so reproducing the full files is permitted as long as the copyright and permission notice accompany substantial copies. [Repository license](https://github.com/mattpocock/skills/blob/main/LICENSE)\n\nI have not changed the course for this question. I can apply this manuscript-with-margin-comments design to all three case cards.","reasoning":[],"createdAt":"2026-08-11T06:05:29.246Z"},{"id":"019fef6e-1d13-7bf2-9436-f59a8602f89b","prompt":"go ahead and do it","response":"I’m applying the manuscript layout now: each case will contain the complete, unmodified `SKILL.md` as one continuous document, with numbered margin comments aligned to the relevant lines. The case navigation will remain outside the manuscript so it stays easy to move between files.\n\nThe full texts are now in place. I’m checking that every displayed line matches the current upstream file exactly, and that the margin notes, license notice, and case navigation still work together.\n\nImplemented in [Session 3, Section 2](/Users/zhenghe/.courses/i-want-to-learn-something-about-th
