>\u003ccode>grilling/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/grill-with-docs/SKILL.md\">\u003ccode>grill-with-docs/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\">\u003ccode>tdd/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_KEY_ROLE = \"course-studio:quiz:session1:profile\";\n    const STORAGE_KEY_EVIDENCE = \"course-studio:quiz:session1:evidence\";\n    const STORAGE_KEY_LEDGER = \"course-studio:quiz:session1:ledger\";\n    const STORAGE_KEY_CASE_TAB = \"course-studio:quiz:session1:case-tab\";\n    const STORAGE_KEY_INVOCATION = \"course-studio:quiz:session1:invocation\";\n    const STORAGE_KEY_ANNOTATION = \"course-studio:quiz:session1:annotation\";\n\n    function loadSaved(key, fallback) {\n      try {\n        const raw = localStorage.getItem(key);\n        return raw ? JSON.parse(raw) : fallback;\n      } catch {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(key, JSON.stringify(value));\n      } catch {}\n    }\n\n    const roleCases = [\n      {\n        path: \"skills/engineering/grill-with-docs/SKILL.md\",\n        question: \"Profile this seven-line skill without forcing its invocation, content, and compositional job into one label.\",\n        profile: {\n          invocation: \"Human only\",\n          content: \"Step-led\",\n          composition: \"Wrapper\"\n        },\n        feedback: \"It is a human-only entry point containing one imperative step. Its system job is to wrap two model-discoverable dependencies.\",\n        excerpt: \"name: grill-with-docs\\ndisable-model-invocation: true\\n\\nRun a /grilling session, using the /domain-modeling skill.\",\n        outline: [\n          \"Frontmatter makes it a human-only entry point.\",\n          \"Its description promises an interview that also creates durable design documentation.\",\n          \"The body delegates the interview and domain-language behavior instead of repeating either one.\"\n        ]\n      },\n      {\n        path: \"skills/productivity/grilling/SKILL.md\",\n        question: \"Profile the skill that defines design trees, frontiers, rounds, fact-finding ownership, and a stopping condition.\",\n        profile: {\n          invocation: \"Model-discoverable\",\n          content: \"Step-led\",\n          composition: \"Primitive\"\n        },\n        feedback: \"It is model-discoverable, owns an execution loop, and supplies a reusable interview primitive to several workflows.\",\n        excerpt: \"name: grilling\\n\\nInterview the user relentlessly until you reach a shared understanding. Map this as a design tree.\",\n        outline: [\n          \"The model-facing description lists stress-testing and grill-language trigger branches.\",\n          \"A design tree represents dependent decisions; its frontier contains only questions whose prerequisites are settled.\",\n          \"The interaction proceeds in rounds, with a prescribed question format and a wait after each round.\",\n          \"The agent owns discoverable facts while the human owns decisions.\",\n          \"Completion requires an empty frontier and explicit user confirmation.\"\n        ]\n      },\n      {\n        path: \"skills/productivity/writing-for-agents/SKILL.md\",\n        question: \"Profile the skill invoked while writing or editing agent-facing documents. Remember: reference-led does not mean inactive.\",\n        profile: {\n          invocation: \"Model-discoverable\",\n          content: \"Reference-led\",\n          composition: \"Supporting guide\"\n        },\n        feedback: \"It is model-discoverable and actively guides writing, but its body is predominantly concepts, constraints, and criteria rather than an owned execution sequence.\",\n        excerpt: \"name: writing-for-agents\\n\\nEvery document and pointer you add spends one of two budgets: context load and cognitive load.\",\n        outline: [\n          \"Context pointers encode both what material exists and which branches should load it.\",\n          \"An information hierarchy separates in-file steps, in-file reference, and disclosed reference.\",\n          \"Completion criteria are evaluated for clarity and demand.\",\n          \"Leading words compress behavior by recruiting concepts the model already knows.\",\n          \"Pruning removes duplication, stale caches, irrelevant material, and instructions that do not change behavior.\",\n          \"Skill-only invocation mechanics are disclosed into a sibling reference file.\"\n        ]\n      },\n      {\n        path: \"skills/engineering/ask-matt/SKILL.md\",\n        question: \"Profile the manual skill that maps flows, on-ramps, vocabulary layers, phase boundaries, and standalone skills.\",\n        profile: {\n          invocation: \"Human only\",\n          content: \"Mixed\",\n          composition: \"Router\"\n        },\n        feedback: \"It is a human-only router. Its file mixes procedural routes with a reference catalog, which is exactly why one content label cannot describe its whole system role.\",\n        excerpt: \"name: ask-matt\\ndisable-model-invocation: true\\n\\nYou don't remember every skill, so ask.\",\n        outline: [\n          \"The main flow routes an idea through clarification, optional prototyping, specification, tickets, implementation, and review.\",\n          \"On-ramps handle incoming issues, hard bugs, and efforts too large for one session.\",\n          \"Separate sections route codebase health work, shared vocabulary, and phase-boundary decisions.\",\n          \"Standalone skills are cataloged when they do not belong to the main delivery flow.\",\n          \"The router points to manual skills but cannot invoke them on the human's behalf.\"\n        ]\n      }\n    ];\n\n    const profileAxes = [\n      {\n        key: \"invocation\",\n        label: \"1. Invocation — who can discover it?\",\n        options: [\"Human only\", \"Model-discoverable\"],\n        definitions: {\n          \"Human only\": \"Human only: The skill starts only when a person explicitly invokes it (disable-model-invocation: true). Its description is excluded from automatic model discovery.\",\n          \"Model-discoverable\": \"Model-discoverable: The model can discover it automatically from its description, another skill can invoke it, or a human can start it.\"\n        }\n      },\n      {\n        key: \"content\",\n        label: \"2. Content form — what dominates the file?\",\n        options: [\"Step-led\", \"Reference-led\", \"Mixed\"],\n        definitions: {\n          \"Step-led\": \"Step-led: Ordered actions, loops, gates, or stopping conditions dominate the file. The skill actively drives execution sequence.\",\n          \"Reference-led\": \"Reference-led: Definitions, rules, vocabulary, or quality criteria dominate. They guide work whose progression is owned elsewhere.\",\n          \"Mixed\": \"Mixed: Contains substantial procedure and substantial reference; neither is merely a supporting subsection.\"\n        }\n      },\n      {\n        key: \"composition\",\n        label: \"3. Composition — what system job does it perform?\",\n        options: [\"Router\", \"Wrapper\", \"Primitive\", \"Supporting guide\"],\n        definitions: {\n          \"Router\": \"Router: Maps flows and on-ramps. Helps a human choose the right skill but cannot invoke manual skills on their behalf.\",\n          \"Wrapper\": \"Wrapper: A thin entry point that delegates most behavior to other composed skills rather than duplicating instructions.\",\n          \"Primitive\": \"Primitive: A core reusable behavior/state machine (e.g. grilling interview) that several workflows can invoke.\",\n          \"Supporting guide\": \"Supporting guide: Shapes how another task is performed through methods and criteria without owning the full task lifecycle.\"\n        }\n      }\n    ];\n\n    const roleState = loadSaved(STORAGE_KEY_ROLE, { answers: {}, currentIndex: 0 });\n    let roleIndex = Math.min(Math.max(0, Number(roleState.currentIndex) || 0), roleCases.length - 1);\n    let profileSelections = roleState.answers[roleIndex]?.selections || {};\n\n    const roleNav = document.querySelector(\"#role-nav\");\n    const rolePath = document.querySelector(\"#role-path\");\n    const roleQuestion = document.querySelector(\"#role-question\");\n    const roleChoices = document.querySelector(\"#role-choices\");\n    const roleCheck = document.querySelector(\"#role-check\");\n    const roleFeedback = document.querySelector(\"#role-feedback\");\n    const rolePrev = document.querySelector(\"#role-prev\");\n    const roleSkip = document.querySelector(\"#role-skip\");\n    const roleNext = document.querySelector(\"#role-next\");\n    const roleCount = document.querySelector(\"#role-count\");\n    const roleSourceToggle = document.querySelector(\"#role-source-toggle\");\n    const roleSourcePreview = document.querySelector(\"#role-source-preview\");\n    const roleSourceLink = document.querySelector(\"#role-source-link\");\n    const roleSourceExcerpt = document.querySelector(\"#role-source-excerpt\");\n    const roleSourceOutline = document.querySelector(\"#role-source-outline\");\n\n    function renderRoleNav() {\n      roleNav.replaceChildren();\n      roleCases.forEach((_, idx) => {\n        const btn = document.createElement(\"button\");\n        btn.type = \"button\";\n        btn.className = \"quiz-nav-step\";\n        if (idx === roleIndex) btn.classList.add(\"active\");\n        const ans = roleState.answers[idx];\n        if (ans) {\n          if (ans.isCorrect) btn.classList.add(\"correct\");\n          else if (ans.checked) btn.classList.add(\"answered\");\n        }\n        btn.textContent = `Case ${idx + 1}`;\n        btn.setAttribute(\"aria-label\", `Jump to Case ${idx + 1}`);\n        btn.addEventListener(\"click\", () => {\n          roleIndex = idx;\n          roleState.currentIndex = idx;\n          saveState(STORAGE_KEY_ROLE, roleState);\n          renderRoleCase();\n        });\n        roleNav.append(btn);\n      });\n    }\n\n    function renderRoleSource(currentCase) {\n      roleSourceToggle.setAttribute(\"aria-expanded\", \"false\");\n      roleSourceToggle.textContent = \"Expand skill contents\";\n      roleSourcePreview.hidden = true;\n      roleSourceLink.href = `https://github.com/mattpocock/skills/blob/main/${currentCase.path}`;\n      roleSourceExcerpt.textContent = currentCase.excerpt;\n      roleSourceOutline.replaceChildren();\n\n      currentCase.outline.forEach((summary) => {\n        const item = document.createElement(\"li\");\n        item.textContent = summary;\n        roleSourceOutline.append(item);\n      });\n    }\n\n    function renderRoleCase() {\n      renderRoleNav();\n      const currentCase = roleCases[roleIndex];\n      const savedAnswer = roleState.answers[roleIndex];\n      profileSelections = savedAnswer ? { ...savedAnswer.selections } : {};\n\n      rolePath.textContent = currentCase.path;\n      roleQuestion.textContent = currentCase.question;\n      roleCount.textContent = `${roleIndex + 1} / ${roleCases.length}`;\n\n      rolePrev.disabled = roleIndex === 0;\n      roleNext.textContent = roleIndex === roleCases.length - 1 ? \"Finish\" : \"Next case →\";\n\n      if (savedAnswer && savedAnswer.checked) {\n        roleFeedback.className = `feedback visible ${savedAnswer.isCorrect ? \"correct\" : \"retry\"}`;\n        roleFeedback.textContent = savedAnswer.feedback;\n      } else {\n        roleFeedback.className = \"feedback\";\n        roleFeedback.textContent = \"\";\n      }\n\n      roleCheck.disabled = profileAxes.some((axis) => !profileSelections[axis.key]);\n      roleChoices.replaceChildren();\n      renderRoleSource(currentCase);\n\n      profileAxes.forEach((axis) => {\n        const fieldset = document.createElement(\"fieldset\");\n        fieldset.className = \"profile-axis\";\n\n        const legend = document.createElement(\"legend\");\n        legend.textContent = axis.label;\n        fieldset.append(legend);\n\n        const options = document.createElement(\"div\");\n        options.className = \"profile-options\";\n        options.dataset.axis = axis.key;\n\n        axis.options.forEach((option) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option;\n          button.dataset.help = axis.definitions[option];\n          button.setAttribute(\"aria-label\", `${option}: ${axis.definitions[option]}`);\n          const isSelected = profileSelections[axis.key] === option;\n          button.setAttribute(\"aria-pressed\", String(isSelected));\n          if (isSelected) button.classList.add(\"selected\");\n          button.addEventListener(\"click\", () => selectProfileOption(axis.key, option, button, options));\n          options.append(button);\n        });\n\n        fieldset.append(options);\n        roleChoices.append(fieldset);\n      });\n    }\n\n    function selectProfileOption(axisKey, option, button, optionsContainer) {\n      profileSelections[axisKey] = option;\n      optionsContainer.querySelectorAll(\"button\").forEach((choice) => {\n        choice.classList.toggle(\"selected\", choice === button);\n        choice.setAttribute(\"aria-pressed\", String(choice === button));\n      });\n      roleCheck.disabled = profileAxes.some((axis) => !profileSelections[axis.key]);\n      roleState.answers[roleIndex] = {\n        selections: profileSelections,\n        checked: false,\n        isCorrect: false,\n        feedback: \"\"\n      };\n      saveState(STORAGE_KEY_ROLE, roleState);\n      renderRoleNav();\n    }\n\n    roleSourceToggle.addEventListener(\"click\", () => {\n      const isExpanded = roleSourceToggle.getAttribute(\"aria-expanded\") === \"true\";\n      roleSourceToggle.setAttribute(\"aria-expanded\", String(!isExpanded));\n      roleSourceToggle.textContent = isExpanded ? \"Expand skill contents\" : \"Collapse skill contents\";\n      roleSourcePreview.hidden = isExpanded;\n    });\n\n    function checkRoleProfile() {\n      const currentCase = roleCases[roleIndex];\n      const mismatches = profileAxes.filter((axis) => profileSelections[axis.key] !== currentCase.profile[axis.key]);\n      const isCorrect = mismatches.length === 0;\n      const feedbackText = isCorrect\n        ? `Yes. ${currentCase.feedback}`\n        : `Revisit ${mismatches.map((axis) => axis.label.split(\" — \")[0].replace(/^\\d+\\. /, \"\").toLowerCase()).join(\" and \")}. The three answers describe different properties; none needs to replace another.`;\n\n      roleFeedback.className = `feedback visible ${isCorrect ? \"correct\" : \"retry\"}`;\n      roleFeedback.textContent = feedbackText;\n\n      roleState.answers[roleIndex] = {\n        selections: { ...profileSelections },\n        checked: true,\n        isCorrect,\n        feedback: feedbackText\n      };\n      saveState(STORAGE_KEY_ROLE, roleState);\n      renderRoleNav();\n    }\n\n    roleCheck.addEventListener(\"click\", checkRoleProfile);\n\n    rolePrev.addEventListener(\"click\", () => {\n      if (roleIndex > 0) {\n        roleIndex -= 1;\n        roleState.currentIndex = roleIndex;\n        saveState(STORAGE_KEY_ROLE, roleState);\n        renderRoleCase();\n      }\n    });\n\n    roleSkip.addEventListener(\"click\", () => {\n      roleIndex = (roleIndex + 1) % roleCases.length;\n      roleState.currentIndex = roleIndex;\n      saveState(STORAGE_KEY_ROLE, roleState);\n      renderRoleCase();\n    });\n\n    roleNext.addEventListener(\"click\", () => {\n      if (roleIndex \u003c roleCases.length - 1) {\n        roleIndex += 1;\n        roleState.currentIndex = roleIndex;\n        saveState(STORAGE_KEY_ROLE, roleState);\n        renderRoleCase();\n      } else {\n        const allCorrect = roleCases.every((_, idx) => roleState.answers[idx]?.isCorrect);\n        roleFeedback.className = `feedback visible ${allCorrect ? \"correct\" : \"\"}`;\n        roleFeedback.textContent = allCorrect\n          ? \"All cases mastered! Invocation, content form, and composition are independent axes.\"\n          : \"You've reached the end of the cases. Click any Case tab above to review or update your answers.\";\n      }\n    });\n\n    const caseStudies = {\n      wrapper: {\n        title: \"Thin wrapper: grill-with-docs\",\n        path: \"skills/engineering/grill-with-docs/SKILL.md\",\n        code: \"disable-model-invocation: true\\n\\nRun a /grilling session, using /domain-modeling.\",\n        interface: \"A memorable manual entry point for a stateful planning interview.\",\n        behavior: \"Delegated. The interview algorithm and domain-document updates live elsewhere.\",\n        tension: \"Excellent single-source reuse; weak if dependency discovery or compatibility is poor.\"\n      },\n      primitive: {\n        title: \"Reusable primitive: grilling\",\n        path: \"skills/productivity/grilling/SKILL.md\",\n        code: \"design tree → frontier → round → recompute\\n\\ndone when: frontier empty + user confirms\",\n        interface: \"A model-invoked interview behavior that several workflows can reach.\",\n        behavior: \"A natural-language state machine with explicit scheduling and ownership rules.\",\n        tension: \"Precise exhaustion can prevent silent assumptions, but “every branch” may expand without bound.\"\n      },\n      discipline: {\n        title: \"Normative discipline: tdd\",\n        path: \"skills/engineering/tdd/SKILL.md\",\n        code: \"gate: agree the seams\\nloop: red → minimal green, one vertical slice\\nreference: tests.md + mocking.md\",\n        interface: \"A model-invoked body of rules for test-first implementation.\",\n        behavior: \"Combines gates, vocabulary, anti-patterns, a small loop, and disclosed examples.\",\n        tension: \"Strong constraints create consistency; they also encode debatable choices, such as moving refactoring outside the loop.\"\n      },\n      reference: {\n        title: \"Reference-led action guide: writing-for-agents\",\n        path: \"skills/productivity/writing-for-agents/SKILL.md\",\n        code: \"pointer → information hierarchy → completion criteria\\nleading words → pruning\\n\\nskill-only mechanics disclosed separately\",\n        interface: \"An invoked guide for creating or editing documents consumed by agents.\",\n        behavior: \"The writing task comes from the caller; this predominantly reference-shaped body supplies the method, constraints, and evaluation criteria.\",\n        tension: \"It makes instruction design discussable, but some causal explanations remain hypotheses until tested.\"\n      }\n    };\n\n    const caseTabs = document.querySelectorAll(\"[data-case]\");\n    const caseContent = document.querySelector(\"#case-content\");\n    const savedCaseTab = loadSaved(STORAGE_KEY_CASE_TAB, \"wrapper\");\n\n    function renderCase(caseName) {\n      const item = caseStudies[caseName];\n      if (!item) return;\n      caseContent.innerHTML = `\n        \u003ch3>${item.title}\u003c/h3>\n        \u003cp class=\"path\">${item.path}\u003c/p>\n        \u003cpre>\u003ccode>${item.code}\u003c/code>\u003c/pre>\n        \u003cdiv class=\"case-grid\">\n          \u003cdiv>\u003ch4>Interface\u003c/h4>\u003cp>${item.interface}\u003c/p>\u003c/div>\n          \u003cdiv>\u003ch4>Where behavior lives\u003c/h4>\u003cp>${item.behavior}\u003c/p>\u003c/div>\n        \u003c/div>\n        \u003cp>\u003cstrong>Critique tension:\u003c/strong> ${item.tension}\u003c/p>\n      `;\n    }\n\n    caseTabs.forEach((tab) => {\n      tab.addEventListener(\"click\", () => {\n        caseTabs.forEach((otherTab) => {\n          otherTab.setAttribute(\"aria-selected\", \"false\");\n          otherTab.setAttribute(\"aria-pressed\", \"false\");\n        });\n        tab.setAttribute(\"aria-selected\", \"true\");\n        tab.setAttribute(\"aria-pressed\", \"true\");\n        saveState(STORAGE_KEY_CASE_TAB, tab.dataset.case);\n        renderCase(tab.dataset.case);\n      });\n    });\n\n    const annotationNotes = {\n      pointer: \"The description names the behavior and encodes when the agent should reach for it. Reliability begins before the body is loaded.\",\n      primitive: \"Design tree and frontier are leading concepts: compact mental objects that organize many downstream instructions.\",\n      sequence: \"Rounds turn the interview into an explicit loop. Waiting for answers prevents downstream questions from assuming unsettled prerequisites.\",\n      ownership: \"This is a human-agency boundary: the agent owns discoverable facts; the learner owns decisions. The split prevents lazy questions without stealing judgment.\",\n      completion: \"The criterion is demanding and inspectable: no frontier remains, every branch has been visited, and the user confirms alignment. Its risk is unbounded scope.\"\n    };\n\n    const annotationButtons = document.querySelectorAll(\"[data-annotation]\");\n    const skillLines = document.querySelectorAll(\"[data-region]\");\n    const annotationNote = document.querySelector(\"#annotation-note\");\n    const savedAnnotation = loadSaved(STORAGE_KEY_ANNOTATION, \"pointer\");\n\n    function showAnnotation(region, activeButton) {\n      annotationButtons.forEach((button) => button.setAttribute(\"aria-pressed\", String(button === activeButton)));\n      skillLines.forEach((line) => line.classList.toggle(\"highlight\", line.dataset.region === region));\n      annotationNote.textContent = annotationNotes[region] || \"\";\n      saveState(STORAGE_KEY_ANNOTATION, region);\n    }\n\n    annotationButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => showAnnotation(button.dataset.annotation, button));\n    });\n\n    const invocationButtons = document.querySelectorAll(\"[data-invocation]\");\n    const contextMeter = document.querySelector(\"#context-meter\");\n    const cognitiveMeter = document.querySelector(\"#cognitive-meter\");\n    const contextValue = document.querySelector(\"#context-value\");\n    const cognitiveValue = document.querySelector(\"#cognitive-value\");\n    const invocationCopy = document.querySelector(\"#invocation-copy\");\n\n    const invocationStates = {\n      user: {\n        contextWidth: \"14%\",\n        cognitiveWidth: \"82%\",\n        contextLabel: \"low\",\n        cognitiveLabel: \"high\",\n        copy: \"Use this when migration review is a deliberate checkpoint the human already remembers. The description can stay human-facing, but no other skill can rely on discovering it automatically.\"\n      },\n      model: {\n        contextWidth: \"78%\",\n        cognitiveWidth: \"24%\",\n        contextLabel: \"higher\",\n        cognitiveLabel: \"lower\",\n        copy: \"Use this when the agent must notice migration risk during broader work, or another skill must invoke the review. The trigger description now stays in context and must earn that permanent attention.\"\n      }\n    };\n\n    function selectInvocation(mode, activeButton) {\n      const state = invocationStates[mode] || invocationStates.user;\n      invocationButtons.forEach((button) => button.setAttribute(\"aria-pressed\", String(button === activeButton)));\n      contextMeter.style.width = state.contextWidth;\n      cognitiveMeter.style.width = state.cognitiveWidth;\n      contextValue.textContent = state.contextLabel;\n      cognitiveValue.textContent = state.cognitiveLabel;\n      invocationCopy.textContent = state.copy;\n      saveState(STORAGE_KEY_INVOCATION, mode);\n    }\n\n    invocationButtons.forEach((button) => {\n      button.addEventListener(\"click\", () => selectInvocation(button.dataset.invocation, button));\n    });\n\n    const evidenceCases = [\n      {\n        statement: \"“These skills work with any model.”\",\n        answer: \"Author claim\",\n        feedback: \"The README states it. The repository alone does not establish cross-model performance.\"\n      },\n      {\n        statement: \"The seven-line grill-with-docs skill delegates to grilling and domain-modeling.\",\n        answer: \"Repository observation\",\n        feedback: \"This can be checked directly in the file; no causal interpretation is required.\"\n      },\n      {\n        statement: \"The wrapper will be cheaper to maintain than repeating its dependencies’ instructions inline.\",\n        answer: \"Our inference\",\n        feedback: \"Plausible, but maintenance history and dependency failures could strengthen or overturn it.\"\n      }\n    ];\n\n    const evidenceTooltips = {\n      \"Author claim\": \"Author claim: An explicit assertion by the author in documentation, not supported by cross-model or benchmark data in the repo.\",\n      \"Repository observation\": \"Repository observation: A directly observable fact about code structure, configuration, or file presence in the repository.\",\n      \"Our inference\": \"Our inference: A reasoned deduction, design hypothesis, or tradeoff analysis derived from interpreting the evidence.\"\n    };\n\n    const evidenceOptions = [\"Author claim\", \"Repository observation\", \"Our inference\"];\n    const evidenceState = loadSaved(STORAGE_KEY_EVIDENCE, { answers: {}, currentIndex: 0 });\n    let evidenceIndex = Math.min(Math.max(0, Number(evidenceState.currentIndex) || 0), evidenceCases.length - 1);\n\n    const evidenceNav = document.querySelector(\"#evidence-nav\");\n    const evidenceQuestion = document.querySelector(\"#evidence-question\");\n    const evidenceChoices = document.querySelector(\"#evidence-choices\");\n    const evidenceFeedback = document.querySelector(\"#evidence-feedback\");\n    const evidencePrev = document.querySelector(\"#evidence-prev\");\n    const evidenceSkip = document.querySelector(\"#evidence-skip\");\n    const evidenceNext = document.querySelector(\"#evidence-next\");\n    const evidenceCount = document.querySelector(\"#evidence-count\");\n\n    function renderEvidenceNav() {\n      evidenceNav.replaceChildren();\n      evidenceCases.forEach((_, idx) => {\n        const btn = document.createElement(\"button\");\n        btn.type = \"button\";\n        btn.className = \"quiz-nav-step\";\n        if (idx === evidenceIndex) btn.classList.add(\"active\");\n        const ans = evidenceState.answers[idx];\n        if (ans) {\n          if (ans.isCorrect) btn.classList.add(\"correct\");\n          else if (ans.selected) btn.classList.add(\"answered\");\n        }\n        btn.textContent = `Statement ${idx + 1}`;\n        btn.setAttribute(\"aria-label\", `Jump to Statement ${idx + 1}`);\n        btn.addEventListener(\"click\", () => {\n          evidenceIndex = idx;\n          evidenceState.currentIndex = idx;\n          saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n          renderEvidenceCase();\n        });\n        evidenceNav.append(btn);\n      });\n    }\n\n    function renderEvidenceCase() {\n      renderEvidenceNav();\n      const currentCase = evidenceCases[evidenceIndex];\n      const saved = evidenceState.answers[evidenceIndex];\n\n      evidenceQuestion.textContent = currentCase.statement;\n      evidenceCount.textContent = `${evidenceIndex + 1} / ${evidenceCases.length}`;\n      evidencePrev.disabled = evidenceIndex === 0;\n      evidenceNext.textContent = evidenceIndex === evidenceCases.length - 1 ? \"Finish\" : \"Next statement →\";\n\n      if (saved && saved.feedback) {\n        evidenceFeedback.className = `feedback visible ${saved.isCorrect ? \"correct\" : \"retry\"}`;\n        evidenceFeedback.textContent = saved.feedback;\n      } else {\n        evidenceFeedback.className = \"feedback\";\n        evidenceFeedback.textContent = \"\";\n      }\n\n      evidenceChoices.replaceChildren();\n      evidenceOptions.forEach((option) => {\n        const button = document.createElement(\"button\");\n        button.type = \"button\";\n        button.className = \"choice\";\n        button.textContent = option;\n        button.dataset.help = evidenceTooltips[option];\n        button.setAttribute(\"aria-label\", `${option}: ${evidenceTooltips[option]}`);\n        if (saved && saved.selected === option) button.classList.add(\"selected\");\n        button.addEventListener(\"click\", () => checkEvidenceAnswer(button, option));\n        evidenceChoices.append(button);\n      });\n    }\n\n    function checkEvidenceAnswer(button, option) {\n      const currentCase = evidenceCases[evidenceIndex];\n      evidenceChoices.querySelectorAll(\"button\").forEach((choice) => choice.classList.remove(\"selected\"));\n      button.classList.add(\"selected\");\n      const isCorrect = option === currentCase.answer;\n      const feedbackText = isCorrect\n        ? `Yes. ${currentCase.feedback}`\n        : `The strongest label is ${currentCase.answer}. ${currentCase.feedback}`;\n\n      evidenceFeedback.className = `feedback visible ${isCorrect ? \"correct\" : \"retry\"}`;\n      evidenceFeedback.textContent = feedbackText;\n\n      evidenceState.answers[evidenceIndex] = {\n        selected: option,\n        isCorrect,\n        feedback: feedbackText\n      };\n      saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n      renderEvidenceNav();\n    }\n\n    evidencePrev.addEventListener(\"click\", () => {\n      if (evidenceIndex > 0) {\n        evidenceIndex -= 1;\n        evidenceState.currentIndex = evidenceIndex;\n        saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n        renderEvidenceCase();\n      }\n    });\n\n    evidenceSkip.addEventListener(\"click\", () => {\n      evidenceIndex = (evidenceIndex + 1) % evidenceCases.length;\n      evidenceState.currentIndex = evidenceIndex;\n      saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n      renderEvidenceCase();\n    });\n\n    evidenceNext.addEventListener(\"click\", () => {\n      if (evidenceIndex \u003c evidenceCases.length - 1) {\n        evidenceIndex += 1;\n        evidenceState.currentIndex = evidenceIndex;\n        saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n        renderEvidenceCase();\n      } else {\n        const allCorrect = evidenceCases.every((_, idx) => evidenceState.answers[idx]?.isCorrect);\n        evidenceFeedback.className = `feedback visible ${allCorrect ? \"correct\" : \"\"}`;\n        evidenceFeedback.textContent = allCorrect\n          ? \"All statements correctly classified! Separating author claims, empirical observations, and inferences keeps critique grounded.\"\n          : \"You've reached the end of the statements. Click any Statement tab above to review or update your answers.\";\n      }\n    });\n\n    const ledgerItems = document.querySelectorAll(\".ledger-item\");\n    const ledgerSummary = document.querySelector(\"#ledger-summary\");\n    const ledgerReset = document.querySelector(\"#ledger-reset\");\n    const ledgerDecisions = loadSaved(STORAGE_KEY_LEDGER, {});\n\n    function updateLedgerSummary() {\n      const decisions = Object.values(ledgerDecisions);\n      const counts = { adopt: 0, adapt: 0, reject: 0 };\n      decisions.forEach((decision) => { counts[decision] = (counts[decision] || 0) + 1; });\n      const open = ledgerItems.length - decisions.length;\n      ledgerSummary.textContent = `${decisions.length} decided · ${open} still open · adopt ${counts.adopt} · adapt ${counts.adapt} · reject ${counts.reject}`;\n    }\n\n    ledgerItems.forEach((item) => {\n      const principle = item.dataset.principle;\n      const buttons = item.querySelectorAll(\".ledger-choice\");\n      if (ledgerDecisions[principle]) {\n        buttons.forEach((button) => {\n          if (button.dataset.value === ledgerDecisions[principle]) {\n            button.setAttribute(\"aria-pressed\", \"true\");\n          }\n        });\n      }\n      buttons.forEach((button) => {\n        button.addEventListener(\"click\", () => {\n          ledgerDecisions[principle] = button.dataset.value;\n          saveState(STORAGE_KEY_LEDGER, ledgerDecisions);\n          buttons.forEach((otherButton) => otherButton.setAttribute(\"aria-pressed\", String(otherButton === button)));\n          updateLedgerSummary();\n        });\n      });\n    });\n\n    ledgerReset.addEventListener(\"click\", () => {\n      Object.keys(ledgerDecisions).forEach((key) => delete ledgerDecisions[key]);\n      saveState(STORAGE_KEY_LEDGER, ledgerDecisions);\n      document.querySelectorAll(\".ledger-choice\").forEach((button) => button.setAttribute(\"aria-pressed\", \"false\"));\n      updateLedgerSummary();\n    });\n\n    const progressBar = document.querySelector(\"#progress-bar\");\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const progress = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      progressBar.style.width = `${Math.min(100, Math.max(0, progress))}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    window.addEventListener(\"resize\", updateProgress);\n\n    renderRoleCase();\n    const activeCaseBtn = document.querySelector(`[data-case=\"${savedCaseTab}\"]`);\n    if (activeCaseBtn) activeCaseBtn.click();\n    else renderCase(\"wrapper\");\n\n    const activeAnnotationBtn = document.querySelector(`[data-annotation=\"${savedAnnotation}\"]`);\n    if (activeAnnotationBtn) activeAnnotationBtn.click();\n    else showAnnotation(\"pointer\", document.querySelector('[data-annotation=\"pointer\"]'));\n\n    const savedInvocation = loadSaved(STORAGE_KEY_INVOCATION, \"user\");\n    const activeInvocationBtn = document.querySelector(`[data-invocation=\"${savedInvocation}\"]`);\n    if (activeInvocationBtn) selectInvocation(savedInvocation, activeInvocationBtn);\n\n    renderEvidenceCase();\n    updateLedgerSummary();\n    updateProgress();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session2.html","title":"Designing a Skill","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Designing a Skill\">\n  \u003ctitle>Designing a Skill — MattPocock Skills\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n      --muted: #70695f;\n      --accent: #8a4e35;\n      --accent-dark: #663824;\n      --accent-soft: #ead8ca;\n      --sage: #627461;\n      --sage-soft: #dfe6da;\n      --blue: #4f6878;\n      --blue-soft: #dbe5e9;\n      --line: #d8cdbc;\n      --card: rgba(255, 253, 248, 0.82);\n      --shadow: 0 18px 48px rgba(76, 58, 40, 0.08);\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.76), transparent 31rem),\n        var(--paper);\n      font-family: Georgia, \"Times New Roman\", serif;\n      font-size: 1.04rem;\n      line-height: 1.68;\n    }\n\n    .progress-track {\n      position: fixed;\n      z-index: 20;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 3px;\n      background: rgba(138, 78, 53, 0.12);\n    }\n\n    .progress-bar {\n      width: 0;\n      height: 100%;\n      background: var(--accent);\n      transition: width 120ms linear;\n    }\n\n    main {\n      width: min(100% - 3rem, 88ch);\n      margin: 0 auto;\n      padding: 4rem 0 6rem;\n    }\n\n    header { margin-bottom: 4rem; }\n\n    .eyebrow,\n    .meta,\n    .label,\n    .time,\n    button,\n    code,\n    .path,\n    .step-pill,\n    label,\n    input,\n    textarea,\n    .term {\n      font-family: var(--mono);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.9rem;\n      color: var(--accent);\n      font-size: 0.78rem;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1, h2, h3, h4 { line-height: 1.18; }\n\n    h1 {\n      max-width: 12ch;\n      margin: 0;\n      font-size: clamp(3rem, 9vw, 5.3rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h2 {\n      margin: 0 0 1.1rem;\n      font-size: clamp(1.85rem, 5vw, 2.35rem);\n      font-weight: 500;\n      letter-spacing: -0.028em;\n    }\n\n    h3 { margin: 2rem 0 0.65rem; font-size: 1.3rem; }\n    h4 { margin: 0 0 0.45rem; font-size: 1.05rem; }\n    p { margin: 0.8rem 0; }\n    section { margin-top: 5rem; scroll-margin-top: 2rem; }\n    ul, ol { padding-left: 1.3rem; }\n    li + li { margin-top: 0.5rem; }\n    a { color: var(--accent); text-underline-offset: 0.18em; }\n\n    code {\n      padding: 0.1em 0.3em;\n      border-radius: 0.25rem;\n      background: var(--paper-deep);\n      font-size: 0.84em;\n    }\n\n    .lede {\n      max-width: 55ch;\n      margin: 1.55rem 0 1rem;\n      color: #4f4941;\n      font-size: 1.22rem;\n    }\n\n    .meta { color: var(--muted); font-size: 0.82rem; }\n\n    .opening,\n    .callout,\n    .lab,\n    .draft-builder,\n    .comparison-card,\n    .field-note {\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .opening {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.2rem;\n      margin-top: 2rem;\n      padding: 1.35rem;\n    }\n\n    .opening h2 {\n      margin-bottom: 0.65rem;\n      font-family: var(--sans);\n      font-size: 0.74rem;\n      font-weight: 800;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .opening p, .opening ul { margin: 0; font-size: 0.94rem; }\n\n    .time {\n      display: inline-block;\n      margin-bottom: 0.65rem;\n      color: var(--accent);\n      font-size: 0.75rem;\n    }\n\n    .label {\n      display: block;\n      margin-bottom: 0.4rem;\n      color: var(--accent);\n      font-size: 0.73rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .callout { margin: 1.5rem 0; padding: 1.25rem 1.35rem; }\n    .callout p:last-child { margin-bottom: 0; }\n    .callout.sage { border-left: 4px solid var(--sage); }\n    .callout.blue { border-left: 4px solid var(--blue); }\n\n    .formula {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: 0.75rem;\n      margin: 1.5rem 0;\n    }\n\n    .formula div {\n      position: relative;\n      padding: 1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.5rem;\n      background: rgba(255, 253, 248, 0.68);\n    }\n\n    .formula div:not(:last-child)::after {\n      position: absolute;\n      top: 50%;\n      right: -0.6rem;\n      z-index: 2;\n      color: var(--accent);\n      content: \"→\";\n      font-family: var(--mono);\n      transform: translateY(-50%);\n    }\n\n    .formula strong {\n      display: block;\n      margin-bottom: 0.35rem;\n      font-family: var(--sans);\n      font-size: 0.9rem;\n    }\n\n    .formula span { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      font-size: 0.9em;\n    }\n\n    .term::after,\n    .choice[data-tip]::after {\n      position: absolute;\n      z-index: 30;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(20rem, 80vw);\n      padding: 0.7rem 0.8rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-tip);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .term:hover::after,\n    .term:focus-visible::after,\n    .choice[data-tip]:hover::after,\n    .choice[data-tip]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .lab { margin-top: 2rem; padding: 1.35rem; }\n\n    .lab-header {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1rem;\n    }\n\n    .lab-header h3 { margin: 0; }\n\n    .lab-count {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n      white-space: nowrap;\n    }\n\n    .step-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.1rem;\n      padding-bottom: 0.8rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .step-pill {\n      padding: 0.34rem 0.68rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--muted);\n      background: rgba(255, 253, 248, 0.72);\n      cursor: pointer;\n      font-size: 0.69rem;\n    }\n\n    .step-pill.active {\n      border-color: var(--accent);\n      color: var(--accent-dark);\n      background: var(--accent-soft);\n      font-weight: 700;\n    }\n\n    .step-pill.correct {\n      border-color: var(--sage);\n      color: #384937;\n      background: var(--sage-soft);\n    }\n\n    .step-pill.answered {\n      border-color: var(--blue);\n      color: #334856;\n      background: var(--blue-soft);\n    }\n\n    button {\n      border: 1px solid var(--line);\n      color: var(--ink);\n      background: transparent;\n      cursor: pointer;\n    }\n\n    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }\n\n    .choice-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 0.65rem;\n      margin-top: 1rem;\n    }\n\n    .choice {\n      position: relative;\n      min-height: 4.5rem;\n      padding: 0.8rem;\n      border-radius: 0.48rem;\n      font-size: 0.76rem;\n      line-height: 1.45;\n      text-align: left;\n    }\n\n    .choice.selected {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .choice.correct-answer {\n      border-color: var(--sage);\n      color: #334332;\n      background: var(--sage-soft);\n    }\n\n    .feedback {\n      display: none;\n      margin-top: 1rem;\n      padding: 0.9rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-size: 0.92rem;\n    }\n\n    .feedback.visible { display: block; }\n    .feedback.correct { border-left: 3px solid var(--sage); }\n    .feedback.retry { border-left: 3px solid var(--accent); }\n\n    .quiz-actions {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.6rem;\n      flex-wrap: wrap;\n      margin-top: 1.1rem;\n    }\n\n    .quiz-action-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }\n\n    .quiz-button,\n    .secondary-button,\n    .copy-button {\n      padding: 0.58rem 0.86rem;\n      border-radius: 999px;\n      font-size: 0.73rem;\n    }\n\n    .quiz-button {\n      border-color: var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .quiz-button:disabled, .secondary-button:disabled { cursor: not-allowed; opacity: 0.42; }\n\n    .comparison-card {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0;\n      overflow: hidden;\n      margin-top: 1.4rem;\n    }\n\n    .comparison-card article { padding: 1.25rem; }\n    .comparison-card article + article { border-left: 1px solid var(--line); }\n    .comparison-card p { font-size: 0.94rem; }\n\n    pre {\n      margin: 1rem 0;\n      padding: 1rem;\n      overflow-x: auto;\n      border-radius: 0.45rem;\n      color: #f8efe3;\n      background: #312c27;\n      font-family: var(--mono);\n      font-size: 0.79rem;\n      line-height: 1.55;\n      white-space: pre-wrap;\n    }\n\n    pre code { padding: 0; color: inherit; background: transparent; font-size: inherit; }\n\n    .ladder {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 0.7rem;\n      margin: 1.4rem 0;\n    }\n\n    .ladder div {\n      padding: 1rem;\n      border-top: 3px solid var(--accent);\n      background: rgba(255, 253, 248, 0.6);\n    }\n\n    .ladder strong { display: block; font-family: var(--sans); font-size: 0.9rem; }\n    .ladder span { color: var(--muted); font-size: 0.83rem; }\n\n    .audit-line {\n      margin: 0.8rem 0;\n      padding: 0.9rem 1rem;\n      border-left: 3px solid var(--accent);\n      background: var(--paper-deep);\n      font-family: var(--mono);\n      font-size: 0.82rem;\n    }\n\n    .draft-builder { margin-top: 1.6rem; overflow: hidden; }\n\n    .builder-grid {\n      display: grid;\n      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);\n    }\n\n    .builder-fields { padding: 1.3rem; border-right: 1px solid var(--line); }\n    .builder-preview { min-width: 0; padding: 1.3rem; background: rgba(238, 229, 214, 0.34); }\n    .builder-preview h3, .builder-fields h3 { margin-top: 0; }\n\n    .field { margin-top: 1rem; }\n\n    label {\n      display: block;\n      margin-bottom: 0.35rem;\n      color: var(--muted);\n      font-size: 0.7rem;\n    }\n\n    input, textarea {\n      width: 100%;\n      padding: 0.7rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 0.42rem;\n      color: var(--ink);\n      background: #fffdf8;\n      font-size: 0.77rem;\n      line-height: 1.45;\n    }\n\n    textarea { min-height: 6.5rem; resize: vertical; }\n    input:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }\n\n    .builder-preview pre { min-height: 23rem; margin-bottom: 0.75rem; }\n\n    .copy-status {\n      min-height: 1.4rem;\n      color: var(--sage);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n    }\n\n    .scorecard {\n      width: 100%;\n      margin: 1.4rem 0;\n      border-collapse: collapse;\n      font-size: 0.93rem;\n    }\n\n    .scorecard th, .scorecard td { padding: 0.8rem; border-bottom: 1px solid var(--line); text-align: left; }\n    .scorecard th { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; }\n\n    .field-note { margin-top: 1.5rem; padding: 1.25rem; }\n    .field-note p:first-child { margin-top: 0; }\n\n    .learner-note {\n      margin-top: 1.5rem;\n      padding: 1.3rem 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: rgba(255, 253, 248, 0.68);\n      box-shadow: var(--shadow);\n    }\n\n    .learner-question {\n      margin: 0 0 1.1rem;\n      padding-left: 1rem;\n      border-left: 3px solid var(--accent);\n      color: #4f4941;\n      font-style: italic;\n    }\n\n    .three-questions {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 0.65rem;\n      margin: 1rem 0;\n    }\n\n    .three-questions div {\n      padding: 0.85rem;\n      border-radius: 0.45rem;\n      background: var(--paper-deep);\n    }\n\n    .three-questions strong {\n      display: block;\n      font-family: var(--sans);\n      font-size: 0.86rem;\n    }\n\n    .three-questions span { color: var(--muted); font-size: 0.82rem; }\n\n    .source-note { color: var(--muted); font-size: 0.88rem; }\n\n    @media (max-width: 760px) {\n      .formula { grid-template-columns: 1fr 1fr; }\n      .formula div:nth-child(2)::after { display: none; }\n      .builder-grid { grid-template-columns: 1fr; }\n      .builder-fields { border-right: 0; border-bottom: 1px solid var(--line); }\n    }\n\n    @media (max-width: 620px) {\n      main { padding-top: 3rem; }\n      .opening, .comparison-card, .ladder, .three-questions { grid-template-columns: 1fr; }\n      .comparison-card article + article { border-top: 1px solid var(--line); border-left: 0; }\n      .choice-grid { grid-template-columns: 1fr; }\n      .formula { grid-template-columns: 1fr; }\n      .formula div::after { display: none; }\n      .lab-header { align-items: flex-start; flex-direction: column; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Session 2 · Design workshop\u003c/p>\n      \u003ch1>Design a skill that earns its context\u003c/h1>\n      \u003cp class=\"lede\">Session one made Matt Pocock’s system legible. Now you will use its strongest ideas to draft a small skill—and make every line defend its place.\u003c/p>\n      \u003cp class=\"meta\">60 minutes · advanced · artifact-driven · progress saved locally\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"carry-forward\">Carry forward\u003c/h2>\n          \u003cp>A skill is not a topic summary. It is an interface around repeatable judgment: a trigger, an ownership boundary, behavior that changes the default, and a stopping condition.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"session-artifact\">Your artifact\u003c/h2>\n          \u003cp>You will leave with a compact \u003ccode>SKILL.md\u003c/code> draft for an execution-first delivery discipline: scoped work, inspectable evidence, and honest verification.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–10 minutes\u003c/span>\n      \u003ch2 id=\"start-from-failure\">1. Start from failure, not format\u003c/h2>\n      \u003cp>“A skill for careful coding” gives the agent no diagnostic target. Start from a behavior you can recognize after a bad run: adjacent files changed without permission, verification asserted without evidence, or known uncertainty hidden behind confident prose.\u003c/p>\n\n      \u003cdiv class=\"formula\" aria-label=\"Skill design sequence\">\n        \u003cdiv>\u003cstrong>Failure\u003c/strong>\u003cspan>What observable behavior repeats?\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Responsibility\u003c/strong>\u003cspan>What judgment should become reusable?\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Control\u003c/strong>\u003cspan>Which lever changes the default?\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Evidence\u003c/strong>\u003cspan>How will you know it worked?\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">Design constraint\u003c/span>\n        \u003cp>Do not encode “be good.” Encode a decision the model otherwise makes inconsistently. This is the practical meaning of hunting a \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"An instruction that does not materially change the model’s behavior compared with its default. It spends attention without buying control.\">no-op\u003c/span>.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"brief-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"design-brief\">Build the design brief\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"brief-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"brief-nav\" role=\"tablist\" aria-label=\"Design brief questions\">\u003c/div>\n        \u003cp class=\"label\" id=\"brief-kicker\">\u003c/p>\n        \u003cp id=\"brief-question\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"brief-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"brief-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"secondary-button\" id=\"brief-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton class=\"secondary-button\" id=\"brief-skip\" type=\"button\">Skip\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"quiz-button\" id=\"brief-check\" type=\"button\" disabled>Check\u003c/button>\n            \u003cbutton class=\"quiz-button\" id=\"brief-next\" type=\"button\">Next →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">10–22 minutes\u003c/span>\n      \u003ch2 id=\"choose-invocation\">2. Write the pointer before the body\u003c/h2>\n      \u003cp>For a model-discoverable skill, the description is a \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"An always-visible reference that names out-of-context material and states the distinct conditions under which the agent should load it.\">context pointer\u003c/span>. It must identify the material and enumerate distinct trigger branches. It should not smuggle the whole procedure into frontmatter.\u003c/p>\n\n      \u003cdiv class=\"comparison-card\">\n        \u003carticle>\n          \u003cspan class=\"label\">Weak pointer\u003c/span>\n          \u003cpre>\u003ccode>description: Helps agents do coding work carefully and verify results.\u003c/code>\u003c/pre>\n          \u003cp>\u003cstrong>Why it fails:\u003c/strong> “coding work” matches almost everything. “Carefully” has no observable meaning. The pointer adds context load without a crisp retrieval boundary.\u003c/p>\n        \u003c/article>\n        \u003carticle>\n          \u003cspan class=\"label\">Sharper pointer\u003c/span>\n          \u003cpre>\u003ccode>description: Keep implementation changes inside an explicit scope and report verification evidence honestly. Use when the user asks to build, change, fix, or apply something in a repository.\u003c/code>\u003c/pre>\n          \u003cp>\u003cstrong>Why it is stronger:\u003c/strong> the leading verbs name the behavior; the trigger list identifies change-making branches; explanation-only work stays outside.\u003c/p>\n        \u003c/article>\n      \u003c/div>\n\n      \u003cdiv class=\"learner-note\">\n        \u003cspan class=\"label\">Learner question\u003c/span>\n        \u003cp class=\"learner-question\">“That is a little bit counterintuitive. I used to think that you have to describe the problems that those skills are solving, and the problems should be independent of each other. But what you said in this session is that we actually need to define the behavioral contract in the description of the skills. Can you elaborate more on that? Why is it better? In simple words, intuitively.”\u003c/p>\n\n        \u003ch3 id=\"problem-behavior-trigger\">Problem, behavior, and trigger answer different questions\u003c/h3>\n        \u003cdiv class=\"three-questions\">\n          \u003cdiv>\u003cstrong>Problem\u003c/strong>\u003cspan>Why does this skill need to exist?\u003c/span>\u003c/div>\n          \u003cdiv>\u003cstrong>Behavioral contract\u003c/strong>\u003cspan>What will it make the agent do differently?\u003c/span>\u003c/div>\n          \u003cdiv>\u003cstrong>Trigger\u003c/strong>\u003cspan>When should the agent load it?\u003c/span>\u003c/div>\n        \u003c/div>\n\n        \u003cp>Your problem-first model is useful during design: it helps you discover a coherent reason for creating the skill. But a description is also a label in the agent’s toolbox. A problem-only label such as “use when implementation quality is unreliable” does not reveal whether the skill adds tests, reviews code, restricts scope, or investigates bugs.\u003c/p>\n\n        \u003cp>The behavioral contract names the remedy. The trigger names the situations in which that remedy applies. Together, they let the agent predict what loading the skill will change and decide when to retrieve it.\u003c/p>\n\n        \u003cdiv class=\"callout sage\">\n          \u003cspan class=\"label\">Drafting sequence\u003c/span>\n          \u003cp>\u003cstrong>Start from the problem\u003c/strong> to discover why the skill should exist. \u003cstrong>Define the behavior\u003c/strong> to decide what responsibility it owns. \u003cstrong>Write the description as behavior + triggers\u003c/strong> so the agent can retrieve it correctly.\u003c/p>\n        \u003c/div>\n\n        \u003cp>The independence question still matters at the skill boundary. If two behaviors are useful separately, they may deserve separate skills. In this lesson, scope control and honest verification are grouped because they form one implementation-completion contract. That grouping is a design judgment, not a universal rule.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">Invocation decision\u003c/span>\n        \u003cp>Make this discipline model-discoverable if you want it to activate during ordinary implementation. Keep it human-only if it is a deliberate audit ceremony. That is a trade between \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"Always-loaded tokens and attention spent so the agent can discover a document automatically.\">context load\u003c/span> and \u003cspan class=\"term\" tabindex=\"0\" data-tip=\"The human effort of remembering which manual skill to invoke and when. In this design philosophy, it is also a way to preserve human agency.\">cognitive load\u003c/span>, not a hierarchy of quality.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">22–38 minutes\u003c/span>\n      \u003ch2 id=\"place-information\">3. Put each instruction at the cheapest truthful layer\u003c/h2>\n      \u003cp>The body is not the default home for every useful fact. Place material according to when it is needed and where its source of truth lives.\u003c/p>\n\n      \u003cdiv class=\"ladder\" aria-label=\"Three information placement layers\">\n        \u003cdiv>\u003cstrong>In-file\u003c/strong>\u003cspan>Universal steps and rules needed on every run.\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Disclosed reference\u003c/strong>\u003cspan>Branch-specific material behind a precise pointer.\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>Environment\u003c/strong>\u003cspan>Facts cheaply discoverable from files, config, or help output.\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"placement-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"placement-game\">Place the instruction\u003c/h3>\n          \u003cspan class=\"lab-count\" id=\"placement-count\">1 / 4\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step-nav\" id=\"placement-nav\" role=\"tablist\" aria-label=\"Information placement cases\">\u003c/div>\n        \u003cp class=\"audit-line\" id=\"placement-line\">\u003c/p>\n        \u003cp id=\"placement-question\">\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"placement-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"placement-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"secondary-button\" id=\"placement-prev\" type=\"button\">← Previous\u003c/button>\n            \u003cbutton class=\"secondary-button\" id=\"placement-skip\" type=\"button\">Skip\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"quiz-button\" id=\"placement-check\" type=\"button\" disabled>Check\u003c/button>\n            \u003cbutton class=\"quiz-button\" id=\"placement-next\" type=\"button\">Next →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">The cache test\u003c/span>\n        \u003cp>If the agent can recover a fact with one cheap lookup, copying it into the skill creates a stale cache. Document the convention, reason, or gotcha the environment cannot confess; let the environment own its own current values.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">38–50 minutes\u003c/span>\n      \u003ch2 id=\"draft-the-control-loop\">4. Draft a small control loop\u003c/h2>\n      \u003cp>The following builder is deliberately constrained. It prevents you from writing a miniature handbook before the interface is clear. Your entries are saved in this browser and restored when you return.\u003c/p>\n\n      \u003cdiv class=\"draft-builder\">\n        \u003cdiv class=\"builder-grid\">\n          \u003cdiv class=\"builder-fields\">\n            \u003ch3 id=\"draft-inputs\">Four decisions\u003c/h3>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"skill-name\">Skill name\u003c/label>\n              \u003cinput id=\"skill-name\" value=\"scope-and-evidence\" autocomplete=\"off\">\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"trigger\">Trigger pointer — what it is + when it loads\u003c/label>\n              \u003ctextarea id=\"trigger\">Keep implementation changes inside explicit scope and report verification evidence honestly. Use when the user asks to build, change, fix, or apply something in a repository.\u003c/textarea>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"core-step\">Core behavior — the judgment being made reusable\u003c/label>\n              \u003ctextarea id=\"core-step\">Resolve the requested change into an explicit target, preserve unrelated work, implement only that scope, and run checks proportional to the risk.\u003c/textarea>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"done-criterion\">Completion criterion — checkable and demanding\u003c/label>\n              \u003ctextarea id=\"done-criterion\">Finish when every requested outcome is implemented, every relevant check has a recorded result, and remaining uncertainty is named without implying it passed.\u003c/textarea>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"builder-preview\">\n            \u003ch3 id=\"draft-preview-heading\">Live \u003ccode>SKILL.md\u003c/code>\u003c/h3>\n            \u003cpre>\u003ccode id=\"draft-preview\">\u003c/code>\u003c/pre>\n            \u003cbutton class=\"copy-button\" id=\"copy-draft\" type=\"button\">Copy draft\u003c/button>\n            \u003cp class=\"copy-status\" id=\"copy-status\" aria-live=\"polite\">\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003cspan class=\"label\">Read the draft adversarially\u003c/span>\n        \u003cp>Where could an agent truthfully claim compliance while doing less than you intended? “Relevant checks” still delegates a judgment. That may be correct—but if your failures cluster there, define relevance or point to repository-specific instructions.\u003c/p>\n        \u003cp>Where does the draft repeat the environment? It should not list the project’s test commands if \u003ccode>package.json\u003c/code>, \u003ccode>Makefile\u003c/code>, or \u003ccode>--help\u003c/code> already owns them.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">50–60 minutes\u003c/span>\n      \u003ch2 id=\"test-the-skill\">5. Test behavior, not eloquence\u003c/h2>\n      \u003cp>A polished document is not evidence that the skill works. A skill claims predictability: the agent should take the same process across comparable runs, while the outputs still vary with the task.\u003c/p>\n\n      \u003ctable class=\"scorecard\">\n        \u003cthead>\n          \u003ctr>\u003cth>Test\u003c/th>\u003cth>What to compare\u003c/th>\u003cth>Failure signal\u003c/th>\u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>Trigger test\u003c/td>\n            \u003ctd>Run one in-scope implementation request and one explanation-only request.\u003c/td>\n            \u003ctd>The skill misses the change request or loads during explanation.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Counterfactual test\u003c/td>\n            \u003ctd>Run the same task with and without one disputed sentence.\u003c/td>\n            \u003ctd>No observable behavior changes; the sentence may be a no-op.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Adversarial scope test\u003c/td>\n            \u003ctd>Give a narrow request beside tempting adjacent cleanup.\u003c/td>\n            \u003ctd>The agent “improves” material outside the named boundary.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Evidence test\u003c/td>\n            \u003ctd>Make one relevant check unavailable or failing.\u003c/td>\n            \u003ctd>The final report implies full verification or buries uncertainty.\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">Session result\u003c/span>\n        \u003cp>You now have a design loop: name a recurring failure, allocate invocation ownership, choose the cheapest truthful information layer, write checkable completion criteria, and test sentences counterfactually. This is more valuable than copying the surface style of any existing skill.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"field-note\">\n        \u003ch3 id=\"completion-check\">Before you call the draft ready\u003c/h3>\n        \u003cul>\n          \u003cli>The description names distinct trigger branches rather than broad synonyms.\u003c/li>\n          \u003cli>Every in-file instruction changes behavior on the runs where it applies.\u003c/li>\n          \u003cli>Branch-specific reference is disclosed behind a pointer.\u003c/li>\n          \u003cli>Cheap environmental facts remain in the environment.\u003c/li>\n          \u003cli>Completion is both checkable and demanding.\u003c/li>\n          \u003cli>At least one counterfactual run tests whether a disputed line earns its load.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2 id=\"source-notes\">Source notes\u003c/h2>\n      \u003cp class=\"source-note\">This session was checked against the public repository on August 10, 2026. The current \u003ccode>writing-for-agents\u003c/code> reference defines context pointers, the two loads, information hierarchy, completion criteria, leading words, and pruning; the repository README documents the current user-invoked/model-invoked split.\u003c/p>\n      \u003cul class=\"source-note\">\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills\">Repository README and skill catalog\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\">\u003ccode>writing-for-agents/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\">\u003ccode>grilling/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_PREFIX = \"mattpocock-skills:session2:\";\n\n    function loadState(key, fallback) {\n      try {\n        const saved = localStorage.getItem(STORAGE_PREFIX + key);\n        return saved ? JSON.parse(saved) : fallback;\n      } catch (error) {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));\n      } catch (error) {\n        // The lesson remains usable when storage is unavailable.\n      }\n    }\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const percent = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      document.querySelector(\"#progress-bar\").style.width = `${Math.min(100, percent)}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    updateProgress();\n\n    function createStepper(config) {\n      const state = loadState(config.storageKey, { index: 0, answers: {} });\n      let index = Math.min(Math.max(0, Number(state.index) || 0), config.items.length - 1);\n      let selected = null;\n\n      const nav = document.querySelector(config.nav);\n      const count = document.querySelector(config.count);\n      const prompt = document.querySelector(config.prompt);\n      const question = config.question ? document.querySelector(config.question) : null;\n      const kicker = config.kicker ? document.querySelector(config.kicker) : null;\n      const choices = document.querySelector(config.choices);\n      const feedback = document.querySelector(config.feedback);\n      const previous = document.querySelector(config.previous);\n      const skip = document.querySelector(config.skip);\n      const check = document.querySelector(config.check);\n      const next = document.querySelector(config.next);\n\n      function renderNav() {\n        nav.replaceChildren();\n        config.items.forEach((item, itemIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"step-pill\";\n          button.textContent = item.shortLabel || `Step ${itemIndex + 1}`;\n          if (itemIndex === index) button.classList.add(\"active\");\n          const answer = state.answers[itemIndex];\n          if (answer?.correct) button.classList.add(\"correct\");\n          else if (answer?.checked) button.classList.add(\"answered\");\n          button.setAttribute(\"role\", \"tab\");\n          button.setAttribute(\"aria-selected\", String(itemIndex === index));\n          button.addEventListener(\"click\", () => goTo(itemIndex));\n          nav.append(button);\n        });\n      }\n\n      function render() {\n        const item = config.items[index];\n        const answer = state.answers[index];\n        selected = answer?.selected ?? null;\n        count.textContent = `${index + 1} / ${config.items.length}`;\n        prompt.textContent = item.prompt;\n        if (question) question.textContent = item.question;\n        if (kicker) kicker.textContent = item.kicker;\n        previous.disabled = index === 0;\n        next.textContent = index === config.items.length - 1 ? \"Finish\" : \"Next →\";\n        check.disabled = selected === null;\n        choices.replaceChildren();\n\n        item.options.forEach((option, optionIndex) => {\n          const button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"choice\";\n          button.textContent = option.label;\n          button.dataset.tip = option.tip;\n          button.setAttribute(\"aria-label\", `${option.label}. ${option.tip}`);\n          button.setAttribute(\"aria-pressed\", String(optionIndex === selected));\n          if (optionIndex === selected) button.classList.add(\"selected\");\n          if (answer?.checked && optionIndex === item.answer) button.classList.add(\"correct-answer\");\n          button.addEventListener(\"click\", () => selectOption(optionIndex));\n          choices.append(button);\n        });\n\n        if (answer?.checked) {\n          feedback.className = `feedback visible ${answer.correct ? \"correct\" : \"retry\"}`;\n          feedback.textContent = answer.correct ? item.correctFeedback : item.retryFeedback;\n        } else {\n          feedback.className = \"feedback\";\n          feedback.textContent = \"\";\n        }\n\n        renderNav();\n      }\n\n      function selectOption(optionIndex) {\n        selected = optionIndex;\n        state.answers[index] = { selected, checked: false, correct: false };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function checkAnswer() {\n        if (selected === null) return;\n        const item = config.items[index];\n        state.answers[index] = {\n          selected,\n          checked: true,\n          correct: selected === item.answer\n        };\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      function goTo(nextIndex) {\n        index = nextIndex;\n        state.index = index;\n        saveState(config.storageKey, state);\n        render();\n      }\n\n      previous.addEventListener(\"click\", () => {\n        if (index > 0) goTo(index - 1);\n      });\n\n      skip.addEventListener(\"click\", () => goTo((index + 1) % config.items.length));\n      check.addEventListener(\"click\", checkAnswer);\n      next.addEventListener(\"click\", () => {\n        if (index \u003c config.items.length - 1) {\n          goTo(index + 1);\n          return;\n        }\n        const correctCount = config.items.filter((item, itemIndex) => state.answers[itemIndex]?.correct).length;\n        feedback.className = \"feedback visible correct\";\n        feedback.textContent = correctCount === config.items.length\n          ? config.completeFeedback\n          : `You reached the end with ${correctCount} of ${config.items.length} decisions resolved. Use the step pills to revisit any case.`;\n      });\n\n      render();\n    }\n\n    const briefItems = [\n      {\n        shortLabel: \"Failure\",\n        kicker: \"Decision 1 · Observable failure\",\n        prompt: \"Which starting point gives the proposed skill the clearest job?\",\n        question: \"Choose the statement that describes behavior rather than a virtue.\",\n        options: [\n          { label: \"Agents should be more careful with repository changes.\", tip: \"A virtue with no observable boundary; different readers can claim compliance while behaving differently.\" },\n          { label: \"On narrow change requests, agents modify adjacent files and report checks they did not run.\", tip: \"Names two observable behaviors: scope expansion and unsupported verification claims.\" },\n          { label: \"Software engineering requires discipline and good judgment.\", tip: \"True but inert; it does not identify a recurring decision or a post-run signal.\" },\n          { label: \"Create a comprehensive best-practices skill for coding.\", tip: \"Starts from document scope and invites sprawl before a behavioral seam is known.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Exactly. You can now design against two visible failure signals and build adversarial examples for both.\",\n        retryFeedback: \"Look for the option that lets an observer decide whether the failure happened after a run.\"\n      },\n      {\n        shortLabel: \"Owner\",\n        kicker: \"Decision 2 · Invocation ownership\",\n        prompt: \"The discipline should apply whenever ordinary implementation begins. Who should notice it?\",\n        question: \"Choose the invocation design that matches that requirement.\",\n        options: [\n          { label: \"Human-only, because humans should retain all agency.\", tip: \"Human-only preserves deliberate entry, but the discipline can be forgotten during ordinary change work.\" },\n          { label: \"Model-discoverable, with a narrow change-making trigger.\", tip: \"Pays context load so the behavior can activate during build, change, fix, and apply requests.\" },\n          { label: \"Always inline the entire skill into AGENTS.md.\", tip: \"Maximizes context load on every turn, including questions and unrelated tasks.\" },\n          { label: \"Invocation does not matter if the body is well written.\", tip: \"A body that never loads cannot shape behavior; retrieval is part of the architecture.\" }\n        ],\n        answer: 1,\n        correctFeedback: \"Yes. Automatic discovery matches the requirement; a precise description keeps the permanent cost bounded.\",\n        retryFeedback: \"Separate human authority over decisions from responsibility for remembering a reusable discipline.\"\n      },\n      {\n        shortLabel: \"Gate\",\n        kicker: \"Decision 3 · Completion criterion\",\n        prompt: \"Which stopping condition best resists premature completion?\",\n        question: \"Prefer a criterion that is both checkable and demanding.\",\n        options: [\n          { label: \"Stop when the implementation seems correct.\", tip: \"The agent can satisfy this through confidence alone; there is no observable bound.\" },\n          { label: \"Stop after running tests.\", tip: \"Checkable but underspecified: which tests, what result, and what happens when a check is unavailable?\" },\n          { label: \"Stop when each requested outcome maps to a change, each relevant check has a recorded result, and uncertainty is explicit.\", tip: \"Exhaustive across outcomes and evidence, while allowing an honest non-passing or unavailable result.\" },\n          { label: \"Stop when all possible verification has passed.\", tip: \"Overbroad and often impossible; it tempts the agent to redefine 'possible' or hide unavailable checks.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Right. The criterion demands an outcome ledger and evidence without pretending every environment permits every check.\",\n        retryFeedback: \"Look for the option that can report failure or unavailability honestly instead of defining done as success.\"\n      },\n      {\n        shortLabel: \"Test\",\n        kicker: \"Decision 4 · Evidence\",\n        prompt: \"How should you test whether the sentence “Preserve unrelated work” earns its load?\",\n        question: \"Choose the design that isolates the sentence’s behavioral effect.\",\n        options: [\n          { label: \"Ask an expert whether the sentence sounds important.\", tip: \"Useful editorial feedback, but it cannot establish a model-relative behavioral effect.\" },\n          { label: \"Count how many words the skill contains before and after adding it.\", tip: \"Measures context cost, not the behavior purchased by that cost.\" },\n          { label: \"Run a narrow task with tempting adjacent cleanup, with and without the sentence, across comparable trials.\", tip: \"A counterfactual test: only the disputed instruction changes while the behavioral signal stays observable.\" },\n          { label: \"Keep the sentence because deleting instructions is risky.\", tip: \"This is how sediment accumulates: safety is assumed without testing whether the line steers anything.\" }\n        ],\n        answer: 2,\n        correctFeedback: \"Exactly. The sentence earns its place only if it changes scope behavior relative to the model’s default.\",\n        retryFeedback: \"Choose the comparison that changes only the disputed instruction and observes the target failure.\"\n      }\n    ];\n\n    createStepper({\n      storageKey: \"brief-lab\",\n      items: briefItems,\n      nav: \"#brief-nav\",\n      count: \"#brief-count\",\n      kicker: \"#brief-kicker\",\n      prompt: \"#brief-question\",\n      choices: \"#brief-choices\",\n      feedback: \"#brief-feedback\",\n      previous: \"#brief-prev\",\n      skip: \"#brief-skip\",\n      check: \"#brief-check\",\n      next: \"#brief-next\",\n      completeFeedback: \"Design brief complete: observable failure, automatic discovery, an evidence-bearing completion gate, and a counterfactual test.\"\n
