-item p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }\n\n    .ledger-controls {\n      display: flex;\n      gap: 0.35rem;\n      align-items: start;\n    }\n\n    .ledger-choice {\n      padding: 0.42rem 0.55rem;\n      font-size: 0.68rem;\n      text-align: center;\n    }\n\n    .ledger-choice[data-value=\"adopt\"][aria-pressed=\"true\"] { border-color: var(--sage); background: var(--sage); }\n    .ledger-choice[data-value=\"adapt\"][aria-pressed=\"true\"] { border-color: var(--blue); background: var(--blue); }\n    .ledger-choice[data-value=\"reject\"][aria-pressed=\"true\"] { border-color: var(--accent); background: var(--accent); }\n\n    .ledger-summary {\n      margin-top: 1rem;\n      padding: 0.85rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-family: var(--mono);\n      font-size: 0.78rem;\n    }\n\n    .takeaway {\n      margin-top: 2rem;\n      padding: 1.5rem;\n      border-top: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n      color: #4e473f;\n      font-size: 1.14rem;\n      font-style: italic;\n      text-align: center;\n    }\n\n    .sources {\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    @media (max-width: 700px) {\n      main { padding-top: 3.5rem; }\n      .opening,\n      .case-grid,\n      .annotation-layout,\n      .load-grid { grid-template-columns: 1fr; }\n      .invocation-chain { grid-template-columns: 1fr; }\n      .invocation-arrow { transform: rotate(90deg); text-align: center; }\n      .axis-labels,\n      .quadrants { grid-template-columns: 5.5rem 1fr 1fr; }\n      .ledger-item { grid-template-columns: 1fr; }\n    }\n\n    @media (max-width: 480px) {\n      .choice-grid,\n      .invocation-toggle { grid-template-columns: 1fr; }\n      .system-map { overflow-x: auto; }\n      .axis-labels,\n      .quadrants { min-width: 31rem; }\n      .ledger-controls { flex-wrap: wrap; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">Session 1 · Close reading\u003c/p>\n      \u003ch1>Read the system behind the files\u003c/h1>\n      \u003cp class=\"lede\">Matt Pocock’s repository is most interesting not as a bag of prompts, but as a proposed architecture for distributing judgment between a human, an agent, and a set of small documents.\u003c/p>\n      \u003cp class=\"meta\">75 minutes · advanced · source-first · interactive\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"reading-rule\">The reading rule\u003c/h2>\n          \u003cp>For every conclusion, ask whether it is an \u003cstrong>author claim\u003c/strong>, a \u003cstrong>repository observation\u003c/strong>, or \u003cstrong>our inference\u003c/strong>.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"working-corpus\">Working corpus\u003c/h2>\n          \u003cp>\u003ccode>README.md\u003c/code> plus five contrasting \u003ccode>SKILL.md\u003c/code> files: \u003ccode>ask-matt\u003c/code>, \u003ccode>grill-with-docs\u003c/code>, \u003ccode>grilling\u003c/code>, \u003ccode>tdd\u003c/code>, and the meta-reference \u003ccode>writing-for-agents\u003c/code>.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–12 minutes\u003c/span>\n      \u003ch2 id=\"map-the-system\">1. Map the system before reading prose\u003c/h2>\n      \u003cp>The repository’s README makes three ambitious claims: the skills are small, adaptable, and composable; they preserve developer control; and they work across models. Treat these as the author’s design intent, not yet as demonstrated results.\u003c/p>\n\n      \u003cdiv class=\"claim-strip\">\n        \u003cspan class=\"label\">Author claim\u003c/span>\n        \u003cp>The collection condenses software-engineering fundamentals into repeatable agent practices without letting a framework own the whole process.\u003c/p>\n      \u003c/div>\n\n      \u003ch3 id=\"two-organizing-axes\">Two organizing axes\u003c/h3>\n      \u003cp>The directory tree supplies a navigation axis: \u003cstrong>engineering\u003c/strong> versus \u003cstrong>productivity\u003c/strong>. Invocation supplies the more consequential architectural axis: who is responsible for noticing that a skill should run?\u003c/p>\n\n      \u003cdiv class=\"system-map\" aria-label=\"Map of representative skills by domain and invocation\">\n        \u003cdiv class=\"axis-labels\">\n          \u003cspan>\u003c/span>\n          \u003cspan>Human must notice\u003c/span>\n          \u003cspan>Model may notice; human can too\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"quadrants\">\n          \u003cdiv class=\"row-label\">Engineering\u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Human-only entry points\u003c/strong>\n            \u003cspan>ask-matt\u003c/span>\n            \u003cspan>grill-with-docs\u003c/span>\n            \u003cspan>implement\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Model-discoverable skills\u003c/strong>\n            \u003cspan>tdd\u003c/span>\n            \u003cspan>diagnosing-bugs\u003c/span>\n            \u003cspan>codebase-design\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"row-label\">Productivity\u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Human-only entry points\u003c/strong>\n            \u003cspan>grill-me\u003c/span>\n            \u003cspan>handoff\u003c/span>\n            \u003cspan>teach\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>Model-discoverable skills\u003c/strong>\n            \u003cspan>grilling\u003c/span>\n            \u003cspan>writing-for-agents\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">Important asymmetry\u003c/span>\n        \u003cp>\u003cstrong>Model-invoked does not mean model-only.\u003c/strong> A human can still invoke those skills directly. The description merely adds model discovery. User-invoked skills are the exclusive case: without model-visible descriptions, only a human can start them.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">Repository observation\u003c/span>\n        \u003cp>User-invoked skills carry \u003ccode>disable-model-invocation: true\u003c/code>. Their descriptions serve the human. Model-invoked descriptions stay discoverable to the agent and therefore spend context on every turn. This also lets manual entry points compose model-invoked disciplines.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"invocation-chain\" aria-label=\"Human intent flows through an entry point into model-discoverable supporting skills\">\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>Human intent\u003c/strong>\n          \u003cspan>“Sharpen this design and preserve what we learn.”\u003c/span>\n        \u003c/div>\n        \u003cspan class=\"invocation-arrow\" aria-hidden=\"true\">→\u003c/span>\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>Manual entry point\u003c/strong>\n          \u003cspan>grill-with-docs\u003c/span>\n        \u003c/div>\n        \u003cspan class=\"invocation-arrow\" aria-hidden=\"true\">→\u003c/span>\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>Supporting skills\u003c/strong>\n          \u003cspan>grilling + domain-modeling\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"invocation-is-architecture\">Invocation is architecture\u003c/h3>\n      \u003cp>This is not merely a metadata switch. In the repository’s own theory, it allocates two scarce resources:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cstrong>Context load:\u003c/strong> attention spent by always-visible skill descriptions.\u003c/li>\n        \u003cli>\u003cstrong>Cognitive load:\u003c/strong> attention spent by a human remembering which manual entry point to use.\u003c/li>\n      \u003c/ul>\n      \u003cp>A model-invoked skill buys discoverability with context. A user-invoked skill buys zero automatic context load by making the human its index. A router such as \u003ccode>ask-matt\u003c/code> exists when the manual catalog becomes hard to remember.\u003c/p>\n\n      \u003ch3 id=\"folders-are-navigation\">The folders are navigation, not ontology\u003c/h3>\n      \u003cp>Your everyday meaning of \u003cem>productivity\u003c/em> includes engineering. The repository uses the word more narrowly: \u003cstrong>general workflow that is not inherently about code\u003c/strong>. Under that reading, the two folder names translate more cleanly like this:\u003c/p>\n\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"general-workflow-layer\">Productivity → general workflow\u003c/h4>\n          \u003cp>Cross-domain interaction and context practices: \u003ccode>grilling\u003c/code>, \u003ccode>handoff\u003c/code>, \u003ccode>teach\u003c/code>, and \u003ccode>writing-for-agents\u003c/code>.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"engineering-specialization-layer\">Engineering → software specialization\u003c/h4>\n          \u003cp>Practices whose meaning assumes code, tests, repositories, architecture, or issue trackers: \u003ccode>tdd\u003c/code>, \u003ccode>code-review\u003c/code>, and \u003ccode>implement\u003c/code>.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp>The boundary is deliberately permeable. \u003ccode>grill-with-docs\u003c/code> lives under engineering because it leaves repository artifacts, yet it reuses the general \u003ccode>grilling\u003c/code> primitive. A useful mental model is therefore \u003cstrong>general base layer → engineering application layer\u003c/strong>, not “productive work versus engineering work.”\u003c/p>\n\n      \u003ch3 id=\"independent-skill-axes\">Three independent axes, not one role taxonomy\u003c/h3>\n      \u003cp>A skill should not be forced into one mutually exclusive role. The repository documents invocation and content form; compositional responsibility is an additional course lens. Ask all three questions separately:\u003c/p>\n\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>Axis\u003c/th>\n            \u003cth>Question\u003c/th>\n            \u003cth>Possible profiles\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>Invocation\u003c/td>\n            \u003ctd>Who can discover it?\u003c/td>\n            \u003ctd>Human only · model-discoverable\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Content form\u003c/td>\n            \u003ctd>What does the file mainly contain?\u003c/td>\n            \u003ctd>Steps · reference · a mixture\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Composition\u003c/td>\n            \u003ctd>What job does it perform in the system?\u003c/td>\n            \u003ctd>Router · wrapper · primitive · supporting guide\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">The writing-for-agents correction\u003c/span>\n        \u003cp>\u003ccode>writing-for-agents\u003c/code> is \u003cstrong>reference-led, not passive\u003c/strong>. You invoke it while creating or editing an agent-facing document, and its rules actively shape that work. The caller supplies the writing task; the skill supplies concepts, constraints, and quality criteria. “Reference” describes its content form—not an absence of action.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"classification-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"classify-the-role\">Build the skill profile\u003c/h3>\n          \u003cdiv class=\"lab-header-controls\" aria-label=\"Case navigation\">\n            \u003cbutton class=\"card-arrow\" id=\"role-prev\" type=\"button\" aria-label=\"Previous case\" title=\"Previous case\">←\u003c/button>\n            \u003cspan class=\"lab-count\" id=\"role-count\">1 / 4\u003c/span>\n            \u003cbutton class=\"card-arrow\" id=\"role-skip\" type=\"button\" aria-label=\"Skip to next case\" title=\"Skip to next case\">→\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"quiz-nav\" id=\"role-nav\" role=\"tablist\" aria-label=\"Question cases\">\u003c/div>\n        \u003cp class=\"question-path\" id=\"role-path\">\u003c/p>\n        \u003cbutton class=\"skill-preview-toggle\" id=\"role-source-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"role-source-preview\">Expand skill contents\u003c/button>\n        \u003cdiv class=\"skill-preview\" id=\"role-source-preview\" hidden>\n          \u003cdiv class=\"skill-preview-header\">\n            \u003cstrong>Inside this skill\u003c/strong>\n            \u003ca class=\"skill-preview-link\" id=\"role-source-link\" href=\"#\" target=\"_blank\" rel=\"noreferrer\">Open source file ↗\u003c/a>\n          \u003c/div>\n          \u003cpre>\u003ccode id=\"role-source-excerpt\">\u003c/code>\u003c/pre>\n          \u003cp class=\"preview-caption\">Short source excerpt, followed by a structural outline of the complete file:\u003c/p>\n          \u003cul class=\"preview-outline\" id=\"role-source-outline\">\u003c/ul>\n        \u003c/div>\n        \u003cp class=\"question-text\" id=\"role-question\">\u003c/p>\n        \u003cp class=\"profile-hint\">Hover or focus any option to inspect its definition and role in the system.\u003c/p>\n        \u003cdiv class=\"profile-axes\" id=\"role-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"role-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"check-button\" id=\"role-check\" type=\"button\" disabled>Check profile\u003c/button>\n            \u003cbutton class=\"next-button\" id=\"role-next\" type=\"button\">Next case →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">Our inference\u003c/span>\n        \u003cp>The repository is organized less like a command library and more like a shallow dependency graph: human-visible entry points at the top, reusable behavior and guidance below, and shared vocabulary running through both. These responsibilities can overlap inside one skill.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">12–32 minutes\u003c/span>\n      \u003ch2 id=\"four-skill-shapes\">2. Four skill shapes, one system\u003c/h2>\n      \u003cp>Skill length varies dramatically because these files do different jobs. Select each case and ask: what is its interface, where is its behavior, and what stops it?\u003c/p>\n\n      \u003cdiv class=\"tabs\" role=\"tablist\" aria-label=\"Choose a skill case\">\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"wrapper\" aria-selected=\"true\" aria-pressed=\"true\">Thin wrapper\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"primitive\" aria-selected=\"false\">Primitive\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"discipline\" aria-selected=\"false\">Discipline\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"reference\" aria-selected=\"false\">Reference-led guide\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"case-reader\" aria-live=\"polite\">\n        \u003cdiv class=\"case-content\" id=\"case-content\">\u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"anatomy-bench\">Anatomy bench: how \u003ccode>grilling\u003c/code> controls behavior\u003c/h3>\n      \u003cp>This condensed representation preserves the skill’s control structure. Click an annotation to see what each region contributes.\u003c/p>\n\n      \u003cdiv class=\"annotation-layout\">\n        \u003cdiv class=\"skill-sheet\" aria-label=\"Condensed structure of the grilling skill\">\n          \u003cspan class=\"skill-line\" data-region=\"pointer\">description: Grill relentlessly when stress-testing an idea\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"primitive\">model: decisions form a design tree\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"primitive\">unit: ask the currently unblocked frontier\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"sequence\">loop: ask a round → wait → recompute\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"ownership\">ownership: agent finds facts; human makes decisions\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"completion\">done: frontier empty + user confirms alignment\u003c/span>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"annotation-controls\">\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"pointer\">Trigger pointer\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"primitive\">Leading concepts\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"sequence\">Execution loop\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"ownership\">Agency boundary\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"completion\">Completion criterion\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"annotation-note\" id=\"annotation-note\" aria-live=\"polite\">Choose a layer. The lesson is not that every skill needs all five; it is that each needed layer should have a visible job.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout\">\n        \u003cspan class=\"label\">Close-reading result\u003c/span>\n        \u003cp>\u003ccode>grilling\u003c/code> is small in line count but not vague. It defines a state model (\u003cem>design tree\u003c/em>), a scheduling rule (\u003cem>frontier\u003c/em>), a loop (\u003cem>rounds\u003c/em>), an authority split, and an exhaustive stopping condition. Those named concepts do most of the compression.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">32–52 minutes\u003c/span>\n      \u003ch2 id=\"reverse-engineer-drafting\">3. Reverse-engineer the drafting method\u003c/h2>\n      \u003cp>The repository’s \u003ccode>writing-for-agents\u003c/code> skill is unusually valuable because it exposes a theory of authorship. The following method is a reconstruction from that theory and the case files—not a documented seven-step recipe.\u003c/p>\n\n      \u003col class=\"steps\">\n        \u003cli>\n          \u003cstrong>Start from a recurring failure mode.\u003c/strong>\n          “TDD” is a topic. “Agents write implementation-coupled tests and skip the red state” is a behavioral problem with observable failures.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Choose who must notice.\u003c/strong>\n          If the agent must reach the behavior autonomously—or another skill needs it—pay context load for model invocation. Otherwise, keep it manual.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Choose the skill shape.\u003c/strong>\n          Is this a human entry point, a reusable process, shared reference, or a router over too many manual choices?\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Name the smallest useful mental model.\u003c/strong>\n          Terms such as \u003cem>frontier\u003c/em>, \u003cem>seam\u003c/em>, \u003cem>red\u003c/em>, and \u003cem>tracer bullet\u003c/em> recruit existing concepts and compress repeated instructions.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Make gates and completion criteria observable.\u003c/strong>\n          Prefer “every branch visited” over “understanding reached,” or “one command reproduces the bug” over “investigate thoroughly.”\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Disclose branch-specific reference.\u003c/strong>\n          Keep universal steps in the main file; move examples, mocking guidance, or rare branches behind precise pointers.\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>Prune against defaults and the environment.\u003c/strong>\n          Remove instructions that do not change model behavior. Do not cache facts the agent can cheaply recover from files or \u003ccode>--help\u003c/code>.\n        \u003c/li>\n      \u003c/ol>\n\n      \u003ch3 id=\"pointer-writing\">The description is executable architecture\u003c/h3>\n      \u003cp>For model-invoked skills, the description has two jobs: name the material and encode distinct trigger branches. A beautiful body behind a weak description may never be loaded. For manual skills, the description becomes a short human-facing summary because the human already supplied the trigger by invoking it.\u003c/p>\n\n      \u003cdiv class=\"decision-panel\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"invocation-tradeoff\">Invocation tradeoff\u003c/h3>\n          \u003cspan class=\"lab-count\">not a quality ranking\u003c/span>\n        \u003c/div>\n        \u003cp>Imagine a new skill that reviews database migrations. Who should be responsible for noticing it?\u003c/p>\n        \u003cdiv class=\"invocation-toggle\" role=\"group\" aria-label=\"Choose invocation ownership\">\n          \u003cbutton type=\"button\" data-invocation=\"user\" aria-pressed=\"true\">Human-invoked\u003c/button>\n          \u003cbutton type=\"button\" data-invocation=\"model\">Model-invoked\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"load-grid\">\n          \u003cdiv>\n            \u003cdiv class=\"meter-label\">\u003cspan>Context load\u003c/span>\u003cspan id=\"context-value\">low\u003c/span>\u003c/div>\n            \u003cdiv class=\"meter\">\u003cdiv class=\"meter-fill\" id=\"context-meter\" style=\"width: 14%\">\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"meter-label\">\u003cspan>Human cognitive load\u003c/span>\u003cspan id=\"cognitive-value\">high\u003c/span>\u003c/div>\n            \u003cdiv class=\"meter\">\u003cdiv class=\"meter-fill\" id=\"cognitive-meter\" style=\"width: 82%\">\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"decision-copy\" id=\"invocation-copy\">Use this when migration review is a deliberate checkpoint the human already remembers. The description can stay human-facing, but no other skill can rely on discovering it automatically.\u003c/p>\n      \u003c/div>\n\n      \u003ch3 id=\"drafting-critique\">Where the drafting theory is strongest—and weakest\u003c/h3>\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"strong-control-levers\">Strong: control levers\u003c/h4>\n          \u003cp>Triggers, gates, completion criteria, sources of truth, and branch-specific disclosure can all be inspected and tested. They turn “write a better prompt” into design decisions.\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"weak-causal-claims\">Weak: causal claims\u003c/h4>\n          \u003cp>Claims about negation, leading words, or future-step visibility are plausible, but the repository does not itself provide controlled comparisons across models and tasks.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">52–68 minutes\u003c/span>\n      \u003ch2 id=\"pressure-test\">4. Pressure-test the philosophy\u003c/h2>\n      \u003cp>A serious critique should not reward confidence as evidence. Use the labels below to keep three different moves separate.\u003c/p>\n\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>Move\u003c/th>\n            \u003cth>Example\u003c/th>\n            \u003cth>Question to ask\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag claim\">Author claim\u003c/span>\u003c/td>\n            \u003ctd>The skills work with any model.\u003c/td>\n            \u003ctd>What cross-model evidence would support the scope of “any”?\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag observation\">Observation\u003c/span>\u003c/td>\n            \u003ctd>\u003ccode>grill-with-docs\u003c/code> delegates its behavior to two reusable skills.\u003c/td>\n            \u003ctd>Does the dependency remain easy to discover and change?\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cspan class=\"tag inference\">Inference\u003c/span>\u003c/td>\n            \u003ctd>Thin wrappers probably reduce duplication but increase hidden coupling.\u003c/td>\n            \u003ctd>What comparison or maintenance history would test that tradeoff?\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003ch3 id=\"balanced-critique\">A balanced critique\u003c/h3>\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"worth-borrowing\">Worth borrowing\u003c/h4>\n          \u003cul>\n            \u003cli>Invocation is treated as a deliberate interface decision.\u003c/li>\n            \u003cli>Thin entry points reuse deeper disciplines.\u003c/li>\n            \u003cli>Completion is often defined exhaustively, not impressionistically.\u003c/li>\n            \u003cli>The environment remains a source of truth instead of being copied into prompts.\u003c/li>\n            \u003cli>Shared vocabulary connects conversation, code, and agent behavior.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"worth-challenging\">Worth challenging\u003c/h4>\n          \u003cul>\n            \u003cli>“Works with any model” is broader than the evidence visible here.\u003c/li>\n            \u003cli>House vocabulary can compress for insiders while taxing newcomers.\u003c/li>\n            \u003cli>Composition moves complexity into dependency discovery and version compatibility.\u003c/li>\n            \u003cli>Hard workflow boundaries may encode one engineer’s preferences as universal rules.\u003c/li>\n            \u003cli>The “no-op” test is explicitly model-relative, so pruning needs repeated evaluation.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"evidence-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"classify-evidence\">Classify the evidence\u003c/h3>\n          \u003cdiv class=\"lab-header-controls\" aria-label=\"Statement navigation\">\n            \u003cbutton class=\"card-arrow\" id=\"evidence-prev\" type=\"button\" aria-label=\"Previous statement\" title=\"Previous statement\">←\u003c/button>\n            \u003cspan class=\"lab-count\" id=\"evidence-count\">1 / 3\u003c/span>\n            \u003cbutton class=\"card-arrow\" id=\"evidence-skip\" type=\"button\" aria-label=\"Skip to next statement\" title=\"Skip to next statement\">→\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"quiz-nav\" id=\"evidence-nav\" role=\"tablist\" aria-label=\"Statement cases\">\u003c/div>\n        \u003cp class=\"question-text\" id=\"evidence-question\">\u003c/p>\n        \u003cp class=\"profile-hint\">Hover or focus any option to inspect how to distinguish claims, observations, and inferences.\u003c/p>\n        \u003cdiv class=\"choice-grid\" id=\"evidence-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"evidence-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"next-button\" id=\"evidence-next\" type=\"button\">Next statement →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"experiments\">Experiments that would improve the critique\u003c/h3>\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>Question\u003c/th>\n            \u003cth>Smallest useful test\u003c/th>\n            \u003cth>Observable\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>Does a description trigger reliably?\u003c/td>\n            \u003ctd>Run a fixed prompt set with and without one trigger branch.\u003c/td>\n            \u003ctd>Correct invocation rate and false positives.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Do leading words change behavior?\u003c/td>\n            \u003ctd>A/B the named concept against a literal expanded instruction.\u003c/td>\n            \u003ctd>Completion, variance, and token cost.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Does the skill transfer across models?\u003c/td>\n            \u003ctd>Run the same task corpus on several model families.\u003c/td>\n            \u003ctd>Rule adherence and task success, not prose similarity.\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>Does composition improve maintenance?\u003c/td>\n            \u003ctd>Change one shared behavior in composed and duplicated variants.\u003c/td>\n            \u003ctd>Files touched, regressions, and discoverability failures.\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">68–75 minutes\u003c/span>\n      \u003ch2 id=\"borrowing-ledger\">5. Build your borrowing ledger\u003c/h2>\n      \u003cp>Do not finish with a verdict on the whole repository. Decide principle by principle. \u003cstrong>Adopt\u003c/strong> means the idea transfers as-is; \u003cstrong>adapt\u003c/strong> means it needs a constraint or local translation; \u003cstrong>reject\u003c/strong> means the current evidence does not justify its cost.\u003c/p>\n\n      \u003cdiv class=\"ledger\" id=\"ledger\">\n        \u003cdiv class=\"ledger-item\" data-principle=\"invocation\">\n          \u003cdiv>\n            \u003cstrong>Choose invocation ownership explicitly\u003c/strong>\n            \u003cp>Trade permanent context load against human cognitive load.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for invocation ownership\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"composition\">\n          \u003cdiv>\n            \u003cstrong>Keep entry points thin and compose disciplines\u003c/strong>\n            \u003cp>Reuse behavior through small wrappers such as \u003ccode>grill-with-docs\u003c/code>.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for thin composition\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"completion\">\n          \u003cdiv>\n            \u003cstrong>Write checkable, exhaustive completion criteria\u003c/strong>\n            \u003cp>Define done in terms the agent can verify, not a feeling of completion.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for completion criteria\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"vocabulary\">\n          \u003cdiv>\n            \u003cstrong>Compress behavior into leading words\u003c/strong>\n            \u003cp>Use pretrained concepts such as \u003cem>frontier\u003c/em>, \u003cem>seam\u003c/em>, or \u003cem>tracer bullet\u003c/em>.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for leading words\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"environment\">\n          \u003cdiv>\n            \u003cstrong>Treat the environment as source of truth\u003c/strong>\n            \u003cp>Document the reason or gotcha; let files and tools reveal cheap facts.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for environment as source of truth\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-item\" data-principle=\"model-agnostic\">\n          \u003cdiv>\n            \u003cstrong>Assume model-agnostic transfer\u003c/strong>\n            \u003cp>Expect the same skill text to work across model families without adaptation.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"ledger-controls\" role=\"group\" aria-label=\"Decision for model-agnostic transfer\">\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adopt\">Adopt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"adapt\">Adapt\u003c/button>\n            \u003cbutton class=\"ledger-choice\" type=\"button\" data-value=\"reject\">Reject\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ledger-summary\" id=\"ledger-summary\">0 decided · 6 still open\u003c/div>\n        \u003cbutton class=\"reset-button\" id=\"ledger-reset\" type=\"button\">Reset ledger\u003c/button>\n      \u003c/div>\n\n      \u003cp class=\"takeaway\">The durable idea is not “copy these prompts.” It is “treat agent instructions as a designed system of interfaces, dependencies, attention budgets, and observable stopping conditions.”\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"sources\">\n      \u003ch2 id=\"source-notes\">Source notes\u003c/h2>\n      \u003cp>This lesson was checked against the public repository on August 10, 2026. Use your local clone as the primary working copy and compare it with \u003ca href=\"https://github.com/mattpocock/skills\">mattpocock/skills\u003c/a> when exact wording differs.\u003c/p>\n      \u003cul>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/README.md\">Repository README and skill reference\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\">\u003ccode>writing-for-agents/SKILL.md\u003c/code>\u003c/a> and its \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL-MECHANICS.md\">skill mechanics reference\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\">\u003ccode>grilling/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/grill-with-docs/SKILL.md\">\u003ccode>grill-with-docs/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\">\u003ccode>tdd/SKILL.md\u003c/code>\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const STORAGE_KEY_ROLE = \"course-studio:quiz:session1:profile\";\n    const STORAGE_KEY_EVIDENCE = \"course-studio:quiz:session1:evidence\";\n    const STORAGE_KEY_LEDGER = \"course-studio:quiz:session1:ledger\";\n    const STORAGE_KEY_CASE_TAB = \"course-studio:quiz:session1:case-tab\";\n    const STORAGE_KEY_INVOCATION = \"course-studio:quiz:session1:invocation\";\n    const STORAGE_KEY_ANNOTATION = \"course-studio:quiz:session1:annotation\";\n\n    function loadSaved(key, fallback) {\n      try {\n        const raw = localStorage.getItem(key);\n        return raw ? JSON.parse(raw) : fallback;\n      } catch {\n        return fallback;\n      }\n    }\n\n    function saveState(key, value) {\n      try {\n        localStorage.setItem(key, JSON.stringify(value));\n      } catch {}\n    }\n\n    const roleCases = [\n      {\n        path: \"skills/engineering/grill-with-docs/SKILL.md\",\n        question: \"Profile this seven-line skill without forcing its invocation, content, and compositional job into one label.\",\n        profile: {\n          invocation: \"Human only\",\n          content: \"Step-led\",\n          composition: \"Wrapper\"\n        },\n        feedback: \"It is a human-only entry point containing one imperative step. Its system job is to wrap two model-discoverable dependencies.\",\n        excerpt: \"name: grill-with-docs\\ndisable-model-invocation: true\\n\\nRun a /grilling session, using the /domain-modeling skill.\",\n        outline: [\n          \"Frontmatter makes it a human-only entry point.\",\n          \"Its description promises an interview that also creates durable design documentation.\",\n          \"The body delegates the interview and domain-language behavior instead of repeating either one.\"\n        ]\n      },\n      {\n        path: \"skills/productivity/grilling/SKILL.md\",\n        question: \"Profile the skill that defines design trees, frontiers, rounds, fact-finding ownership, and a stopping condition.\",\n        profile: {\n          invocation: \"Model-discoverable\",\n          content: \"Step-led\",\n          composition: \"Primitive\"\n        },\n        feedback: \"It is model-discoverable, owns an execution loop, and supplies a reusable interview primitive to several workflows.\",\n        excerpt: \"name: grilling\\n\\nInterview the user relentlessly until you reach a shared understanding. Map this as a design tree.\",\n        outline: [\n          \"The model-facing description lists stress-testing and grill-language trigger branches.\",\n          \"A design tree represents dependent decisions; its frontier contains only questions whose prerequisites are settled.\",\n          \"The interaction proceeds in rounds, with a prescribed question format and a wait after each round.\",\n          \"The agent owns discoverable facts while the human owns decisions.\",\n          \"Completion requires an empty frontier and explicit user confirmation.\"\n        ]\n      },\n      {\n        path: \"skills/productivity/writing-for-agents/SKILL.md\",\n        question: \"Profile the skill invoked while writing or editing agent-facing documents. Remember: reference-led does not mean inactive.\",\n        profile: {\n          invocation: \"Model-discoverable\",\n          content: \"Reference-led\",\n          composition: \"Supporting guide\"\n        },\n        feedback: \"It is model-discoverable and actively guides writing, but its body is predominantly concepts, constraints, and criteria rather than an owned execution sequence.\",\n        excerpt: \"name: writing-for-agents\\n\\nEvery document and pointer you add spends one of two budgets: context load and cognitive load.\",\n        outline: [\n          \"Context pointers encode both what material exists and which branches should load it.\",\n          \"An information hierarchy separates in-file steps, in-file reference, and disclosed reference.\",\n          \"Completion criteria are evaluated for clarity and demand.\",\n          \"Leading words compress behavior by recruiting concepts the model already knows.\",\n          \"Pruning removes duplication, stale caches, irrelevant material, and instructions that do not change behavior.\",\n          \"Skill-only invocation mechanics are disclosed into a sibling reference file.\"\n        ]\n      },\n      {\n        path: \"skills/engineering/ask-matt/SKILL.md\",\n        question: \"Profile the manual skill that maps flows, on-ramps, vocabulary layers, phase boundaries, and standalone skills.\",\n        profile: {\n          invocation: \"Human only\",\n          content: \"Mixed\",\n          composition: \"Router\"\n        },\n        feedback: \"It is a human-only router. Its file mixes procedural routes with a reference catalog, which is exactly why one content label cannot describe its whole system role.\",\n        excerpt: \"name: ask-matt\\ndisable-model-invocation: true\\n\\nYou don't remember every skill, so ask.\",\n        outline: [\n          \"The main flow routes an idea through clarification, optional prototyping, specification, tickets, implementation, and review.\",\n          \"On-ramps handle incoming issues, hard bugs, and efforts too large for one session.\",\n          \"Separate sections route codebase health work, shared vocabulary, and phase-boundary decisions.\",\n          \"Standalone skills are cataloged when they do not belong to the main delivery flow.\",\n          \"The router points to manual skills but cannot invoke them on the human's behalf.\"\n        ]\n      }\n    ];\n\n    const profileAxes = [\n      {\n        key: \"invocation\",\n        label: \"1. Invocation — who can discover it?\",\n        options: [\"Human only\", \"Model-discoverable\"],\n        definitions: {\n          \"Human only\": \"Human only: The skill starts only when a person explicitly invokes it (disable-model-invocation: true). Its description is excluded from automatic model discovery.\",\n          \"Model-discoverable\": \"Model-discoverable: The model can discover it automatically from its description, another skill can invoke it, or a human can start it.\"\n        }\n      },\n      {\n        key: \"content\",\n        label: \"2. Content form — what dominates the file?\",\n        options: [\"Step-led\", \"Reference-led\", \"Mixed\"],\n        definitions: {\n          \"Step-led\": \"Step-led: Ordered actions, loops, gates, or stopping conditions dominate the file. The skill actively drives execution sequence.\",\n          \"Reference-led\": \"Reference-led: Definitions, rules, vocabulary, or quality criteria dominate. They guide work whose progression is owned elsewhere.\",\n          \"Mixed\": \"Mixed: Contains substantial procedure and substantial reference; neither is merely a supporting subsection.\"\n        }\n      },\n      {\n        key: \"composition\",\n        label: \"3. Composition — what system job does it perform?\",\n        options: [\"Router\", \"Wrapper\", \"Primitive\", \"Supporting guide\"],\n        definitions: {\n          \"Router\": \"Router: Maps flows and on-ramps. Helps a human choose the right skill but cannot invoke manual skills on their behalf.\",\n          \"Wrapper\": \"Wrapper: A thin entry point that delegates most behavior to other composed skills rather than duplicating instructions.\",\n          \"Primitive\": \"Primitive: A core reusable behavior/state machine (e.g. grilling interview) that several workflows can invoke.\",\n          \"Supporting guide\": \"Supporting guide: Shapes how another task is performed through methods and criteria without owning the full task lifecycle.\"\n        }\n      }\n    ];\n\n    const roleState = loadSaved(STORAGE_KEY_ROLE, { answers: {}, currentIndex: 0 });\n    let roleIndex = Math.min(Math.max(0, Number(roleState.currentIndex) || 0), roleCases.length - 1);\n    let profileSelections = roleState.answers[roleIndex]?.selections || {};\n\n    const roleNav = document.querySelector(\"#role-nav\");\n    const rolePath = document.querySelector(\"#role-path\");\n    const roleQuestion = document.querySelector(\"#role-question\");\n    const roleChoices = document.querySelector(\"#role-choices\");\n    const roleCheck = document.querySelector(\"#role-check\");\n    const roleFeedback = document.querySelector(\"#role-feedback\");\n    const rolePrev = document.querySelector(\"#role-prev\");\n    const roleSkip = document.querySelector(\"#role-skip\");\n    const roleNext = document.querySelector(\"#role-next\");\n    const roleCount = document.querySelector(\"#role-count\");\n    const roleSourceToggle = document.querySelector(\"#role-source-toggle\");\n    const roleSourcePreview = document.querySelector(\"#role-source-preview\");\n    const roleSourceLink = document.querySelector(\"#role-source-link\");\n    const roleSourceExcerpt = document.querySelector(\"#role-source-excerpt\");\n    const roleSourceOutline = document.querySelector(\"#role-source-outline\");\n\n    function renderRoleNav() {\n      roleNav.replaceChildren();\n      roleCases.forEach((_, idx) => {\n        const btn = document.createElement(\"button\");\n        btn.type = \"button\";\n        btn.className = \"quiz-nav-step\";\n        if (idx === roleIndex) btn.classList.add(\"active\");\n        const ans = roleState.answers[idx];\n        if (ans) {\n          if (ans.isCorrect) btn.classList.add(\"correct\");\n          else if (ans.checked) btn.classList.add(\"answered\");\n        }\n        btn.textContent = `Case ${idx + 1}`;\n        btn.setAttribute(\"aria-label\", `Jump to Case ${idx + 1}`);\n        btn.addEventListener(\"click\", () => {\n          roleIndex = idx;\n          roleState.currentIndex = idx;\n          saveState(STORAGE_KEY_ROLE, roleState);\n          renderRoleCase();\n        });\n        roleNav.append(btn);\n      });\n    }\n\n    function renderRoleSource(currentCase) {\n      roleSourceToggle.setAttribute(\"aria-expanded\", \"false\");\n      roleSourceToggle.textContent = \"Expand skill contents\";\n      roleSourcePreview.hidden = true;\n      roleSourceLink.href = `https://github.com/mattpocock/skills/blob/main/${currentCase.path}`;\n      roleSourceExcerpt.textContent = currentCase.excerpt;\n      roleSourceOutline.replaceChildren();\n\n      currentCase.outline.forEach( story and dependency failures could strengthen or overturn it.\"\n      }\n    ];\n\n    const evidenceTooltips = {\n      \"Author claim\": \"Author claim: An explicit assertion by the author in documentation, not supported by cross-model or benchmark data in the repo.\",\n      \"Repository observation\": \"Repository observation: A directly observable fact about code structure, configuration, or file presence in the repository.\",\n      \"Our inference\": \"Our inference: A reasoned deduction, design hypothesis, or tradeoff analysis derived from interpreting the evidence.\"\n    };\n\n    const evidenceOptions = [\"Author claim\", \"Repository observation\", \"Our inference\"];\n    const evidenceState = loadSaved(STORAGE_KEY_EVIDENCE, { answers: {}, currentIndex: 0 });\n    let evidenceIndex = Math.min(Math.max(0, Number(evidenceState.currentIndex) || 0), evidenceCases.length - 1);\n\n    const evidenceNav = document.querySelector(\"#evidence-nav\");\n    const evidenceQuestion = document.querySelector(\"#evidence-question\");\n    const evidenceChoices = document.querySelector(\"#evidence-choices\");\n    const evidenceFeedback = document.querySelector(\"#evidence-feedback\");\n    const evidencePrev = document.querySelector(\"#evidence-prev\");\n    const evidenceSkip = document.querySelector(\"#evidence-skip\");\n    const evidenceNext = document.querySelector(\"#evidence-next\");\n    const evidenceCount = document.querySelector(\"#evidence-count\");\n\n    function renderEvidenceNav() {\n      evidenceNav.replaceChildren();\n      evidenceCases.forEach((_, idx) => {\n        const btn = document.createElement(\"button\");\n        btn.type = \"button\";\n        btn.className = \"quiz-nav-step\";\n        if (idx === evidenceIndex) btn.classList.add(\"active\");\n        const ans = evidenceState.answers[idx];\n        if (ans) {\n          if (ans.isCorrect) btn.classList.add(\"correct\");\n          else if (ans.selected) btn.classList.add(\"answered\"); denceChoices.querySelectorAll(\"button\").forEach((choice) => choice.classList.remove(\"selected\"));\n      button.classList.add(\"selected\");\n      const isCorrect = option === currentCase.answer;\n      const feedbackText = isCorrect\n        ? `Yes. ${currentCase.feedback}`\n        : `The strongest label is ${currentCase.answer}. ${currentCase.feedback}`;\n\n      evidenceFeedback.className = `feedback visible ${isCorrect ? \"correct\" : \"retry\"}`;\n      evidenceFeedback.textContent = feedbackText;\n\n      evidenceState.answers[evidenceIndex] = {\n        selected: option,\n        isCorrect,\n        feedback: feedbackText\n      };\n      saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n      renderEvidenceNav();\n    }\n\n    evidencePrev.addEventListener(\"click\", () => {\n      if (evidenceIndex > 0) {\n        evidenceIndex -= 1;\n        evidenceState.currentIndex = evidenceIndex;\n        saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n        renderEvidenceCase();\n      }\n    });\n\n    evidenceSkip.addEventListener(\"click\", () => {\n      evidenceIndex = (evidenceIndex + 1) % evidenceCases.length;\n      evidenceState.currentIndex = evidenceIndex;\n      saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n      renderEvidenceCase();\n    });\n\n    evidenceNext.addEventListener(\"click\", () => {\n      if (evidenceIndex \u003c evidenceCases.length - 1) {\n        evidenceIndex += 1;\n        evidenceState.currentIndex = evidenceIndex;\n        saveState(STORAGE_KEY_EVIDENCE, evidenceState);\n        renderEvidenceCase();\n      } else {\n        const allCorrect = evidenceCases.every((_, idx) => evidenceState.answers[idx]?.isCorrect);\n        evidenceFeedback.className = `feedback visible ${allCorrect ? \"correct\" : \"\"}`;\n        evidenceFeedback.textContent = allCorrect\n          ? \"All statements correctly classified! Separating author claims, empirical observations, and inferences keeps critique grounded.\"\n          : \"You've reached the end of the statements. Click any Statement tab above to review or update your answers.\";\n      }\n    });\n\n    const ledgerItems = document.querySelectorAll(\".ledger-item\");\n    const ledgerSummary = document.querySelector(\"#ledger-summary\");\n    const ledgerReset = document.querySelector(\"#ledger-reset\");\n    const ledgerDecisions = loadSaved(STORAGE_KEY_LEDGER, {});\n\n    function updateLedgerSummary() {\n      const decisions = Object.values(ledgerDecisions);\n      const counts = { adopt: 0, adapt: 0, reject: 0 };\n      decisions.forEach((decision) => { counts[decision] = (counts[decision] || 0) + 1; });\n      const open = ledgerItems.length - decisions.length;\n      ledgerSummary.textContent = `${decisions.length} decided · ${open} still open · adopt ${counts.adopt} · adapt ${counts.adapt} · reject ${counts.reject}`;\n    }\n\n    ledgerItems.forEach((item) => {\n      const principle = item.dataset.principle;\n      const buttons = item.querySelectorAll(\".ledger-choice\");\n      if (ledgerDecisions[principle]) {\n        buttons.forEach((button) => {\n          if (button.dataset.value === ledgerDecisions[principle]) {\n            button.setAttribute(\"aria-pressed\", \"true\");\n          }\n        });\n      }\n      buttons.forEach((button) => {\n        button.addEventListener(\"click\", () => {\n          ledgerDecisions[principle] = button.dataset.value;\n          saveState(STORAGE_KEY_LEDGER, ledgerDecisions);\n          buttons.forEach((otherButton) => otherButton.setAttribute(\"aria-pressed\", String(otherButton === button)));\n          updateLedgerSummary();\n        });\n      });\n    });\n\n    ledgerReset.addEventListener(\"click\", () => {\n      Object.keys(ledgerDecisions).forEach((key) => delete ledgerDecisions[key]);\n      saveState(STORAGE_KEY_LEDGER, ledgerDecisions);\n      document.querySelectorAll(\".ledger-choice\").forEach((button) => button.setAttribute(\"aria-pressed\", \"false\"));\n      updateLedgerSummary();\n    });\n\n    const progressBar = document.querySelector(\"#progress-bar\");\n\n    function updateProgress() {\n      const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n      const progress = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;\n      progressBar.style.width = `${Math.min(100, Math.max(0, progress))}%`;\n    }\n\n    window.addEventListener(\"scroll\", updateProgress, { passive: true });\n    window.addEventListener(\"resize\", updateProgress);\n\n    renderRoleCase();\n    const activeCaseBtn = document.querySelector(`[data-case=\"${savedCaseTab}\"]`);\n    if (activeCaseBtn) activeCaseBtn.click();\n    else renderCase(\"wrapper\");\n\n    const activeAnnotationBtn = document.querySelector(`[data-annotation=\"${savedAnnotation}\"]`);\n    if (activeAnnotationBtn) activeAnnotationBtn.click();\n    else showAnnotation(\"pointer\", document.querySelector('[data-annotation=\"pointer\"]'));\n\n    const savedInvocation = loadSaved(STORAGE_KEY_INVOCATION, \"user\");\n    const activeInvocationBtn = document.querySelector(`[data-invocation=\"${savedInvocation}\"]`);\n    if (activeInvocationBtn) selectInvocation(savedInvocation, activeInvocationBtn);\n\n    renderEvidenceCase();\n    updateLedgerSummary();\n    updateProgress();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session1.zh-CN.html","basePath":"session1.html","lang":"zh-CN","kind":"lesson","title":"阅读技能系统","translations":{"en":"session1.html","zh-CN":"session1.zh-CN.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"阅读技能系统\">\n  \u003ctitle>阅读技能系统 — MattPocock 技能\u003c/title>\n  \u003cstyle>\n    :root {\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d6;\n      --ink: #28251f;\n \n    .feedback.retry { border-left: 3px solid var(--accent); }\n\n    .quiz-nav {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1rem;\n      padding-bottom: 0.75rem;\n      border-bottom: 1px dashed var(--line);\n    }\n\n    .quiz-nav-step {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.35rem;\n      padding: 0.32rem 0.65rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      background: rgba(255, 253, 248, 0.75);\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.7rem;\n      cursor: pointer;\n      transition: all 120ms ease;\n    }\n\n    .quiz-nav-step:hover {\n      border-color: var(--accent);\n      color: var(--ink);\n    }\n\n    .quiz-nav-step.active {\n      border-color: var(--accent);\n      background: var(--accent-soft);\n      color: var(--accent-dark);\n      font-weight: 600;\n    }\n\n    .quiz-nav-step.correct {\n      border-color: var(--sage);\n      background: var(--sage-soft);\n      color: #384937;\n    }\n\n    .quiz-nav-step.answered {\n      border-color: var(--blue);\n      background: var(--blue-soft);\n      color: #334856;\n    }\n\n    .quiz-actions {\n      display: flex;\n      align-items: center;\n      justify-content: flex-end;\n      gap: 0.6rem;\n      flex-wrap: wrap;\n      margin-top: 1.1rem;\n    }\n\n    .quiz-action-group {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.5rem;\n    }\n\n    .next-button,\n    .check-button,\n    .reset-button {\n      padding: 0.55rem 0.85rem;\n      border-radius: 999px;\n      font-family: var(--mono);\n      font-size: 0.74rem;\n      cursor: pointer;\n      transition: all 120ms ease;\n    }\n\n    .next-button,\n    .check-button {\n      border: 1px solid var(--accent);\n      color: #fffaf1;\n      background: var(--accent);\n    }\n\n    .next-button:disabled,\n    .check-button:disabled {\n      cursor: not-allowed;\n      opacity: 0.45;\n    }\n\n    .choice {\n      position: relative;\n    }\n\n    .choice[data-help]::after {\n      position: absolute;\n      z-index: 20;\n      bottom: calc(100% + 0.55rem);\n      left: 50%;\n      width: min(19rem, 80vw);\n      padding: 0.65rem 0.75rem;\n      border: 1px solid var(--line);\n      border-radius: 0.45rem;\n      opacity: 0;\n      color: var(--ink);\n      background: #fffdf9;\n      box-shadow: 0 12px 30px rgba(76, 58, 40, 0.18);\n      content: attr(data-help);\n      font-family: var(--sans);\n      font-size: 0.76rem;\n      line-height: 1.45;\n      pointer-events: none;\n      text-align: left;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 140ms ease, transform 140ms ease;\n    }\n\n    .choice[data-help]:hover::after,\n    .choice[data-help]:focus-visible::after {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .tabs {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.5rem;\n      margin: 1rem 0;\n    }\n\n    .tab { text-align: center; }\n\n    .case-reader { overflow: hidden; }\n\n    .case-content { padding: 1.35rem; }\n\n    .case-content h3 { margin-top: 0; }\n\n    .path {\n      color: var(--muted);\n      font-size: 0.73rem;\n      overflow-wrap: anywhere;\n    }\n\n    pre {\n      margin: 1.15rem 0;\n      padding: 1rem;\n      overflow-x: auto;\n      border-radius: 0.45rem;\n      color: #f8efe3;\n      background: #312c27;\n      font-family: var(--mono);\n      font-size: 0.8rem;\n      line-height: 1.55;\n      white-space: pre-wrap;\n    }\n\n    pre code { padding: 0; color: inherit; background: transparent; font-size: inherit; }\n\n    .case-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1rem;\n    }\n\n    .case-grid div {\n      padding: 0.9rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n    }\n\n    .case-grid p { margin: 0; font-size: 0.92rem; }\n\n    .annotation-layout {\n      display: grid;\n      grid-template-columns: minmax(0, 1.35fr) minmax(12rem, 0.65fr);\n      gap: 1rem;\n      margin-top: 1rem;\n    }\n\n    .skill-sheet {\n      padding: 1rem;\n      border-radius: 0.45rem;\n      color: #f8efe3;\n      background: #312c27;\n      font-family: var(--mono);\n      font-size: 0.76rem;\n      line-height: 1.58;\n    }\n\n    .skill-line {\n      display: block;\n      margin: 0 -0.4rem;\n      padding: 0.08rem 0.4rem;\n      border-left: 3px solid transparent;\n    }\n\n    .skill-line.highlight {\n      border-left-color: #d69a78;\n      background: rgba(214, 154, 120, 0.14);\n    }\n\n    .annotation-controls { display: grid; gap: 0.5rem; align-content: start; }\n    .annotation-button { text-align: left; }\n\n    .annotation-note {\n      min-height: 8rem;\n      margin-top: 0.7rem;\n      padding: 0.85rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-size: 0.88rem;\n    }\n\n    .steps {\n      margin: 1.4rem 0;\n      counter-reset: drafting;\n      list-style: none;\n      padding: 0;\n    }\n\n    .steps li {\n      position: relative;\n      padding: 0 0 1.3rem 3rem;\n      counter-increment: drafting;\n    }\n\n    .steps li::before {\n      position: absolute;\n      top: 0;\n      left: 0;\n      display: grid;\n      width: 2rem;\n      height: 2rem;\n      place-items: center;\n      border: 1px solid var(--accent);\n      border-radius: 50%;\n      color: var(--accent);\n      content: counter(drafting);\n      font-family: var(--mono);\n      font-size: 0.76rem;\n    }\n\n    .steps strong { display: block; }\n\n    .decision-panel { margin-top: 1.8rem; padding: 1.35rem; }\n\n    .invocation-toggle {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.6rem;\n      margin: 1rem 0;\n    }\n\n    .invocation-toggle button {\n      padding: 0.75rem;\n      border-radius: 0.45rem;\n      font-family: var(--mono);\n      font-size: 0.77rem;\n    }\n\n    .load-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1rem;\n      margin-top: 1rem;\n    }\n\n    .meter-label {\n      display: flex;\n      justify-content: space-between;\n      color: var(--muted);\n      font-size: 0.72rem;\n    }\n\n    .meter {\n      height: 0.55rem;\n      margin-top: 0.4rem;\n      overflow: hidden;\n      border-radius: 999px;\n      background: var(--paper-deep);\n    }\n\n    .meter-fill {\n      width: 50%;\n      height: 100%;\n      border-radius: inherit;\n      background: var(--accent);\n      transition: width 220ms ease;\n    }\n\n    .decision-copy {\n      min-height: 4.5rem;\n      margin-bottom: 0;\n      color: #514a42;\n    }\n\n    .comparison {\n      width: 100%;\n      margin: 1.5rem 0;\n      border-collapse: collapse;\n      font-size: 0.93rem;\n    }\n\n    .comparison th,\n    .comparison td {\n      padding: 0.85rem 0.7rem;\n      border-bottom: 1px solid var(--line);\n      text-align: left;\n      vertical-align: top;\n    }\n\n    .comparison th {\n      color: var(--muted);\n      font-family: var(--mono);\n      font-size: 0.72rem;\n      letter-spacing: 0.04em;\n      text-transform: uppercase;\n    }\n\n    .tag {\n      display: inline-block;\n      padding: 0.15rem 0.42rem;\n      border-radius: 999px;\n      font-size: 0.68rem;\n    }\n\n    .tag.claim { color: var(--accent-dark); background: var(--accent-soft); }\n    .tag.observation { color: #3e553d; background: var(--sage-soft); }\n    .tag.inference { color: #395667; background: var(--blue-soft); }\n\n    .ledger { margin-top: 1.5rem; padding: 1.35rem; }\n\n    .ledger-item {\n      display: grid;\n      grid-template-columns: 1fr auto;\n      gap: 1rem;\n      padding: 1rem 0;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .ledger-item:last-of-type { border-bottom: 0; }\n    .ledger-item p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }\n\n    .ledger-controls {\n      display: flex;\n      gap: 0.35rem;\n      align-items: start;\n    }\n\n    .ledger-choice {\n      padding: 0.42rem 0.55rem;\n      font-size: 0.68rem;\n      text-align: center;\n    }\n\n    .ledger-choice[data-value=\"adopt\"][aria-pressed=\"true\"] { border-color: var(--sage); background: var(--sage); }\n    .ledger-choice[data-value=\"adapt\"][aria-pressed=\"true\"] { border-color: var(--blue); background: var(--blue); }\n    .ledger-choice[data-value=\"reject\"][aria-pressed=\"true\"] { border-color: var(--accent); background: var(--accent); }\n\n    .ledger-summary {\n      margin-top: 1rem;\n      padding: 0.85rem 1rem;\n      border-radius: 0.42rem;\n      background: var(--paper-deep);\n      font-family: var(--mono);\n      font-size: 0.78rem;\n    }\n\n    .takeaway {\n      margin-top: 2rem;\n      font-size: 1.18rem;\n      font-style: italic;\n      line-height: 1.55;\n    }\n\n    .sources { color: var(--muted); font-size: 0.86rem; }\n\n    @media (max-width: 760px) {\n      .opening, .case-grid, .load-grid, .annotation-layout { grid-template-columns: 1fr; }\n      .choice-grid { grid-template-columns: 1fr; }\n      .axis-labels, .quadrants { grid-template-columns: 1fr; }\n      .row-label { margin-top: 0.6rem; }\n      .invocation-chain { flex-direction: column; }\n      .invocation-arrow { transform: rotate(90deg); }\n      .ledger-item { grid-template-columns: 1fr; }\n    }\n\n    @media (max-width: 540px) {\n      main { padding-top: 3rem; }\n      .system-map { padding: 1rem; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv class=\"progress-bar\" id=\"progress-bar\">\u003c/div>\u003c/div>\n\n  \u003cmain>\n    \u003cheader>\n      \u003cp class=\"eyebrow\">第 1 课 · 深度精读\u003c/p>\n      \u003ch1>剖析文件背后的系统架构\u003c/h1>\n      \u003cp class=\"lede\">Matt Pocock 的开源 Skill 库最具价值之处，不在于它是一堆现成的 Prompt，而在于它提供了一套完整的架构范式：如何在人类、Agent 与一系列精简的文档之间合理分配工程判断力。\u003c/p>\n      \u003cp class=\"meta\">75 分钟 · 进阶 · 源码优先 · 交互式学习\u003c/p>\n\n      \u003cdiv class=\"opening\">\n        \u003cdiv>\n          \u003ch2 id=\"reading-rule\">阅读检验准则\u003c/h2>\n          \u003cp>对于课程中的每一个结论，都要追问它究竟是 \u003cstrong>作者的主张\u003c/strong>、\u003cstrong>仓库的代码事实\u003c/strong>，还是 \u003cstrong>我们的推论\u003c/strong>。\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"working-corpus\">核心研读材料\u003c/h2>\n          \u003cp>\u003ccode>README.md\u003c/code> 加上 5 个具有鲜明对比的 \u003ccode>SKILL.md\u003c/code> 文件：\u003ccode>ask-matt\u003c/code>、\u003ccode>grill-with-docs\u003c/code>、\u003ccode>grilling\u003c/code>、\u003ccode>tdd\u003c/code>，以及元指南 \u003ccode>writing-for-agents\u003c/code>。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection>\n      \u003cspan class=\"time\">0–12 分钟\u003c/span>\n      \u003ch2 id=\"map-the-system\">1. 细读正文前，先俯瞰系统全貌\u003c/h2>\n      \u003cp>该仓库的 README 提出了三大主张：Skills 体积小巧、自适应强且支持高度组合；它们始终保留开发者的主导权；它们能跨模型通用。我们要把这些当作作者的“设计初衷”，而非已被充分实证的既定结论。\u003c/p>\n\n      \u003cdiv class=\"claim-strip\">\n        \u003cspan class=\"label\">作者主张\u003c/span>\n        \u003cp>该项目将软件工程的底层基本功浓缩为 Agent 可重复执行的实践规范，同时避免让庞大的重型框架接管整个工作流。\u003c/p>\n      \u003c/div>\n\n      \u003ch3 id=\"two-organizing-axes\">两大组织维度\u003c/h3>\n      \u003cp>目录结构提供了一个导航维度：\u003cstrong>工程类 (Engineering)\u003c/strong> 与 \u003cstrong>效能类 (Productivity)\u003c/strong>。而调用方式则构成了更具深远影响的架构维度：由谁来负责识别并触发某个 Skill 的运行？\u003c/p>\n\n      \u003cdiv class=\"system-map\" aria-label=\"按领域和调用划分的代表性技能地图\">\n        \u003cdiv class=\"axis-labels\">\n          \u003cspan>\u003c/span>\n          \u003cspan>人工主动触发\u003c/span>\n          \u003cspan>模型可自动发现（人类亦可调用）\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"quadrants\">\n          \u003cdiv class=\"row-label\">工程类\u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>仅限人工调用的入口\u003c/strong>\n            \u003cspan>ask-matt\u003c/span>\n            \u003cspan>grill-with-docs\u003c/span>\n            \u003cspan>implement\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>模型可发现的 Skill\u003c/strong>\n            \u003cspan>tdd\u003c/span>\n            \u003cspan>diagnosing-bugs\u003c/span>\n            \u003cspan>codebase-design\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"row-label\">效能类\u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>仅限人工调用的入口\u003c/strong>\n            \u003cspan>grill-me\u003c/span>\n            \u003cspan>handoff\u003c/span>\n            \u003cspan>teach\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quadrant\">\n            \u003cstrong>模型可发现的 Skill\u003c/strong>\n            \u003cspan>grilling\u003c/span>\n            \u003cspan>writing-for-agents\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">重要的非对称性\u003c/span>\n        \u003cp>\u003cstrong>“模型可调用”并不等于“仅限模型调用”。\u003c/strong> 人类依然可以直接手动调用这些 Skill。添加 description 只是赋予了模型自动发现它的能力。而“仅限用户调用”才属于排他场景：由于没有向模型暴露 description，只有人类才能显式启动它们。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"callout sage\">\n        \u003cspan class=\"label\">仓库事实观察\u003c/span>\n        \u003cp>仅限用户调用的 Skill 均声明了 \u003ccode>disable-model-invocation: true\u003c/code>，它们的 description 是写给人类阅读的。而模型可调用的 Skill 其 description 会被注入常驻上下文中供 Agent 检索，因此在每一轮对话中都会产生 Token 成本。这种架构也使得手动入口能够自由编排和复用模型可调用的底层规范。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"invocation-chain\" aria-label=\"人类意图通过一个入口流向模型可发现的辅助技能\">\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>人类意图\u003c/strong>\n          \u003cspan>“对该方案进行深度质询，并沉淀我们讨论出的设计文档。”\u003c/span>\n        \u003c/div>\n        \u003cspan class=\"invocation-arrow\" aria-hidden=\"true\">→\u003c/span>\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>手动入口点\u003c/strong>\n          \u003cspan>grill-with-docs\u003c/span>\n        \u003c/div>\n        \u003cspan class=\"invocation-arrow\" aria-hidden=\"true\">→\u003c/span>\n        \u003cdiv class=\"invocation-node\">\n          \u003cstrong>底层支撑 Skill\u003c/strong>\n          \u003cspan>grilling + domain-modeling\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"invocation-is-architecture\">调用方式即系统架构\u003c/h3>\n      \u003cp>这绝不仅仅是一个元数据开关。按照该仓库自身的设计理论，它分配的是两种稀缺资源：\u003c/p>\n      \u003cul>\n        \u003cli>\u003cstrong>常驻上下文负载 (Context load)：\u003c/strong> 常驻在 Prompt 中的 Skill 描述所占用的注意力与 Token 预算。\u003c/li>\n        \u003cli>\u003cstrong>人类认知负荷 (Cognitive load)：\u003c/strong> 人类工程师记住在何时使用哪个手动入口所耗费的心智成本。\u003c/li>\n      \u003c/ul>\n      \u003cp>模型调用的 Skill 用上下文换取了自动发现能力；人工调用的 Skill 则通过让“人脑”充当索引，实现了零常驻上下文开销。像 \u003ccode>ask-matt\u003c/code> 这样的路由器，正是为了在手动 Skill 目录过于庞大、人类难以完全记忆时提供检索指引。\u003c/p>\n\n      \u003ch3 id=\"folders-are-navigation\">目录分类是导航检索，而非严格本体论\u003c/h3>\n      \u003cp>在日常语境中，\u003cem>生产力 (Productivity)\u003c/em> 通常包含工程效能。但该仓库对该词的使用更为聚焦：\u003cstrong>不特属于代码实现的通用工作流\u003c/strong>。基于这层理解，两个文件夹的含义可以更直观地划分为：\u003c/p>\n\n      \u003cdiv class=\"case-grid\">\n        \u003cdiv>\n          \u003ch4 id=\"general-workflow-layer\">效能类 → 通用工作流层\u003c/h4>\n          \u003cp>跨领域的交互与上下文管理实践：\u003ccode>grilling\u003c/code>、\u003ccode>handoff\u003c/code>、\u003ccode>teach\u003c/code> 与 \u003ccode>writing-for-agents\u003c/code>。\u003c/p>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch4 id=\"engineering-specialization-layer\">工程类 → 软件工程专业层\u003c/h4>\n          \u003cp>强依赖代码、测试、代码库、架构或 Issue 跟踪等具体工程概念的实践：\u003ccode>tdd\u003c/code>、\u003ccode>code-review\u003c/code> 与 \u003ccode>implement\u003c/code>。\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp>这两者的边界是具有渗透性的。例如 \u003ccode>grill-with-docs\u003c/code> 归在 engineering 目录下，因为它会在代码库中沉淀 ADR 或架构文档，但它底层复用了通用的 \u003ccode>grilling\u003c/code> 核心逻辑。因此，更准确的心智模型是 \u003cstrong>通用底座层 → 工程落地层\u003c/strong>，而不是非此即彼的‘工作效率 vs 软件工程’。\u003c/p>\n\n      \u003ch3 id=\"independent-skill-axes\">三条独立分析维度，而非单一角色分类\u003c/h3>\n      \u003cp>一个 Skill 不应被强行套入某个互斥的单一角色中。仓库本身定义了调用权和内容形式；而组合职责则是我们在课程中引入的系统透镜。请将这三个问题分开审视：\u003c/p>\n\n      \u003ctable class=\"comparison\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>维度\u003c/th>\n            \u003cth>核心问题\u003c/th>\n            \u003cth>剖析选项\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>调用机制\u003c/td>\n            \u003ctd>谁能发现并触发它？\u003c/td>\n            \u003ctd>仅限人工 · 模型可自动发现\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>内容形态\u003c/td>\n            \u003ctd>文件的主体内容是什么？\u003c/td>\n            \u003ctd>步骤流主导 · 参考规范主导 · 两者混合\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>组合职责\u003c/td>\n            \u003ctd>它在系统中扮演什么角色？\u003c/td>\n            \u003ctd>流程路由 · 包装器 · 核心原语 · 支撑指南\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">纠偏：关于 writing-for-agents 的定位\u003c/span>\n        \u003cp>\u003ccode>writing-for-agents\u003c/code> 是 \u003cstrong>参考规范主导，但绝非被动无为\u003c/strong>。当你在编写或修改面向 Agent 的文档时调用它，其规则会主动约束并指导你的工作。调用方发起具体的写作任务，该 Skill 则提供概念定义、硬性约束与质量验收标准。“参考规范”描述的是其内容组织形式，并不代表它不驱动具体的行为实践。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"lab\" id=\"classification-lab\">\n        \u003cdiv class=\"lab-header\">\n          \u003ch3 id=\"classify-the-role\">构建 Skill 架构档案\u003c/h3>\n          \u003cdiv class=\"lab-header-controls\" aria-label=\"案例导航\">\n            \u003cbutton class=\"card-arrow\" id=\"role-prev\" type=\"button\" aria-label=\"上一个案例\" title=\"上一个案例\">←\u003c/button>\n            \u003cspan class=\"lab-count\" id=\"role-count\">1 / 4\u003c/span>\n            \u003cbutton class=\"card-arrow\" id=\"role-skip\" type=\"button\" aria-label=\"跳到下一个案例\" title=\"跳到下一个案例\">→\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"quiz-nav\" id=\"role-nav\" role=\"tablist\" aria-label=\"问题案例\">\u003c/div>\n        \u003cp class=\"question-path\" id=\"role-path\">\u003c/p>\n        \u003cbutton class=\"skill-preview-toggle\" id=\"role-source-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"role-source-preview\">展开技能内容\u003c/button>\n        \u003cdiv class=\"skill-preview\" id=\"role-source-preview\" hidden>\n          \u003cdiv class=\"skill-preview-header\">\n            \u003cstrong>内部实现概览\u003c/strong>\n            \u003ca class=\"skill-preview-link\" id=\"role-source-link\" href=\"#\" target=\"_blank\" rel=\"noreferrer\">打开源文件 ↗\u003c/a>\n          \u003c/div>\n          \u003cpre>\u003ccode id=\"role-source-excerpt\">\u003c/code>\u003c/pre>\n          \u003cp class=\"preview-caption\">简短代码片段，后附完整文件的结构概览：\u003c/p>\n          \u003cul class=\"preview-outline\" id=\"role-source-outline\">\u003c/ul>\n        \u003c/div>\n        \u003cp class=\"question-text\" id=\"role-question\">\u003c/p>\n        \u003cp class=\"profile-hint\">悬停或聚焦任意选项可查看其定义及在系统中的定位。\u003c/p>\n        \u003cdiv class=\"profile-axes\" id=\"role-choices\">\u003c/div>\n        \u003cdiv class=\"feedback\" id=\"role-feedback\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"quiz-actions\">\n          \u003cdiv class=\"quiz-action-group\">\n            \u003cbutton class=\"check-button\" id=\"role-check\" type=\"button\" disabled>检查档案\u003c/button>\n            \u003cbutton class=\"next-button\" id=\"role-next\" type=\"button\">下一个案例 →\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout blue\">\n        \u003cspan class=\"label\">我们的推论\u003c/span>\n        \u003cp>该仓库的组织逻辑更像一个浅层依赖图（Dependency Graph），而非扁平的指令脚本库：人类可见的手动入口在顶层，可复用的底层行为与指南在下方，统一的专业词汇贯穿始终。这些职责往往在一个 Skill 内部交织协同。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">12–32 分钟\u003c/span>\n      \u003ch2 id=\"four-skill-shapes\">2. 四种 Skill 形态，一套统一系统\u003c/h2>\n      \u003cp>不同 Skill 的篇幅长短悬殊，因为它们承担着截然不同的系统职责。切换查看各个案例并追问：它的接口是什么？行为逻辑落在何处？它的终止条件是什么？\u003c/p>\n\n      \u003cdiv class=\"tabs\" role=\"tablist\" aria-label=\"选择一个技能案例\">\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"wrapper\" aria-selected=\"true\" aria-pressed=\"true\">轻量包装器 (Thin wrapper)\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"primitive\" aria-selected=\"false\">核心原语 (Primitive)\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"discipline\" aria-selected=\"false\">实践规范 (Discipline)\u003c/button>\n        \u003cbutton class=\"tab\" type=\"button\" role=\"tab\" data-case=\"reference\" aria-selected=\"false\">参考导向指南 (Reference-led)\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"case-reader\" aria-live=\"polite\">\n        \u003cdiv class=\"case-content\" id=\"case-content\">\u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"anatomy-bench\">解剖台：剖析 \u003ccode>grilling\u003c/code> 如何控制行为\u003c/h3>\n      \u003cp>下方精简版代码保留了该 Skill 的核心控制结构。点击不同标注，查看每个部分所贡献的控制机制。\u003c/p>\n\n      \u003cdiv class=\"annotation-layout\">\n        \u003cdiv class=\"skill-sheet\" aria-label=\"grilling 技能的精简结构\">\n          \u003cspan class=\"skill-line\" data-region=\"pointer\">description: 针对方案或想法进行极限质询与压力测试\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"primitive\">model: 将所有待决事项建模为设计树 (Design Tree)\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"primitive\">unit: 仅质询当前前沿分支上未受阻的关键问题\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"sequence\">loop: 发起一轮质询 → 等待回答 → 重新计算前沿\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"ownership\">ownership: Agent 负责查明客观事实，人类负责拍板决策\u003c/span>\n          \u003cspan class=\"skill-line\" data-region=\"completion\">done: 设计树前沿清空 + 用户明确确认方案对齐\u003c/span>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"annotation-controls\">\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"pointer\">触发指针 (Trigger pointer)\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"primitive\">引导概念 (Leading concepts)\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"sequence\">执行闭环 (Execution loop)\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"ownership\">主导权边界 (Agency boundary)\u003c/button>\n            \u003cbutton class=\"annotation-button\" type=\"button\" data-annotation=\"completion\">完成标准 (Completion criterion)\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"annotation-note\" id=\"annotation-note\" aria-live=\"polite\">选择一个层次查看。本课的核心启发并非每个 Skill 都必须凑齐这五个层次，而是每一个存在的层次都必须有清晰的控制职责。\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"callout\">\n        \u003cspan class=\"label\">精读结论\u003c/span>\n        \u003cp>\u003ccode>grilling\u003c/code> 虽然行数极少，但指令极为紧凑。它定义了一个状态模型（\u003cem>设计树\u003c/em>）、一个调度算法（\u003cem>决策前沿\u003c/em>）、一个交互循环（\u003cem>质询轮次\u003c/em>）、权责边界划分，以及详尽无遗的终止条件。这些高度提炼的专业概念承担了大部分语义压缩工作。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cspan class=\"time\">32–52 分钟\u003c/span>\n      \u003ch2 id=\"reverse-engineer-drafting\">3. 逆向推导 Skill 起草方法论\u003c/h2>\n      \u003cp>仓库中的 \u003ccode>writing-for-agents\u003c/code> 之所以极具价值，是因为它显式沉淀了一套 Prompt 创作理论。下方方法是基于该理论与案例源码重构提炼的实践路径——而非死板的教条。\u003c/p>\n\n      \u003col class=\"steps\">\n        \u003cli>\n          \u003cstrong>从高频出现的失效模式切入。\u003c/strong>\n          “TDD”只是一个主题概念；而“Agent 编写了与实现强耦合的测试且跳过了 Red 失败阶段”才是一个具有明确可观测失效的行为问题。\n        \u003c/li>\n        \u003cli>\n          \u003cstrong>明确触发权的归属。\u003c/strong>\n          如果 Agent 必须在日常工作中自主触发该行为（或被其他 Skill 自动调用），就必须支付常驻上下文负载将其设为模型可发现；否则应保持仅限人工调用。\n        \u003c/li>\n        \u003cli>\
