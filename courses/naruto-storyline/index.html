ontent = String(questionIndex + 1); tab.addEventListener(\"click\", function () { goToQuestion(questionIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"question-\" + questionIndex; panel.className = \"question-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = questionIndex !== quizState.current;\n          var count = document.createElement(\"div\"); count.className = \"question-count\"; count.textContent = \"问题 \" + (questionIndex + 1) + \" / \" + questions.length;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = question.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          question.options.forEach(function (choice, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"question-\" + questionIndex; input.value = String(optionIndex); input.checked = Number(quizState.answers[questionIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerQuestion(questionIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.appendChild(document.createTextNode(choice.text + \" \"));\n            var help = document.createElement(\"span\"); help.className = \"term\"; help.tabIndex = 0; help.textContent = \"概念提示\";\n            var tooltip = document.createElement(\"span\"); tooltip.className = \"tooltip\"; tooltip.setAttribute(\"role\", \"tooltip\"); tooltip.textContent = choice.help; help.appendChild(tooltip); text.appendChild(help); label.append(input, text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = quizState.answers[questionIndex];\n          if (selected === undefined) feedback.textContent = quizState.skipped.indexOf(questionIndex) !== -1 ? \"这题已暂时跳过。你可以随时回来。\" : \"选择后会立即看到解释；也可以先查看选项后的概念提示。\";\n          else { var correct = Number(selected) === question.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = question.feedback[Number(selected)]; }\n          panel.append(count, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"quiz-prev\").disabled = quizState.current === 0;\n        document.getElementById(\"quiz-next\").textContent = quizState.current === questions.length - 1 ? \"回到第一题 ↺\" : \"下一题 →\";\n      }\n      document.getElementById(\"quiz-prev\").addEventListener(\"click\", function () { goToQuestion(quizState.current - 1); });\n      document.getElementById(\"quiz-next\").addEventListener(\"click\", function () { goToQuestion(quizState.current === questions.length - 1 ? 0 : quizState.current + 1); });\n      document.getElementById(\"quiz-skip\").addEventListener(\"click\", skipQuestion);\n      renderQuiz();\n    }());\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"}],"conversations":[{"id":"01a02dca-5c67-7442-86fc-462d52ddf900","title":"生成下一课，session 05","createdAt":"2026-08-23T08:43:51.000Z","updatedAt":"2026-08-23T08:43:51.000Z","turns":[{"id":"01a02dca-94c2-7e01-88a0-ebc159dabc5b","prompt":"生成下一课，session 05","response":"已生成第 5 讲：[session5.html](/Users/zhenghe/.courses/naruto-storyline/session5.html)。\n\n本课包含忍界大战七个关键转折、三种和平方案的对照，以及联盟生成器、和平价值控制台、战局研判和认知测验。所有互动支持跳过、回看并通过 `localStorage` 自动保存进度；已完成浏览器实测。","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"},{"id":"01a02ed5-7598-7e03-b9f0-ad10b556bc3f","prompt":"带土为什么接受了斑的邀请，替他在衰老死亡后继续完成月之眼计划","response":"一句话说：带土并不是被斑的一番演说说服，而是在斑精心制造的琳之死中彻底失去了对现实的信任；月之眼计划随后成了唯一能够同时“否定这个世界”并“取回琳”的出口。\n\n完整心理链条是：\n\n**斑预先植入解释框架 → 制造琳之死 → 带土把局部惨剧推演为世界本质 → 月之眼成为唯一解法**\n\n具体来说：\n\n1. **带土起初明确拒绝了斑。**  \n   被斑救活后，他仍想返回卡卡西和琳身边，也仍然相信成为火影、保护同伴具有意义。此时单凭“现实都是地狱”的说教，斑无法说服他。\n\n2. **斑没有继续争辩，而是安排了一场足以摧毁带土信念的“现实证据”。**  \n   斑操纵雾隐将三尾封入琳体内，迫使琳为了保护木叶，主动撞上卡卡西的雷切；同时确保带土恰好目睹这一幕。带土看到的不是复杂真相，而是“我最信任的同伴亲手杀死我最爱的人”。\n\n3. **这一幕同时摧毁了带土的三根精神支柱。**\n\n   - 琳死去：守护挚爱的承诺破产。\n   - 卡卡西成为“凶手”：同伴之间的信任看似破产。\n   - 木叶与忍村战争是悲剧背景：成为火影、守护现实世界的理想看似破产。\n\n   对带土而言，这不是简单的失恋，而是他用来理解世界的整套价值体系在同一瞬间坍塌。\n\n4. **斑早先的理论因此突然显得“被现实证明了”。**  \n   斑的论点是：只要真实的人拥有自由意志，只要世界存在战争和偶然，人便永远可能失去所爱。此前带土认为这是老人的虚无妄言；琳死后，他却把眼前惨剧理解成了这一理论的实证。\n\n5. **月之眼计划恰好满足了带土当时最强烈的三个需要。**\n\n   - 让琳重新存在；\n   - 让“卡卡西杀死琳”的现实失去真实性；\n   - 建立一个再也不会发生背叛、战争与离别的世界。\n\n   因此他接受的不是“替斑征服世界”的任务，而是一种更激进的信念：这个现实没有修复价值，真正值得拯救的是梦境中的世界。\n\n6. **继续执行计划，也成了带土维持自我解释的方式。**  \n   如果承认现实仍可能值得守护，他就必须面对一个极其痛苦的事实：琳之死固然由斑设计，却并没有强迫他发动九尾之乱、操纵“晓”或掀起大战。为了避免这种责任与悔恨，他必须不断证明“所有人最终都会绝望”“现实本来就是地狱”。所以他尤其执着于击垮鸣人——鸣人正是那个遭受巨大失去后，仍选择现实羁绊的“另一种带土”。\n\n但需要严格区分两件事：\n\n- **斑制造了创伤和认知陷阱**，解释了带土为什么会走到那个悬崖边；\n- **带土自己把琳的死亡扩展成对整个世界的死刑判决**，并主动执行之后的暴行。\n\n所以，带土既是斑精心塑造的受害者，也是后来主动制造同类悲剧的行动者。琳之死解释了他的转变，却不能替他完成此后每一次选择。","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"},{"id":"01a02ee8-0482-7001-b303-d869ce06b788","prompt":"session 5 看完了，进入下一个 session, session 06","response":"已生成最终课：[session6.html](/Users/zhenghe/.courses/naruto-storyline/session6.html)。\n\n本课聚焦佐助的“终极革命”、鸣人的回应、终结之谷二番战及千年轮回终止的真正机制，并加入革命解剖、制度压力审计、战局研判和最终测验。所有互动支持跳过、回看及自动保存，已通过浏览器实测。","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"},{"id":"01a02f22-b73d-76a0-92c9-51c0bb058566","prompt":"我觉得应该再加一节，火影忍者的哲学内核探讨，综合本课程内容和相关的哲学思想，著名哲学家，不同流派的哲学思想，对相同问题会如何看待？比如可以有一些很有意思的视角，亚里士多德会如何看待鸣佐的命运，等等。不求全，但是要有启发性","response":"已新增第 7 讲：[session7.html](/Users/zhenghe/.courses/naruto-storyline/session7.html)。\n\n本讲包含：\n\n- 亚里士多德视角的鸣佐命运专题。\n- 八位思想家针对无限月读、佐助革命和鸣人羁绊的 24 组圆桌回应，每种观点均标注自身盲点。\n- 罗尔斯“无知之幕”忍界制度实验，以及跨流派辨析测验。\n- 原典与权威资料延伸入口，核心概念参考了[亚里士多德伦理学](https://plato.stanford.edu/entries/aristotle-ethics/)、[阿伦特](https://plato.stanford.edu/entries/arendt/)、[荀子](https://plato.stanford.edu/entries/xunzi/)、[龙树](https://iep.utm.edu/nagarjun/)和[罗尔斯的原初状态](https://plato.stanford.edu/entries/original-position/)等资料。\n\n同时已将大纲扩展为 7 讲、约 200 分钟，更新前六讲的总讲数，并在第 6 讲结尾加入通往哲学进阶篇的入口。互动与刷新恢复均已实测通过。","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"},{"id":"01a03429-e06e-7c32-9c17-2074b20ca728","prompt":"我大概阅读了一下。我觉得这部分内容有点发散，我希望更集中地只探讨一个问题，辉夜、羽衣（六道仙人）、宇智波斑、柱间、带土、鸣人、佐助对于和平应该如何实现的看法（如果雷同的可以合并），在不同的哲学家看来有什么区别，它们会如何选择，我希望内容会先比较详细地介绍这个哲学家与此问题相关的核心哲学理念，然后再陈述它们会怎么看待这件具体的事。","response":"已重写 [session7.html](/Users/zhenghe/.courses/naruto-storyline/session7.html)，现在只聚焦“和平应当如何实现”：\n\n- 将七位人物归并为六条和平道路，其中斑与带土合并为“月之眼”路线。\n- 选取亚里士多德、霍布斯、康德、龙树、阿伦特、荀子。\n- 每位哲学家均按“核心理念 → 逐一评价六条道路 → 最终选择 → 理论盲点”展开。\n- 增加方案显微镜、哲学家立场预测和最终检验，学习状态会自动保存。\n- 同步更新了 [课程大纲](/Users/zhenghe/.courses/naruto-storyline/syllabus.html) 与 [第六讲入口](/Users/zhenghe/.courses/naruto-storyline/session6.html)。\n\n页面已通过脚本、交互和刷新恢复测试，无控制台错误。","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"},{"id":"01a0343a-3cc3-7a52-b810-4c7af7f0d768","prompt":"在辉夜的统治下人们是如何生活的","response":"需要区分漫画主线与动画补完：漫画几乎没有描写辉夜统治下普通人的完整日常，因此不能像讨论木叶一样具体说明其法律、经济或家庭制度。\n\n漫画明确给出的核心是：\n\n- 辉夜获得查克拉果实的力量后，以压倒性武力结束了当时的战争，一度被人们视作带来和平的“卯之女神”。\n- 这种和平后来转向恐怖统治。她发动无限月读，将人们束缚在神树上；受术者沉浸于梦境，逐渐失去人格并转化为白绝，成为她预备的军队。\n- 因此，漫画里的辉夜并不是在经营一个长期、正常运转的国家，而是在把人类逐步转化为可支配的资源。官方对相关单行本的介绍，也把无限月读描述为令整个世界陷入黑暗的事件。[《NARUTO》卷 71 官方页面](https://naruto-official.com/en/comics/01_153)\n\n动画第 460—462 集扩写了更多生活细节：\n\n- 最初的人类仍生活在彼此交战的小国、村落和农业社会中，由天子等地方统治者管理。\n- 辉夜以力量制止战争后，人们表面上可以继续耕作、成家和生活，也没有每天直接受到她的干预。\n- 但神树附近成为禁地。辉夜定期挑选人参加所谓“神树仪式”，被选中的人有去无回；官方剧集简介也明确提到，只有辉夜选中的人能够接近神树所在区域。[Crunchyroll 第 461 集简介](https://www.crunchyroll.com/watch/G6Q4MKZ2R/hagoromo-and-hamura)\n- 动画还补充说，她曾释放部分无限月读受害者并抹除其记忆，以免人类完全灭绝；另一些人则继续被神树束缚，成为白绝。[第 462 集梗概](https://naruto.fandom.com/wiki/A_Fabricated_Past)\n\n所以更准确的概括是：\n\n> 辉夜统治下的人们，表面仍过着普通的村落生活，但他们没有知情权、拒绝权或政治参与权；任何人都可能被统治者挑中，秘密转化为战争资源。\n\n这是一种“有日常生活，却没有主体地位”的和平。战争的确被辉夜压住了，但人们之所以安全，不是因为建立了处理冲突的制度，而是因为没有人拥有反抗她、询问她或阻止她的能力。这也正是第七讲将辉夜路线称为“绝对占有”，而不只是“强力维持秩序”的原因。","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"},{"id":"01a0343c-6028-75e2-b1b9-b8746daf1261","prompt":"好的，把这些内容补充到辉夜相关的讨论，不然我会认为辉夜的解法和斑是一样的，都是无限月读","response":"已补充到 [session7.html](/Users/zhenghe/.courses/naruto-storyline/session7.html) 的人物总览与“方案显微镜”中。\n\n现在会明确说明：\n\n- 辉夜：无限月读是控制、征用并将人类改造成白绝军队的手段，核心是绝对占有。\n- 斑与带土：无限月读中的梦境本身就是和平终点，核心是永久退出共同现实。\n- 同时区分了漫画明确设定与动画补完的辉夜时代日常。\n\n原有交互与学习进度保存均未受影响。","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"},{"id":"01a03445-a5df-7c90-9953-beae398feebd","prompt":"把第七讲的标题改成，忍界和平的哲学讨论","response":"已将第七讲标题统一改为“忍界和平的哲学讨论”，包括：\n\n- [第七讲页面](/Users/zhenghe/.courses/naruto-storyline/session7.html)\n- [课程大纲](/Users/zhenghe/.courses/naruto-storyline/syllabus.html)\n- [第六讲的下一课入口](/Users/zhenghe/.courses/naruto-storyline/session6.html)","reasoning":[],"createdAt":"2026-08-23T08:43:51.000Z"}]},{"id":"01a02db8-a8c9-7942-8f21-8c0667f4cc93","title":"为什么宇智波鼬要强迫佐助恨他","createdAt":"2026-08-23T08:24:31.000Z","updatedAt":"2026-08-23T08:24:31.000Z","turns":[{"id":"01a02db9-01af-7622-979e-43ecd096ff7b","prompt":"为什么宇智波鼬要强迫佐助恨他","response":"鼬强迫佐助恨他，是因为他想用“仇恨”替佐助安排一条活路。\n\n他的计划大致是：\n\n- **让佐助活下去**：灭族之夜，鼬无法对弟弟下手；他又必须让木叶相信自己已彻底叛变，所以把佐助塑造成唯一幸存的“复仇者”。\n- **逼佐助变强**：鼬认为，持续的仇恨能让佐助拥有活下去和修炼的目标，最终强大到足以自保。\n- **让佐助杀死自己**：鼬既想为灭族赎罪，也希望自己死在佐助手中。这样，佐助就会成为“杀死叛忍、替宇智波复仇的英雄”，而宇智波的污名也能被掩盖。\n- **把真相永远带走**：只要佐助相信鼬是单纯的恶人，就不会追查木叶高层逼迫鼬灭族的内幕，也不会因此向村子复仇。\n\n但这并不是作品认可的“正确做法”。鼬爱佐助，却不信任佐助有承受真相和自主选择的能力。他用月读折磨佐助、反复强化仇恨，实际上把佐助当成了自己计划中的角色。结果佐助虽然杀死了鼬，却在得知真相后把仇恨转向木叶，几乎走向鼬最害怕的结局。\n\n所以更准确地说：**鼬不是为了让佐助痛苦才让他恨自己，而是误以为自己可以独自承担真相，并用仇恨控制佐助的人生。**这正是鼬的悲剧——他的爱是真的，但爱的方式继承了忍者世界“隐瞒、牺牲、替别人决定”的旧逻辑。后来鼬自己也承认，如果从一开始坦诚面对佐助，结局或许会不同。","reasoning":[],"createdAt":"2026-08-23T08:24:31.000Z"},{"id":"01a02dbb-5f7f-7020-b798-4d9570f349b0","prompt":"别天神如何能消弭政变？","response":"止水的设想，是用别天神悄悄改变政变核心人物的意志，使其主动放弃政变。\n\n别天神不是普通幻术。它能把施术者的意志植入目标心中，让目标把被植入的想法误认为自己的决定，而且通常不会察觉自己中了幻术。止水因此可能做到：\n\n1. 对宇智波一族的决策者施术——通常被理解为族长宇智波富岳。\n2. 植入“停止政变、通过谈判解决矛盾”的意志。\n3. 由富岳以族长身份撤销行动，并说服族内其他成员服从。\n4. 避免政变触发木叶镇压，暂时阻止内战与灭族。\n\n不过，“消弭政变”不等于“解决宇智波问题”。别天神最多能按下政变的暂停键，却不能自动消除宇智波遭受的监视、隔离和政治排斥。即便富岳改变主意，激进族人也可能怀疑他、绕过他行动；而木叶高层对宇智波的不信任仍然存在。\n\n因此，止水的方案本质上是一次带有善意的精神操控：**先控制关键人物，阻止迫在眉睫的流血，再争取政治协商的时间。**团藏夺走止水的右眼，一方面是觊觎别天神，另一方面也说明他根本不相信宇智波会因一名族长改变态度而真正放弃政变。\n\n严格说，原作只明确止水准备以别天神阻止政变；“具体对富岳施术”的细节在不同媒介的呈现中有所差异。所以课程里的“和平消弭”更准确地理解为：**不经战斗地解除眼前的政变危机，而非彻底化解木叶与宇智波的结构性矛盾。**","reasoning":[],"createdAt":"2026-08-23T08:24:31.000Z"}]},{"id":"01a01007-5f30-7b43-bcec-6a3bd92e4e73","title":"生成下一讲。04","createdAt":"2026-08-17T14:01:53.000Z","updatedAt":"2026-08-17T14:01:53.000Z","turns":[{"id":"01a01007-afba-7230-89fb-914e57ea8681","prompt":"生成下一讲。04","response":"第 4 讲已生成：[session4.html](/Users/zhenghe/.courses/naruto-storyline/session4.html)。\n\n主题为“两名遗孤”，包含：\n\n- 鸣人与佐助的共同因果线\n- 鼬的选择与代价分析\n- 4 组可持久保存的互动练习\n- 自由跳题、返回修改和概念提示\n\n同时已将 [session3.html](/Users/zhenghe/.courses/naruto-storyline/session3.html) 的下一讲入口校正并链接到第 4 讲。页面已通过实际渲染、点击与刷新恢复测试。","reasoning":[],"createdAt":"2026-08-17T14:01:53.000Z"}]},{"id":"01a00ff2-a016-7753-a35e-1e8343caee03","title":"这句话什么意思","createdAt":"2026-08-17T13:39:14.000Z","updatedAt":"2026-08-17T13:52:21.000Z","turns":[{"id":"01a00ff2-d8fb-7102-8a4a-9477d66297a7","prompt":"这句话什么意思","response":"这句话的意思是：\n\n斑和带土并不打算在真实世界里，和所有人一起解决战争、死亡、失去等痛苦；他们选择直接放弃真实世界，让每个人沉浸在各自的理想梦境中。梦境会自动满足人的愿望，所以痛苦看起来“不再发生”。\n\n比如，带土不是在现实中接受琳的死亡、继续生活，而是进入一个“琳从未死去”的梦。在那里虽然没有失去，却也不再有一个大家共同生活、彼此真实影响的世界。\n\n更直白地说就是：**他们不是治好了现实，而是让所有人逃离现实。**","reasoning":[],"createdAt":"2026-08-17T13:39:14.000Z"},{"id":"01a00ff4-feec-7622-8ba8-0ae4e2f16a12","prompt":"长门的轮回眼从哪来的，跟轮回天生之术又是什么关系？","response":"关键点是：**长门的轮回眼本来就是斑的。**\n\n因果链是这样的：\n\n**斑移植柱间细胞 → 晚年开启轮回眼 → 偷偷把双眼移植给年幼的长门 → 准备让长门将来用轮回天生之术复活自己。**\n\n### 长门为什么能使用斑的轮回眼？\n\n长门属于漩涡一族，生命力和查克拉都非常强，身体能够承受双轮回眼的巨大负担。长门本人一直以为轮回眼是自己在父母被杀时觉醒的；实际上，那次只是情绪刺激下首次发动了早已被移植的眼睛。\n\n### 轮回天生之术是什么？\n\n“外道·轮回天生之术”是轮回眼使用者才能发动的复活术，可以把死者真正带回现实，恢复成活人的身体；它不同于秽土转生制造的“不死尸体”。代价极其巨大，长门发动后耗尽生命而死。官方剧情介绍也将它描述为长门以生命为代价、召回死者灵魂的禁术。[《木叶的英雄》剧情介绍](https://naruto-official.com/anime/naruto2/list/01_619)\n\n### 它跟斑的计划有什么关系？\n\n斑年老体衰，无法亲自活到月之眼计划完成，所以他的原计划是：\n\n1. 把轮回眼寄存在长门身上；\n2. 让长门和晓收集尾兽；\n3. 等条件成熟，让长门发动轮回天生复活斑；\n4. 斑以真正的活人身体成为十尾人柱力，发动无限月读。\n\n但计划出了意外：长门被鸣人说服后，没有复活斑，而是用轮回天生救回了袭击木叶时被自己杀死的人，自己也因此死亡。[官方剧情回顾](https://naruto-official.com/en/news/01_1321)\n\n后来兜先用秽土转生召回斑；再后来，黑绝控制带土发动轮回天生，才让斑真正恢复活人之身。[斑的官方角色回顾](https://naruto-official.com/en/news/01_1663?nolangsuggestion=1)\n\n所以选中那张卡片想表达的是：**长门既保管着斑实现计划所需的轮回眼，也是斑预先安排好的“复活执行者”；只不过长门最后背离了这项安排。**","reasoning":[],"createdAt":"2026-08-17T13:39:14.000Z"},{"id":"01a00ff7-9021-7b31-8489-d1de0f5584f9","prompt":"长门被鸣人说服后，斑是怎么死的，身体衰老死的？","response":"对，**斑第一次死亡基本可以理解为年老衰亡**，而且这发生在长门被鸣人说服的很多年前。两件事并不是前后相接的。\n\n实际时间线是：\n\n1. 斑与柱间大战后假死，晚年开启轮回眼。\n2. 他把轮回眼秘密移植给年幼的长门。\n3. 年老的斑依靠外道魔像输送查克拉维持生命。\n4. 他救下带土，设计琳之死，使带土陷入绝望，并把月之眼计划交给带土。\n5. 安排完后，斑主动断开与外道魔像的连接，身体随即衰竭死亡。\n6. 很多年后，长门才袭击木叶、被鸣人说服，并用轮回天生复活木叶死者。\n\n所以长门改变立场时，斑早已死去。斑原本想让长门将来复活自己，却没料到长门把轮回天生用在了木叶众人身上。\n\n后来斑经历了两种“复活”：\n\n- **秽土转生**：兜先把斑作为不死的秽土身体召回。\n- **轮回天生**：黑绝控制带土发动此术，使秽土斑恢复成真正的活人。\n\n一句话概括：**斑先因年老、脱离生命维持而死；长门后来浪费了斑为自己准备的复活机会；最终带土被迫替长门完成了复活斑的任务。**","reasoning":[],"createdAt":"2026-08-17T13:39:14.000Z"},{"id":"01a00ff9-272e-7f01-b6aa-9dabd3f522de","prompt":"黑绝和白绝是什么关系","response":"黑绝和白绝**不是兄弟，也不是同一种生物的黑白两种形态**。他们只是经常合体行动，所以看起来像一个“阴阳脸”的绝。\n\n- **黑绝**：辉夜在被封印前制造的“意志化身”。它活了上千年，一直暗中修改历史、欺骗斑，真正目标是复活辉夜。斑以为黑绝是自己创造的意志，其实斑才是被利用的人。\n- **白绝**：远古时期被无限月读困住的人类，经过神树长期改造后形成的生物。后来出现了大量白绝，主要负责侦察、潜伏、传递情报和充当军队。\n\n二者的关系可以这样理解：\n\n> **黑绝是幕后策划者，白绝是身体载体和执行工具。**\n\n晓组织中那个“绝”，通常是黑绝附着在一个白绝身上形成的组合体：黑色半边负责谋划和观察，白色半边更活泼，负责侦察、移动和战场工作；两半也可以分开行动。\n\n还有一个容易混淆的地方：“白绝”既可以指与黑绝合体的那个具体个体，也可以泛指第四次忍界大战中的整支白绝军队。","reasoning":[],"createdAt":"2026-08-17T13:39:14.000Z"},{"id":"01a00ffd-469e-7560-834d-16f43bf0cfdb","prompt":"为什么远古时代有无限月读发生？另外，黑绝把宇智波的石碑从什么改成了什么","response":"### 一、远古时代为什么发生过无限月读？\n\n因为**无限月读原本就是辉夜使用过的术，并不是斑创造的**。\n\n远古时代还没有忍者和忍术，辉夜来到地球，吃下神树的查克拉果实并获得强大力量。动画补充的故事里，当时各国长期战争，辉夜最初希望结束争斗，但后来逐渐变成以绝对力量控制人类。[官方第 680 集介绍](https://naruto-official.com/anime/naruto2/list/01_904)\n\n她发动无限月读后：\n\n1. 人类陷入梦境；\n2. 身体被神树包裹；\n3. 神树不断抽取他们的查克拉；\n4. 一部分人经过长期改造，变成白绝。\n\n这些白绝是辉夜制造的生体兵器。[《BORUTO》第 52 集官方介绍](https://naruto-official.com/anime/boruto/list/01_996)\n\n至于“她准备让白绝跟谁打”，版本之间交代程度不同：\n\n- 《火影忍者》漫画主要明确：辉夜曾发动无限月读，把受害者改造成自己的军队。\n- 动画和《BORUTO》的后续设定进一步暗示：辉夜背叛了大筒木一族，担心其他大筒木成员降临，所以提前准备白绝军队。\n\n因此，斑所谓的“永远幸福的梦”，其实是一个包装过的谎言：**无限月读的最终结果不是让人永远幸福，而是抽走他们的力量并将其改造成白绝。**\n\n### 二、黑绝把石碑从什么改成了什么？\n\n最准确的回答是：**作品没有展示石碑修改前后的完整原文，因此无法逐字对照。**\n\n已知的是：\n\n- **羽衣的原意**：记录自己的经历，警告因陀罗的后代不要为了力量夺取阿修罗一系的力量、重现轮回眼所带来的灾难。也就是说，它本来是一封“不要走这条路”的警告。[石碑资料及漫画第 671 话出处](https://naruto.fandom.com/wiki/Stone_Tablet)\n- **黑绝修改后**：把无限月读描述成“拯救宇智波、实现世界和平的方法”，并留下足以引导宇智波与千手力量结合、开启轮回眼、复活十尾的内容。[黑绝资料及漫画第 681 话出处](https://naruto.fandom.com/wiki/Black_Zetsu)\n\n可以把修改概括成：\n\n> 羽衣原意：**结合这两种力量会带来危险，不要重蹈覆辙。**  \n> 黑绝改写：**结合这两种力量可以获得救世之力，最终用无限月读拯救世界。**\n\n于是斑读到的虽然含有一些真实历史和正确操作步骤，却得出了完全相反的结论。黑绝最厉害的地方不是编造一个全假故事，而是**保留真的“方法”，篡改它的“意义和目的”**：\n\n**轮回眼 → 十尾 → 无限月读**这条技术路线是真的；  \n**无限月读能拯救世界**是黑绝塞进去的谎言。","reasoning":[],"createdAt":"2026-08-17T13:39:14.000Z"}]},{"id":"01a00acc-0cbf-7ff2-aa69-6c474ba044bf","title":"怎么理解这句话？","createdAt":"2026-08-16T13:38:59.000Z","updatedAt":"2026-08-16T14:22:29.000Z","turns":[{"id":"01a00acd-23c3-7e82-ae88-77b53bf5b384","prompt":"怎么理解这句话？","response":"这句话是在说：**黑绝不是凭空制造冲突，而是利用了人物和忍界中已经存在的裂缝。**\n\n比如：\n\n- **失落**：因陀罗失去继承人的位置；斑失去弟弟与族人的信任；佐助失去家族。\n- **猜疑**：宇智波与千手互不信任，木叶高层也长期怀疑、排斥宇智波。\n- **权力不平等**：谁能决定村子的制度、谁被监视、谁拥有解释历史的权力，本来就不平等。\n\n黑绝的作用更像是**在已有的火药旁点火**：他欺骗、挑拨并推动悲剧，但火药不是他创造的。\n\n因此，把所有问题都说成“黑绝搞的鬼”会过度简化故事。即使没有黑绝，那些创伤与制度矛盾依然需要被解决。鸣人的选择之所以重要，也正因为他不只是打败了幕后黑手，而是尝试用理解、信任和不切断关系的方式，回答这些真实存在的问题。","reasoning":[],"createdAt":"2026-08-16T13:38:59.000Z"},{"id":"01a00ad0-ff9f-7b22-8aac-5bfac46b563e","prompt":"Please write the next section: 本节准备好后编写","response":"第二讲已写好：[session2.html](/Users/zhenghe/.courses/naruto-storyline/session2.html)\n\n内容聚焦柱间与斑的共同成功与制度失败，包含：\n\n- 木叶建立至终结之谷的因果时间线\n- 创村制度决策实验\n- 友谊与政治压力模拟\n- 可跳过、返回并自动保存进度的理解测验\n\n页面交互与刷新恢复均已验证正常。","reasoning":[],"createdAt":"2026-08-16T13:38:59.000Z"},{"id":"01a00aea-4d5e-7ee1-85ab-066f647b6446","prompt":"这个实验没看太明白。感觉动画也有点儿问题","response":"你的感觉是对的，这个实验目前表达得不够完整。\n\n它原本想表达：\n\n- 桥面＝柱间与斑的私人信任\n- 中间桥墩＝公开规则、权力保障等制度\n- 滑块＝伤亡、火影选举、安全恐惧等政治压力\n- 压力越大，和平越不能只靠“我们曾经是朋友”\n\n但现在有两个问题：\n\n1. **逻辑不完整**：只能调整压力，不能调整“制度支撑强度”，所以你无法亲手比较“有制度”和“没制度”的区别。\n2. **动画不准确**：桥面只是绕左端旋转，既没有真实地压在桥墩上，也没有表现弯曲、脱落或被制度托住，看起来更像桥画歪了。\n\n更清楚的版本应该提供两个滑块：“政治压力”和“制度保障”，并直接显示三种结果：\n\n- 压力低：私人信任暂时足够\n- 压力高、制度弱：关系破裂，和平坍塌\n- 压力高、制度强：即使双方互不信任，规则仍能维持合作\n\n如果你愿意，我可以把这一块替换成这种双滑块实验，并重做桥梁动画。","reasoning":[],"createdAt":"2026-08-16T13:38:59.000Z"},{"id":"01a00aee-c129-73c3-9afb-a80989947e80","prompt":"进入第三讲","response":"第三讲已创建：[session3.html](/Users/zhenghe/.courses/naruto-storyline/session3.html)\n\n本讲包括斑的长期布局、琳之死的三层因果、带土与长门的角色分工，以及月之眼计划的隐藏代价。新增的因果排序、论证拆解和“无痛世界”账单均已通过交互与进度保存验证。","reasoning":[],"createdAt":"2026-08-16T13:38:59.000Z"}]},{"id":"01a008e3-03da-7e92-bc78-885e84d9750a","title":"火影忍者（不含博人传）的主要故事线和精神内核","createdAt":"2026-08-16T04:44:50.000Z","updatedAt":"2026-08-16T13:10:17.000Z","turns":[{"id":"01a008e3-1654-75c2-a998-0618209c29a2","prompt":"火影忍者（不含博人传）的主要故事线和精神内核","response":"为了把课程做得贴合你，请告诉我：\n\n1. **目标**：想梳理剧情脉络、理解人物成长与精神内核，还是两者兼顾？\n2. **深度**：偏向快速全景概览，还是深入分析鸣人、佐助、鼬、自来也等人物及重要冲突？\n3. **基础**：你看完过《火影忍者》漫画或动画吗？介意关键剧情剧透吗？\n4. **时间**：希望课程大约多长？例如 30 分钟、2 小时，或分成 5～8 次学习。\n\n你也可以直接回复类似：  \n“看完动画，可以剧透；剧情和思想各一半；做成 6 节，每节 20 分钟。”","reasoning":[],"createdAt":"2026-08-16T04:44:50.000Z"},{"id":"01a008e8-ddf2-79f3-a73f-90752329fb15","prompt":"1. 从上帝视角，按时间顺序重新梳理核心故事线（忽略支线），从大筒木辉夜一直到鸣佐最终艰难取胜的忍界大战\n2. 只关注最核心的人物冲突，观点冲突，比如鸣人与佐助，宇智波斑与柱间\n3. 我完整看过，不介意剧透，我就是看完以后觉得没有很好地理解才来做这门课\n4. 按必要性。3 小时以内","response":"已创建课程大纲：[syllabus.html](/Users/zhenghe/.courses/naruto-storyline/syllabus.html)。\n\n课程共 6 讲、约 165 分钟，以真实时间顺序串联辉夜、六道时代、柱间与斑、带土、鸣人与佐助，重点比较不同的和平方案与人物冲突。本轮仅建立大纲，尚未生成正式课程章节。","reasoning":[],"createdAt":"2026-08-16T04:44:50.000Z"},{"id":"01a008ec-7b89-72c2-aaa0-a4fb0745cd41","prompt":"我批准这份课程大纲。请保留它，并将第一课创建为 session1.html。","response":"已完成：\n\n- 保留原大纲，仅将 [syllabus.html](/Users/zhenghe/.courses/naruto-storyline/syllabus.html) 标记为“学习中”。\n- 创建第一课：[session1.html](/Users/zhenghe/.courses/naruto-storyline/session1.html)。\n- 加入因果排序、观点刻度、四题自由导航测验及本地进度保存。\n- 已验证桌面端、手机宽度、交互反馈与刷新恢复，运行正常。","reasoning":[],"createdAt":"2026-08-16T04:44:50.000Z"},{"id":"01a009a9-16b9-7532-9024-1bebe47d3dc5","prompt":"辉夜的力量是从哪里来的","response":"一句话：**辉夜压倒性的查克拉主要来自神树结出的“查克拉果实”。**\n\n按《火影忍者》本篇的解释：\n\n1. 神树先于忍者时代存在，并结出原本禁止触碰的果实。\n2. 辉夜从天而降，为了结束战乱吃下果实，获得庞大的查克拉，成为世上第一个拥有查克拉的人。[《火影忍者》官方回顾](https://naruto-official.com/en/news/01_1355)\n3. 她的儿子羽衣、羽村出生后继承了部分查克拉。辉夜因此认为自己的力量被分走，试图将其收回。\n4. 她后来与神树结合，化为十尾；所以忍界大战时复活的辉夜，不只是“吃过一颗果实的人”，还包含神树、十尾以及被重新聚合的查克拉。\n\n这里要区分两层问题：\n\n- **《火影忍者》回答了：**辉夜在人间的巨大力量来自查克拉果实。\n- **《火影忍者》没有彻底回答：**神树为何存在、辉夜吃果实前拥有多少力量、大筒木一族究竟在做什么。\n\n《博人传》才进一步解释神树会吸收整颗星球的生命与遗传信息，将其凝结成查克拉果实；但这是后续扩展设定，不必用它理解本课程的主线。[官方《博人传》设定说明](https://naruto-official.com/en/news/01_1769)\n\n因此，课程中“力量是所有物”的准确含义是：**辉夜虽然通过果实获得力量，却逐渐认为由她获得、由她传给后代的全部查克拉仍然只属于她，其他生命只是暂时占有它。**这也解释了她为什么执着于“统一所有查克拉”。","reasoning":[],"createdAt":"2026-08-16T04:44:50.000Z"},{"id":"01a00aad-79aa-73c2-899e-b26c33dcd516","prompt":"这里的 pop up 显示不全","response":"已修复 [session1.html](/Users/zhenghe/.courses/naruto-storyline/session1.html) 的术语弹层：\n\n- 桌面端不再被卡片边界裁切。\n- 手机端改为底部完整弹出，避免越出屏幕。\n- 已通过普通宽度和窄屏回归测试。","reasoning":[],"createdAt":"2026-08-16T04:44:50.000Z"}]}],"labels":{"eyebrow":"一门在学习过程中共同设计的课程","contents":"课程内容","previous":"上一页","next":"下一页","standalone":"独立课程导出","companionTitle":"共同设计对话与问答","companionToggle":"共同设计对话","companionClose":"关闭","companionEmpty":"此课程暂无共同设计对话记录。","reasoningTitle":"设计思路与考量","learnerPrompt":"学习者","agentResponse":"AI 导师","sessionFallback":"会话","courseEdition":"课程版本"},"allLabels":{"en":{"eyebrow":"A course co-designed through learning","contents":"Course contents","previous":"Previous","next":"Next","standalone":"Standalone course export","companionTitle":"Co-Design Notes & Q&A","companionToggle":"Co-Design Notes","companionClose":"Close","companionEmpty":"No co-design conversations recorded for this course.","reasoningTitle":"Design Rationale","learnerPrompt":"Learner","agentResponse":"AI Mentor","sessionFallback":"Session","courseEdition":"Course edition"},"zh-CN":{"eyebrow":"一门在学习过程中共同设计的课程","contents":"课程内容","previous":"上一页","next":"下一页","standalone":"独立课程导出","companionTitle":"共同设计对话与问答","companionToggle":"共同设计对话","companionClose":"关闭","companionEmpty":"此课程暂无共同设计对话记录。","reasoningTitle":"设计思路与考量","learnerPrompt":"学习者","agentResponse":"AI 导师","sessionFallback":"会话","courseEdition":"课程版本"}},"availableLanguages":["zh-CN"],"initialLanguage":"zh-CN"};
  const layout = document.getElementById("cs-export-layout");
  const nav = document.getElementById("cs-export-nav");
  const frame = document.getElementById("cs-course-frame");
  const pageList = document.getElementById("cs-page-list");
  const previous = document.getElementById("cs-previous");
  const next = document.getElementById("cs-next");
  const companionToggle = document.getElementById("cs-companion-toggle");
  const companionDrawer = document.getElementById("cs-companion-drawer");
  const companionClose = document.getElementById("cs-companion-close");
  const companionBackdrop = document.getElementById("cs-companion-backdrop");
  const companionContent = document.getElementById("cs-companion-content");

  let drawerOpen = false;
  let observer;

  function getSlots(lang) {
    const slotMap = new Map();
    data.pages.forEach((p) => {
      const base = p.basePath || p.path.replace(/.[a-zA-Z]{2}(?:-[a-zA-Z]{2,4})?.html$/i, ".html");
      if (!slotMap.has(base)) slotMap.set(base, []);
      slotMap.get(base).push(p);
    });

    const slots = [];
    for (const [basePath, variants] of slotMap.entries()) {
      const matchLang = variants.find((v) => v.lang === lang || (lang === "zh-CN" ? v.path.includes(".zh-CN.") : !v.path.includes(".zh-CN.")));
      const activeVariant = matchLang || variants[0];
      const kind = activeVariant.kind || (basePath === "syllabus.html" || basePath === "index.html" ? "syllabus" : "lesson");
      slots.push({
        basePath,
        kind,
        activeVariant,
        hasMatch: Boolean(matchLang),
        variants,
      });
    }

    return slots.sort((left, right) => {
      const leftSyllabus = left.kind === "syllabus" || left.basePath === "syllabus.html" || left.basePath === "index.html";
      const rightSyllabus = right.kind === "syllabus" || right.basePath === "syllabus.html" || right.basePath === "index.html";
      if (leftSyllabus && !rightSyllabus) return -1;
      if (!leftSyllabus && rightSyllabus) return 1;
      return left.basePath.localeCompare(right.basePath, undefined, { numeric: true });
    });
  }

  function parseInitialState() {
    const params = new URLSearchParams(window.location.search);
    const queryLang = params.get("lang");
    const rawHash = decodeURIComponent(location.hash.slice(1));
    const hashPath = rawHash.split("#")[0];
    const hashSection = rawHash.includes("#") ? rawHash.slice(rawHash.indexOf("#") + 1) : undefined;

    let initialLang = queryLang === "zh-CN" || queryLang === "en" ? queryLang : undefined;
    let matchIndex = hashPath ? data.pages.findIndex((p) => p.path === hashPath) : -1;

    if (matchIndex >= 0) {
      const matchedPage = data.pages[matchIndex];
      if (!initialLang) {
        initialLang = matchedPage.lang || (matchedPage.path.includes(".zh-CN.") ? "zh-CN" : "en");
      }
    } else {
      if (!initialLang) initialLang = data.initialLanguage || "en";
      const defaultSlot = getSlots(initialLang)[0];
      if (defaultSlot) {
        matchIndex = data.pages.findIndex((p) => p.path === defaultSlot.activeVariant.path);
      }
      if (matchIndex < 0) matchIndex = 0;
    }

    return {
      index: matchIndex >= 0 ? matchIndex : 0,
      lang: initialLang || "en",
      section: hashSection,
    };
  }

  const initial = parseInitialState();
  let activeIndex = initial.index;
  let currentLang = initial.lang;

  function updateLayout() {
    const w = window.innerWidth;
    const pad = 2 * Math.min(56, Math.max(20, w * 0.04));
    const gap = Math.min(40, Math.max(20, w * 0.024));
    const avail = Math.min(1700, w) - pad;
    const R = 880, NAV = 272, RAIL = 60;
    const panel = Math.max(280, Math.min(400, Math.round(avail * 0.26)));
    const FLOOR = 460;

    let navMode = "full"; // 'full' | 'rail' | 'none'
    if (avail < 520 + 280 + gap) {
      navMode = "full";
    } else {
      if (avail - NAV - panel - 2 * gap < FLOOR) navMode = "rail";
      if (avail - RAIL - panel - 2 * gap < FLOOR) navMode = "none";
    }

    if (nav) {
      if (navMode === "none") {
        nav.style.display = "none";
      } else if (navMode === "rail") {
        nav.style.display = "flex";
        nav.classList.add("is-rail");
      } else {
        nav.style.display = "flex";
        nav.classList.remove("is-rail");
      }
    }

    if (layout) {
      if (w <= 1024) {
        layout.style.gridTemplateColumns = "";
      } else {
        const navWidth = navMode === "full" ? NAV : (navMode === "rail" ? RAIL : 0);
        const chrome = navWidth ? navWidth + 2 * gap : gap;
        const readerWidth = Math.max(460, Math.min(R, Math.round(avail - chrome - panel)));
        const navCol = navWidth ? (navWidth + "px ") : "";
        layout.style.gridTemplateColumns = drawerOpen
          ? (navCol + "minmax(0, " + readerWidth + "px) " + panel + "px")
          : (navCol + "minmax(0, " + readerWidth + "px)");
      }
    }
  }

  function updateChromeLabels(lang) {
    const labels = data.allLabels?.[lang] || data.labels;
    document.documentElement.lang = lang;
    if (previous) previous.textContent = "← " + labels.previous;
    if (next) next.textContent = labels.next + " →";
    const toggleLabel = document.getElementById("cs-companion-toggle-label");
    if (toggleLabel) toggleLabel.textContent = labels.companionToggle;
    const drawerHeading = companionDrawer?.querySelector(".cs-companion-header strong");
    if (drawerHeading) drawerHeading.textContent = labels.companionTitle;
    const navHeading = nav?.querySelector(".cs-export-nav-heading");
    if (navHeading) navHeading.textContent = labels.contents;

    document.querySelectorAll(".cs-lang-pill").forEach((pill) => {
      pill.classList.toggle("active", pill.getAttribute("data-lang") === lang);
    });
  }

  function renderNavigation() {
    const slots = getSlots(currentLang);
    let lessonCount = 0;
    pageList.replaceChildren(...slots.map((slot) => {
      const page = slot.activeVariant;
      const pageIndex = data.pages.findIndex((p) => p.path === page.path);
      const isSyllabus = slot.kind === "syllabus";
      if (!isSyllabus) lessonCount += 1;
      const numLabel = isSyllabus ? "—" : String(lessonCount).padStart(2, "0");
      const isSelected = slot.variants.some((v) => v.path === data.pages[activeIndex]?.path);

      const button = document.createElement("button");
      button.type = "button";
      button.className = "cs-nav-item" + (isSelected ? " active" : "");
      button.title = page.title;

      const numBadge = document.createElement("span");
      numBadge.className = "cs-nav-num";
      numBadge.textContent = numLabel;

      const labelSpan = document.createElement("span");
      labelSpan.className = "cs-nav-label";
      labelSpan.textContent = page.title;

      button.appendChild(numBadge);
      button.appendChild(labelSpan);

      if (!slot.hasMatch && data.availableLanguages && data.availableLanguages.length > 1) {
        const badge = document.createElement("span");
        badge.className = "cs-nav-badge";
        badge.textContent = page.lang === "zh-CN" || page.path.includes(".zh-CN.") ? "中文" : "EN";
        button.appendChild(badge);
      }

      button.addEventListener("click", () => showPage(pageIndex >= 0 ? pageIndex : 0));
      return button;
    }));
  }

  function getCurrentSlotIndex(slots) {
    const currentPage = data.pages[activeIndex];
    if (!currentPage) return 0;
    const currentBase = currentPage.basePath || currentPage.path.replace(/\.[a-zA-Z]{2}(?:-[a-zA-Z]{2,4})?\.html$/i, ".html");
    const idx = slots.findIndex((slot) => slot.basePath === currentBase || slot.variants.some((v) => v.path === currentPage.path));
    return idx >= 0 ? idx : 0;
  }

  function updatePagerState() {
    const slots = getSlots(currentLang);
    const slotIdx = getCurrentSlotIndex(slots);
    if (previous) previous.disabled = slotIdx <= 0;
    if (next) next.disabled = slotIdx >= slots.length - 1;
  }

  function goToAdjacentSlot(delta) {
    const slots = getSlots(currentLang);
    const slotIdx = getCurrentSlotIndex(slots);
    const targetSlot = slots[slotIdx + delta];
    if (!targetSlot) return;
    const targetIndex = data.pages.findIndex((p) => p.path === targetSlot.activeVariant.path);
    if (targetIndex >= 0) {
      showPage(targetIndex);
    }
  }

  function switchLanguage(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    const currentPath = data.pages[activeIndex]?.path;
    const currentBase = data.pages[activeIndex]?.basePath || currentPath?.replace(/\.[a-zA-Z]{2}(?:-[a-zA-Z]{2,4})?\.html$/i, ".html");

    const targetPage = data.pages.find((p) => (p.basePath === currentBase || p.path === currentBase) && (p.lang === lang || (lang === "zh-CN" ? p.path.includes(".zh-CN.") : !p.path.includes(".zh-CN."))));
    if (targetPage) {
      const targetIndex = data.pages.findIndex((p) => p.path === targetPage.path);
      if (targetIndex >= 0) activeIndex = targetIndex;
    } else {
      const slots = getSlots(lang);
      const currentSlot = slots.find((s) => s.basePath === currentBase);
      if (currentSlot) {
        const targetIndex = data.pages.findIndex((p) => p.path === currentSlot.activeVariant.path);
        if (targetIndex >= 0) activeIndex = targetIndex;
      }
    }

    updateChromeLabels(lang);
    renderNavigation();
    showPage(activeIndex);
  }

  document.querySelectorAll(".cs-lang-pill").forEach((pill) => {
    pill.addEventListener("click", () => {
      const lang = pill.getAttribute("data-lang");
      if (lang) switchLanguage(lang);
    });
  });

  function renderCompanion() {
    if (!data.conversations || !data.conversations.length) {
      companionContent.innerHTML = '<p class="cs-companion-empty">' + escapeHtml(data.labels.companionEmpty) + '</p>';
      return;
    }
    companionContent.innerHTML = "";
    data.conversations.forEach((conv) => {
      const sessionDiv = document.createElement("div");
      sessionDiv.className = "cs-companion-session";
      const title = document.createElement("h3");
      title.className = "cs-companion-session-title";
      title.textContent = conv.title || data.labels.sessionFallback;
      sessionDiv.appendChild(title);

      (conv.turns || []).forEach((turn) => {
        const turnDiv = document.createElement("div");
        turnDiv.className = "cs-companion-turn";

        if (turn.prompt) {
          const userBlock = document.createElement("div");
          userBlock.className = "cs-turn-block cs-turn-user";
          userBlock.innerHTML = '<span class="cs-turn-author">' + escapeHtml(data.labels.learnerPrompt) + '</span><div class="cs-turn-text">' + escapeHtml(turn.prompt) + '</div>';
          turnDiv.appendChild(userBlock);
        }

        if (turn.reasoning && turn.reasoning.length) {
          const details = document.createElement("details");
          details.className = "cs-turn-reasoning";
          const summary = document.createElement("summary");
          summary.textContent = "💡 " + data.labels.reasoningTitle + " (" + turn.reasoning.length + ")";
          details.appendChild(summary);
          const list = document.createElement("ul");
          turn.reasoning.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
          });
          details.appendChild(list);
          turnDiv.appendChild(details);
        }

        if (turn.response) {
          const agentBlock = document.createElement("div");
          agentBlock.className = "cs-turn-block cs-turn-agent";
          agentBlock.innerHTML = '<span class="cs-turn-author">' + escapeHtml(data.labels.agentResponse) + '</span><div class="cs-turn-text">' + escapeHtml(turn.response) + '</div>';
          turnDiv.appendChild(agentBlock);
        }

        sessionDiv.appendChild(turnDiv);
      });
      companionContent.appendChild(sessionDiv);
    });
  }

  function setCompanionOpen(open) {
    drawerOpen = open;
    if (open) {
      companionDrawer.removeAttribute("hidden");
      companionToggle.classList.add("active");
      companionToggle.setAttribute("aria-expanded", "true");
      if (window.innerWidth <= 1024) {
        companionBackdrop.removeAttribute("hidden");
      }
    } else {
      companionDrawer.setAttribute("hidden", "");
      companionToggle.classList.remove("active");
      companionToggle.setAttribute("aria-expanded", "false");
      companionBackdrop.setAttribute("hidden", "");
    }
    updateLayout();
  }

  companionToggle?.addEventListener("click", () => {
    setCompanionOpen(!drawerOpen);
  });
  companionClose?.addEventListener("click", () => setCompanionOpen(false));
  companionBackdrop?.addEventListener("click", () => setCompanionOpen(false));

  function wireCourseLinks(doc) {
    doc.addEventListener("click", (event) => {
      const link = event.target.closest?.("a[href]");
      if (!link) return;
      const raw = link.getAttribute("href") || "";
      if (raw.startsWith("#")) {
        const target = doc.getElementById(raw.slice(1));
        if (target) {
          event.preventDefault();
          target.scrollIntoView({ behavior: "smooth" });
        }
        return;
      }
      const path = raw.split("#")[0].replace(/^\.\//, "");
      let index = data.pages.findIndex((page) => page.path === path);
      if (index >= 0 && currentLang !== "en") {
        const slots = getSlots(currentLang);
        const base = data.pages[index].basePath || data.pages[index].path.replace(/\.[a-zA-Z]{2}(?:-[a-zA-Z]{2,4})?\.html$/i, ".html");
        const slot = slots.find((s) => s.basePath === base);
        if (slot) {
          const localizedIndex = data.pages.findIndex((p) => p.path === slot.activeVariant.path);
          if (localizedIndex >= 0) index = localizedIndex;
        }
      }
      if (index < 0) return;
      event.preventDefault();
      showPage(index, raw.includes("#") ? raw.slice(raw.indexOf("#") + 1) : undefined);
    });
  }

  function getContentHeight(doc) {
    if (!doc || !doc.body) return 560;
    const body = doc.body;
    const docEl = doc.documentElement;

    let maxBottom = 0;
    const children = body.children;
    for (let i = 0; i < children.length; i++) {
      const child = children[i];
      if (
        child.tagName === "SCRIPT" ||
        child.tagName === "STYLE" ||
        child.tagName === "LINK" ||
        child.tagName === "META" ||
        child.tagName === "NOSCRIPT" ||
        child.hasAttribute("hidden")
      ) {
        continue;
      }
      const style = doc.defaultView?.getComputedStyle(child);
      if (!style || style.display === "none" || style.position === "fixed") continue;

      const marginBottom = parseFloat(style.marginBottom || "0") || 0;
      const bottom = child.offsetTop + child.offsetHeight + marginBottom;
      if (bottom > maxBottom) {
        maxBottom = bottom;
      }
    }

    const bodyStyle = doc.defaultView?.getComputedStyle(body);
    const bodyPaddingBottom = parseFloat(bodyStyle?.paddingBottom || "0") || 0;
    const bodyMarginBottom = parseFloat(bodyStyle?.marginBottom || "0") || 0;
    const computedBottom = maxBottom > 0 ? maxBottom + bodyPaddingBottom + bodyMarginBottom : 0;

    const naturalHeight = computedBottom > 0
      ? computedBottom
      : Math.max(body.scrollHeight || 0, docEl.scrollHeight || 0);

    return Math.max(560, Math.ceil(naturalHeight));
  }

  function resizeFrame() {
    const doc = frame.contentDocument;
    if (!doc) return;
    try {
      const h = getContentHeight(doc);
      if (String(h) + "px" !== frame.style.height) {
        frame.style.height = h + "px";
      }
    } catch (err) {
      console.warn("frame resize error:", err);
    }
  }

  function showPage(index, sectionId) {
    activeIndex = Math.max(0, Math.min(data.pages.length - 1, index));
    const page = data.pages[activeIndex];
    if (!page) return;

    updatePagerState();
    const targetHash = encodeURIComponent(page.path) + (sectionId ? "#" + sectionId : "");
    if (decodeURIComponent(location.hash.slice(1)) !== decodeURIComponent(targetHash)) {
      location.hash = targetHash;
    }
    renderNavigation();

    observer?.disconnect();
    frame.style.height = "0px";
    frame.onload = () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      wireCourseLinks(doc);
      resizeFrame();
      if (sectionId) {
        const target = doc.getElementById(sectionId);
        if (target) {
          window.scrollTo({
            top: frame.getBoundingClientRect().top + window.scrollY + target.offsetTop,
            behavior: "instant"
          });
        }
      }
      observer = new ResizeObserver(resizeFrame);
      if (doc.body) observer.observe(doc.body);
      if (doc.documentElement) observer.observe(doc.documentElement);
    };
    frame.srcdoc = page.html;
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function escapeHtml(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  window.addEventListener("resize", () => {
    updateLayout();
    resizeFrame();
  });
  renderCompanion();
  previous.addEventListener("click", () => goToAdjacentSlot(-1));
  next.addEventListener("click", () => goToAdjacentSlot(1));
  window.addEventListener("hashchange", () => {
    const rawHash = decodeURIComponent(location.hash.slice(1));
    const pagePath = rawHash.split("#")[0];
    const index = data.pages.findIndex((page) => page.path === pagePath);
    if (index >= 0 && index !== activeIndex) {
      const targetPage = data.pages[index];
      const pageLang = targetPage.lang || (targetPage.path.includes(".zh-CN.") ? "zh-CN" : "en");
      if (pageLang !== currentLang && data.availableLanguages?.includes(pageLang)) {
        currentLang = pageLang;
        updateChromeLabels(currentLang);
      }
      const section = rawHash.includes("#") ? rawHash.slice(rawHash.indexOf("#") + 1) : undefined;
      showPage(index, section);
    }
  });

  updateChromeLabels(currentLang);
  updateLayout();
  showPage(activeIndex, initial.section);
})();
</script>
</body>
