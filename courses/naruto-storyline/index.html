feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = quizState.answers[questionIndex];\n          if (selected === undefined) feedback.textContent = quizState.skipped.indexOf(questionIndex) !== -1 ? \"这题已暂时跳过。你可以随时回来。\" : \"选择后会立即看到解释；也可以先查看选项后的概念提示。\";\n          else { var correct = Number(selected) === question.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = question.feedback[Number(selected)]; }\n          panel.append(count, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"quiz-prev\").disabled = quizState.current === 0;\n        document.getElementById(\"quiz-next\").textContent = quizState.current === questions.length - 1 ? \"回到第一题 ↺\" : \"下一题 →\";\n      }\n      document.getElementById(\"quiz-prev\").addEventListener(\"click\", function () { goToQuestion(quizState.current - 1); });\n      document.getElementById(\"quiz-next\").addEventListener(\"click\", function () { goToQuestion(quizState.current === questions.length - 1 ? 0 : quizState.current + 1); });\n      document.getElementById(\"quiz-skip\").addEventListener(\"click\", skipQuestion);\n      renderQuiz();\n    }());\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session6.html","basePath":"session6.html","lang":"zh-CN","kind":"lesson","title":"鸣佐的最终裁决","translations":{"zh-CN":"session6.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"鸣佐的最终裁决\">\n  \u003ctitle>最后的敌人不是辉夜：鸣人与佐助的最终裁决｜《火影忍者》主线重构\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f6f1e7;\n      --paper-deep: #ebe1cf;\n      --ink: #292721;\n      --muted: #6c665b;\n      --accent: #9a4938;\n      --accent-dark: #713528;\n      --accent-soft: #ead3c8;\n      --sage: #66745c;\n      --sage-soft: #dfe4d8;\n      --gold: #a9782e;\n      --gold-soft: #eee1c1;\n      --blue: #5e7180;\n      --blue-soft: #dfe6e8;\n      --night: #454758;\n      --night-soft: #e1e0e7;\n      --line: #d8ccba;\n      --card: rgba(255, 253, 248, 0.8);\n      --white: #fffdf8;\n      --shadow: 0 16px 44px rgba(71, 52, 33, 0.08);\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; background: var(--paper); }\n    body {\n      margin: 0;\n      color: var(--ink);\n      background: radial-gradient(circle at 15% 0%, rgba(255,255,255,.76), transparent 32rem), var(--paper);\n      font-family: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", Georgia, serif;\n      font-size: 18px;\n      line-height: 1.72;\n    }\n\n    button, input { font: inherit; }\n    button { color: inherit; }\n    a { color: var(--accent-dark); text-underline-offset: .18em; }\n    .content { width: min(100% - 3rem, 88ch); max-width: 88ch; margin: 0 auto; padding: 2rem 0 6rem; }\n    html[data-studio-width=\"wide\"] .content { max-width: 104ch; }\n    html[data-studio-width=\"full\"] .content { max-width: 100%; }\n    html[data-studio-width=\"full\"] .prose,\n    html[data-studio-width=\"full\"] .lesson-header,\n    html[data-studio-width=\"full\"] .lesson-footer { width: min(100% - 3rem, 78ch); margin-inline: auto; }\n\n    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 1.5rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .82rem; }\n    .topbar-links { display: flex; flex-wrap: wrap; gap: 1rem; }\n    .topbar a { color: var(--muted); text-decoration: none; }\n    .topbar a:hover { color: var(--accent); }\n    .lesson-count { color: var(--muted); letter-spacing: .06em; }\n    .lesson-header { padding: 3.4rem 0 3rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }\n    .eyebrow { margin: 0 0 .8rem; color: var(--accent); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; font-weight: 750; letter-spacing: .14em; }\n    h1, h2, h3 { line-height: 1.26; text-wrap: balance; }\n    h1 { max-width: 14em; margin: 0; font-size: clamp(2.35rem, 6vw, 4.6rem); font-weight: 650; letter-spacing: -.035em; }\n    h2 { margin: 4.5rem 0 1.2rem; font-size: clamp(1.7rem, 3vw, 2.3rem); }\n    h3 { margin: 1.8rem 0 .6rem; font-size: 1.2rem; }\n    p { margin: .9rem 0; }\n    ul { padding-left: 1.25rem; }\n    li + li { margin-top: .5rem; }\n    section { scroll-margin-top: 1.5rem; }\n    .lede { max-width: 49rem; margin: 1.4rem 0 0; color: var(--muted); font-size: 1.12rem; }\n    .lesson-meta { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8rem; }\n    .lesson-meta span { padding: .28rem .66rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,253,248,.52); }\n    .opening-question { margin: 2.2rem 0 0; padding: 1.25rem 1.45rem; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 1.08rem; }\n    .learning-goals { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1px; margin: 2.2rem 0 0; overflow: hidden; border: 1px solid var(--line); border-radius: .8rem; background: var(--line); }\n    .goal { padding: 1rem 1.1rem; background: var(--card); }\n    .goal strong { display: block; color: var(--accent); font-size: 1.25rem; }\n    .goal span { color: var(--muted); font-size: .88rem; }\n\n    .term { position: relative; display: inline-block; border-bottom: 1px dotted var(--accent); color: var(--accent-dark); cursor: help; outline: none; }\n    .term:focus-visible { border-radius: .2rem; box-shadow: 0 0 0 3px var(--accent-soft); }\n    .tooltip { position: absolute; z-index: 30; left: 50%; bottom: calc(100% + .65rem); width: min(21rem, 75vw); padding: .75rem .85rem; border: 1px solid var(--line); border-radius: .6rem; color: var(--ink); background: var(--white); box-shadow: var(--shadow); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; font-weight: 400; line-height: 1.5; opacity: 0; pointer-events: none; transform: translate(-50%, .3rem); transition: opacity 160ms ease, transform 160ms ease; }\n    .term:hover .tooltip, .term:focus .tooltip { opacity: 1; transform: translate(-50%, 0); }\n    .key-point, .canon-note { margin: 1.7rem 0; padding: 1.1rem 1.25rem; border-radius: .7rem; background: var(--sage-soft); }\n    .key-point strong, .canon-note strong { color: #46503f; }\n    .warning-note { margin: 1.7rem 0; padding: 1.1rem 1.25rem; border-left: 4px solid var(--gold); background: var(--gold-soft); }\n\n    .model-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1rem; margin: 1.8rem 0; }\n    .model-card { padding: 1.2rem; border: 1px solid var(--line); border-radius: .8rem; background: var(--card); }\n    .model-card:nth-child(1) { border-top: 4px solid var(--night); }\n    .model-card:nth-child(2) { border-top: 4px solid var(--blue); }\n    .model-card:nth-child(3) { border-top: 4px solid var(--gold); }\n    .model-card h3 { margin-top: 0; }\n    .model-card p { color: var(--muted); font-size: .9rem; }\n    .model-tag { display: inline-block; margin-top: .35rem; padding: .16rem .5rem; border-radius: 999px; color: var(--muted); background: var(--paper-deep); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .75rem; }\n\n    .story-line { position: relative; margin: 2rem 0; padding-left: 2.2rem; }\n    .story-line::before { content: \"\"; position: absolute; top: .5rem; bottom: .5rem; left: .55rem; width: 2px; background: var(--line); }\n    .story-event { position: relative; padding: 0 0 1.55rem; }\n    .story-event:last-child { padding-bottom: 0; }\n    .story-event::before { content: \"\"; position: absolute; top: .48rem; left: -2rem; width: .72rem; height: .72rem; border: 3px solid var(--paper); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }\n    .story-event h3 { margin: 0; font-size: 1.05rem; }\n    .story-event p { margin: .35rem 0 0; color: var(--muted); }\n\n    .lab { margin: 2.5rem 0; padding: clamp(1.1rem, 3vw, 1.8rem); border: 1px solid var(--line); border-radius: 1rem; background: var(--card); box-shadow: var(--shadow); }\n    .lab-head { display: flex; align-items: start; justify-content: space-between; gap: 1rem; margin-bottom: 1.3rem; }\n    .lab-head h2, .lab-head h3 { margin: 0; }\n    .lab-head p { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }\n    .lab-label { flex: 0 0 auto; padding: .22rem .55rem; border-radius: 999px; color: var(--accent-dark); background: var(--accent-soft); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .72rem; font-weight: 700; }\n    .button { padding: .55rem .9rem; border: 1px solid var(--line); border-radius: .55rem; color: inherit; background: var(--white); cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; font-weight: 650; }\n    .button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }\n    .button.primary { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .button.primary:hover:not(:disabled) { color: var(--white); background: var(--accent-dark); }\n    .button:disabled { opacity: .35; cursor: default; }\n    .lab-nav, .lab-nav-group { display: flex; flex-wrap: wrap; gap: .55rem; }\n    .lab-nav { justify-content: space-between; margin-top: 1rem; }\n\n    .revolution-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .75rem; }\n    .revolution-step { padding: .9rem 1rem; border: 1px solid var(--line); border-radius: .7rem; text-align: left; background: var(--white); curs  0; overflow: hidden; border: 1px solid var(--line); border-radius: .85rem; background: var(--line); }\n    .arc-step { padding: 1rem; background: var(--card); }\n    .arc-step strong { display: block; color: var(--accent); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .76rem; letter-spacing: .08em; }\n    .arc-step span { display: block; margin-top: .3rem; font-size: .9rem; }\n\n    .lesson-footer { margin-top: 4.5rem; padding-top: 2rem; border-top: 1px solid var(--line); }\n    .takeaway { padding: 1.4rem 1.5rem; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 1.05rem; }\n    .completion { margin-top: 2rem; padding: 1.2rem 1.3rem; border: 1px solid var(--line); border-radius: .75rem; color: var(--muted); background: var(--card); }\n    .completion strong { display: block; color: var(--ink); font-size: 1.1rem; }\n\n    @media (max-width: 760px) {\n      body { font-size: 16px; }\n      .content { width: min(100% - 2rem, 88ch); padding-top: 1.2rem; }\n      .learning-goals, .model-grid, .revolution-grid, .audit-grid, .course-arc { grid-template-columns: 1fr; }\n      .tooltip { position: fixed; inset: auto 1rem 1rem; width: auto; transform: translateY(.3rem); }\n      .term:hover .tooltip, .term:focus .tooltip { transform: translateY(0); }\n      .lab-head { display: block; }\n      .lab-label { display: inline-block; margin-top: .6rem; }\n      .lab-nav { flex-direction: column; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      html { scroll-behavior: auto; }\n      .tooltip, .progress-fill { transition: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cnav class=\"topbar\" aria-label=\"课程导航\">\n      \u003cdiv class=\"topbar-links\">\u003ca href=\"session5.html\">← 上一讲\u003c/a>\u003ca href=\"syllabus.html\">课程大纲\u003c/a>\u003c/div>\n      \u003cspan class=\"lesson-count\">第 6 讲 / 共 7 讲\u003c/span>\n    \u003c/nav>\n\n    \u003cheader class=\"lesson-header\">\n      \u003cp class=\"eyebrow\">第六讲 · 终局裁决\u003c/p>\n      \u003ch1>最后的敌人不是辉夜\u003c/h1>\n      \u003cp class=\"lede\">辉夜被封印、无限月读解除在即，宏大的救世叙事却在胜利前夕迎来了最剧烈的思想急转。佐助以轮回眼强行囚禁九只尾兽，断然宣布处决现任五影并发动“理性革命”：他誓要亲手斩断旧时代的全部权力依附，将自身铸造为全人类永恒戒惧的唯一恐怖阴影。鸣人所面对的终极对手，由此绝非来自天外神权的降维吞噬，而是一个同样洞悉体制沉疴、甘愿赴汤蹈火以身殉道，却对人间互信与制度自我纠错彻底绝望的至交挚友。\u003c/p>\n      \u003cdiv class=\"lesson-meta\" aria-label=\"本课信息\">\u003cspan>约 25 分钟\u003c/span>\u003cspan>终局与政治哲学\u003c/span>\u003cspan>主线终章\u003c/span>\u003c/div>\n      \u003cblockquote class=\"opening-question\">带着一个问题出发：若一位毫无私利野心、甘愿独自担荷全世界滔天仇恨的绝世强者，确实能借由充当“永恒公敌”使列国在恐惧中维持永久和平——我们是否有理由全盘接受他的独裁统治？\u003c/blockquote>\n      \u003cdiv class=\"learning-goals\" aria-label=\"学习目标\">\n        \u003cdiv class=\"goal\">\u003cstrong>01\u003c/strong>\u003cspan>透析佐助“革命”绝非一时盲目黑化，而是一套逻辑自洽且冷酷决绝的孤独极权秩序\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>02\u003c/strong>\u003cspan>辩明鸣人在断然拒绝佐助时，究竟确立了何种基于自由意志与共同分担的全新政治前提\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>03\u003c/strong>\u003cspan>洞悉终结之谷二番战何以从根本上终结因陀罗与阿修罗绵延千年的转生仇杀宿命\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"last-enemy\">\n        \u003ch2 id=\"last-enemy\">开篇立论：佐助绝非旧时代的战争余孽，而是大战内在逻辑最冷酷的必然推论\u003c/h2>\n        \u003cp>第五讲的忍者联军雄辩地证实：在面临亡族灭种的极端危机时，五大忍村确实能够让渡部分独立主权，实现前所未有的战力与情报共享。然而，佐助那双洞若观火的眼睛所看到的，恰恰是这份战时联合最为脆弱的致命软肋——联军的空前团结，高度寄生于带土、斑与辉夜这等具有碾压性毁灭力的“外在公敌”。一旦这柄悬在全人类头顶的达摩克利斯之剑轰然碎裂，失去共同危机的列国诸村，必将迅速退化回争夺尾兽核武、瓜分地缘利益与抢夺历史解释权的恶性循环。\u003c/p>\n        \u003cp>佐助开出的药方，绝非倒退回斑的“无限月读”。他蔑视虚妄的人造极乐，无意让众生沉沦于精神温室；他甚至清醒承认并保留了现实人间的百态分歧。然而，他要将世间所有的仇恨、警惕与冲突，以不可逆的冷酷强力永久聚焦于同一个终极标靶——他自己。通过斩杀当世五影、彻底清除尾兽、消灭唯一能与自身分庭抗礼的鸣人，他将以暴力彻底粉碎旧时代的利益藩篱，再以绝对神权隐匿于暗处，充当全忍界世代戒惧与共同憎恨的\u003cspan class=\"term\" tabindex=\"0\">唯一黑暗\u003cspan class=\"tooltip\" role=\"tooltip\">佐助‘革命’的核心政治图腾：不谋求公开加冕、不希冀世人爱戴，而是以永恒的威慑阴影自暗处裁决天下，迫使各国在永恒的共同恐惧中维持被动联合。\u003c/span>\u003c/span>。\u003c/p>\n        \u003cdiv class=\"model-grid\">\n          \u003carticle class=\"model-card\">\u003ch3>斑：彻底抹杀公共现实\u003c/h3>\u003cp>让众生沉沦于互不相通的定制幻梦，以剥夺自由意志的方式消灭一切分歧冲突。\u003c/p>\u003cspan class=\"model-tag\">和平＝无人保有说“不”的权利\u003c/span>\u003c/article>\n          \u003carticle class=\"model-card\">\u003ch3>佐助：暴力垄断现实冲突\u003c/h3>\u003cp>保留清醒的人间世界，却将全人类的仇恨与警惕集中于自身，以永恒威慑冻结分裂。\u003c/p>\u003cspan class=\"model-tag\">和平＝全人类在共同反对我中维系联合\u003c/span>\u003c/article>\n          \u003carticle class=\"model-card\">\u003ch3>鸣人：共同担荷现实风险\u003c/h3>\u003cp>不狂妄许诺消灭所有摩擦，而是让权力、创伤与动态修复的责任在众生之间持续流动。\u003c/p>\u003cspan class=\"model-tag\">和平＝在破裂与脆弱中依然保有重建的可能\u003c/span>\u003c/article>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>终局较量的真正分野：\u003c/strong>三人皆清醒认定旧忍村体制绝无可能原样维系。真正的思想分水岭绝非“要不要变革世界”，而在于变革之后，是否依然承认凡人大众保有知情参与、表达异见与自主修正和平航向的主体资格。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"itachi-inheritance\">\n        \u003ch2 id=\"itachi-inheritance\">佐助如何从鼬的悲壮牺牲中，推导出一位永恒独裁者的合法性\u003c/h2>\n        \u003cp>在洞悉灭族之夜的政治惨剧后，佐助曾长久叩问历代火影：“村落究竟为何物？火影又承载着怎样的真谛？”他最终将兄长宇智波鼬视作了最纯粹、最彻底的终极火影：鼬将个人的清白声誉、家族温情乃至肉体性命全数献祭给无底深渊，独自背负欺师灭祖的万古骂名，方才换取了木叶在蒙蔽中维系着脆弱的表面安宁。\u003c/p>\n        \u003cp>然而，佐助并未机械照搬鼬具体的效忠实体，而是继承并无限放大了鼬的\u003cspan class=\"term\" tabindex=\"0\">孤独牺牲模型\u003cspan class=\"tooltip\" role=\"tooltip\">由单一个体在暗处垄断全部绝密信息、历史污名与伦理罪责，以一己沉沦换取共同体表面的秩序平稳。其崇高之处在于毫无保留的舍己献身，其致命毒性则在于彻底剥夺了他人的知情权、参与权与纠错可能。\u003c/span>\u003c/span>。既然鼬能为守护一村而隐忍沉沦为黑暗，佐助便要为庇护全忍界而化身为永恒的至暗深渊；既然鼬是以一次性的血腥清洗遏制了一场内战，佐助便要以不可撼动的永恒威慑阻断未来所有的地缘战争。\u003c/p>\n        \u003cp>这亦从形而上层面彻底解构了佐助为何誓死必杀鸣人。鸣人不仅是在物理战力上唯一足以横刀阻断其革命的劲敌，更是佐助在现实人间仅存的最后一条真实羁绊。只要鸣人依然活着且矢志不渝地渴望理解他，佐助便永远无法蜕变为一个纯粹孤绝、只承载纯粹仇恨而不被任何人倾心牵挂的政治抽象符号。革命的终极献祭，要求他首先在精神与肉体上亲手处决自己“重返凡尘共同生活”的最后退路。\u003c/p>\n        \u003caside class=\"canon-note\">\u003cstrong>切勿将“理性革命”降格为平庸的权力野心：\u003c/strong>佐助从未觊觎世俗的皇冠、朝拜与赞颂。他的政治构想具备冷酷纯粹的自我牺牲精神；然而，不谋私利绝不能在伦理上自动证成极权专制的合法性——因为他依然是在以单边暴政，强行剥夺了五影、尾兽乃至全忍界众生共同协商未来的根本权利。\u003c/aside>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"revolution-map\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"revolution-map\">革命解剖图：佐助必须斩断哪四条纽带？\u003c/h2>\u003cp>逐项点亮革命的组成部分。观察它如何从一次战后清算，闭合为由单一强者永久维持的孤独极权系统。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">结构拆解\u003c/span>\u003c/div>\n      \u003cdiv class=\"revolution-progress\">\u003cspan>革命闭环\u003c/span>\u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv id=\"revolution-fill\" class=\"progress-fill\">\u003c/div>\u003c/div>\u003cstrong id=\"revolution-count\">0 / 4\u003c/strong>\u003c/div>\n      \u003cdiv id=\"revolution-steps\" class=\"revolution-grid\">\u003c/div>\n      \u003cdiv id=\"revolution-result\" class=\"revolution-result\" aria-live=\"polite\">\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"system-flaw\">\n        \u003ch2 id=\"system-flaw\">佐助方案最具蛊惑之处，恰恰是其最致命的深层死穴\u003c/h2>\n        \u003cp>佐助的方案远比斑的幻梦更尊重客观现实，亦比凡俗的暴君更具自我牺牲的悲壮感。他精准洞悉了战后忍界的体制死结：一旦共同敌人灰飞烟灭，脆弱同盟必将分崩离析；旧精英阶层必将借战胜光环复辟既得利益；尾兽终将再次沦为大国核博弈的牺牲品。因此，他企图化身为一个绝对公正、绝无私欲、超越特定疆界的超然独裁裁决者，自上而下永久冰封历史的劣根性。\u003c/p>\n        \u003cp>然而，这套严丝合缝的冷酷秩序，必须建立在四个完全未经验证且极易崩溃的致命假设之上：\u003c/p>\n        \u003cul>\n          \u003cli>佐助能够永恒精准地裁定何种社会冲突应当被暴力扑灭；\u003c/li>\n          \u003cli>拥有碾压性神力的独裁者，其认知绝不会随岁月流逝而与凡尘疾苦产生不可逆的脱节；\u003c/li>\n          \u003cli>各国因共同恐惧而形成的被动防守同盟，绝不会暗中异化为更为畸形残酷的地下军备竞赛；\u003c/li>\n          \u003cli>一套完全寄生于单一个体肉身与意志的体制，在遭遇裁决失误、意志衰颓或最终消亡时，拥有任何自我维系与承接的可能。\u003c/li>\n        \u003c/ul>\n        \u003cp>这套构想最深层的哲学悖论在于：佐助企图以自己一人的“永恒绝对孤独”，去彻底治愈忍界因千万人被迫陷入孤独而缔造的结构性创伤。他消灭了旧日具体的统治阶层，却未曾触动“由极少数强者单方面替全体人类定夺代价”的专制内核；他仅仅是将这套专制特权，极端化压缩进了自己一人的躯体之中。\u003c/p>\n        \u003cp class=\"warning-note\">\u003cstrong>崇高的自我牺牲绝非权力的免检通行证：\u003c/strong>一个掌权者即便毫无私欲野心，依然可能做出毁灭性的误判；即便其初衷在于庇护苍生，其实践依然在实质上剥夺了全体人类的主体意志。衡量一套政治秩序是否正当合法，绝不能仅仅审视独裁者的道德动机，更必须严格拷问被统治的广大众生是否依然保有知情、拒绝、问责与纠错的制度化通道。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"system-audit\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"system-audit\">制度压力审计：共同敌人模式能否穿越时间？\u003c/h2>\u003cp>点选四种极端未来情境，检验佐助的秩序在抽离了“最高统治者永远英明无私”这一盲目假设后，会暴露出何等严重的制度性崩塌风险。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">制度检验\u003c/span>\u003c/div>\n      \u003cdiv class=\"audit-grid\">\n        \u003cdiv id=\"audit-controls\" class=\"audit-controls\">\u003c/div>\n        \u003cdiv class=\"audit-verdict\" aria-live=\"polite\">\u003ch3 id=\"audit-title\">\u003c/h3>\u003cp id=\"audit-explanation\">\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"naruto-refusal\">\n        \u003ch2 id=\"naruto-refusal\">鸣人之辩：决不能以制造新的绝望断绝，去治愈那个本就被断绝所毒害的人世\u003c/h2>\n        \u003cp>鸣人在彼时彼刻并未随身携带一部尽善尽美的《忍界长治久安宪法》。他无法给出确凿保证五影日后永不发生外交冲突，亦无法打包票人世间所有的仇恨裂痕皆能圆满弥合。然而，他的反驳建立在更为坚实的政治哲学基石之上：任何称得上真正持久的人间和平，都必须誓死捍卫人与人之间彼此倾听、相互影响、共同分担苦难以及动态纠正错误的制度化能力；而佐助为了换取秩序的永恒静止，首先要用暴政屠刀将这种人类独有的修复机能彻底扼杀。\u003c/p>\n        \u003cp>鸣人斩钉截铁的宣言“正因为你是我的朋友”，绝非对佐助深刻政治洞察的无知无视，更非企图将对方强行拽回那个腐朽落后的旧木叶。他是在从存在论层面，断然拒绝佐助单方面宣告与全人类彻底斩断羁绊。真实的羁绊绝非一张可由单方面随心所欲撕毁的商业契约：佐助可以选择自我放逐与背负罪责，却无权勒令鸣人停止关切与痛楚，更无权将鸣人的流血牺牲，作为自己加冕为绝对孤独神明的垫脚石。\u003c/p>\n        \u003cp>两人最终在终结之谷诉诸殊死决战，表面上看似乎使“羁绊”的维系同样依赖于物理暴力，实则两者在使用暴力的目的上存在着不可逾越的鸿沟：佐助施展暴力的意图，在于通过肉体抹杀鸣人以永久封闭未来的一切政治可能性；而鸣人全力搏杀的目的，则在于以命相搏阻断这场不可逆的万古悲剧，同时至死坚守绝不取佐助性命的伦理底线。鸣人的力量旨在确保明天的对话与协商依然拥有展开的可能，而非替人类的明天预先写好不可更改的唯一标准答案。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>鸣人和平哲学的真正基石：\u003c/strong>他从未沉溺于“只要大家相互理解便万事大吉”的廉价口号，而是确立了一项更为庄严且克制的政治承诺——人世间没有任何人应当被迫独自担荷全部黑暗；当旧有关系支离破碎之时，共同体必须永远保留重新接触、分担创伤与自我纠错的生机。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"final-valley\">\n        \u003ch2 id=\"final-valley\">终结之谷二番战：当巅峰神力层层剥落，方见凡人救赎之真谛\u003c/h2>\n        \u003cdiv class=\"story-line\" aria-label=\"终结之谷最终决战阶段\">\n          \u003carticle class=\"story-event\">\u003ch3>一｜佐助率先宣判革命：斩断凡尘最后的羁绊纽带\u003c/h3>\u003cp>将九只尾兽封入地爆天星，以绝对神权将鸣人定义为通往永恒孤独道路上必须清除的最后障碍。此时的宿命决斗，已彻底升华为两套战后世界新秩序的终极较量。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>二｜因陀罗之矢与双重螺旋手里剑的巅峰交锋\u003c/h3>\u003cp>佐助将九大尾兽的浩瀚查克拉高度压缩吸入须佐能乎，化身为集伟力于一尊的灭世战神；鸣人则托付九喇嘛分身从广袤大地汇聚自然能量正面迎击。视觉上的终极对撞，将‘高度剥夺集权’与‘广泛借力协同’两种完全对立的力量组织范式具象化到了极致。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>三｜神明伟力全数耗尽，二人重归最脆弱的肉身相搏\u003c/h3>\u003cp>通天忍术、神圣瞳术与尾兽能量在碰撞中荡然无存，战局退化为泥泞血泊中踉跄喘息的拳肉互殴。当宏大神圣的救世光环被暴力一层层无情剥落，焦土之上留下的，仅仅是两个身心俱碎、却至死都无法真正舍弃彼此的创伤孤儿。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>四｜赌上意志的最后冲撞：断臂溅血，神话终结\u003c/h3>\u003cp>千鸟的锐鸣与螺旋丸的光芒在黄昏中轰然对撞，二人双臂齐断、齐齐仰卧于破碎的岩壁血泊之中。此役没有踩在败者尸骸上睥睨天下的胜利霸主，唯有在同等惨烈创伤中被迫并肩停滞的两个凡人。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>五｜佐助坦然承认败北，鸣人誓死拒绝将失败者清除出局\u003c/h3>\u003cp>佐助终于在血脉相连的剧痛中顿悟：鸣人的不离不弃绝非高高在上的道德同情——当佐助内心滴血时，鸣人同样痛彻心扉。这份任凭世间万物与酷烈杀意皆无法斩断的情感共振，终使佐助心悦诚服地放弃了以一己之身垄断世界的虚妄狂想。\u003c/p>\u003c/article>\n        \u003c/div>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"battle-lab\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"battle-lab\">终局研判：这场决斗究竟裁决了什么？\u003c/h2>\u003cp>逐幕研判决战过程中的力量组织、羁绊本质与政治哲学隐喻。可以自由切换、跳过或修改答案，系统将实时留存探索进度。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">3 个回合\u003c/span>\u003c/div>\n      \u003cdiv id=\"case-tabs\" class=\"step-tabs\" role=\"tablist\" aria-label=\"回合导航\">\u003c/div>\n      \u003cdiv id=\"case-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"case-prev\" class=\"button\" type=\"button\">← 上一回合\u003c/button>\u003cbutton id=\"case-next\" class=\"button primary\" type=\"button\">下一回合 →\u003c/button>\u003c/div>\u003cbutton id=\"case-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"cycle-break\">\n        \u003ch2 id=\"cycle-break\">轮回为何在此终止：不是阿修罗终于剿灭因陀罗，而是二人拒绝再生产下一轮世仇公敌\u003c/h2>\n        \u003cp>因陀罗与阿修罗绵延千年的转生宿命，绝非某种不可抗拒的机械魔法诅咒，而是一套在历史长河中被不断自我复制的悲剧关系结构：思想分歧被武断定性为不可饶恕的背叛，巅峰武力被用于证成自身的绝对正确，失败者带着深仇大恨与未竟创伤退出历史舞台，再由其后继门徒重新点燃战火。千手柱间与宇智波斑虽曾促膝交心、共建木叶，但初次终结之谷决战依然以一方“手刃”另一方悲剧收场，仇恨与猜忌自此转入地下疯狂滋长发酵。\u003c/p>\n        \u003cp>鸣人与佐助的终局彻底颠覆了这套千年历史锁链。鸣人赢得了阻断理性暴政的结果，却绝不将佐助作为必须清洗的败军之将予以物理消灭；佐助则不再将接纳羁绊视作对命运的屈辱投降，而是坦然承认自己绝无资格亦不该独自裁决全人类的未来。二人的伟大和解，绝非二人在此后的人世政治中意见完全雷同，而是双方终于共同砸碎了那个浸透鲜血的思维牢笼——“唯有将你从世间抹去，我的救世道路方能成立”。\u003c/p>\n        \u003cp>那双在血泊中同时碎裂的臂膀，因而具备了极具震撼力的政治隐喻：他们谁都无法再以“完好无损的绝对胜者”姿态独占忍界的未来，两人皆把无可挽回的永久残缺带入了战后时代。宿命轮回的破除，绝非过往千百年的血海深仇被轻浮地粉饰抹杀，而是各方断然承诺——历史的伤痕绝不可再被挪用为点燃下一轮复仇圣战的通行证。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>全剧终极被击碎的恶性死循环公式：\u003c/strong>\u003cbr>旧循环：“至亲失去 → 遁入孤绝 → 攫取绝对神力 → 暴力清除异见 → 制造新的失去与复仇”\u003cbr>新范式：“正视失去 → 共同分担创伤 → 誓死保留连接 → 携手承担未完的制度修复”\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"after-war\">\n        \u003ch2 id=\"after-war\">这是不是过于浪漫的理想主义？胜利仅仅是序章，而非制度的终极竣工\u003c/h2>\n        \u003cp>若将《火影忍者》的终局浅薄曲解为“鸣人靠三寸不烂之舌感化佐助，自此忍界刀枪入库、马放南山、天下大同”，这套叙事自然无法经受任何严谨政治哲学的审视。作品在终结之谷真正奠定的，是和平之所以可能的\u003cstrong>伦理前提\u003c/strong>，而非一劳永逸的\u003cstrong>制度施工图\u003c/strong>：五大忍村地缘政治中的实力均势依然需要精细维系，木叶高层对宇智波灭族的历史罪责依然需要清算与救赎，而九只尾兽亦需要在战后真正回归为拥有独立姓名、尊严与意志的自由生命主体。\u003c/p>\n        \u003cp>佐助在战后获得特赦并踏上孤独的赎罪之旅，绝不意味着其既往罪愆在一夜之间被一笔勾销。他协助解除无限月读、联手封印辉夜并主动悬崖勒马停止暴政革命，构成了其重新被文明共同体接纳的合法性依据；而其过往叛逃村落、突袭五影会谈乃至企图发动专制革命的行径，则构成了其必须终生在暗处守护世界、用行动持续清偿的历史重负。所谓赎罪的真谛，绝非狂妄地幻想抹去既成历史，而是通过当下的清醒作为，确保人类的未来不再被过去的仇恨所唯一奴役。\u003c/p>\n        \u003cp>鸣人所开创的宽容道路，同样没有任何一劳永逸的制度保险箱。它高度依附于执政领袖是否愿倾听民间呼声、治理体系能否实现常态化纠错、昔日世仇能否在承平日久后依然坚守合作底线；这套体系中的任何一个链条，在未来皆有可能遭遇局部倒退甚至反弹。然而，与斑的“技术极乐”或佐助的“永恒威慑”有着云泥之别的是：鸣人的道路从不狂妄标榜自身至善全能，它坦然承认人性的脆弱与体制可能遭遇的失败，因而永远为全天下保留了由凡人大众指出偏差、共同商讨并携手修复的辽阔空间。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"course-arc\">\n        \u003ch2 id=\"course-arc\">六讲回望：忍界把同一道终极难题，在历史中回答了六次\u003c/h2>\n        \u003cdiv class=\"course-arc\" aria-label=\"六讲核心脉络\">\n          \u003cdiv class=\"arc-step\">\u003cstrong>第一讲 · 创世神话\u003c/strong>\u003cspan>大筒木辉夜以绝对独占查克拉消灭威胁；六道仙人羽衣则以心灵相通分散力量、开创忍宗。\u003c/span>\u003c/div>\n          \u003cdiv class=\"arc-step\">\u003cstrong>第二讲 · 忍村创制\u003c/strong>\u003cspan>千手柱间与宇智波斑联手创立一国一村制终止战国，却在制度上遗留了信任赤字与权力失衡。\u003c/span>\u003c/div>\n          \u003cdiv class=\"arc-step\">\u003cstrong>第三讲 · 虚无转向\u003c/strong>\u003cspan>宇智波斑与带土将至亲失去推演为现实人间的死刑判决，决绝滑向剥夺自由意志的终极幻梦。\u003c/span>\u003c/div>\n          \u003cdiv class=\"arc-step\">\u003cstrong>第四讲 · 双重继承\u003c/strong>\u003cspan>鸣人与佐助继承了同一种体制创伤与宗族宿命，却在分水岭上分别走向了守护与斩断羁绊。\u003c/span>\u003c/div>\n          \u003cdiv class=\"arc-step\">\u003cstrong>第五讲 · 压力测试\u003c/strong>\u003cspan>忍者联军在生死考验中确立共同事实，用跨村协作证明世仇宿敌亦能在残缺现实中淬炼互信。\u003c/span>\u003c/div>\n          \u003cdiv class=\"arc-step\">\u003cstrong>第六讲 · 终局裁决\u003c/strong>\u003cspan>佐助企图以一人之身垄断全人类仇恨，鸣人则誓死守住让痛苦与修复责任由众生共同担荷的人间之网。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>全课程思想大决算：\u003c/strong>鸣人的最终胜利，绝非证明他比历史上所有的雄主智者更通晓如何神奇地消灭人间疾苦，而是他断然拒绝将“消灭痛苦”狂妄地凌驾于“保留真实鲜活的他者”之上。他从未虚伪许诺构筑一个永无创伤的无菌天堂，但他誓死捍卫了一个任何人都不必被全能独裁救世主所替代、亦不必被逼迫独自化身为救世主的清醒人间。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"lesson-check\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"lesson-check\">最终检验：轮回被打破，究竟意味着什么？\u003c/h2>\u003cp>完成最后四道思想检验题，为整门课程作一次严谨的终极认知结算。选择后即刻获得详尽阐释，进度会自动留存。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">4 个问题\u003c/span>\u003c/div>\n      \u003cdiv id=\"quiz-tabs\" class=\"quiz-tabs\" role=\"tablist\" aria-label=\"问题导航\">\u003c/div>\n      \u003cdiv id=\"quiz-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"quiz-prev\" class=\"button\" type=\"button\">← 上一题\u003c/button>\u003cbutton id=\"quiz-next\" class=\"button primary\" type=\"button\">下一题 →\u003c/button>\u003c/div>\u003cbutton id=\"quiz-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cfooter class=\"lesson-footer\">\n      \u003cdiv class=\"takeaway\">\u003cstrong>核心结语：\u003c/strong>忍界真正的终极之敌，从来不是某一个拥有毁天灭地神力的异界始祖或极端叛忍，而是人世间在遭遇失去与创伤之后极易诱发的心魔——只要我足够强大、足够孤绝、以绝对伟力消灭所有不确定性，便再也不会遭受伤害。鸣人与佐助之所以能够彻底打破千年宿命轮回，是因为一个誓死拒绝斩断关系与放弃他人，另一个终于允许自己卸下面具、不再独自担荷整个世界的重负。\u003c/div>\n      \u003cdiv class=\"completion\">\u003cstrong>\u003ca href=\"session7.html\">进阶终章：忍界和平的哲学讨论 →\u003c/a>\u003c/strong>主线叙事已经完整闭环。下一讲将把辉夜、羽衣、柱间、斑与带土、佐助、鸣人的构想归并为六条和平道路，再请亚里士多德、霍布斯、康德、龙树、阿伦特与荀子逐一裁决。\u003c/div>\n    \u003c/footer>\n  \u003c/main>\n\n  \u003cscript>\n    (function () {\n      \"use strict\";\n      var storagePrefix = \"course:session6:\";\n\n      function readState(key, fallback) {\n        try {\n          var saved = localStorage.getItem(storagePrefix + key);\n          return saved ? JSON.parse(saved) : fallback;\n        } catch (error) { return fallback; }\n      }\n\n      function writeState(key, value) {\n        try { localStorage.setItem(storagePrefix + key, JSON.stringify(value)); }\n        catch (error) { /* 禁用本地存储时，课程仍可使用。 */ }\n      }\n\n      function clampIndex(index, length) { return Math.max(0, Math.min(length - 1, index)); }\n\n      var revolutionSteps = [\n        { id: \"kage\", title: \"处决现任五影\", short: \"连根斩断旧忍村的建制特权与历史包袱\", detail: \"佐助断定，若让各村旧官僚集团继续执掌权柄，他们势必在战后迅速将联合体拆解为相互倾轧的地缘旧秩序。因此，革命的第一步是彻底清洗旧制度的既得利益代言人，而非寄望于其内部的自我改良。\" },\n        { id: \"beasts\", title: \"囚禁并彻底清除九只尾兽\", short: \"永久销毁诱发列国军备竞赛的终极战略核资材\", detail: \"尾兽曾被各大忍村作为筹码肆意瓜分、封印与兵器化。佐助绝不相信诸国掌权者能够克制占有终极杀器的贪欲，因而选择以绝对神权一劳永逸地替尾兽与全世界裁决存废。\" },\n        { id: \"naruto\", title: \"彻底斩杀漩涡鸣人\", short: \"排除唯一战力制衡，彻底焚毁现实人间的最后羁绊\", detail: \"鸣人既是在物理上唯一有能力掀翻其极权秩序的防线，亦是使佐助无法成为纯粹仇恨图腾的情感锚点。杀死鸣人，意味着在消除最大政治异见的同时，彻底斩断自己重返温情日常的可能。\" },\n        { id: \"shadow\", title: \"化身为全人类永恒的唯一黑暗\", short: \"迫使全忍界在不可逾越的共同恐惧中维持永恒联合\", detail: \"佐助不希冀任何歌功颂德，而是以不可触碰的审判者姿态自暗处俯瞰众生。这套体制并非一次政权更替，而是将全人类的和平前途，彻底抵押在一位‘永不犯错、永不衰老、永不妥协’的独裁神明身上。\" }\n      ];\n      var revolutionState = readState(\"revolution-map:v1\", []);\n      if (!Array.isArray(revolutionState)) revolutionState = [];\n\n      function renderRevolution() {\n        var container = document.getElementById(\"revolution-steps\");\n        container.innerHTML = \"\";\n        revolutionSteps.forEach(function (item) {\n          var button = document.createElement(\"button\"); button.type = \"button\"; button.className = \"revolution-step\";\n          button.setAttribute(\"aria-pressed\", revolutionState.indexOf(item.id) !== -1 ? \"true\" : \"false\");\n          var title = document.createElement(\"strong\"); title.textContent = item.title;\n          var short = document.createElement(\"span\"); short.textContent = item.short;\n          button.append(title, short);\n          button.addEventListener(\"click\", function () {\n            var index = revolutionState.indexOf(item.id);\n            if (index === -1) revolutionState.push(item.id); else revolutionState.splice(index, 1);\n            writeState(\"revolution-map:v1\", revolutionState);\n            renderRevolution();\n            document.getElementById(\"revolution-result\").textContent = item.detail;\n          });\n          container.appendChild(button);\n        });\n        var count = revolutionState.length;\n        document.getElementById(\"revolution-fill\").style.width = String(count / revolutionSteps.length * 100) + \"%\";\n        document.getElementById(\"revolution-count\").textContent = count + \" / \" + revolutionSteps.length;\n        var result = document.getElementById(\"revolution-result\");\n        if (count === 0) result.textContent = \"尚未点亮任何革命环节。请从佐助如何处置战后的旧权力中枢开始审视。\";\n        else if (count === revolutionSteps.length) result.textContent = \"革命闭环已然铸成：旧日领袖、战略核武、现实制衡力量与私人情感羁绊全数被冷酷抹杀。全天下的和平与存续，自此完全依附于佐助一人的意志、判断与永恒统治。\";\n        else {\n          var selectedItems = revolutionSteps.filter(function (item) { return revolutionState.indexOf(item.id) !== -1; });\n          result.textContent = \"已激活 \" + count + \" 项革命环节。最近审视的极权举措：\" + selectedItems[selectedItems.length - 1].detail;\n        }\n      }\n      renderRevolution();\n\n      var audits = [\n        { id: \"mistake\", title: \"佐助做出了一次灾难性错误裁决\", short: \"当天下再无制衡者时，究竟由谁来纠偏绝对权威？\", resultTitle: \"失去纠错机制的正义，终将异化为绝对暴政\", result: \"当唯一的物理制衡者鸣人已死、列国合法领袖五影全数被诛，任何来自民间的合理抗议与正当质疑，皆必然被唯一的裁决者定性为‘意图颠覆和平的新一轮叛乱’。极权体系从源头上就无法区分‘最高领袖发生了判断偏差’与‘下层世界尚未彻底顺从’。\" },\n        { id: \"arms\", title: \"列国因极度恐惧而秘密联手扩军\", short: \"共同仇恨未必催生善意，反而极易诱发极端军备竞赛\", resultTitle: \"消极恐惧下的被迫联合，绝非休戚与共的真实互信\", result: \"各国因为畏惧佐助的暗处威慑而维持表面停火，并不意味着彼此之间建立了真诚的协作机制；‘共同敌人’模式极易将列国的全部剩余资源长期绑架在应对外部审判的隐秘军备战备之中，进而彻底扼杀经济建设、民生福祉与跨国公共治理的正常发育。\" },\n        { id: \"successor\", title: \"佐助肉身逐渐衰老、意志动摇或遭遇意外消亡\", short: \"完全抵押于单一神明躯体的秩序，如何实现制度化交接？\", resultTitle: \"不可传承的超人政治，终将引爆毁灭性的权力真空\", result: \"若整套世界秩序仅仅维系于单一个体的战力震慑与道德清醒，他的退场必将引发被强力压制的所有历史旧怨与权力野心呈现报复性喷发；而若指定继承人，则必然重新诱发‘究竟谁有资格代行天罚’的血腥神权内战。\" },\n        { id: \"dissent\", title: \"某个弱小村落为了生存权益提出正当异议\", short: \"对绝对权威的任何不顺从，是否皆被冷酷判定为背叛？\", resultTitle: \"一切多元诉求，皆被绝对的安全维稳逻辑无情吞噬\", result: \"佐助必须在‘允许合理抗辩并承担局部失控风险’与‘坚决铁腕镇压以维系威慑的绝对公信力’之间作出抉择。专制威慑的内在逻辑必然倒向后者，从而使战时的临时革命措施，永久异化为压制人类一切活力的永恒高压锁链。\" }\n      ];\n      var auditState = readState(\"system-audit:v1\", \"mistake\");\n\n      function renderAudit() {\n        var controls = document.getElementById(\"audit-controls\"); controls.innerHTML = \"\";\n        audits.forEach(function (item) {\n          var button = document.createElement(\"button\"); button.type = \"button\"; button.className = \"audit-button\";\n          button.setAttribute(\"aria-pressed\", auditState === item.id ? \"true\" : \"false\");\n          var title = document.createElement(\"strong\"); title.textContent = item.title;\n          var short = document.createElement(\"span\"); short.textContent = item.short;\n          button.append(title, short);\n          button.addEventListener(\"click\", function () { auditState = item.id; writeState(\"system-audit:v1\", auditState); renderAudit(); });\n          controls.appendChild(button);\n        });\n        var selected = audits.find(function (item) { return item.id === auditState; }) || audits[0];\n        document.getElementById(\"audit-title\").textContent = selected.resultTitle;\n        document.getElementById(\"audit-explanation\").textContent = selected.result;\n      }\n      renderAudit();\n\n      var cases = [\n        {\n          scene: \"佐助将九只尾兽的查克拉强行汇聚于须佐能乎射出‘因陀罗之矢’；鸣人则借九喇嘛分身汇聚广袤大地的自然能量，以‘双重超大玉螺旋手里剑’正面迎击。\",\n          title: \"这场巅峰神力碰撞，最精准地隐喻了本课的哪一组核心政治分野？\",\n          options: [\n            \"佐助以单一绝对意志强行霸占并垄断外部资源，鸣人则在承认外部主体独立性的前提下广泛借力协同；差异在于力量如何组织与分配，而非谁放弃了力量。\",\n            \"佐助代表了与众多伙伴同生共死的温情联盟，而鸣人则刚愎自用、拒绝一切外界援助。\",\n            \"两种力量结构在本质上毫无二致，仅仅是视觉查克拉颜色的美术差异。\"\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：二人皆掌握着震古烁今的伟力，然而根本的分水岭在于：力量究竟是被独裁者强行吞并为个人特权，还是在尊重万物主体的关系网络中自愿汇聚与流转。\",\n            \"事实恰恰相反：佐助将尾兽强行抽干奴役于自身须佐能乎之中，鸣人的自然能量则依托于九喇嘛分身的主动协助与人与自然的和谐共生。\",\n            \"视觉层面的巅峰对轰承载着全剧最深刻的政治哲学隐喻：单极极权的霸占垄断与多维协同的网络共生，构成了两种截然对立的秩序模型。\"\n          ]\n        },\n        {\n          scene: \"双方忍术与瞳术查克拉全数枯竭，只能凭借近乎失去神智的沉重肉身在泥泞中踉跄挥拳，佐助却至死无法逼鸣人认输后退。\",\n          title: \"为何这一看似笨拙惨烈的泥潭肉搏，反而是整场思想大决战不可或缺的灵魂高潮？\",\n          options: [\n            \"它雄辩证明宏大抽象的救世理论最终必须由具象脆弱的凡人肉体担荷代价，彻底褪去超然神明的虚伪外衣，让二人回归为同等平等的真实个体。\",\n            \"它表明两人早已在疲惫中遗忘了战斗的政治目标，沦为了毫无理性意义的肌肉机械反应。\",\n            \"它意味着作品在此刻彻底推翻了此前关于政治革命与羁绊维系的所有严肃探讨，滑向了纯粹的热血虚无。\"\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：当近乎全能的神术褪去，佐助再也无法扮演高高在上的超然冷酷神明，鸣人的守护誓言亦不再是廉价口号——所有的政治哲学，在此刻被逼至由肉身苦难与流血意志进行终极检验。\",\n            \"二人从始至终无比清醒于自身的战斗使命；恰恰是当伟力耗尽之后依然死战不退的意志，赋予了这场终局决斗以不可替代的裁决力量。\",\n            \"肉搏绝未消解思想交锋，反而是用最残酷纯粹的生命体验，为此前所有的政治与哲学争鸣完成了最后的现实落地与去伪存真。\"\n          ]\n        },\n        {\n          scene: \"黄昏决战落幕，二人各断一臂并肩倒卧在终结之谷的血泊之中。佐助心悦诚服承认败北，鸣人却断然拒绝将其作为罪人清除出局。\",\n          title: \"这一震撼终局何以从根本上终止了千百年来因陀罗与阿修罗转生相杀的恶性轮回？\",\n          options: [\n            \"因为阿修罗转生者终于在物理力量上彻底斩杀了因陀罗转生者，斩草除根消灭了叛乱隐患。\",\n            \"因为胜者坚决拒绝消灭失败者，失败者亦主动放弃以消灭对方来证成自身的极端执念；分歧不再以一方肉体死亡或被驱逐出公共世界为终局。\",\n            \"因为二人自此在一切思想、性格与政治议题上达成了千人一面的完全绝对一致。\"\n          ],\n          answer: 1,\n          feedback: [\n            \"佐助并未被肉体清除；千百年宿命轮回之所以被打破，恰恰在于鸣人打破了‘胜者对败者实施正义清洗’的旧时代冷酷历史惯性。\",\n            \"解析正确：结构性的范式跃迁不在于谁在战力上压制了谁，而在于胜利不再制造带着未消化的仇恨潜入地下的失败者，双方共同确立了在分歧中并肩共存的全新可能。\",\n            \"真正的和解绝非强求思想的绝对同质化，而是在双方依然保留独立判断与性格棱角的前提下，停止将‘对方必须被物理消灭’作为自身道路成立的前提。\"\n          ]\n        }\n      ];\n      var caseState = readState(\"battle-lab:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(caseState.current)) caseState.current = 0;\n      caseState.current = clampIndex(caseState.current, cases.length);\n      caseState.answers = caseState.answers || {};\n      caseState.skipped = Array.isArray(caseState.skipped) ? caseState.skipped : [];\n\n      function saveCases() { writeState(\"battle-lab:v1\", caseState); }\n      function goToCase(index) { caseState.current = clampIndex(index, cases.length); saveCases(); renderCases(); }\n      function answerCase(caseIndex, optionIndex) { caseState.answers[caseIndex] = optionIndex; caseState.skipped = caseState.skipped.filter(function (index) { return index !== caseIndex; }); saveCases(); renderCases(); }\n      function skipCase() { var current = caseState.current; if (!Object.prototype.hasOwnProperty.call(caseState.answers, current) && caseState.skipped.indexOf(current) === -1) caseState.skipped.push(current); caseState.current = current \u003c cases.length - 1 ? current + 1 : 0; saveCases(); renderCases(); }\n\n      function renderCases() {\n        var tabs = document.getElementById(\"case-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"case-panels\"); panels.innerHTML = \"\";\n        cases.forEach(function (item, caseIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"step-tab\";\n          if (Object.prototype.hasOwnProperty.call(caseState.answers, caseIndex)) tab.classList.add(\"answered\");\n          if (caseState.skipped.indexOf(caseIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", caseIndex === caseState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"case-\" + caseIndex); tab.textContent = \"回合 \" + (caseIndex + 1); tab.addEventListener(\"click\", function () { goToCase(caseIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"case-\" + caseIndex; panel.className = \"case-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = caseIndex !== caseState.current;\n          var count = document.createElement(\"div\"); count.className = \"step-count\"; count.textContent = \"回合 \" + (caseIndex + 1) + \" / \" + cases.length;\n          var scene = document.createElement(\"p\"); scene.className = \"case-scene\"; scene.textContent = item.scene;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = item.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          item.options.forEach(function (optionText, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"case-\" + caseIndex; input.value = String(optionIndex); input.checked = Number(caseState.answers[caseIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerCase(caseIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.textContent = optionText; label.append(input, text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = caseState.answers[caseIndex];\n          if (selected === undefined) feedback.textContent = caseState.skipped.indexOf(caseIndex) !== -1 ? \"这一回合已暂时跳过。你可以随时回来。\" : \"选择最能贯通战斗动作与思想结构的一项。\";\n          else { var correct = Number(selected) === item.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = item.feedback[Number(selected)]; }\n          panel.append(count, scene, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"case-prev\").disabled = caseState.current === 0;\n        document.getElementById(\"case-next\").textContent = caseState.current === cases.length - 1 ? \"回到第一回合 ↺\" : \"下一回合 →\";\n      }\n      document.getElementById(\"case-prev\").addEventListener(\"click\", function () { goToCase(caseState.current - 1); });\n      document.getElementById(\"case-next\").addEventListener(\"click\", function () { goToCase(caseState.current === cases.length - 1 ? 0 : caseState.current + 1); });\n      document.getElementById(\"case-skip\").addEventListener(\"click\", skipCase);\n      renderCases();\n\n      var questions = [\n        {\n          title: \"佐助的“理性革命”与斑的“无限月读”，在政治哲学层面最根本的本质分野是什么？\",\n          options: [\n            { text: \"佐助保留了清醒的现实公共世界，企图将全人类的仇恨与冲突垄断于自身以维系被动联合；斑则直接以定制的私人幻梦彻底取消了共同现实与自由意志。\", help: \"二者皆诉诸绝对强者的神权，但分别采取了“集中仇恨”与“消解主体”两种截然不同的控制技术。\" },\n            { text: \"佐助企图强迫全人类进入梦境，而斑则致力于建立民主协商的五影联席议会。\", help: \"两人的政治主张与此项陈述恰好完全颠倒。\" },\n            { text: \"二者在构想上毫无任何本质差别，仅仅是统治口号与执行代号的不同。\", help: \"深刻审视佐助是否保留了众人的清醒意识、现实肉身与现实社会的运转。\" }\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：佐助比斑保留了更多的人间主体性与现实世界，却企图以单极威慑垄断全人类的终极裁决权，二者属于不同维度的专制和平方案。\",\n            \"斑发动无限月读意图抹杀清醒意识，而佐助则断然拒绝虚妄幻梦、誓在现实焦土之上化身为永恒的唯一黑暗。\",\n            \"二者虽皆建立在对凡人互信彻底绝望的共同前提上，却在统治技术与对现实世界存废的裁决上存在着质的差异。\"\n          ]\n        },\n        {\n          title: \"为何在佐助的革命蓝图中，“斩杀鸣人”是一道在政治与心理上皆不可或缺的绝对闭环？\",\n          options: [\n            { text: \"因为鸣人既是在现实战力上唯一足以掀翻其极权秩序的防线，亦是佐助在凡尘最后的真实羁绊；只要鸣人活着，佐助便无法蜕变为彻底孤绝、只承载纯粹仇恨的政治图腾。\", help: \"需同时结合战场上的物理均势制衡，与佐助自我身份认同的终极精神献祭进行综合审视。\" },\n            { text: \"因为鸣人掌握着佐助闻所未闻的独门忍术，足以让佐助在瞬息之间丧失全部查克拉。\", help: \"战力冲突的核心在于政治意志与秩序路线的决战，而非某种单一忍术机密的争夺。\" },\n            { text: \"因为鸣人与佐助自幼相识以来，彼此之间从未建立过任何真实的心灵共鸣与情感联结。\", help: \"恰恰因为佐助在心底承认鸣人是无可替代的至交挚友，才将其视为必须以命相搏亲手斩断的最后凡尘锁链。\" }\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：处决鸣人将同时抹杀外部最强大的制衡力量与内心情感的最后归宿，使这场以“绝对孤独”为基石的独裁革命在逻辑与心理上彻底封闭。\",\n            \"解除无限月读需要二人合力，终结之谷的较量本质上是关于战后忍界权力归属与和平范式的终极道路决战。\",\n            \"自第一次终结之谷决战起，佐助便已承认鸣人是自身唯一的挚友；正是因为这份羁绊如此刻骨铭心，才构成了革命必须跨越的终极关隘。\"\n          ]\n        },\n        {\n          title: \"鸣人所践行的和平道路，为何绝不能被轻浮地概括为“盲目相信所有人未来都会变好”？\",\n          options: [\n            { text: \"因为他清醒承认人世间的冲突、动荡与制度失败依然可能发生，他所誓死捍卫的是保留人与人共同承担风险、重新建立接触并动态纠错的关系能力。\", help: \"鸣人的主张绝非提供一劳永逸的结果担保，而是坚决拒绝把人类未来封死在极权铁笼之中的过程承诺。\" },\n            { text: \"因为鸣人暗中准备施展更为庞大的心灵控制催眠术，强令全忍界众生在神树下表现出绝对的友善。\", help: \"这将使鸣人的方案与他誓死反对的无限月读毫无二致。\" },\n            { text: \"因为鸣人计划在登基成为火影之后，将全忍界所有的行政与军事权力重新全盘移交给佐助一人独裁。\", help: \"鸣人终生所抗争的，恰恰就是由单一个体独揽全部黑暗与专制权力的极权逻辑。\" }\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：鸣人的道路充满波折、脆弱甚至可能面临倒退，但其核心价值正在于允许凡人参与、暴露缺陷并通过动态纠错机制获得永续的修复韧性。\",\n            \"鸣人誓死捍卫的是每一个人清醒思考与自主选择的权利，从未企图以精神控制制造虚假的表面和谐。\",\n            \"鸣人坚持让痛苦、权力与治理责任在人际网络中开放流动，断然拒绝将世界抵押给任何一位超然的独裁救世主。\"\n          ]\n        },\n        {\n          title: \"因陀罗与阿修罗绵延千年的转生宿命轮回，究竟在什么深层意义上被鸣人与佐助彻底终止？\",\n          options: [\n            { text: \"鸣人在战力上彻底斩杀了佐助，从肉体基因层面一劳永逸地清除了因陀罗的所有后继转生者。\", help: \"佐助在此役中幸存并与鸣人携手解除无限月读，终局绝未重演‘胜者清洗败者’的历史惯性。\" },\n            { text: \"二人自此在一切性格特征、哲学观念与具体政见上达成了绝对同质化，世间再无任何思想争论。\", help: \"宿命的终结绝不以抹杀个体的独立思想与性格棱角为代价。\" },\n            { text: \"胜者坚决拒绝消灭失败者，失败者亦主动放弃以消灭对方来证成自身的极端执念；历史的伤痕不再被用作点燃下一轮仇杀复仇的合法许可证。\", help: \"紧扣被根本改写的人际关系与伦理范式，而非单纯停留在战术胜负的胜败表象。\" }\n          ],\n          answer: 2,\n          feedback: [\n            \"佐助并未被消灭；鸣人断然拒绝复制‘胜者以正义之名清除败者’的旧时代冷酷法则，正是终结宿命循环的最核心枢纽。\",\n            \"二人战后依然保留着各自鲜明的性格与行事风格；真正的划时代突破在于对待分歧与矛盾的处理方式发生了根本跃迁。\",\n            \"解析正确：千年循环终止于双方共同打破了‘唯有将对方物理消灭，我的道路才能成立’的零和博弈思维，让痛苦在共同承认与承担中转化为守护人间的基石。\"\n          ]\n        }\n      ];\n      var quizState = readState(\"quiz:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(quizState.current)) quizState.current = 0;\n      quizState.current = clampIndex(quizState.current, questions.length);\n      quizState.answers = quizState.answers || {};\n      quizState.skipped = Array.isArray(quizState.skipped) ? quizState.skipped : [];\n\n      function saveQuiz() { writeState(\"quiz:v1\", quizState); }\n      function goToQuestion(index) { quizState.current = clampIndex(index, questions.length); saveQuiz(); renderQuiz(); }\n      function answerQuestion(questionIndex, optionIndex) { quizState.answers[questionIndex] = optionIndex; quizState.skipped = quizState.skipped.filter(function (index) { return index !== questionIndex; }); saveQuiz(); renderQuiz(); }\n      function skipQuestion() { var current = quizState.current; if (!Object.prototype.hasOwnProperty.call(quizState.answers, current) && quizState.skipped.indexOf(current) === -1) quizState.skipped.push(current); quizState.current = current \u003c questions.length - 1 ? current + 1 : 0; saveQuiz(); renderQuiz(); }\n\n      function renderQuiz() {\n        var tabs = document.getElementById(\"quiz-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"quiz-panels\"); panels.innerHTML = \"\";\n        questions.forEach(function (question, questionIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"quiz-tab\";\n          if (Object.prototype.hasOwnProperty.call(quizState.answers, questionIndex)) tab.classList.add(\"answered\");\n          if (quizState.skipped.indexOf(questionIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", questionIndex ent.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = quizState.answers[questionIndex];\n          if (selected === undefined) feedback.textContent = quizState.skipped.indexOf(questionIndex) !== -1 ? \"这题已暂时跳过。你可以随时回来。\" : \"选择后会立即看到解释；也可以先查看选项后的概念提示。\";\n          else { var correct = Number(selected) === question.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = question.feedback[Number(selected)]; }\n          panel.append(count, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"quiz-prev\").disabled = quizState.current === 0;\n        document.getElementById(\"quiz-next\").textContent = quizState.current === questions.length - 1 ? \"回到第一题 ↺\" : \"下一题 →\";\n      }\n      document.getElementById(\"quiz-prev\").addEventListener(\"click\", function () { goToQuestion(quizState.current - 1); });\n      document.getElementById(\"quiz-next\").addEventListener(\"click\", function () { goToQuestion(quizState.current === questions.length - 1 ? 0 : quizState.current + 1); });\n      document.getElementById(\"quiz-skip\").addEventListener(\"click\", skipQuestion);\n      renderQuiz();\n    }());\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session7.html","basePath":"session7.html","lang":"zh-CN","kind":"lesson","title":"忍界和平的哲学讨论","translations":{"zh-CN":"session7.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"忍界和平的哲学讨论\">\n  \u003ctitle>忍界和平的哲学讨论｜《火影忍者》主线重构\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f6f1e7;\n      -  30; left: 50%; bottom: calc(100% + .65rem); width: min(21rem, 75vw); padding: .75rem .85rem; border: 1px solid var(--line); border-radius: .6rem; color: var(--ink); background: var(--white); box-shadow: var(--shadow); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; font-weight: 400; line-height: 1.5; opacity: 0; pointer-events: none; transform: translate(-50%, .3rem); transition: opacity 160ms ease, transform 160ms ease; }\n    .term:hover .tooltip, .term:focus .tooltip { opacity: 1; transform: translate(-50%, 0); }\n    .key-point, .canon-note { margin: 1.7rem 0; padding: 1.1rem 1.25rem; border-radius: .7rem; background: var(--sage-soft); }\n    .key-point strong, .canon-note strong { color: #46503f; }\n    .warning-note { margin: 1.7rem 0; padding: 1.1rem 1.25rem; border-left: 4px solid var(--gold); background: var(--gold-soft); }\n\n    .criteria { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1rem; margin: 1.7rem 0; }\n    .criterion { padding: 1.05rem 1.1rem; border: 1px solid var(--line); border-radius: .75rem; background: var(--card); }\n    .criterion strong { display: block; color: var(--accent); }\n    .criterion span { display: block; margin-top: .3rem; color: var(--muted); font-size: .88rem; }\n\n    .model-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1rem; margin: 1.8rem 0; }\n    .model-card { padding: 1.2rem; border: 1px solid var(--line); border-radius: .8rem; background: var(--card); }\n    .model-card h3 { margin: 0; }\n    .model-card .model-name { margin: .25rem 0 .7rem; color: var(--accent); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .76rem; font-weight: 700; letter-spacing: .05em; }\n    .model-card p { color: var(--muted); font-size: .9rem; }\n    .model-card .formula { padding-top: .65rem; border-top: 1px solid var(--line); color: var(--ink); font-style: italic; }\n\n    .lab { margin: 2.5rem 0; padding: clamp(1.1rem, 3vw, 1.8rem); border: 1px solid var(--line); border-radius: 1rem; background: var(--card); box-shadow: var(--shadow); }\n    .lab-head { display: flex; align-items: start; justify-content: space-between; gap: 1rem; margin-bottom: 1.3rem; }\n    .lab-head h2, .lab-head h3 { margin: 0; }\n    .lab-head p { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }\n    .lab-label { flex: 0 0 auto; padding: .22rem .55rem; border-radius: 999px; color: var(--accent-dark); background: var(--accent-soft); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .72rem; font-weight: 700; }\n    .button { padding: .55rem .9rem; border: 1px solid var(--line); border-radius: .55rem; color: inherit; background: var(--white); cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; font-weight: 650; }\n    .button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }\n    .button.primary { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .button.primary:hover:not(:disabled) { color: var(--white); background: var(--accent-dark); }\n    .button:disabled { opacity: .35; cursor: default; }\n    .lab-nav, .lab-nav-group { display: flex; flex-wrap: wrap; gap: .55rem; }\n    .lab-nav { justify-content: space-between; margin-top: 1rem; }\n\n    .model-explorer { display: grid; grid-template-columns: minmax(15rem,.72fr) minmax(0,1.28fr); gap: 1.1rem; }\n    .model-buttons { display: grid; gap: .5rem; align-content: start; }\n    .model-button { display: flex; justify-content: space-between; gap: .7rem; padding: .75rem .82rem; border: 1px solid var(--line); border-radius: .6rem; text-align: left; background: var(--white); cursor: pointer; }\n    .model-button:hover { border-color: var(--blue); }\n    .model-button[aria-pressed=\"true\"] { border-color: var(--blue); background: var(--blue-soft); }\n    .model-button span { color: var(--muted); font-size: .78rem; }\n    .model-result { min-height: 22rem; padding: 1.1rem 1
