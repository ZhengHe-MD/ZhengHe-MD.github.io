 transform: translateY(.3rem); }\n      .term:hover .tooltip, .term:focus .tooltip { transform: translateY(0); }\n      .lab-head { display: block; }\n      .lab-label { display: inline-block; margin-top: .6rem; }\n      .lab-nav { flex-direction: column; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      html { scroll-behavior: auto; }\n      .tooltip { transition: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cnav class=\"topbar\" aria-label=\"课程导航\">\n      \u003cdiv class=\"topbar-links\">\u003ca href=\"session3.html\">← 上一讲\u003c/a>\u003ca href=\"syllabus.html\">课程大纲\u003c/a>\u003c/div>\n      \u003cspan class=\"lesson-count\">第 4 讲 / 共 7 讲\u003c/span>\n    \u003c/nav>\n\n    \u003cheader class=\"lesson-header\">\n      \u003cp class=\"eyebrow\">第四讲 · 遗孤\u003c/p>\n      \u003ch1>两名遗孤\u003c/h1>\n      \u003cp class=\"lede\">鸣人与佐助绝非脸谱化的“天生明朗”与“生性阴郁”。他们皆是上一代体制暴力与地缘死局碾压下的时代弃儿：一个被彻底剥夺身世真相，终日直面全村的冷眼排斥；一个被迫背负惨烈血海，余生皆被强行规训为复仇的利刃。两人命运真正的分野，在于面对蚀骨创伤时——究竟是甘愿承受脆弱、让羁绊继续拥有重塑自我的力量，还是决绝地挥刀斩断一切牵绊以换取冷酷的自保。\u003c/p>\n      \u003cdiv class=\"lesson-meta\" aria-label=\"本课信息\">\u003cspan>约 30 分钟\u003c/span>\u003cspan>人物与制度\u003c/span>\u003cspan>深度复盘\u003c/span>\u003c/div>\n      \u003cblockquote class=\"opening-question\">带着一个问题出发：若你视若珍宝的心灵羁绊，恰恰是敌人刺痛你、要挟你的致命软肋，那么保护自我的终极防线，究竟是不是该亲手斩断这段羁绊？\u003c/blockquote>\n      \u003cdiv class=\"learning-goals\" aria-label=\"学习目标\">\n        \u003cdiv class=\"goal\">\u003cstrong>01\u003c/strong>\u003cspan>理清九尾之乱、宇智波灭族与双子孤儿命运的同构因果链\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>02\u003c/strong>\u003cspan>辩证剖析鼬之抉择中的“崇高动机”、“被迫妥协”与“转嫁代价”\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>03\u003c/strong>\u003cspan>洞悉终结之谷初次决裂背后两种截然对立的力量哲学\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"answer-first\">\n        \u003ch2 id=\"answer-first\">开篇立论：他们承袭的绝非冥冥宿命，而是前人遗留的未解死局\u003c/h2>\n        \u003cp>如第 3 讲所述，带土悍然掀起九尾之乱，水门与玖辛奈为守护木叶壮烈殉村。鸣人作为新任\u003cspan class=\"term\" tabindex=\"0\">人柱力\u003cspan class=\"tooltip\" role=\"tooltip\">体内封印着狂暴尾兽的活体容器。在忍村体制下，他们往往既被奉为终极战略核威慑，又被无知世人视作不祥怪物而备受敌视孤立。\u003c/span>\u003c/span>艰难降世，却对父母的英雄壮举一无所知，终日饱受全村莫名仇恨的凌迟。与此同时，九尾之乱中浮现的写轮眼操控痕迹，使木叶高层对宇智波一族的猜忌急剧恶化：宇智波全族被强行迁徙至村落边缘、置于全方位严密监视之下，族内激进派终至忍无可忍、铤而走险酝酿武装政变。\u003c/p>\n        \u003cp>在此历史关口，木叶决策层将扑灭政变烽火的绝命重压，冷酷地压在了年仅十三岁的鼬双肩之上。鼬毅然手刃全族，唯独留下幼弟佐助；他甚至不惜动用至高幻术，强迫佐助反复目睹父母喋血的至惨瞬间，将“弑兄复仇”强行焊死为佐助人生的唯一执念。同一种体制的隐秘运作，由此催生了两种极致的生命孤独：\u003c/p>\n        \u003cdiv class=\"mirror-grid\">\n          \u003carticle class=\"mirror-card naruto\">\u003ch3>鸣人：无从知晓因由的放逐与排斥\u003c/h3>\u003cp>他不知晓自身的苦难究竟源自何段历史隐秘，只知道世人每每与他对视便冷漠移开目光。他最初以狂乱的恶作剧拼命乞求注视，后在历练中将“渴求他人认可”升华蜕变为“由我来主动认可并誓死捍卫与他人的羁绊”。\u003c/p>\u003c/article>\n          \u003carticle class=\"mirror-card sasuke\">\u003ch3>佐助：被强行唯一解构的残酷余生\u003c/h3>\u003cp>他深知至亲喋血于谁人之手，却被死死剥夺了洞悉长兄苦衷的可能。兄长用鲜血为他量身订立了不可忤逆的人生铁律：唯有仇恨愈纯粹、力量方能愈强大；唯有亲手斩杀长兄，余生方具意义。\u003c/p>\u003c/article>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>互为表里的对照：\u003c/strong>鸣人被迫深陷于“失去根源、没有过去”的虚无孤独，佐助则被迫囚禁于“除了血仇、再无未来”的窒息孤独。两个孩子皆未曾亲手铸成最初的浩劫，却被迫在风雨飘摇的人间，用一生去回答：是否任由前人的灾难，继续替自己决定命运的航向？\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"one-history\">\n        \u003ch2 id=\"one-history\">编年溯源：同一部政治绞肉机，如何碾碎两个少年的童年\u003c/h2>\n        \u003cdiv class=\"story-line\" aria-label=\"两名遗孤的共同时间线\">\n          \u003carticle class=\"story-event\">\u003ch3>带土强袭木叶\u003c/h3>\u003cp>九尾之难导致水门与玖辛奈殉职；鸣人甫一降生便沦为失去双亲的活体兵器人柱力。九尾瞳孔中的写轮眼印记，亦将宇智波全族推上了高层猜忌的风口浪尖。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>物理隔离将戒备激化为阵营对立\u003c/h3>\u003cp>木叶高层强令宇智波迁居村落边缘并设立暗部结界监视。族人认定此乃体制性的政治放逐与侮辱，族内强硬激进派决意发动武装政变夺回执政话语权。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>高层裁决：秘密政治清算\u003c/h3>\u003cp>团藏暗算夺取止水之眼，彻底粉碎了止水企图以‘别天神’和平消弭政变的最后希望。鼬陷入家族与村落两难绝境；在团藏以天下大乱和佐助性命的威逼下，鼬痛饮血泪接受灭族密令。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>鼬为佐助烙印复仇铁轨\u003c/h3>\u003cp>鼬甘愿背负叛忍骂名，以生命为筹码逼迫团藏立誓庇护佐助，并诱导佐助将万丈仇恨尽数倾泻于己身。佐助得以苟全性命，却彻底失去了作为独立个体拥抱广阔人生的自由。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>两名遗孤汇聚第七班\u003c/h3>\u003cp>卡卡西引导鸣人、佐助与小樱通过抢铃铛演练：忍者铁律固然不可违，但舍弃同伴者更是猪狗不如。这支三人小队，破天荒地为两颗孤寂的灵魂提供了超越冷酷村落与血海深仇的温暖归宿。\u003c/p>\u003c/article>\n        \u003c/div>\n        \u003caside class=\"canon-note\">\u003cstrong>切勿将具体责任稀释于抽象的“时代洪流”：\u003c/strong>体制排斥固然解释了宇智波为何走向激进化，政变危机固然揭示了木叶高层的安全恐慌；但明晰每一步的结构性重压，绝不等于政变厮杀、卑劣夺眼乃至灭绝全族就是别无选择的唯一道路。\u003c/aside>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"inheritance-map\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"inheritance-map\">遗产溯源：他们从上一代体制中继承了什么？\u003c/h2>\u003cp>请分别点选鸣人与佐助背负的历史负重。每一项的激活，皆将深度揭示上一代的政治遗恨如何深刻锚定了后人的生命抉择。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">因果追踪\u003c/span>\u003c/div>\n      \u003cdiv class=\"inheritance-grid\">\n        \u003cdiv class=\"inheritance-column\">\u003ch3>鸣人的历史负重\u003c/h3>\u003cdiv id=\"naruto-inheritance\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"inheritance-column\">\u003ch3>佐助的历史负重\u003c/h3>\u003cdiv id=\"sasuke-inheritance\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"inheritance-result\" class=\"inheritance-result\" aria-live=\"polite\">\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"itachi-choice\">\n        \u003ch2 id=\"itachi-choice\">鼬之绝命抉择：牺牲自我的崇高，不等于免除了转嫁伤害的沉重\u003c/h2>\n        \u003cp>鼬试图在死局中达成不可调和的多重目标：挽救木叶免于内战焦土、阻止列国乘虚入侵、竭尽全力保全幼弟性命，同时为宇智波一族保留最后一份名誉底线。他决然选择将万世骂名与灭门血债尽数揽于一身，期盼幼弟有朝一日手刃自己、以英雄姿态重归木叶光明。这份抉择固然展现出常人难以企及的牺牲精神，却也在本质上隐匿着极其强势的独断掌控：他以神明自居，擅自替佐助裁决了该恨谁、该如何变强、何时知悉真相，乃至如何看待父母的死。\u003c/p>\n        \u003cp>因而，对宇智波鼬的评价绝不可轻率滑向非黑即白的扁平站队。更为严谨的审视应当将其拆解为三重维度：\u003c/p>\n        \u003cul>\n          \u003cli>\u003cstrong>他洞察到了何种现实危机？\u003c/strong>武装政变必将引爆惨烈内战，进而诱发周边各大忍村联合入侵，导致千万人喋血荒野。\u003c/li>\n          \u003cli>\u003cstrong>是谁在极限压缩他的腾挪空间？\u003c/strong>团藏以全族灭顶之灾与佐助生死相要挟；三代目虽主张温和谈判，却在行动上软弱迟疑，未能及时制衡并勒马团藏的极权暴行。\u003c/li>\n          \u003cli>\u003cstrong>他最终将惨烈的代价转嫁给了谁？\u003c/strong>宇智波全族男女老幼被剥夺生命与辩白之权，而幼弟佐助则被彻底剥夺了家庭温情、身世真相以及自主探索生命形态的自由意志。\u003c/li>\n        \u003c/ul>\n        \u003cp class=\"warning-note\">\u003cstrong>悲剧的核心并非鼬“纯粹冷血”，而是在体制高压与时间逼仄的夹缝中，他无奈接受了一个“由至亲弱者背负全部代价”的极端方案。\u003c/strong>洞悉这份沉重的政治绞杀，能够让我们在历史评价中保持理性的温度；但它绝不该成为漠视无辜受害者鲜血的借口。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"itachi-ledger\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"itachi-ledger\">抉择实验：重构鼬之决策天平的三大优先级\u003c/h2>\u003cp>请调节三项战略诉求的权重标尺。观察当某一目标被绝对拔高时，体制会将何种隐蔽成本残酷转嫁给弱者。此举旨在让复杂的伦理取舍具象显形。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">代价账本\u003c/span>\u003c/div>\n      \u003cdiv class=\"dilemma-layout\">\n        \u003cdiv id=\"priority-controls\">\u003c/div>\n        \u003cdiv class=\"dilemma-result\" aria-live=\"polite\">\u003ch3 id=\"priority-verdict\">\u003c/h3>\u003cp id=\"priority-explanation\">\u003c/p>\u003cul id=\"priority-costs\" class=\"cost-list\">\u003c/ul>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"naruto-bonds\">\n        \u003ch2 id=\"naruto-bonds\">鸣人的“坚毅明朗”：在被爱回应的废墟中一次次艰难重构\u003c/h2>\n        \u003cp>鸣人的豁达明理，绝非天生便未卜先知的特质。在早年备受白眼的阴霾岁月中，他同样只能借由恶作剧来刷存在感，将“成为火影”浅浅理解为获取全村认可的虚荣通行证。真正的精神涅槃，始于那些鲜活的人格给予他的真诚回应：伊鲁卡在生死关头挺身而出，舍命确信“他绝非妖狐化身”；卡卡西言传身教，树立起同伴重于规矩的守护信条；佐助在波之国枪林弹雨中，本能地用身躯替他挡下漫天飞针。\u003c/p>\n        \u003cp>这些珍贵的善意并未洗刷掉鸣人童年的创伤烙印，却为他提供了全新的生命诠释学：身受伤害，绝不代表人间一切羁绊皆注定破灭；个体完全可以在既定的苦难之外，借由真诚以待迎来崭新的善意回响。鸣人往后百折不挠、誓死追回佐助的狂执，绝非单纯的少年意气，而是他在用整个生命守护那根曾将自己从深渊拉回人间的救命稻草。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"sasuke-cuts\">\n        \u003ch2 id=\"sasuke-cuts\">佐助的决绝：为何真实的温情反倒成了复仇的枷锁？\u003c/h2>\n        \u003cp>第七班的岁月，曾一度令佐助重温了久违的家的温度。他会不假思索地用身体护卫鸣人，亦会在暴走的我爱罗面前决绝断后守护同伴。然而这方温柔乡，却恰恰与长兄用血泪烙下的\u003cspan class=\"term\" tabindex=\"0\">复仇铁轨\u003cspan class=\"tooltip\" role=\"tooltip\">本课专属分析概念：指鼬通过谎言欺瞒、月读折磨与冷血训诫，将“杀死哥哥”强行规训为佐助唯一正当、神圣的人生终极坐标。\u003c/span>\u003c/span>发生了剧烈冲突：一旦新的情感归宿变得不可割舍，“为全族复仇”的唯一正当性便将发生不可容忍的动摇。\u003c/p>\n        \u003cp>长兄鼬重返木叶时的降维打击，以摧枯拉朽之势击溃了佐助脆弱的自尊，并以月读酷刑将灭族血夜再度强加于其脑海。佐助痛苦地将自己与鸣人日益缩小的战力鸿沟，扭曲诠释为“安逸的羁绊软化了我的仇恨”。在此绝望节点，大蛇丸的\u003cspan class=\"term\" tabindex=\"0\">天之咒印\u003cspan class=\"tooltip\" role=\"tooltip\">大蛇丸施加的禁忌力量烙印，能暴烈催化查克拉与肉体潜能，亦会同步侵蚀宿主心智、将其拉入大蛇丸的支配深渊。\u003c/span>\u003c/span>便成了极具诱惑的毒苹果：它承诺提供立竿见影的绝对力量，无需等待漫长的羁绊成长，亦无需将信任托付于旁人。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>核心洞察：\u003c/strong>佐助叛离木叶，绝非源于他对第七班毫无感情；恰恰相反，正是因为这份羁绊已然真实深厚到足以动摇其复仇信念，他才被迫在剧痛中决绝地挥刀斩断一切。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"bond-lab\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"bond-lab\">羁绊压力测试：生死交织之际，情谊究竟是力量还是破绽？\u003c/h2>\u003cp>请逐一审视经典抉择场景。选出最能贯通人物行为与内心深层张力的精准剖析。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">3 个场景\u003c/span>\u003c/div>\n      \u003cdiv id=\"case-tabs\" class=\"step-tabs\" role=\"tablist\" aria-label=\"场景导航\">\u003c/div>\n      \u003cdiv id=\"case-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"case-prev\" class=\"button\" type=\"button\">← 上一幕\u003c/button>\u003cbutton id=\"case-next\" class=\"button primary\" type=\"button\">下一幕 →\u003c/button>\u003c/div>\u003cbutton id=\"case-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"first-valley\">\n        \u003ch2 id=\"first-valley\">第一次终结之谷：关于“谁有权定义佐助之痛”的旷世争夺\u003c/h2>\n        \u003cp>狂奔追至终结之谷的鸣人，彼时并未掌握成熟的政治纲领。他首先出于本能无法承受挚友的不告而别，亦下意识地将佐助的深渊与自己的孤寂紧紧捆绑。而佐助则冷酷判定从未品尝过至亲俱亡之痛的鸣人，绝无可能感同身受；然而在刀兵相见之际，佐助亦不得不由衷承认，鸣人已然成为自己在这世上“唯一的挚友”。\u003c/p>\n        \u003cp>这一承认，瞬间赋予了这场决斗以惨绝人寰的残酷逻辑。鼬曾冷血昭告：唯有手刃挚爱之人，方能觉醒至高无上的\u003cspan class=\"term\" tabindex=\"0\">万花筒写轮眼\u003cspan class=\"tooltip\" role=\"tooltip\">写轮眼的终极进化形态，往往在亲历至亲至爱之人的毁灭性剧痛中觉醒。鼬刻意将其伪装为必须亲手弑友方能解锁的修罗法则。\u003c/span>\u003c/span>；若要向命运证明自己已彻底沦为纯粹的复仇厉鬼，佐助必须痛下杀手取鸣人性命。然而在最终的决胜时刻，佐助却硬生生收住了千鸟的致命锋刃。他傲然立誓绝不依循长兄规定的路径夺取力量，而后孤身一人步入凄风冷雨，走向大蛇丸的幽暗巢穴。\u003c/p>\n        \u003cp>因此，终结之谷的第一战绝不能被浅薄地判定为“羁绊的完败”。鸣人未能如愿将挚友带回木叶，佐助亦未能如愿将鸣人化作冷血斩断的垫脚石。佐助在现实空间斩断了同生共死的过往，却以收刀之举完成了对长兄规训的初次叛逆；鸣人承受了挚友离去的刻骨阵痛，却誓死拒绝将这份失败贬低为“羁绊毫无价值”。\u003c/p>\n        \u003cdiv class=\"mirror-grid\">\n          \u003carticle class=\"mirror-card naruto\">\u003ch3>鸣人的力量哲学\u003c/h3>\u003cp>羁绊固然赋予人不可承受之重，却亦能赋予人超越一己极限的守护信念与博大胸怀。当下的受挫仅意味着需要更加刻苦地锤炼自身，绝非否定羁绊本身的意义。\u003c/p>\u003c/article>\n          \u003carticle class=\"mirror-card sasuke\">\u003ch3>佐助此刻的力量哲学\u003c/h3>\u003cp>终极目标必须无情碾碎一切私人情谊；牵绊愈少，出刀方能愈发凌厉纯粹。然而他最终对鸣人的留情，雄辩地印证了“斩断羁绊”绝非已成定局的事实，而是他必须日复一日靠意志去艰难压抑的折磨。\u003c/p>\u003c/article>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"inheritance-verdict\">\n        \u003ch2 id=\"inheritance-verdict\">时代暂未打破循环，只是重塑了悲剧的轮廓\u003c/h2>\n        \u003cp>初代柱间曾天真地以为建立忍村城邦，便能彻底庇护孩童免于血腥杀戮；然而新兴的体制为了维系表面的稳定，却冷酷地将九尾之乱的污名、人柱力的牺牲、宇智波的猜忌与灭族的血海，一股脑倾倒进了下一代孩童的稚嫩心房。鸣人与佐助绝非忍村体制大功告成后的孤立意外，而是该体制一切未决沉疴与制度暴力的浓缩缩影。\u003c/p>\n        \u003cp>终结之谷风雨初歇，佐助毅然投向更严苛的支配者大蛇丸，鸣人则毅然拜自来也为师踏上漫漫修行路。两人皆在执着地追逐伟力，但力量的价值旨归已然云泥之别：一个企图借由绝对伟力彻底斩断人间一切羁绊的制约，另一个则立誓借由伟力去承担“永不放弃羁绊”的千钧重负。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>本课裁定：\u003c/strong>鸣人选择的守护之路绝不保证永无背叛，而佐助选择的孤绝之路亦未曾真正让他摆脱受人摆布的阴霾。强行斩断羁绊或许能换取片刻的自保无痛，却终将把“由谁来主宰我的人生航向”的至高权柄，拱手让渡给复仇脚本、黑暗咒印与野心勃勃的野心家。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"lesson-check\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"lesson-check\">认知检验：剧痛过后，究竟由谁来执掌命运的抉择？\u003c/h2>\u003cp>一次只看一道题。选择后立即得到解释；可以跳过、返回或修改，进度会自动保留。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">4 个问题\u003c/span>\u003c/div>\n      \u003cdiv id=\"quiz-tabs\" class=\"quiz-tabs\" role=\"tablist\" aria-label=\"问题导航\">\u003c/div>\n      \u003cdiv id=\"quiz-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"quiz-prev\" class=\"button\" type=\"button\">← 上一题\u003c/button>\u003cbutton id=\"quiz-next\" class=\"button primary\" type=\"button\">下一题 →\u003c/button>\u003c/div>\u003cbutton id=\"quiz-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cfooter class=\"lesson-footer\">\n      \u003cdiv class=\"takeaway\">\u003cstrong>核心结语：\u003c/strong>鸣人与佐助最根本的人格分野，绝非在于谁比谁承受了更多的苦难，而在于他们如何安放苦难带来的软弱与创伤：鸣人逐渐敞开心扉，允许善意的羁绊继续重塑脆弱的自我；而佐助则试图以决绝的姿态斩断一切人间温情，以免任何人再次握住刺痛他灵魂的软肋。\u003c/div>\n      \u003cp class=\"next-lesson\">\u003cstrong>下一讲：忍界大战，所有和平方案接受检验\u003c/strong>五影何以终弃前嫌结成同盟；秽土转生如何让沉沦的旧时代亡魂重临沙场；以及带土、斑与忍者联军将如何在烈火中回答——“这个充满痛楚的真实人世，究竟是否值得被誓死挽留”。\u003c/p>\n    \u003c/footer>\n  \u003c/main>\n\n  \u003cscript>\n    (function () {\n      \"use strict\";\n      var storagePrefix = \"course:session4:\";\n\n      function readState(key, fallback) {\n        try {\n          var saved = localStorage.getItem(storagePrefix + key);\n          return saved ? JSON.parse(saved) : fallback;\n        } catch (error) { return fallback; }\n      }\n\n      function writeState(key, value) {\n        try { localStorage.setItem(storagePrefix + key, JSON.stringify(value)); }\n        catch (error) { /* 禁用本地存储时，课程仍可使用。 */ }\n      }\n\n      function clampIndex(index, length) { return Math.max(0, Math.min(length - 1, index)); }\n\n      var inheritances = {\n        naruto: [\n          { id: \"kurama\", title: \"九尾封印与人柱力宿命\", short: \"带土暴乱强加的终极战略兵器与污名诅咒\", detail: \"鸣人被迫承袭了守护木叶的核威慑神力，却也全盘承袭了全村对九尾浩劫的入骨恐惧；全村的安全感，实则由他无辜的童年孤立与苦难残酷垫付。\" },\n          { id: \"silence\", title: \"被强行封锁的身世真相\", short: \"不知英雄父母是谁，不知滔天敌意因何而起\", detail: \"高层的集体沉默未能抚平创伤，反而让幼小的鸣人将体制性的人格排斥，痛苦地误读为‘自己生来便不配被爱’的原罪。\" },\n          { id: \"recognition\", title: \"立志成为火影的精神承诺\", short: \"将公共执政之位视作赢得全员接纳的救赎之路\", detail: \"问鼎火影最初仅是填补童年荒芜的求救信号，直至历经生死羁绊的淬炼，方才蜕变为主动庇护众生、承担天下道义的领袖自觉。\" }\n        ],\n        sasuke: [\n          { id: \"massacre\", title: \"灭族惨夜的唯一幸存者\", short: \"至亲宗族与平静日常在一夜之间灰飞烟灭\", detail: \"佐助承接的绝非单纯的血亲哀思，更是木叶高层将复杂政治路线冲突‘秘密化、极端肉体消灭化’所遗留的全部毁灭性恶果。\" },\n          { id: \"revenge\", title: \"长兄用血泪烙印的复仇铁轨\", short: \"至亲长兄既是不共戴天的死仇，亦是余生唯一定位\", detail: \"复仇赋予了佐助活下去的行动力，却使其整个人格永久寄生于对鼬的执念中；愈是拼死想要挣脱兄长的阴影，余生便愈发被牢牢钉死在兄长设定的轨道上。\" },\n          { id: \"sharingan\", title: \"宇智波瞳力的诅咒叙事\", short: \"创伤痛楚愈是撕心裂肺，写轮眼瞳力愈是暴烈觉醒\", detail: \"写轮眼的进阶机制将精神创伤与战力暴涨深度绑定，使‘守护人间温情’与‘追逐至高伟力’在感知中演化为了不可兼得的残酷悖论。\" }\n        ]\n      };\n      var inheritanceState = readState(\"inheritance-map:v1\", []);\n      if (!Array.isArray(inheritanceState)) inheritanceState = [];\n\n      function renderInheritance() {\n        [\"naruto\", \"sasuke\"].forEach(function (person) {\n          var container = document.getElementById(person + \"-inheritance\");\n          container.innerHTML = \"\";\n          inheritances[person].forEach(function (item) {\n            var button = document.createElement(\"button\");\n            button.type = \"button\";\n            button.className = \"inheritance-item\";\n            button.setAttribute(\"aria-pressed\", inheritanceState.indexOf(item.id) !== -1 ? \"true\" : \"false\");\n            var title = document.createElement(\"strong\"); title.textContent = item.title;\n            var short = document.createElement(\"span\"); short.textContent = item.short;\n            button.append(title, short);\n            button.addEventListener(\"click\", function () {\n              var index = inheritanceState.indexOf(item.id);\n              if (index === -1) inheritanceState.push(item.id); else inheritanceState.splice(index, 1);\n              writeState(\"inheritance-map:v1\", inheritanceState);\n              renderInheritance();\n              showInheritance(item);\n            });\n            container.appendChild(button);\n          });\n        });\n        var result = document.getElementById(\"inheritance-result\");\n        if (inheritanceState.length === 0) result.textContent = \"尚未激活任何历史负重。请点击上方条目，审视上一代的政治遗恨如何深刻锚定二人的命运起点。\";\n        else if (inheritanceState.length === 6) result.textContent = \"六项历史负重全部点亮：两人的个性固然鲜明，但其人生的起跑线早已被九尾之乱、高层维稳与灭族惨案等宏大历史结构深深烙印。\";\n        else {\n          var selectedItems = inheritances.naruto.concat(inheritances.sasuke).filter(function (item) { return inheritanceState.indexOf(item.id) !== -1; });\n          result.textContent = \"已激活 \" + inheritanceState.length + \" 项。最近审视的因果线索：\" + selectedItems[selectedItems.length - 1].detail;\n        }\n      }\n\n      function showInheritance(item) {\n        document.getElementById(\"inheritance-result\").textContent = item.detail;\n      }\n      renderInheritance();\n\n      var priorities = [\n        { id: \"village\", label: \"扑灭内战烽火、保全木叶大局\", initial: 90 },\n        { id: \"clan\", label: \"保全宇智波宗族生命与政治诉求\", initial: 20 },\n        { id: \"sasuke\", label: \"无论如何力保幼弟佐助性命\", initial: 95 }\n      ];\n      var priorityState = readState(\"itachi-ledger:v1\", { village: 90, clan: 20, sasuke: 95 });\n\n      function renderPriorities() {\n        var controls = document.getElementById(\"priority-controls\");\n        controls.innerHTML = \"\";\n        priorities.forEach(function (priority) {\n          var row = document.createElement(\"div\"); row.className = \"priority-control\";\n          var line = document.createElement(\"div\"); line.className = \"priority-line\";\n          var label = document.createElement(\"label\"); label.htmlFor = \"priority-\" + priority.id; label.textContent = priority.label;\n          var output = document.createElement(\"output\"); output.htmlFor = \"priority-\" + priority.id; output.textContent = String(priorityState[priority.id]);\n          var input = document.createElement(\"input\"); input.type = \"range\"; input.id = \"priority-\" + priority.id; input.min = \"0\"; input.max = \"100\"; input.value = String(priorityState[priority.id]);\n          input.addEventListener(\"input\", function () { priorityState[priority.id] = Number(input.value); writeState(\"itachi-ledger:v1\", priorityState); renderPriorities(); });\n          line.append(label, output); row.append(line, input); controls.appendChild(row);\n        });\n        updatePriorityVerdict();\n      }\n\n      function updatePriorityVerdict() {\n        var village = Number(priorityState.village);\n        var clan = Number(priorityState.clan);\n        var sasuke = Number(priorityState.sasuke);\n        var title = document.getElementById(\"priority-verdict\");\n        var explanation = document.getElementById(\"priority-explanation\");\n        var costs = document.getElementById(\"priority-costs\");\n        costs.innerHTML = \"\";\n        var messages = [];\n        if (village > clan + 25) messages.push(\"全族老幼的无辜生命与正当申诉权，被冷酷视作维系大局稳定必须吞下的合理损耗。\");\n        if (clan > village + 25) messages.push(\"政变可能引发的焦土内战与列国入侵风险，被全盘转嫁给了千千万万的木叶平民。\");\n        if (sasuke > clan + 25) messages.push(\"对佐助一人的拼死保全，与对其余无辜同胞的断然舍弃，构成了惨绝人寰的伦理悖论。\");\n        if (sasuke \u003c 35) messages.push(\"佐助失去了鼬在深渊中唯一坚守的人性底线，‘一切皆为保护弟弟’的悲剧自洽彻底瓦解。\");\n        if (messages.length === 0) messages.push(\"三大目标在表面上维持着微妙平衡，然而现实中却始终未曾诞生足以兼顾谈判、解除武装并制衡团藏的第三方政治力量。\");\n        title.textContent = Math.max(village, clan, sasuke) - Math.min(village, clan, sasuke) > 45 ? \"绝对化的单一目标正在吞噬其他价值\" : \"兼顾多方愿景并不等于握有可行解法\";\n        explanation.textContent = \"调节刻度能让鼬的内心权衡清晰显形，但当时真正缺失的战略变量，是充裕的斡旋时间、族群互信以及能够强力制约团藏极权特权的政治体制。\";\n        messages.forEach(function (message) { var item = document.createElement(\"li\"); item.textContent = message.trim(); costs.appendChild(item); });\n      }\n      renderPriorities();\n\n      var cases = [\n        {\n          scene: \"波之国死斗：白之千本射向鸣人的刹那，佐助身体先于思考挺身挡下攻击，甚至抱定了必死觉悟。\",\n          title: \"这一经典幕后，最深刻地揭示了什么？\",\n          options: [\"佐助在此刻已然彻底放下家仇，一心只想长留第七班度过余生。\", \"真实的同袍羁绊已悄然越过冷血的复仇规训，在潜意识层面驱动了舍命守护的本能。\", \"佐助早已精确计算过白的飞针绝无可能危及自身性命。\"],\n          answer: 1,\n          feedback: [\"佐助在此后依然将复仇奉为终极使命；此幕印证着温情羁绊与复仇执念正在其心房剧烈撕扯拉锯。\", \"解析正确：‘身体先动’雄辩地证明鸣人已不再是无关紧要的旁人，这亦深刻解释了往后斩断这根羁绊为何需要动用如此暴烈的决绝。\", \"战场瞬息万变，生死悬于一线；佐助在当时纯粹是出于甘愿赴死的守护本能。\"]\n        },\n        {\n          scene: \"长兄重临木叶：佐助竭力迎战却遭鼬绝对碾压，并再次被迫在月读极刑中重温灭族惨状。\",\n          title: \"为何这场惨败会成为促使佐助毅然决绝叛逃木叶的致命催化剂？\",\n          options: [\"他将自身的战力停滞，痛苦归咎于沉溺于木叶的同伴温情导致仇恨不再纯粹。\", \"木叶高层在此战后已正式签署公文勒令佐助投奔大蛇丸。\", \"他在遭受幻术重创后，彻底丧失了与第七班共同经历的全部记忆。\"],\n          answer: 0,\n          feedback: [\"解析正确：鼬的冷酷毒打重新焊死了‘唯有仇恨愈纯、力量方能愈强’的复仇铁轨，佐助由此将第七班的新羁绊视作腐蚀复仇意志的致命毒药。\", \"木叶绝无此类荒谬密令；佐助的出走是公然背叛村落体制的极端个人决断。\", \"记忆从未消退；正因为第七班的情谊真实且刻骨铭心，它才沦为了佐助必须挥刀斩断的痛苦障碍。\"]\n        },\n        {\n          scene: \"终结之谷初决：佐助由衷承认鸣人是自己唯一的挚友，却在胜负已分的最后关头硬生生收刀留情。\",\n          title: \"这道令人扼腕的结局，为佐助后续的人生轨迹留下了怎样的关键裂隙？\",\n          options: [\"佐助内心已经悔悟并同意随鸣人返村，仅仅是在原地静候鸣人苏醒。\", \"佐助在灵魂深处全盘屈从并贯彻了鼬所设定的弑友夺眼复仇法门。\", \"佐助毅然决然选择与木叶决裂，却在力量获取途径上完成了对长兄残酷脚本的首次抗争。\"],\n          answer: 2,\n          feedback: [\"佐助最终依然孤身步入雨幕投奔大蛇丸，断然回绝了木叶的挽留。\", \"若全盘屈从，他必将在千鸟贯胸后夺取鸣人性命以觉醒万花筒写轮眼；然而他断然回绝了这一血腥途径。\", \"解析正确：他在地缘与生活空间上斩断了与木叶的瓜葛，却在行动伦理上悍然拒绝了长兄为他设定的弑友脚本，保留了最后的傲骨。\"]\n        }\n      ];\n      var caseState = readState(\"bond-lab:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(caseState.current)) caseState.current = 0;\n      caseState.current = clampIndex(caseState.current, cases.length);\n      caseState.answers = caseState.answers || {};\n      caseState.skipped = Array.isArray(caseState.skipped) ? caseState.skipped : [];\n\n      function saveCases() { writeState(\"bond-lab:v1\", caseState); }\n      function goToCase(index) { caseState.current = clampIndex(index, cases.length); saveCases(); renderCases(); }\n      function answerCase(caseIndex, optionIndex) { caseState.answers[caseIndex] = optionIndex; caseState.skipped = caseState.skipped.filter(function (index) { return index !== caseIndex; }); saveCases(); renderCases(); }\n      function skipCase() { var current = caseState.current; if (!Object.prototype.hasOwnProperty.call(caseState.answers, current) && caseState.skipped.indexOf(current) === -1) caseState.skipped.push(current); caseState.current = current \u003c cases.length - 1 ? current + 1 : 0; saveCases(); renderCases(); }\n      function renderCases() {\n        var tabs = document.getElementById(\"case-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"case-panels\"); panels.innerHTML = \"\";\n        cases.forEach(function (item, caseIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"step-tab\";\n          if (Object.prototype.hasOwnProperty.call(caseState.answers, caseIndex)) tab.classList.add(\"answered\");\n          if (caseState.skipped.indexOf(caseIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", caseIndex === caseState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"case-\" + caseIndex); tab.textContent = \"场景 \" + (caseIndex + 1); tab.addEventListener(\"click\", function () { goToCase(caseIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"case-\" + caseIndex; panel.className = \"case-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = caseIndex !== caseState.current;\n          var count = document.createElement(\"div\"); count.className = \"step-count\"; count.textContent = \"场景 \" + (caseIndex + 1) + \" / \" + cases.length;\n          var scene = document.createElement(\"p\"); scene.className = \"case-scene\"; scene.textContent = item.scene;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = item.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          item.options.forEach(function (optionText, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"case-\" + caseIndex; input.value = String(optionIndex); input.checked = Number(caseState.answers[caseIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerCase(caseIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.textContent = optionText; label.append(input, text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = caseState.answers[caseIndex];\n          if (selected === undefined) feedback.textContent = caseState.skipped.indexOf(caseIndex) !== -1 ? \"这一幕已暂时跳过。你可以随时回来。\" : \"选出能够同时解释行动和人物矛盾的一项。\";\n          else { var correct = Number(selected) === item.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = item.feedback[Number(selected)]; }\n          panel.append(count, scene, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"case-prev\").disabled = caseState.current === 0;\n        document.getElementById(\"case-next\").textContent = caseState.current === cases.length - 1 ? \"回到第一幕 ↺\" : \"下一幕 →\";\n      }\n      document.getElementById(\"case-prev\").addEventListener(\"click\", function () { goToCase(caseState.current - 1); });\n      document.getElementById(\"case-next\").addEventListener(\"click\", function () { goToCase(caseState.current === cases.length - 1 ? 0 : caseState.current + 1); });\n      document.getElementById(\"case-skip\").addEventListener(\"click\", skipCase);\n      renderCases();\n\n      var questions = [\n        { title: \"何以断定鸣人与佐助乃是同一部体制绞肉机所碾碎的两名遗孤？\", options: [{ text: \"九尾之乱既导致鸣人沦为丧亲且饱受排斥的人柱力，亦直接激化了木叶对宇智波的政治猜忌，最终引爆政变与灭族惨案。\", help: \"寻找能将两人悲剧源头无缝贯通起来的核心历史枢纽。\" }, { text: \"两人在血缘上实为同胞亲兄弟，战乱中被分别送往不同家庭收养。\", help: \"两人分属漩涡一族与宇智波一族，绝无血亲同胞关系。\" }, { text: \"两人皆是在同一天惨遭大蛇丸的野心突袭而导致家破人亡。\", help: \"大蛇丸并非九尾之乱与宇智波灭族惨案的直接始作俑者。\" }], answer: 0, feedback: [\"解析正确：带土的暗中突袭、村落的戒备隔离、宇智波的政变决意与高层的灭门清算，共同构成了环环相扣、不可分割的因果死锁。\", \"两人虽为同窗至交，但在血统上并无直接亲兄弟关系。\", \"两人的遗孤命运形成于不同的历史节点，大蛇丸在后来的介入，仅仅是趁虚利用了佐助既有的心理创伤。\"] },\n        { title: \"如何精准审视宇智波鼬，方能兼顾历史重压与伦理道义责任？\", options: [{ text: \"只要出发点是避免天下大乱，采取灭绝宗族老幼的手段便天然具备绝对正当性。\", help: \"崇高的宏观政治目标，绝无法自动洗白极权杀戮手段与惨烈代价分配的不公。\" }, { text: \"既正视团藏等人对战略选项的极限挤压，亦不回避鼬主动做出的极端妥协及其对全族与佐助造成的毁灭性伤害。\", help: \"必须将动机的悲壮、环境的压迫与后果的转嫁进行严密的辩证拆解。\" }, { text: \"鼬毫无任何宏观顾虑，纯粹出于嗜血变态的心理享受灭族快感。\", help: \"此论完全无法解释其对佐助舍命庇护、甘负万世骂名并暗中监视晓组织的诸多壮举。\" }], answer: 1, feedback: [\"避免战祸固然是大义，但绝不能以此将惨遭灭顶的无辜同胞直接轻蔑地降格为‘理所应当的损耗代价’。\", \"解析正确：洞察结构性重压的逼仄，绝不意味着取消行为主体在伦理上的裁量责任，更不该漠视受害者的斑斑血泪。\", \"这种扁平定论彻底抹杀了鼬内心复杂的家国撕裂，亦无法解释整部作品所展现的深沉悲剧力量。\"] },\n        { title: \"在佐助叛离木叶前夕，第七班真实的温暖情谊为何反倒沦为了复仇的障碍？\", options: [{ text: \"因为第七班上下自始至终皆在虚情假意地敷衍利用他。\", help: \"波之国的舍身挡针与中忍考试的生死与共，早已筑牢了无可辩驳的真实深情。\" }, { text: \"因为新的情感归宿赋予了佐助拥抱崭新人生的可能，从而直接撼动并威胁了鼬为他设定的‘唯有复仇方具意义’的单一身份认同。\", help: \"唯有当温情羁绊已然强大到足以动摇复仇意志时，‘挥刀断情’方才具备心理必要性。\" }, { text: \"因为忍者法则规定，一旦内心萌生友谊，写轮眼瞳力便会永久退化消逝。\", help: \"原作中绝无此类机制设定，羁绊的冲突纯粹源于力量伦理与身份坐标的撕裂。\" }], answer: 1, feedback: [\"第七班的深情绝非虚妄；恰恰因为这份温情无比真实，佐助才感到自己的复仇磐石正在发生致命动摇。\", \"解析正确：羁绊点亮了拥抱光明的微光，却也与兄长强加的复仇铁轨发生激烈对撞，迫使佐助为了维持复仇者的纯粹而残忍斩断温情。\", \"写轮眼绝不会因友谊而退化，冲突的本质在于佐助如何定义‘力量与仇恨’的内在逻辑。\"] },\n        { title: \"终结之谷初次决斗之后，鸣人与佐助各自抉择的道路有着怎样本质的分野？\", options: [{ text: \"鸣人从此彻底鄙弃对力量的追求，而佐助则成为唯力量是从的信徒。\", help: \"鸣人随即毅然拜自来也为师踏上苦修，同样在全力以赴锤炼卓越伟力。\" }, { text: \"鸣人追逐力量旨在获得‘承担永不放弃羁绊之重’的能力，佐助追逐力量则旨在‘彻底摆脱一切羁绊的掣肘与软肋’。\", help: \"两人皆在狂热提升战力，根本差异在于力量究竟是为守护羁绊服务，还是为斩断羁绊服务。\" }, { text: \"鸣人此时已洞悉了宇智波灭族的全部政治内幕，而佐助依然被蒙在鼓里。\", help: \"在第一次终结之谷大战时期，两人皆未曾知晓灭族惨案背后高层决策的全部真相。\" }], answer: 1, feedback: [\"鸣人从未放弃对伟力的追求，他追随自来也展开三年苦修，正是为了获得守护羁绊的绝对实力。\", \"解析正确：分水岭绝非‘要不要力量’，而是‘伟力究竟该为守护羁绊所用，还是为斩断一切羁绊、追求绝对冷酷所用’。\", \"在第一部终结之谷阶段，灭族血夜的复杂政治内幕对两个少年而言依然是一团未解的迷雾。\"] }\n      ];\n      var quizState = readState(\"quiz:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(quizState.current)) quizState.current = 0;\n      quizState.current = clampIndex(quizState.current, questions.length);\n      quizState.answers = quizState.answers || {};\n      quizState.skipped = Array.isArray(quizState.skipped) ? quizState.skipped : [];\n\n      function saveQuiz() { writeState(\"quiz:v1\", quizState); }\n      function goToQuestion(index) { quizState.current = clampIndex(index, questions.length); saveQuiz(); renderQuiz(); }\n      function answerQuestion(questionIndex, optionIndex) { quizState.answers[questionIndex] = optionIndex; quizState.skipped = quizState.skipped.filter(function (index) { return index !== questionIndex; }); saveQuiz(); renderQuiz(); }\n      function skipQuestion() { var current = quizState.current; if (!Object.prototype.hasOwnProperty.call(quizState.answers, current) && quizState.skipped.indexOf(current) === -1) quizState.skipped.push(current); quizState.current = current \u003c questions.length - 1 ? current + 1 : 0; saveQuiz(); renderQuiz(); }\n      function renderQuiz() {\n        var tabs = document.getElementById(\"quiz-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"quiz-panels\"); panels.innerHTML = \"\";\n        questions.forEach(function (question, questionIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"quiz-tab\";\n          if (Object.prototype.hasOwnProperty.call(quizState.answers, questionIndex)) tab.classList.add(\"answered\");\n          if (quizState.skipped.indexOf(questionIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", questionIndex === quizState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"question-\" + questionIndex); tab.textContent = String(questionIndex + 1); tab.addEventListener(\"click\", function () { goToQuestion(questionIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"question-\" + questionIndex; panel.className = \"question-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = questionIndex !== quizState.current;\n          var count = document.createElement(\"div\"); count.className = \"question-count\"; count.textContent = \"问题 \" + (questionIndex + 1) + \" / \" + questions.length;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = question.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          question.options.forEach(function (choice, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"question-\" + questionIndex; input.value = String(optionIndex); input.checked = Number(quizState.answers[questionIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerQuestion(questionIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.appendChild(document.createTextNode(choice.text + \" \"));\n            var help = document.createElement(\"span\"); help.className = \"term\"; help.tabIndex = 0; help.textContent = \"概念提示\";\n            var tooltip = document.createElement(\"span\"); tooltip.className = \"tooltip\"; tooltip.setAttribute(\"role\", \"tooltip\"); tooltip.textContent = choice.help; help.appendChild(tooltip); text.appendChild(help); label.append(input, text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = quizState.answers[questionIndex];\n          if (selected === undefined) feedback.textContent = quizState.skipped.indexOf(questionIndex) !== -1 ? \"这题已暂时跳过。你可以随时回来。\" : \"选择后会立即看到解释；也可以先查看选项后的概念提示。\";\n          else { var correct = Number(selected) === question.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = question.feedback[Number(selected)]; }\n          panel.append(count, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"quiz-prev\").disabled = quizState.current === 0;\n        document.getElementById(\"quiz-next\").textContent = quizState.current === questions.length - 1 ? \"回到第一题 ↺\" : \"下一题 →\";\n      }\n      document.getElementById(\"quiz-prev\").addEventListener(\"click\", function () { goToQuestion(quizState.current - 1); });\n      document.getElementById(\"quiz-next\").addEventListener(\"click\", function () { goToQuestion(quizState.current === questions.length - 1 ? 0 : quizState.current + 1); });\n      document.getElementById(\"quiz-skip\").addEventListener(\"click\", skipQuestion);\n      renderQuiz();\n    }());\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session5.html","basePath":"session5.html","lang":"zh-CN","kind":"lesson","title":"忍界大战的和平检验","translations":{"zh-CN":"session5.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"忍界大战的和平检验\">\n  \u003ctitle>忍界大战：所有和平方案在同一战场上接受检验｜《火影忍者》主线重构\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f6f1e7;\n      --paper-deep: #ebe1cf;\n      --ink: #292721;\n      --muted: #6c665b;\n      --accent: #9a4938;\n      --accent-dark: #713528;\n      --accent-soft: #ead3c8;\n      --sage: #66745c;\n      --sage-soft: #dfe4d8;\n      --gold: #a9782e;\n      --gold-soft: #eee1c1;\n      --blue: #5e7180;\n      --blue-soft: #dfe6e8;\n      --night: #454758;\n      --night-soft: #e1e0e7;\n      --line: #d8ccba;\n      --card: rgba(255, 253, 248, 0.8);\n      --white: #fffdf8;\n      --shadow: 0 16px 44px rgba(71, 52, 33, 0.08);\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; background: var(--paper); }\n    body {\n      margin: 0;\n      color: var(--ink);\n      background: radial-gradient(circle at 15% 0%, rgba(255,255,255,.76), transparent 32rem), var(--paper);\n      font-family: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", Georgia, serif;\n      font-size: 18px;\n      line-height: 1.72;\n    }\n\n    button, input { font: inherit; }\n    button { color: inherit; }\n    a { color: var(--accent-dark); text-underline-offset: .18em; }\n    .content { width: min(100% - 3rem, 88ch); max-width: 88ch; margin: 0 auto; padding: 2rem 0 6rem; }\n    html[data-studio-width=\"wide\"] .content { max-width: 104ch; }\n    html[data-studio-width=\"full\"] .content { max-width: 100%; }\n    html[data-studio-width=\"full\"] .prose,\n    html[data-studio-width=\"full\"] .lesson-header,\n    html[data-studio-width=\"full\"] .lesson-footer { width: min(100% - 3rem, 78ch); margin-inline: auto; }\n\n    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 1.5rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .82rem; }\n    .topbar-links { display: flex; flex-wrap: wrap; gap: 1rem; }\n    .topbar a { color: var(--muted); text-decoration: none; }\n    .topbar a:hover { color: var(--accent); }\n    .lesson-count { color: var(--muted); letter-spacing: .06em; }\n    .lesson-header { padding: 3.4rem 0 3rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }\n    .eyebrow { margin: 0 0 .8rem; color: var(--accent); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; font-weight: 750; letter-spacing: .14em; }\n    h1, h2, h3 { line-height: 1.26; text-wrap: balance; }\n    h1 { max-width: 14em; margin: 0; font-size: clamp(2.35rem, 6vw, 4.6rem); font-weight: 650; letter-spacing: -.035em; }\n    h2 { margin: 4.5rem 0 1.2rem; font-size: clamp(1.7rem, 3vw, 2.3rem); }\n    h3 { margin: 1.8rem 0 .6rem; font-size: 1.2rem; }\n    p { margin: .9rem 0; }\n    ul { padding-left: 1.25rem; }\n    li + li { margin-top: .5rem; }\n    section { scroll-margin-top: 1.5rem; }\n    .lede { max-width: 49rem; margin: 1.4rem 0 0; color: var(--muted); font-size: 1.12rem; }\n    .lesson-meta { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8rem; }\n    .lesson-meta span { padding: .28rem .66rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,253,248,.52); }\n    .opening-question { margin: 2.2rem 0 0; padding: 1.25rem 1.45rem; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 1.08rem; }\n    .learning-goals { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1px; margin: 2.2rem 0 0; overflow: hidden; border: 1px solid var(--line); border-radius: .8rem; background: var(--line); }\n    .goal { padding: 1rem 1.1rem; background: var(--card); }\n    .goal strong { display: block; color: var(--accent); font-size: 1.25rem; }\n    .goal span { color: var(--muted); font-size: .88rem; }\n\n    .term { position: relative; display: inline-block; border-bottom: 1px dotted var(--accent); color: var(--accent-dark); cursor: help; outline: none; }\n    .term:focus-visible { border-radius: .2rem; box-shadow: 0 0 0 3px var(--accent-soft); }\n    .tooltip { position: absolute; z-index: 30; left: 50%; bottom: calc(100% + .65rem); width: min(21rem, 75vw); padding: .75rem .85rem; border: 1px solid var(--line); border-radius: .6rem; color: var(--ink); background: var(--white); box-shadow: var(--shadow); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; font-weight: 400; line-height: 1.5; opacity: 0; pointer-events: none; transform: translate(-50%, .3rem); transition: opacity 160ms ease, transform 160ms ease; }\n    .term:hover .tooltip, .term:focus .tooltip { opacity: 1; transform: translate(-50%, 0); }\n    .key-point, .canon-note { margin: 1.7rem 0; padding: 1.1rem 1.25rem; border-radius: .7rem; background: var(--sage-soft); }\n    .key-point strong, .canon-note strong { color: #46503f; }\n    .warning-note { margin: 1.7rem 0; padding: 1.1rem 1.25rem; border-left: 4px solid var(--gold); background: var(--gold-soft); }\n\n    .story-line { position: relative; margin: 2rem 0; padding-left: 2.2rem; }\n    .story-line::before { content: \"\"; position: absolute; top: .5rem; bottom: .5rem; left: .55rem; width: 2px; background: var(--line); }\n    .story-event { position: relative; padding: 0 0 1.55rem; }\n    .story-event:last-child { padding-bottom: 0; }\n    .story-event::before { content: \"\"; position: absolute; top: .48rem; left: -2rem; width: .72rem; height: .72rem; border: 3px solid var(--paper); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }\n    .story-event h3 { margin: 0; font-size: 1.05rem; }\n    .story-event p { margin: .35rem 0 0; color: var(--muted); }\n\n    .thesis-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1rem; margin: 1.8rem 0; }\n    .thesis-card { padding: 1.2rem; border: 1px solid var(--line); border-radius: .8rem; background: var(--card); }\n    .thesis-card:nth-child(1) { border-top: 4px solid var(--sage); }\n    .thesis-card:nth-child(2) { border-top: 4px solid var(--night); }\n    .thesis-card:nth-child(3) { border-top: 4px solid var(--accent); }\n    .thesis-card h3 { margin-top: 0; }\n    .thesis-card p { color: var(--muted); font-size: .9rem; }\n    .test-label { display: inline-block; margin-top: .35rem; padding: .16rem .5rem; border-radius: 999px; color: var(--muted); background: var(--paper-deep); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .75rem; }\n\n    .lab { margin: 2.5rem 0; padding: clamp(1.1rem, 3vw, 1.8rem); border: 1px solid var(--line); border-radius: 1rem; background: var(--card); box-shadow: var(--shadow); }\n    .lab-head { display: flex; align-items: start; justify-content: space-between; gap: 1rem; margin-bottom: 1.3rem; }\n    .lab-head h2, .lab-head h3 { margin: 0; }\n    .lab-head p { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }\n    .lab-label { flex: 0 0 auto; padding: .22rem .55rem; border-radius: 999px; color: var(--accent-dark); background: var(--accent-soft); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .72rem; font-weight: 700; }\n    .button { padding: .55rem .9rem; border: 1px solid var(--line); border-radius: .55rem; color: inherit; background: var(--white); cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; font-weight: 650; }\n    .button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }\n    .button.primary { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .button.primary:hover:not(:disabled) { color: var(--white); background: var(--accent-dark); }\n    .button:disabled { opacity: .35; cursor: default; }\n    .lab-nav, .lab-nav-group { display: flex; flex-wrap: wrap; gap: .55rem; }\n    .lab-nav { justify-content: space-between; margin-top: 1rem; }\n\n    .alliance-meter { height: .75rem; overflow: hidden; border-radius: 999px; background: var(--paper-deep); }\n    .alliance-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--sage)); transition: width 220ms ease; }\n    .alliance-status { display: flex; justify-content: space-between; gap: 1rem; margin: .45rem 0 1rem; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8rem; }\n    .alliance-actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .7rem; }\n    .alliance-action { padding: .85rem .9rem; border: 1px solid var(--line); border-radius: .65rem; text-align: left; background: var(--white); cursor: pointer; }\n    .alliance-action:hover { border-color: var(--sage); }\n    .alliance-action[aria-pressed=\"true\"] { border-color: var(--sage); background: var(--sage-soft); }\n    .alliance-action strong { display: block; }\n    .alliance-action span { display: block; margin-top: .2rem; color: var(--muted); font-size: .82rem; }\n    .alliance-result { min-height: 5rem; margin-top: 1rem; padding: .9rem 1rem; border-radius: .65rem; color: var(--muted); background: var(--paper-deep); font-size: .9rem; }\n\n    .choice-layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(17rem,.85fr); gap: 1.2rem; }\n    .value-control + .value-control { margin-top: 1rem; }\n    .value-line { display: flex; justify-content: space-between; gap: 1rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .86rem; }\n    .value-line output { color: var(--accent-dark); font-weight: 750; }\n    .value-control input { width: 100%; accent-color: var(--accent); }\n    .choice-result { padding: 1rem 1.1rem; border-radius: .75rem; background: var(--paper-deep); }\n    .choice-result h3 { margin: 0 0 .7rem; }\n    .choice-result p { color: var(--muted); font-size: .9rem; }\n    .value-cost { margin: .8rem 0 0; padding-top: .7rem; border-top: 1px solid var(--line); color: var(--accent-dark); font-size: .88rem; }\n\n    .step-tabs, .quiz-tabs { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.25rem; }\n    .step-tab, .quiz-tab { min-width: 2.35rem; padding: .38rem .7rem; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8rem; }\n    .step-tab[aria-selected=\"true\"], .quiz-tab[aria-selected=\"true\"] { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .step-tab.answered:not([aria-selected=\"true\"]), .quiz-tab.answered:not([aria-selected=\"true\"]) { border-color: var(--sage); color: #46503f; background: var(--sage-soft); }\n    .step-tab.skipped:not([aria-selected=\"true\"]), .quiz-tab.skipped:not([aria-selected=\"true\"]) { border-style: dashed; }\n    .case-panel[hidden], .question-panel[hidden] { display: none; }\n    .step-count, .question-count { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; }\n    .case-scene { margin: .55rem 0 1rem; padding: 1rem 1.1rem; border-left: 4px solid var(--blue); background: var(--blue-soft); font-size: 1.02rem; }\n    .question-title { margin: .35rem 0 1rem; font-size: 1.14rem; }\n    .options { display: grid; gap: .65rem; }\n    .option { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; padding: .8rem .9rem; border: 1px solid var(--line); border-radius: .65rem; background: var(--white); cursor: pointer; }\n    .option:hover { border-color: var(--accent); }\n    .option:has(input:checked) { border-color: var(--accent); background: #fbf0eb; }\n    .option input { margin-top: .35rem; accent-color: var(--accent); }\n    .option-text { line-height: 1.5; }\n    .answer-feedback { min-height: 4.7rem; margin-top: .85rem; padding: .85rem 1rem; border-radius: .65rem; color: var(--muted); background: var(--paper-deep); font-size: .9rem; }\n    .answer-feedback.correct { color: #365d3a; background: var(--sage-soft); }\n    .answer-feedback.incorrect { color: var(--accent-dark); background: var(--accent-soft); }\n\n    .lesson-footer { margin-top: 4.5rem; padding-top: 2rem; border-top: 1px solid var(--line); }\n    .takeaway { padding: 1.4rem 1.5rem; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 1.05rem; }\n    .next-lesson { margin-top: 2rem; color: var(--muted); }\n    .next-lesson strong { display: block; color: var(--ink); font-size: 1.1rem; }\n\n    @media (max-width: 760px) {\n      body { font-size: 16px; }\n      .content { width: min(100% - 2rem, 88ch); padding-top: 1.2rem; }\n      .learning-goals, .thesis-grid, .alliance-actions, .choice-layout { grid-template-columns: 1fr; }\n      .tooltip { position: fixed; inset: auto 1rem 1rem; width: auto; transform: translateY(.3rem); }\n      .term:hover .tooltip, .term:focus .tooltip { transform: translateY(0); }\n      .lab-head { display: block; }\n      .lab-label { display: inline-block; margin-top: .6rem; }\n      .lab-nav { flex-direction: column; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      html { scroll-behavior: auto; }\n      .tooltip, .alliance-fill { transition: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cnav class=\"topbar\" aria-label=\"课程导航\">\n      \u003cdiv class=\"topbar-links\">\u003ca href=\"session4.html\">← 上一讲\u003c/a>\u003ca href=\"syllabus.html\">课程大纲\u003c/a>\u003c/div>\n      \u003cspan class=\"lesson-count\">第 5 讲 / 共 7 讲\u003c/span>\n    \u003c/nav>\n\n    \u003cheader class=\"lesson-header\">\n      \u003cp class=\"eyebrow\">第五讲 · 压力测试\u003c/p>\n      \u003ch1>忍界大战\u003c/h1>\n      \u003cp class=\"lede\">大战的终极命题绝非单纯聚焦于联军能否在物理战力上击溃十尾，而在于此前各方探索的每一种和平范式，都被迫在同一片焦土上接受最严苛的生死拷问：五大忍村能否将根深蒂固的历史猜忌转化为休戚与共的协同实体？带土能否以残酷事实论证“真实羁绊唯有导向绝望”？斑能否借无限月读构建出永无痛楚的极权乌托邦？而鸣人，又能否在誓死捍卫每个人自由意志的前提下，唤醒素昧平生的众生共同担荷现实的残缺？\u003c/p>\n      \u003cdiv class=\"lesson-meta\" aria-label=\"本课信息\">\u003cspan>约 30 分钟\u003c/span>\u003cspan>大战与政治哲学\u003c/span>\u003cspan>关键转折\u003c/span>\u003c/div>\n      \u003cblockquote class=\"opening-question\">带着一个问题出发：若一个由救世主编织的世界确实能让每个人永享极乐定制幻梦，代价却是彻底剥夺所有人的清醒意志与选择权利——这究竟是终极的和平救赎，还是一座永无痛感的意识牢笼？\u003c/blockquote>\n      \u003cdiv class=\"learning-goals\" aria-label=\"学习目标\">\n        \u003cdiv class=\"goal\">\u003cstrong>01\u003c/strong>\u003cspan>从纷繁战局中提炼决定忍界命运走向的七次范式转折\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>02\u003c/strong>\u003cspan>辩证剖析联军、带土与斑三种和平方案所承担与转嫁的深层代价\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>03\u003c/strong>\u003cspan>洞悉辉夜复活与黑绝操弄何以未能豁免历史人物的主体伦理责任\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"war-thesis\">\n        \u003ch2 id=\"war-thesis\">开篇立论：席卷战场的绝非单纯的军力，而是三套关于人性与救赎的终极审判\u003c/h2>\n        \u003cp>在总体战爆发之前，五大忍村本质上仍是一群相互戒备、血债累累且深陷地缘猜忌的军事封建共同体。它们破天荒地结成\u003cspan class=\"term\" tabindex=\"0\">忍者联军\u003cspan class=\"tooltip\" role=\"tooltip\">五大忍村与铁之国武士为抗衡‘晓’而结成的空前军事共同体。其划时代意义不仅在于战力整合，更在于昔日宿敌破天荒地共享情报、指挥中枢与生死风险。\u003c/span>\u003c/span>，绝非因为百年仇恨在一夕之间消弭，而是因为十尾与无限月读所构成的灭顶之灾，制造了没有任何单一村落能够独善其身的绝对共同命运。\u003c/p>\n        \u003cp>同一时刻，带土与斑却将这一生死绝境推导至极端的虚无主义结论：既然真实人间总会将爱异化为失去、将结盟堕落为背叛，最彻底的救赎便绝非艰难修补千疮百孔的脆弱关系，而是从形而上层面彻底抹杀彼此伤害的现实土壤。三种截然对立的和平构想，由此在焦土之上迎来了正面交锋：\u003c/p>\n        \u003cdiv class=\"thesis-grid\">\n          \u003carticle class=\"thesis-card\">\u003ch3>联军方案：在残缺现实中构筑协作共同体\u003c/h3>\u003cp>正视历史积怨与地缘分歧，通过共同规则、风险分担与舍命互援，在苦难中淬炼出前所未有的信任纽带。\u003c/p>\u003cspan class=\"test-label\">保留自由意志，亦直面受挫风险\u003c/span>\u003c/article>\n          \u003carticle class=\"thesis-card\">\u003ch3>带土方案：以绝对虚无宣判人世死刑的逃避幻梦\u003c/h3>\u003cp>认定现实人格已被创伤彻底掏空，企图以量身定制的无痛幻梦，强行终结生离死别与爱恨交织的残酷循环。\u003c/p>\u003cspan class=\"test-label\">消除切肤之痛，却剥夺了清醒同意\u003c/span>\u003c/article>\n          \u003carticle class=\"thesis-card\">\u003ch3>斑之方案：以绝对神权垄断终极真理的极权救赎\u003c/h3>\u003cp>将个人意志升华为人类唯一的正义答案，以碾压性伟力抹杀一切不确定性，构筑无需互信的永恒冷酷秩序。\u003c/p>\u003cspan class=\"test-label\">消灭地缘冲突，亦消解了政治主体\u003c/span>\u003c/article>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>核心批判尺度：\u003c/strong>切勿仅以“能否停止杀戮”这一功利表象衡量秩序的合法性，更要深层拷问：究竟由谁来垄断幸福的定义？惨烈的隐形代价由谁背负？众生是否依然保有说“不”的自由？一套唯有在所有人丧失主体意志后方能维系的秩序，终结的只是地缘冲突的表象，扼杀的却是人性本身。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"war-timeline\">\n        \u003ch2 id=\"war-timeline\">编年剖析：从危机联盟到第七班封印查克拉始祖的七次转折\u003c/h2>\n        \u003cdiv class=\"story-line\" aria-label=\"第四次忍界大战关键时间线\">\n          \u003carticle class=\"story-event\">\u003ch3>一｜五影让渡部分主权，忍者联军破天荒成形\u003c/h3>\u003cp>四代目雷影出任联军最高统帅，各村打破固有建制编入混合战团；药师兜借\u003cspan class=\"term\" tabindex=\"0\">秽土转生\u003cspan class=\"tooltip\" role=\"tooltip\">召回亡者灵魂并拘禁于不灭躯体的禁忌通灵术。它将先烈的威名、战力乃至未解创伤，冷酷转化为可无限损耗的战争燃料。\u003c/span>\u003c/span>唤醒历代英豪，逼迫生者直面尚未化解的历史血债。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>二｜旧日亡灵拒绝沦为仇恨与争端的消耗品\u003c/h3>\u003cp>我爱罗与生父达成深层和解，再不斩、白与忍刀七人众被跨村协同封印；鼬挣脱符咒反制兜解除术式。秽土转生原本旨在证明死人对活人的永恒诅咒，战场上却接连上演后人重新诠释、安放历史创伤的破局瞬间。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>三｜鸣人将九尾神力从“灾厄污名”重塑为“共有庇护”\u003c/h3>\u003cp>鸣人与九喇嘛彻底超越奴役压制、达成灵魂互信。他将尾兽查克拉化为金色战袍分覆全军，为素昧平生的异村忍者抵御十尾的毁灭轰击。曾被全村视为灾厄梦魇的“人柱力兵器”，在此升华为跨越地缘边界的公共守护之盾。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>四｜宁次战死：带土将绝望逻辑推至伦理极峰\u003c/h3>\u003cp>带土企图借宁次的惨烈牺牲摧毁鸣人的守护意志：羁绊愈深，失去便愈痛彻心扉，放弃现实方是止痛解脱的唯一坦途。雏田的当头棒喝唤醒鸣人：宁次的赴死绝非羁绊虚妄的明证，生者唯有接过其意志并肩前行，方能告慰亡魂。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>五｜带土化身十尾人柱力，鸣人以“名字”逼其正视灵魂抉择\u003c/h3>\u003cp>在攫取近神之力的狂暴巅峰，带土依然反复逼问鸣人是否会堕入绝望——他急需证明“另一个自己”亦注定臣服于虚无。鸣人绝不替其滔天血债开脱，却一语喝破面具之下依然是那个梦想成为火影的宇智波带土，强行逼其褪去虚无外壳、直面本真的自我责任。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>六｜斑君临天下发动无限月读，极权胜利反噬为空洞废墟\u003c/h3>\u003cp>斑夺得双轮回眼与十尾伟力，傲然发动终极神术\u003cspan class=\"term\" tabindex=\"0\">无限月读\u003cspan class=\"tooltip\" role=\"tooltip\">借由神树花蕾映照月亮的终极催眠幻术。它将全人类束缚于神树茧蛹之中，使众生沉浸于符合各自愿望的极乐幻景，实则单方面剥夺了全体人类的现实存在。\u003c/span>\u003c/span>。天地瞬间归于死寂，然而这份无需任何人理解、协商与守护的“绝对和平”，在降临的瞬间便沦为毫无生机的政治真空。\u003c/p>\u003c/article>\n          \u003carticle class=\"story-event\">\u003ch3>七｜黑绝背刺与始祖重临：第七班以精密协作击碎绝对独占\u003c/h3>\u003cp>黑绝暗算背刺斑，揭穿千年来篡改石碑、诱导因陀罗后裔为辉夜复活铺路的万古阴谋。鸣人、佐助、小樱、卡卡西与带土跨越生死与空间维度默契咬合，终以‘六道·地爆天星’彻底封印辉夜。人世虽从始祖的吞噬中挣脱，却将战后权力何去何从的终极拷问推向了风口浪尖。\u003c/p>\u003c/article>\n        \u003c/div>\n        \u003caside class=\"canon-note\">\u003cstrong>历史叙事的哲学取舍：\u003c/strong>本时间线特意省去繁复的战力单挑与数值博弈，唯独保留那些从根本上重塑“谁与谁能够信任合作、谁有权裁定和平真谛、过去能否禁锢当下”的结构性节点。大战绝非战力排行榜，而是一部关系网络与权力范式激荡重构的宏大史诗。\u003c/aside>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"alliance-lab\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"alliance-lab\">联盟生成器：信任绝非虚妄口号，而是生死交织中沉淀的共同事实\u003c/h2>\u003cp>逐项点亮联军在战场上完成的协作壮举。观察一群宿怨深重的故敌，如何从“危机逼迫下的脆弱停火”，逐步淬炼为“休戚与共的命运共同体”。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">关系实验\u003c/span>\u003c/div>\n      \u003cdiv class=\"alliance-meter\" aria-hidden=\"true\">\u003cdiv id=\"alliance-fill\" class=\"alliance-fill\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"alliance-status\">\u003cspan>猜忌停火\u003c/span>\u003cstrong id=\"alliance-count\">0 / 6\u003c/strong>\u003cspan>行动互信\u003c/span>\u003c/div>\n      \u003cdiv id=\"alliance-actions\" class=\"alliance-actions\">\u003c/div>\n      \u003cdiv id=\"alliance-result\" class=\"alliance-result\" aria-live=\"polite\">\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"naruto-answer\">\n        \u003ch2 id=\"naruto-answer\">鸣人之答：并非狂妄否认失去，而是誓死不让苦难垄断生命的意义\u003c/h2>\n        \u003cp>带土对鸣人的心理围猎精准而狠辣。他不仅在肉体上摧残联军，更在形而上层面无情拷问鸣人的守护承诺：自来也、宁次与千万同胞既已喋血荒野，“绝不放弃同伴”是否终究只是一句无法兑现的狂妄诳语？若人世之爱注定将个体置于至死方休的失去与痛楚之中，坚守羁绊是否等同于自投罗网地拥抱苦难？\u003c/p>\n        \u003cp>鸣人的回应展现了其思想的真正成熟：他从未幼稚地宣称“只要意志坚定便永无伤亡”。宁次已然长眠，现实世界绝不会因热血激情而倒转因果。他所誓死捍卫的是：死者赴死究竟具备何种历史意义，绝不容许由制造屠杀的凶手单方面垄断裁决。宁次为守护同伴舍生取义，绝非带土论证“羁绊虚妄”的战利品；当鸣人、雏田与联军将士咬紧牙关传递查克拉、并肩抵御十尾暴虐时，他们已将宁次的生命意志接引进了崭新的守护长河。\u003c/p>\n        \u003cp>这正是鸣人与九喇嘛关系破冰的划时代政治意涵。昔日忍村体制皆将尾兽视作冷酷封印的战略核威慑；鸣人唯有首先承认九喇嘛作为独立个体的姓名、创伤与尊严，方才赢得了真诚以待的心灵共鸣。随后，这份庞大伟力并未被鸣人一人据为己有以成就个人神话，而是无私分覆给了全军每一位普通忍者。伟力由此不再是强人独裁救世的特权徽章，而是蜕变为赋能所有平凡个体共同参与守护的公共基础设施。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>鸣人方案的时代突破：\u003c/strong>他从未许诺构筑一个永无伤痛的无菌温室，而是打破了神权垄断，让力量、信息与风险在所有人之间流动共享，使普通人能够在保有独立意志的前提下，彼此托付生死。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"obito-turn\">\n        \u003ch2 id=\"obito-turn\">带土之惑：他穷尽一生想要击溃的，恰恰是那个未曾堕落的初心\u003c/h2>\n        \u003cp>带土之所以对瓦解鸣人的信念抱有近乎病态的执念，绝非源于掌控全局的从容自若。鸣人身上流淌的气质，恰如少年时代的带土自己：同样莽撞热血、渴望成为火影、坚定奉行同伴重于铁律的信条。只要鸣人在经历更为残酷的生离死别后依然拒绝臣服于幻梦，带土便不得不痛苦承认：琳之死固然解释了他的绝望深渊，却绝未机械剥夺他在漫长岁月里做出每一次屠杀决择的主体意志。\u003c/p>\n        \u003cp>因而，鸣人坚决唤回“宇智波带土”这个名字，绝非用廉价的童年梦想为九尾之乱、第四次大战以及无数生灵的血债脱罪，而是残忍地扯下了带土最后的心理避难所。自称“无名之辈（谁也不是）”，方可将一切滔天罪行推诿为“虚假地狱世界的必然宿命”；而一旦重新承认自己就是那个曾矢志成为火影的少年，便意味着他必须正视自己本该成为何人，以及实际上究竟沦为了何种恶魔。\u003c/p>\n        \u003cp class=\"warning-note\">\u003cstrong>洞悉创伤绝非豁免罪责：\u003c/strong>带土在绝境关头的舍身赴死与回戈一击，展现了个体良知与责任的悲壮回归，却绝不能从时间线上逆向洗白其发动的浩劫血债。本课在此所辨析的，是“作恶者能否在悬崖勒马中承担最后的历史责任”，而非廉价的“一悔解千仇”。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"peace-console\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"peace-console\">和平控制台：为了换取“永无痛楚”，你甘愿交出多少现实选择权？\u003c/h2>\u003cp>请调节三项核心价值维度的权重天平。控制台绝不会给予定论式的标准答案，只会让冷酷的伦理代价清晰显形：当某种诉求被推至绝对极致时，究竟谁的主体选择权会最先被剥夺？\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">价值权衡\u003c/span>\u003c/div>\n      \u003cdiv class=\"choice-layout\">\n        \u003cdiv id=\"value-controls\">\u003c/div>\n        \u003cdiv class=\"choice-result\" aria-live=\"polite\">\u003ch3 id=\"value-verdict\">\u003c/h3>\u003cp id=\"value-explanation\">\u003c/p>\u003cp id=\"value-cost\" class=\"value-cost\">\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"madara-dream\">\n        \u003ch2 id=\"madara-dream\">斑之狂想的内在破产：幻梦虽有定制极乐，却彻底消灭了公共世界\u003c/h2>\n        \u003cp>无限月读最致命的诱惑，在于它并未向众生推销一套千人一面的粗陋幻境，而是依循每个人的内在欲望进行极致定制：逝去的至亲含笑重聚，未竟的壮志圆满达成，所有的屈辱与创伤皆被神术温存抚平。若仅以“主观多巴胺体验是否愉悦”作为终极尺度，斑的救世工程似乎远比充满龃龉的现实秩序更为高效纯粹。\u003c/p>\n        \u003cp>然而，囚禁于梦境中的个体已然彻底失去了与“真实他者”相遇的可能。幻境中的每个“他人”，不过是神树系统依照宿主执念编织而成的提线木偶与心理回声；没有了拒绝、误解、分歧与意外碰撞，人世间便再无真正的心灵共鸣与真情回应。更为致命的是，无限月读在程序正义上已然宣判了自身道德光环的破产：斑标榜要满足所有人的愿望，却在程序上彻底剥夺了任何人拒绝入梦的权利。\u003c/p>\n        \u003cp>黑绝的千年背刺，则将这种极权专断的内在荒谬反噬到了斑自身。斑孤傲地自诩洞悉历史真理、超越凡尘俗世，终局却惨烈发现石碑早已被篡改，自己毕生苦心经营的救世伟业，不过是复活查克拉始祖的提线容器。一个以“凡愚不可信，唯我独裁断”为基石的极权体系，从源头上便斩断了一切纠错机制，因而注定沦为单一虚假信源的猎物。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>无限月读的本质死穴：\u003c/strong>它并非在于未能营造感官愉悦，而在于它将和平从“人与人共同承担与维系的动态关系”，降格为了“独裁者对全人类意识施加单向技术托管”的极权死亡状态。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"kaguya-return\">\n        \u003ch2 id=\"kaguya-return\">始祖重临：幕后操弄绝不等于免除了行动者的历史罪责\u003c/h2>\n        \u003cp>黑绝自爆千年暗线：篡改六道石碑、挑唆因陀罗后裔、借斑之躯复活辉夜。这一戏剧性反转极易滑向一种虚无的过度简化：既然万事皆有幕后黑手，斑、带土乃至整个忍界的血泪纷争是否皆沦为了无辜棋子的悲剧？答案是断然否定的。幕后操弄者能够编造谎言、诱发猜忌与提供工具，却始终必须借助行动者内心原本就盘根错节的恐惧、傲慢与野心方能落地生根。\u003c/p>\n        \u003cp>斑之所以对篡改后的石碑深信不疑，是因为它精准迎合了其对人类互信可能性的彻底绝望；带土之所以甘当月之眼的执行狂徒，是因为他主动将琳之死推演为整个现实皆该被毁灭的虚无执念。黑绝仅仅是放大了历史裂痕并推波助澜，却从未替他们在每一个分岔路口完成具体的背叛、屠杀与极权抉择。\u003c/p>\n        \u003cp>大筒木辉夜的降临，则将“和平即绝对占有”的神权逻辑推向了起源：世间一切查克拉皆当回归于她一人，天下众生皆当退化为任由宰割的白绝兵粮。第七班之所以能够完成终极封印，绝非某一个人获得了超越始祖的绝对全能，而是鸣佐的阴阳封印、小樱的决死一拳、卡卡西的神威策应与带土跨越生死的舍命相托，在千钧一发之际达成了天衣无缝的协同咬合。始祖的神圣垄断，终究在不可被单一个体替代的凡人协作面前土崩瓦解。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"turning-points\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"turning-points\">战局深度研判：哪一次抉择真正重构了和平的内在结构？\u003c/h2>\u003cp>逐一审视大战进程中的三大转折瞬间。切勿仅停留在战力数值的增减比较，而要深刻剖析人际关系、伦理责任与自由选择权在此刻发生了怎样的范式跃迁。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">3 个时刻\u003c/span>\u003c/div>\n      \u003cdiv id=\"case-tabs\" class=\"step-tabs\" role=\"tablist\" aria-label=\"时刻导航\">\u003c/div>\n      \u003cdiv id=\"case-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"case-prev\" class=\"button\" type=\"button\">← 上一幕\u003c/button>\u003cbutton id=\"case-next\" class=\"button primary\" type=\"button\">下一幕 →\u003c/button>\u003c/div>\u003cbutton id=\"case-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"war-verdict\">\n        \u003ch2 id=\"war-verdict\">大战终局裁定：不完美的现实胜出，但终极和平远未尘埃落定\u003c/h2>\n        \u003cp>第七班联手封印辉夜，雄辩地证明了暴力强加的虚无幻梦绝非人间止痛的唯一选项；联军各部的并肩死斗，亦证明了世仇故敌完全能在不抹除历史记忆的前提下，创造出崭新的信任事实。然而，这场惨胜并不能自动消弭五大忍村原有的地缘实力失衡、人柱力体制的历史污名、宇智波灭族的政治积案，乃至战后庞大资源的利益分配纷争。\u003c/p>\n        \u003cp>换言之，忍者联军仅仅通过了“人类能否在面临共同灭顶之灾时并肩抗争”的极端生存测试，却远未通过“外在威胁消退后能否在和平日常中共享权力”的制度化大考。这正是佐助在辉夜被封印后旋即发动“革命”的思想切入点：他认定眼前的联合纯粹依附于共同敌人的存在；一旦强敌灰飞烟灭，人性的劣根性必将诱发内战重燃；既然如此，不如由他一人化身为全人类永恒的恐怖阴影与终极敌人。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>通往终局的最后悬念：\u003c/strong>辉夜绝非终极的思想劲敌——她仅仅代表着从外部强加吞噬的神权暴政；而佐助随后提出的，则是从忍界创伤内部孕育而出的理性专制：以一人之身化作笼罩天下的永恒阴影，用永无止境的绝对威慑换取诸国永不起兵。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"lesson-check\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"lesson-check\">认知检验：硝烟散尽之时，何谓真正的和平？\u003c/h2>\u003cp>一次只看一道题。选择后立即得到解释；可以跳过、返回或修改，进度会自动保留。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">4 个问题\u003c/span>\u003c/div>\n      \u003cdiv id=\"quiz-tabs\" class=\"quiz-tabs\" role=\"tablist\" aria-label=\"问题导航\">\u003c/div>\n      \u003cdiv id=\"quiz-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"quiz-prev\" class=\"button\" type=\"button\">← 上一题\u003c/button>\u003cbutton id=\"quiz-next\" class=\"button primary\" type=\"button\">下一题 →\u003c/button>\u003c/div>\u003cbutton id=\"quiz-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cfooter class=\"lesson-footer\">\n      \u003cdiv class=\"takeaway\">\u003cstrong>核心结语：\u003c/strong>忍界大战并未轻浮地宣判现实世界从此一片光明，而是确立了一项更为沉稳且艰难的真理：即便人间苦难无法被彻底抹除，众生依然能够在保留个性差异、历史记忆与拒绝权的前提下，借由力量的共有与命运的共担，共同缔造出绝非由某位独裁救世主单方面恩赐的持久和平。\u003c/div>\n      \u003cp class=\"next-lesson\">\u003cstrong>下一讲：最后的敌人不是辉夜——鸣人与佐助的终极裁决\u003c/strong>佐助为何在众人破茧重生的庆典前夕，断然宣布处决五影、奴役尾兽并发动“理性革命”？终结之谷的宿命决战，将最终裁决忍界究竟需要一位承担永恒诅咒的独裁霸主，还是一张在残缺中不断修复与联结的人间之网。\u003c/p>\n    \u003c/footer>\n  \u003c/main>\n\n  \u003cscript>\n    (function () {\n      \"use strict\";\n      var storagePrefix = \"course:session5:\";\n\n      function readState(key, fallback) {\n        try {\n          var saved = localStorage.getItem(storagePrefix + key);\n          return saved ? JSON.parse(saved) : fallback;\n        } catch (error) { return fallback; }\n      }\n\n      function writeState(key, value) {\n        try { localStorage.setItem(storagePrefix + key, JSON.stringify(value)); }\n        catch (error) { /* 禁用本地存储时，课程仍可使用。 */ }\n      }\n\n      function clampIndex(index, length) { return Math.max(0, Math.min(length - 1, index)); }\n\n      var allianceActions = [\n        { id: \"command\", title: \"接受跨村统一战略指挥\", short: \"四代目雷影统帅联军，各村让渡部分独立军事指挥权\", detail: \"联盟的第一步绝非彼此互生好感，而是各方甘愿让共同制定的中枢规则约束自身行动。各村主动承担战略误判的风险，方才换取了协同作战的规模效应。\" },\n        { id: \"intel\", title: \"共享核心秘术与战地情报\", short: \"感知、医疗、封印与战术情报彻底跨越地缘藩篱\", detail: \"在旧式忍村体制中，秘术与情报既是宗族立足之本亦是威慑筹码；无保留地共享情报，意味着敢于将自身的致命软肋托付给昔日宿敌。\" },\n        { id: \"names\", title: \"赋予秽土亡灵以具体人格与姓名\", short: \"秽土转生者不再仅是被动清除的敌对战斗单元\", detail: \"当生者与亡者重新建立起亲缘、师承与真诚释怀的精神语境，旧时代便不再只能以暴力复制创伤，而是被后人赋予了全新的历史安放。\" },\n        { id: \"chakra\", title: \"鸣人无私共享九尾查克拉\", short: \"昔日被高层垄断的战略核威慑力量分覆全军将士\", detail: \"伟力最关键的范式跃迁，在于从少数寡头垄断的威慑工具，升华为庇护所有陌生个体的公共资源。分享不仅未削弱领导力，反而空前赋能了全军的能动性。\" },\n        { id: \"rescue\", title: \"跨越村界与血统的舍命救援\", short: \"战地救援的优先级不再受护额归属与宗族血缘的限制\", detail: \"信任绝非虚无缥缈的口号，而是‘当我濒死倒下时，异村忍者是否会舍命拉我一把’。生死互救将政治联合从抽象宣言化作了刻骨铭心的身体记忆。\" },\n        { id: \"mourning\", title: \"共同哀悼牺牲并坚毅重返沙场\", short: \"阵亡将士不再仅被单个村落收回为狭隘的宗族英烈\", detail: \"共同哀悼让每一份惨痛牺牲汇入全忍界的集体记忆；重返沙场则宣告绝不容许刽子手垄断对牺牲意义的解释权。\" }\n      ];\n      var allianceState = readState(\"alliance:v1\", []);\n      if (!Array.isArray(allianceState)) allianceState = [];\n\n      function renderAlliance() {\n        var container = document.getElementById(\"alliance-actions\");\n        container.innerHTML = \"\";\n        allianceActions.forEach(function (item) {\n          var button = document.createElement(\"button\");\n          button.type = \"button\";\n          button.className = \"alliance-action\";\n          button.setAttribute(\"aria-pressed\", allianceState.indexOf(item.id) !== -1 ? \"true\" : \"false\");\n          var title = document.createElement(\"strong\"); title.textContent = item.title;\n          var short = document.createElement(\"span\"); short.textContent = item.short;\n          button.append(title, short);\n          button.addEventListener(\"click\", function () {\n            var index = allianceState.indexOf(item.id);\n            if (index === -1) allianceState.push(item.id); else allianceState.splice(index, 1);\n            writeState(\"alliance:v1\", allianceState);\n            renderAlliance();\n            document.getElementById(\"alliance-result\").textContent = item.detail;\n          });\n          container.appendChild(button);\n        });\n        var count = allianceState.length;\n        document.getElementById(\"alliance-fill\").style.width = String(count / allianceActions.length * 100) + \"%\";\n        document.getElementById(\"alliance-count\").textContent = count + \" / \" + allianceActions.length;\n        var result = document.getElementById(\"alliance-result\");\n        if (count === 0) result.textContent = \"尚未形成任何共同事实。此时的联军仅仅是被灭顶之灾暂时捆绑在一起的脆弱武装集合。\";\n        else if (count === allianceActions.length) result.textContent = \"六项协作壮举全部点亮：历史宿怨并未凭空蒸发，但生死与共的协作已然铸就了不可磨灭的崭新历史。信任绝非结盟的廉价前提，而是共同担荷风险后淬炼而出的珍贵果实。\";\n        else {\n          var selectedItems = allianceActions.filter(function (item) { return allianceState.indexOf(item.id) !== -1; });\n          result.textContent = \"已激活 \" + count + \" 项协作壮举。最近审视的信任纽带：\" + selectedItems[selectedItems.length - 1].detail;\n        }\n      }\n      renderAlliance();\n\n      var values = [\n        { id: \"painless\", label: \"彻底消除一切痛苦\", initial: 72 },\n        { id: \"freedom\", label: \"誓死捍卫自由选择权\", initial: 86 },\n        { id: \"uncertainty\", label: \"包容人际关系的不确定性\", initial: 58 }\n      ];\n      var valueState = readState(\"peace-console:v1\", { painless: 72, freedom: 86, uncertainty: 58 });\n\n      function renderValues() {\n        var controls = document.getElementById(\"value-controls\");\n        controls.innerHTML = \"\";\n        values.forEach(function (value) {\n          var row = document.createElement(\"div\"); row.className = \"value-control\";\n          var line = document.createElement(\"div\"); line.className = \"value-line\";\n          var label = document.createElement(\"label\"); label.htmlFor = \"value-\" + value.id; label.textContent = value.label;\n          var output = document.createElement(\"output\"); output.htmlFor = \"value-\" + value.id; output.textContent = String(valueState[value.id]);\n          var input = document.createElement(\"input\"); input.type = \"range\"; input.id = \"value-\" + value.id; input.min = \"0\"; input.max = \"100\"; input.value = String(valueState[value.id]);\n          input.addEventListener(\"input\", function () {\n            valueState[value.id] = Number(input.value);\n            writeState(\"peace-console:v1\", valueState);\n            renderValues();\n          });\n          line.append(label, output); row.append(line, input); controls.appendChild(row);\n        });\n        updateValueVerdict();\n      }\n\n      function updateValueVerdict() {\n        var painless = Number(valueState.painless);\n        var freedom = Number(valueState.freedom);\n        var uncertainty = Number(valueState.uncertainty);\n        var title = document.getElementById(\"value-verdict\");\n        var explanation = document.getElementById(\"value-explanation\");\n        var cost = document.getElementById(\"value-cost\");\n        if (painless > 75 && freedom \u003c 45) {\n          title.textContent = \"无限月读倾向：以无痛幻象强行覆盖知情同意\";\n          explanation.textContent = \"你将免受伤害置于自主意识之上。这一秩序或许恒久安谧且极度愉悦，却必须由某位神明般的独裁者替全人类代行裁决何谓幸福。\";\n          cost.textContent = \"终极代价：人类彻底丧失了拒绝权、修正愿望的能力以及与真实他者相遇的心灵空间。\";\n        } else if (freedom > 70 && uncertainty \u003c 35) {\n          title.textContent = \"尚未化解的内在悖论：既渴求绝对自主，又无法容忍未知变数\";\n          explanation.textContent = \"自由意志的本质必然赋予他人改变、拒绝乃至背叛的可能。若绝对无法承受人际互动的未知风险，秩序终将滑向依赖强权冷冻众生选择的泥潭。\";\n          cost.textContent = \"待回答的拷问：当他人做出了令你痛心疾首的抉择时，你是否依然承认其独立的主体资格？\";\n        } else if (freedom >= 55 && uncertainty >= 45) {\n          title.textContent = \"联军现实倾向：在包容脆弱与可修复性中守护和平\";\n          explanation.textContent = \"你清醒接受了和平绝无法彻底删除人间伤痛，唯有建立起纠错、互援与动态协商的制度韧性。这条道路效率低缓且布满荆棘，却无需依附一位绝对正确的救世主。\";\n          cost.textContent = \"必须担荷的重负：地缘摩擦依然可能死灰复燃，信任需要在日常中持续耕耘投入，没有任何胜利是一劳永逸的保险。\";\n        } else {\n          title.textContent = \"防御性维稳秩序：以安全与控制为第一要务\";\n          explanation.textContent = \"你优先追求降低系统波动与创伤损失，却尚未将极权推向极致。此类秩序在危机中极易步步扩大强制特权，最终将战时临时措施固化为永恒枷锁。\";\n          cost.textContent = \"警惕红线：由谁来裁定危机何时终结？又由谁来迫使执政掌权者归还战时收拢的特权？\";\n        }\n      }\n      renderValues();\n\n      var cases = [\n        {\n          scene: \"鸣人将九尾查克拉化为金色战袍分覆整支联军，使不同村落的普通忍者皆能正面抵御十尾的毁灭轰击。\",\n          title: \"这一标志性行动为何绝非单纯的战力数值倍增？\",\n          options: [\"它证明唯有鸣人一人具备救世资格，其余众生只需退化为被动等待庇护的看客。\", \"它将曾被村落寡头垄断与污名化的战略伟力转化为公共保护资源，赋能平凡个体共同参与守护。\", \"它在瞬息之间永久抹平了五大忍村之间的一切地缘利益摩擦与历史旧怨。\"],\n          answer: 1,\n          feedback: [\"恰恰相反：查克拉的无私共享空前扩展了他人的能动性，而非将众生降格为无力的观众。\", \"解析正确：共享伟力从根本上重构了联军内部的权力结构——救世不再是某位强人孤独的神圣独角戏，而是蜕变为多数人携手承担的集体行动。\", \"战火中的生死协作开创了前所未有的互信，但战后的地缘格局、资源再分配与历史清算依然需要漫长的制度化协商。\"]\n        },\n        {\n          scene: \"宁次为守护鸣人而壮烈牺牲，带土借此冷酷逼问：连并肩的同伴都无法保全，你口口声声的守护承诺难道不正是自欺欺人的弥天大谎？\",\n          title: \"鸣人擦干血泪继续奋战，其最为严谨的哲学内涵是什么？\",\n          options: [\"只要意志足够热血，宁次便会在现实中立即死而复生，因而失去从未真正发生。\", \"鸣人冷酷否认悲伤的合理性，并强令全军将士立刻遗忘宁次以避免影响士气。\", \"他清醒承认死者不可复生，却誓死不让刽子手垄断对牺牲意义的解释权，以继续守护将宁次的意志接入未来行动。\"],\n          answer: 2,\n          feedback: [\"宁次的肉体消逝不可逆转；鸣人的思想成熟正体现在他不再借由‘永不言败’的浪漫幻想来否认现实创伤。\", \"坚毅前行绝不等于冷漠遗忘。雏田与鸣人正是通过牢记宁次为何舍生取义，方才未让伤痛沦为带土散播绝望的证据。\", \"解析正确：生命的崇高意义绝非来自于对既成死亡的虚无抹煞，而在于活着的人如何将死者的意志熔铸进后续的守护长河。\"]\n        },\n        {\n          scene: \"黑绝自爆千年暗线：篡改六道石碑、挑唆因陀罗后裔、借斑之躯复活辉夜。\",\n          title: \"如何严谨审视这一幕后操弄，方能避免将历史人物的伦理责任虚无化？\",\n          options: [\"黑绝提供了谎言欺瞒与诱导工具，但斑与带土依然是依凭自身的傲慢、恐惧与欲望做出了历史抉择，结构诱导与主体责任并行不悖。\", \"既然存在万古幕后黑手，斑与带土造成的一切地缘浩劫与屠杀罪责皆当就此一笔勾销。\", \"黑绝的存在雄辩地证明了忍界众生皆无自由意志，一切道德评价与历史反思皆毫无意义。\"],\n          answer: 0,\n          feedback: [\"解析正确：受骗与被诱导固然影响历史评价，却绝未剥夺行动主体在信仰什么、采取何种极端手段上的全部道德能动性。\", \"幕后的信息污染可以解释宏观环境的逼仄，却绝不能豁免具体人物在现实中发动战争、手刃同胞与剥夺众生意志的行为罪责。\", \"作品恰恰借由鸣人与带土的命运分岔雄辩证明：在面对相似创伤与外部诱惑时，人依然拥有选择不同道路的自由与责任。\"]\n        }\n      ];\n      var caseState = readState(\"turning-points:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(caseState.current)) caseState.current = 0;\n      caseState.current = clampIndex(caseState.current, cases.length);\n      caseState.answers = caseState.answers || {};\n      caseState.skipped = Array.isArray(caseState.skipped) ? caseState.skipped : [];\n\n      function saveCases() { writeState(\"turning-points:v1\", caseState); }\n      function goToCase(index) { caseState.current = clampIndex(index, cases.length); saveCases(); renderCases(); }\n      function answerCase(caseIndex, optionIndex) { caseState.answers[caseIndex] = optionIndex; caseState.skipped = caseState.skipped.filter(function (index) { return index !== caseIndex; }); saveCases(); renderCases(); }\n      function skipCase() { var current = caseState.current; if (!Object.prototype.hasOwnProperty.call(caseState.answers, current) && caseState.skipped.indexOf(current) === -1) caseState.skipped.push(current); caseState.current = current \u003c cases.length - 1 ? current + 1 : 0; saveCases(); renderCases(); }\n\n      function renderCases() {\n        var tabs = document.getElementById(\"case-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"case-panels\"); panels.innerHTML = \"\";\n        cases.forEach(function (item, caseIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"step-tab\";\n          if (Object.prototype.hasOwnProperty.call(caseState.answers, caseIndex)) tab.classList.add(\"answered\");\n          if (caseState.skipped.indexOf(caseIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", caseIndex === caseState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"case-\" + caseIndex); tab.textContent = \"时刻 \" + (caseIndex + 1); tab.addEventListener(\"click\", function () { goToCase(caseIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"case-\" + caseIndex; panel.className = \"case-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = caseIndex !== caseState.current;\n          var count = document.createElement(\"div\"); count.className = \"step-count\"; count.textContent = \"时刻 \" + (caseIndex + 1) + \" / \" + cases.length;\n          var scene = document.createElement(\"p\"); scene.className = \"case-scene\"; scene.textContent = item.scene;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = item.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          item.options.forEach(function (optionText, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"case-\" + caseIndex; input.value = String(optionIndex); input.checked = Number(caseState.answers[caseIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerCase(caseIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.textContent = optionText; label.append(input, text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = caseState.answers[caseIndex];\n          if (selected === undefined) feedback.textContent = caseState.skipped.indexOf(caseIndex) !== -1 ? \"这一幕已暂时跳过。你可以随时回来。\" : \"选出最能解释关系结构变化的一项。\";\n          else { var correct = Number(selected) === item.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = item.feedback[Number(selected)]; }\n          panel.append(count, scene, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"case-prev\").disabled = caseState.current === 0;\n        document.getElementById(\"case-next\").textContent = caseState.current === cases.length - 1 ? \"回到第一幕 ↺\" : \"下一幕 →\";\n      }\n      document.getElementById(\"case-prev\").addEventListener(\"click\", function () { goToCase(caseState.current - 1); });\n      document.getElementById(\"case-next\").addEventListener(\"click\", function () { goToCase(caseState.current === cases.length - 1 ? 0 : caseState.current + 1); });\n      document.getElementById(\"case-skip\").addEventListener(\"click\", skipCase);\n      renderCases();\n\n      var questions = [\n        {\n          title: \"为何说忍者联军的历史价值，绝非仅仅停留在“面对外在强敌时的临时抱团”？\",\n          options: [\n            { text: \"因为生死与共的战火迫使各村破天荒地共享统帅权、核心情报与战地救援风险，在实践中沉淀出了此前从未存在过的互信事实。\", help: \"区分促成联盟的外部危机压力，与联盟在运转中所内生出的崭新关系结构。\" },\n            { text: \"因为五大忍村在开战前夕便已通过外交谈判，彻底解决了所有历史积案与地缘利益冲突。\", help: \"各村宿怨并未凭空消散，联盟本质上是一场在危机高压下展开的制度实验。\" },\n            { text: \"因为全军将士皆被施加了同一种心灵控制忍术，因而绝无产生利益分歧的可能。\", help: \"联军协作建立在清醒个体的理性选择之上，与无限月读的强制同质化恰成鲜明对照。\" }\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：共同敌人解释了联盟为何诞生，而共享风险所积累的新历史，则解释了它为何具备超越一次性战时停火、迈向持久和平的可能。\",\n            \"总体战并未自动完成历史清算；恰恰是在分歧依然严峻的现实中，协作的成功才具有无可替代的检验价值。\",\n            \"联军成员始终保留着独立的人格与判断，协作因而离不开持续的沟通、规则的约束与生命的彼此托付。\"\n          ]\n        },\n        {\n          title: \"无限月读在政治哲学层面所面临的最根本死穴是什么？\",\n          options: [\n            { text: \"它在技术上过于粗糙，根本无法让任何个体在主观感受中体会到真实的快乐。\", help: \"无限月读的诱惑力恰恰在于其能为每个人量身打造极度契合其欲望的定制极乐。\" },\n            { text: \"它由独裁施术者单方面垄断了幸福的定义与入梦决断，以彻底消解人的主体性为代价换取绝对无痛。\", help: \"切勿仅停留在体验层面的快感，更要审视程序上是否允许知情同意与自主拒绝。\" },\n            { text: \"它在梦境中保留了过多的公共民主争论，导致维持和平的行政效率过于低下。\", help: \"无限月读的本质绝非讨论过多，而是彻底剥夺了任何公共讨论与退出的可能。\" }\n          ],\n          answer: 1,\n          feedback: [\n            \"无限月读最致命的诱惑恰恰在于其量身定制的极致愉悦；若仅以体验不好受进行批判，便完全偏离了其极权本质。\",\n            \"解析正确：它或许能制造主观多巴胺体验，却将全人类降格为被神权托管的意识标本，彻底摧毁了人与人共同构建、修正与维系和平的主体资格。\",\n            \"梦境秩序根本不存在真正的公共生活；所有人的愿望皆被物理隔离在了神树系统生成的唯我论私人幻景之中。\"\n          ]\n        },\n        {\n          title: \"鸣人在战局焦点坚决唤回带土的名字，为何绝不等同于为其滔天罪孽“洗白”？\",\n          options: [\n            { text: \"因为鸣人公开宣称九尾之乱与第四次大战中喋血的无辜亡魂，在本质上并未遭受任何实质伤害。\", help: \"作品从未轻浮地抹煞或逆转那些惨烈且不可逆的历史伤亡。\" },\n            { text: \"因为将带土从虚无面具还原为具体的历史行动者，反而彻底剥夺了他借由‘虚假地狱世界的必然’来逃避个体道德责任的借口。\", help: \"姓名在此承载着个体主体性、未竟的誓言以及对自身抉择承担历史终极责任的必然要求。\" },\n            { text: \"因为只要作恶者在临终前做出一件正义之举，其既往犯下的所有屠杀罪责便会自动归零抵销。\", help: \"临终的道德觉醒与良知回归，绝无法从时间线上倒转既成的历史浩劫。\" }\n          ],\n          answer: 1,\n          feedback: [\n            \"鸣人从未轻蔑受害者的鲜血；他的哲学立场在于洞悉创伤根源的同时，以绝对力量阻断恶行的继续蔓延。\",\n            \"解析正确：将带土从‘谁也不是’的虚无幽灵还原为具体的人，是将其重新钉死在伦理审判的坐标之上，而非免除其历史罪责。\",\n            \"带土最后的舍命相托展现了悲壮的人性回归，但这份光辉与既往的浩劫罪责并行不悖，绝不能互相抵销。\"\n          ]\n        },\n        {\n          title: \"在第七班联手封印辉夜之后，忍界为何依然未能达成终极意义上的和平？\",\n          options: [\n            { text: \"因为联军仅仅证明了人类能在共同灭绝的极端威胁下协同抗敌，却尚未证明威胁消退后如何在日常中共享权力并化解陈年宿怨。\", help: \"深刻区分极端生存危机下的战时团结，与承平日久后常态政治中的长效共处机制。\" },\n            { text: \"因为第七班并未真正击溃辉夜，辉夜依然公开统治着五大忍村并掌控着全人类。\", help: \"辉夜已然被鸣佐的‘六道·地爆天星’彻底剥离九只尾兽并永久封印。\" },\n            { text: \"因为全体人类依然永久沉沦于神树的无限月读之中，鸣人与佐助亦毫无解除术式的办法。\", help: \"鸣佐二人已掌握了解除无限月读的阴阳之力，接下来的终极矛盾源于佐助对战后新秩序的激进构想。\" }\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：大战的胜利消除了来自神权的绝对灭顶之灾，却将‘失去共同敌人之后如何维系持久团结与公义’的终极考题留给了战后世界。\",\n            \"查克拉始祖已被第七班精密协作封印，随后的核心矛盾已由外部神权压迫转向了忍界内部发展道路的决战。\",\n            \"第七班已然主宰了战场局势；佐助随即发动的革命，正是针对战后权力与和平机制提出的一套冷酷的理性专制方案。\"\n          ]\n        }\n      ];\n      var quizState = readState(\"quiz:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(quizState.current)) quizState.current = 0;\n      quizState.current = clampIndex(quizState.current, questions.length);\n      quizState.answers = quizState.answers || {};\n      quizState.skipped = Array.isArray(quizState.skipped) ? quizState.skipped : [];\n\n      function saveQuiz() { writeState(\"quiz:v1\", quizState); }\n      function goToQuestion(index) { quizState.current = clampIndex(index, questions.length); saveQuiz(); renderQuiz(); }\n      function answerQuestion(questionIndex, optionIndex) { quizState.answers[questionIndex] = optionIndex; quizState.skipped = quizState.skipped.filter(function (index) { return index !== questionIndex; }); saveQuiz(); renderQuiz(); }\n      function skipQuestion() { var current = quizState.current; if (!Object.prototype.hasOwnProperty.call(quizState.answers, current) && quizState.skipped.indexOf(current) === -1) quizState.skipped.push(current); quizState.current = current \u003c questions.length - 1 ? current + 1 : 0; saveQuiz(); renderQuiz(); }\n\n      function renderQuiz() {\n        var tabs = document.getElementById(\"quiz-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"quiz-panels\"); panels.innerHTML = \"\";\n        questions.forEach(function (question, questionIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"quiz-tab\";\n          if (Object.prototype.hasOwnProperty.call(quizState.answers, questionIndex)) tab.classList.add(\"answered\");\n          if (quizState.skipped.indexOf(questionIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", questionIndex === quizState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"question-\" + questionIndex); tab.textContent = String(questionIndex + 1); tab.addEventListener(\"click\", function () { goToQuestion(questionIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"question-\" + questionIndex; panel.className = \"question-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = questionIndex !== quizState.current;\n          var count = document.createElement(\"div\"); count.className = \"question-count\"; count.textContent = \"问题 \" + (questionIndex + 1) + \" / \" + questions.length;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = question.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          question.options.forEach(function (choice, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"question-\" + questionIndex; input.value = String(optionIndex); input.checked = Number(quizState.answers[questionIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerQuestion(questionIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.appendChild(document.createTextNode(choice.text + \" \"));\n            var help = document.createElement(\"span\"); help.className = \"term\"; help.tabIndex = 0; help.textContent = \"概念提示\";\n            var tooltip = document.createElement(\"span\"); tooltip.className = \"tooltip\"; tooltip.setAttribute(\"role\", \"tooltip\"); tooltip.textContent = choice.help; help.appendChild(tooltip); text.appendChild(help); label.append(input, text); options.appendChild(label);\n          });\n          var
