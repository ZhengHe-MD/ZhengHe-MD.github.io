on:disabled { opacity: 0.4; cursor: default; }\n\n    .scoreboard {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 0.8rem;\n      margin-top: 1.3rem;\n      padding-top: 1.2rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .score-card { padding: 0.85rem; border-radius: 0.65rem; background: var(--paper-deep); }\n    .score-card strong { display: block; font-size: 0.86rem; }\n    .score-track { height: 0.5rem; margin: 0.55rem 0; overflow: hidden; border-radius: 999px; background: rgba(41, 39, 33, 0.1); }\n    .score-fill { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 220ms ease; }\n    .score-card span { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.74rem; }\n    .score-summary { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 0.9rem; }\n\n    .pressure-control { width: 100%; margin: 1rem 0 0.5rem; accent-color: var(--accent); }\n    .pressure-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8rem; }\n    .bridge {\n      position: relative;\n      height: 8rem;\n      margin: 1.2rem 0;\n      overflow: hidden;\n      border-radius: 0.75rem;\n      background: linear-gradient(#e6ddd0 0 55%, #c6d2c1 55%);\n    }\n\n    .bridge-bank { position: absolute; bottom: 1rem; width: 22%; height: 3rem; border-radius: 0.4rem 0.4rem 0 0; background: #756454; }\n    .bridge-bank.left { left: 0; }\n    .bridge-bank.right { right: 0; }\n    .bridge-span {\n      position: absolute;\n      left: 18%;\n      right: 18%;\n      bottom: 3.5rem;\n      height: 0.8rem;\n      border-radius: 999px;\n      background: var(--accent);\n      transform-origin: left center;\n      transition: transform 220ms ease, background 220ms ease;\n    }\n\n    .bridge-rule { position: absolute; left: 49%; bottom: 1rem; width: 0.7rem; height: 3rem; background: var(--sage); }\n    .pressure-result { padding: 0.9rem 1rem; border-radius: 0.65rem; background: var(--paper-deep); font-size: 0.92rem; }\n\n    .lesson-footer { margin-top: 4.5rem; padding-top: 2rem; border-top: 1px solid var(--line); }\n    .takeaway { padding: 1.4rem 1.5rem; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 1.05rem; }\n    .next-lesson { margin-top: 2rem; color: var(--muted); }\n    .next-lesson strong { display: block; color: var(--ink); font-size: 1.1rem; }\n\n    @media (max-width: 760px) {\n      body { font-size: 16px; }\n      .content { width: min(100% - 2rem, 88ch); padding-top: 1.2rem; }\n      .learning-goals, .thesis-grid, .comparison, .scoreboard { grid-template-columns: 1fr; }\n      .thesis-card { min-height: 0; }\n      .fault-line { grid-template-columns: 1fr; }\n      .fault-vs { justify-self: center; }\n      .tooltip { position: fixed; inset: auto 1rem 1rem; width: auto; transform: translateY(0.3rem); }\n      .term:hover .tooltip, .term:focus .tooltip { transform: translateY(0); }\n      .lab-head { display: block; }\n      .lab-label { display: inline-block; margin-top: 0.6rem; }\n      .lab-nav { flex-direction: column; }\n      .score-summary { grid-column: auto; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      html { scroll-behavior: auto; }\n      .tooltip, .score-fill, .bridge-span { transition: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cnav class=\"topbar\" aria-label=\"课程导航\">\n      \u003cdiv class=\"topbar-links\">\n        \u003ca href=\"session1.html\">← 上一讲\u003c/a>\n        \u003ca href=\"syllabus.html\">课程大纲\u003c/a>\n      \u003c/div>\n      \u003cspan class=\"lesson-count\">第 2 讲 / 共 7 讲\u003c/span>\n    \u003c/nav>\n\n    \u003cheader class=\"lesson-header\">\n      \u003cp class=\"eyebrow\">第二讲 · 建村\u003c/p>\n      \u003ch1>从战国到忍村\u003c/h1>\n      \u003cp class=\"lede\">柱间与斑完成了前人未竟的伟业：让血海深仇的两大家族放下屠刀，并将和平共处铸造成忍村制度。然而他们却留下了一道更严酷的难题——当最初的缔造者之间失去了互信，这套庞大的制度该依仗什么继续维系？\u003c/p>\n      \u003cdiv class=\"lesson-meta\" aria-label=\"本课信息\">\n        \u003cspan>约 30 分钟\u003c/span>\n        \u003cspan>制度视角\u003c/span>\n        \u003cspan>深度复盘\u003c/span>\n      \u003c/div>\n      \u003cblockquote class=\"opening-question\">带着一个问题出发：终结战乱或许只需至强者相逢一笑；但要让和平超越英雄的寿命而长存，究竟需要怎样的制度韧性？\u003c/blockquote>\n      \u003cdiv class=\"learning-goals\" aria-label=\"学习目标\">\n        \u003cdiv class=\"goal\">\u003cstrong>01\u003c/strong>\u003cspan>理清木叶建村至终结之谷决裂的因果脉络\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>02\u003c/strong>\u003cspan>明晰“止战之勇”与“制度之功”的本质区别\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>03\u003c/strong>\u003cspan>对比柱间与斑面对未知风险的不同应对范式\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"answer-first\">\n        \u003ch2 id=\"answer-first\">开篇立论：他们消除了战火，却未能驯服不确定性\u003c/h2>\n        \u003cp>柱间与斑联手缔造的功绩无可置疑：他们将千手与宇智波从血亲复仇的\u003cspan class=\"term\" tabindex=\"0\">战国时代\u003cspan class=\"tooltip\" role=\"tooltip\">忍村诞生前，各大忍族受雇于诸侯领主、常年相互杀戮的乱世。稚童自幼便被驱策充当兵器送上战场。\u003c/span>\u003c/span>中解救出来，共同构筑了木叶隐村，让后代不再甫一降生便背负战场的血债。他们以无可辩驳的事实证明：世仇宿敌能够超越狭隘的血缘藩篱，共同凝聚出更高维度的政治身份认同。\u003c/p>\n        \u003cp>然而两人的共同折戟亦令人扼腕：这份和平过度依附于两位超凡领袖的绝顶战力与私人情谊，却未能在制度层面上及早确立稳固的权力交接规范、少数族群权益保障与分歧仲裁通道。一旦斑认定体制终将清算宇智波，而柱间又决然将“村子集体利益”凌驾于一切私人羁绊之上，最初那场跨越仇恨的握手，便在现实的重压下轰然碎裂。\u003c/p>\n\n        \u003cdiv class=\"thesis-grid\">\n          \u003carticle class=\"thesis-card\">\n            \u003ch3>功绩：拓展“我们”的边界\u003c/h3>\n            \u003cp>千手与宇智波不再是血海深仇的宿敌，而成为共荣共损的同袍。和平第一次摆脱了虚幻的愿景，获得了可居住、可延续的实体家园。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"thesis-card\">\n            \u003ch3>裂隙：权力更迭的隐患\u003c/h3>\n            \u003cp>斑与柱间的私人互信，无法自动转化为宇智波一族对木叶体制的长久信赖；柱间众望所归，亦不代表后继者能始终秉持公正不偏的胸襟。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"thesis-card\">\n            \u003ch3>败局：将政治异见激化为生死敌我\u003c/h3>\n            \u003cp>斑将不可控的未来视作必须彻底抹杀的变数；柱间则认定任何危及村落存续的异己皆不可饶恕。深层的政治路线分歧，最终再度堕入你死我活的血腥决斗。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>核心命题：\u003c/strong>停战契约解决的是“今日如何止戈”，而体制设计回答的则是“明日哪怕心生猜忌，如何依然不动刀兵”。木叶完美兑现了前者，却在后者的考验中留下了未竟之痛。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"timeline\">\n        \u003ch2 id=\"timeline\">编年溯源：从南贺川畔到终结之谷\u003c/h2>\n        \u003cdiv class=\"story-line\" aria-label=\"木叶建立时间线\">\n          \u003carticle class=\"story-event\">\n            \u003ch3>河边的两个孩子\u003c/h3>\n            \u003cp>在不知晓彼此族姓的少年时光，柱间与斑在南贺川畔许下共同宏愿：建立一处能让孩童免于战火摧残的避风港。对和平的渴望，先于狭隘的家族认同破土而出。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>身份暴露，理想中断\u003c/h3>\n            \u003cp>两人千手与宇智波的真实身份被迫暴露。在严酷父权的威逼下，两人被勒令利用私谊伏击对方，宗族世仇再度残酷碾压了少年情谊。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>泉奈之死与停战\u003c/h3>\n            \u003cp>成年后的两族战火连绵。斑的胞弟泉奈遭扉间重创不治，宇智波一族日薄西山。柱间毅然拔刀欲自尽以践诺，以无上诚意彻底打动了斑，促成两族止战和解。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>木叶建立与火影人选\u003c/h3>\n            \u003cp>两族联手建村定名木叶。柱间极力举荐斑出任初代\u003cspan class=\"term\" tabindex=\"0\">火影\u003cspan class=\"tooltip\" role=\"tooltip\">木叶隐村的最高领袖。首任火影的人选不仅关乎最高权柄归属，更象征着新兴共同体所认可的执政合法性基石。\u003c/span>\u003c/span>；扉间则力主付诸村民与高层的民主推举，最终柱间全票当选。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>斑离开，宇智波没有跟随\u003c/h3>\n            \u003cp>斑洞察到千手主导的权力架构终将边缘化宇智波，却无法劝说渴望安居的族人舍弃眼前的安宁。他不仅失去了木叶高层的信任，更在族群内部丧失了代表性。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>终结之谷第一战\u003c/h3>\n            \u003cp>斑裹挟九尾悍然突袭木叶。柱间为捍卫村落大义痛斩旧友，并立下冷峻誓言：纵是挚友、手足乃至亲骨肉，凡危及村子安危者，断无姑息之理。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n        \u003caside class=\"canon-note\">\u003cstrong>切勿浅读为“竞选落败引发的疯狂”：\u003c/strong>火影落选仅是矛盾激化的导火索。泉奈之死的血仇、扉间根深蒂固的戒备、族人安于现状的背离、石碑遭黑绝篡改的蛊惑，以及斑自身对“绝对安全”的执念，诸多暗流交织激荡，方才将一次权力交接酿成了彻底决裂的历史悲剧。\u003c/aside>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"founding-table\">\n      \u003cdiv class=\"lab-head\">\n        \u003cdiv>\n          \u003ch2 id=\"founding-table\">治理实验：置身木叶建村谈判桌\u003c/h2>\n          \u003cp>请以建村决策者的身份审议四项制度方案。世间并无两全法，每一次抉择都在“即时维稳”、“合法认同”与“长治韧性”之间权衡取舍。所有选择均实时保存，支持自由回溯。\u003c/p>\n        \u003c/div>\n        \u003cspan class=\"lab-label\">制度实验\u003c/span>\n      \u003c/div>\n      \u003cdiv id=\"decision-tabs\" class=\"step-tabs\" role=\"tablist\" aria-label=\"创村议题导航\">\u003c/div>\n      \u003cdiv id=\"decision-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\n        \u003cdiv class=\"lab-nav-group\">\n          \u003cbutton id=\"decision-prev\" class=\"button\" type=\"button\">← 上一项\u003c/button>\n          \u003cbutton id=\"decision-next\" class=\"button primary\" type=\"button\">下一项 →\u003c/button>\n        \u003c/div>\n        \u003cbutton id=\"decision-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"scoreboard\" aria-label=\"制度选择结果\">\n        \u003cdiv class=\"score-card\">\u003cstrong>即时维稳\u003c/strong>\u003cdiv class=\"score-track\">\u003cdiv id=\"score-stability\" class=\"score-fill\">\u003c/div>\u003c/div>\u003cspan id=\"score-stability-text\">等待选择\u003c/span>\u003c/div>\n        \u003cdiv class=\"score-card\">\u003cstrong>合法认同\u003c/strong>\u003cdiv class=\"score-track\">\u003cdiv id=\"score-legitimacy\" class=\"score-fill\">\u003c/div>\u003c/div>\u003cspan id=\"score-legitimacy-text\">等待选择\u003c/span>\u003c/div>\n        \u003cdiv class=\"score-card\">\u003cstrong>长治韧性\u003c/strong>\u003cdiv class=\"score-track\">\u003cdiv id=\"score-resilience\" class=\"score-fill\">\u003c/div>\u003c/div>\u003cspan id=\"score-resilience-text\">等待选择\u003c/span>\u003c/div>\n        \u003cp id=\"score-summary\" class=\"score-summary\" aria-live=\"polite\">请开启首项建村议题决策，审视你的和平构想会将治理风险转嫁于何处。\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"shared-success\">\n        \u003ch2 id=\"shared-success\">共筑伟业：他们因何能够创造历史\u003c/h2>\n        \u003cp>柱间与斑最深层的默契，绝非仅仅在于棋逢对手的伟力，而在于他们都曾被旧时代的吃人绞肉机撕扯得鲜血淋漓。柱间痛失瓦间、板间两位幼弟，斑眼睁睁看着众手足喋血荒野、仅存泉奈。他们对和平的追求绝非空洞的道德口号，而是立誓要从根源上斩断将下一代无情送上祭坛的宿命绞索。\u003c/p>\n        \u003cp>从这个意义上说，木叶隐村的诞生是一次划时代的社会制度创新。忍者彻底挣脱了单一血缘宗族的狭隘束缚，村落为所有人提供了公共生活空间、跨族任务协作机制与超越家族的公民身份认同。各大国随后纷纷效仿构建一国一村格局，亦印证了该体制在遏制无休止宗族仇杀上的巨大历史进步。\u003c/p>\n        \u003cp>然而历史的局限亦随之滋长：宗族之间的仇恨被强行压缩进村落体制之内，而村落之间则演化成了烈度更高的地缘政治博弈。昔日“千手与宇智波”的零和对立并未烟消云散，而是悄然异化为“木叶与周边大国”的宏大对抗，以及“村落集体意志对体制内边缘族群”的隐形排挤。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>辩证审视：\u003c/strong>木叶隐村并非虚妄的乌托邦。它实实在在地终结了野蛮残酷的宗族仇杀，却也在客观上将未曾真正化解的暴力转移到了全新的地缘与阶层结构中。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"founder-conflict\">\n        \u003ch2 id=\"founder-conflict\">道义分野：你愿为这个世界保留何种风险？\u003c/h2>\n        \u003cdiv class=\"fault-line\" aria-label=\"柱间与斑的和平方案对照\">\n          \u003carticle class=\"fault-side\">\n            \u003cstrong>柱间：以羁绊为先，容纳不完美的人性\u003c/strong>\n            \u003cp>人性固然有猜忌与背叛，体制亦难免瑕疵，但唯有在日复一日的共同生活中方能孕育互信。为了守护这方脆弱的庇护所，纵然动用强力亦在所不惜。\u003c/p>\n          \u003c/article>\n          \u003cspan class=\"fault-vs\">VS.\u003c/span>\n          \u003carticle class=\"fault-side\">\n            \u003cstrong>斑：以掌控为先，斩草除根式扑灭变数\u003c/strong>\n            \u003cp>只要权力未曾归一、个体意志尚存，今日之盟友转瞬便可化作明日之凶徒。真正的和平必须依凭绝对伟力强行铸就，绝不可赌在不可靠的人心上。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n        \u003cp>二人绝非标签化的“理想派”或“武力狂”。柱间坐拥冠绝忍界的木遁神力，亦能在危急关头决绝手刃挚友；斑早年同样满怀赤诚渴望交心，只是一次次撕心裂肺的失去，使他彻底丧失了对人性的信赖。两人的终极鸿沟在于：\u003cstrong>柱间坦然接纳现实的不确定性，并倾尽心血去驾驭与化解；而斑则执拗地要从根源上抹除世间一切不可控的变数。\u003c/strong>\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"bridge-test\">\n      \u003cdiv class=\"lab-head\">\n        \u003cdiv>\n          \u003ch2 id=\"bridge-test\">承重实验：私人情谊能否抵御政治风浪的冲刷？\u003c/h2>\n          \u003cp>请调节“政治压力标尺”：悬空的桥面象征柱间与斑的私人互信，底部的中流砥柱则象征公开的制度规则与权力保障。\u003c/p>\n        \u003c/div>\n        \u003cspan class=\"lab-label\">关系模拟\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"pressure-labels\">\u003cspan>低压：赤诚初衷尚能弥合分歧\u003c/span>\u003cspan>高压：利益、选举与安全恐慌全面激化\u003c/span>\u003c/div>\n      \u003cinput id=\"pressure-range\" class=\"pressure-control\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"35\" aria-label=\"木叶创立后的政治压力\">\n      \u003cdiv class=\"bridge\" aria-hidden=\"true\">\n        \u003cdiv class=\"bridge-bank left\">\u003c/div>\n        \u003cdiv id=\"bridge-span\" class=\"bridge-span\">\u003c/div>\n        \u003cdiv class=\"bridge-rule\">\u003c/div>\n        \u003cdiv class=\"bridge-bank right\">\u003c/div>\n      \u003c/div>\n      \u003cp id=\"pressure-result\" class=\"pressure-result\" aria-live=\"polite\">\u003c/p>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"succession-problem\">\n        \u003ch2 id=\"succession-problem\">火影之争所映照出的，远非斑一人的权力野心\u003c/h2>\n        \u003cp>柱间推心置腹地期盼斑执掌火影大位，但个人的满腔热忱无法替代制度化的权力架构。扉间坚持依循法定程序推选领袖，具有充分的现代政治正当性：新兴的共同体绝不能沦为两位元勋私相授受的封邑。然而制度的残酷之处在于：对于斑而言，该程序的社会基本盘天然倒向了声望卓著的千手一方；抽象的“公意推选”，在客观上加剧了族群间本就倾斜的话语权失衡。\u003c/p>\n        \u003cp>反观斑自身，亦未能将敏锐的忧患意识转化为具备建设性的制度诉求。他愤而号召宇智波族人出走，却遭到厌战族人的集体冷遇；在此挫败下，他越发固执地笃信唯有自己洞悉真相。正是在这一刻，斑的心态完成了危险的蜕变——从“为全族争夺生存空间”，滑向了“哪怕全族弃我而去，我亦要凭一人之力替苍生决定命运”的专断狂执。\u003c/p>\n        \u003cdiv class=\"comparison\">\n          \u003carticle>\n            \u003ch3>程序的制度盲区\u003c/h3>\n            \u003cp>多数组合的民主程序虽能杜绝元老独裁，却极易使人数、声誉处于劣势的弱势族群陷入永久落败的困境。真正的善治必须辅以严格的少数权益兜底与异议听证机制，而非简单沦为冷酷的“多数人暴政”。\u003c/p>\n          \u003c/article>\n          \u003carticle>\n            \u003ch3>先知者的心理盲区\u003c/h3>\n            \u003cp>洞见未来的潜在风险，绝不赋予任何人强行剥夺他人抉择权的特权。当斑决然否定族人的自主意愿时，他口中对强权支配的抗争，终究不可避免地异化为了对众生的狂妄支配。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"tailed-beast-balance\">\n        \u003ch2 id=\"tailed-beast-balance\">尾兽分配：和平何以沦为大国间的恐怖威慑均势\u003c/h2>\n        \u003cp>柱间以神力平定多只尾兽，并在初代五影会谈中力主将尾兽分发给各大忍村；扉间则力主实行有偿贸易而非无偿施舍。其内在逻辑俨然演变为经典的\u003cspan class=\"term\" tabindex=\"0\">恐怖均势\u003cspan class=\"tooltip\" role=\"tooltip\">各大势力皆掌握足以实施毁灭性打击的大杀器，从而因顾忌同归于尽而不敢轻启战端。它能抑制进攻冲动，却绝无法催生互信。\u003c/span>\u003c/span>机制：并非促使列国由衷相爱，而是使任何一方都无法在战争中全身而退。\u003c/p>\n        \u003cp>这标志着柱间和平路线的现实主义转向：他绝非盲目的理想主义者，而是深谙以雷霆手段为和平划定红线。然而，将拥有自主意识的庞大能量体降格为可交易的战略军资，不仅完全漠视了尾兽本身的情感，更将沉重的制度代价转嫁给了作为活体容器的人柱力。六道羽衣曾郑重赋予尾兽姓名与尊严，承认其为独立生命；而忍村体制却再次倒退，将查克拉生灵彻底兵器化。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>呼应首讲：\u003c/strong>忍宗的初心是借查克拉打破心灵樊篱、实现共鸣；忍村的现实则是借查克拉铸造相互威慑的铁壁。后者固然比丛林血战更具秩序，却在精神实质上彻底偏离了羽衣所期许的心灵羁绊。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"valley-of-the-end\">\n        \u003ch2 id=\"valley-of-the-end\">终结之谷：命运交锋中彼此对立却又互为印证的悲剧\u003c/h2>\n        \u003cp>斑驱使九尾强袭木叶，以惨烈的硝烟证实了柱间的担忧绝非空穴来风：若无捍卫共同体的绝对铁腕，任何凌驾于规矩之上的至强者皆有能力将和平碾得粉碎。而柱间挥剑斩落斑的头颅，则以同样残酷的事实印证了斑的预言并非妄语：一旦集体体制遭受危机，昔日曾许诺心意相通的挚友，终将毫不犹豫地选择捍卫体制，亲手斩断羁绊。\u003c/p>\n        \u003cp>这绝非各打五十大板的虚无主义。斑亲手导演了自己所预言的决裂惨剧，以毁灭村子的极端挑衅逼迫柱间做出绝情裁决；柱间舍身护村具有无可辩驳的正当性。然而整部作品却赋予了这场胜利以无尽的悲凉与残缺感：柱间在物理上终结了斑的狂潮，却在精神上彻底失去了让挚友重归人世光明的可能。\u003c/p>\n        \u003cp>战火平息后，两座顶天立地的石像矗立在断崖两侧结下和解之印。这绝非和平大功告成的丰碑，而是一道凝固在岁月深处的永恒拷问：倘若一个体制的稳固，终究只能依仗更强者在血战中扑灭反叛者来苟延，那么它距离那个野蛮丛林的战国乱世，究竟又走出了多远？\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>承前启后：\u003c/strong>斑假死遁世，在无尽的黑暗中将“现实互信注定破灭”的绝望推演至极境，孕育出宏大的“月之眼计划”：既然世人的自由意志只会滋生背叛与纷争，那便亲手缔造一个没有他者反抗、没有生离死别、亦绝无任何变数的永恒幻梦。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"lesson-check\">\n      \u003cdiv class=\"lab-head\">\n        \u003cdiv>\n          \u003ch2 id=\"lesson-check\">检查理解：判断制度，而不只判断人物\u003c/h2>\n          \u003cp>一次只看一道题。选择后立即得到解释；可以跳过、返回或修改，进度会自动保留。\u003c/p>\n        \u003c/div>\n        \u003cspan class=\"lab-label\">4 个问题\u003c/span>\n      \u003c/div>\n      \u003cdiv id=\"quiz-tabs\" class=\"quiz-tabs\" role=\"tablist\" aria-label=\"问题导航\">\u003c/div>\n      \u003cdiv id=\"quiz-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\n        \u003cdiv class=\"lab-nav-group\">\n          \u003cbutton id=\"quiz-prev\" class=\"button\" type=\"button\">← 上一题\u003c/button>\n          \u003cbutton id=\"quiz-next\" class=\"button primary\" type=\"button\">下一题 →\u003c/button>\n        \u003c/div>\n        \u003cbutton id=\"quiz-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cfooter class=\"lesson-footer\">\n      \u003cdiv class=\"takeaway\">\u003cstrong>核心结语：\u003c/strong>柱间与斑的伟大功绩，是将飘渺的和平宏愿化作了可栖居的木叶城邦；而两人的历史悲剧，则在于未能构筑出一套在元勋互信瓦解后依然能够公平公正运转的体制。木叶斩断了宗族仇杀的旧宿命，却也把力量崇拜、代表权失衡与制度性猜忌深植进了新的共同体血脉之中。\u003c/div>\n      \u003cp class=\"next-lesson\">\u003cstrong>下一讲：斑的幽灵\u003c/strong>且看斑如何在败亡绝境中布局轮回眼与复活大计；琳之死的悲剧何以成为击碎带土精神支柱的致命风暴；以及“月之眼计划”如何将“消除一切不确定性”推向哲学的终极绝境。\u003c/p>\n    \u003c/footer>\n  \u003c/main>\n\n  \u003cscript>\n    (function () {\n      \"use strict\";\n\n      var storagePrefix = \"course:session2:\";\n\n      function readState(key, fallback) {\n        try {\n          var saved = localStorage.getItem(storagePrefix + key);\n          return saved ? JSON.parse(saved) : fallback;\n        } catch (error) {\n          return fallback;\n        }\n      }\n\n      function writeState(key, value) {\n        try {\n          localStorage.setItem(storagePrefix + key, JSON.stringify(value));\n        } catch (error) {\n          // 禁用本地存储时，课程仍可正常阅读与操作。\n        }\n      }\n\n      function clampIndex(index, length) {\n        return Math.max(0, Math.min(length - 1, index));\n      }\n\n      var decisions = [\n        {\n          title: \"最高执政者应如何产生？\",\n          context: \"柱间力主由斑直接出任初代火影；扉间则坚持通过制度程序推选领导人。\",\n          options: [\n            { text: \"由两位元勋私下协商指定\", note: \"决断极其高效，亦能践行建村盟约；然而最高权力的合法性仍牢牢依附于私人交情。\", scores: [3, 1, 0] },\n            { text: \"付诸程序公选，并为落选阵营设立法定议席与异议复核权\", note: \"程序运作虽趋于繁琐，却能从制度上保障落选群体不致被永久放逐边缘。\", scores: [1, 3, 3] }\n          ]\n        },\n        {\n          title: \"村落治安与安保权柄应归于何方？\",\n          context: \"草创初期的木叶既需强力压制族群摩擦，又必须防范特定宗族陷入‘受猜忌却无处申诉’的死局。\",\n          options: [\n            { text: \"全权委任最强单一种族独立执掌\", note: \"指挥链条明晰强悍；然而执法公权力极易与宗族私利产生不可调和的混淆与偏袒。\", scores: [3, 0, 1] },\n            { text: \"组建跨族联合执法机构，并设立独立监察与申诉通道\", note: \"协调与博弈成本骤增，但能有效防范公权私用，赋予体制强大的自我纠错韧性。\", scores: [1, 3, 3] }\n          ]\n        },\n        {\n          title: \"当元老提出公开异议时，该如何应对？\",\n          context: \"斑频频警告宇智波终将被千手体制边缘化，其警示虽切中隐患，亦夹杂着个人的权力焦灼。\",\n          options: [\n            { text: \"以大局为重强令噤声；大战初定，公开内耗将瓦解公信力\", note: \"短期内可迅速扑灭恐慌情绪；但从长远来看，被窒息的异见终将在制度的高墙之外以毁灭性方式爆发。\", scores: [3, 0, 0] },\n            { text: \"要求出具凭据，启动具有法律时效的专项公开听证\", note: \"正视预警背后合理的制度忧虑，同时绝不容许任何个体凭借个人威望凌驾于公议之上。\", scores: [1, 3, 3] }\n          ]\n        },\n        {\n          title: \"至尊战略力量（尾兽）当如何处置？\",\n          context: \"木叶坐拥压倒性的尾兽资源。独占或能固化木叶霸权，均分则可能缔造列国间的相互威慑。\",\n          options: [\n            { text: \"由木叶集中独占并铸造战略威慑\", note: \"能极大夯实木叶当下的绝对安全；却必然刺激周边邻国陷入恐慌性军备竞赛或缔结反木叶同盟。\", scores: [3, 0, 0] },\n            { text: \"签署多边条约有偿均分，并设立常态化多边监督机制\", note: \"有效抚平了列国对霸权的恐惧；但也意味着将毁灭性的大杀器亲手交到了潜在对手手中。\", scores: [1, 2, 2] }\n          ]\n        }\n      ];\n\n      var decisionState = readState(\"founding-table:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(decisionState.current)) decisionState.current = 0;\n      decisionState.current = clampIndex(decisionState.current, decisions.length);\n      decisionState.answers = decisionState.answers || {};\n      decisionState.skipped = Array.isArray(decisionState.skipped) ? decisionState.skipped : [];\n\n      function saveDecisions() {\n        writeState(\"founding-table:v1\", decisionState);\n      }\n\n      function goToDecision(index) {\n        decisionState.current = clampIndex(index, decisions.length);\n        saveDecisions();\n        renderDecisions();\n      }\n\n      function chooseDecision(decisionIndex, optionIndex) {\n        decisionState.answers[decisionIndex] = optionIndex;\n        decisionState.skipped = decisionState.skipped.filter(function (index) { return index !== decisionIndex; });\n        saveDecisions();\n        renderDecisions();\n      }\n\n      function skipDecision() {\n        var current = decisionState.current;\n        if (!Object.prototype.hasOwnProperty.call(decisionState.answers, current) && decisionState.skipped.indexOf(current) === -1) {\n          decisionState.skipped.push(current);\n        }\n        decisionState.current = current \u003c decisions.length - 1 ? current + 1 : 0;\n        saveDecisions();\n        renderDecisions();\n      }\n\n      function renderDecisionTabs() {\n        var tabs = document.getElementById(\"decision-tabs\");\n        tabs.innerHTML = \"\";\n        decisions.forEach(function (decision, index) {\n          var tab = document.createElement(\"button\");\n          tab.type = \"button\";\n          tab.className = \"step-tab\";\n          if (Object.prototype.hasOwnProperty.call(decisionState.answers, index)) tab.classList.add(\"answered\");\n          if (decisionState.skipped.indexOf(index) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\");\n          tab.setAttribute(\"aria-selected\", index === decisionState.current ? \"true\" : \"false\");\n          tab.setAttribute(\"aria-controls\", \"decision-\" + index);\n          tab.textContent = \"议题 \" + (index + 1);\n          tab.addEventListener(\"click\", function () { goToDecision(index); });\n          tabs.appendChild(tab);\n        });\n      }\n\n      function renderDecisionPanels() {\n        var panels = document.getElementById(\"decision-panels\");\n        panels.innerHTML = \"\";\n        decisions.forEach(function (decision, decisionIndex) {\n          var panel = document.createElement(\"section\");\n          panel.id = \"decision-\" + decisionIndex;\n          panel.className = \"decision-panel\";\n          panel.setAttribute(\"role\", \"tabpanel\");\n          panel.hidden = decisionIndex !== decisionState.current;\n\n          var count = document.createElement(\"div\");\n          count.className = \"step-count\";\n          count.textContent = \"创村议题 \" + (decisionIndex + 1) + \" / \" + decisions.length;\n\n          var title = document.createElement(\"h3\");\n          title.className = \"decision-title\";\n          title.textContent = decision.title;\n\n          var context = document.createElement(\"p\");\n          context.className = \"decision-context\";\n          context.textContent = decision.context;\n\n          var options = document.createElement(\"div\");\n          options.className = \"options\";\n          decision.options.forEach(function (choice, optionIndex) {\n            var label = document.createElement(\"label\");\n            label.className = \"option\";\n            var input = document.createElement(\"input\");\n            input.type = \"radio\";\n            input.name = \"decision-\" + decisionIndex;\n            input.value = String(optionIndex);\n            input.checked = Number(decisionState.answers[decisionIndex]) === optionIndex;\n            input.addEventListener(\"change\", function () { chooseDecision(decisionIndex, optionIndex); });\n            var text = document.createElement(\"span\");\n            text.className = \"option-text\";\n            text.textContent = choice.text;\n            var note = document.createElement(\"span\");\n            note.className = \"option-note\";\n            note.textContent = choice.note;\n            text.appendChild(note);\n            label.append(input, text);\n            options.appendChild(label);\n          });\n\n          var feedback = document.createElement(\"div\");\n          feedback.className = \"decision-feedback\";\n          feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = decisionState.answers[decisionIndex];\n          if (selected === undefined) {\n            feedback.textContent = decisionState.skipped.indexOf(decisionIndex) !== -1\n              ? \"这项已暂时跳过。制度的空白本身也会留下风险，你可以随时回来补选。\"\n              : \"选择后，三项制度指标会立即变化。这里没有唯一正确答案。\";\n          } else {\n            feedback.textContent = \"你的取舍：\" + decision.options[Number(selected)].note;\n          }\n          panel.append(count, title, context, options, feedback);\n          panels.appendChild(panel);\n        });\n      }\n\n      function updateDecisionScores() {\n        var totals = [0, 0, 0];\n        var answered = 0;\n        Object.keys(decisionState.answers).forEach(function (key) {\n          var decisionIndex = Number(key);\n          var optionIndex = Number(decisionState.answers[key]);\n          var choice = decisions[decisionIndex] && decisions[decisionIndex].options[optionIndex];\n          if (!choice) return;\n          answered += 1;\n          choice.scores.forEach(function (score, index) { totals[index] += score; });\n        });\n\n        var ids = [\"stability\", \"legitimacy\", \"resilience\"];\n        ids.forEach(function (id, index) {\n          var maximum = Math.max(1, answered * 3);\n          var percent = answered ? Math.round((totals[index] / maximum) * 100) : 0;\n          document.getElementById(\"score-\" + id).style.width = percent + \"%\";\n          document.getElementById(\"score-\" + id + \"-text\").textContent = answered ? percent + \" / 100\" : \"等待选择\";\n        });\n\n        var summary = document.getElementById(\"score-summary\");\n        if (answered === 0) {\n          summary.textContent = \"请开启首项建村议题决策，审视你的和平构想会将治理风险转嫁于何处。\";\n        } else if (totals[0] > totals[1] + 2) {\n          summary.textContent = \"你的决策侧重于以铁腕迅速扑灭眼前乱局。此举极适于战后维稳，但需高度警惕：被强力压制的阶层异见，极可能在元老威权消退后发生毁灭性反噬。\";\n        } else if (totals[1] >= totals[0] && totals[2] >= totals[0]) {\n          summary.textContent = \"你的决策宁愿让渡决策效率，亦要坚守程序的正义认同与纠错韧性。其真正的挑战在于：当生死存亡的至暗时刻降临，复杂的体制程序能否做出足够迅速的决断？\";\n        } else {\n          summary.textContent = \"你的决策在高效集权与民主协商之间达成了审慎的折中。真正的危机将在多重目标激烈冲突时爆发：当常规程序瘫痪，究竟由谁来执掌紧急裁量之剑？\";\n        }\n      }\n\n      function updateDecisionNavigation() {\n        document.getElementById(\"decision-prev\").disabled = decisionState.current === 0;\n        document.getElementById(\"decision-next\").textContent = decisionState.current === decisions.length - 1 ? \"回到第一项 ↺\" : \"下一项 →\";\n      }\n\n      function renderDecisions() {\n        renderDecisionTabs();\n        renderDecisionPanels();\n        updateDecisionScores();\n        updateDecisionNavigation();\n      }\n\n      document.getElementById(\"decision-prev\").addEventListener(\"click\", function () { goToDecision(decisionState.current - 1); });\n      document.getElementById(\"decision-next\").addEventListener(\"click\", function () {\n        goToDecision(decisionState.current === decisions.length - 1 ? 0 : decisionState.current + 1);\n      });\n      document.getElementById(\"decision-skip\").addEventListener(\"click\", skipDecision);\n      renderDecisions();\n\n      var pressureRange = document.getElementById(\"pressure-range\");\n      pressureRange.value = String(readState(\"bridge-pressure:v1\", 35));\n\n      function updatePressure() {\n        var value = Number(pressureRange.value);\n        var bridgeSpan = document.getElementById(\"bridge-span\");\n        var result = document.getElementById(\"pressure-result\");\n        writeState(\"bridge-pressure:v1\", value);\n\n        if (value \u003c 30) {\n          bridgeSpan.style.transform = \"rotate(0deg)\";\n          bridgeSpan.style.background = \"var(--sage)\";\n          result.textContent = \"初创温情期：共同的理想与深厚的私人情谊足以化解初期分歧。南贺川畔的少年之约在这一阶段坚实有效。\";\n        } else if (value \u003c 65) {\n          bridgeSpan.style.transform = \"rotate(1.5deg)\";\n          bridgeSpan.style.background = \"var(--gold)\";\n          result.textContent = \"利益拉扯期：领袖选举、战后抚恤与权力重组开始剧烈撕扯互信纽带。此时底部的制度支柱至关重要，它决定了政治异见能否被程序化解，而非激化为阵营对立。\";\n        } else {\n          bridgeSpan.style.transform = \"rotate(6deg)\";\n          bridgeSpan.style.background = \"var(--accent)\";\n          result.textContent = \"高压危机期：仅凭‘往昔情分’已无法支撑沉重的政治重荷。若体制无法给落选者以安全感、对当政者以制衡，私人互信的崩塌便将直接演化为共同体的分崩离析。\";\n        }\n      }\n\n      positionRange.addEventListener(\"input\", updatePressure);\n      updatePressure();\n\n      var questions = [\n        {\n          title: \"何以认定木叶隐村的创立是一次划时代的历史成功？\",\n          options: [\n            { text: \"因为它从根本上彻底终结了忍界的一切战祸。\", help: \"各大忍村建立后，彼此间依然爆发了惨烈连绵的数次忍界大战。\" },\n            { text: \"因为它使世仇宗族得以共建超越血缘的城邦，并斩断了孩童自幼被迫承袭战火的枷锁。\", help: \"体制的历史进步性可以是局部而真实的，绝非要求它一劳永逸地解决所有终极矛盾。\" },\n            { text: \"因为斑借此赢得了宇智波全族至死不渝的拥戴。\", help: \"在斑决意出走木叶时，安于现状的宇智波全族无一人选择追随。\" }\n          ],\n          answer: 1,\n          feedback: [\n            \"木叶成功终结了宗族仇杀，却未能消灭战争本身；村落间的地缘博弈随后激化为规模更浩大的忍界大战。\",\n            \"解析正确：木叶极大拓展了政治身份认同的边界，赋予和平以可居住、可传承的实体制度依托。\",\n            \"事实恰恰相反：宇智波族人执意扎根木叶，正是斑在政治上陷入孤立的关键转折。\"\n          ]\n        },\n        {\n          title: \"初代火影的选举何以暴露出草创体制的深层隐患？\",\n          options: [\n            { text: \"因为一切投票选举在本质上皆是虚伪的形式主义。\", help: \"程序运作固然可能产生偏差，但绝不能全盘否定制度化推举的民主正当性。\" },\n            { text: \"因为柱间打心底里排斥斑分享木叶的最高权柄。\", help: \"柱间曾多次由衷极力推举斑直接执掌初代火影大位。\" },\n            { text: \"因为程序规范虽杜绝了私相授受，却未能从制度上保障落选少数族群的长远权益与代表性。\", help: \"多数决的程序公选与少数族群的利益兜底，解决的是两个不同维度的政治课题。\" }\n          ],\n          answer: 2,\n          feedback: [\n            \"此论过度偏激。程序推举具有其合法性价值，关键缺失在于未曾配套少数群体的申诉与制衡保障。\",\n            \"柱间曾极力举荐斑。症结绝非领袖个人的胸襟愿景，而在于如何将善意固化为可持续的制度保障。\",\n            \"解析正确：一次程序上的胜负，绝不等于落选族群的长期政治代表权能自发获得守护。\"\n          ]\n        },\n        {\n          title: \"柱间与斑在和平理念上的根本分歧究竟何在？\",\n          options: [\n            { text: \"柱间是绝对的和平主义者，而斑则是纯粹的武力信徒。\", help: \"柱间在危急关头同样会动用压倒性伟力卫村；斑在早年亦对坦诚相待的羁绊怀有至纯向往。\" },\n            { text: \"柱间坦然直面现实的不确定性并力求包容治理；斑则企图以绝对伟力彻底扼杀一切变数。\", help: \"此处的不确定性涵盖了人心背叛、生离死别、政治异见以及权力更迭等全部生命变量。\" },\n            { text: \"两人自始至终不过是在意气用事地争夺天下第一的虚名。\", help: \"绝顶战力的对撞只是叙事表象，其内核承载着两种截然对立的救世和平纲领。\" }\n          ],\n          answer: 1,\n          feedback: [\n            \"两人皆手握神力，亦皆曾向往真诚互信。真正的分水岭在于如何应对‘互信可能遭遇背叛’的风险。\",\n            \"解析正确：柱间尊重个体独立意志及其伴生的动荡风险；而斑最终滑向了将风险连同意志一并抹杀的极端。\",\n            \"战力高下仅是表象，终结之谷决斗的实质，是两种关乎人类命运的和平构想在现实舞台上的生死对撞。\"\n          ]\n        },\n        {\n          title: \"柱间在五影会谈中分配尾兽的举措，最深刻地折射出什么？\",\n          options: [\n            { text: \"以恐怖均势抬高侵略门槛，虽未能天然滋养互信，更在客观上将尾兽与人柱力彻底工具化。\", help: \"战略威慑固然能够遏制盲动的侵略行径，却绝无法催生发自内心的互信与共情。\" },\n            { text: \"六道仙人的忍宗理想终于在五大忍村的结盟中迎来了圆满实现。\", help: \"忍宗所追求的是以查克拉连结彼此心灵，绝非将拥有神性的尾兽降格为战略博弈资产。\" },\n            { text: \"只要各大国军备维持均势，战争便在逻辑层面上被彻底消除。\", help: \"恐怖均势仅能改变战争爆发的成本代价值，绝无法消除战略误判、安全恐慌与扩军冲动。\" }\n          ],\n          answer: 0,\n          feedback: [\n            \"解析正确：这是一套冷峻的地缘安全妥协，却在本质上再度将具有神性的查克拉生命降格为战略兵器。\",\n            \"事实恰恰相反：将尾兽作为筹码进行地缘分割，昭示着忍宗崇尚的心灵联结已彻底沦为大国军备博弈的工具。\",\n            \"均势至多只能提高发动战端的成本代价；后续连绵的忍界大战雄辩地证明，单纯的军备平衡绝非永久和平的解药。\"\n          ]\n        }\n      ];\n\n      var quizState = readState(\"quiz:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(quizState.current)) quizState.current = 0;\n      quizState.current = clampIndex(quizState.current, questions.length);\n      quizState.answers = quizState.answers || {};\n      quizState.skipped = Array.isArray(quizState.skipped) ? quizState.skipped : [];\n\n      function saveQuiz() {\n        writeState(\"quiz:v1\", quizState);\n      }\n\n      function goToQuestion(index) {\n        quizState.current = clampIndex(index, questions.length);\n        saveQuiz();\n        renderQuiz();\n      }\n\n      function answerQuestion(questionIndex, optionIndex) {\n        quizState.answers[questionIndex] = optionIndex;\n        quizState.skipped = quizState.skipped.filter(function (index) { return index !== questionIndex; });\n        saveQuiz();\n        renderQuiz();\n      }\n\n      function skipQuestion() {\n        var current = quizState.current;\n        if (!Object.prototype.hasOwnProperty.call(quizState.answers, current) && quizState.skipped.indexOf(current) === -1) {\n          quizState.skipped.push(current);\n        }\n        quizState.current = current \u003c questions.length - 1 ? current + 1 : 0;\n        saveQuiz();\n        renderQuiz();\n      }\n\n      function renderQuizTabs() {\n        var tabs = document.getElementById(\"quiz-tabs\");\n        tabs.innerHTML = \"\";\n        questions.forEach(function (question, index) {\n          var tab = document.createElement(\"button\");\n          tab.type = \"button\";\n          tab.className = \"quiz-tab\";\n          if (Object.prototype.hasOwnProperty.call(quizState.answers, index)) tab.classList.add(\"answered\");\n          if (quizState.skipped.indexOf(index) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\");\n          tab.setAttribute(\"aria-selected\", index === quizState.current ? \"true\" : \"false\");\n          tab.setAttribute(\"aria-controls\", \"question-\" + index);\n          tab.textContent = String(index + 1);\n          tab.addEventListener(\"click\", function () { goToQuestion(index); });\n          tabs.appendChild(tab);\n        });\n      }\n\n      function renderQuizPanels() {\n        var panels = document.getElementById(\"quiz-panels\");\n        panels.innerHTML = \"\";\n        questions.forEach(function (question, questionIndex) {\n          var panel = document.createElement(\"section\");\n          panel.id = \"question-\" + questionIndex;\n          panel.className = \"question-panel\";\n          panel.setAttribute(\"role\", \"tabpanel\");\n          panel.hidden = questionIndex !== quizState.current;\n\n          var count = document.createElement(\"div\");\n          count.className = \"question-count\";\n          count.textContent = \"问题 \" + (questionIndex + 1) + \" / \" + questions.length;\n          var title = document.createElement(\"h3\");\n          title.className = \"question-title\";\n          title.textContent = question.title;\n          var options = document.createElement(\"div\");\n          options.className = \"options\";\n\n          question.options.forEach(function (choice, optionIndex) {\n            var label = document.createElement(\"label\");\n            label.className = \"option\";\n            var input = document.createElement(\"input\");\n            input.type = \"radio\";\n            input.name = \"question-\" + questionIndex;\n            input.value = String(optionIndex);\n            input.checked = Number(quizState.answers[questionIndex]) === optionIndex;\n            input.addEventListener(\"change\", function () { answerQuestion(questionIndex, optionIndex); });\n            var text = document.createElement(\"span\");\n            text.className = \"option-text\";\n            text.appendChild(document.createTextNode(choice.text + \" \"));\n            var help = document.createElement(\"span\");\n            help.className = \"term\";\n            help.tabIndex = 0;\n            help.textContent = \"为什么？\";\n            var tooltip = document.createElement(\"span\");\n            tooltip.className = \"tooltip\";\n            tooltip.setAttribute(\"role\", \"tooltip\");\n            tooltip.textContent = choice.help;\n            help.appendChild(tooltip);\n            text.appendChild(help);\n            label.append(input, text);\n            options.appendChild(label);\n          });\n\n          var feedback = document.createElement(\"div\");\n          feedback.className = \"answer-feedback\";\n          feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = quizState.answers[questionIndex];\n          if (selected === undefined) {\n            feedback.textContent = quizState.skipped.indexOf(questionIndex) !== -1\n              ? \"这题已暂时跳过。你可以随时回来选择答案。\"\n              : \"选择后会立即看到解释；也可以先用选项后的‘为什么？’查看概念提示。\";\n          } else {\n            var isCorrect = Number(selected) === question.answer;\n            feedback.classList.add(isCorrect ? \"correct\" : \"incorrect\");\n            feedback.textContent = question.feedback[Number(selected)];\n          }\n          panel.append(count, title, options, feedback);\n          panels.appendChild(panel);\n        });\n      }\n\n      function updateQuizNavigation() {\n        document.getElementById(\"quiz-prev\").disabled = quizState.current === 0;\n        document.getElementById(\"quiz-next\").textContent = quizState.current === questions.length - 1 ? \"回到第一题 ↺\" : \"下一题 →\";\n      }\n\n      function renderQuiz() {\n        renderQuizTabs();\n        renderQuizPanels();\n        updateQuizNavigation();\n      }\n\n      document.getElementById(\"quiz-prev\").addEventListener(\"click\", function () { goToQuestion(quizState.current - 1); });\n      document.getElementById(\"quiz-next\").addEventListener(\"click\", function () {\n        goToQuestion(quizState.current === questions.length - 1 ? 0 : quizState.current + 1);\n      });\n      document.getElementById(\"quiz-skip\").addEventListener(\"click\", skipQuestion);\n      renderQuiz();\n    }());\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session3.html","basePath":"session3.html","lang":"zh-CN","kind":"lesson","title":"月之眼的说服链","translations":{"zh-CN":"session3.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"月之眼的说服链\">\n  \u003ctitle>斑的幽灵：月之眼计划如何借带土进入现实｜火影忍者的政治哲学\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f6f1e7;\n      --paper-deep: #ebe1cf;\n olor: var(--muted); font-size: .92rem; }\n\n    .lab { margin: 2.5rem 0; padding: clamp(1.1rem, 3vw, 1.8rem); border: 1px solid var(--line); border-radius: 1rem; background: var(--card); box-shadow: var(--shadow); }\n    .lab-head { display: flex; align-items: start; justify-content: space-between; gap: 1rem; margin-bottom: 1.3rem; }\n    .lab-head h2, .lab-head h3 { margin: 0; }\n    .lab-head p { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }\n    .lab-label { flex: 0 0 auto; padding: .22rem .55rem; border-radius: 999px; color: var(--accent-dark); background: var(--accent-soft); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .72rem; font-weight: 700; }\n    .chain-list { display: grid; gap: .65rem; }\n    .chain-item { display: grid; grid-template-columns: 2.3rem 1fr auto; align-items: center; gap: .8rem; padding: .8rem; border: 1px solid var(--line); border-radius: .65rem; background: var(--white); }\n    .chain-number { display: grid; width: 2.1rem; height: 2.1rem; place-items: center; border-radius: 50%; color: var(--white); background: var(--accent); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .82rem; font-weight: 750; }\n    .chain-text { font-size: .94rem; line-height: 1.5; }\n    .chain-actions, .lab-actions, .lab-nav-group { display: flex; flex-wrap: wrap; gap: .55rem; }\n    .lab-actions { align-items: center; margin-top: 1rem; }\n    .icon-button, .button { border: 1px solid var(--line); background: var(--white); cursor: pointer; }\n    .icon-button { width: 2rem; height: 2rem; border-radius: .45rem; font-family: ui-sans-serif, system-ui, sans-serif; line-height: 1; }\n    .button { padding: .55rem .9rem; border-radius: .55rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; font-weight: 650; }\n    .icon-button:hover:not(:disabled), .button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }\n    .button.primary { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .button.primary:hover:not(:disabled) { color: var(--white); background: var(--accent-dark); }\n    .button:disabled, .icon-button:disabled { opacity: .35; cursor: default; }\n    .feedback { min-height: 1.6rem; color: var(--muted); font-size: .9rem; }\n    .feedback.success { color: #3f6744; }\n    .feedback.try-again { color: var(--accent-dark); }\n\n    .step-tabs, .quiz-tabs { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.25rem; }\n    .step-tab, .quiz-tab { min-width: 2.35rem; padding: .38rem .7rem; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8rem; }\n    .step-tab[aria-selected=\"true\"], .quiz-tab[aria-selected=\"true\"] { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .step-tab.answered:not([aria-selected=\"true\"]), .quiz-tab.answered:not([aria-selected=\"true\"]) { border-color: var(--sage); color: #46503f; background: var(--sage-soft); }\n    .step-tab.skipped:not([aria-selected=\"true\"]), .quiz-tab.skipped:not([aria-selected=\"true\"]) { border-style: dashed; }\n    .argument-panel[hidden], .question-panel[hidden] { display: none; }\n    .step-count, .question-count { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; }\n    .argument-claim { margin: .5rem 0 1rem; padding: 1rem 1.1rem; border-left: 4px solid var(--gold); background: var(--gold-soft); font-size: 1.06rem; }\n    .question-title { margin: .35rem 0 1rem; font-size: 1.14rem; }\n    .options { display: grid; gap: .65rem; }\n    .option { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; padding: .8rem .9rem; border: 1px solid var(--line); border-radius: .65rem; background: var(--white); cursor: pointer; }\n    .option:hover { border-color: var(--accent); }\n    .option:has(input:checked) { border-color: var(--accent); background: #fbf0eb; }\n    .option input { margin-top: .35rem; accent-color: var(--accent); }\n    .option-text { line-height: 1.5; }\n    .answer-feedback { min-height: 4.7rem; margin-top: .85rem; padding: .85rem 1rem; border-radius: .65rem; color: var(--muted); background: var(--paper-deep); font-size: .9rem; }\n    .answer-feedback.correct { color: #365d3a; background: var(--sage-soft); }\n    .answer-feedback.incorrect { color: var(--accent-dark); background: var(--accent-soft); }\n    .lab-nav { display: flex; justify-content: space-between; gap: .75rem; margin-top: 1rem; }\n\n    .engine-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1rem; margin: 1.5rem 0; }\n    .engine-card { padding: 1.25rem; border: 1px solid var(--line); border-radius: .8rem; background: var(--card); }\n    .engine-card h3 { margin-top: 0; }\n    .engine-card:first-child { border-top: 4px solid var(--accent); }\n    .engine-card:last-child { border-top: 4px solid var(--sage); }\n    .engine-card p { color: var(--muted); font-size: .92rem; }\n\n    .ledger-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1.2rem; }\n    .dream-controls { display: grid; gap: .65rem; }\n    .dream-toggle { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; padding: .85rem; border: 1px solid var(--line); border-radius: .65rem; background: var(--white); cursor: pointer; }\n    .dream-toggle:has(input:checked) { border-color: var(--accent); background: #fbf0eb; }\n    .dream-toggle input { margin-top: .35rem; accent-color: var(--accent); }\n    .dream-toggle strong { display: block; }\n    .dream-toggle span { color: var(--muted); font-size: .82rem; }\n    .ledger-result { padding: 1rem 1.1rem; border-radius: .75rem; background: var(--paper-deep); }\n    .ledger-result h3 { margin: 0 0 .7rem; }\n    .ledger-list { margin: 0; padding-left: 1.15rem; }\n    .ledger-list li { color: var(--muted); font-size: .9rem; }\n    .ledger-summary { margin: 1rem 0 0; padding-top: .85rem; border-top: 1px solid var(--line); font-weight: 650; }\n\n    .lesson-footer { margin-top: 4.5rem; padding-top: 2rem; border-top: 1px solid var(--line); }\n    .takeaway { padding: 1.4rem 1.5rem; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 1.05rem; }\n    .next-lesson { margin-top: 2rem; color: var(--muted); }\n    .next-lesson strong { display: block; color: var(--ink); font-size: 1.1rem; }\n\n    @media (max-width: 760px) {\n      body { font-size: 16px; }\n      .content { width: min(100% - 2rem, 88ch); padding-top: 1.2rem; }\n      .learning-goals, .thesis-grid, .engine-grid, .ledger-grid { grid-template-columns: 1fr; }\n      .thesis-card { min-height: 0; }\n      .layer { grid-template-columns: 1fr; gap: .25rem; }\n      .tooltip { position: fixed; inset: auto 1rem 1rem; width: auto; transform: translateY(.3rem); }\n      .term:hover .tooltip, .term:focus .tooltip { transform: translateY(0); }\n      .chain-item { grid-template-columns: 2rem 1fr; }\n      .chain-actions { grid-column: 2; }\n      .lab-head { display: block; }\n      .lab-label { display: inline-block; margin-top: .6rem; }\n      .lab-nav { flex-direction: column; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      html { scroll-behavior: auto; }\n      .tooltip { transition: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cnav class=\"topbar\" aria-label=\"课程导航\">\n      \u003cdiv class=\"topbar-links\">\u003ca href=\"session2.html\">← 上一讲\u003c/a>\u003ca href=\"syllabus.html\">课程大纲\u003c/a>\u003c/div>\n      \u003cspan class=\"lesson-count\">第 3 讲 / 共 7 讲\u003c/span>\n    \u003c/nav>\n\n    \u003cheader class=\"lesson-header\">\n      \u003cp class=\"eyebrow\">第三讲 · 幻境\u003c/p>\n      \u003ch1>斑的幽灵\u003c/h1>\n      \u003cp class=\"lede\">终结之谷的败北，并未宣告斑之救世构想的终结。他将自己的魔瞳、尊号与哲学论证拆解托付给后来者，使一个迟暮老者的遗恨蜕变为跨越数十载的庞大工程。后人所承袭的绝非廉价的“反派恶意”，而是一套看似无懈可击的悲剧推演：爱必然滋生失去，失去必然化为人间地狱，因而唯有借由永恒的幻梦，方能彻底庇护心中的挚爱。\u003c/p>\n      \u003cdiv class=\"lesson-meta\" aria-label=\"本课信息\">\u003cspan>约 30 分钟\u003c/span>\u003cspan>因果与论证\u003c/span>\u003cspan>深度复盘\u003c/span>\u003c/div>\n      \u003cblockquote class=\"opening-question\">带着一个问题出发：若有一个世界能许诺你永无离别之苦，代价却是其中的“他者”彻底丧失对你说“不”的自由——那究竟是失而复得的真爱，还是一场唯你独存的囚笼幻梦？\u003c/blockquote>\n      \u003cdiv class=\"learning-goals\" aria-label=\"学习目标\">\n        \u003cdiv class=\"goal\">\u003cstrong>01\u003c/strong>\u003cspan>理清斑、带土与长门跨代接力的战略分工\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>02\u003c/strong>\u003cspan>剖析琳之死事件中“幕后操弄”、“主体抉择”与“认知推演”的三重层次\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>03\u003c/strong>\u003cspan>洞悉“月之眼计划”逻辑闭环背后所隐匿的沉重代价\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"answer-first\">\n        \u003ch2 id=\"answer-first\">开篇立论：斑并未诱使带土拥抱邪恶，而是彻底瓦解了他对现实的信念\u003c/h2>\n        \u003cp>带土的堕落，绝非源于他对人世突然变得麻木冷酷。恰恰相反，他对琳、卡卡西以及昔日立志成为火影的赤诚自我，依然怀揣着刻骨铭心的执念。斑最高超的攻心之处，在于将这份深沉的爱重新诠释为刺向现实的铁证：\u003cstrong>你对羁绊愈是珍视，残酷的现实便愈有能力用生离死别将你彻底击碎。\u003c/strong>\u003c/p>\n        \u003cp>由此，“月之眼计划”绝非庸俗的征服世界狂想，而是一场声势浩大的形而上救赎。它承诺借由\u003cspan class=\"term\" tabindex=\"0\">无限月读\u003cspan class=\"tooltip\" role=\"tooltip\">将轮回写轮眼投射至月球表面，使全人类陷入量身定制的理想幻境之终极幻术。斑坚信这是万世太平之法；实则被黑绝暗中用作复活辉夜的降临仪式。\u003c/span>\u003c/span>，使众生各自沉浸于心想事成的完满梦境。在斑与带土的哲学构想中，世间的痛苦无法在共同生活中达成和解，唯有在彻底消解“共同现实”的前提下，方能迎来苦难的永恒终结。\u003c/p>\n        \u003cdiv class=\"thesis-grid\">\n          \u003carticle class=\"thesis-card\">\u003ch3>斑：构建底层技术架构\u003c/h3>\u003cp>布局轮回眼、外道魔像、白绝大军、篡改碑文以及转生复活机制，为救世宏图铺就可执行的技术路径。\u003c/p>\u003c/article>\n          \u003carticle class=\"thesis-card\">\u003ch3>带土：构筑前台执行网络\u003c/h3>\u003cp>假托“宇智波斑”之尊号掀起九尾之乱、暗控雾隐血雾、幕后操盘“晓”组织，将地下阴谋推演为席卷忍界的生存危机。\u003c/p>\u003c/article>\n          \u003carticle class=\"thesis-card\">\u003ch3>长门：提供核心战略战力\u003c/h3>\u003cp>承接被移植的轮回眼并执掌“晓”之主力，使尾兽兵器化捕获与轮回天生复活大计具备了实施可能。\u003c/p>\u003c/article>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>核心脉络：\u003c/strong>斑之幽灵的真正可怕之处，绝非亡魂在冥界发号施令，而是他将一套救世纲领精密拆解为技术蓝图、政治符号与创伤解释学，交由被命运捉弄的后人各自接力推演。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"madara-survives\">\n        \u003ch2 id=\"madara-survives\">第一步：将一场军事败局转化为跨越世代的长期布局\u003c/h2>\n        \u003cp>终结之谷大战前夕，斑已在右眼预先封印了禁术\u003cspan class=\"term\" tabindex=\"0\">伊邪那岐\u003cspan class=\"tooltip\" role=\"tooltip\">以牺牲一只写轮眼光明为代价，将遭受致命伤的不利现实强行改写为梦境幻象的宇智波终极禁术。斑以此在战死后成功假死假寐复活。\u003c/span>\u003c/span>，并在厮杀中撕咬下柱间的血肉。假死遁世后，他将柱间细胞移植己身，直至垂暮风烛残年，方才在阴阳调和中融合因陀罗与阿修罗之力，觉醒了传说的“轮回眼”。\u003c/p>\n        \u003cp>斑深知血肉之躯的寿命大限。他将这双神瞳秘密移植给尚在襁褓的长门，依仗外道魔像维系残喘生机，培植白绝军团，静待能够承袭衣钵的代行者。在此刻，他的战略思维发生了质的飞跃：从早年追求“以一己之躯称霸当世”，升华为“设计一套纵使自身身死道消、亦能自主运转直至终局的自动化系统”。\u003c/p>\n        \u003caside class=\"canon-note\">\u003cstrong>更高维度的历史盲区：\u003c/strong>斑自以为黑绝乃自身意志的造物，自以为石碑铭刻的是宇智波的救世秘辛；实则碑文早遭黑绝篡改。斑自居为棋盘上的执棋至尊，在终极意义上却亦是他人千年复活棋局中的一枚棋子。\u003c/aside>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"plan-chain\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"plan-chain\">战略重构：理清斑跨越生死的因果之网\u003c/h2>\u003cp>请调整下列五个战略节点的时序。透过时间的迷雾，洞察每一个阶段如何为后续布局奠定基石。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">因果排序\u003c/span>\u003c/div>\n      \u003cdiv id=\"chain-list\" class=\"chain-list\" aria-live=\"polite\">\u003c/div>\n      \u003cdiv class=\"lab-actions\">\u003cbutton id=\"chain-check\" class=\"button primary\" type=\"button\">检查顺序\u003c/button>\u003cbutton id=\"chain-reset\" class=\"button\" type=\"button\">重新打乱\u003c/button>\u003cspan id=\"chain-feedback\" class=\"feedback\">\u003c/span>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"rin-death\">\n        \u003ch2 id=\"rin-death\">第二步：琳之死非为命运偶合，而是一场精心策划的认知围猎\u003c/h2>\n        \u003cp>在神无毗桥战役中重创濒死的带土，将左眼写轮眼郑重托付卡卡西，抱定了为同伴牺牲的觉悟。在被斑从幽冥边缘救回后，带土对“月之眼”的虚无之论嗤之以鼻；他执拗地深信，只要回到珍视的同伴身边，这方满目疮痍的现实人间便依然值得眷恋与守护。斑深知，苍白的哲理说教无法动摇这颗赤子之心，唯有让现实“亲手”将这份信念碾得粉碎。\u003c/p>\n        \u003cp>雾隐暗部将三尾强行封入琳体内，图谋借其返回木叶之机引爆暴乱。为粉碎敌国阴谋、捍卫木叶家园，琳在千钧一发之际主动迎向卡卡西击向敌人的雷切。狂奔而至的带土，目睹的正是这人间至惨的一幕：挚友的手臂生生贯穿了心爱少女的胸膛。斑在日后坦承，这出惨剧正是他为彻底粉碎带土心智而一手导演的攻心死局。\u003c/p>\n        \u003cdiv class=\"layer-stack\" aria-label=\"琳之死的三层因果\">\n          \u003carticle class=\"layer\">\u003cstrong>第一层：操弄机制\u003c/strong>\u003cp>斑在幕后运筹帷幄、挑唆雾隐布局，并精密掌控时机，确保带土在最容易滑向绝望的刹那目睹惨剧。\u003c/p>\u003c/article>\n          \u003carticle class=\"layer\">\u003cstrong>第二层：主观抉择\u003c/strong>\u003cp>琳绝非毫无主体性的傀儡棋子。她在绝境中毅然决然选择舍身取义，以生命为代价斩断了三尾祸乱木叶的可能。\u003c/p>\u003c/article>\n          \u003carticle class=\"layer\">\u003cstrong>第三层：认知推演\u003c/strong>\u003cp>带土将这起遭受幕后操弄的局部悲剧，激进化为涵盖整个宇宙的普遍结论：“琳会死去的现实乃是虚妄的地狱；唯有幻梦中的琳，方是唯一真切的存在。”\u003c/p>\u003c/article>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>哲学辨析：\u003c/strong>斑固然处心积虑制造了创伤降临的舞台，但“整个现实世界尽皆虚妄、不配存续”的极度虚无结论，依然是带土自身做出的价值裁决。揭示阴谋的操弄，绝不意味着免除当事人在认知与行动上的伦理责任。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"argument-lab\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"argument-lab\">哲学审问室：辩驳斑之救世论证的隐秘漏洞\u003c/h2>\u003cp>斑的每一段宣讲皆发端于无可辩驳的切身伤痛，然而在从“经验事实”跃迁至“激进结论”的断层中，皆悄然预设了一个未经审视的隐性前提。请逐一破解。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">推理拆解\u003c/span>\u003c/div>\n      \u003cdiv id=\"argument-tabs\" class=\"step-tabs\" role=\"tablist\" aria-label=\"论证导航\">\u003c/div>\n      \u003cdiv id=\"argument-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"argument-prev\" class=\"button\" type=\"button\">← 上一则\u003c/button>\u003cbutton id=\"argument-next\" class=\"button primary\" type=\"button\">下一则 →\u003c/button>\u003c/div>\u003cbutton id=\"argument-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"obito-mask\">\n        \u003ch2 id=\"obito-mask\">“宇智波斑”：一张弑灭自我人格的必要面具\u003c/h2>\n        \u003cp>重回斑身侧的带土，全盘接纳了月之眼救赎纲领，并在往后的岁月里正式以“宇智波斑”的名号行走忍界。这具面具的功能远非隐匿真容：它让一个曾经常常迟到、扶助老弱、渴望赢得所有人认可的纯真少年，得以将一切暴行心安理得地归因于一个早已超越尘世情感的历史图腾。\u003c/p>\n        \u003cp>然而那个少年的灵魂从未真正湮灭。带土虽口口声声宣称琳的死不过是看清世界本质的契机，其行事却无时无刻不在围着昔日的羁绊纠缠打转；他悍然摧毁恩师水门用生命守护的村落，在第四次忍界大战中百般试探挑衅鸣人，试图将鸣人拖入与自己同等绝望的泥潭。这一切反常的狂执无不在昭示：他绝非超然物外的神明，而是借由将全世界拖入深渊，来向自己证明——\u003cstrong>当年的那个弱小纯真的自我注定走向绝路，唯有如今这个面具下的幽灵，才是唯一参透真理的清醒者。\u003c/strong>\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"two-engines\">\n        \u003ch2 id=\"two-engines\">九尾之乱与“晓”的异化：救世计划的双核引擎\u003c/h2>\n        \u003cdiv class=\"engine-grid\">\n          \u003carticle class=\"engine-card\">\u003ch3>引擎一：引爆失序裂变\u003c/h3>\u003cp>带土趁鸣人降生、玖辛奈分娩导致封印衰弱之虚，强行通灵控制九尾肆虐木叶。水门与玖辛奈壮烈牺牲，九尾封印于鸣人体内。此役既沉重削弱了木叶的霸权根基，亦制造了下一代刻骨铭心的孤儿与仇恨深渊。\u003c/p>\u003c/article>\n          \u003carticle class=\"engine-card\">\u003ch3>引擎二：搜刮终极威慑\u003c/h3>\u003cp>“晓”组织本由弥彦、长门与小南创立，立足于让雨隐村走向独立和平。弥彦屈死后，长门主张以极度痛苦威慑世间；带土则顺水推舟，暗中将“晓”彻底锻造成搜捕人柱力、集结九大尾兽的战略执行机器。\u003c/p>\u003c/article>\n        \u003c/div>\n        \u003cp>这两大引擎共同构筑起自我印证的恶性循环：计划先在现实中亲手制造撕心裂肺的灾难与失去，再以这场人造的地狱去“证明”现实人世早已无可救药；世人愈是绝望，月之眼的幻梦救赎便愈显得神圣而诱人。带土本人既是这一扭曲循环的受害者，最终亦沦为了制造同等痛苦的刽子手。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>切勿将三套救世纲领混为一谈：\u003c/strong>弥彦坚信通过平等的政治对话达成跨国理解；长门主张以毁灭性的痛楚铸造恐怖均势让列国不敢妄动；带土与斑则旨在彻底消解共同现实。三者虽皆借“和平”之名，其对人性与世界的前提假设却截然对立。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"dream-cost\">\n        \u003ch2 id=\"dream-cost\">月之眼所彻底抹杀的，究竟是什么？\u003c/h2>\n        \u003cp>若单从主观体验来审视，无限月读展现出近乎完美的诱惑：逝去的挚爱笑貌依然，未竟的夙愿悉数得偿，世间不再有任何生离死别的切肤之痛。然而它并非让现实中的人们在磨合中冰释前嫌，而是将每一个独立的个体隔绝封闭进独属于其一己欲望的专属梦境。\u003c/p>\n        \u003cp>这意味着，它消灭痛苦的终极手段，正是消灭“真实的他人”。现实中的他者必然会与你产生分歧、拒绝你的期待，却也会给予你出乎预料的惊喜与慰藉；而在梦境之中，他者的一切反应皆不过是做梦者潜意识愿望的提线投影。你固然保留了被爱的幻觉体验，却永远失去了那个拥有自由意志、独立于你之外的鲜活灵魂。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"dream-ledger\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"dream-ledger\">代价结算：一份“无痛伊甸园”的隐形账单\u003c/h2>\u003cp>请勾选你希望借由“月之眼”从人世间彻底剔除的痛苦风险。右侧将同步结算因该项剔除而一并消亡的人性珍宝。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">代价实验\u003c/span>\u003c/div>\n      \u003cdiv class=\"ledger-grid\">\n        \u003cdiv id=\"dream-controls\" class=\"dream-controls\">\u003c/div>\n        \u003cdiv class=\"ledger-result\" aria-live=\"polite\">\u003ch3>伴随剥夺的人性价值\u003c/h3>\u003cul id=\"ledger-list\" class=\"ledger-list\">\u003c/ul>\u003cp id=\"ledger-summary\" class=\"ledger-summary\">\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"plan-verdict\">\n        \u003ch2 id=\"plan-verdict\">为何此举绝非“代价沉重的和平”，而是对和平命题的彻底取消\u003c/h2>\n        \u003cp>“和平”在人类文明史上的全部崇高价值，恰恰在于多个彼此独立、拥有各自欲望与诉求的个体，如何探索共存于同一个世界。只要自由意志尚存，观念分歧便绝不可能归零；而和平的至高尊严，正源于人们在明知彼此可能造成伤害的前提下，依然选择克制力量、修复裂痕并休戚与共。\u003c/p>\n        \u003cp>月之眼计划彻底回避了这一永恒的道义答卷。它并非探索出了一条更高明的共同生活之道，而是直接从物理与精神层面抹杀了“共同”本身的存在。因此，它充其量只能为个体提供极致的主观陶醉，却丝毫未能证明人与人之间能够真正达成和解与共生。\u003c/p>\n        \u003caside class=\"canon-note\">\u003cstrong>斑未曾料及的终极讽刺：\u003c/strong>在黑绝的真实棋局中，沉沦于无限月读的受害者将被神树彻底束缚生机，最终同化为没有思想的白绝兵偶；而斑本人亦不过是降临大筒木辉夜的血肉祭品。一个许诺让全人类摆脱摆布的救世宏图，最终全盘奠基在忍界有史以来最大规模的极权欺骗之上。\u003c/aside>\n        \u003cp class=\"key-point\">\u003cstrong>本课裁定：\u003c/strong>斑敏锐而冷酷地洞察到“爱与失去”如影随形的悲剧性，却武断地下达了致命的价值判词——认定“免除痛苦”的位阶高于“拥有自由意志哪怕历经磨难”。带土所全盘接纳并为之殉道的，正是这一颠倒的价值序列。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"lesson-check\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"lesson-check\">认知检验：谁在幕后摆布，谁在做出抉择？\u003c/h2>\u003cp>一次只看一道题。选择后立即得到解释；可以跳过、返回或修改，进度会自动保留。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">4 个问题\u003c/span>\u003c/div>\n      \u003cdiv id=\"quiz-tabs\" class=\"quiz-tabs\" role=\"tablist\" aria-label=\"问题导航\">\u003c/div>\n      \u003cdiv id=\"quiz-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"quiz-prev\" class=\"button\" type=\"button\">← 上一题\u003c/button>\u003cbutton id=\"quiz-next\" class=\"button primary\" type=\"button\">下一题 →\u003c/button>\u003c/div>\u003cbutton id=\"quiz-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cfooter class=\"lesson-footer\">\n      \u003cdiv class=\"takeaway\">\u003cstrong>核心结语：\u003c/strong>月之眼计划最具蛊惑性与欺骗性的内核，在于它从不公然否定爱，而是假借“永恒守护爱”的名义，彻底扼杀他者的独立意志与共同世界。斑搭建了攻心的舞台，带土接纳了虚无的判词，并以救世主自居，将同等的绝望无情地播撒向整个世间。\u003c/div>\n      \u003cp class=\"next-lesson\">\u003cstrong>\u003ca href=\"session4.html\">下一讲：两名遗孤\u003c/a>\u003c/strong>宇智波政变风云与灭族血夜、鼬背负万世骂名的绝命抉择、鸣人深陷冷眼的孤独求索、佐助背负血海深仇的复仇之路，以及终结之谷宿命的初次断裂。看两个孩子如何承接了整个忍界未曾解开的千古沉疴。\u003c/p>\n    \u003c/footer>\n  \u003c/main>\n\n  \u003cscript>\n    (function () {\n      \"use strict\";\n      var storagePrefix = \"course:session3:\";\n\n      function readState(key, fallback) {\n        try {\n          var saved = localStorage.getItem(storagePrefix + key);\n          return saved ? JSON.parse(saved) : fallback;\n        } catch (error) { return fallback; }\n      }\n\n      function writeState(key, value) {\n        try { localStorage.setItem(storagePrefix + key, JSON.stringify(value)); }\n        catch (error) { /* 禁用本地存储时，课程仍可使用。 */ }\n      }\n\n      function clampIndex(index, length) { return Math.max(0, Math.min(length - 1, index)); }\n\n      var chainEvents = [\n        { id: \"survive\", text: \"斑借由禁术伊邪那岐改写终结之谷阵亡事实，并成功截获柱间细胞。\" },\n        { id: \"rinnegan\", text: \"斑于垂暮之年觉醒轮回眼，秘密通灵外道魔像，并物色长门作为神瞳载体。\" },\n        { id: \"obito\", text: \"濒死的带土获救；斑向其阐发月之眼救赎构想，带土初时断然回绝。\" },\n        { id: \"rin\", text: \"斑幕后设计并引爆琳之死惨剧，带土信念崩塌，彻底认定现实皆为地狱。\" },\n        { id: \"network\", text: \"带土承袭‘宇智波斑’之尊号掀起九尾之乱，暗中将晓锻造成尾兽搜集机器。\" }\n      ];\n      var correctChain = chainEvents.map(function (event) { return event.id; });\n      var defaultChain = [\"obito\", \"survive\", \"rin\", \"rinnegan\", \"network\"];\n      var chainOrder = readState(\"plan-chain:v1\", defaultChain);\n      if (!Array.isArray(chainOrder) || chainOrder.length !== chainEvents.length) chainOrder = defaultChain.slice();\n\n      function chainEventById(id) { return chainEvents.find(function (event) { return event.id === id; }); }\n      function setChainFeedback(message, className) {\n        var feedback = document.getElementById(\"chain-feedback\");\n        feedback.textContent = message;\n        feedback.className = \"feedback\" + (className ? \" \" + className : \"\");\n      }\n      function moveChainItem(index, direction) {\n        var target = index + direction;\n        var next = chainOrder.slice();\n        var moved = next[index];\n        next[index] = next[target];\n        next[target] = moved;\n        chainOrder = next;\n        writeState(\"plan-chain:v1\", chainOrder);\n        setChainFeedback(\"顺序已调整。\", \"\");\n        renderChain();\n      }\n      function renderChain() {\n        var list = document.getElementById(\"chain-list\");\n        list.innerHTML = \"\";\n        chainOrder.forEach(function (id, index) {\n          var event = chainEventById(id);\n          var item = document.createElement(\"div\"); item.className = \"chain-item\";\n          var number = document.createElement(\"span\"); number.className = \"chain-number\"; number.textContent = String(index + 1);\n          var text = document.createElement(\"span\"); text.className = \"chain-text\"; text.textContent = event.text;\n          var actions = document.createElement(\"div\"); actions.className = \"chain-actions\";\n          var up = document.createElement(\"button\"); up.type = \"button\"; up.className = \"icon-button\"; up.textContent = \"↑\"; up.disabled = index === 0; up.setAttribute(\"aria-label\", \"将第 \" + (index + 1) + \" 项上移\"); up.addEventListener(\"click\", function () { moveChainItem(index, -1); });\n          var down = document.createElement(\"button\"); down.type = \"button\"; down.className = \"icon-button\"; down.textContent = \"↓\"; down.disabled = index === chainOrder.length - 1; down.setAttribute(\"aria-label\", \"将第 \" + (index + 1) + \" 项下移\"); down.addEventListener(\"click\", function () { moveChainItem(index, 1); });\n          actions.append(up, down); item.append(number, text, actions); list.appendChild(item);\n        });\n      }\n      function checkChain() {\n        var firstWrong = chainOrder.findIndex(function (id, index) { return id !== correctChain[index]; });\n        if (firstWrong === -1) setChainFeedback(\"逻辑链条梳理正确：斑率先攻克‘肉身如何破局存续’，继而开创‘战略如何在身后自主运转’的世代传承体系。\", \"success\");\n        else setChainFeedback(firstWrong === 0 ? \"溯源提示：请先审视终结之谷一役后，斑展开长期布局不可或缺的首要生存前提。\" : \"前 \" + firstWrong + \" 项因果缜密；请仔细推敲第 \" + (firstWrong + 1) + \" 项的触发条件需要哪一步先行奠基。\", \"try-again\");\n      }\n      document.getElementById(\"chain-check\").addEventListener(\"click\", checkChain);\n      document.getElementById(\"chain-reset\").addEventListener(\"click\", function () { chainOrder = defaultChain.slice(); writeState(\"plan-chain:v1\", chainOrder); setChainFeedback(\"已恢复为待整理状态。\", \"\"); renderChain(); });\n      renderChain();\n\n      var argumentsList = [\n        {\n          claim: \"切身体验：对一个人爱得愈深，失去时的剧痛便愈烈。斑之结论：因而孕育着爱恋的现实世间，本质上注定是一座无休止的地狱。\",\n          prompt: \"这一步推论暗中偷换或强加了哪一个未经审视的哲学前提？\",\n          options: [\"极致的创伤痛楚，足以全盘抹杀整段生命羁绊曾经拥有的全部崇高价值。\", \"面对至痛打击，不同的人会以各自不同的方式进行哀悼与疗愈。\", \"刻骨铭心的失去，必然会永久重塑个体的生命轨迹与处世态度。\"],\n          answer: 0,\n          feedback: [\"解析正确：经验事实仅能证明爱令人脆弱易伤；要强行得出‘现实尽皆地狱’的结论，必须武断认定痛苦拥有否定一切意义的绝对权力。\", \"此论诚然属实，却会直接瓦解‘现实必然是地狱’的绝对断言，因为它承认人类拥有在废墟中重建生活的韧性。\", \"这同样是生命常态，但‘重塑生命轨迹’绝不等于‘使现存的一切价值皆尽化为虚妄’。\"]\n        },\n        {\n          claim: \"切身体验：拥有独立意志的他者，随时可能产生误解、违逆甚至背叛。斑之结论：梦境中唯命是从的完美关系，远比现实中的人际纠葛更具真实性。\",\n          prompt: \"这一激进结论深层依附于哪一种颠倒的价值判断？\",\n          options: [\"人际关系的至高价值，主要取决于对方能否绝对顺从并满足我的一切愿望。\", \"人际之间的分歧与误解，通常需要历经漫长而耐心的沟通来逐步化解。\", \"人类永远无法拥有彻底掌控未来一切变数的绝对力量。\"],\n          answer: 0,\n          feedback: [\"解析正确：唯有将‘自私的意愿满足’凌驾于‘他者独立人格’之上，提线木偶般的幻梦关系才会被狂妄地奉为真理。\", \"真诚沟通的可能，恰恰印证了现实羁绊依然拥有值得捍卫的修复韧性与升华空间。\", \"这道出了人性的局限性，却丝毫无法推导出一个任由主观捏造的幻象会比真实灵魂更为高尚。\"]\n        },\n        {\n          claim: \"切身体验：不同利益群体的诉求摩擦不可避免。斑之结论：令众生各自遁入专属的心愿幻境，便彻底实现了人类大同的世界和平。\",\n          prompt: \"该结论在偷换概念时，悄然抹杀了哪一个词汇的核心定义？\",\n          options: [\"将‘和平’从‘多元主体的休戚与共’，偷换为了‘各自互不相扰的极致感官无痛’。\", \"将‘社会群体’的内涵从普遍民众，悄悄缩小为了特定忍者家族。\", \"将‘利益纷争’的范畴从现实资源争夺，偷换为了纯粹的情感纠葛。\"],\n          answer: 0,\n          feedback: [\"解析正确：月之眼并非解答了多元个体如何共存于同一个世界，而是直接消灭了‘共同世界’；它实现的是绝对孤立，而非真正的共同和平。\", \"论证中未曾发生此类缩减。关键症结不在于群体规模的大小，而在于公共世界是否被彻底解构。\", \"利益摩擦固然多元，但这绝非月之眼救世论证中最具欺骗性的核心概念偷换。\"]\n        }\n      ];\n      var argumentState = readState(\"argument-lab:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(argumentState.current)) argumentState.current = 0;\n      argumentState.current = clampIndex(argumentState.current, argumentsList.length);\n      argumentState.answers = argumentState.answers || {};\n      argumentState.skipped = Array.isArray(argumentState.skipped) ? argumentState.skipped : [];\n\n      function saveArguments() { writeState(\"argument-lab:v1\", argumentState); }\n      function goToArgument(index) { argumentState.current = clampIndex(index, argumentsList.length); saveArguments(); renderArguments(); }\n      function answerArgument(index, option) { argumentState.answers[index] = option; argumentState.skipped = argumentState.skipped.filter(function (item) { return item !== index; }); saveArguments(); renderArguments(); }\n      function skipArgument() { var current = argumentState.current; if (!Object.prototype.hasOwnProperty.call(argumentState.answers, current) && argumentState.skipped.indexOf(current) === -1) argumentState.skipped.push(current); argumentState.current = current \u003c argumentsList.length - 1 ? current + 1 : 0; saveArguments(); renderArguments(); }\n      function renderArguments() {\n        var tabs = document.getElementById(\"argument-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"argument-panels\"); panels.innerHTML = \"\";\n        argumentsList.forEach(function (argument, argumentIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"step-tab\";\n          if (Object.prototype.hasOwnProperty.call(argumentState.answers, argumentIndex)) tab.classList.add(\"answered\");\n          if (argumentState.skipped.indexOf(argumentIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", argumentIndex === argumentState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"argument-\" + argumentIndex); tab.textContent = \"论证 \" + (argumentIndex + 1); tab.addEventListener(\"click\", function () { goToArgument(argumentIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"argument-\" + argumentIndex; panel.className = \"argument-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = argumentIndex !== argumentState.current;\n          var count = document.createElement(\"div\"); count.className = \"step-count\"; count.textContent = \"论证 \" + (argumentIndex + 1) + \" / \" + argumentsList.length;\n          var claim = document.createElement(\"p\"); claim.className = \"argument-claim\"; claim.textContent = argument.claim;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = argument.prompt;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          argument.options.forEach(function (optionText, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"argument-\" + argumentIndex; input.value = String(optionIndex); input.checked = Number(argumentState.answers[argumentIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerArgument(argumentIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.textContent = optionText; label.append(input, text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = argumentState.answers[argumentIndex];\n          if (selected === undefined) feedback.textContent = argumentState.skipped.indexOf(argumentIndex) !== -1 ? \"这则论证已暂时跳过。\" : \"选择一个必要前提；不是选择一句也为真的话。\";\n          else { var correct = Number(selected) === argument.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = argument.feedback[Number(selected)]; }\n          panel.append(count, claim, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"argument-prev\").disabled = argumentState.current === 0;\n        document.getElementById(\"argument-next\").textContent = argumentState.current === argumentsList.length - 1 ? \"回到第一则 ↺\" : \"下一则 →\";\n      }\n      document.getElementById(\"argument-prev\").addEventListener(\"click\", function () { goToArgument(argumentState.current - 1); });\n      document.getElementById(\"argument-next\").addEventListener(\"click\", function () { goToArgument(argumentState.current === argumentsList.length - 1 ? 0 : argumentState.current + 1); });\n      document.getElementById(\"argument-skip\").addEventListener(\"click\", skipArgument);\n      renderArguments();\n\n      var dreamRisks = [\n        { id: \"loss\", title: \"剔除离别与死亡之苦\", note: \"所爱之人音容笑貌永不凋零\", cost: \"生命的有限性之美，以及在承受失去后依然能够真诚缅怀、哀悼与重构新生的坚韧力量\" },\n        { id: \"rejection\", title: \"剔除违逆与误解之痛\", note: \"他者的一切举止皆如你所愿\", cost: \"他者神圣不可侵犯的独立意志；幻梦中人已彻底丧失对你由衷说‘不’的自由人格\" },\n        { id: \"conflict\", title: \"剔除利益与诉求之争\", note: \"人人皆在各自世界位居至尊\", cost: \"公共协商、制度公正与妥协美德，因为全人类已彻底告别同一个公共现实\" },\n        { id: \"failure\", title: \"剔除挫败与意外之虞\", note: \"未来走向分毫不差契合执念\", cost: \"充满无限可能的开放未来，以及在偶发与顿悟中自我修正、破茧成蝶的成长意义\" }\n      ];\n      var dreamState = readState(\"dream-ledger:v1\", []);\n      if (!Array.isArray(dreamState)) dreamState = [];\n      function renderDreamLedger() {\n        var controls = document.getElementById(\"dream-controls\"); controls.innerHTML = \"\";\n        dreamRisks.forEach(function (risk) {\n          var label = document.createElement(\"label\"); label.className = \"dream-toggle\";\n          var input = document.createElement(\"input\"); input.type = \"checkbox\"; input.checked = dreamState.indexOf(risk.id) !== -1;\n          input.addEventListener(\"change\", function () { if (input.checked) dreamState.push(risk.id); else dreamState = dreamState.filter(function (id) { return id !== risk.id; }); writeState(\"dream-ledger:v1\", dreamState); renderDreamLedger(); });\n          var text = document.createElement(\"span\"); var strong = document.createElement(\"strong\"); strong.textContent = risk.title; var note = document.createElement(\"span\"); note.textContent = risk.note; text.append(strong, note); label.append(input, text); controls.appendChild(label);\n        });\n        var list = document.getElementById(\"ledger-list\"); list.innerHTML = \"\";\n        dreamRisks.filter(function (risk) { return dreamState.indexOf(risk.id) !== -1; }).forEach(function (risk) { var item = document.createElement(\"li\"); item.textContent = risk.cost; list.appendChild(item); });\n        if (dreamState.length === 0) { var empty = document.createElement(\"li\"); empty.textContent = \"尚未剔除任何现实风险；这个世界依然荆棘密布，但也依然生机盎然、充满无限希望。\"; list.appendChild(empty); }\n        var summary = document.getElementById(\"ledger-summary\");\n        if (dreamState.length === 0) summary.textContent = \"你完整守护了全人类休戚与共的真实世界，亦坦然承载了其全部不可预知的沧桑与变数。\";\n        else if (dreamState.length \u003c 4) summary.textContent = \"你消解了局部的撕裂与阵痛，但每一次对安全的极致换取，皆以牺牲个体自由意志或公共生活为沉重抵押。\";\n        else summary.textContent = \"当世间一切风险皆被彻底扑灭，残存的绝非大同世界，而是一座座彼此永不相通、自我陶醉的华美灵魂囚牢。\";\n      }\n      renderDreamLedger();\n\n      var questions = [\n        { title: \"斑如何使其救世构想跨越生死大限而长存？\", options: [{text:\"仅仅在南贺神社遗留下一卷勒令后世宇智波顺从的训诫遗书。\",help:\"斑的布局涵盖了神瞳移植、外道魔像、白绝克隆体培育及前台代行者的全套体系。\"},{text:\"将核心神术、战略威慑与执政图腾分别拆解托付给长门、带土等后世传人。\",help:\"精密的战略分工使这套宏图不再依附于斑肉身个体的寿命极限。\"},{text:\"在终结之谷的大战中强行以写轮眼幻术控制柱间完成月之眼计划。\",help:\"柱间生前自始至终未曾参与、亦不知晓月之眼计划的实质。\"}], answer: 1, feedback:[\"救世蓝图远非空洞的教条遗嘱，而是一整套跨越生死周期的工程化执行基础设施。\",\"解析正确：轮回眼神瞳与长门、‘斑’之尊号与带土、外道魔像与尾兽兵器化，共同构成了自主运转的接力体系。\",\"终结之谷是斑由明转暗转入地下长线布局的起点，绝非计划大功告成的终点。\"] },\n        { title: \"如何精准辨析“琳之死”与带土黑化蜕变之间的内在逻辑？\", options: [{text:\"斑处心积虑制造情境，琳以大义舍身赴死，带土在此重创下将个人悲剧极化为对整个现实的虚无判词。\",help:\"三层因果架构兼顾了幕后阴谋操弄与涉事各方鲜明的主体抉择能动性。\"},{text:\"琳完全是没有自主意识的提线木偶，仅仅是斑诱发带土黑化而随意按下的机关。\",help:\"琳在洞悉雾隐阴谋后，主动选择撞上雷切以身殉村，具有极其崇高的主动性。\"},{text:\"任何人只要目睹至亲至爱之人横死，皆会必然且机械地得出‘现实应当被毁灭’的结论。\",help:\"创伤经验固然沉重，却绝不可能在逻辑上机械且唯一地推导出虚无主义的世界观。\"}], answer:0, feedback:[\"解析正确：阴谋揭示了悲剧为何精准降临，却丝毫不能抹杀琳崇高的壮烈牺牲，亦无法免除带土对现实下达虚无判词的伦理责任。\",\"此论残酷抹杀了琳在绝境中舍生取义的人性光辉，亦在客观上彻底免除了带土后续倒行逆施的道义罪责。\",\"惨烈创伤固然构成了攻心的催化剂，但‘彻底否定现实存续价值’依然是个体自主做出的极端价值裁决。\"] },\n        { title: \"长门的救世纲领与带土的月之眼计划，其根本分野何在？\", options: [{text:\"长门旨在以切肤的巨大痛苦在现实中铸造恐怖威慑；带土则意图令全人类彻底退出共同现实。\",help:\"前者在现实世界构筑安全边界，后者则以私人主观幻梦彻底取代公共世界。\"},{text:\"长门始终坚持非暴力和平主义，带土则是纯粹诉诸杀伐破坏的暴徒。\",help:\"佩恩在摧毁木叶时展现出极其恐怖的毁灭性武力，其和平理念正是奠基于痛苦威慑之上。\"},{text:\"两人的和平方案在实质上毫无二致，仅仅是不同时期的不同代号。\",help:\"晓组织在演进历程中深刻交织着截然不同、甚至相互冲突的政治哲学纲领。\"}], answer:0, feedback:[\"解析正确：长门依然致力于在现实社会中规范人类行为，而带土则旨在从物理与形而上层面彻底抹杀现实本身。\",\"长门的‘神罗天征’正是以展示灭顶之灾来迫使世人知痛止战，绝非单纯的非暴力主义。\",\"两者虽皆致力于搜集尾兽，但尾兽在长门手中是战略威慑武器，在带土手中则是启动无限月读的燃料。\"] },\n        { title: \"“月之眼计划”在哲学层面上隐匿的最深代价是什么？\", options: [{text:\"幻术编织的梦境世界粗糙简陋，人们很快便会心生厌倦。\",help:\"作品设定中的无限月读能够为受术者量身定做极其逼真、无懈可击的主观满足。\"},{text:\"它在赋予主观欲望极致满足的同时，彻底扼杀了真实的共同现实与他者的独立自由意志。\",help:\"梦境中的他者彻底沦为投射做梦者潜意识愿望的傀儡，无法展现任何不可控的真实生命力。\"},{text:\"它强行苛求世间所有凡俗民众皆必须先苦修掌握极其复杂的顶阶幻术。\",help:\"无限月读系由施术者从外部强行发动，受术众生无需具备任何忍术基础。\"}], answer:1, feedback:[\"症结绝非感官体验的逼真程度，而在于这种被封闭的陶醉之中是否还存在真正鲜活独立的灵魂。\",\"解析正确：它消除痛苦的终极代价，是让关系彻底丧失了面对未知、分歧与真实尊严的可能。\",\"无限月读乃是至高无上的天眼降临，并不要求凡间受众主动去学习或领悟任何忍术机理。\"] }\n      ];\n      var quizState = readState(\"quiz:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(quizState.current)) quizState.current = 0;\n      quizState.current = clampIndex(quizState.current, questions.length); quizState.answers = quizState.answers || {}; quizState.skipped = Array.isArray(quizState.skipped) ? quizState.skipped : [];\n      function saveQuiz() { writeState(\"quiz:v1\", quizState); }\n      function goToQuestion(index) { quizState.current = clampIndex(index, questions.length); saveQuiz(); renderQuiz(); }\n      function answerQuestion(questionIndex, optionIndex) { quizState.answers[questionIndex] = optionIndex; quizState.skipped = quizState.skipped.filter(function (index) { return index !== questionIndex; }); saveQuiz(); renderQuiz(); }\n      function skipQuestion() { var current = quizState.current; if (!Object.prototype.hasOwnProperty.call(quizState.answers, current) && quizState.skipped.indexOf(current) === -1) quizState.skipped.push(current); quizState.current = current \u003c questions.length - 1 ? current + 1 : 0; saveQuiz(); renderQuiz(); }\n      function renderQuiz() {\n        var tabs = document.getElementById(\"quiz-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"quiz-panels\"); panels.innerHTML = \"\";\n        questions.forEach(function (question, questionIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"quiz-tab\"; if (Object.prototype.hasOwnProperty.call(quizState.answers, questionIndex)) tab.classList.add(\"answered\"); if (quizState.skipped.indexOf(questionIndex) !== -1) tab.classList.add(\"skipped\"); tab.setAttribute(\"role\",\"tab\"); tab.setAttribute(\"aria-selected\", questionIndex === quizState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"question-\" + questionIndex); tab.textContent = String(questionIndex + 1); tab.addEventListener(\"click\", function () { goToQuestion(questionIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"question-\" + questionIndex; panel.className = \"question-panel\"; panel.setAttribute(\"role\",\"tabpanel\"); panel.hidden = questionIndex !== quizState.current;\n          var count = document.createElement(\"div\"); count.className = \"question-count\"; count.textContent = \"问题 \" + (questionIndex + 1) + \" / \" + questions.length;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = question.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          question.options.forEach(function (choice, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\"; var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"question-\" + questionIndex; input.value = String(optionIndex); input.checked = Number(quizState.answers[questionIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerQuestion(questionIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.appendChild(document.createTextNode(choice.text + \" \")); var help = document.createElement(\"span\"); help.className = \"term\"; help.tabIndex = 0; help.textContent = \"概念提示\"; var tooltip = document.createElement(\"span\"); tooltip.className = \"tooltip\"; tooltip.setAttribute(\"role\",\"tooltip\"); tooltip.textContent = choice.help; help.appendChild(tooltip); text.appendChild(help); label.append(input,text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\",\"polite\"); var selected = quizState.answers[questionIndex];\n          if (selected === undefined) feedback.textContent = quizState.skipped.indexOf(questionIndex) !== -1 ? \"这题已暂时跳过。你可以随时回来。\" : \"选择后会立即看到解释；也可以先查看选项后的概念提示。\";\n          else { var correct = Number(selected) === question.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = question.feedback[Number(selected)]; }\n          panel.append(count,title,options,feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"quiz-prev\").disabled = quizState.current === 0;\n        document.getElementById(\"quiz-next\").textContent = quizState.current === questions.length - 1 ? \"回到第一题 ↺\" : \"下一题 →\";\n      }\n      document.getElementById(\"quiz-prev\").addEventListener(\"click\", function () { goToQuestion(quizState.current - 1); });\n      document.getElementById(\"quiz-next\").addEventListener(\"click\", function () { goToQuestion(quizState.current === questions.length - 1 ? 0 : quizState.current + 1); });\n      document.getElementById(\"quiz-skip\").addEventListener(\"click\", skipQuestion);\n      renderQuiz();\n    }());\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session4.html","basePath":"session4.html","lang":"zh-CN","kind":"lesson","title":"两名遗孤的继承","translations":{"zh-CN":"session4.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"两名遗孤的继承\">\n  \u003ctitle>两名遗孤：鸣人与佐助怎样继承了整个忍界｜火影忍者的政治哲学\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f6f1e7;\n      --paper-deep: #ebe1cf;\n      --ink: #292721;\n      --muted: #6c665b;\n      --accent: #9 rem; background: var(--card); box-shadow: var(--shadow); }\n    .lab-head { display: flex; align-items: start; justify-content: space-between; gap: 1rem; margin-bottom: 1.3rem; }\n    .lab-head h2, .lab-head h3 { margin: 0; }\n    .lab-head p { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }\n    .lab-label { flex: 0 0 auto; padding: .22rem .55rem; border-radius: 999px; color: var(--accent-dark); background: var(--accent-soft); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .72rem; font-weight: 700; }\n    .button { padding: .55rem .9rem; border: 1px solid var(--line); border-radius: .55rem; color: inherit; background: var(--white); cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; font-weight: 650; }\n    .button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }\n    .button.primary { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .button.primary:hover:not(:disabled) { color: var(--white); background: var(--accent-dark); }\n    .button:disabled { opacity: .35; cursor: default; }\n    .lab-nav, .lab-nav-group { display: flex; flex-wrap: wrap; gap: .55rem; }\n    .lab-nav { justify-content: space-between; margin-top: 1rem; }\n\n    .inheritance-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1rem; }\n    .inheritance-column { padding: 1rem; border: 1px solid var(--line); border-radius: .8rem; background: var(--white); }\n    .inheritance-column h3 { margin: 0 0 .8rem; }\n    .inheritance-column:first-child h3 { color: #86631f; }\n    .inheritance-column:last-child h3 { color: #4c6576; }\n    .inheritance-item { width: 100%; margin-top: .55rem; padding: .75rem .8rem; border: 1px solid var(--line); border-radius: .6rem; text-align: left; background: transparent; cursor: pointer; }\n    .inheritance-item:hover { border-color: var(--accent); }\n    .inheritance-item[aria-pressed=\"true\"] { border-color: var(--a
