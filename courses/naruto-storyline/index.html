r: 1px solid var(--line); background: var(--card); font-size: .84rem; }\n    .matrix th, .matrix td { padding: .72rem .72rem; border: 1px solid var(--line); text-align: center; vertical-align: middle; }\n    .matrix th { color: var(--accent-dark); background: var(--accent-soft); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .76rem; }\n    .matrix td:first-child, .matrix th:first-child { text-align: left; font-weight: 700; }\n    .matrix .best { color: #365d3a; background: var(--sage-soft); font-weight: 700; }\n    .matrix .possible { color: #77581f; background: var(--gold-soft); }\n    .matrix .reject { color: var(--muted); }\n\n    .step-tabs, .quiz-tabs { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.25rem; }\n    .step-tab, .quiz-tab { min-width: 2.35rem; padding: .38rem .7rem; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8rem; }\n    .step-tab[aria-selected=\"true\"], .quiz-tab[aria-selected=\"true\"] { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .step-tab.answered:not([aria-selected=\"true\"]), .quiz-tab.answered:not([aria-selected=\"true\"]) { border-color: var(--sage); color: #46503f; background: var(--sage-soft); }\n    .step-tab.skipped:not([aria-selected=\"true\"]), .quiz-tab.skipped:not([aria-selected=\"true\"]) { border-style: dashed; }\n    .case-panel[hidden], .question-panel[hidden] { display: none; }\n    .step-count, .question-count { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; }\n    .case-scene { margin: .55rem 0 1rem; padding: 1rem 1.1rem; border-left: 4px solid var(--blue); background: var(--blue-soft); font-size: 1.02rem; }\n    .question-title { margin: .35rem 0 1rem; font-size: 1.14rem; }\n    .options { display: grid; gap: .65rem; }\n    .option { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; padding: .8rem .9rem; border: 1px solid var(--line); border-radius: .65rem; background: var(--white); cursor: pointer; }\n    .option:hover { border-color: var(--accent); }\n    .option:has(input:checked) { border-color: var(--accent); background: #fbf0eb; }\n    .option input { margin-top: .35rem; accent-color: var(--accent); }\n    .option-text { line-height: 1.5; }\n    .answer-feedback { min-height: 4.7rem; margin-top: .85rem; padding: .85rem 1rem; border-radius: .65rem; color: var(--muted); background: var(--paper-deep); font-size: .9rem; }\n    .answer-feedback.correct { color: #365d3a; background: var(--sage-soft); }\n    .answer-feedback.incorrect { color: var(--accent-dark); background: var(--accent-soft); }\n\n    .reading-list { display: grid; gap: .55rem; margin-top: 1.3rem; padding: 0; list-style: none; }\n    .reading-list li { padding: .75rem .85rem; border-left: 3px solid var(--line); background: rgba(255,253,248,.48); }\n    .reading-list a { font-weight: 650; }\n    .reading-list span { display: block; color: var(--muted); font-size: .82rem; }\n    .lesson-footer { margin-top: 4.5rem; padding-top: 2rem; border-top: 1px solid var(--line); }\n    .takeaway { padding: 1.4rem 1.5rem; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 1.05rem; }\n    .completion { margin-top: 2rem; padding: 1.2rem 1.3rem; border: 1px solid var(--line); border-radius: .75rem; color: var(--muted); background: var(--card); }\n    .completion strong { display: block; color: var(--ink); font-size: 1.1rem; }\n\n    @media (max-width: 760px) {\n      body { font-size: 16px; }\n      .content { width: min(100% - 2rem, 90ch); padding-top: 1.2rem; }\n      .learning-goals, .criteria, .model-grid, .model-explorer { grid-template-columns: 1fr; }\n      .model-result { min-height: 0; }\n      .philosopher-header { grid-template-columns: 1fr; gap: .2rem; }\n      .judgment { grid-template-columns: 1fr; gap: .2rem; }\n      .tooltip { position: fixed; inset: auto 1rem 1rem; width: auto; transform: translateY(.3rem); }\n      .term:hover .tooltip, .term:focus .tooltip { transform: translateY(0); }\n      .lab-head { display: block; }\n      .lab-label { display: inline-block; margin-top: .6rem; }\n      .lab-nav { flex-direction: column; }\n      .matrix { display: block; overflow-x: auto; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      html { scroll-behavior: auto; }\n      .tooltip { transition: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cnav class=\"topbar\" aria-label=\"课程导航\">\n      \u003cdiv class=\"topbar-links\">\u003ca href=\"session6.html\">← 上一讲\u003c/a>\u003ca href=\"syllabus.html\">课程大纲\u003c/a>\u003c/div>\n      \u003cspan class=\"lesson-count\">第 7 讲 / 共 7 讲\u003c/span>\n    \u003c/nav>\n\n    \u003cheader class=\"lesson-header\">\n      \u003cp class=\"eyebrow\">第七讲 · 单一问题\u003c/p>\n      \u003ch1>忍界和平的哲学讨论\u003c/h1>\n      \u003cp class=\"lede\">辉夜、羽衣、柱间、斑、带土、鸣人与佐助，面对的是同一道难题：怎样才能让人与人不再彼此伤害？他们并非简单分成“想要和平”与“想要战争”两派；每个人都选择了一种不同的和平机制。本讲只做一件事——把这些机制准确归并，再请六位哲学家说明自己的判断标准，并逐一裁决。\u003c/p>\n      \u003cdiv class=\"lesson-meta\" aria-label=\"本课信息\">\u003cspan>约 40 分钟\u003c/span>\u003cspan>和平哲学\u003c/span>\u003cspan>六种方案 · 六位哲学家\u003c/span>\u003c/div>\n      \u003cblockquote class=\"opening-question\">带着一个问题出发：和平是冲突终于消失，还是即便冲突存在，人仍拥有共同处理它的能力？\u003c/blockquote>\n      \u003cdiv class=\"learning-goals\" aria-label=\"学习目标\">\n        \u003cdiv class=\"goal\">\u003cstrong>01\u003c/strong>\u003cspan>将七名核心人物的和平构想归并为六种清晰模型\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>02\u003c/strong>\u003cspan>掌握六位哲学家与和平问题直接相关的核心理念\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>03\u003c/strong>\u003cspan>理解不同哲学为何会选择不同路线，而非只记结论\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"single-question\">\n        \u003ch2 id=\"single-question\">先固定问题：我们究竟在用什么标准判断“和平”？\u003c/h2>\n        \u003cp>若只把和平定义为“眼前没有战斗”，辉夜的绝对统治、无限月读乃至佐助的永久威慑都可能成功。若把和平定义为“每个人都感到幸福”，无限月读甚至近乎无懈可击。因此，比较之前必须先拆开四个彼此可能冲突的标准：\u003c/p>\n        \u003cdiv class=\"criteria\">\n          \u003cdiv class=\"criterion\">\u003cstrong>止战能力\u003c/strong>\u003cspan>它能否真实降低战争、报复与安全恐慌，而非只把冲突推迟？\u003c/span>\u003c/div>\n          \u003cdiv class=\"criterion\">\u003cstrong>主体地位\u003c/strong>\u003cspan>受影响者能否知情、拒绝、参与决定，还是只能接受强者定义的幸福？\u003c/span>\u003c/div>\n          \u003cdiv class=\"criterion\">\u003cstrong>持续与纠错\u003c/strong>\u003cspan>方案是否依赖一个人永远正确？领袖失误、衰老或离开后，和平还能否继续？\u003c/span>\u003c/div>\n          \u003cdiv class=\"criterion\">\u003cstrong>共同世界\u003c/strong>\u003cspan>它是在教不同的人共同生活，还是通过消灭差异、隔离意识或制造共同敌人来获得安静？\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>本讲不会预设四项标准的优先级。\u003c/strong>哲学家的分歧，恰恰在于他们会把安全、德性、自主、多元、缘起或制度养成中的哪一项放在更基础的位置。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"six-models\">\n        \u003ch2 id=\"six-models\">六条和平道路：七个人物真正分歧在哪里\u003c/h2>\n        \u003cdiv class=\"model-grid\">\n          \u003carticle class=\"model-card\">\u003ch3>辉夜：绝对占有\u003c/h3>\u003cp class=\"model-name\">垄断查克拉、身体与行动能力\u003c/p>\u003cp>和平来自唯一权力中心。只要众生再无足以威胁统治者的独立力量，战争便失去物质条件。她发动无限月读，不是为了让人永远留在理想梦中，而是把被神树束缚的人逐步转化为白绝军队；梦境只是控制与改造人口的手段。\u003c/p>\u003cp class=\"formula\">和平＝没有任何人拥有挑战我的能力\u003c/p>\u003c/article>\n          \u003carticle class=\"model-card\">\u003ch3>羽衣：心灵联结\u003c/h3>\u003cp class=\"model-name\">以忍宗共享查克拉、理解彼此\u003c/p>\u003cp>查克拉原本不是兵器，而是连接精神经验的媒介。和平应从理解与相互依存中生长，力量也应被分享而非垄断。但羽衣低估了技术、继承与权力竞争会怎样扭曲初心。\u003c/p>\u003cp class=\"formula\">和平＝人能够感知并承担彼此的存在\u003c/p>\u003c/article>\n          \u003carticle class=\"model-card\">\u003ch3>柱间：制度停战\u003c/h3>\u003cp class=\"model-name\">建立忍村、缔结盟约、形成均势\u003c/p>\u003cp>把以家族为单位的私人仇杀纳入村落制度，让儿童不必直接进入战场；再通过尾兽分配维持大国力量平衡。它真正降低了战国杀戮，却把竞争上移为忍村和国家之间的战争。\u003c/p>\u003cp class=\"formula\">和平＝把暴力纳入稳定组织与力量平衡\u003c/p>\u003c/article>\n          \u003carticle class=\"model-card\">\u003ch3>斑与带土：幻梦退出\u003c/h3>\u003cp class=\"model-name\">合并为“月之眼”路线\u003c/p>\u003cp>斑从人类互信必然破产得出结论，带土则从琳之死体验到现实即地狱。两人的动机重心不同，最终机制相同：让众生退出共同现实，在私人完美梦境中失去伤害与被伤害的可能。\u003c/p>\u003cp class=\"formula\">和平＝不再与真实且不可控的他人共同生活\u003c/p>\u003c/article>\n          \u003carticle class=\"model-card\">\u003ch3>佐助：唯一公敌\u003c/h3>\u003cp class=\"model-name\">摧毁旧权力，由一人垄断仇恨\u003c/p>\u003cp>处决五影、控制尾兽、斩断鸣人这最后羁绊，再让自己成为全世界永久戒惧的黑暗。现实与自由表面保留，但所有政治冲突都被绝对力量强制指向同一个对象。\u003c/p>\u003cp class=\"formula\">和平＝所有人因为共同反对我而团结\u003c/p>\u003c/article>\n          \u003carticle class=\"model-card\">\u003ch3>鸣人：关系修复\u003c/h3>\u003cp class=\"model-name\">承认痛苦、共享力量、拒绝永久断绝\u003c/p>\u003cp>不保证误解与失去消失，而是在真实关系中让痛苦被看见、力量被分享、敌人重新成为可以回应的人。其优势是保留主体与改变可能，弱点则是容易依赖鸣人的人格感召，制度承接仍不充分。\u003c/p>\u003cp class=\"formula\">和平＝冲突之后仍能重新接触并共同修复\u003c/p>\u003c/article>\n        \u003c/div>\n        \u003caside class=\"canon-note\">\n          \u003cstrong>同一种无限月读，为什么不是同一种和平方案？\u003c/strong>\n          \u003cp>\u003cstrong>先划清正篇与动画补完。\u003c/strong>漫画主线没有系统描写辉夜时代的法律、经济与家庭日常，只明确给出她以力量终结战争、发动无限月读，并把受术者逐步转化为白绝军队。动画补完则描绘得更具体：普通人表面仍在村落中耕作、成家和生活，神树附近却是禁地；辉夜定期挑选人参加“神树仪式”，被选者实际上会被束缚、失去人格并成为战争资源。部分获释者的记忆还会被抹除。\u003c/p>\n          \u003cdiv class=\"case-judgments\" aria-label=\"辉夜与月之眼计划的区别\">\n            \u003cdiv class=\"judgment\">\u003cstrong>辉夜使用无限月读\u003c/strong>\u003cspan>梦境是人口处理的中间环节。她仍统治现实世界，并把人的身体、查克拉与生命改造成可供自己调遣的军队；核心是绝对占有。\u003c/span>\u003c/div>\n            \u003cdiv class=\"judgment\">\u003cstrong>斑／带土使用无限月读\u003c/strong>\u003cspan>梦境本身就是终点。众生不必再醒来参与现实，只需永远获得量身定制的幸福体验；核心是退出共同现实。\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003cp>\u003cstrong>二者的共同点\u003c/strong>是都未经同意便取消人的主体地位；\u003cstrong>根本区别\u003c/strong>是辉夜把人当作现实统治与备战的材料，斑与带土则认为现实本身已经无可挽救，要用梦境彻底取代它。\u003c/p>\n        \u003c/aside>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"model-explorer\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"model-explorer\">方案显微镜：先替每条道路建立最强版本\u003c/h2>\u003cp>点选人物方案，查看它解决的真实问题、最有力论据、不可见代价与主要失败方式。评判前先避免把反方写成稻草人。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">6 种模型\u003c/span>\u003c/div>\n      \u003cdiv class=\"model-explorer\">\n        \u003cdiv id=\"model-buttons\" class=\"model-buttons\" aria-label=\"和平方案选择\">\u003c/div>\n        \u003carticle class=\"model-result\" aria-live=\"polite\">\u003cspan id=\"model-mechanism\" class=\"mechanism\">\u003c/span>\u003ch3 id=\"model-title\">\u003c/h3>\u003cp id=\"model-summary\">\u003c/p>\u003cdl>\u003cdt>它看见的真问题\u003c/dt>\u003cdd id=\"model-problem\">\u003c/dd>\u003cdt>最强论据\u003c/dt>\u003cdd id=\"model-case\">\u003c/dd>\u003cdt>不可见代价\u003c/dt>\u003cdd id=\"model-cost\">\u003c/dd>\u003cdt>主要失败方式\u003c/dt>\u003cdd id=\"model-failure\">\u003c/dd>\u003c/dl>\u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection class=\"philosopher\" aria-labelledby=\"aristotle-lens\">\n        \u003cdiv class=\"philosopher-header\">\u003cdiv class=\"philosopher-index\">哲学家 01\u003c/div>\u003cdiv>\u003ch2 id=\"aristotle-lens\">亚里士多德：和平是一种共同活得好的能力\u003c/h2>\u003cp class=\"philosopher-thesis\">核心问题不是“谁能压住所有人”，而是怎样的共同体能够培养出会正义行动的人。\u003c/p>\u003c/div>\u003c/div>\n        \u003ch3>与和平相关的核心理念\u003c/h3>\n        \u003cp>亚里士多德把人的最高目的理解为\u003cspan class=\"term\" tabindex=\"0\">蓬勃生活\u003cspan class=\"tooltip\" role=\"tooltip\">eudaimonia，常译作幸福或繁荣。它不是愉快感受，而是一生中依照德性展开能力、活得好的持续活动。\u003c/span>\u003c/span>。幸福不是被外部装置灌输的体验，而是一个人在真实选择中运用勇敢、节制、正义与实践智慧。政治共同体的目的也不只是让人免于死亡，而是创造使公民能够活得好的条件。\u003c/p>\n        \u003cp>他的德性伦理强调习惯与教育。人通过反复做某类事情，逐渐成为某种人；和平因此不能只靠一次契约或一位英雄，而需要培养能处理愤怒、利益与友爱的品格。最高形态的友爱不是互相利用，而是双方都希望对方因其自身而活得好。朋友作为“另一自我”，帮助人完成孤立个体无法独自实现的善。\u003c/p>\n        \u003cdiv class=\"idea-box\">\u003cstrong>判断标准：\u003c/strong>方案是否让人继续进行真实的德性活动？是否形成以共同善为目标的友爱与城邦？是否具备因时因地作出判断的实践智慧，而非把某个原则推到极端？\u003c/div>\n        \u003ch3>他会怎样看六条道路\u003c/h3>\n        \u003cdiv class=\"case-judgments\">\n          \u003cdiv class=\"judgment\">\u003cstrong>辉夜\u003c/strong>\u003cspan>只有服从者，没有共同追求善的公民。绝对安全无法替代人的德性活动。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>羽衣\u003c/strong>\u003cspan>忍宗把共同理解与相互成就放在力量之前，方向接近友爱；但善意必须通过教育和制度成为稳定习惯。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>柱间\u003c/strong>\u003cspan>建立忍村使共同生活获得制度形式，是重要进步；但把尾兽当作均势筹码，并未体现面向所有主体的正义。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>斑／带土\u003c/strong>\u003cspan>梦中快感不是蓬勃生活，因为受术者不再选择、行动或塑造品格。它保存幸福感，取消幸福本身。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>佐助\u003c/strong>\u003cspan>勇气和牺牲被推成极端，缺少实践智慧。拒绝朋友并不使他自足，反而切断了认识自身善恶的镜子。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>鸣人\u003c/strong>\u003cspan>最接近德性友爱：阻止朋友行恶，同时仍希望他为自身而活。但个人忠诚必须转化成公民教育与正义制度。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"verdict\">\u003cstrong>最终选择：\u003c/strong>以鸣人的德性友爱为核心，结合羽衣的共同理解与柱间的制度建构。单独的“鸣人路线”仍不够，因为和平不能要求每一代都幸运地拥有一位德性英雄。\u003c/div>\n        \u003cp class=\"blindspot\">理论盲点：亚里士多德的城邦与公民观具有历史局限，也不像现代权利理论那样天然把每个个体的平等同意放在首位。\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"philosopher\" aria-labelledby=\"hobbes-lens\">\n        \u003cdiv class=\"philosopher-header\">\u003cdiv class=\"philosopher-index\">哲学家 02\u003c/div>\u003cdiv>\u003ch2 id=\"hobbes-lens\">霍布斯：没有共同权力，善意会被恐惧击败\u003c/h2>\u003cp class=\"philosopher-thesis\">和平首先要求结束安全困境；无法执行的理解与承诺，不足以让理性的人放下武器。\u003c/p>\u003c/div>\u003c/div>\n        \u003ch3>与和平相关的核心理念\u003c/h3>\n        \u003cp>霍布斯并不是简单宣称“人性邪恶”。他的重点是：当不存在一股可信的共同权力时，即使人只想自保，也必须猜测别人是否会先动手。力量相近、资源有限、意图不透明，使防御性扩军看起来合理，最终却让所有人陷入\u003cspan class=\"term\" tabindex=\"0\">自然状态\u003cspan class=\"tooltip\" role=\"tooltip\">不是一段必须真实发生过的史前时代，而是缺少共同裁决与执行权威时，各方不得不自行判断威胁、保卫自身的关系状态。\u003c/span>\u003c/span>。\u003c/p>\n        \u003cp>走出这种状态需要契约，也需要一个足以执行契约的共同权力，即“利维坦”。仅仅口头约定不进攻没有用，因为任何一方都担心守约会让自己先暴露。主权的正当功能是让守约比背叛更安全，使人能够规划生活，而不是永远围绕战争准备组织社会。\u003c/p>\n        \u003cdiv class=\"idea-box\">\u003cstrong>判断标准：\u003c/strong>方案能否提供可信、稳定、可执行的安全担保？它是否把昔日敌人转化为同一共同体成员，还是只用更大的恐惧暂时压住他们？\u003c/div>\n        \u003ch3>他会怎样看六条道路\u003c/h3>\n        \u003cdiv class=\"case-judgments\">\n          \u003cdiv class=\"judgment\">\u003cstrong>辉夜\u003c/strong>\u003cspan>绝对力量确能止战，霍布斯不会轻视这一优势；但单纯征服若不能稳定保护臣民，仍只是更强者的任意支配。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>羽衣\u003c/strong>\u003cspan>互相理解有助于形成信任，却无法保证野心者守约。没有执行结构，忍宗容易被忍术重新军事化。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>柱间\u003c/strong>\u003cspan>忍村在内部成功建立共同权力，终止家族自然状态；但五个主权忍村彼此之间仍处于国际自然状态，尾兽均势反而强化猜疑。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>斑／带土\u003c/strong>\u003cspan>无限月读消除了冲突者，却没有建立公共人格、契约或共同体。它不是政治和平，而是政治主体的休眠。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>佐助\u003c/strong>\u003cspan>最像全球利维坦，也最容易被误认为霍布斯答案。但佐助未经共同授权，并故意把自己维持成永恒敌人；众人仍围绕战争组织，而非成为其保护下的共同体。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>鸣人\u003c/strong>\u003cspan>信任与共享风险能降低敌意，却无法独自担保下一代守约。私人羁绊必须转化为跨村公共权力。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"verdict\">\u003cstrong>最终选择：\u003c/strong>改造柱间路线——让五村从临时联盟进入具有共同规则、裁决和执行力的持久联邦。鸣人的互信可以促成契约，却不能替代契约。\u003c/div>\n        \u003cp class=\"blindspot\">理论盲点：霍布斯对安全的优先强调容易容忍过度集中的主权，也不充分说明公民应如何在安全之外追求自由与共同善。\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"philosopher\" aria-labelledby=\"kant-lens\">\n        \u003cdiv class=\"philosopher-header\">\u003cdiv class=\"philosopher-index\">哲学家 03\u003c/div>\u003cdiv>\u003ch2 id=\"kant-lens\">康德：未经同意的幸福，不是和平的正当基础\u003c/h2>\u003cp class=\"philosopher-thesis\">一个人永远不能只被当作实现他人蓝图的工具，即便那张蓝图名为幸福或安全。\u003c/p>\u003c/div>\u003c/div>\n        \u003ch3>与和平相关的核心理念\u003c/h3>\n        \u003cp>康德把\u003cspan class=\"term\" tabindex=\"0\">自主\u003cspan class=\"tooltip\" role=\"tooltip\">不是随心所欲，而是理性主体能够依据自己也可要求所有人遵守的原则行动，并把自己视作共同立法者。\u003c/span>\u003c/span>视为人格尊严的根基。人不是盛放快乐的容器，而是能够设定目的、判断原则的主体。因此，道德要求我们始终把自己和他人的人格同时当作目的，不能只当作手段。\u003c/p>\n        \u003cp>在政治层面，永久和平不能依靠一位世界君主的善意，也不能只靠短暂均势。康德更倾向自由政治共同体之间受法律约束的联合：各方保留主体地位，却共同接受公开、可普遍化的规则。真正和平不仅是无战，更是自由能够与他人的自由共存。\u003c/p>\n        \u003cdiv class=\"idea-box\">\u003cstrong>判断标准：\u003c/strong>规则能否被所有受影响者视为自己也可能同意的共同原则？任何人是否被牺牲、欺骗或强制降格为实现总体幸福的材料？\u003c/div>\n        \u003ch3>他会怎样看六条道路\u003c/h3>\n        \u003cdiv class=\"case-judgments\">\n          \u003cdiv class=\"judgment\">\u003cstrong>辉夜\u003c/strong>\u003cspan>众生只是被收回查克拉与维持秩序的材料，完全失去共同立法资格。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>羽衣\u003c/strong>\u003cspan>尊重每个人理解与回应他者的能力，接近“目的王国”；但必须形成公开规则，不能只依赖精神共鸣。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>柱间\u003c/strong>\u003cspan>盟约是进步，尾兽均势却仍把有意志的生命当作国家安全工具；大国间的秘密权力政治也不足以构成永久和平。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>斑／带土\u003c/strong>\u003cspan>无限月读即使提供完美幸福，也未经任何人同意。它把人的自主彻底替换为被管理的主观体验。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>佐助\u003c/strong>\u003cspan>不谋私利不能使独裁正当。他替五影、尾兽、鸣人与未来世代决定牺牲，仍把所有人用作秩序手段。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>鸣人\u003c/strong>\u003cspan>拒绝杀死佐助、为其保留重新选择的可能，较尊重人格；但“你必须做我的朋友”若成为强迫，也需受到自主边界约束。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"verdict\">\u003cstrong>最终选择：\u003c/strong>羽衣与鸣人的关系伦理，加上自由忍村之间公开、平等、法治化的持久联盟。任何尾兽、人柱力或少数族群都必须是规则参与者，而非和平代价。\u003c/div>\n        \u003cp class=\"blindspot\">理论盲点：康德能清楚划出不可侵犯的原则边界，却较少告诉我们，经历灭族、战争与丧亲后的人如何在情感上重新获得信任。\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"philosopher\" aria-labelledby=\"nagarjuna-lens\">\n        \u003cdiv class=\"philosopher-header\">\u003cdiv class=\"philosopher-index\">哲学家 04\u003c/div>\u003cdiv>\u003ch2 id=\"nagarjuna-lens\">龙树：战争来自把关系中的存在，误认成孤立不变的实体\u003c/h2>\u003cp class=\"philosopher-thesis\">“村落”“仇敌”“复仇者”与“救世主”都没有脱离因缘的固定本质，因此既会制造执著，也始终可能改变。\u003c/p>\u003c/div>\u003c/div>\n        \u003ch3>与和平相关的核心理念\u003c/h3>\n        \u003cp>龙树以\u003cspan class=\"term\" tabindex=\"0\">缘起性空\u003cspan class=\"tooltip\" role=\"tooltip\">一切事物依赖原因、条件、部分与概念而成立，因此没有独立、永恒不变的自性。空不等于不存在，恰恰说明因果与转化为何可能。\u003c/span>\u003c/span>反对把任何存在实体化。一个人不是先有封闭自我，再偶然进入关系；他的身份、能力、痛苦与选择始终由复杂条件共同生成。\u003c/p>\n        \u003cp>空性不是虚无主义，也不是要求人对他者冷漠。“放下执著”并非斩断羁绊，而是不再强迫自我、他人和世界永远符合一个固定叙事。理解缘起会导向慈悲：既然加害者也由无明、制度和创伤条件生成，我们可以改变条件；但因果仍然成立，所以理解绝不取消责任。\u003c/p>\n        \u003cdiv class=\"idea-box\">\u003cstrong>判断标准：\u003c/strong>方案是否把某个身份、欲望或秩序实体化为唯一真理？它能否看见众生相互依存，并通过改变条件减少痛苦，而不是消灭关系本身？\u003c/div>\n        \u003ch3>他会怎样看六条道路\u003c/h3>\n        \u003cdiv class=\"case-judgments\">\n          \u003cdiv class=\"judgment\">\u003cstrong>辉夜\u003c/strong>\u003cspan>把查克拉执取为“本来属于我”的实体，也把自己实体化为一切秩序的唯一源头。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>羽衣\u003c/strong>\u003cspan>忍宗最接近缘起直觉：力量的意义来自连接，而非独占。但把使命托付血缘后，关系再次被固定成继承身份。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>柱间\u003c/strong>\u003cspan>把流动的家族冲突重新组织，证明制度条件可改变；但“村子”后来被实体化为高于具体生命的绝对身份。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>斑／带土\u003c/strong>\u003cspan>将一次或多次真实创伤推成“整个现实本质上是地狱”，又要求梦中他人永远符合欲望，是对固定叙事的极端执取。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>佐助\u003c/strong>\u003cspan>幻想成为脱离所有关系的纯粹黑暗，忽略自己的力量、目标与自我都由他人生成。绝对孤独本身就是错误的自性想象。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>鸣人\u003c/strong>\u003cspan>最能看见人可在关系中改变，也拒绝把敌人固定成敌人；但若执著于“我必须救回所有人”，慈悲仍可能变成占有。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"verdict\">\u003cstrong>最终选择：\u003c/strong>以鸣人的关系修复与羽衣的相互连接为最近路径，但必须加入非执著的智慧：帮助他人改变，不等于替他人规定唯一正确的人生。\u003c/div>\n        \u003cp class=\"blindspot\">理论盲点：缘起能够深刻拆解敌我与救世主身份，却不直接提供跨国裁决、资源分配和权力制衡的完整制度蓝图。\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"philosopher\" aria-labelledby=\"arendt-lens\">\n        \u003cdiv class=\"philosopher-header\">\u003cdiv class=\"philosopher-index\">哲学家 05\u003c/div>\u003cdiv>\u003ch2 id=\"arendt-lens\">阿伦特：和平不是寂静，而是多种声音仍能共同出现\u003c/h2>\u003cp class=\"philosopher-thesis\">政治的条件是人的多元性；一个彻底可预测、没有新开端的世界，即使安静，也不再是公共世界。\u003c/p>\u003c/div>\u003c/div>\n        \u003ch3>与和平相关的核心理念\u003c/h3>\n        \u003cp>阿伦特把\u003cspan class=\"term\" tabindex=\"0\">多元性\u003cspan class=\"tooltip\" role=\"tooltip\">人们共同生活，却没有任何两个人完全相同；每个人都从不可替代的视角出现。多元不是治理障碍，而是政治生活得以存在的条件。\u003c/span>\u003c/span>视为政治行动的前提。行动不同于制作器物：制作者先有蓝图，再把材料加工成预定结果；政治行动则发生在许多自由者之间，其后果不可完全控制，也可能开启此前不存在的新事物。\u003c/p>\n        \u003cp>极权统治的终点不是让所有人相信同一种意见，而是消灭自发行动本身，把不同的人压缩成可预测的反应集合。和平若以取消意外、差异和公共言说为代价，就不是优良政治，而是政治消失。\u003c/p>\n        \u003cdiv class=\"idea-box\">\u003cstrong>判断标准：\u003c/strong>方案是否保留多个行动者公开出现、相互判断和发起新开端的空间？它是在建设共同世界，还是把众人加工成符合蓝图的材料？\u003c/div>\n        \u003ch3>她会怎样看六条道路\u003c/h3>\n        \u003cdiv class=\"case-judgments\">\n          \u003cdiv class=\"judgment\">\u003cstrong>辉夜\u003c/strong>\u003cspan>绝对占有取消众生自发行动，是最直接的支配。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>羽衣\u003c/strong>\u003cspan>精神沟通承认不同者能够彼此显现；但若只有共同理解、没有持久公共空间，行动仍难沉淀为政治世界。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>柱间\u003c/strong>\u003cspan>建村创造了较稳定的公共世界，却把村外者与边缘族群排除在“我们”之外；机构也可能以大局名义吞没具体声音。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>斑／带土\u003c/strong>\u003cspan>无限月读中的他人只是梦境系统生成的反应，没有不可预料的声音。它不是坏政治，而是公共世界彻底消失。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>佐助\u003c/strong>\u003cspan>清醒得以保留，多元行动却被缩减成对唯一敌人的共同恐惧。任何真正新开端都会被视为破坏稳定。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>鸣人\u003c/strong>\u003cspan>把固定敌人重新召回可言说、可回应的关系，并在联军中分享行动能力，最接近多元者共同创造新开端。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"verdict\">\u003cstrong>最终选择：\u003c/strong>鸣人与羽衣提供关系前提，忍者联军提供政治雏形：不同村落不是融成一个声音，而是在共同空间里以不同能力行动。战后任务是把这种临时公共空间制度化。\u003c/div>\n        \u003cp class=\"blindspot\">理论盲点：阿伦特对公共行动与自由的强调，不足以独自回答国家暴力威胁下如何集中防御，也较少处理私人哀痛的疗愈。\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"philosopher\" aria-labelledby=\"xunzi-lens\">\n        \u003cdiv class=\"philosopher-header\">\u003cdiv class=\"philosopher-index\">哲学家 06\u003c/div>\u003cdiv>\u003ch2 id=\"xunzi-lens\">荀子：好领袖会死，和平必须变成普通人的习惯\u003c/h2>\u003cp class=\"philosopher-thesis\">欲望、偏私与争利不会因一次感动消失；礼义与制度的任务，是把冲突导入可学习、可传承的秩序。\u003c/p>\u003c/div>\u003c/div>\n        \u003ch3>与和平相关的核心理念\u003c/h3>\n        \u003cp>荀子所谓“性恶”不等于人人注定作恶，而是指出人的自然欲望若缺少边界，会在资源有限时产生争夺。善来自\u003cspan class=\"term\" tabindex=\"0\">化性起伪\u003cspan class=\"tooltip\" role=\"tooltip\">通过有意识的学习、师法、礼义与反复实践，转化未经节制的自然倾向。“伪”在此指人为努力与文化创造，并非虚假欺骗。\u003c/span>\u003c/span>：人借助外部规范和长期练习，能够形成新的情感与行为方式。\u003c/p>\n        \u003cp>“礼”不只是僵硬礼节，而是安排欲望、地位、哀悼和资源的公共形式。好的制度既限制争夺，也教育情感，使人逐渐不必每次都靠英雄强行克制。真正稳定的和平必须能够被普通人重复，并在领袖更替后继续运作。\u003c/p>\n        \u003cdiv class=\"idea-box\">\u003cstrong>判断标准：\u003c/strong>方案是否把善意转化为可学习、可执行、可继承的制度实践？它能否安顿真实欲望与悲伤，而非仅靠压制、逃避或领袖人格？\u003c/div>\n        \u003ch3>他会怎样看六条道路\u003c/h3>\n        \u003cdiv class=\"case-judgments\">\n          \u003cdiv class=\"judgment\">\u003cstrong>辉夜\u003c/strong>\u003cspan>只有威势压服，没有礼义养成。统治者稍一衰弱，未经转化的争夺便会返回。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>羽衣\u003c/strong>\u003cspan>忍宗提供正确教化方向，却缺少稳固礼制去安排力量、继承与冲突，最终被忍术逻辑取代。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>柱间\u003c/strong>\u003cspan>六条道路中最严肃的制度建构者：他改变儿童参战规则、家族组织与公共身份。但尾兽均势、火影权力及族群参与仍设计不足。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>斑／带土\u003c/strong>\u003cspan>让欲望在梦中无限满足，不是转化欲望；让悲伤消失，也不是为悲伤提供可共同承受的形式。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>佐助\u003c/strong>\u003cspan>个人威慑不可学习也不可传承。世界只学会畏惧佐助，没有学会如何处理分歧。\u003c/span>\u003c/div>\n          \u003cdiv class=\"judgment\">\u003cstrong>鸣人\u003c/strong>\u003cspan>以身示范理解、克制与共享，具有君子教化力量；但若无制度接住，普通人无法靠模仿英雄完成长久和平。\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"verdict\">\u003cstrong>最终选择：\u003c/strong>以柱间的制度路线为骨架，以鸣人的关系实践为日常德育，以羽衣的相互连接为制度目的。荀子最可能拒绝只选一位人物，因为和平本来就是一项文化与制度工程。\u003c/div>\n        \u003cp class=\"blindspot\">理论盲点：礼制也可能被既得利益者垄断，若缺少平等权利、公开监督与异议空间，“秩序”会成为压制边缘群体的语言。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"philosophy-matrix\">\n        \u003ch2 id=\"philosophy-matrix\">裁决矩阵：六位哲学家的选择为何不同\u003c/h2>\n        \u003cp>下表不是历史事实，而是依据上述核心理念所作的解释性重构。“首选”表示最接近其理论方向，“可改造”表示保留机制但必须改变正当性或制度结构。\u003c/p>\n        \u003ctable class=\"matrix\">\n          \u003cthead>\u003ctr>\u003cth>哲学家\u003c/th>\u003cth>辉夜\u003c/th>\u003cth>羽衣\u003c/th>\u003cth>柱间\u003c/th>\u003cth>斑／带土\u003c/th>\u003cth>佐助\u003c/th>\u003cth>鸣人\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>亚里士多德\u003c/td>\u003ctd class=\"reject\">拒绝\u003c/td>\u003ctd class=\"possible\">可改造\u003c/td>\u003ctd class=\"possible\">可改造\u003c/td>\u003ctd class=\"reject\">拒绝\u003c/td>\u003ctd class=\"reject\">拒绝\u003c/td>\u003ctd class=\"best\">首选\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>霍布斯\u003c/td>\u003ctd class=\"possible\">能止战但危险\u003c/td>\u003ctd class=\"reject\">担保不足\u003c/td>\u003ctd class=\"best\">首选并升级\u003c/td>\u003ctd class=\"reject\">非政治和平\u003c/td>\u003ctd class=\"possible\">近似但无授权\u003c/td>\u003ctd class=\"possible\">促成契约\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>康德\u003c/td>\u003ctd class=\"reject\">拒绝\u003c/td>\u003ctd class=\"best\">首选之一\u003c/td>\u003ctd class=\"possible\">法治化\u003c/td>\u003ctd class=\"reject\">拒绝\u003c/td>\u003ctd class=\"reject\">拒绝\u003c/td>\u003ctd class=\"best\">首选之一\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>龙树\u003c/td>\u003ctd class=\"reject\">执取占有\u003c/td>\u003ctd class=\"best\">首选之一\u003c/td>\u003ctd class=\"possible\">松动村界\u003c/td>\u003ctd class=\"reject\">执取幻梦\u003c/td>\u003ctd class=\"reject\">执取孤我\u003c/td>\u003ctd class=\"best\">首选之一\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>阿伦特\u003c/td>\u003ctd class=\"reject\">取消行动\u003c/td>\u003ctd class=\"possible\">关系前提\u003c/td>\u003ctd class=\"possible\">公共空间\u003c/td>\u003ctd class=\"reject\">取消世界\u003c/td>\u003ctd class=\"reject\">压缩多元\u003c/td>\u003ctd class=\"best\">首选\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>荀子\u003c/td>\u003ctd class=\"reject\">只有威势\u003c/td>\u003ctd class=\"possible\">教化目的\u003c/td>\u003ctd class=\"best\">制度骨架\u003c/td>\u003ctd class=\"reject\">逃避养成\u003c/td>\u003ctd class=\"reject\">不可传承\u003c/td>\u003ctd class=\"possible\">德育实践\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n        \u003cp class=\"key-point\">\u003cstrong>最重要的分歧：\u003c/strong>亚里士多德先问共同体培养何种人格；霍布斯先问谁能让守约变得安全；康德先问规则能否尊重每个自主者；龙树先问我们实体化了什么；阿伦特先问多元行动是否仍可能；荀子先问和平能否被普通人学习与继承。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"ballot-lab\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"ballot-lab\">哲学家投票前：先预测，再查看裁决理由\u003c/h2>\u003cp>一次面对一位哲学家。根据刚才的核心理念，判断他最可能支持哪种方案或组合；可以跳过、返回或修改。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">6 位哲学家\u003c/span>\u003c/div>\n      \u003cdiv id=\"case-tabs\" class=\"step-tabs\" role=\"tablist\" aria-label=\"哲学家导航\">\u003c/div>\n      \u003cdiv id=\"case-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"case-prev\" class=\"button\" type=\"button\">← 上一位\u003c/button>\u003cbutton id=\"case-next\" class=\"button primary\" type=\"button\">下一位 →\u003c/button>\u003c/div>\u003cbutton id=\"case-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"focused-conclusion\">\n        \u003ch2 id=\"focused-conclusion\">集中结论：没有人选择原样保留某一条道路\u003c/h2>\n        \u003cp>六位哲学家没有形成一个共同冠军，却呈现出清晰收敛：辉夜、斑／带土与佐助的方案都让和平依赖单一意志垄断；差别只在于垄断的是力量、现实经验还是政治仇恨。它们能够快速消除某类不确定性，却同时关闭了被统治者参与和纠错的渠道。\u003c/p>\n        \u003cp>真正的争论发生在羽衣、柱间与鸣人之间：和平应以相互理解为起点，以可执行制度为骨架，还是以持续修复关系为日常机制？亚里士多德、康德、龙树与阿伦特更靠近鸣人／羽衣，霍布斯与荀子则迫使这条路线回答一个难题——当英雄退场、善意消退、下一次危机降临时，谁来执行规则？\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>因此，本课最终综合不是“鸣人永远正确”，而是三层和平：\u003c/strong>羽衣提供“他人值得被理解”的目的，柱间提供“冲突必须被组织”的制度意识，鸣人提供“关系破裂后仍可修复”的实践。三者必须相互限制：理解不能替代规则，制度不能吞没个体，羁绊不能沦为私人偏袒。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"lesson-check\">\n      \u003cdiv class=\"lab-head\">\u003cdiv>\u003ch2 id=\"lesson-check\">最终检验：和平机制，而非人物站队\u003c/h2>\u003cp>四道题只检验一个能力：能否根据哲学家的判断标准，解释他为什么选择某条和平道路。\u003c/p>\u003c/div>\u003cspan class=\"lab-label\">4 个问题\u003c/span>\u003c/div>\n      \u003cdiv id=\"quiz-tabs\" class=\"quiz-tabs\" role=\"tablist\" aria-label=\"问题导航\">\u003c/div>\n      \u003cdiv id=\"quiz-panels\">\u003c/div>\n      \u003cdiv class=\"lab-nav\">\u003cdiv class=\"lab-nav-group\">\u003cbutton id=\"quiz-prev\" class=\"button\" type=\"button\">← 上一题\u003c/button>\u003cbutton id=\"quiz-next\" class=\"button primary\" type=\"button\">下一题 →\u003c/button>\u003c/div>\u003cbutton id=\"quiz-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"further-reading\">\n        \u003ch2 id=\"further-reading\">延伸阅读：只围绕本课问题\u003c/h2>\n        \u003cul class=\"reading-list\">\n          \u003cli>\u003ca href=\"https://plato.stanford.edu/entries/aristotle-ethics/\">亚里士多德伦理学\u003c/a>\u003cspan>德性活动、蓬勃生活、友爱与共同体。\u003c/span>\u003c/li>\n          \u003cli>\u003ca href=\"https://www.earlymoderntexts.com/assets/pdfs/hobbes1651part2.pdf\">霍布斯《利维坦》第二部分\u003c/a>\u003cspan>契约为何需要共同权力执行。\u003c/span>\u003c/li>\n          \u003cli>\u003ca href=\"https://plato.stanford.edu/entries/kant-moral/\">康德道德哲学\u003c/a>\u003cspan>自主、人格与目的本身。\u003c/span>\u003c/li>\n          \u003cli>\u003ca href=\"https://iep.utm.edu/nagarjun/\">龙树\u003c/a>\u003cspan>缘起、空性与中道为何不等于虚无。\u003c/span>\u003c/li>\n          \u003cli>\u003ca href=\"https://plato.stanford.edu/entries/arendt/\">汉娜·阿伦特\u003c/a>\u003cspan>多元性、行动、公共世界与极权支配。\u003c/span>\u003c/li>\n          \u003cli>\u003ca href=\"https://plato.stanford.edu/entries/xunzi/\">荀子\u003c/a>\u003cspan>化性、礼义、情感养成与制度秩序。\u003c/span>\u003c/li>\n        \u003c/ul>\n      \u003c/section>\n    \u003c/div>\n\n    \u003cfooter class=\"lesson-footer\">\n      \u003cdiv class=\"takeaway\">\u003cstrong>核心结语：\u003c/strong>《火影忍者》关于和平最深的洞察，不是“理解能够自动消灭冲突”，而是任何和平方案都必须回答三个不同层次的问题：我们为何承认他人，怎样约束彼此的力量，以及关系破裂后如何重新开始。只回答其中一个问题，便会分别滑向无力的善意、冷酷的秩序或没有他人的安静。\u003c/div>\n      \u003cdiv class=\"completion\">\u003cstrong>全课程完成 · 共 7 讲\u003c/strong>你已经从忍界历史的因果链走到一个集中而可迁移的哲学问题：和平究竟是由谁实现、以什么机制实现，又由谁承担代价。\u003c/div>\n    \u003c/footer>\n  \u003c/main>\n\n  \u003cscript>\n    (function () {\n      \"use strict\";\n      var storagePrefix = \"course:session7:\";\n\n      function readState(key, fallback) {\n        try {\n          var saved = localStorage.getItem(storagePrefix + key);\n          return saved ? JSON.parse(saved) : fallback;\n        } catch (error) { return fallback; }\n      }\n\n      function writeState(key, value) {\n        try { localStorage.setItem(storagePrefix + key, JSON.stringify(value)); }\n        catch (error) { /* 禁用本地存储时，课程仍可使用。 */ }\n      }\n\n      function clampIndex(index, length) { return Math.max(0, Math.min(length - 1, index)); }\n\n      var models = [\n        { id: \"kaguya\", name: \"辉夜\", short: \"绝对占有\", mechanism: \"垄断力量与人口\", title: \"让所有潜在威胁失去行动能力\", summary: \"辉夜并非没有看见战争恐怖，而是把问题解释为‘力量分散必然产生威胁’。漫画明确呈现她以无限月读束缚人类、将其逐步转化为白绝军队；动画补完中，未被立即束缚者仍过着表面正常的村落生活，却可能被选入神树仪式。无限月读在这里是统治与改造人口的工具，不是最终幸福世界。\", problem: \"独立力量可能被用于战争；面对外来威胁，无法控制的人口也不能被统治者稳定地转化为战力。\", case: \"若一个绝对强者确实永远仁慈、全知且不可被腐化，集中力量或许能最快止战，并统一调度资源抵御外部威胁。\", cost: \"普通人可以保留表面日常，却没有知情、拒绝或参与决定的权利；身体、记忆、查克拉乃至人格都可被征用。\", failure: \"秩序完全依赖统治者正确；任何误判都没有外部纠错者。反抗会被定义为威胁，服从者也可能在秘密征用中被改造成白绝。\" },\n        { id: \"hagoromo\", name: \"羽衣\", short: \"心灵联结\", mechanism: \"共享理解\", title: \"让力量成为感知彼此的媒介\", summary: \"羽衣创立忍宗，试图通过查克拉连接精神经验，使人从相互理解中产生合作。其和平机制不是威慑，而是关系转化。\", problem: \"陌生与隔绝让他人的痛苦难以进入自己的判断，力量遂容易成为纯粹工具。\", case: \"只有当人真正感知他者，守约才不只是恐惧惩罚；共享力量也能创造共同责任。\", cost: \"理解本身没有强制执行力，也可能被技术化、武器化；善意难以抵挡有组织的野心。\", failure: \"忍宗异化为忍术，说明关系理想若无制度承接，会被权力竞争重新解释。\" },\n        { id: \"hashirama\", name: \"柱间\", short: \"制度停战\", mechanism: \"组织与均势\", title: \"把私人仇杀纳入公共制度\", summary: \"柱间以忍村取代家族战争，让儿童、任务、军力与领土进入较稳定组织，再以尾兽分配寻求大国均势。\", problem: \"仅靠个人友谊无法约束整个家族；冲突必须进入能执行规则的组织。\", case: \"忍村确实终止了战国时代持续性的家族混战，证明制度可以改变暴力发生的尺度与频率。\", cost: \"村落利益被置于个体之上，尾兽被工具化，族群与小国承担大国稳定的隐形代价。\", failure: \"战争从家族层级上移到忍村与国家层级，均势也可能催生军备竞赛。\" },\n        { id: \"moon\", name: \"斑／带土\", short: \"幻梦退出\", mechanism: \"取消共同现实\", title: \"让所有人退出会受伤的真实关系\", summary: \"斑从互信必然失败出发，带土从创伤经验出发；二人都选择无限月读，让众生永久停留在私人完美梦境。与辉夜不同，他们把梦境本身当作和平终点，而不是把受术者改造成现实军队的中间工具。\", problem: \"真实他人不可控制，爱越深便越可能遭遇失去；任何制度都无法保证关系永不破裂。\", case: \"若只衡量主观幸福和冲突数量，无限月读能够同时消除战争、匮乏、悲伤与挫败。\", cost: \"同意、行动、真实他者和公共世界全部消失；幸福只剩被系统生成的体验。\", failure: \"它没有教会不同的人共存，只删除了‘共同’。而且斑所理解的计划本身就是黑绝篡改后的骗局：神树并不会只维护无害梦境。\" },\n        { id: \"sasuke\", name: \"佐助\", short: \"唯一公敌\", mechanism: \"集中仇恨\", title: \"让全世界永远拥有同一个敌人\", summary: \"佐助保留现实，却准备摧毁五影与尾兽等旧权力，再以自身绝对力量承受全世界仇恨，迫使各国持续联合。\", problem: \"战时联盟依赖共同敌人；敌人消失后，旧权力与旧竞争可能立刻回归。\", case: \"他不谋求享乐，甚至愿意牺牲名誉与幸福；单一裁决也能避免五国协调失灵。\", cost: \"五影、尾兽、鸣人与后世无权决定自己的未来；所有异议都可能被视为破坏和平。\", failure: \"体系没有纠错与继承机制，也让社会永久围绕恐惧和战争准备组织。\" },\n        { id: \"naruto\", name: \"鸣人\", short: \"关系修复\", mechanism: \"共享与重接\", title: \"让断裂关系仍保留重新开始的可能\", summary: \"鸣人承认痛苦不可删除，以理解对手、共享力量、拒绝永久断绝来阻止复仇自我复制。和平被理解为持续实践，而非一次性终局。\", problem: \"孤立使人把创伤封闭成唯一身份；被排除者会在关系外积累下一轮复仇。\", case: \"它保留每个人的主体地位，也在联军实践中证明旧敌能通过共享风险创造新信任。\", cost: \"过程缓慢且可能失败；理解可能被误读为纵容，私人羁绊也可能形成偏私。\", failure: \"若没有跨村制度、责任程序与教育承接，和平会过度依赖鸣人本人。\" }\n      ];\n      var modelState = readState(\"model-explorer:v2\", \"kaguya\");\n      if (!models.some(function (model) { return model.id === modelState; })) modelState = \"kaguya\";\n\n      function renderModels() {\n        var buttons = document.getElementById(\"model-buttons\"); buttons.innerHTML = \"\";\n        models.forEach(function (model) {\n          var button = document.createElement(\"button\"); button.type = \"button\"; button.className = \"model-button\";\n          button.setAttribute(\"aria-pressed\", model.id === modelState ? \"true\" : \"false\");\n          var name = document.createElement(\"strong\"); name.textContent = model.name;\n          var short = document.createElement(\"span\"); short.textContent = model.short;\n          button.append(name, short); button.addEventListener(\"click\", function () { modelState = model.id; writeState(\"model-explorer:v2\", modelState); renderModels(); }); buttons.appendChild(button);\n        });\n        var selected = models.find(function (model) { return model.id === modelState; }) || models[0];\n        document.getElementById(\"model-mechanism\").textContent = selected.mechanism;\n        document.getElementById(\"model-title\").textContent = selected.title;\n        document.getElementById(\"model-summary\").textContent = selected.summary;\n        document.getElementById(\"model-problem\").textContent = selected.problem;\n        document.getElementById(\"model-case\").textContent = selected.case;\n        document.getElementById(\"model-cost\").textContent = selected.cost;\n        document.getElementById(\"model-failure\").textContent = selected.failure;\n      }\n      renderModels();\n\n      var cases = [\n        { scene: \"亚里士多德认为和平应服务于共同体成员的蓬勃生活，并通过习惯、友爱与实践智慧培养德性。\", title: \"他最可能选择哪条路线？\", options: [\"斑／带土：只要每个人感到幸福，是否真实行动并不重要。\", \"鸣人的德性友爱为核心，并用羽衣的理解与柱间的制度补足。\", \"佐助：把牺牲与勇气推到极端，便自然成为最高德性。\", \"辉夜：没有反抗能力的人最容易培养德性。\"], answer: 1, feedback: [\"亚里士多德不会把主观愉快等同于蓬勃生活；德性必须在真实活动中实现。\", \"解析正确：鸣人最接近使朋友为其自身活得好的德性友爱，但和平仍需教育与城邦制度承接。\", \"德性是合宜判断，不是把勇气或牺牲无限放大；佐助恰恰缺少实践智慧的校准。\", \"绝对服从取消了公民共同追求善的活动。\"] },\n        { scene: \"霍布斯认为没有共同权力时，各方会因安全恐惧而理性扩军；契约必须有执行者。\", title: \"他最可能选择哪条路线？\", options: [\"只依靠鸣人唤起所有人的善意，不建立公共执行结构。\", \"把柱间的组织路线升级为五村共同授权、能够裁决并执行规则的持久联邦。\", \"无限月读，因为沉睡与建立共同体完全相同。\", \"保留五村国际自然状态，只要求各方口头保证不先攻击。\"], answer: 1, feedback: [\"信任有帮助，却无法让守约在所有危机中保持安全。\", \"解析正确：霍布斯会保留柱间的制度直觉，并要求把五村之间的自然状态也纳入共同权力。\", \"无限月读删除了政治主体，没有通过契约建立共同体。\", \"没有执行者的承诺会在猜疑中失效，正是霍布斯问题的起点。\"] },\n        { scene: \"康德要求把每个理性主体同时当作目的，并让政治原则能够获得自由者的共同同意。\", title: \"他最可能选择哪条路线？\", options: [\"佐助：只要统治者没有私欲，便可替所有人决定牺牲。\", \"辉夜：安全目标足够伟大，可以取消人格自主。\", \"羽衣与鸣人的尊重关系，加上自由忍村之间公开、法治化的持久联盟。\", \"斑／带土：量身定制的快乐足以替代同意。\"], answer: 2, feedback: [\"无私动机不能替代受影响者的自主与共同立法资格。\", \"把人只当作安全蓝图的材料，违反目的本身原则。\", \"解析正确：这条组合同时保留人格自主，并以公开法律而非一位世界君主谋求永久和平。\", \"未经同意的幸福仍是把人格降格为感受容器。\"] },\n        { scene: \"龙树认为一切身份与事物依缘而生、没有固定自性；空性使改变与慈悲成为可能。\", title: \"他最可能选择哪条路线？\", options: [\"斩断所有关系，使佐助成为完全独立且永恒不变的自我。\", \"以鸣人的关系修复与羽衣的相互连接为近路，同时避免把‘救回他人’变成新的占有。\", \"辉夜收回所有查克拉，因为‘本来属于我’是一种不依赖关系的永恒事实。\", \"把村落身份固定为高于具体生命的终极实体。\"], answer: 1, feedback: [\"绝对孤立自我是龙树会拆解的自性想象。\", \"解析正确：缘起支持关系转化，非执著则提醒鸣人慈悲不能替他人规定唯一人生。\", \"‘本来属于我’正是把所有权与自我实体化的执取。\", \"村落同样依条件成立，不能被提升为永恒不变的终极实体。\"] },\n        { scene: \"阿伦特认为多元性是政治行动的条件；和平必须保留不同者公开出现与开启新事物的空间。\", title: \"她最可能选择哪条路线？\", options: [\"无限月读：每个梦中角色都按预设回应，因此公共生活最稳定。\", \"佐助：只允许全世界围绕一个敌人作出同一种政治反应。\", \"鸣人和羽衣的关系前提，加上联军中不同村落共同行动的公共空间。\", \"辉夜：由一人占有全部力量，避免多元行动制造意外。\"], answer: 2, feedback: [\"可预测投影不是真实他者；无限月读撤销了公共世界。\", \"共同恐惧把多元行动压缩成一种反应，不能形成有新开端的政治。\", \"解析正确：这条路线保留不同身份与能力，并让他们在同一公共空间中共同发起行动。\", \"消除自发行动正是阿伦特会警惕的全面支配。\"] },\n        { scene: \"荀子认为欲望与偏私必须由礼义、教育和反复实践加以转化，和平还要能在领袖更替后传承。\", title: \"他最可能选择哪条路线？\", options: [\"只依靠鸣人本人持续感化所有人。\", \"只依靠佐助的绝对战力压制争端。\", \"以柱间的制度为骨架、鸣人的实践为德育、羽衣的连接为制度目的。\", \"让所有欲望在私人梦境中无限满足。\"], answer: 2, feedback: [\"君子示范重要，但普通人需要可重复的礼法和制度。\", \"威势只能压制，不能使众人学会处理冲突，且无法稳定继承。\", \"解析正确：荀子会强调制度、教化与目的的组合，而非等待一位完美人物。\", \"无限满足欲望不是化性，也没有形成共同秩序。\"] }\n      ];\n      var caseState = readState(\"philosopher-ballot:v2\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(caseState.current)) caseState.current = 0;\n      caseState.current = clampIndex(caseState.current, cases.length);\n      caseState.answers = caseState.answers || {};\n      caseState.skipped = Array.isArray(caseState.skipped) ? caseState.skipped : [];\n\n      function saveCases() { writeState(\"philosopher-ballot:v2\", caseState); }\n      function goToCase(index) { caseState.current = clampIndex(index, cases.length); saveCases(); renderCases(); }\n      function answerCase(caseIndex, optionIndex) { caseState.answers[caseIndex] = optionIndex; caseState.skipped = caseState.skipped.filter(function (index) { return index !== caseIndex; }); saveCases(); renderCases(); }\n      function skipCase() { var current = caseState.current; if (!Object.prototype.hasOwnProperty.call(caseState.answers, current) && caseState.skipped.indexOf(current) === -1) caseState.skipped.push(current); caseState.current = current \u003c cases.length - 1 ? current + 1 : 0; saveCases(); renderCases(); }\n\n      function renderCases() {\n        var labels = [\"亚里士多德\", \"霍布斯\", \"康德\", \"龙树\", \"阿伦特\", \"荀子\"];\n        var tabs = document.getElementById(\"case-tabs\"); tabs.innerHTML = \"\";\n        var panels = document.getElementById(\"case-panels\"); panels.innerHTML = \"\";\n        cases.forEach(function (item, caseIndex) {\n          var tab = document.createElement(\"button\"); tab.type = \"button\"; tab.className = \"step-tab\";\n          if (Object.prototype.hasOwnProperty.call(caseState.answers, caseIndex)) tab.classList.add(\"answered\");\n          if (caseState.skipped.indexOf(caseIndex) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\"); tab.setAttribute(\"aria-selected\", caseIndex === caseState.current ? \"true\" : \"false\"); tab.setAttribute(\"aria-controls\", \"case-\" + caseIndex); tab.textContent = labels[caseIndex]; tab.addEventListener(\"click\", function () { goToCase(caseIndex); }); tabs.appendChild(tab);\n          var panel = document.createElement(\"section\"); panel.id = \"case-\" + caseIndex; panel.className = \"case-panel\"; panel.setAttribute(\"role\", \"tabpanel\"); panel.hidden = caseIndex !== caseState.current;\n          var count = document.createElement(\"div\"); count.className = \"step-count\"; count.textContent = \"哲学家 \" + (caseIndex + 1) + \" / \" + cases.length;\n          var scene = document.createElement(\"p\"); scene.className = \"case-scene\"; scene.textContent = item.scene;\n          var title = document.createElement(\"h3\"); title.className = \"question-title\"; title.textContent = item.title;\n          var options = document.createElement(\"div\"); options.className = \"options\";\n          item.options.forEach(function (optionText, optionIndex) {\n            var label = document.createElement(\"label\"); label.className = \"option\";\n            var input = document.createElement(\"input\"); input.type = \"radio\"; input.name = \"case-\" + caseIndex; input.value = String(optionIndex); input.checked = Number(caseState.answers[caseIndex]) === optionIndex; input.addEventListener(\"change\", function () { answerCase(caseIndex, optionIndex); });\n            var text = document.createElement(\"span\"); text.className = \"option-text\"; text.textContent = optionText; label.append(input, text); options.appendChild(label);\n          });\n          var feedback = document.createElement(\"div\"); feedback.className = \"answer-feedback\"; feedback.setAttribute(\"aria-live\", \"polite\");\n          var selected = caseState.answers[caseIndex];\n          if (selected === undefined) feedback.textContent = caseState.skipped.indexOf(caseIndex) !== -1 ? \"这位哲学家已暂时跳过。你可以随时回来。\" : \"先从核心理念推导选择，再查看解释。\";\n          else { var correct = Number(selected) === item.answer; feedback.classList.add(correct ? \"correct\" : \"incorrect\"); feedback.textContent = item.feedback[Number(selected)]; }\n          panel.append(count, scene, title, options, feedback); panels.appendChild(panel);\n        });\n        document.getElementById(\"case-prev\").disabled = caseState.current === 0;\n        document.getElementById(\"case-next\").textContent = caseState.current === cases.length - 1 ? \"回到第一位 ↺\" : \"下一位 →\";\n      }\n      doc
