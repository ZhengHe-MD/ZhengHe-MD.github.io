<html lang="zh-CN">

  <style>
@import url("https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&display=swap");

:root {
  color-scheme: light dark;
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", Georgia, serif;
  --font-heading-weight: 400;
  --font-body: "Figtree", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --space-1: 4.4px;
  --space-2: 8.8px;
  --space-3: 13.2px;
  --space-4: 17.6px;
  --space-6: 26.4px;
  --space-8: 35.2px;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, var(--color-text) 8%, transparent);
  --shadow-md: 0 4px 12px color-mix(in srgb, var(--color-text) 8%, transparent), 0 1px 2px color-mix(in srgb, var(--color-text) 5%, transparent);
  --shadow-lg: 0 16px 36px color-mix(in srgb, var(--color-text) 12%, transparent), 0 2px 6px color-mix(in srgb, var(--color-text) 6%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  font-weight: 400;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.cs-export-shell {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
}
.cs-export-container {
  max-width: 1700px;
  margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 56px);
}

/* Header */
.cs-export-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 40px;
  padding: clamp(36px, 5vw, 64px) 0 clamp(28px, 3vw, 40px);
  border-bottom: 1px solid var(--color-divider);
}
.cs-export-header-text { min-width: 0; }
.cs-export-title {
  max-width: 20ch;
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: clamp(38px, 6vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}
.cs-export-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
}
.cs-lang-switcher {
  display: inline-flex;
  align-items: center;
  background: var(--color-surface);
  border: 1px solid var(--color-accent-300);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.cs-lang-pill {
  border: 0;
  background: transparent;
  color: var(--color-neutral-700);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s ease;
  line-height: 1.2;
}
.cs-lang-pill:hover {
  color: var(--color-text);
}
.cs-lang-pill.active {
  background: var(--color-accent);
  color: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}
.cs-nav-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-600);
  margin-left: auto;
  flex: none;
}
.cs-companion-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--color-accent-300);
  background: var(--color-accent-100);
  color: var(--color-accent-800);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
}
.cs-companion-toggle:hover {
  background: var(--color-accent-200);
  border-color: var(--color-accent-400);
}
.cs-companion-toggle.active {
  background: var(--color-accent);
  color: #fff;
  border-color: var(--color-accent);
}
.cs-companion-toggle-icon { font-size: 15px; }

/* Main layout */
.cs-export-layout {
  display: grid;
  gap: clamp(20px, 2.4vw, 40px);
  align-items: start;
  justify-content: start;
  padding: clamp(24px, 3.4vw, 40px) 0 80px;
}

/* Nav */
.cs-export-nav {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
  padding: 22px 18px;
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  max-height: calc(100vh - 48px);
  overflow-y: auto;
}
.cs-export-nav.is-rail {
  padding: 18px 12px;
}
.cs-export-nav.is-rail .cs-export-nav-heading,
.cs-export-nav.is-rail .cs-nav-label {
  display: none;
}
.cs-export-nav-heading {
  padding: 0 10px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}
.cs-page-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cs-nav-item {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--color-neutral-800);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  text-align: left;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.cs-export-nav.is-rail .cs-nav-item {
  grid-template-columns: 28px;
  padding: 8px;
  justify-content: center;
}
.cs-nav-item:hover {
  background: var(--color-accent-200);
}
.cs-nav-item.active {
  background: var(--color-accent-100);
  color: var(--color-accent-800);
  font-weight: 700;
}
.cs-nav-num {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-700);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: background .15s ease, color .15s ease;
}
.cs-nav-item.active .cs-nav-num {
  background: var(--color-accent);
  color: #fff;
}
.cs-nav-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Reader */
.cs-export-reader {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.cs-frame-card {
  border-radius: var(--radius-lg);
  background: #fff;
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid var(--color-divider);
}
.cs-frame-card iframe {
  display: block;
  width: 100%;
  min-height: 560px;
  border: 0;
  background: #fff;
}
.cs-export-pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 6px 0;
}
.cs-btn-prev, .cs-btn-next {
  font-family: var(--font-body);
  font-size: 14.5px;
  font-weight: 700;
  line-height: 1;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s ease;
}
.cs-btn-prev {
  padding: 13px 24px;
  border: 1px solid var(--color-neutral-300);
  background: transparent;
  color: var(--color-text);
}
.cs-btn-prev:hover:not(:disabled) {
  background: var(--color-accent-100);
}
.cs-btn-next {
  padding: 13px 26px;
  border: 1px solid var(--color-accent);
  background: var(--color-accent);
  color: #fff;
}
.cs-btn-next:hover:not(:disabled) {
  background: var(--color-accent-600);
  border-color: var(--color-accent-600);
}
.cs-btn-prev:disabled, .cs-btn-next:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Companion Drawer / Aside */
.cs-companion-drawer {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  max-height: calc(100vh - 48px);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  animation: cs-fade-in .18s ease-out;
}
.cs-companion-drawer[hidden] {
  display: none !important;
}
.cs-companion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--color-divider);
}
.cs-companion-header strong {
  font-family: var(--font-heading);
  font-weight: 400;
  font-size: 17px;
  line-height: 1.2;
}
.cs-companion-close {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  border: 0;
  border-radius: 999px;
  background: var(--color-neutral-200);
  color: var(--color-neutral-800);
  font-size: 14px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.cs-companion-close:hover {
  background: var(--color-accent-200);
  color: var(--color-accent-900);
}
.cs-companion-content {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.cs-companion-empty {
  margin: 40px 0 0;
  text-align: center;
  color: var(--color-neutral-700);
  font-size: 14px;
}
.cs-companion-session {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cs-companion-session-title {
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--color-neutral-300);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}
.cs-companion-turn {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 8px;
}
.cs-turn-block {
  padding: 13px 15px;
  border-radius: var(--radius-md);
  font-size: 14px;
  line-height: 1.6;
}
.cs-turn-user {
  background: var(--color-accent-2-100);
  border: 1px solid var(--color-accent-2-300);
  color: var(--color-text);
}
.cs-turn-agent {
  background: #fffdf8;
  border: 1px solid var(--color-divider);
  color: var(--color-text);
}
.cs-turn-author {
  display: block;
  margin-bottom: 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.cs-turn-user .cs-turn-author {
  color: var(--color-accent-2-800);
}
.cs-turn-agent .cs-turn-author {
  color: var(--color-accent-700);
}
.cs-turn-text {
  white-space: pre-wrap;
  word-break: break-word;
}
.cs-turn-reasoning {
  border: 1px solid var(--color-accent-200);
  border-radius: var(--radius-md);
  background: var(--color-accent-100);
  padding: 8px 12px;
  font-size: 12.5px;
  color: var(--color-neutral-800);
}
.cs-turn-reasoning summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--color-accent-800);
  list-style: none;
}
.cs-turn-reasoning summary::-webkit-details-marker {
  display: none;
}
.cs-turn-reasoning ul {
  margin: 8px 0 4px;
  padding-left: 18px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cs-companion-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(46, 43, 37, 0.4);
  z-index: 800;
  backdrop-filter: blur(2px);
}
.cs-companion-backdrop[hidden] {
  display: none !important;
}

@keyframes cs-fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1024px) {
  .cs-export-header {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .cs-export-actions {
    margin-top: 8px;
  }
  .cs-export-layout {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .cs-export-nav {
    position: static;
    max-height: none;
    overflow-y: visible;
  }
  .cs-export-nav .cs-page-list {
    flex-direction: row;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .cs-export-nav .cs-nav-item {
    min-width: 180px;
  }
  .cs-companion-drawer {
    position: fixed;
    top: 20px;
    right: 20px;
    bottom: 20px;
    width: min(440px, calc(100vw - 40px));
    max-height: none;
    z-index: 900;
    box-shadow: var(--shadow-lg);
  }
}

@media print {
  .cs-export-nav, .cs-export-pager, .cs-companion-toggle, .cs-companion-drawer, .cs-companion-backdrop {
    display: none !important;
  }
  .cs-export-layout {
    display: block;
  }
  .cs-frame-card {
    border: 0;
    box-shadow: none;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1c1815;
    --color-surface: #262019;
    --color-text: #f2ece2;
    --color-accent: #e2874a;
    --color-accent-2: #9cb07c;
    --color-divider: color-mix(in srgb, #f2ece2 14%, transparent);

    --color-neutral-100: #2e2b25;
    --color-neutral-200: #474238;
    --color-neutral-300: #645c50;
    --color-neutral-400: #82796a;
    --color-neutral-500: #a19786;
    --color-neutral-600: #c0b6a5;
    --color-neutral-700: #dcd3c4;
    --color-neutral-800: #eee7db;
    --color-neutral-900: #f9f4ed;

    --color-accent-100: #402310;
    --color-accent-200: #643312;
    --color-accent-300: #8c491a;
    --color-accent-400: #b2622d;
    --color-accent-500: #d67f48;
    --color-accent-600: #f6a06b;
    --color-accent-700: #ffc6a5;
    --color-accent-800: #ffe1d0;
    --color-accent-900: #fff2eb;

    --color-accent-2-100: #272e1b;
    --color-accent-2-200: #3d472b;
    --color-accent-2-300: #56633f;
    --color-accent-2-400: #728157;
    --color-accent-2-500: #8fa073;
    --color-accent-2-600: #aebf92;
    --color-accent-2-700: #ccdbb2;
    --color-accent-2-800: #e1eecc;
    --color-accent-2-900: #f0fae1;
  }
  .cs-frame-card,
  .cs-frame-card iframe {
    background: var(--color-surface);
  }
  .cs-turn-agent {
    background: var(--color-surface);
  }
}
</style>
</head>

<div class="cs-export-shell">
  <div class="cs-export-container">
    <header class="cs-export-header">
      <div class="cs-export-header-text">
        <h1 class="cs-export-title">《火影忍者》主线重构</h1>
      </div>
      <div class="cs-export-actions">
        
        <button id="cs-companion-toggle" class="cs-companion-toggle" type="button" aria-expanded="false" aria-controls="cs-companion-drawer">
          <span class="cs-companion-toggle-icon">💬</span>
          <span id="cs-companion-toggle-label">共同设计对话</span>
        </button>
      </div>
    </header>

    <div class="cs-export-layout" id="cs-export-layout">
      <nav class="cs-export-nav" id="cs-export-nav" aria-label="课程内容">
        <strong class="cs-export-nav-heading">课程内容</strong>
        <div id="cs-page-list" class="cs-page-list"></div>
      </nav>

      <main class="cs-export-reader" id="cs-export-reader">
        <div class="cs-frame-card">
          <iframe id="cs-course-frame" data-frame="course" title="《火影忍者》主线重构"></iframe>
        </div>
        <div class="cs-export-pager">
          <button id="cs-previous" class="cs-btn-prev" type="button">← 上一页</button>

          <strong>共同设计对话与问答</strong>
          <button id="cs-companion-close" class="cs-companion-close" type="button" aria-label="关闭">✕</button>

        <div id="cs-companion-content" class="cs-companion-content"></div>
      </aside>
    </div>
  </div>
</div>
<div id="cs-companion-backdrop" class="cs-companion-backdrop" hidden></div>

(() => {

00;\n      letter-spacing: 0.14em;\n    }\n\n    h1, h2, h3 { line-height: 1.25; text-wrap: balance; }\n\n    h1 {\n      max-width: 15em;\n      margin: 0;\n      font-size: clamp(2.35rem, 6vw, 4.8rem);\n      font-weight: 650;\n      letter-spacing: -0.035em;\n    }\n\n    .subtitle {\n      max-width: 48rem;\n      margin: 1.5rem 0 0;\n      color: var(--muted);\n      font-size: 1.12rem;\n    }\n\n    h2 {\n      margin: 4.2rem 0 1.25rem;\n      font-size: clamp(1.65rem, 3vw, 2.2rem);\n    }\n\n    h3 { margin: 0 0 0.55rem; font-size: 1.18rem; }\n\n    p { margin: 0.85rem 0; }\n\n    .thesis {\n      margin: 2rem 0 0;\n      padding: 1.35rem 1.5rem;\n      border-left: 4px solid var(--accent);\n      background: var(--accent-soft);\n      font-size: 1.08rem;\n    }\n\n    .facts {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 1px;\n      margin: 2rem 0 0;\n      overflow: hidden;\n      border: 1px solid var(--line);\n      border-radius: 0.8rem;\n      background: var(--line);\n    }\n\n    .fact { padding: 1rem 1.15rem; background: var(--card); }\n    .fact strong { display: block; color: var(--accent); font-size: 1.2rem; }\n    .fact span { color: var(--muted); font-size: 0.86rem; }\n\n    .sessions {\n      display: grid;\n      gap: 1rem;\n      margin-top: 1.6rem;\n    }\n\n    .session {\n      display: grid;\n      grid-template-columns: 5rem 1fr;\n      gap: 1.25rem;\n      padding: 1.35rem;\n      border: 1px solid var(--line);\n      border-radius: 0.85rem;\n      background: var(--card);\n    }\n\n    .session-number {\n      color: var(--accent);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.78rem;\n      font-weight: 750;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .session p { margin: 0.45rem 0; color: var(--muted); }\n\n    .session-focus {\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.9rem;\n    }\n\n    .session-focus strong { color: var(--ink); }\n\n    .time {\n      display: inline-block;\n      margin-top: 0.45rem;\n      padding: 0.12rem 0.55rem;\n      border-radius: 999px;\n      background: var(--paper-deep);\n      color: var(--muted);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.78rem;\n    }\n\n    .principles {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 1rem;\n      margin-top: 1.5rem;\n    }\n\n    .principle {\n      padding: 1.25rem;\n      border-top: 3px solid var(--line);\n      background: rgba(255, 253, 248, 0.42);\n    }\n\n    .principle p { color: var(--muted); font-size: 0.94rem; }\n\n    ul { padding-left: 1.3rem; }\n    li + li { margin-top: 0.5rem; }\n\n    .not-included {\n      padding: 1.35rem 1.5rem;\n      border: 1px dashed var(--line);\n      border-radius: 0.8rem;\n      color: var(--muted);\n    }\n\n    .closing {\n      margin-top: 4rem;\n      padding-top: 1.6rem;\n      border-top: 1px solid var(--line);\n      color: var(--muted);\n      font-style: italic;\n    }\n\n    @media (max-width: 680px) {\n      body { font-size: 16px; }\n      .content { width: min(100% - 2rem, 88ch); padding-top: 3rem; }\n      .facts, .principles { grid-template-columns: 1fr; }\n      .session { grid-template-columns: 1fr; gap: 0.35rem; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cheader>\n      \u003cp class=\"eyebrow\">课程大纲 · 全知视角\u003c/p>\n      \u003ch1>《火影忍者》主线重构\u003c/h1>\n      \u003cp class=\"subtitle\">从大筒木辉夜到终结之谷，以全知视角重构因果脉络：跳脱连载揭秘的叙事顺序，深度追踪忍界创伤如何代际复制，以及鸣人何以最终令其戛然而止。\u003c/p>\n\n      \u003cblockquote class=\"thesis\">\n        本课程的核心立论在于：忍界大战绝非正邪双方争夺霸权的武力对抗，而是数种“如何终结世间苦痛”的救世构想之间的殊死较量。辉夜、斑、带土、佐助与鸣人皆欲平息纷争；真正的分野，在于是否依然相信人与人能够在不被强权支配的前提下达成心灵共鸣。\n      \u003c/blockquote>\n\n      \u003cdiv class=\"facts\" aria-label=\"课程概况\">\n        \u003cdiv class=\"fact\">\u003cstrong>7 讲\u003c/strong>\u003cspan>主线重构与哲学进阶\u003c/span>\u003c/div>\n        \u003cdiv class=\"fact\">\u003cstrong>约 200 分钟\u003c/strong>\u003cspan>一部忍界思想史\u003c/span>\u003c/div>\n        \u003cdiv class=\"fact\">\u003cstrong>全知视角\u003c/strong>\u003cspan>依真实历史纪年溯源\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"course-goal\">\n        \u003ch2 id=\"course-goal\">学完本课，你将真正读懂什么\u003c/h2>\n        \u003cul>\n          \u003cli>将辉夜、六道仙人、因陀罗与阿修罗、柱间与斑、鸣人与佐助贯通为一部浑然一体的忍界思想史，而非后期机械追加的背景设定。\u003c/li>\n          \u003cli>洞悉“忍宗”如何异化为“忍术与忍村”，看清制度虽能暂时弹压战火，为何却始终无法消解仇恨。\u003c/li>\n          \u003cli>明辨柱间、斑、带土、佩恩、佐助与鸣人各自的和平构想：他们面对着相同的历史困境，却对人性作出了截然不同的哲学判词。\u003c/li>\n          \u003cli>理解鸣人最终的胜利不仅是战力上的胜出，更是从根源上打破了“失去—孤独—复仇—再度失去”的宿命轮回机制。\u003c/li>\n          \u003cli>借亚里士多德、霍布斯、康德、龙树、阿伦特与荀子六种思想透镜，集中检验忍界各类和平方案如何处理安全、主体地位、制度纠错与共同生活。\u003c/li>\n        \u003c/ul>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"course-route\">\n        \u003ch2 id=\"course-route\">课程路线\u003c/h2>\n        \u003cdiv class=\"sessions\">\n          \u003carticle class=\"session\">\n            \u003cdiv class=\"session-number\">第一讲\u003c/div>\n            \u003cdiv>\n              \u003ch3>力量来到人间：辉夜、神树与六道仙人的遗产\u003c/h3>\n              \u003cp>溯源查克拉之始：辉夜何以从世界的庇护者异化为绝对的支配者；羽衣如何创立“忍宗”开辟另一条通途；因陀罗与阿修罗的殊途，又怎样将“力量崇拜”与“心灵羁绊”的根本分歧深植于忍界基底。\u003c/p>\n              \u003cp class=\"session-focus\">\u003cstrong>核心冲突：\u003c/strong>辉夜 vs. 羽衣；因陀罗 vs. 阿修罗\u003c/p>\n              \u003cspan class=\"time\">25 分钟\u003c/span>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"session\">\n            \u003cdiv class=\"session-number\">第二讲\u003c/div>\n            \u003cdiv>\n              \u003ch3>从战国到忍村：柱间与斑为何共同成功，又共同失败\u003c/h3>\n              \u003cp>重审千手与宇智波停战、木叶建村、尾兽分配直至终结之谷决裂。核心不在罗列历史事件，而在剖析两位缔造者对和平前提的根本分歧，以及柱间所构筑的制度和平背后深埋的结构性隐患。\u003c/p>\n              \u003cp class=\"session-focus\">\u003cstrong>核心冲突：\u003c/strong>柱间的“先建立互信” vs. 斑的“先消除不确定性”\u003c/p>\n              \u003cspan class=\"time\">30 分钟\u003c/span>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"session\">\n            \u003cdiv class=\"session-number\">第三讲\u003c/div>\n            \u003cdiv>\n              \u003ch3>斑的幽灵：月之眼计划如何借带土进入现实\u003c/h3>\n              \u003cp>解析斑假死退隐、布局轮回眼、设计琳之死、带土彻底决绝、九尾袭村直至“晓”组织异化。我们将层层剥开斑最具蛊惑力的核心命题：现实中的爱，为何在他眼中必然沦为制造痛苦的深渊。\u003c/p>\n              \u003cp class=\"session-focus\">\u003cstrong>核心冲突：\u003c/strong>直面伴随伤痛的真实世界 vs. 遁入永无缺憾的虚幻梦境\u003c/p>\n              \u003cspan class=\"time\">30 分钟\u003c/span>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"session\">\n            \u003cdiv class=\"session-number\">第四讲\u003c/div>\n            \u003cdiv>\n              \u003ch3>两名遗孤：鸣人与佐助怎样继承了整个忍界\u003c/h3>\n              \u003cp>透视宇智波政变与灭族惨剧、鼬的绝境抉择、鸣人的孤立无援、佐助的复仇执念，直至终结之谷初次决裂。将两人的命运置于宏大的忍界制度史中，读懂他们绝非扁平的“热血少年”与“冷血复仇者”。\u003c/p>\n              \u003cp class=\"session-focus\">\u003cstrong>核心冲突：\u003c/strong>在羁绊中共同承担伤痛 vs. 借斩断羁绊获取绝对力量\u003c/p>\n              \u003cspan class=\"time\">30 分钟\u003c/span>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"session\">\n            \u003cdiv class=\"session-number\">第五讲\u003c/div>\n            \u003cdiv>\n              \u003ch3>忍界大战：所有和平方案在同一战场上接受检验\u003c/h3>\n              \u003cp>纵览五影联军、秽土转生大军、十尾复活、带土与斑相继化身人柱力、无限月读降临、黑绝背刺与辉夜重临，直至第七班联手完成终极封印。拨开纷繁战局，只聚焦决定忍界命运的关键转折。\u003c/p>\n              \u003cp class=\"session-focus\">\u003cstrong>核心冲突：\u003c/strong>被强加的无痛完美秩序 vs. 众人共同担荷的不完美现实\u003c/p>\n              \u003cspan class=\"time\">30 分钟\u003c/span>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"session\">\n            \u003cdiv class=\"session-number\">第六讲\u003c/div>\n            \u003cdiv>\n              \u003ch3>最后的敌人不是辉夜：鸣人与佐助的最终裁决\u003c/h3>\n              \u003cp>封印辉夜之后，佐助提出由自身独揽世间仇恨的“终极革命”；鸣人则坚决拒绝以新的孤独来维系和平。终结之谷的宿命二番战，不仅重演了柱间与斑的悲剧交锋，更从根本上改写了因陀罗与阿修罗绵延千年的恩怨结局。\u003c/p>\n              \u003cp class=\"session-focus\">\u003cstrong>核心冲突：\u003c/strong>独揽仇恨的专断秩序 vs. 永不割舍羁绊的生命共同体\u003c/p>\n              \u003cspan class=\"time\">20 分钟\u003c/span>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"session\">\n            \u003cdiv class=\"session-number\">第七讲\u003c/div>\n            \u003cdiv>\n              \u003ch3>忍界和平的哲学讨论\u003c/h3>\n              \u003cp>将辉夜、羽衣、柱间、斑与带土、佐助、鸣人的构想归并为六种和平机制；由亚里士多德、霍布斯、康德、龙树、阿伦特与荀子先陈述核心理念，再逐案裁决并说明选择与盲点。\u003c/p>\n              \u003cp class=\"session-focus\">\u003cstrong>核心冲突：\u003c/strong>绝对控制、幻梦退出、制度停战与关系修复，何者能同时保有安全、主体地位与纠错能力\u003c/p>\n              \u003cspan class=\"time\">40 分钟\u003c/span>\n            \u003c/div>\n          \u003c/article>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"analysis-lenses\">\n        \u003ch2 id=\"analysis-lenses\">审视全剧的四副透镜\u003c/h2>\n        \u003cdiv class=\"principles\">\n          \u003carticle class=\"principle\">\n            \u003ch3>创伤何以代际复制\u003c/h3>\n            \u003cp>剧中没有凭空产生的“黑化”；每一次人性的偏转，都深植于从“遭受失去”、“深感无力”到“渴望绝对掌控”的严密心理链条中。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"principle\">\n            \u003ch3>和平的代价由谁背负\u003c/h3>\n            \u003cp>忍村体制的维系、宇智波的覆灭、无限月读的幻梦乃至佐助的革命构想，无一不在将维稳的代价转嫁给具体的个体或群体。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"principle\">\n            \u003ch3>力量与羁绊何者为先\u003c/h3>\n            \u003cp>因陀罗式的道路主张“先以卓越伟力确立绝对秩序”；阿修罗式的道路则坚信“唯有在彼此依存与协作中，才能孕育出真正的力量”。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"principle\">\n            \u003ch3>理解是否等同于原谅\u003c/h3>\n            \u003cp>鸣人这一角色的非凡之处，不在于轻佻地为对手开脱罪责，而在于深切共情其绝望与痛苦的同时，依然坚定不移地阻断其歧途。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"learning-method\">\n        \u003ch2 id=\"learning-method\">学习方式\u003c/h2>\n        \u003cp>每一讲均遵循清晰的探究脉络：首先按真实历史时间线复盘核心事件，继而深度还原对立双方各自最强有力的思想论据，再通过因果溯源、立场校准与情境决策等互动实验检验认知，最终将当代表达与前代宿命对照剖析。所有互动均实时保存进度，支持跳过与回溯，重在启发思考，不设标准答案门槛。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"scope-boundary\">\n        \u003ch2 id=\"scope-boundary\">有意舍弃的内容\u003c/h2>\n        \u003cdiv class=\"not-included\">\n          \u003cp>本课不涉及《博人传》，亦不逐一复述中忍考试、单次营救任务、晓组织成员单挑及各大忍村琐碎沿革。卡卡西、鼬、自来也、长门等关键人物，仅在切实推动主线因果或彰显核心思想交锋时登场剖析。\u003c/p>\n          \u003cp>动画原创篇幅、时间线细节分歧及战力排行均不作探讨；我们的旨趣不在编纂百科全书，而在将这部史诗中最具分量的思想脉络与悲剧逻辑彻底贯通。\u003c/p>\n        \u003c/div>\n      \u003c/section>\n    \u003c/div>\n\n    \u003cp class=\"closing\">终极追问：如果世间的痛苦注定无法彻底抹去，人是否依然有理由选择伤痛犹存的真实羁绊，而非绝对安全的虚幻梦境？\u003c/p>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},{"path":"session1.html","basePath":"session1.html","lang":"zh-CN","kind":"lesson","title":"力量、联结与轮回","translations":{"zh-CN":"session1.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"力量、联结与轮回\">\n  \u003ctitle>力量来到人间：辉夜与六道仙人的遗产｜《火影忍者》主线重构\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f6f1e7;\n      --paper-deep: #ebe1cf;\n      --ink: #292721;\n      --muted: #6c665b;\n      --accent: #9a4938;\n      --accent-dark: #713528;\n      --accent-soft: #ead3c8;\n      --sage: #66745c;\n      --sage-soft: #dfe4d8;\n      --gold: #a9782e;\n      --gold-soft: #eee1c1;\n      --line: #d8ccba;\n      --card: rgba(255, 253, 248, 0.78);\n      --white: #fffdf8;\n      --shadow: 0 16px 44px rgba(71, 52, 33, 0.08);\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; background: var(--paper); }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 15% 0%, rgba(255, 255, 255, 0.76), transparent 32rem),\n        var(--paper);\n      font-family: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", Georgia, serif;\n      font-size: 18px;\n      line-height: 1.72;\n    }\n\n    button, input { font: inherit; }\n    button { color: inherit; }\n\n    a { color: var(--accent-dark); text-underline-offset: 0.18em; }\n\n    .content {\n      width: min(100% - 3rem, 88ch);\n      max-width: 88ch;\n      margin: 0 auto;\n      padding: 2rem 0 6rem;\n    }\n\n    html[data-studio-width=\"wide\"] .content { max-width: 104ch; }\n    html[data-studio-width=\"full\"] .content { max-width: 100%; }\n\n    html[data-studio-width=\"full\"] .prose,\n    html[data-studio-width=\"full\"] .lesson-header,\n    html[data-studio-width=\"full\"] .lesson-footer {\n      width: min(100% - 3rem, 78ch);\n      margin-inline: auto;\n    }\n\n    .topbar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1rem;\n      padding-bottom: 1.5rem;\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.82rem;\n    }\n\n    .topbar a { color: var(--muted); text-decoration: none; }\n    .topbar a:hover { color: var(--accent); }\n    .lesson-count { color: var(--muted); letter-spacing: 0.06em; }\n\n    .lesson-header {\n      padding: 3.4rem 0 3rem;\n      border-top: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.8rem;\n      color: var(--accent);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.78rem;\n      font-weight: 750;\n      letter-spacing: 0.14em;\n    }\n\n    h1, h2, h3 { line-height: 1.26; text-wrap: balance; }\n\n    h1 {\n      max-width: 16em;\n      margin: 0;\n      font-size: clamp(2.35rem, 6vw, 4.6rem);\n      font-weight: 650;\n      letter-spacing: -0.035em;\n    }\n\n    .lede {\n      max-width: 47rem;\n      margin: 1.4rem 0 0;\n      color: var(--muted);\n      font-size: 1.12rem;\n    }\n\n    .lesson-meta {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.6rem;\n      margin-top: 1.5rem;\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.8rem;\n    }\n\n    .lesson-meta span {\n      padding: 0.28rem 0.66rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--muted);\n      background: rgba(255, 253, 248, 0.52);\n    }\n\n    section { scroll-margin-top: 1.5rem; }\n\n    h2 {\n      margin: 4.5rem 0 1.2rem;\n      font-size: clamp(1.7rem, 3vw, 2.3rem);\n    }\n\n    h3 { margin: 1.8rem 0 0.6rem; font-size: 1.2rem; }\n    p { margin: 0.9rem 0; }\n    ul { padding-left: 1.25rem; }\n    li + li { margin-top: 0.5rem; }\n\n    .opening-question {\n      margin: 2.2rem 0 0;\n      padding: 1.25rem 1.45rem;\n      border-left: 4px solid var(--accent);\n      background: var(--accent-soft);\n      font-size: 1.08rem;\n    }\n\n    .learning-goals {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 1px;\n      margin: 2.2rem 0 0;\n      overflow: hidden;\n      border: 1px solid var(--line);\n      border-radius: 0.8rem;\n      background: var(--line);\n    }\n\n    .goal { padding: 1rem 1.1rem; background: var(--card); }\n    .goal strong { display: block; color: var(--accent); font-size: 1.25rem; }\n    .goal span { color: var(--muted); font-size: 0.88rem; }\n\n    .thesis-grid {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 1rem;\n      margin-top: 1.5rem;\n    }\n\n    .thesis-card {\n      position: relative;\n      min-height: 13rem;\n      padding: 1.3rem;\n      overflow: visible;\n      border: 1px solid var(--line);\n      border-radius: 0.85rem;\n      background: var(--card);\n    }\n\n    .thesis-card:hover,\n    .thesis-card:focus-within { z-index: 5; }\n\n    .thesis-card::after {\n      content: attr(data-step);\n      position: absolute;\n      right: 0.65rem;\n      bottom: 0.15rem;\n      color: rgba(154, 73, 56, 0.09);\n      font-family: Georgia, serif;\n      font-size: 6rem;\n      line-height: 1;\n    }\n\n    .thesis-card h3 { margin-top: 0; }\n    .thesis-card p { color: var(--muted); font-size: 0.94rem; }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      outline: none;\n    }\n\n    .term:focus-visible { border-radius: 0.2rem; box-shadow: 0 0 0 3px var(--accent-soft); }\n\n    .tooltip {\n      position: absolute;\n      z-index: 20;\n      left: 50%;\n      bottom: calc(100% + 0.65rem);\n      width: min(18rem, 75vw);\n      padding: 0.75rem 0.85rem;\n      border: 1px solid var(--line);\n      border-radius: 0.6rem;\n      color: var(--ink);\n      background: var(--white);\n      box-shadow: var(--shadow);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.78rem;\n      font-weight: 400;\n      line-height: 1.5;\n      opacity: 0;\n      pointer-events: none;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 160ms ease, transform 160ms ease;\n    }\n\n    .term:hover .tooltip,\n    .term:focus .tooltip { opacity: 1; transform: translate(-50%, 0); }\n\n    .canon-note,\n    .key-point {\n      margin: 1.7rem 0;\n      padding: 1.1rem 1.25rem;\n      border-radius: 0.7rem;\n      background: var(--sage-soft);\n    }\n\n    .canon-note strong,\n    .key-point strong { color: #46503f; }\n\n    .lab {\n      margin: 2rem 0;\n      padding: clamp(1.1rem, 3vw, 1.8rem);\n      border: 1px solid var(--line);\n      border-radius: 1rem;\n      background: var(--card);\n      box-shadow: var(--shadow);\n    }\n\n    .lab-head {\n      display: flex;\n      align-items: start;\n      justify-content: space-between;\n      gap: 1rem;\n      margin-bottom: 1.3rem;\n    }\n\n    .lab-head h3 { margin: 0; }\n    .lab-head p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.92rem; }\n\n    .lab-label {\n      flex: 0 0 auto;\n      padding: 0.22rem 0.55rem;\n      border-radius: 999px;\n      color: var(--accent-dark);\n      background: var(--accent-soft);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.72rem;\n      font-weight: 700;\n    }\n\n    .chain-list { display: grid; gap: 0.65rem; }\n\n    .chain-item {\n      display: grid;\n      grid-template-columns: 2.3rem 1fr auto;\n      align-items: center;\n      gap: 0.8rem;\n      padding: 0.8rem;\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--white);\n    }\n\n    .chain-number {\n      display: grid;\n      width: 2.1rem;\n      height: 2.1rem;\n      place-items: center;\n      border-radius: 50%;\n      color: var(--white);\n      background: var(--accent);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.82rem;\n      font-weight: 750;\n    }\n\n    .chain-text { font-size: 0.94rem; line-height: 1.5; }\n    .chain-actions { display: flex; gap: 0.28rem; }\n\n    .icon-button,\n    .button {\n      border: 1px solid var(--line);\n      background: var(--white);\n      cursor: pointer;\n    }\n\n    .icon-button {\n      width: 2rem;\n      height: 2rem;\n      border-radius: 0.45rem;\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      line-height: 1;\n    }\n\n    .icon-button:hover:not(:disabled),\n    .button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }\n    .icon-button:disabled { opacity: 0.3; cursor: default; }\n\n    .lab-actions {\n      display: flex;\n      flex-wrap: wrap;\n      align-items: center;\n      gap: 0.6rem;\n      margin-top: 1rem;\n    }\n\n    .button {\n      padding: 0.55rem 0.9rem;\n      border-radius: 0.55rem;\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.85rem;\n      font-weight: 650;\n    }\n\n    .button.primary { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .button.primary:hover:not(:disabled) { color: var(--white); background: var(--accent-dark); }\n    .feedback { min-height: 1.6rem; color: var(--muted); font-size: 0.9rem; }\n    .feedback.success { color: #3f6744; }\n    .feedback.try-again { color: var(--accent-dark); }\n\n    .story-line {\n      position: relative;\n      margin: 2rem 0;\n      padding-left: 2.2rem;\n    }\n\n    .story-line::before {\n      content: \"\";\n      position: absolute;\n      top: 0.5rem;\n      bottom: 0.5rem;\n      left: 0.55rem;\n      width: 2px;\n      background: var(--line);\n    }\n\n    .story-event { position: relative; padding: 0 0 1.5rem; }\n    .story-event:last-child { padding-bottom: 0; }\n\n    .story-event::before {\n      content: \"\";\n      position: absolute;\n      top: 0.48rem;\n      left: -2rem;\n      width: 0.72rem;\n      height: 0.72rem;\n      border: 3px solid var(--paper);\n      border-radius: 50%;\n      background: var(--accent);\n      box-shadow: 0 0 0 1px var(--accent);\n    }\n\n    .story-event h3 { margin: 0; font-size: 1.05rem; }\n    .story-event p { margin: 0.35rem 0 0; color: var(--muted); }\n\n    .comparison {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 1rem;\n      margin: 1.5rem 0;\n    }\n\n    .comparison article {\n      padding: 1.3rem;\n      border-radius: 0.8rem;\n      background: var(--card);\n      border: 1px solid var(--line);\n    }\n\n    .comparison article:first-child { border-top: 4px solid var(--sage); }\n    .comparison article:last-child { border-top: 4px solid var(--gold); }\n    .comparison h3 { margin-top: 0; }\n\n    .position-labels {\n      display: flex;\n      justify-content: space-between;\n      gap: 1rem;\n      color: var(--muted);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.8rem;\n    }\n\n    .position-range { width: 100%; margin: 1.2rem 0 0.6rem; accent-color: var(--accent); }\n\n    .position-result {\n      padding: 0.95rem 1rem;\n      border-radius: 0.65rem;\n      background: var(--paper-deep);\n      font-size: 0.92rem;\n    }\n\n    .conflict-map {\n      display: grid;\n      grid-template-columns: 1fr auto 1fr auto 1fr;\n      align-items: stretch;\n      gap: 0.55rem;\n      margin: 1.8rem 0;\n    }\n\n    .conflict-node {\n      display: grid;\n      align-content: center;\n      min-height: 8rem;\n      padding: 1rem;\n      border: 1px solid var(--line);\n      border-radius: 0.75rem;\n      background: var(--card);\n      text-align: center;\n    }\n\n    .conflict-node strong { color: var(--accent-dark); }\n    .conflict-node span { margin-top: 0.3rem; color: var(--muted); font-size: 0.8rem; }\n    .conflict-arrow { align-self: center; color: var(--accent); font-size: 1.4rem; }\n\n    .quiz-tabs {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.45rem;\n      margin-bottom: 1.25rem;\n    }\n\n    .quiz-tab {\n      min-width: 2.35rem;\n      padding: 0.38rem 0.7rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      background: transparent;\n      cursor: pointer;\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.8rem;\n    }\n\n    .quiz-tab[aria-selected=\"true\"] { border-color: var(--accent); color: var(--white); background: var(--accent); }\n    .quiz-tab.answered:not([aria-selected=\"true\"]) { border-color: var(--sage); color: #46503f; background: var(--sage-soft); }\n    .quiz-tab.skipped:not([aria-selected=\"true\"]) { border-style: dashed; }\n\n    .question-panel[hidden] { display: none; }\n    .question-count { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.78rem; }\n    .question-title { margin: 0.35rem 0 1rem; font-size: 1.14rem; }\n\n    .options { display: grid; gap: 0.65rem; }\n\n    .option {\n      display: grid;\n      grid-template-columns: auto 1fr;\n      gap: 0.7rem;\n      align-items: start;\n      padding: 0.8rem 0.9rem;\n      border: 1px solid var(--line);\n      border-radius: 0.65rem;\n      background: var(--white);\n      cursor: pointer;\n    }\n\n    .option:hover { border-color: var(--accent); }\n    .option:has(input:checked) { border-color: var(--accent); background: #fbf0eb; }\n    .option input { margin-top: 0.35rem; accent-color: var(--accent); }\n    .option-text { line-height: 1.5; }\n\n    .answer-feedback {\n      min-height: 4.7rem;\n      margin-top: 0.85rem;\n      padding: 0.85rem 1rem;\n      border-radius: 0.65rem;\n      color: var(--muted);\n      background: var(--paper-deep);\n      font-size: 0.9rem;\n    }\n\n    .answer-feedback.correct { color: #365d3a; background: var(--sage-soft); }\n    .answer-feedback.incorrect { color: var(--accent-dark); background: var(--accent-soft); }\n\n    .quiz-nav {\n      display: flex;\n      justify-content: space-between;\n      gap: 0.75rem;\n      margin-top: 1rem;\n    }\n\n    .quiz-nav-group { display: flex; flex-wrap: wrap; gap: 0.55rem; }\n\n    .lesson-footer {\n      margin-top: 4.5rem;\n      padding-top: 2rem;\n      border-top: 1px solid var(--line);\n    }\n\n    .takeaway {\n      padding: 1.4rem 1.5rem;\n      border-left: 4px solid var(--accent);\n      background: var(--accent-soft);\n      font-size: 1.05rem;\n    }\n\n    .next-lesson { margin-top: 2rem; color: var(--muted); }\n    .next-lesson strong { display: block; color: var(--ink); font-size: 1.1rem; }\n\n    @media (max-width: 760px) {\n      body { font-size: 16px; }\n      .content { width: min(100% - 2rem, 88ch); padding-top: 1.2rem; }\n      .learning-goals, .thesis-grid, .comparison { grid-template-columns: 1fr; }\n      .thesis-card { min-height: 0; }\n      .tooltip {\n        position: fixed;\n        inset: auto 1rem 1rem;\n        width: auto;\n        transform: translateY(0.3rem);\n      }\n      .term:hover .tooltip,\n      .term:focus .tooltip { transform: translateY(0); }\n      .conflict-map { grid-template-columns: 1fr; }\n      .conflict-arrow { transform: rotate(90deg); justify-self: center; }\n      .chain-item { grid-template-columns: 2rem 1fr; }\n      .chain-actions { grid-column: 2; }\n      .lab-head { display: block; }\n      .lab-label { display: inline-block; margin-top: 0.6rem; }\n      .quiz-nav { flex-direction: column; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      html { scroll-behavior: auto; }\n      .tooltip { transition: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"content\">\n    \u003cnav class=\"topbar\" aria-label=\"课程导航\">\n      \u003ca href=\"syllabus.html\">← 返回课程大纲\u003c/a>\n      \u003cspan class=\"lesson-count\">第 1 讲 / 共 7 讲\u003c/span>\n    \u003c/nav>\n\n    \u003cheader class=\"lesson-header\">\n      \u003cp class=\"eyebrow\">第一讲 · 起源\u003c/p>\n      \u003ch1>力量来到人间\u003c/h1>\n      \u003cp class=\"lede\">辉夜、六道仙人与双子的神话，绝非遥不可及的创世背景。它在开端便确立了人与力量的三种根本范式：将力量据为己有的绝对独占、借力量彼此感知的心灵联结，以及以力量强弱定夺秩序的统治逻辑。此后千年的忍界沧桑，不过是对这三种抉择的不断重演。\u003c/p>\n      \u003cdiv class=\"lesson-meta\" aria-label=\"本课信息\">\n        \u003cspan>约 25 分钟\u003c/span>\n        \u003cspan>全知视角\u003c/span>\n        \u003cspan>深度复盘\u003c/span>\n      \u003c/div>\n      \u003cblockquote class=\"opening-question\">带着一个问题出发：若获取力量的初衷是为了平息战乱，为何“终于有能力庇护苍生”，却会一步步异化为“必须将所有人置于掌控之中”？\u003c/blockquote>\n      \u003cdiv class=\"learning-goals\" aria-label=\"学习目标\">\n        \u003cdiv class=\"goal\">\u003cstrong>01\u003c/strong>\u003cspan>理清神话时代的核心因果链\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>02\u003c/strong>\u003cspan>辨析“忍宗”与“忍术”的根本逻辑\u003c/span>\u003c/div>\n        \u003cdiv class=\"goal\">\u003cstrong>03\u003c/strong>\u003cspan>洞察因陀罗与阿修罗宿命对立的原型\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"answer-first\">\n        \u003ch2 id=\"answer-first\">开篇立论：力量意义的三次根本蜕变\u003c/h2>\n        \u003cp>站在全知视角回溯忍界远古史，这并非一部单纯展现“查克拉不断升级”的战力演进史，而是力量的本体意义历经了三次关键范式转移。\u003c/p>\n        \u003cdiv class=\"thesis-grid\">\n          \u003carticle class=\"thesis-card\" data-step=\"1\">\n            \u003ch3>辉夜：力量即独占之物\u003c/h3>\n            \u003cp>她以神明般的绝对伟力平定乱世，却逐渐将查克拉视作不容分享的私有权能。他人力量的苏醒在她眼中并非共建的希望，而是对自身权威的分食与威胁。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"thesis-card\" data-step=\"2\">\n            \u003ch3>羽衣：力量即心灵桥梁\u003c/h3>\n            \u003cp>他创立\u003cspan class=\"term\" tabindex=\"0\">忍宗\u003cspan class=\"tooltip\" role=\"tooltip\">六道仙人所倡导的精神修行：通过分享查克拉，使人们得以感知并理解彼此的内心世界；它并非后世用于战伐杀伐的忍术体系。\u003c/span>\u003c/span>，让查克拉化作人际沟通的心灵纽带。力量的至高价值不在于占有与征服，而在于使原本孤立的个体达成深层共情。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"thesis-card\" data-step=\"3\">\n            \u003ch3>双子：力量决定秩序路径\u003c/h3>\n            \u003cp>因陀罗笃信唯有卓越的个人伟力方能订立秩序；阿修罗则坚信爱与协作的羁绊自会孕育出坚韧力量。继承人之争将这一思想分歧固化为延续千年的宿命对决。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n        \u003cp class=\"key-point\">\u003cstrong>核心线索：\u003c/strong>忍界悲剧的源头并非查克拉本身，而在于人们如何回答这一永恒追问：“力量归谁所有？因何而用？又该由谁来执掌秩序？”\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"kaguya-origin\">\n        \u003ch2 id=\"kaguya-origin\">第一幕：辉夜平息了乱世，却开启了绝对支配\u003c/h2>\n        \u003cp>在忍术与忍村尚未诞生的远古时代，神树深植于大地。辉夜吞下神树凝结的\u003cspan class=\"term\" tabindex=\"0\">查克拉果实\u003cspan class=\"tooltip\" role=\"tooltip\">神树吸纳大地生机凝结而成的果实，是人类世界最初的查克拉源头；此处不引入《博人传》后续追加设定。\u003c/span>\u003c/span>，成为世间首位拥有查克拉的存在。她凭借超凡神力弹压群雄、终结乱世，一度被世人奉为尊贵的“卯之女神”。\u003c/p>\n        \u003cp>然而历史的转折在于：这份和平纯粹维系于绝对武力，而非众生自发的契约与共识。只要秩序的根基完全寄托于一个不可动摇的至高个体，个体的独立意志便不可避免地被统治者视作潜在的不安与反叛。辉夜最终滑向了极权悖论——从最初“借力量庇护生灵”，蜕变为“为维系秩序而彻底禁锢人心”。\u003c/p>\n\n        \u003cdiv class=\"story-line\" aria-label=\"辉夜时代时间线\">\n          \u003carticle class=\"story-event\">\n            \u003ch3>神树与果实\u003c/h3>\n            \u003cp>辉夜吞食果实获取神力，以绝对威压强行止戈；力量与和平在此刻初次被强制绑定。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>羽衣与羽村出生\u003c/h3>\n            \u003cp>双子诞生并天生继承查克拉。对辉夜而言，这不仅是血脉的延续，更预示着力量独占格局的瓦解。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>母子决裂\u003c/h3>\n            \u003cp>辉夜企图强行回收散逸的查克拉，双子奋起抗争；辉夜与神树合为十尾，蜕变为威胁世间存亡的滔天浩劫。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>六道·地爆天星\u003c/h3>\n            \u003cp>双子联手施展六道·地爆天星封印十尾躯壳并化作月亮；羽衣随后抽离十尾查克拉，将其分化为九只尾兽。\u003c/p>\n          \u003c/article>\n          \u003carticle class=\"story-event\">\n            \u003ch3>黑绝留下\u003c/h3>\n            \u003cp>辉夜在封印前的最后一瞬诞下黑绝；黑绝潜伏千年，篡改碑文、诱使因陀罗堕入执念，静待复活之机。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n\n        \u003caside class=\"canon-note\">\u003cstrong>鉴赏视角：\u003c/strong>辉夜在原作中并非一个被充分展开心理描摹的角色。与其过度揣测其心路历程，不如把握其行为背后冷峻的结构性悲剧：对失去和平与掌控权的极端恐惧，驱使她不断剥夺众生的自由；而专制所激起的反抗，反过来又“印证”了她内心的猜忌与恐惧。\u003c/aside>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"causal-chain\">\n      \u003cdiv class=\"lab-head\">\n        \u003cdiv>\n          \u003ch2 id=\"causal-chain\">因果实验：拨开神话迷雾，重构历史逻辑\u003c/h2>\n          \u003cp>以下是决定忍界主线命运的五个核心事件。请通过上下箭头重构其内在因果序列，并检验逻辑闭环。\u003c/p>\n        \u003c/div>\n        \u003cspan class=\"lab-label\">因果排序\u003c/span>\n      \u003c/div>\n      \u003cdiv id=\"chain-list\" class=\"chain-list\" aria-live=\"polite\">\u003c/div>\n      \u003cdiv class=\"lab-actions\">\n        \u003cbutton id=\"chain-check\" class=\"button primary\" type=\"button\">检查顺序\u003c/button>\n        \u003cbutton id=\"chain-reset\" class=\"button\" type=\"button\">重新打乱\u003c/button>\n        \u003cspan id=\"chain-feedback\" class=\"feedback\">\u003c/span>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"hagoromo-answer\">\n        \u003ch2 id=\"hagoromo-answer\">第二幕：羽衣的求索——力量非为征服，而为心灵相通\u003c/h2>\n        \u003cp>羽衣尊为\u003cspan class=\"term\" tabindex=\"0\">六道仙人\u003cspan class=\"tooltip\" role=\"tooltip\">大筒木羽衣之尊称。他曾化身首位十尾人柱力，后将十尾查克拉拆分为九只尾兽，并游历四方传布忍宗。\u003c/span>\u003c/span>后巡游世间，将自身的查克拉广布于民众。他所开创的“忍宗”，初衷绝非“传授杀伐防御的忍术技巧”，而是引导世人借由查克拉感知彼此的精神共振，打破心灵之间的隔阂壁垒，实现真正的体谅与共鸣。\u003c/p>\n\n        \u003cdiv class=\"comparison\">\n          \u003carticle>\n            \u003ch3>忍宗：查克拉是心灵桥梁\u003c/h3>\n            \u003cul>\n              \u003cli>旨归在于彼此理解，而非克敌制胜。\u003c/li>\n              \u003cli>力量因无私分享而凝结为深厚羁绊。\u003c/li>\n              \u003cli>接纳个体之间的差异，无需借暴力强行同化。\u003c/li>\n            \u003c/ul>\n          \u003c/article>\n          \u003carticle>\n            \u003ch3>忍术：查克拉是工具武器\u003c/h3>\n            \u003cul>\n              \u003cli>提炼精神与身体能量，将其塑形为具体效能。\u003c/li>\n              \u003cli>既可用以劳作防卫，亦可化作致命杀器。\u003c/li>\n              \u003cli>对效率与胜负的追逐，逐渐掩盖了相互理解的初心。\u003c/li>\n            \u003c/ul>\n          \u003c/article>\n        \u003c/div>\n\n        \u003cp>这绝非简单地给“忍宗定为至善、忍术定为纯恶”。忍术本质上是查克拉的工具化形态，同样拥有疗愈与守护的价值。真正的危机在于：一旦人们仅以实用功能与战力强弱来度量彼此，查克拉便不再是袒露真心的桥梁，反而演化为隐藏动机、欺瞒算计乃至摧毁对手内心的凶器。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>羽衣与辉夜的根本分野：\u003c/strong>辉夜依仗绝对霸权逼迫万民臣服于唯一定律；羽衣则散布查克拉，寄望于不同意志能够在平等中彼此共鸣。两者的冲突绝非战力高低之别，而是和平的基石究竟该建立在“至高无上的单一中心”，还是“千丝万缕的平等羁绊”之上。\u003c/p>\n      \u003c/section>\n\n      \u003csection aria-labelledby=\"indra-asura\">\n        \u003ch2 id=\"indra-asura\">第三幕：双子歧途——力量崇拜与羁绊共生的千年之辨\u003c/h2>\n        \u003cp>长子因陀罗天资绝顶，完美继承了仙人之眼与澎湃的精神能量。他笃信唯有强者以卓越才能订立规矩、弱者恪守秩序，方能铸就世界的永恒稳定。次子阿修罗起初资质平平，却在与同伴休戚与共的历练中蜕变成长，最终觉醒了足以匹敌兄长的力量。阿修罗由此坚信：理解、协作与爱绝非力量获胜后的附赠品，而恰恰是真正伟力的源头活水。\u003c/p>\n        \u003cp>羽衣最终择定阿修罗为忍宗正统继承人。这一抉择虽深谋远虑，却未能抚平因陀罗内心的失落与不甘；在黑绝暗中挑拨下，因陀罗将此视作对自身卓越才智与长子名分的彻底背叛。一场关乎“何谓正道”的哲学争鸣，终成兄弟兵戎相见的旷世宿怨。\u003c/p>\n\n        \u003cdiv class=\"comparison\">\n          \u003carticle>\n            \u003ch3>因陀罗之路：精英裁断与力量秩序\u003c/h3>\n            \u003cp>\u003cstrong>以绝对力量为先导，确立不容置疑的稳定秩序。\u003c/strong>\u003c/p>\n            \u003cp>其长处在于决断迅捷、权责明确；其致命盲区则在于：整个秩序全系于至强者的个人判断，极易将一切异见视为必须剪除的威胁。\u003c/p>\n          \u003c/article>\n          \u003carticle>\n            \u003ch3>阿修罗之路：众志成城与羁绊生长\u003c/h3>\n            \u003cp>\u003cstrong>以人心相通为基石，力量从互助协作中自发生长。\u003c/strong>\u003c/p>\n            \u003cp>其长处在于充分尊重个体尊严；其内在挑战则在于：达成共识的过程往往漫长且脆弱，易遭背叛，且仅凭朴素的善意无法天然化解制度性困局。\u003c/p>\n          \u003c/article>\n        \u003c/div>\n\n        \u003cp>后世最常见的误读，是把这场对决浅薄地贬为“天才与吊车尾”之争。资质悬殊不过是叙事表象，更为深刻的哲学追问在于：\u003cstrong>秩序的合法性，究竟源于至强者的绝对圣断，还是根植于凡俗众生在磨合中日积月累的互信？\u003c/strong>\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"position-lab\">\n      \u003cdiv class=\"lab-head\">\n        \u003cdiv>\n          \u003ch2 id=\"position-lab\">立场刻度：当乱世终结，你愿将和平托付于何处？\u003c/h2>\n          \u003cp>设想你身处百废待兴的战后余烬之中，必须迅速订立和平秩序。滑动标尺，权衡你更愿意承担何种治理风险。\u003c/p>\n        \u003c/div>\n        \u003cspan class=\"lab-label\">观点实验\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"position-labels\">\n        \u003cspan>由至强者独揽决断权\u003c/span>\n        \u003cspan>由众生自发凝聚共识\u003c/span>\n      \u003c/div>\n      \u003cinput id=\"position-range\" class=\"position-range\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"50\" aria-label=\"力量集中与共同协作之间的立场\">\n      \u003cp id=\"position-result\" class=\"position-result\" aria-live=\"polite\">\u003c/p>\n    \u003c/section>\n\n    \u003cdiv class=\"prose\">\n      \u003csection aria-labelledby=\"reincarnation-cycle\">\n        \u003ch2 id=\"reincarnation-cycle\">“宿命轮回”所复制的，究竟是什么？\u003c/h2>\n        \u003cp>因陀罗与阿修罗肉身虽殁，其查克拉却在漫长岁月中不断依附于后世的血脉继承者。作品中设定的\u003cspan class=\"term\" tabindex=\"0\">转生\u003cspan class=\"tooltip\" role=\"tooltip\">此处并非逝者完整人格的重生，而是因陀罗与阿修罗的精神执念、查克拉特性及对立倾向在后世个体身上的投射。转生者依旧保有独立的灵魂、记忆与抉择权。\u003c/span>\u003c/span>机制，使这一思想冲突获得了超现实的代际延续，但它绝非剥夺人性的机械宿命论。\u003c/p>\n\n        \u003cdiv class=\"conflict-map\" aria-label=\"冲突传递结构\">\n          \u003cdiv class=\"conflict-node\">\u003cstrong>因陀罗 vs. 阿修罗\u003c/strong>\u003cspan>崇尚伟力统治 / 倡导羁绊共生\u003c/span>\u003c/div>\n          \u003cdiv class=\"conflict-arrow\" aria-hidden=\"true\">→\u003c/div>\n          \u003cdiv class=\"conflict-node\">\u003cstrong>斑 vs. 柱间\u003c/strong>\u003cspan>彻底扑灭变数 / 构筑制度共同体\u003c/span>\u003c/div>\n          \u003cdiv class=\"conflict-arrow\" aria-hidden=\"true\">→\u003c/div>\n          \u003cdiv class=\"conflict-node\">\u003cstrong>佐助 vs. 鸣人\u003c/strong>\u003cspan>独揽全世黑暗 / 誓死守护羁绊\u003c/span>\u003c/div>\n        \u003c/div>\n\n        \u003cp>代代相传的，绝非千篇一律的性格模板，而是一道悬而未决的时代答卷。柱间与斑将其投射进忍村的制度构建中；鸣人与佐助则在承接了前代所有的沉痛教训后，给出了全新的应答。所谓“打破宿命轮回”，绝非鸣人背弃了阿修罗的意志，而是他拒绝再次重演“阿修罗一方将因陀罗一方彻底击溃并封印”的历史悲剧。\u003c/p>\n        \u003cp class=\"key-point\">\u003cstrong>结构性反思：\u003c/strong>黑绝固然在暗中推波助澜，但其阴谋之所以屡屡得逞，恰恰是因为忍界内部本就盘根错节着真实的失落、猜忌与权力鸿沟。若将千载血泪轻率地甩锅给黑绝一人，不仅会遮蔽忍界自身的体制之弊，更会大大消解鸣人最终抉择的千钧分量。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003csection class=\"lab\" aria-labelledby=\"lesson-check\">\n      \u003cdiv class=\"lab-head\">\n        \u003cdiv>\n          \u003ch2 id=\"lesson-check\">认知检验：跳出设定细节，把握结构之眼\u003c/h2>\n          \u003cp>一次只看一道题。可以跳过、返回或修改答案；进度会自动保留。\u003c/p>\n        \u003c/div>\n        \u003cspan class=\"lab-label\">4 个问题\u003c/span>\n      \u003c/div>\n      \u003cdiv id=\"quiz-tabs\" class=\"quiz-tabs\" role=\"tablist\" aria-label=\"问题导航\">\u003c/div>\n      \u003cdiv id=\"quiz-panels\">\u003c/div>\n      \u003cdiv class=\"quiz-nav\">\n        \u003cdiv class=\"quiz-nav-group\">\n          \u003cbutton id=\"quiz-prev\" class=\"button\" type=\"button\">← 上一题\u003c/button>\n          \u003cbutton id=\"quiz-next\" class=\"button primary\" type=\"button\">下一题 →\u003c/button>\n        \u003c/div>\n        \u003cbutton id=\"quiz-skip\" class=\"button\" type=\"button\">暂时跳过\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cfooter class=\"lesson-footer\">\n      \u003cdiv class=\"takeaway\">\u003cstrong>核心结语：\u003c/strong>《火影忍者》开篇的终极命题并非“战力孰强孰弱”，而是“力量能否在不剥夺众生自由意志的前提下缔造和平”。辉夜给出了绝望的否定，羽衣怀揣着温暖的期许；而双子的殊途，则将这一未竟的叩问化作了绵延千年的两条跋涉之路。\u003c/div>\n      \u003cp class=\"next-lesson\">\u003cstrong>下一讲：从战国到忍村\u003c/strong>柱间与斑将神话时代的思想交锋落地为真实的社会体制：世仇忍族如何止戈修好、忍村体制如何应运而生，以及为何这份看似辉煌的和平，最终仍将两位至交推向了终结之谷的宿命对决。\u003c/p>\n    \u003c/footer>\n  \u003c/main>\n\n  \u003cscript>\n    (function () {\n      \"use strict\";\n\n      var storagePrefix = \"course:session1:\";\n\n      function readState(key, fallback) {\n        try {\n          var saved = localStorage.getItem(storagePrefix + key);\n          return saved ? JSON.parse(saved) : fallback;\n        } catch (error) {\n          return fallback;\n        }\n      }\n\n      function writeState(key, value) {\n        try {\n          localStorage.setItem(storagePrefix + key, JSON.stringify(value));\n        } catch (error) {\n          // 课程内容仍可在禁用本地存储时使用。\n        }\n      }\n\n      var chainEvents = [\n        { id: \"fruit\", text: \"辉夜吞食查克拉果实，凭绝对伟力强行平息乱世。\" },\n        { id: \"sons\", text: \"羽衣与羽村继承查克拉，打破了辉夜对神力的绝对独占。\" },\n        { id: \"rebellion\", text: \"母子决裂；辉夜与神树合为十尾，企图强行回收散逸的查克拉。\" },\n        { id: \"seal\", text: \"兄弟联手施展地爆天星封印十尾躯壳，由此诞生月亮。\" },\n        { id: \"ninshu\", text: \"羽衣分化九大尾兽并遍传忍宗，倡导以查克拉连结彼此心灵。\" }\n      ];\n      var correctChain = chainEvents.map(function (event) { return event.id; });\n      var defaultChain = [\"rebellion\", \"fruit\", \"seal\", \"sons\", \"ninshu\"];\n      var chainOrder = readState(\"causal-order:v1\", defaultChain);\n\n      function chainEventById(id) {\n        return chainEvents.find(function (event) { return event.id === id; });\n      }\n\n      function renderChain() {\n        var list = document.getElementById(\"chain-list\");\n        list.innerHTML = \"\";\n\n        chainOrder.forEach(function (id, index) {\n          var event = chainEventById(id);\n          var item = document.createElement(\"div\");\n          item.className = \"chain-item\";\n\n          var number = document.createElement(\"span\");\n          number.className = \"chain-number\";\n          number.textContent = String(index + 1);\n\n          var text = document.createElement(\"span\");\n          text.className = \"chain-text\";\n          text.textContent = event.text;\n\n          var actions = document.createElement(\"div\");\n          actions.className = \"chain-actions\";\n\n          var up = document.createElement(\"button\");\n          up.type = \"button\";\n          up.className = \"icon-button\";\n          up.textContent = \"↑\";\n          up.disabled = index === 0;\n          up.setAttribute(\"aria-label\", \"将第 \" + (index + 1) + \" 项上移\");\n          up.addEventListener(\"click\", function () { moveChainItem(index, -1); });\n\n          var down = document.createElement(\"button\");\n          down.type = \"button\";\n          down.className = \"icon-button\";\n          down.textContent = \"↓\";\n          down.disabled = index === chainOrder.length - 1;\n          down.setAttribute(\"aria-label\", \"将第 \" + (index + 1) + \" 项下移\");\n          down.addEventListener(\"click\", function () { moveChainItem(index, 1); });\n\n          actions.append(up, down);\n          item.append(number, text, actions);\n          list.appendChild(item);\n        });\n      }\n\n      function moveChainItem(index, direction) {\n        var target = index + direction;\n        var nextOrder = chainOrder.slice();\n        var moved = nextOrder[index];\n        nextOrder[index] = nextOrder[target];\n        nextOrder[target] = moved;\n        chainOrder = nextOrder;\n        writeState(\"causal-order:v1\", chainOrder);\n        setChainFeedback(\"顺序已调整。\", \"\");\n        renderChain();\n      }\n\n      function setChainFeedback(message, className) {\n        var feedback = document.getElementById(\"chain-feedback\");\n        feedback.textContent = message;\n        feedback.className = \"feedback\" + (className ? \" \" + className : \"\");\n      }\n\n      function checkChain() {\n        var firstWrong = chainOrder.findIndex(function (id, index) {\n          return id !== correctChain[index];\n        });\n        if (firstWrong === -1) {\n          setChainFeedback(\"因果链梳理正确：对力量的独占必将激起反抗，唯有在封印支配者之后，方才诞生了倡导心灵分享与共情的“忍宗”。\", \"success\");\n        } else {\n          var hint = firstWrong === 0\n            ? \"溯源提示：请先寻找一切力量纠葛的开端——谁最先攫取了查克拉？\"\n            : \"前 \" + firstWrong + \" 项逻辑成立；请仔细推敲第 \" + (firstWrong + 1) + \" 项发生的直接前因。\";\n          setChainFeedback(hint, \"try-again\");\n        }\n      }\n\n      function resetChain() {\n        chainOrder = defaultChain.slice();\n        writeState(\"causal-order:v1\", chainOrder);\n        setChainFeedback(\"已重置为初始待整理状态。\", \"\");\n        renderChain();\n      }\n\n      document.getElementById(\"chain-check\").addEventListener(\"click\", checkChain);\n      document.getElementById(\"chain-reset\").addEventListener(\"click\", resetChain);\n      renderChain();\n\n      var positionRange = document.getElementById(\"position-range\");\n      var savedPosition = readState(\"position:v1\", 50);\n      positionRange.value = String(savedPosition);\n\n      function positionMessage(value) {\n        if (value \u003c 25) {\n          return \"你鲜明地倾向于因陀罗路线：集权定乱，以绝对力量迅速平息动荡。然而它始终面临那道终极诘问——当最强者出现偏差，世间由谁来纠错？\";\n        }\n        if (value \u003c 45) {\n          return \"你略微倾向于集权决断，同时保留了协商弹性。但必须警惕其制度惯性：在危局中赋予统治者的特权，待到天下太平时，真能如期归还众生吗？\";\n        }\n        if (value \u003c= 55) {\n          return \"你驻足于两难的平衡木上。这并非犹疑，而是对复杂现实的敬畏：从柱间、斑到后来的佐助，所有人都在试图调和力量与羁绊的张力，只是背负的代价各异。\";\n        }\n        if (value \u003c= 75) {\n          return \"你偏向于阿修罗路线：甘愿承担沟通的滞后，以换取广泛的参与与认可。然而它最严峻的考验在于——当对立者拒绝共情、拔刀相向时，善意该如何自卫？\";\n        }\n        return \"你坚定地将希望寄托于羁绊与共识。这一抉择最大程度呵护了人的自由意志，但必须辅以完备的制度保障与防卫力量，否则无防备的善意终将被现实撕碎。\";\n      }\n\n      function updatePosition() {\n        var value = Number(positionRange.value);\n        document.getElementById(\"position-result\").textContent = positionMessage(value);\n        writeState(\"position:v1\", value);\n      }\n\n      positionRange.addEventListener(\"input\", updatePosition);\n      updatePosition();\n\n      var questions = [\n        {\n          title: \"辉夜何以构成忍界一切冲突的原型范式？\",\n          options: [\n            \"因为查克拉的侵蚀必然导致宿主道德堕落。\",\n            \"因为她将和平完全建立在力量独占之上，致使他人的独立意志本身成了秩序的威胁。\",\n            \"因为羽衣自始至终都在处心积虑谋夺母亲的神力。\"\n          ],\n          answer: 1,\n          feedback: [\n            \"症结并非查克拉本身具有原罪。羽衣身负同等伟力，却致力于用它搭建心灵桥梁。\",\n            \"解析正确：她的秩序寄生于不可忤逆的至高权威，因而‘守护和平’与‘绝对支配’逐渐蜕变成了同一回事。\",\n            \"原作因果并非如此。羽衣的抗争始于辉夜企图强行抹杀众生自由并回收查克拉之后。\"\n          ]\n        },\n        {\n          title: \"“忍宗”与后世“忍术”最本质的区别何在？\",\n          options: [\n            \"忍宗是大筒木神族的专属特权，忍术才是凡人修炼的法门。\",\n            \"忍宗旨在借查克拉达成人际共情；忍术则将查克拉异化为执行杀伐防御的实用技术。\",\n            \"忍宗仅是纯粹的道德说教，忍术才需要驱动查克拉能量。\"\n          ],\n          answer: 1,\n          feedback: [\n            \"恰恰相反，羽衣创立忍宗的初衷正是将查克拉广布凡间，以消除心灵隔阂。\",\n            \"解析正确：二者的分野首在于价值旨归——查克拉究竟是联结灵魂的纽带，还是攻伐制胜的器械。\",\n            \"两者皆以查克拉为基底，根本差异在于使用查克拉的目的与价值导向。\"\n          ]\n        },\n        {\n          title: \"羽衣为何最终择定资质平平的阿修罗继承忍宗？\",\n          options: [\n            \"阿修罗生来就拥有凌驾于兄长之上的绝顶瞳力。\",\n            \"阿修罗向父亲立誓此生永不诉诸武力。\",\n            \"阿修罗的蜕变证明了爱与协作自能孕育伟力，最契合忍宗互信共鸣的真谛。\"\n          ],\n          answer: 2,\n          feedback: [\n            \"绝顶的瞳力与过人天赋本属于因陀罗，阿修罗起初反而是个平庸的迟悟者。\",\n            \"阿修罗并非绝对和平主义者，他同样拥有并在关键时刻动用了捍卫正义的伟力。\",\n            \"解析正确：六道仙人甄选的不是战力高下，而是对‘力量究从何来’这一根本信念的认可。\"\n          ]\n        },\n        {\n          title: \"下列哪项表述最精准地揭示了忍界“轮回”的哲学意涵？\",\n          options: [\n            \"转生者完全丧失自由意志，只是机械重演前世命运的提线木偶。\",\n            \"转生纯粹是解释战力继承的战斗设定，对人物思想演进毫无实质影响。\",\n            \"悬而未决的思想冲突借查克拉跨代延续，而后世转生者依然拥有重写结局的抉择空间。\"\n          ],\n          answer: 2,\n          feedback: [\n            \"若无自由选择的可能，鸣人破除宿命便毫无光彩。转生赋予了历史重担，却未曾泯灭个体的主体意志。\",\n            \"转生固然解释了力量源流，更深沉的意图在于将千百年来每一代人的困境置入同一个历史问卷中。\",\n            \"解析正确：轮回赋予了沉重的历史张力，而个体的自由抉择，则为改写命运保留了破晓的微光。\"\n          ]\n        }\n      ];\n\n      var quizState = readState(\"quiz:v1\", { current: 0, answers: {}, skipped: [] });\n      if (!Number.isInteger(quizState.current) || quizState.current \u003c 0 || quizState.current >= questions.length) {\n        quizState.current = 0;\n      }\n      quizState.answers = quizState.answers || {};\n      quizState.skipped = Array.isArray(quizState.skipped) ? quizState.skipped : [];\n\n      function saveQuiz() {\n        writeState(\"quiz:v1\", quizState);\n      }\n\n      function renderQuiz() {\n        renderQuizTabs();\n        renderQuestionPanels();\n        updateQuizNavigation();\n      }\n\n      function renderQuizTabs() {\n        var tabs = document.getElementById(\"quiz-tabs\");\n        tabs.innerHTML = \"\";\n        questions.forEach(function (question, index) {\n          var tab = document.createElement(\"button\");\n          tab.type = \"button\";\n          tab.className = \"quiz-tab\";\n          if (Object.prototype.hasOwnProperty.call(quizState.answers, index)) tab.classList.add(\"answered\");\n          if (quizState.skipped.indexOf(index) !== -1) tab.classList.add(\"skipped\");\n          tab.setAttribute(\"role\", \"tab\");\n          tab.setAttribute(\"aria-selected\", index === quizState.current ? \"true\" : \"false\");\n          tab.setAttribute(\"aria-controls\", \"question-\" + index);\n          tab.textContent = String(index + 1);\n          tab.addEventListener(\"click\", function () { goToQuestion(index); });\n          tabs.appendChild(tab);\n        });\n      }\n\n      function renderQuestionPanels() {\n        var panels = document.getElementById(\"quiz-panels\");\n        panels.innerHTML = \"\";\n        questions.forEach(function (question, questionIndex) {\n          var panel = document.createElement(\"section\");\n          panel.id = \"question-\" + questionIndex;\n          panel.className = \"question-panel\";\n          panel.setAttribute(\"role\", \"tabpanel\");\n          panel.hidden = questionIndex !== quizState.current;\n\n          var count = document.createElement(\"div\");\n          count.className = \"question-count\";\n          count.textContent = \"问题 \" + (questionIndex + 1) + \" / \" + questions.length;\n\n          var title = document.createElement(\"h3\");\n          title.className = \"question-title\";\n          title.textContent = question.title;\n\n          var options = document.createElement(\"div\");\n          options.className = \"options\";\n          question.options.forEach(function (optionText, optionIndex) {\n            var label = document.createElement(\"label\");\n            label.className = \"option\";\n\n            var input = document.createElement(\"input\");\n            input.type = \"radio\";\n            input.name = \"question-\" + questionIndex;\n            input.value = String(optionIndex);\n            input.checked = Number(quizState.answers[questionIndex]) === optionIndex;\n            input.addEventListener(\"change\", function () {\n              answerQuestion(questionIndex, optionIndex);\n            });\n\n            var text = document.createElement(\"span\");\n            text.className = \"option-text\";\n            text.textContent = optionText;\n            label.append(input, text);\n            options.appendChild(label);\n          });\n\n          var feedback = document.createElement(\"div\");\n          feedback.id = \"answer-feedback-\" + questionIndex;\n          feedback.className = \"answer-feedback\";\n          feedback.setAttribute(\"aria-live\", \"polite\");\n          updateAnswerFeedback(feedback, questionIndex);\n\n          panel.append(count, title, options, feedback);\n          panels.appendChild(panel);\n        });\n      }\n\n      function updateAnswerFeedback(element, questionIndex) {\n        var selected = quizState.answers[questionIndex];\n        if (selected === undefined) {\n          element.className = \"answer-feedback\";\n          element.textContent = quizState.skipped.indexOf(questionIndex) !== -1\n            ? \"这题已暂时跳过。你可以随时回来选择答案。\"\n            : \"选择后会立即看到解释。\";\n          return;\n        }\n        var question = questions[questionIndex];\n        var isCorrect = Number(selected) === question.answer;\n        element.className = \"answer-feedback \" + (isCorrect ? \"correct\" : \"incorrect\");\n        element.textContent = question.feedback[Number(selected)];\n      }\n\n      function answerQuestion(questionIndex, optionIndex) {\n        quizState.answers[questionIndex] = optionIndex;\n        quizState.skipped = quizState.skipped.filter(function (index) { return index !== questionIndex; });\n        saveQuiz();\n        renderQuiz();\n      }\n\n      function goToQuestion(index) {\n        quizState.current = Math.max(0, Math.min(questions.length - 1, index));\n        saveQuiz();\n        renderQuiz();\n      }\n\n      function skipQuestion() {\n        var current = quizState.current;\n        if (!Object.prototype.hasOwnProperty.call(quizState.answers, current) && quizState.skipped.indexOf(current) === -1) {\n          quizState.skipped.push(current);\n        }\n        quizState.current = current \u003c questions.length - 1 ? current + 1 : 0;\n        saveQuiz();\n        renderQuiz();\n      }\n\n      function updateQuizNavigation() {\n        document.getElementById(\"quiz-prev\").disabled = quizState.current === 0;\n        document.getElementById(\"quiz-next\").textContent = quizState.current === questions.length - 1 ? \"回到第一题 ↺\" : \"下一题 →\";\n      }\n\n      document.getElementById(\"quiz-prev\").addEventListener(\"click\", function () {\n        goToQuestion(quizState.current - 1);\n      });\n      document.getElementById(\"quiz-next\").addEventListener(\"click\", function () {\n        goToQuestion(quizState.current === questions.length - 1 ? 0 : quizState.current + 1);\n      });\n      document.getElementById(\"quiz-skip\").addEventListener(\"click\", skipQuestion);\n      renderQuiz();\n    }());\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session2.html","basePath":"session2.html","lang":"zh-CN","kind":"lesson","title":"忍村和平的隐患","translations":{"zh-CN":"session2.html"},"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"忍村和平的隐患\">\n  \u003ctitle>从战国到忍村：柱间与斑为何共同成功，又共同失败｜《火影忍者》主线重构\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f6f1e7;\n      --paper-deep: #ebe1cf;\n      --ink: #292721;\n      --muted: #6c665b;\n      --accent: #9a4938;\n      --accent-dark: #713528;\n      --accent-soft: #ead3c8;\n      --sage: #66745c;\n      --sage-soft: #dfe4d8;\n      --gold: #a9782e;\n      --gold-soft: #eee1c1;\n      --line: #d8ccba;\n      --card: rgba(255, 253, 248, 0.78);\n      --white: #fffdf8;\n      --shadow: 0 16px 44px rgba(71, 52, 33, 0.08);\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; background: var(--paper); }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 15% 0%, rgba(255, 255, 255, 0.76), transparent 32rem),\n        var(--paper);\n      font-family: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", Georgia, serif;\n      font-size: 18px;\n      line-height: 1.72;\n    }\n\n    button, input { font: inherit; }\n    button { color: inherit; }\n    a { color: var(--accent-dark); text-underline-offset: 0.18em; }\n\n    .content {\n      width: min(100% - 3rem, 88ch);\n      max-width: 88ch;\n      margin: 0 auto;\n      padding: 2rem 0 6rem;\n    }\n\n    html[data-studio-width=\"wide\"] .content { max-width: 104ch; }\n    html[data-studio-width=\"full\"] .content { max-width: 100%; }\n    html[data-studio-width=\"full\"] .prose,\n    html[data-studio-width=\"full\"] .lesson-header,\n    html[data-studio-width=\"full\"] .lesson-footer {\n      width: min(100% - 3rem, 78ch);\n      margin-inline: auto;\n    }\n\n    .topbar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1rem;\n      padding-bottom: 1.5rem;\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.82rem;\n    }\n\n    .topbar-links { display: flex; flex-wrap: wrap; gap: 1rem; }\n    .topbar a { color: var(--muted); text-decoration: none; }\n    .topbar a:hover { color: var(--accent); }\n    .lesson-count { color: var(--muted); letter-spacing: 0.06em; }\n\n    .lesson-header {\n      padding: 3.4rem 0 3rem;\n      border-top: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n    }\n\n    .eyebrow {\n      margin: 0 0 0.8rem;\n      color: var(--accent);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.78rem;\n      font-weight: 750;\n      letter-spacing: 0.14em;\n    }\n\n    h1, h2, h3 { line-height: 1.26; text-wrap: balance; }\n    h1 {\n      max-width: 15em;\n      margin: 0;\n      font-size: clamp(2.35rem, 6vw, 4.6rem);\n      font-weight: 650;\n      letter-spacing: -0.035em;\n    }\n\n    h2 { margin: 4.5rem 0 1.2rem; font-size: clamp(1.7rem, 3vw, 2.3rem); }\n    h3 { margin: 1.8rem 0 0.6rem; font-size: 1.2rem; }\n    p { margin: 0.9rem 0; }\n    ul { padding-left: 1.25rem; }\n    li + li { margin-top: 0.5rem; }\n    section { scroll-margin-top: 1.5rem; }\n\n    .lede { max-width: 47rem; margin: 1.4rem 0 0; color: var(--muted); font-size: 1.12rem; }\n    .lesson-meta {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.6rem;\n      margin-top: 1.5rem;\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.8rem;\n    }\n\n    .lesson-meta span {\n      padding: 0.28rem 0.66rem;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      color: var(--muted);\n      background: rgba(255, 253, 248, 0.52);\n    }\n\n    .opening-question {\n      margin: 2.2rem 0 0;\n      padding: 1.25rem 1.45rem;\n      border-left: 4px solid var(--accent);\n      background: var(--accent-soft);\n      font-size: 1.08rem;\n    }\n\n    .learning-goals,\n    .thesis-grid {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 1px;\n      margin: 2.2rem 0 0;\n      overflow: hidden;\n      border: 1px solid var(--line);\n      border-radius: 0.8rem;\n      background: var(--line);\n    }\n\n    .goal, .thesis-card { padding: 1rem 1.1rem; background: var(--card); }\n    .goal strong { display: block; color: var(--accent); font-size: 1.25rem; }\n    .goal span, .thesis-card p { color: var(--muted); font-size: 0.88rem; }\n    .thesis-card { min-height: 13rem; }\n    .thesis-card h3 { margin-top: 0; }\n\n    .term {\n      position: relative;\n      display: inline-block;\n      border-bottom: 1px dotted var(--accent);\n      color: var(--accent-dark);\n      cursor: help;\n      outline: none;\n    }\n\n    .term:focus-visible { border-radius: 0.2rem; box-shadow: 0 0 0 3px var(--accent-soft); }\n    .tooltip {\n      position: absolute;\n      z-index: 30;\n      left: 50%;\n      bottom: calc(100% + 0.65rem);\n      width: min(19rem, 75vw);\n      padding: 0.75rem 0.85rem;\n      border: 1px solid var(--line);\n      border-radius: 0.6rem;\n      color: var(--ink);\n      background: var(--white);\n      box-shadow: var(--shadow);\n      font-family: ui-sans-serif, system-ui, sans-serif;\n      font-size: 0.78rem;\n      font-weight: 400;\n      line-height: 1.5;\n      opacity: 0;\n      pointer-events: none;\n      transform: translate(-50%, 0.3rem);\n      transition: opacity 160ms ease, transform 160ms ease;\n    }\n\n    .term:hover .tooltip,\n    .term:focus .tooltip { opacity: 1; transform: translate(-50%, 0); }\n\n    .key-point,\n    .canon-note {\n      margin: 1.7rem 0;\n      padding: 1.
