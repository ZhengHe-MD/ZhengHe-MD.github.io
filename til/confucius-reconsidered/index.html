ata-map=\"person\" aria-pressed=\"true\">\n            \u003cstrong>Person\u003c/strong>\n            \u003cspan>\u003cspan lang=\"zh-Hans\">仁 · 礼 · 君子\u003c/span>\u003c/span>\n          \u003c/button>\n          \u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\n          \u003cbutton class=\"map-node\" type=\"button\" data-map=\"relation\" aria-pressed=\"false\">\n            \u003cstrong>Relationship\u003c/strong>\n            \u003cspan>\u003cspan lang=\"zh-Hans\">孝 · 忠恕 · 正名\u003c/span>\u003c/span>\n          \u003c/button>\n          \u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\n          \u003cbutton class=\"map-node\" type=\"button\" data-map=\"state\" aria-pressed=\"false\">\n            \u003cstrong>State\u003c/strong>\n            \u003cspan>\u003cspan lang=\"zh-Hans\">德 · 为政以德\u003c/span>\u003c/span>\n          \u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"map-detail\" aria-live=\"polite\">\n          \u003cdiv data-map-panel=\"person\">\n            \u003cp>\n              \u003cstrong>Practice forms perception.\u003c/strong> Ritual gives humaneness a\n              repeatable shape; the exemplary person becomes capable of responding\n              well without treating morality as a performance.\n            \u003c/p>\n          \u003c/div>\n          \u003cdiv data-map-panel=\"relation\" hidden>\n            \u003cp>\n              \u003cstrong>Character becomes accountable in roles.\u003c/strong> Reciprocity\n              stretches concern beyond the self, while rectifying names lets duties\n              judge the people who claim authority.\n            \u003c/p>\n          \u003c/div>\n          \u003cdiv data-map-panel=\"state\" hidden>\n            \u003cp>\n              \u003cstrong>Example scales outward—but imperfectly.\u003c/strong> A ruler’s\n              conduct can establish trust and norms. Modern readers add institutions\n              because moral influence alone cannot guarantee accountability.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"synthesis\">\n      \u003ch2 id=\"synthesis\">The one-sentence synthesis\u003c/h2>\n      \u003cp class=\"synthesis\">\n        Confucius imagines political order growing outward from practiced character\n        through accountable relationships into moral example; his enduring insight\n        is that rules need cultivated people, and his enduring limitation is that\n        cultivated people still need institutions able to challenge them.\n      \u003c/p>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"course-complete\">\n      \u003ch2 id=\"course-complete\">Where you can now disagree\u003c/h2>\n      \u003cp>\n        You need not decide that Confucius is simply right or wrong. A defensible\n        conclusion can preserve one claim and reject another: perhaps moral education\n        is indispensable to public life, while family hierarchy and exemplary rule\n        remain too vulnerable to unequal power. That argued distinction—not a slogan\n        about “Confucianism”—is the point of reconsidering him.\n      \u003c/p>\n    \u003c/section>\n\n    \u003cp class=\"closing\">\n      The course is complete when you can connect person, relationship, and state—and\n      name both one strength and one limit in the connection.\n    \u003c/p>\n  \u003c/main>\n\n  \u003cscript>\n    const completedActivities = new Set();\n    const exploredMapNodes = new Set([\"person\"]);\n\n    const feedback = {\n      fine: \"Deterrence may change conduct quickly, but it reproduces the weakness Confucius identifies: students learn to avoid detection, not to notice the burden they impose.\",\n      example: \"This captures moral influence, but it leaves cleaners unprotected if admiration fails. Example cannot guarantee that persistent free-riders stop.\",\n      combined: \"The strongest synthesis: cultivate ethical perception and make good conduct visible, while retaining a public rule as protection when formation fails.\"\n    };\n\n    function updateProgress() {\n      const percentage = (completedActivities.size / 3) * 100;\n      document.getElementById(\"progress-bar\").style.width = percentage + \"%\";\n    }\n\n    function markComplete(activity) {\n      completedActivities.add(activity);\n      updateProgress();\n    }\n\n    function selectMode(selectedButton) {\n      document.querySelectorAll(\".mode-button\").forEach(function (button) {\n        button.setAttribute(\"aria-pressed\", \"false\");\n      });\n      selectedButton.setAttribute(\"aria-pressed\", \"true\");\n\n      document.querySelectorAll(\"[data-mode-panel]\").forEach(function (panel) {\n        panel.hidden = panel.dataset.modePanel !== selectedButton.dataset.mode;\n      });\n\n      markComplete(\"comparison\");\n    }\n\n    function selectAnswer(card, selectedButton) {\n      card.querySelectorAll(\".choice\").forEach(function (button) {\n        button.setAttribute(\"aria-pressed\", \"false\");\n      });\n      selectedButton.setAttribute(\"aria-pressed\", \"true\");\n      card.querySelector(\".feedback\").textContent = feedback[selectedButton.dataset.answer];\n      markComplete(\"dilemma\");\n    }\n\n    function selectMapNode(selectedButton) {\n      document.querySelectorAll(\".map-node\").forEach(function (button) {\n        button.setAttribute(\"aria-pressed\", \"false\");\n      });\n      selectedButton.setAttribute(\"aria-pressed\", \"true\");\n\n      document.querySelectorAll(\"[data-map-panel]\").forEach(function (panel) {\n        panel.hidden = panel.dataset.mapPanel !== selectedButton.dataset.map;\n      });\n\n      exploredMapNodes.add(selectedButton.dataset.map);\n      if (exploredMapNodes.size === 3) {\n        markComplete(\"map\");\n      }\n    }\n\n    document.querySelectorAll(\".mode-button\").forEach(function (button) {\n      button.addEventListener(\"click\", function () {\n        selectMode(button);\n      });\n    });\n\n    document.querySelectorAll(\".question-card\").forEach(function (card) {\n      card.querySelectorAll(\".choice\").forEach(function (button) {\n        button.addEventListener(\"click\", function () {\n          selectAnswer(card, button);\n        });\n      });\n    });\n\n    document.querySelectorAll(\".map-node\").forEach(function (button) {\n      button.addEventListener(\"click\", function () {\n        selectMapNode(button);\n      });\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"}]};
  const frame = document.getElementById("cs-course-frame");
  const pageList = document.getElementById("cs-page-list");
  const pageTitle = document.getElementById("cs-page-title");
  const previous = document.getElementById("cs-previous");
  const next = document.getElementById("cs-next");
  let activeIndex = Math.max(0, data.pages.findIndex((page) => location.hash.slice(1) === encodeURIComponent(page.path)));
  let observer;

  function renderNavigation() {
    pageList.replaceChildren(...data.pages.map((page, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = index === activeIndex ? "active" : "";
      button.textContent = page.title;
      button.addEventListener("click", () => showPage(index));
      return button;
    }));
  }

  function wireCourseLinks(doc) {
    doc.addEventListener("click", (event) => {
      const link = event.target.closest?.("a[href]");
      if (!link) return;
      const raw = link.getAttribute("href") || "";
      const path = raw.split("#")[0].replace(/^\.\//, "");
      const index = data.pages.findIndex((page) => page.path === path);
      if (index < 0) return;
      event.preventDefault();
      showPage(index, raw.includes("#") ? raw.slice(raw.indexOf("#") + 1) : undefined);
    });
  }

  function resizeFrame() {
    const doc = frame.contentDocument;
    if (!doc) return;
    frame.style.height = Math.max(520, doc.documentElement.scrollHeight, doc.body?.scrollHeight || 0) + "px";
  }

  function showPage(index, sectionId) {
    activeIndex = Math.max(0, Math.min(data.pages.length - 1, index));
    const page = data.pages[activeIndex];
    pageTitle.textContent = page.title;
    previous.disabled = activeIndex === 0;
    next.disabled = activeIndex === data.pages.length - 1;
    location.hash = encodeURIComponent(page.path);
    renderNavigation();
    observer?.disconnect();
    frame.onload = () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      wireCourseLinks(doc);
      if (sectionId) doc.getElementById(sectionId)?.scrollIntoView();
      observer = new ResizeObserver(resizeFrame);
      observer.observe(doc.documentElement);
      resizeFrame();
    };
    frame.srcdoc = page.html;
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  previous.addEventListener("click", () => showPage(activeIndex - 1));
  next.addEventListener("click", () => showPage(activeIndex + 1));
  window.addEventListener("hashchange", () => {
    const index = data.pages.findIndex((page) => location.hash.slice(1) === encodeURIComponent(page.path));
    if (index >= 0 && index !== activeIndex) showPage(index);
  });
  showPage(activeIndex);
})();
</script>
