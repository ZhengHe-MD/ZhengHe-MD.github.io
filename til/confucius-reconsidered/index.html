ts {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px 24px;\n      margin: 32px 0 0;\n      padding: 18px 0;\n      border-block: 1px solid var(--line);\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.84rem;\n    }\n\n    .course-facts strong {\n      color: var(--ink);\n      font-weight: 650;\n    }\n\n    section {\n      margin-top: 64px;\n    }\n\n    h2 {\n      margin: 0 0 18px;\n      font-size: 1.7rem;\n      font-weight: 600;\n    }\n\n    .note {\n      margin-top: 24px;\n      padding: 20px 22px;\n      border-left: 3px solid var(--green);\n      background: rgba(255, 253, 248, 0.65);\n    }\n\n    .note strong {\n      color: var(--green);\n    }\n\n    .arc {\n      display: grid;\n      gap: 18px;\n      margin-top: 28px;\n    }\n\n    .session {\n      position: relative;\n      padding: 24px 24px 22px 72px;\n      border: 1px solid var(--line);\n      border-radius: 4px;\n      background: rgba(255, 253, 248, 0.72);\n    }\n\n    .number {\n      position: absolute;\n      top: 23px;\n      left: 22px;\n      display: grid;\n      width: 32px;\n      height: 32px;\n      place-items: center;\n      border-radius: 50%;\n      background: var(--red-soft);\n      color: var(--red);\n      font-family: system-ui, sans-serif;\n      font-size: 0.8rem;\n      font-weight: 750;\n    }\n\n    .session h3 {\n      margin: 0;\n      font-size: 1.2rem;\n      font-weight: 650;\n    }\n\n    .session .question {\n      margin: 8px 0 14px;\n      color: var(--red);\n      font-style: italic;\n    }\n\n    .concepts {\n      margin: 0;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.83rem;\n    }\n\n    details {\n      margin-top: 16px;\n      border-top: 1px solid var(--line);\n      padding-top: 13px;\n    }\n\n    summary {\n      color: var(--green);\n      cursor: pointer;\n      font-family: system-ui, sans-serif;\n      font-size: 0.82rem;\n      font-weigh s to\n        memorize, we will treat them as parts of one philosophical system. Each session\n        starts with a tension, uses a short passage from the \u003ccite>Analects\u003c/cite>, and\n        ends with one decision that tests your interpretation.\n      \u003c/p>\n      \u003caside class=\"note\">\n        \u003cstrong>Designed for your background.\u003c/strong> Key terms will appear in Chinese\n        alongside concise English analysis. Familiar schoolbook readings will be\n        acknowledged, then complicated—not taught from zero.\n      \u003c/aside>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"course-arc\">\n      \u003ch2 id=\"course-arc\">The three-session arc\u003c/h2>\n      \u003cdiv class=\"arc\">\n        \u003carticle class=\"session\">\n          \u003cspan class=\"number\" aria-hidden=\"true\">01\u003c/span>\n          \u003ch3 id=\"session-one\">Becoming human through practice\u003c/h3>\n          \u003cp class=\"question\">Are we good first, or do repeated forms make us good?\u003c/p>\n          \u003cp class=\"concepts\">\n            Core ideas: \u003cspan lang=\"zh-Hans\">仁\u003c/span> (humaneness),\n            \u003cspan lang=\"zh-Hans\">礼\u003c/span> (ritual propriety),\n            \u003cspan lang=\"zh-Hans\">君子\u003c/span> (exemplary person)\n          \u003c/p>\n          \u003cdetails>\n            \u003csummary>Preview the five-minute route\u003c/summary>\n            \u003col>\n              \u003cli>Recall a familiar saying—and question its usual reading.\u003c/li>\n              \u003cli>Build the relationship between \u003cspan lang=\"zh-Hans\">仁\u003c/span> and \u003cspan lang=\"zh-Hans\">礼\u003c/span>.\u003c/li>\n              \u003cli>Choose how a \u003cspan lang=\"zh-Hans\">君子\u003c/span> would respond to a concrete social moment.\u003c/li>\n            \u003c/ol>\n          \u003c/details>\n        \u003c/article>\n\n        \u003carticle class=\"session\">\n          \u003cspan class=\"number\" aria-hidden=\"true\">02\u003c/span>\n          \u003ch3 id=\"session-two\">The self inside relationships\u003c/h3>\n          \u003cp class=\"question\">Can partial duties to family produce an ethical society?\u003c/p>\n          \u003cp class=\"concepts\">\n            Core ideas: \u003cspan lang=\"zh-Hans\">孝\u003c/span> (filiality),\n            \u003cspan lang=\"zh-Hans\">忠恕\u003c/span> (doing one’s utmost and sympathetic understanding),\n            \u003cspan lang=\"zh-Hans\">正名\u003c/span> (rectifying names)\n          \u003c/p>\n          \u003cdetails>\n            \u003csummary>Preview the five-minute route\u003c/summary>\n            \u003col>\n              \u003cli>Map the Confucian self as a web of roles, not an isolated individual.\u003c/li>\n              \u003cli>Test whether \u003cspan lang=\"zh-Hans\">孝\u003c/span> conflicts with impartial justice.\u003c/li>\n              \u003cli>Use \u003cspan lang=\"zh-Hans\">正名\u003c/span> to diagnose a breakdown in responsibility.\u003c/li>\n            \u003c/ol>\n          \u003c/details>\n        \u003c/article>\n\n        \u003carticle class=\"session\">\n          \u003cspan class=\"number\" aria-hidden=\"true\">03\u003c/span>\n          \u003ch3 id=\"session-three\">Moral authority and political order\u003c/h3>\n          \u003cp class=\"question\">Can exemplary conduct govern more effectively than rules and punishment?\u003c/p>\n          \u003cp class=\"concepts\">\n            Core ideas: \u003cspan lang=\"zh-Hans\">德\u003c/span> (moral power),\n            \u003cspan lang=\"zh-Hans\">为政以德\u003c/span> (governing through virtue),\n            education and the Confucian legacy\n          \u003c/p>\n          \u003cdetails>\n            \u003csummary>Preview the five-minute route\u003c/summary>\n            \u003col>\n              \u003cli>Contrast moral example with coercive government.\u003c/li>\n              \u003cli>Read Confucius charitably, then raise the strongest modern objection.\u003c/li>\n              \u003cli>Assemble one concept map connecting person, relationship, and state.\u003c/li>\n            \u003c/ol>\n          \u003c/details>\n        \u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"outcomes\">\n      \u003ch2 id=\"outcomes\">By the end\u003c/h2>\n      \u003cul class=\"outcomes\">\n        \u003cli>Explain how the major concepts support one another instead of reciting them separately.\u003c/li>\n        \u003cli>Interpret a short \u003ccite>Analects\u003c/cite> passage with attention to philosophical tension.\u003c/li>\n        \u003cli>Distinguish Confucius’s own project from later slogans associated with “Confucianism.”\u003c/li>\n        \u003cli>Form a defensible view of one strength and one limitation in his ethical vision.\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003cp class=\"closing\">\n      Next: Session 1 will begin with a saying you probably remember, then make it strange again.\n    \u003c/p>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n\n"},{"path":"session1.html","title":"Becoming human through practice","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Becoming human through practice\">\n  \u003ctitle>Becoming Human Through Practice — Confucius Reconsidered\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d5;\n      --ink: #2f2a24;\n      --muted: #756b5f;\n      --line: #d8cbbb;\n      --red: #963e32;\n      --red-soft: #ead7d0;\n      --green: #486457;\n      --white: #fffdf8;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      background:\n ept-button {\n      min-height: 112px;\n      padding: 16px 10px;\n      border: 1px solid var(--line);\n      border-radius: 50% 50% 46% 54% / 46% 54% 48% 52%;\n      background: rgba(255, 253, 248, 0.72);\n      color: var(--ink);\n      cursor: pointer;\n      font-family: inherit;\n    }\n\n    .concept-button strong {\n      display: block;\n      color: var(--red);\n      font-size: 1.7rem;\n      font-weight: 500;\n    }\n\n    .concept-button span {\n      display: block;\n      margin-top: 3px;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.74rem;\n    }\n\n    .concept-button[aria-pressed=\"true\"] {\n      border-color: var(--green);\n      background: #e7ece5;\n      box-shadow: 0 0 0 3px rgba(72, 100, 87, 0.12);\n    }\n\n    .concept-detail {\n      min-height: 7.2em;\n      margin-top: 16px;\n      padding: 18px 20px;\n      border-left: 3px solid var(--green);\n      background: rgba(255, 253, 248, 0.64);\n    }\n\n    .concept-detail h3 {\n      margin: 0 0 6px;\n      font-size: 1.05rem;\n    }\n\n    .concept-detail p {\n      margin: 0;\n    }\n\n    .inner-outer-loop {\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) 6.5rem minmax(0, 1fr);\n      align-items: stretch;\n      gap: 12px;\n      margin-top: 24px;\n    }\n\n    .loop-side {\n      padding: 18px;\n      border: 1px solid var(--line);\n      border-radius: 4px;\n      background: rgba(255, 253, 248, 0.72);\n    }\n\n    .loop-side .domain {\n      margin: 0 0 6px;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.72rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .loop-side h4 {\n      margin: 0;\n      color: var(--red);\n      font-size: 1.14rem;\n    }\n\n    .loop-side p:last-child {\n      margin-bottom: 0;\n      font-size: 0.92rem;\n    }\n\n    .loop-link {\n      display: grid;\n      align-content: center;\n      gap: 7px;\n      color: var(--green);\n      font-family: system-ui, sans-serif;\n      font-size: 0.72rem;\n      font-weight: 700;\n      line-height: 1.35;\n      text-align: center;\n    }\n\n    .loop-link .arrow {\n      color: var(--red);\n      font-size: 1.6rem;\n      font-weight: 400;\n      line-height: 0.8;\n    }\n\n    .failure-modes {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 12px;\n      margin-top: 12px;\n    }\n\n    .failure-mode {\n      margin: 0;\n      padding: 14px 16px;\n      border-left: 2px solid var(--line);\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    .failure-mode strong {\n      color: var(--ink);\n    }\n\n    .loop-conclusion {\n      margin: 18px 0 0;\n      color: var(--green);\n      font-weight: 600;\n    }\n\n    .interpretive-caution {\n      margin-top: 24px;\n      color: var(--muted);\n      font-size: 0.94rem;\n    }\n\n    .synthesis {\n      padding: 22px 24px;\n      border-left: 3px solid var(--red);\n      background: var(--red-soft);\n      font-size: 1.05rem;\n    }\n\n    .up-next-grid {\n      display: grid;\n      gap: 12px;\n      margin-top: 22px;\n    }\n\n    .up-next-item {\n      padding: 18px 20px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.48);\n    }\n\n    .up-next-item p {\n      margin: 6px 0 0;\n      color: var(--muted);\n    }\n\n    .up-next-item h3 {\n      margin: 0;\n      font-size: 1.02rem;\n    }\n\n    @media (max-width: 560px) {\n      main {\n        width: min(100% - 28px, 66ch);\n        padding-top: 46px;\n      }\n\n      .session {\n        padding: 20px;\n      }\n\n      .number {\n        position: static;\n        margin-bottom: 12px;\n      }\n\n      .concept-map {\n        grid-template-columns: 1fr;\n      }\n\n      .concept-button {\n        min-height: auto;\n        border-radius: 4px;\n      }\n\n      .inner-outer-loop {\n        grid-template-columns: 1fr;\n      }\n\n      .loop-link {\n        min-height: 76px;\n      }\n\n      .loop-link .arrow {\n        transform: rotate(90deg);\n      }\n\n      .failure-modes {\n        grid-template-columns: 1fr;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cheader>\n      \u003cdiv class=\"lesson-progress\" aria-hidden=\"true\">\u003cspan id=\"progress-bar\">\u003c/span>\u003c/div>\n      \u003cp class=\"eyebrow\">Session 1 of 3 · about 5 minutes\u003c/p>\n      \u003ch1>Becoming human \u003cspan>through practice\u003c/span>\u003c/h1>\n      \u003cp class=\"lede\">\n        You probably remember the words \u003cspan lang=\"zh-Hans\">仁、礼、君子\u003c/span>.\n        The harder question is how they fit together: is virtue an inner feeling,\n        an outward performance, or a character slowly formed by both?\n      \u003c/p>\n      \u003cdiv class=\"course-facts\" aria-label=\"Lesson facts\">\n        \u003cspan>\u003cstrong>Question:\u003c/strong> Can practicing forms make us humane?\u003c/span>\n        \u003cspan>\u003cstrong>Text:\u003c/strong> \u003ccite>Analects\u003c/cite> 12.1\u003c/span>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection aria-labelledby=\"familiar-line\">\n      \u003ch2 id=\"familiar-line\">Make a familiar line strange\u003c/h2>\n      \u003cp>\n        When Yan Hui asks about \u003cspan lang=\"zh-Hans\">仁\u003c/span>, Confucius does not define\n        it as a feeling. He answers with an action:\n      \u003c/p>\n      \u003cfigure class=\"passage\">\n        \u003cblockquote lang=\"zh-Hans\">“克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”\u003c/blockquote>\n        \u003cfigcaption>《论语·颜渊》12.1\u003c/figcaption>\n        \u003cp class=\"translation\">\n          “To discipline the self and return to ritual propriety is to become humane…\n          Becoming humane depends on oneself—could it depend on others?”\n        \u003c/p>\n      \u003c/figure>\n      \u003cp>\n        \u003cspan lang=\"zh-Hans\">克己\u003c/span> need not mean erasing individuality, and\n        \u003cspan lang=\"zh-Hans\">礼\u003c/span> is wider than ceremonies or polite manners. It\n        includes learned forms for inhabiting roles—how one speaks, listens, mourns,\n        disagrees, and shows regard.\n      \u003c/p>\n\n      \u003cdiv class=\"question-card\" data-question=\"reading\">\n        \u003cp class=\"question-label\">Quick interpretation\u003c/p>\n        \u003ch3 id=\"reading-question\">What is the most philosophically useful reading of the line?\u003c/h3>\n        \u003cdiv class=\"choices\" role=\"group\" aria-labelledby=\"reading-question\">\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"obedience\" aria-pressed=\"false\">\n            Suppress personal desires and obey inherited rules.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"practice\" aria-pressed=\"false\">\n            Regulate self-centered impulses through shared practices until humane conduct becomes characteristic.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"feeling\" aria-pressed=\"false\">\n            Feel sincere concern; outward forms are secondary.\n          \u003c/button>\n        \u003c/div>\n        \u003cp class=\"feedback\" id=\"reading-feedback\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"three-part-system\">\n      \u003ch2 id=\"three-part-system\">One system, not three vocabulary words\u003c/h2>\n      \u003cp>Select each term. Notice that none is complete by itself.\u003c/p>\n      \u003cdiv class=\"concept-map\" role=\"group\" aria-label=\"Explore the three connected concepts\">\n        \u003cbutton class=\"concept-button\" type=\"button\" data-concept=\"ren\" aria-pressed=\"true\">\n          \u003cstrong lang=\"zh-Hans\">仁\u003c/strong>\n          \u003cspan>ethical direction\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"concept-button\" type=\"button\" data-concept=\"li\" aria-pressed=\"false\">\n          \u003cstrong lang=\"zh-Hans\">礼\u003c/strong>\n          \u003cspan>practiced form\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"concept-button\" type=\"button\" data-concept=\"junzi\" aria-pressed=\"false\">\n          \u003cstrong lang=\"zh-Hans\">君子\u003c/strong>\n          \u003cspan>cultivated character\u003c/span>\n        \u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"concept-detail\" id=\"concept-detail\" aria-live=\"polite\">\n        \u003cdiv data-concept-panel=\"ren\">\n          \u003ch3>\u003cspan lang=\"zh-Hans\">仁\u003c/span> gives practice its ethical direction\u003c/h3>\n          \u003cp>\n            Often translated “humaneness,” \u003cspan lang=\"zh-Hans\">仁\u003c/span> is a way of\n            attending and responding well to other people—not merely warm feeling. It\n            leans toward the inner dimension of ethics, but becomes real only in how\n            one responds. Without it, correct ritual can become empty performance.\n          \u003c/p>\n        \u003c/div>\n        \u003cdiv data-concept-panel=\"li\" hidden>\n          \u003ch3>\u003cspan lang=\"zh-Hans\">礼\u003c/span> makes ethical concern concrete\u003c/h3>\n          \u003cp>\n            Ritual propriety supplies learned, public forms for respect: timing,\n            gesture, language, and role-sensitive conduct. It leans toward the outer\n            dimension, but is not merely external: sincere practice also reshapes\n            attention, emotion, and desire.\n          \u003c/p>\n        \u003c/div>\n        \u003cdiv data-concept-panel=\"junzi\" hidden>\n          \u003ch3>\u003cspan lang=\"zh-Hans\">君子\u003c/span> is the cultivated result—and the continuing project\u003c/h3>\n          \u003cp>\n            The exemplary person is not noble by birth and not morally finished. A\n            \u003cspan lang=\"zh-Hans\">君子\u003c/span> repeatedly aligns humane attention with\n            fitting form, then becomes an example from whom others can learn.\n          \u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003ch3 id=\"inner-outer-loop\">Inner and outer: distinguishable, not separable\u003c/h3>\n      \u003cp>\n        The distinction is useful if we treat it as a difference of emphasis. Confucius\n        does not imagine a finished inner virtue that simply puts on an external\n        costume. Each side continuously works on the other.\n      \u003c/p>\n      \u003cdiv class=\"inner-outer-loop\" aria-label=\"The reciprocal relationship between humane orientation and ritual propriety\">\n        \u003carticle class=\"loop-side\">\n          \u003cp class=\"domain\">Inner-leaning\u003c/p>\n          \u003ch4>\u003cspan lang=\"zh-Hans\">仁\u003c/span> · humane orientation\u003c/h4>\n          \u003cp>What you notice, care about, feel, and intend toward another person.\u003c/p>\n        \u003c/article>\n        \u003cdiv class=\"loop-link\">\n          \u003cspan>\u003cspan lang=\"zh-Hans\">仁\u003c/span> guides what \u003cspan lang=\"zh-Hans\">礼\u003c/span> should express\u003c/span>\n          \u003cspan class=\"arrow\" aria-hidden=\"true\">⇄\u003c/span>\n          \u003cspan>\u003cspan lang=\"zh-Hans\">礼\u003c/span> practices and strengthens \u003cspan lang=\"zh-Hans\">仁\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003carticle class=\"loop-side\">\n          \u003cp class=\"domain\">Outer-leaning\u003c/p>\n          \u003ch4>\u003cspan lang=\"zh-Hans\">礼\u003c/span> · ritual propriety\u003c/h4>\n          \u003cp>The fitting words, gestures, roles, and practices through which you respond.\u003c/p>\n        \u003c/article>\n      \u003c/div>\n      \u003cdiv class=\"failure-modes\" aria-label=\"What happens when one side is missing\">\n        \u003cp class=\"failure-mode\">\n          \u003cstrong>\u003cspan lang=\"zh-Hans\">仁\u003c/span> without adequate \u003cspan lang=\"zh-Hans\">礼\u003c/span>:\u003c/strong>\n          well-intentioned concern may remain clumsy, invisible, or unreliable.\n        \u003c/p>\n        \u003cp class=\"failure-mode\">\n          \u003cstrong>\u003cspan lang=\"zh-Hans\">礼\u003c/span> without \u003cspan lang=\"zh-Hans\">仁\u003c/span>:\u003c/strong>\n          formally correct conduct becomes hollow performance or manipulation.\n        \u003c/p>\n      \u003c/div>\n      \u003cp class=\"loop-conclusion\">\n        The loop is the cultivation: inner orientation guides outward practice; outward\n        practice returns to reshape inner character.\n      \u003c/p>\n\n      \u003cp class=\"interpretive-caution\">\n        A university-level caution: the \u003ccite>Analects\u003c/cite> does not present a tidy\n        theory with fixed technical definitions. This map is a reconstruction from\n        recurring patterns in the text.\n      \u003c/p>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"practice\">\n      \u003ch2 id=\"practice\">Test the system in a social moment\u003c/h2>\n      \u003cp>\n        In a seminar, the professor mistakenly praises you for an idea your classmate\n        introduced moments earlier. What response best combines\n        \u003cspan lang=\"zh-Hans\">仁\u003c/span> and \u003cspan lang=\"zh-Hans\">礼\u003c/span>?\n      \u003c/p>\n      \u003cdiv class=\"question-card\" data-question=\"scenario\">\n        \u003cp class=\"question-label\">Your decision\u003c/p>\n        \u003ch3 id=\"scenario-question\">Choose the response you would defend.\u003c/h3>\n        \u003cdiv class=\"choices\" role=\"group\" aria-labelledby=\"scenario-question\">\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"silent\" aria-pressed=\"false\">\n            Say nothing. Correcting a professor publicly would violate respectful form.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"blunt\" aria-pressed=\"false\">\n            Interrupt: “That’s wrong—it wasn’t my idea.” Truth matters more than form.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"redirect\" aria-pressed=\"false\">\n            Say: “That was Xiaolin’s point; I learned from it too,” returning credit without humiliating anyone.\n          \u003c/button>\n        \u003c/div>\n        \u003cp class=\"feedback\" id=\"scenario-feedback\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"synthesis\">\n      \u003ch2 id=\"synthesis\">The one-sentence synthesis\u003c/h2>\n      \u003cp class=\"synthesis\">\n        \u003cspan lang=\"zh-Hans\">仁\u003c/span> supplies humane orientation;\n        \u003cspan lang=\"zh-Hans\">礼\u003c/span> gives that orientation repeatable social form;\n        the \u003cspan lang=\"zh-Hans\">君子\u003c/span> is the person whose repeated practice has\n        made the two mutually reinforcing.\n      \u003c/p>\n      \u003cp>\n        Inner and outer are therefore distinguishable aspects of virtue, but not\n        independent parts. This avoids two thin readings of Confucius: virtue is\n        neither private sincerity alone nor mechanical conformity alone.\n      \u003c/p>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"up-next\">\n      \u003ch2 id=\"up-next\">Up next\u003c/h2>\n      \u003cdiv class=\"up-next-grid\">\n        \u003carticle class=\"up-next-item\">\n          \u003ch3 id=\"session-two\">Session 2 · The self inside relationships\u003c/h3>\n          \u003cp>\u003cspan lang=\"zh-Hans\">孝、忠恕、正名\u003c/span> — can family partiality support justice?\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"up-next-item\">\n          \u003ch3 id=\"session-three\">Session 3 · Moral authority and political order\u003c/h3>\n          \u003cp>\u003cspan lang=\"zh-Hans\">德、为政以德\u003c/span> — can example govern better than punishment?\u003c/p>\n        \u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cp class=\"closing\">Session 1 is complete when you can explain why Confucius needs both inner orientation and outward form.\u003c/p>\n  \u003c/main>\n\n  \u003cscript>\n    const completedQuestions = new Set();\n\n    const feedback = {\n      obedience: \"Too narrow. This turns self-discipline into submission and treats 礼 as fixed rules, missing its role in cultivating perception and response.\",\n      practice: \"Strongest reading. The point is not a single obedient act but self-cultivation through practices that make humane response more reliable.\",\n      feeling: \"Only half the system. Sincere concern matters, but Confucius distrusts virtue that never acquires an appropriate, shareable form.\",\n      silent: \"礼 without enough 仁: the form protects hierarchy, but neglects your classmate and allows a false attribution to stand.\",\n      blunt: \"仁’s concern for fairness is present, but the form is needlessly damaging. A Confucian response asks whether truth can be expressed more fittingly.\",\n      redirect: \"Best integration: concern restores your classmate’s standing, while tact preserves the relationships involved. 礼 is doing ethical work, not hiding the truth.\"\n    };\n\n    function updateProgress() {\n      const percentage = completedQuestions.size * 50;\n      document.getElementById(\"progress-bar\").style.width = percentage + \"%\";\n    }\n\n    function selectAnswer(card, selectedButton) {\n      card.querySelectorAll(\".choice\").forEach(function (button) {\n        button.setAttribute(\"aria-pressed\", \"false\");\n      });\n      selectedButton.setAttribute(\"aria-pressed\", \"true\");\n      card.querySelector(\".feedback\").textContent = feedback[selectedButton.dataset.answer];\n      completedQuestions.add(card.dataset.question);\n      updateProgress();\n    }\n\n    document.querySelectorAll(\".question-card\").forEach(function (card) {\n      card.querySelectorAll(\".choice\").forEach(function (button) {\n        button.addEventListener(\"click\", function () {\n          selectAnswer(card, button);\n        });\n      });\n    });\n\n    document.querySelectorAll(\".concept-button\").forEach(function (button) {\n      button.addEventListener(\"click\", function () {\n        document.querySelectorAll(\".concept-button\").forEach(function (item) {\n          item.setAttribute(\"aria-pressed\", \"false\");\n        });\n        button.setAttribute(\"aria-pressed\", \"true\");\n        document.querySelectorAll(\"[data-concept-panel]\").forEach(function (panel) {\n          panel.hidden = panel.dataset.conceptPanel !== button.dataset.concept;\n        });\n      });\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session2.html","title":"The self inside relationships","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"The self inside relationships\">\n  \u003ctitle>The Self Inside Relationships — Confucius Reconsidered\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d5;\n      --ink: #2f2a24;\n      --muted: #756b5f;\n      --line: #d8cbbb;\n      --red: #963e32;\n      --red-soft: #ead7d0;\n      --green: #486457;\n      --green-soft: #e7ece5;\n      --white: #fffdf8;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      background:\n        linear-gradient(90deg, rgba(150, 62, 50, 0.045) 1px, transparent 1px),\n        var(--paper);\n      background-size: min(9vw, 88px) 100%;\n      color: var(--ink);\n      font-family: Georgia, \"Noto Serif SC\", \"Songti SC\", serif;\n      line-height: 1.68;\n    }\n\n    main {\n      width: min(100% - 40px, 66ch);\n      margin: 0 auto;\n      padding: 72px 0 88px;\n    }\n\n    .eyebrow,\n    .question-label,\n    .domain {\n      font-family: system-ui, sans-serif;\n    }\n\n    .eyebrow {\n      margin: 0 0 18px;\n      color: var(--red);\n      font-size: 0.72rem;\n      font-weight: 700;\n      letter-spacing: 0.16em;\n      text-transform: uppercase;\n    }\n\n    h1,\n    h2,\n    h3 {\n      line-height: 1.18;\n      text-wrap: balance;\n    }\n\n    h1 {\n      max-width: 13ch;\n      margin: 0;\n      font-size: clamp(2.7rem, 9vw, 5.4rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h1 span {\n      color: var(--red);\n      font-family: \"Noto Serif SC\", \"Songti SC\", serif;\n      font-weight: 400;\n    }\n\n    h2 {\n      margin: 0 0 18px;\n      font-size: 1.7rem;\n      font-weight: 600;\n    }\n\n    h3 {\n      font-size: 1.12rem;\n    }\n\n    .lede {\n      max-width: 58ch;\n      margin: 28px 0 0;\n      color: #4e463d;\n      font-size: 1.15rem;\n    }\n\n    .course-facts {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px 24px;\n      margin: 32px 0 0;\n      padding: 18px 0;\n      border-block: 1px solid var(--line);\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.84rem;\n    }\n\n    .course-facts strong {\n      color: var(--ink);\n      font-weight: 650;\n    }\n\n    section {\n      margin-top: 64px;\n    }\n\n    .lesson-progress {\n      height: 3px;\n      margin-bottom: 26px;\n      overflow: hidden;\n      border-radius: 2px;\n      background: var(--paper-deep);\n    }\n\n    .lesson-progress span {\n      display: block;\n      width: 0;\n      height: 100%;\n      background: var(--red);\n      transition: width 240ms ease;\n    }\n\n    .passage {\n      margin: 26px 0;\n      padding: 24px 26px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.78);\n    }\n\n    .passage blockquote {\n      margin: 0;\n      font-size: 1.28rem;\n      line-height: 1.62;\n    }\n\n    .passage figcaption {\n      margin-top: 12px;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.8rem;\n    }\n\n    .translation {\n      margin-bottom: 0;\n      color: #554d44;\n      font-style: italic;\n    }\n\n    .role-web {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 10px;\n      margin-top: 24px;\n    }\n\n    .role-button {\n      min-height: 94px;\n      padding: 14px 16px;\n      border: 1px solid var(--line);\n      border-radius: 4px;\n      background: rgba(255, 253, 248, 0.76);\n      color: var(--ink);\n      cursor: pointer;\n      font: inherit;\n      text-align: left;\n    }\n\n    .role-button strong {\n      display: block;\n      color: var(--red);\n      font-size: 1.03rem;\n    }\n\n    .role-button span {\n      display: block;\n      margin-top: 4px;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.77rem;\n    }\n\n    .role-button:hover,\n    .choice:hover {\n      border-color: #a99582;\n      background: #fffaf1;\n    }\n\n    .role-button[aria-pressed=\"true\"] {\n      border-color: var(--green);\n      background: var(--green-soft);\n      box-shadow: inset 3px 0 0 var(--green);\n    }\n\n    .role-detail {\n      min-height: 9.5em;\n      margin-top: 12px;\n      padding: 19px 21px;\n      border-left: 3px solid var(--green);\n      background: rgba(255, 253, 248, 0.64);\n    }\n\n    .role-detail h3 {\n      margin: 0 0 7px;\n    }\n\n    .role-detail p {\n      margin: 0;\n    }\n\n    .reciprocal {\n      display: grid;\n      grid-template-columns: 1fr auto 1fr;\n      align-items: center;\n      gap: 10px;\n      margin-top: 14px;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.82rem;\n      text-align: center;\n    }\n\n    .reciprocal span {\n      padding: 8px;\n      border: 1px solid var(--line);\n      background: var(--white);\n    }\n\n    .reciprocal b {\n      color: var(--red);\n      font-size: 1.35rem;\n      font-weight: 400;\n    }\n\n    .note {\n      margin-top: 24px;\n      padding: 20px 22px;\n      border-left: 3px solid var(--green);\n      background: rgba(255, 253, 248, 0.65);\n    }\n\n    .note strong {\n      color: var(--green);\n    }\n\n    .question-card {\n      margin-top: 28px;\n      padding: 24px;\n      border: 1px solid var(--line);\n      border-radius: 4px;\n      background: rgba(255, 253, 248, 0.76);\n    }\n\n    .question-label {\n      margin: 0 0 7px;\n      color: var(--red);\n      font-size: 0.72rem;\n      font-weight: 750;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .question-card h3 {\n      margin: 0;\n    }\n\n    .choices {\n      display: grid;\n      gap: 10px;\n      margin-top: 18px;\n    }\n\n    .choice {\n      width: 100%;\n      padding: 13px 15px;\n      border: 1px solid var(--line);\n      border-radius: 3px;\n      background: var(--white);\n      color: var(--ink);\n      cursor: pointer;\n      font: inherit;\n      line-height: 1.45;\n      text-align: left;\n    }\n\n    .choice[aria-pressed=\"true\"] {\n      border-color: var(--red);\n      box-shadow: inset 3px 0 0 var(--red);\n    }\n\n    .feedback {\n      min-height: 1.5em;\n      margin: 16px 0 0;\n      color: var(--green);\n      font-weight: 600;\n    }\n\n    .feedback:empty {\n      display: none;\n    }\n\n    .tension-line {\n      display: grid;\n      grid-template-columns: 1fr auto 1fr;\n      align-items: center;\n      gap: 12px;\n      margin-top: 18px;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.77rem;\n      font-weight: 650;\n      text-align: center;\n    }\n\n    .tension-line i {\n      display: block;\n      width: 54px;\n      height: 1px;\n      background: var(--line);\n    }\n\n    .two-lenses {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 12px;\n      margin-top: 22px;\n    }\n\n    .lens {\n      padding: 20px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.64);\n    }\n\n    .lens .domain {\n      margin: 0 0 5px;\n      color: var(--muted);\n      font-size: 0.7rem;\n      font-weight: 700;\n      letter-spacing: 0.09em;\n      text-transform: uppercase;\n    }\n\n    .lens h3 {\n      margin: 0;\n      color: var(--red);\n      font-size: 1.16rem;\n    }\n\n    .lens p:last-child {\n      margin-bottom: 0;\n      font-size: 0.92rem;\n    }\n\n    .source-line {\n      padding-top: 12px;\n      border-top: 1px solid var(--line);\n      color: var(--muted);\n      font-size: 0.86rem;\n    }\n\n    .bridge {\n      margin: 14px 0 0;\n      padding: 14px 18px;\n      background: var(--green-soft);\n      color: var(--green);\n      font-weight: 600;\n      text-align: center;\n    }\n\n    .pair-practice {\n      margin-top: 28px;\n      padding: 24px;\n      border: 1px solid var(--line);\n      border-radius: 4px;\n      background: rgba(255, 253, 248, 0.76);\n    }\n\n    .pair-practice h3 {\n      margin: 0;\n    }\n\n    .pair-controls {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 8px;\n      margin-top: 18px;\n    }\n\n    .pair-button {\n      padding: 10px 8px;\n      border: 1px solid var(--line);\n      border-radius: 3px;\n      background: var(--white);\n      color: var(--ink);\n      cursor: pointer;\n      font: inherit;\n      font-size: 0.9rem;\n    }\n\n    .pair-button:hover {\n      border-color: #a99582;\n      background: #fffaf1;\n    }\n\n    .pair-button[aria-pressed=\"true\"] {\n      border-color: var(--green);\n      background: var(--green-soft);\n      box-shadow: inset 0 -3px 0 var(--green);\n    }\n\n    .pair-panel {\n      min-height: 10.5em;\n      margin-top: 16px;\n      padding: 18px 20px;\n      border-left: 3px solid var(--green);\n      background: rgba(255, 253, 248, 0.64);\n    }\n\n    .pair-panel p {\n      margin: 0;\n    }\n\n    .pair-panel p + p {\n      margin-top: 10px;\n    }\n\n    .pair-panel strong {\n      color: var(--red);\n    }\n\n    .case-connection {\n      margin-top: 24px;\n      padding: 20px 22px;\n      border-left: 3px solid var(--red);\n      background: var(--red-soft);\n    }\n\n    .case-connection h3 {\n      margin: 0 0 8px;\n      font-size: 1.05rem;\n    }\n\n    .case-connection p {\n      margin: 0;\n    }\n\n    .case-connection p + p {\n      margin-top: 10px;\n    }\n\n    .synthesis {\n      padding: 22px 24px;\n      border-left: 3px solid var(--red);\n      background: var(--red-soft);\n      font-size: 1.05rem;\n    }\n\n    .up-next-item {\n      margin-top: 22px;\n      padding: 18px 20px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.48);\n    }\n\n    .up-next-item h3 {\n      margin: 0;\n      font-size: 1.02rem;\n    }\n\n    .up-next-item p {\n      margin: 6px 0 0;\n      color: var(--muted);\n    }\n\n    .closing {\n      margin-top: 64px;\n      padding-top: 22px;\n      border-top: 1px solid var(--line);\n      color: var(--muted);\n      font-size: 0.93rem;\n    }\n\n    @media (max-width: 560px) {\n      main {\n        width: min(100% - 28px, 66ch);\n        padding-top: 46px;\n      }\n\n      .role-web,\n      .two-lenses {\n        grid-template-columns: 1fr;\n      }\n\n      .pair-controls {\n        grid-template-columns: 1fr;\n      }\n\n      .pair-panel {\n        min-height: 0;\n      }\n\n      .role-button {\n        min-height: auto;\n      }\n\n      .reciprocal {\n        grid-template-columns: 1fr;\n      }\n\n      .reciprocal b {\n        transform: rotate(90deg);\n      }\n\n      .tension-line {\n        grid-template-columns: 1fr;\n      }\n\n      .tension-line i {\n        width: 1px;\n        height: 24px;\n        margin: 0 auto;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cheader>\n      \u003cdiv class=\"lesson-progress\" aria-hidden=\"true\">\u003cspan id=\"progress-bar\">\u003c/span>\u003c/div>\n      \u003cp class=\"eyebrow\">Session 2 of 3 · about 5 minutes\u003c/p>\n      \u003ch1>The self \u003cspan>inside relationships\u003c/span>\u003c/h1>\n      \u003cp class=\"lede\">\n        Confucius rarely begins with an isolated person choosing universal rules.\n        He begins with someone already situated—as child, sibling, friend, student,\n        or official. Does that make ethics more humane, or merely more partial?\n      \u003c/p>\n      \u003cdiv class=\"course-facts\" aria-label=\"Lesson facts\">\n        \u003cspan>\u003cstrong>Question:\u003c/strong> Can family loyalty support justice?\u003c/span>\n        \u003cspan>\u003cstrong>Texts:\u003c/strong> \u003ccite>Analects\u003c/cite> 13.18 and 12.11\u003c/span>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection aria-labelledby=\"relational-self\">\n      \u003ch2 id=\"relational-self\">A self with coordinates\u003c/h2>\n      \u003cp>\n        “Relational self” does not mean that Confucius thinks you have no inner life.\n        It means that ethical reasons become visible through relationships. “What\n        should I do?” is incomplete until we also ask: “To whom, and in what role?”\n      \u003c/p>\n      \u003cp>Select a role to inspect the duties running in both directions.\u003c/p>\n\n      \u003cdiv class=\"role-web\" role=\"group\" aria-label=\"Explore a web of relational roles\">\n        \u003cbutton class=\"role-button\" type=\"button\" data-role=\"child\" aria-pressed=\"true\">\n          \u003cstrong>As an adult child\u003c/strong>\n          \u003cspan>\u003cspan lang=\"zh-Hans\">孝\u003c/span> · care with judgment\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"role-button\" type=\"button\" data-role=\"friend\" aria-pressed=\"false\">\n          \u003cstrong>As a friend\u003c/strong>\n          \u003cspan>\u003cspan lang=\"zh-Hans\">信\u003c/span> · trust and candor\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"role-button\" type=\"button\" data-role=\"student\" aria-pressed=\"false\">\n          \u003cstrong>As a student\u003c/strong>\n          \u003cspan>respect and active learning\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"role-button\" type=\"button\" data-role=\"citizen\" aria-pressed=\"false\">\n          \u003cstrong>As a citizen\u003c/strong>\n          \u003cspan>public responsibility\u003c/span>\n        \u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"role-detail\" id=\"role-detail\" aria-live=\"polite\">\n        \u003cdiv data-role-panel=\"child\">\n          \u003ch3 id=\"child-role\">Filiality is more than compliance\u003c/h3>\n          \u003cp>\n            \u003cspan lang=\"zh-Hans\">孝\u003c/span> includes care, gratitude, continuity, and\n            respectful remonstrance. The child owes serious attention to a parent;\n            the parent’s role also carries duties of care and moral example.\n          \u003c/p>\n          \u003cdiv class=\"reciprocal\" aria-label=\"Reciprocal duties between parent and child\">\n            \u003cspan>child: care + remonstrance\u003c/span>\u003cb aria-hidden=\"true\">⇄\u003c/b>\u003cspan>parent: care + example\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv data-role-panel=\"friend\" hidden>\n          \u003ch3 id=\"friend-role\">A friend is not a flatterer\u003c/h3>\n          \u003cp>\n            Trustworthiness makes candor possible. A friend should not abandon you,\n            but neither should friendship become automatic agreement. Each person\n            owes the other truthful concern.\n          \u003c/p>\n          \u003cdiv class=\"reciprocal\" aria-label=\"Reciprocal duties between friends\">\n            \u003cspan>you: loyalty + honesty\u003c/span>\u003cb aria-hidden=\"true\">⇄\u003c/b>\u003cspan>friend: loyalty + honesty\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv data-role-panel=\"student\" hidden>\n          \u003ch3 id=\"student-role\">Learning is responsive, not passive\u003c/h3>\n          \u003cp>\n            A student brings effort, attention, and questions. A teacher’s title,\n            meanwhile, is not a license for domination: it names a responsibility\n            to teach and to model the practices being taught.\n          \u003c/p>\n          \u003cdiv class=\"reciprocal\" aria-label=\"Reciprocal duties between student and teacher\">\n            \u003cspan>student: effort + inquiry\u003c/span>\u003cb aria-hidden=\"true\">⇄\u003c/b>\u003cspan>teacher: guidance + example\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv data-role-panel=\"citizen\" hidden>\n          \u003ch3 id=\"citizen-role\">Public roles widen the field\u003c/h3>\n          \u003cp>\n            Some responsibilities reach beyond intimates. A citizen or official must\n            consider strangers affected by a decision. Relational ethics can expand\n            outward; the difficult question is how far and on what terms.\n          \u003c/p>\n          \u003cdiv class=\"reciprocal\" aria-label=\"Reciprocal duties between citizen and public authority\">\n            \u003cspan>citizen: participation + critique\u003c/span>\u003cb aria-hidden=\"true\">⇄\u003c/b>\u003cspan>authority: service + accountability\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003caside class=\"note\">\n        \u003cstrong>The crucial complication:\u003c/strong> roles generate reasons, but they do\n        not settle every conflict. Being someone’s child may give you special duties;\n        it does not tell us whether those duties always defeat duties to the public.\n      \u003c/aside>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"family-justice\">\n      \u003ch2 id=\"family-justice\">Put partiality on trial\u003c/h2>\n      \u003cp>\n        The Duke of She praises a man for testifying that his father stole a sheep.\n        Confucius refuses the Duke’s picture of uprightness:\n      \u003c/p>\n      \u003cfigure class=\"passage\">\n        \u003cblockquote lang=\"zh-Hans\">\n          “吾党有直躬者，其父攘羊，而子证之。”孔子曰：“吾党之直者异于是：\n          父为子隐，子为父隐，直在其中矣。”\n        \u003c/blockquote>\n        \u003cfigcaption>《论语·子路》13.18\u003c/figcaption>\n        \u003cp class=\"translation\">\n          “Among us, the upright are different: a father shields his son, and a son\n          shields his father. Uprightness is found within this.”\n        \u003c/p>\n      \u003c/figure>\n      \u003cp>\n        This is not the comfortable slogan “family comes first.” It is a direct\n        collision between two moral perceptions: betrayal can damage the intimate\n        trust on which care depends, while concealment can leave a victim and the\n        public to bear the cost.\n      \u003c/p>\n\n      \u003cdiv class=\"question-card\" data-question=\"sheep\">\n        \u003cp class=\"question-label\">The sheep case, reconstructed\u003c/p>\n        \u003ch3 id=\"sheep-question\">\n          You learn that a parent damaged a neighbor’s scooter and quietly left.\n          Which response best preserves the Confucian insight without erasing justice?\n        \u003c/h3>\n        \u003cdiv class=\"choices\" role=\"group\" aria-labelledby=\"sheep-question\">\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"testify\" aria-pressed=\"false\">\n            Immediately report the parent and volunteer to testify; equal rules require treating family like anyone else.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"conceal\" aria-pressed=\"false\">\n            Lie to protect the parent; filial loyalty defeats any claim made by a stranger.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"repair\" aria-pressed=\"false\">\n            Refuse to become the parent’s accuser, but press them to admit the harm and help ensure the neighbor is repaid.\n          \u003c/button>\n        \u003c/div>\n        \u003cp class=\"feedback\" id=\"sheep-feedback\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"tension-line\" aria-label=\"The unresolved tension between family loyalty and public justice\">\n        \u003cspan>protect intimate trust\u003c/span>\u003ci aria-hidden=\"true\">\u003c/i>\u003cspan>answer public harm\u003c/span>\n      \u003c/div>\n\n      \u003cp>\n        The third response is a charitable reconstruction, not a line Confucius\n        supplies. It preserves his resistance to turning family members into neutral\n        legal informants while refusing to make affection an excuse for leaving harm\n        unrepaired. A modern critic can still object: what if private pressure fails,\n        or the offense is violent? The text leaves that limit unresolved.\n      \u003c/p>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"zhong-shu\">\n      \u003ch2 id=\"zhong-shu\">\u003cspan lang=\"zh-Hans\">忠恕\u003c/span>: a bridge beyond favoritism\u003c/h2>\n      \u003cp>\n        Relational duties need an ethical discipline. In the \u003ccite>Analects\u003c/cite>,\n        Confucius tells Zengzi that his way is threaded together by one principle.\n        After Confucius leaves, Zengzi explains that thread to the other students:\n      \u003c/p>\n      \u003cfigure class=\"passage\">\n        \u003cblockquote lang=\"zh-Hans\">“夫子之道，忠恕而已矣。”\u003c/blockquote>\n        \u003cfigcaption>《论语·里仁》4.15\u003c/figcaption>\n        \u003cp class=\"translation\">“The Master’s way consists of loyalty-to-duty and sympathetic reciprocity.”\u003c/p>\n      \u003c/figure>\n      \u003cp>\n        A useful later gloss is \u003cspan lang=\"zh-Hans\">尽己之谓忠，推己之谓恕\u003c/span>:\n        \u003cstrong>fully commit oneself\u003c/strong> is \u003cspan lang=\"zh-Hans\">忠\u003c/span>;\n        \u003cstrong>extend from oneself toward others\u003c/strong> is\n        \u003cspan lang=\"zh-Hans\">恕\u003c/span>. These are two directions of one practice:\n      \u003c/p>\n      \u003cdiv class=\"two-lenses\">\n        \u003carticle class=\"lens\">\n          \u003cp class=\"domain\">From the role outward\u003c/p>\n          \u003ch3 id=\"zhong-lens\">\u003cspan lang=\"zh-Hans\">忠\u003c/span> · conscientious responsibility\u003c/h3>\n          \u003cp>\n            Ask: “Am I genuinely fulfilling what this relationship or role asks of\n            me?” Here \u003cspan lang=\"zh-Hans\">忠\u003c/span> is broader than loyalty to a ruler\n            or obedience to a superior. It means bringing full attention, sincerity,\n            and effort instead of holding a role while withholding its work.\n          \u003c/p>\n          \u003cp class=\"source-line\">\n            Zengzi’s self-examination: \u003cspan lang=\"zh-Hans\">“为人谋而不忠乎？”\u003c/span> —\n            “When handling affairs for others, have I failed to be conscientious?”\n            (\u003ccite>Analects\u003c/cite> 1.4)\n          \u003c/p>\n        \u003c/article>\n        \u003carticle class=\"lens\">\n          \u003cp class=\"domain\">From oneself toward another\u003c/p>\n          \u003ch3 id=\"shu-lens\">\u003cspan lang=\"zh-Hans\">恕\u003c/span> · sympathetic reciprocity\u003c/h3>\n          \u003cp>\n            Ask: “If I were receiving this action, what would I reasonably need?”\n            Begin from your own experience, then make the imaginative move into the\n            other person’s position. Confucius gives a minimum:\n            \u003cspan lang=\"zh-Hans\">“己所不欲，勿施于人”\u003c/span> — do not impose on others\n            what you would reject yourself.\n          \u003c/p>\n          \u003cp class=\"source-line\">\n            A related positive movement is\n            \u003cspan lang=\"zh-Hans\">“己欲立而立人，己欲达而达人”\u003c/span> — if you wish to\n            become established or flourish, help others do so too.\n            (\u003ccite>Analects\u003c/cite> 6.30; compare 15.24)\n          \u003c/p>\n        \u003c/article>\n      \u003c/div>\n      \u003cp class=\"bridge\">\n        \u003cspan lang=\"zh-Hans\">忠\u003c/span> prevents empathy from becoming passive sentiment;\n        \u003cspan lang=\"zh-Hans\">恕\u003c/span> prevents responsibility from becoming coercion.\n      \u003c/p>\n      \u003cp>\n        \u003cspan lang=\"zh-Hans\">恕\u003c/span> is not projection. If you enjoy blunt criticism,\n        you cannot conclude that everyone else should receive it bluntly. Your own\n        experience is a starting point, not a complete algorithm: you still have to\n        listen and discover how the other person differs from you.\n      \u003c/p>\n\n      \u003cdiv class=\"pair-practice\">\n        \u003cp class=\"question-label\">Run both lenses\u003c/p>\n        \u003ch3 id=\"meeting-example\">\n          You lead a group project. The work is behind schedule, but everyone is tired.\n          Compare three responses.\n        \u003c/h3>\n        \u003cdiv class=\"pair-controls\" role=\"group\" aria-labelledby=\"meeting-example\">\n          \u003cbutton class=\"pair-button\" type=\"button\" data-pair=\"zhong\" aria-pressed=\"false\">\n            \u003cspan lang=\"zh-Hans\">忠\u003c/span> alone\n          \u003c/button>\n          \u003cbutton class=\"pair-button\" type=\"button\" data-pair=\"shu\" aria-pressed=\"false\">\n            \u003cspan lang=\"zh-Hans\">恕\u003c/span> alone\n          \u003c/button>\n          \u003cbutton class=\"pair-button\" type=\"button\" data-pair=\"together\" aria-pressed=\"true\">\n            \u003cspan lang=\"zh-Hans\">忠恕\u003c/span> together\n          \u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"pair-panel\" aria-live=\"polite\">\n          \u003cdiv data-pair-panel=\"zhong\" hidden>\n            \u003cp>\u003cstrong>“The project must be completed, so everyone must attend an 11 p.m. meeting.”\u003c/strong>\u003c/p>\n            \u003cp>\n              Responsibility is present, but perspective is missing. The leader’s\n              determination becomes coercive because teammates are treated as tools\n              for completing the task.\n            \u003c/p>\n          \u003c/div>\n          \u003cdiv data-pair-panel=\"shu\" hidden>\n            \u003cp>\u003cstrong>“Everyone is exhausted, so let’s cancel and not discuss the unfinished work.”\u003c/strong>\u003c/p>\n            \u003cp>\n              Empathy is present, but responsibility disappears. Understanding how\n              people feel does not itself fulfill the leader’s duty to help the group finish.\n            \u003c/p>\n          \u003c/div>\n          \u003cdiv data-pair-panel=\"together\">\n            \u003cp>\u003cstrong>“I am responsible for getting us to the finish, but I should not impose a schedule I would find unreasonable.”\u003c/strong>\u003c/p>\n            \u003cp>\n              Ask about everyone’s constraints, divide the remaining work fairly,\n              take an unglamorous task yourself, and set a workable deadline.\n              \u003cspan lang=\"zh-Hans\">忠\u003c/span> owns the outcome;\n              \u003cspan lang=\"zh-Hans\">恕\u003c/span> shapes how you pursue it.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003caside class=\"case-connection\">\n        \u003ch3 id=\"scooter-revisited\">Return to the damaged scooter\u003c/h3>\n        \u003cp>\n          \u003cspan lang=\"zh-Hans\">忠\u003c/span> toward your family member means caring about\n          their moral character, not merely protecting their reputation. You therefore\n          press them to take responsibility.\n        \u003c/p>\n        \u003cp>\n          \u003cspan lang=\"zh-Hans\">恕\u003c/span> extends attention to the neighbor: if your own\n          property were damaged, you would reasonably want acknowledgment and repair.\n          Together, the pair supports confronting your relative privately, insisting\n          on repayment, and offering to accompany them—neither abandonment nor favoritism.\n        \u003c/p>\n      \u003c/aside>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"rectifying-names\">\n      \u003ch2 id=\"rectifying-names\">\u003cspan lang=\"zh-Hans\">正名\u003c/span>: make the role answer to its name\u003c/h2>\n      \u003cp>\n        When Duke Jing asks about government, Confucius answers:\n      \u003c/p>\n      \u003cfigure class=\"passage\">\n        \u003cblockquote lang=\"zh-Hans\">“君君，臣臣，父父，子子。”\u003c/blockquote>\n        \u003cfigcaption>《论语·颜渊》12.11\u003c/figcaption>\n        \u003cp class=\"translation\">\n          “Let the ruler be a ruler, the minister a minister, the father a father,\n          and the son a son.”\n        \u003c/p>\n      \u003c/figure>\n      \u003cp>\n        Read lazily, this sounds like “everyone stay in place.” Read through\n        \u003cspan lang=\"zh-Hans\">正名\u003c/span>, it cuts both ways: a title creates a standard\n        by which its holder can be judged. Before a ruler demands loyal ministers,\n        the ruler must actually perform the responsibilities named by “ruler.”\n      \u003c/p>\n\n      \u003cdiv class=\"question-card\" data-question=\"names\">\n        \u003cp class=\"question-label\">Role audit\u003c/p>\n        \u003ch3 id=\"names-question\">\n          A group-project “leader” claims the credit, avoids the tedious work, and\n          blames the team for delays. What does rectifying names first demand?\n        \u003c/h3>\n        \u003cdiv class=\"choices\" role=\"group\" aria-labelledby=\"names-question\">\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"obey\" aria-pressed=\"false\">\n            The team should obey more consistently so the hierarchy can function.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"perform\" aria-pressed=\"false\">\n            The leader should make the name true through coordination, service, and accountability—or give it up.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"titles\" aria-pressed=\"false\">\n            Abolish titles; the problem proves that roles themselves are unethical.\n          \u003c/button>\n        \u003c/div>\n        \u003cp class=\"feedback\" id=\"names-feedback\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"synthesis\">\n      \u003ch2 id=\"synthesis\">The one-sentence synthesis\u003c/h2>\n      \u003cp class=\"synthesis\">\n        The Confucian self becomes ethical through particular, reciprocal roles;\n        \u003cspan lang=\"zh-Hans\">忠恕\u003c/span> makes those roles responsive to other people,\n        and \u003cspan lang=\"zh-Hans\">正名\u003c/span> turns role titles into standards of accountability.\n      \u003c/p>\n      \u003cp>\n        This explains both the attraction and the danger. Relationship gives ethics\n        texture, history, and motivation. Yet partial loyalty can become exclusion or\n        concealment unless duties to those outside the relationship remain visible.\n      \u003c/p>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"up-next\">\n      \u003ch2 id=\"up-next\">Up next\u003c/h2>\n      \u003carticle class=\"up-next-item\">\n        \u003ch3 id=\"session-three\">Session 3 · Moral authority and political order\u003c/h3>\n        \u003cp>\n          \u003cspan lang=\"zh-Hans\">德、为政以德\u003c/span> — can the accountability of a role\n          scale from family and classroom to government?\n        \u003c/p>\n      \u003c/article>\n    \u003c/section>\n\n    \u003cp class=\"closing\">\n      Session 2 is complete when you can defend relational duties without pretending\n      that family loyalty and public justice never conflict.\n    \u003c/p>\n  \u003c/main>\n\n  \u003cscript>\n    const completedActivities = new Set();\n\n    const feedback = {\n      testify: \"This protects equality before a rule, but it dismisses Confucius’s insight: becoming a neutral accuser can itself betray a morally important relationship.\",\n      conceal: \"Too strong. The passage praises mutual shielding, but it does not say that lying, enabling repeated harm, or abandoning the victim becomes upright.\",\n      repair: \"The strongest reconciliation: preserve the family bond while making the wrongdoer—and the family as a moral community—responsible for repair. The hard case remains: what if persuasion fails?\",\n      obey: \"This protects the name while excusing the person who holds it. Rectification begins by asking whether authority is performing the duty that justifies authority.\",\n      perform: \"Exactly. A role-name is a demand before it is a privilege: lead through service and accountability, or stop claiming the standing of a leader.\",\n      titles: \"Too quick. Confucius sees roles as structures for reciprocal responsibility. The abuse of a role calls first for holding its bearer to account, not assuming every role is empty.\"\n    };\n\n    function updateProgress() {\n      const percentage = (completedActivities.size / 3) * 100;\n      document.getElementById(\"progress-bar\").style.width = percentage + \"%\";\n    }\n\n    function markComplete(activity) {\n      completedActivities.add(activity);\n      updateProgress();\n    }\n\n    function selectRole(selectedButton) {\n      document.querySelectorAll(\".role-button\").forEach(function (button) {\n        button.setAttribute(\"aria-pressed\", \"false\");\n      });\n      selectedButton.setAttribute(\"aria-pressed\", \"true\");\n\n      document.querySelectorAll(\"[data-role-panel]\").forEach(function (panel) {\n        panel.hidden = panel.dataset.rolePanel !== selectedButton.dataset.role;\n      });\n\n      markComplete(\"roles\");\n    }\n\n    function selectAnswer(card, selectedButton) {\n      card.querySelectorAll(\".choice\").forEach(function (button) {\n        button.setAttribute(\"aria-pressed\", \"false\");\n      });\n      selectedButton.setAttribute(\"aria-pressed\", \"true\");\n      card.querySelector(\".feedback\").textContent = feedback[selectedButton.dataset.answer];\n      markComplete(card.dataset.question);\n    }\n\n    document.querySelectorAll(\".role-button\").forEach(function (button) {\n      button.addEventListener(\"click\", function () {\n        selectRole(button);\n      });\n    });\n\n    document.querySelectorAll(\".question-card\").forEach(function (card) {\n      card.querySelectorAll(\".choice\").forEach(function (button) {\n        button.addEventListener(\"click\", function () {\n          selectAnswer(card, button);\n        });\n      });\n    });\n\n    document.querySelectorAll(\".pair-button\").forEach(function (button) {\n      button.addEventListener(\"click\", function () {\n        document.querySelectorAll(\".pair-button\").forEach(function (item) {\n          item.setAttribute(\"aria-pressed\", \"false\");\n        });\n        button.setAttribute(\"aria-pressed\", \"true\");\n\n        document.querySelectorAll(\"[data-pair-panel]\").forEach(function (panel) {\n          panel.hidden = panel.dataset.pairPanel !== button.dataset.pair;\n        });\n      });\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"path":"session3.html","title":"Moral authority and political order","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"course-studio-phase\" content=\"learning\">\n  \u003cmeta name=\"course-studio-page\" content=\"lesson\">\n  \u003cmeta name=\"course-page-title\" content=\"Moral authority and political order\">\n  \u003ctitle>Moral Authority and Political Order — Confucius Reconsidered\u003c/title>\n  \u003cstyle>\n    :root {\n      color-scheme: light;\n      --paper: #f7f2e8;\n      --paper-deep: #eee5d5;\n      --ink: #2f2a24;\n      --muted: #756b5f;\n      --line: #d8cbbb;\n      --red: #963e32;\n      --red-soft: #ead7d0;\n      --green: #486457;\n      --green-soft: #e7ece5;\n      --white: #fffdf8;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      background:\n        linear-gradient(90deg, rgba(150, 62, 50, 0.045) 1px, transparent 1px),\n        var(--paper);\n      background-size: min(9vw, 88px) 100%;\n      color: var(--ink);\n      font-family: Georgia, \"Noto Serif SC\", \"Songti SC\", serif;\n      line-height: 1.68;\n    }\n\n    main {\n      width: min(100% - 40px, 66ch);\n      margin: 0 auto;\n      padding: 72px 0 88px;\n    }\n\n    .eyebrow,\n    .question-label,\n    .domain,\n    button {\n      font-family: system-ui, sans-serif;\n    }\n\n    .eyebrow {\n      margin: 0 0 18px;\n      color: var(--red);\n      font-size: 0.72rem;\n      font-weight: 700;\n      letter-spacing: 0.16em;\n      text-transform: uppercase;\n    }\n\n    h1,\n    h2,\n    h3 {\n      line-height: 1.18;\n      text-wrap: balance;\n    }\n\n    h1 {\n      max-width: 13ch;\n      margin: 0;\n      font-size: clamp(2.7rem, 9vw, 5.4rem);\n      font-weight: 500;\n      letter-spacing: -0.045em;\n    }\n\n    h1 span {\n      color: var(--red);\n      font-family: \"Noto Serif SC\", \"Songti SC\", serif;\n      font-weight: 400;\n    }\n\n    h2 {\n      margin: 0 0 18px;\n      font-size: 1.7rem;\n      font-weight: 600;\n    }\n\n    h3 {\n      font-size: 1.12rem;\n    }\n\n    .lede {\n      max-width: 58ch;\n      margin: 28px 0 0;\n      color: #4e463d;\n      font-size: 1.15rem;\n    }\n\n    .course-facts {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px 24px;\n      margin: 32px 0 0;\n      padding: 18px 0;\n      border-block: 1px solid var(--line);\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.84rem;\n    }\n\n    .course-facts strong {\n      color: var(--ink);\n      font-weight: 650;\n    }\n\n    section {\n      margin-top: 64px;\n    }\n\n    .lesson-progress {\n      height: 3px;\n      margin-bottom: 26px;\n      overflow: hidden;\n      border-radius: 2px;\n      background: var(--paper-deep);\n    }\n\n    .lesson-progress span {\n      display: block;\n      width: 0;\n      height: 100%;\n      background: var(--red);\n      transition: width 240ms ease;\n    }\n\n    .passage {\n      margin: 26px 0;\n      padding: 24px 26px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.78);\n    }\n\n    .passage blockquote {\n      margin: 0;\n      font-size: 1.2rem;\n      line-height: 1.72;\n    }\n\n    .passage figcaption {\n      margin-top: 12px;\n      color: var(--muted);\n      font-family: system-ui, sans-serif;\n      font-size: 0.8rem;\n    }\n\n    .translation {\n      margin-bottom: 0;\n      color: #554d44;\n      font-style: italic;\n    }\n\n    .comparison {\n      margin-top: 28px;\n      padding: 24px;\n      border: 1px solid var(--line);\n      border-radius: 4px;\n      background: rgba(255, 253, 248, 0.76);\n    }\n\n    .question-label {\n      margin: 0 0 7px;\n      color: var(--red);\n      font-size: 0.72rem;\n      font-weight: 750;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n    }\n\n    .comparison h3,\n    .question-card h3 {\n      margin: 0;\n    }\n\n    .mode-controls {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 10px;\n      margin-top: 18px;\n    }\n\n    .mode-button,\n    .choice,\n    .map-node {\n      border: 1px solid var(--line);\n      border-radius: 3px;\n      background: var(--white);\n      color: var(--ink);\n      cursor: pointer;\n      font: inherit;\n    }\n\n    .mode-button {\n      padding: 13px 14px;\n    }\n\n    .mode-button:hover,\n    .choice:hover,\n    .map-node:hover {\n      border-color: #a99582;\n      background: #fffaf1;\n    }\n\n    .mode-button[aria-pressed=\"true\"] {\n      border-color: var(--green);\n      background: var(--green-soft);\n      box-shadow: inset 0 -3px 0 var(--green);\n    }\n\n    .mode-panel {\n      min-height: 12em;\n      margin-top: 16px;\n      padding: 18px 20px;\n      border-left: 3px solid var(--green);\n      background: rgba(255, 253, 248, 0.64);\n    }\n\n    .mode-panel h3 {\n      margin: 0 0 7px;\n      color: var(--red);\n    }\n\n    .mode-panel p {\n      margin: 0;\n    }\n\n    .mode-panel p + p {\n      margin-top: 10px;\n    }\n\n    .note {\n      margin-top: 24px;\n      padding: 20px 22px;\n      border-left: 3px solid var(--green);\n      background: rgba(255, 253, 248, 0.65);\n    }\n\n    .note strong {\n      color: var(--green);\n    }\n\n    .question-card {\n      margin-top: 28px;\n      padding: 24px;\n      border: 1px solid var(--line);\n      border-radius: 4px;\n      background: rgba(255, 253, 248, 0.76);\n    }\n\n    .choices {\n      display: grid;\n      gap: 10px;\n      margin-top: 18px;\n    }\n\n    .choice {\n      width: 100%;\n      padding: 13px 15px;\n      line-height: 1.45;\n      text-align: left;\n    }\n\n    .choice[aria-pressed=\"true\"] {\n      border-color: var(--red);\n      box-shadow: inset 3px 0 0 var(--red);\n    }\n\n    .feedback {\n      min-height: 1.5em;\n      margin: 16px 0 0;\n      color: var(--green);\n      font-weight: 600;\n    }\n\n    .feedback:empty {\n      display: none;\n    }\n\n    .two-lenses {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 12px;\n      margin-top: 22px;\n    }\n\n    .lens {\n      padding: 20px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.64);\n    }\n\n    .lens .domain {\n      margin: 0 0 5px;\n      color: var(--muted);\n      font-size: 0.7rem;\n      font-weight: 700;\n      letter-spacing: 0.09em;\n      text-transform: uppercase;\n    }\n\n    .lens h3 {\n      margin: 0;\n      color: var(--red);\n      font-size: 1.16rem;\n    }\n\n    .lens p:last-child {\n      margin-bottom: 0;\n      font-size: 0.92rem;\n    }\n\n    .concept-map {\n      margin-top: 28px;\n      padding: 24px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 248, 0.76);\n    }\n\n    .map-route {\n      display: grid;\n      grid-template-columns: 1fr auto 1fr auto 1fr;\n      align-items: center;\n      gap: 8px;\n      margin-top: 18px;\n    }\n\n    .map-node {\n      min-height: 88px;\n      padding: 12px 10px;\n      text-align: center;\n    }\n\n    .map-node strong {\n      display: block;\n      color: var(--red);\n      font-family: Georgia, \"Noto Serif SC\", \"Songti SC\", serif;\n      font-size: 1.12rem;\n    }\n\n    .map-node span {\n      display: block;\n      margin-top: 4px;\n      color: var(--muted);\n      font-size: 0.72rem;\n    }\n\n    .map-node[aria-pressed=\"true\"] {\n      border-color: var(--green);\n      background: var(--green-soft);\n      box-shadow: inset 0 -3px 0 var(--green);\n    }\n\n    .arrow {\n      color: var(--red);\n      font-size: 1.3rem;\n    }\n\n    .map-detail {\n      min-height: 8.5em;\n      margin-top: 16px;\n      padding: 18px 20px;\n      border-left: 3px solid var(--green);\n      background: var(--green-soft);\n    }\n\n    .map-detail p {\n      margin: 0;\n    }\n\n    .map-detail strong {\n      color: var(--green);\n    }\n\n    .synthesis {\n      padding: 22px 24px;\n      border-left: 3px solid var(--red);\n      background: var(--red-soft);\n      font-size: 1.05rem;\n    }\n\n    .closing {\n      margin-top: 64px;\n      padding-top: 22px;\n      border-top: 1px solid var(--line);\n      color: var(--muted);\n      font-size: 0.93rem;\n    }\n\n    @media (max-width: 560px) {\n      main {\n        width: min(100% - 28px, 66ch);\n        padding-top: 46px;\n      }\n\n      .mode-controls,\n      .two-lenses {\n        grid-template-columns: 1fr;\n      }\n\n      .mode-panel,\n      .map-detail {\n        min-height: 0;\n      }\n\n      .map-route {\n        grid-template-columns: 1fr;\n      }\n\n      .arrow {\n        transform: rotate(90deg);\n        text-align: center;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cheader>\n      \u003cdiv class=\"lesson-progress\" aria-hidden=\"true\">\u003cspan id=\"progress-bar\">\u003c/span>\u003c/div>\n      \u003cp class=\"eyebrow\">Session 3 of 3 · about 5 minutes\u003c/p>\n      \u003ch1>Moral authority, \u003cspan>political order\u003c/span>\u003c/h1>\n      \u003cp class=\"lede\">\n        Sessions 1 and 2 moved from cultivated habits to responsible relationships.\n        Confucius now makes his largest wager: the character of those who govern can\n        shape an entire political community. Is that an alternative to law—or a\n        dangerous excuse for weak institutions?\n      \u003c/p>\n      \u003cdiv class=\"course-facts\" aria-label=\"Lesson facts\">\n        \u003cspan>\u003cstrong>Question:\u003c/strong> Can example govern better than punishment?\u003c/span>\n        \u003cspan>\u003cstrong>Text:\u003c/strong> \u003ccite>Analects\u003c/cite> 2.3\u003c/span>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection aria-labelledby=\"two-kinds-of-order\">\n      \u003ch2 id=\"two-kinds-of-order\">Two kinds of order\u003c/h2>\n      \u003cp>\n        Confucius distinguishes outward compliance from inwardly guided conduct.\n        The contrast is not “government versus no government.” It is between two\n        ways government can produce regular behavior:\n      \u003c/p>\n      \u003cfigure class=\"passage\">\n        \u003cblockquote lang=\"zh-Hans\">\n          “道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，\n          有耻且格。”\n        \u003c/blockquote>\n        \u003cfigcaption>《论语·为政》2.3\u003c/figcaption>\n        \u003cp class=\"translation\">\n          “Guide people with administrative measures and align them with punishments:\n          they will avoid penalties but lack a sense of shame. Guide them with moral\n          power and align them through ritual: they will develop ethical awareness\n          and bring themselves into order.”\n        \u003c/p>\n      \u003c/figure>\n\n      \u003cdiv class=\"comparison\">\n        \u003cp class=\"question-label\">Read the contrast from inside the citizen\u003c/p>\n        \u003ch3 id=\"government-mode-question\">\n          A rule is obeyed in both cases. What changes?\n        \u003c/h3>\n        \u003cdiv class=\"mode-controls\" role=\"group\" aria-labelledby=\"government-mode-question\">\n          \u003cbutton class=\"mode-button\" type=\"button\" data-mode=\"punishment\" aria-pressed=\"false\">\n            \u003cspan lang=\"zh-Hans\">政刑\u003c/span> · measures and penalties\n          \u003c/button>\n          \u003cbutton class=\"mode-button\" type=\"button\" data-mode=\"virtue\" aria-pressed=\"true\">\n            \u003cspan lang=\"zh-Hans\">德礼\u003c/span> · moral power and ritual\n          \u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"mode-panel\" aria-live=\"polite\">\n          \u003cdiv data-mode-panel=\"punishment\" hidden>\n            \u003ch3 id=\"punishment-order\">“How do I avoid the penalty?”\u003c/h3>\n            \u003cp>\n              Conduct is coordinated by an external threat. This can stop immediate\n              harm, but the motive disappears when enforcement disappears. The clever\n              citizen searches for the edge of the rule.\n            \u003c/p>\n            \u003cp>\u003cstrong>Strength:\u003c/strong> clear, fast, and less dependent on admiration.\u003c/p>\n          \u003c/div>\n          \u003cdiv data-mode-panel=\"virtue\">\n            \u003ch3 id=\"virtue-order\">“What response fits this situation?”\u003c/h3>\n            \u003cp>\n              A trustworthy example and shared practices train judgment. The citizen\n              does not merely calculate risk; they begin to see some conduct as\n              unworthy and regulate themselves.\n            \u003c/p>\n            \u003cp>\u003cstrong>Strength:\u003c/strong> it can still guide action when no official is watching.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003caside class=\"note\">\n        \u003cstrong>\u003cspan lang=\"zh-Hans\">德\u003c/span> is effective moral presence.\u003c/strong>\n        It is not a private stock of “goodness points.” It names character as it\n        becomes socially persuasive—credibility earned by conduct that others can\n        trust and emulate.\n      \u003c/aside>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"governing-dilemma\">\n      \u003ch2 id=\"governing-dilemma\">Put virtue under pressure\u003c/h2>\n      \u003cp>\n        Imagine you direct a university dining hall. Students repeatedly leave used\n        trays on tables, making extra work for cleaners. The hall needs a response\n        this week.\n      \u003c/p>\n\n      \u003cdiv class=\"question-card\" data-question=\"dining\">\n        \u003cp class=\"question-label\">One decision\u003c/p>\n        \u003ch3 id=\"dining-question\">\n          Which policy best preserves Confucius’s insight while answering the modern\n          demand for reliable rules?\n        \u003c/h3>\n        \u003cdiv class=\"choices\" role=\"group\" aria-labelledby=\"dining-question\">\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"fine\" aria-pressed=\"false\">\n            Install cameras and fine every student who leaves a tray. Deterrence is enough.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"example\" aria-pressed=\"false\">\n            Ask respected student leaders to return trays publicly. Example is enough.\n          \u003c/button>\n          \u003cbutton class=\"choice\" type=\"button\" data-answer=\"combined\" aria-pressed=\"false\">\n            Make responsibility visible through staff and student example, explain the burden on cleaners, and keep a clear rule for repeated refusal.\n          \u003c/button>\n        \u003c/div>\n        \u003cp class=\"feedback\" id=\"dining-feedback\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n\n      \u003cp>\n        The combined answer goes beyond the stark contrast in 2.3. It treats law as\n        a floor that protects people from persistent harm, while treating example,\n        explanation, and shared practice as the means by which a community learns\n        to act without constant surveillance.\n      \u003c/p>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"strongest-objection\">\n      \u003ch2 id=\"strongest-objection\">The strongest modern objection\u003c/h2>\n      \u003cp>\n        Read charitably, \u003cspan lang=\"zh-Hans\">为政以德\u003c/span> does not mean “trust any\n        leader who calls himself virtuous.” Sessions 1 and 2 supplied demanding\n        standards: the ruler must practice, accept correction, and make the name\n        “ruler” answerable to public responsibility. Moral authority must be earned.\n      \u003c/p>\n\n      \u003cdiv class=\"two-lenses\">\n        \u003carticle class=\"lens\">\n          \u003cp class=\"domain\">Confucius’s insight\u003c/p>\n          \u003ch3 id=\"institutions-have-people\">Institutions still contain people\u003c/h3>\n          \u003cp>\n            No rule interprets or enforces itself. Officials with cultivated judgment\n            can apply rules humanely, resist corruption, and create trust that force\n            alone cannot manufacture.\n          \u003c/p>\n        \u003c/article>\n        \u003carticle class=\"lens\">\n          \u003cp class=\"domain\">Modern reply\u003c/p>\n          \u003ch3 id=\"virtue-needs-constraints\">Virtue cannot audit itself\u003c/h3>\n          \u003cp>\n            Citizens should not have to rely on a ruler’s self-assessment. Public\n            rules, independent review, and channels for criticism protect them when\n            leaders are incompetent, biased, or merely performing virtue.\n          \u003c/p>\n        \u003c/article>\n      \u003c/div>\n\n      \u003cp class=\"synthesis\">\n        The strongest reconstruction is not \u003cstrong>virtue instead of institutions\u003c/strong>,\n        but \u003cstrong>virtue within institutions that constrain, test, and outlast the ruler\u003c/strong>.\n        That is partly a modern extension of Confucius, not a formula found ready-made\n        in the \u003ccite>Analects\u003c/cite>.\n      \u003c/p>\n\n      \u003caside class=\"note\">\n        \u003cstrong>Education is the political infrastructure.\u003c/strong>\n        \u003cspan lang=\"zh-Hans\">“有教无类”\u003c/span>—“in education, there should be no fixed\n        social categories” (\u003ccite>Analects\u003c/cite> 15.39)—points beyond inherited rank.\n        Yet later examination systems, state orthodoxies, and family hierarchies are\n        historical Confucian developments; they should not all be projected backward\n        into Confucius’s own brief, argumentative text.\n      \u003c/aside>\n    \u003c/section>\n\n    \u003csection aria-labelledby=\"whole-system\">\n      \u003ch2 id=\"whole-system\">Assemble the whole system\u003c/h2>\n      \u003cp>\n        The three sessions form a scale, not three separate topics. Select each level\n        to see what it contributes—and what failure it can produce.\n      \u003c/p>\n\n      \u003cdiv class=\"concept-map\">\n        \u003cp class=\"question-label\">Course map\u003c/p>\n        \u003ch3 id=\"map-question\">From practiced person to political order\u003c/h3>\n        \u003cdiv class=\"map-route\" role=\"group\" aria-labelledby=\"map-question\">\n          \u003cbutton class=\"map-node\" type=\"button\" d
